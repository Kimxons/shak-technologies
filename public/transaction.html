  <div class="container-fluid py-3">
    <div class="row g-3">
      <aside class="col-12 col-lg-3" aria-label="Sidebar">
        <div class="card">
          <div class="card-header">Transaction</div>
          <div class="list-group list-group-flush">
            <button id="menu-forex" type="button" class="list-group-item list-group-item-action">
              Forex-Bureau de exchange
            </button>
            <button id="menu-cash-transaction" type="button" class="list-group-item list-group-item-action">
              Cash Transaction
            </button>
            <button id="menu-charge-collection" type="button" class="list-group-item list-group-item-action">
              Charge Collection
            </button>
            <button id="menu-on-demand-charges" type="button" class="list-group-item list-group-item-action">
              On-Demand Adhoc Charges
            </button>
            <button id="menu-money-transfer" type="button" class="list-group-item list-group-item-action">
              Money Transfer
            </button>
            <button id="menu-transfer-transactions" type="button" class="list-group-item list-group-item-action">
              Transfer Transactions
            </button>
            <button id="menu-cpo-realization" type="button" class="list-group-item list-group-item-action">
              CPO Realization / Cancellation
            </button>
            <button id="menu-cash-payment-order" type="button" class="list-group-item list-group-item-action">
              Cash Payment Order
            </button>
            <button id="menu-charge-exemption" type="button" class="list-group-item list-group-item-action">
              Charge Exemption
            </button>
          </div>
        </div>
      </aside>

      <main class="col-12 col-lg-9" aria-label="Main Content">
        <div id="content" class="card">
          <div class="card-body">
            <p class="mb-0">Select a menu item.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>

    const menuForexEl = document.getElementById('menu-forex');
    const menuCashTransactionEl = document.getElementById('menu-cash-transaction');
    const menuChargeCollectionEl = document.getElementById('menu-charge-collection');
    const menuOnDemandChargesEl = document.getElementById('menu-on-demand-charges');
    const menuMoneyTransferEl = document.getElementById('menu-money-transfer');
    const menuTransferTransactionsEl = document.getElementById('menu-transfer-transactions');
    const menuCPORealizationEl = document.getElementById('menu-cpo-realization');
    const menuCashPaymentOrderEl = document.getElementById('menu-cash-payment-order');
    const menuChargeExemptionEl = document.getElementById('menu-charge-exemption');

    function setActive(activeButton) {
      document.querySelectorAll('.list-group-item-action').forEach((btn) => {
        btn.classList.toggle('active', btn === activeButton);
        btn.setAttribute('aria-current', btn === activeButton ? 'page' : 'false');
      });
    }

    async function loadForexBureauDeChange() {
      setActive(menuForexEl);

      contentEl.innerHTML =
        '<div class="card-body">' +
        '<div class="d-flex align-items-center justify-content-between">' +
        '<h2 class="h6 mb-0">Loading...</h2>' +
        '</div>' +
        '</div>';

      try {
        const response = await fetch('modules/transaction/forex-bureau-de-change/forex-bureau-de-change.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('Failed to load screen');

        const htmlText = await response.text();
        const parsed = new DOMParser().parseFromString(htmlText, 'text/html');

        // Keep it UI-only: strip any scripts from the loaded document.
        parsed.querySelectorAll('script').forEach((s) => s.remove());

        const mainContent = parsed.querySelector('.container-fluid') || parsed.body;

        // Replace the content area with the loaded screen body.
        contentEl.className = ''; // remove the default card styling to avoid double cards
        contentEl.replaceChildren();

        const fragment = document.createDocumentFragment();
        Array.from(mainContent.childNodes).forEach((node) => {
          fragment.appendChild(document.importNode(node, true));
        });

        contentEl.appendChild(fragment);
        document.title = 'Forex - Bureau De Change';
      } catch (error) {
        contentEl.className = 'card';
        contentEl.innerHTML =
          '<div class="card-body">' +
          '<div class="alert alert-danger mb-0" role="alert">' +
          'Could not load Forex-Bureau de exchange screen.' +
          '</div>' +
          '</div>';
      }
    }
