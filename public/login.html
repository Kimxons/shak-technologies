<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIMBLE 1.0 · Sign in</title>
  <link rel="stylesheet" href="fonts/montserrat/montserrat.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <!-- Global Theme Manager - Load before any scripts -->
  <script src="assets/js/theme-manager.js"></script>
</head>

<body data-page="login" class="auth-page">
  <main class="authBackground">
    <div class="container auth-container">
      <div class="row auth-main justify-content-center">
        <div class="col-12">
          <div class="form-box mx-auto">
            <div class="auth-wrapper text-center">
              <div class="mb-4">
                <img src="assets/images/silvicon.png" class="brand-logo" alt="Craft Silicon" />
              </div>
              <h2 class="brand-title">NIMBLE 1.0</h2>
              <h3 class="brand-subtitle">Sign in</h3>

              <form id="loginForm" class="validate-form mt-4" novalidate>
                <div class="mb-3">
                  <label class="form-label text-start w-100" for="operatorId">Operator ID</label>
                  <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="operatorId" name="operatorId"
                      placeholder="Enter Operator ID" required />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label text-start w-100" for="password">Password</label>
                  <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                      placeholder="Enter Password" required />
                    <button type="button" class="btn btn-link show-pwd-icon" data-toggle-password="password"
                      aria-label="Toggle password visibility">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label text-start w-100" for="branch">Branch</label>
                  <select class="form-select form-select-lg" id="branch" name="branchId" required>
                    <option value="" disabled selected>Select a branch</option>
                    <option value="0101">Head Office (0101)</option>
                    <option value="0102">Head Office IFRS (0102)</option>
                    <option value="0103">Regional Office (0103)</option>
                    <option value="0104">IBO (0104)</option>
                    <option value="0105">Digital Banking Operation (0105)</option>
                    <option value="0201">Fenoteselam District (0201)</option>
                    <option value="2305">Legehar (2305)</option>
                    <option value="0202">Zenbaba (0202)</option>
                    <option value="0203">Meshenti (0203)</option>
                    <option value="0204">Wojet (0204)</option>
                    <option value="0205">Addiet (0205)</option>
                    <option value="0206">TisAbay (0206)</option>
                    <option value="0207">Merawi (0207)</option>
                    <option value="0208">Wotet Abay (0208)</option>
                    <option value="0209">Durbetie (0209)</option>
                    <option value="0210">Yismala (0210)</option>
                    <option value="0211">Finote-selam (0211)</option>
                    <option value="0212">Burie (0212)</option>
                    <option value="0213">Sekela (0213)</option>
                    <option value="0214">Gebeze Mariam (0214)</option>
                    <option value="0603">Sana (0603)</option>
                    <option value="0216">Feresbet (0216)</option>
                  </select>
                </div>

                <div id="loginFeedback" class="alert alert-danger d-none" role="alert"></div>

                <button type="submit" class="btn dark-blue-button auth-form-btn w-100" aria-live="polite">Login</button>
              </form>

              <div class="badge badge-solid-blue mt-4 bg-transparent text-primary">
                <a href="#" class="text-decoration-none fw-semibold">Forgot Password?</a>
              </div>

              <p class="login-footer mt-5 text-muted small">
                Powered by <span class="fw-bold">Craft Silicon</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Environment Configuration -->
  <script src="assets/js/environment.js"></script>
  <!-- Auth Services -->
  <script src="assets/js/auth/auth.config.js"></script>
  <script src="assets/js/auth/auth.service.js"></script>
  <!-- Main App -->
  <script src="assets/js/app.js?v=20260114-11"></script>
  <script>
    // Simple password toggle logic
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("[data-toggle-password]").forEach(function (button) {
        button.addEventListener("click", function () {
          const targetId = button.getAttribute("data-toggle-password");
          const input = document.getElementById(targetId);
          if (!input) return;
          const isMasked = input.type === "password";
          input.type = isMasked ? "text" : "password";
          const icon = button.querySelector("i");
          if (icon) {
            icon.classList.toggle("bi-eye");
            icon.classList.toggle("bi-eye-slash");
          }
        });
      });
    });
  </script>
</body>

</html>
