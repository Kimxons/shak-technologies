<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product GL Interface</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260203" />
</head>
<body>
  <div class="window">
    <!-- Title Bar -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-diagram-3 am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Product GL Interface</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
      <div class="form-content" role="region" aria-label="Product GL Interface form">
        <div class="form-card" data-main-form>
          <!-- GL Interface Section -->
          <div class="form-section" data-section="gl-interface">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-diagram-3"></i>GL Account Mapping</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle GL Account Mapping" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <form id="pgi-form" autocomplete="off">
                <!-- Row 1: Account Tag & Account ID -->
                <div class="row g-3 mb-3">
                  <div class="col-6">
                    <label class="label-blue" for="AccountTag">Account Tag</label>
                    <select id="AccountTag" name="AccountTag" class="bs-select" data-always-enabled>
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <div class="d-flex flex-column gap-2">
                      <label class="label-blue">Account ID</label>
                      <div class="d-flex gap-2">
                        <input id="AccountId" name="AccountId" type="text" class="bs-input-text form-control" placeholder="Account ID" data-always-enabled />
                        <button class="btn-lookup" type="button" data-pgi-action="search-account" title="Search Account" aria-label="Search Account" data-always-enabled><i class="bi bi-search"></i></button>
                        <button class="btn-lookup" type="button" data-pgi-action="account-tools" title="Account Tools" aria-label="Account Tools" data-always-enabled><i class="bi bi-tools"></i></button>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Grid Toolbar -->
                <div class="d-flex gap-2 mb-2">
                  <button type="button" class="btn btn-sm btn-outline-primary" data-pgi-action="alter" disabled>Alter</button>
                  <button type="button" class="btn btn-sm btn-outline-danger" data-pgi-action="remove" disabled>Remove</button>
                  <button type="button" class="btn btn-sm btn-outline-success" data-pgi-action="update-row" disabled>Update</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary" data-pgi-action="clear" disabled>Clear</button>
                </div>

                <!-- GL Accounts Grid -->
                <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
                  <table class="table table-sm table-hover align-middle mb-0" aria-label="GL interface mappings">
                    <thead class="table-light sticky-top">
                      <tr>
                        <th scope="col">Account Tag</th>
                        <th scope="col">Account ID</th>
                        <th scope="col">Account Name</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr><td colspan="3" class="text-muted py-2">No records to display.</td></tr>
                    </tbody>
                  </table>
                </div>
              </form>
            </div>
          </div>

          <!-- Behind the Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="CreatedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="CreatedOn">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="ModifiedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="ModifiedOn">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="SupervisedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="SupervisedOn">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-action="view" title="View">
            <i class="bi bi-eye"></i>View
          </button>
          <button class="btn-action" type="button" data-action="add" data-shell-mode="Add" data-pgi-action="add" title="Add New">
            <i class="bi bi-plus-circle"></i>Add
          </button>
          <button class="btn-action" type="button" data-action="edit" data-shell-mode="Update" data-pgi-action="edit" title="Edit">
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button class="btn-action" type="button" data-action="save" data-pgi-action="save" title="Save" disabled>
            <i class="bi bi-check-lg"></i>Save
          </button>
          <button class="btn-action" type="button" data-action="delete" data-pgi-action="delete" title="Delete">
            <i class="bi bi-trash3"></i>Delete
          </button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel" data-pgi-action="cancel" title="Cancel" disabled>
            <i class="bi bi-x-lg"></i>Cancel
          </button>
          <button class="btn-action" type="button" data-action="close" data-pgi-action="back" title="Close">
            <i class="bi bi-box-arrow-right"></i>Close
          </button>
        </div>
      </div>
    </main>

    <!-- Message Panel -->
    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading GL Interface...</span>
      </div>
    </div>
  </div>

  <!-- Toast notification (hidden) -->
  <div id="pgiToast" class="alert d-none position-fixed bottom-0 start-50 translate-middle-x mb-3" role="status" aria-live="polite" style="z-index: 1050;"></div>

  <!-- Service Scripts -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/pages/product/product-gl-interface.js"></script>

  <!-- Window Controls & Behavior -->
  <script>
    (function() {
      /**
       * Send message to parent when form opens
       */
      function notifyParentFormOpened() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleOpened',
              source: 'Product GL Interface'
            }, '*');
          }
        } catch (error) {
          console.error('Error notifying parent of form open:', error);
        }
      }

      /**
       * Close the child form by notifying parent
       */
      function closeChildForm() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleClosed',
              source: 'Product GL Interface'
            }, '*');
            // Also try the closeChildForm method
            if (typeof window.parent.closeChildForm === 'function') {
              window.parent.closeChildForm();
            }
          } else {
            window.close();
          }
        } catch (error) {
          console.error('Error closing form:', error);
        }
      }

      /**
       * Handle window control actions
       */
      function handleWindowAction(action, btn) {
        const windowEl = document.querySelector('.window');
        
        switch (action) {
          case 'refresh':
            document.querySelectorAll('[class*="invalid"]').forEach(el => {
              el.classList.remove(...Array.from(el.classList).filter(c => c.includes('invalid')));
            });
            window.location.reload();
            break;

          case 'maximize':
            if (windowEl) {
              const isMaximized = windowEl.classList.toggle('maximized');
              const icon = btn.querySelector('i');
              if (icon) {
                icon.className = isMaximized ? 'bi bi-fullscreen-exit' : 'bi bi-square';
              }
              btn.title = isMaximized ? 'Restore' : 'Maximize';
              btn.setAttribute('aria-label', isMaximized ? 'Restore window' : 'Maximize window');
              
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ 
                  action: 'toggleSidebarForMaximize',
                  maximize: isMaximized
                }, '*');
              }
            }
            break;

          case 'close':
            closeChildForm();
            break;
        }
      }

      /**
       * Initialize window control buttons
       */
      function initWindowControls() {
        document.querySelectorAll('.de-title-btn[data-action]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const action = btn.getAttribute('data-action');
            handleWindowAction(action, btn);
          });
        });

        // Also wire up the Close button in action panel
        const closeBtn = document.querySelector('[data-action="close"]:not(.de-title-btn)');
        if (closeBtn) {
          closeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            closeChildForm();
          });
        }
      }

      /**
       * Initialize collapsible sections
       */
      function initCollapsibleSections() {
        document.querySelectorAll('.form-section[data-section]').forEach(section => {
          const header = section.querySelector('[data-section-toggle]');
          const toggleBtn = section.querySelector('.section-toggle-btn');

          if (!header) return;

          header.addEventListener('click', function(e) {
            if (e.target.closest('button') && !e.target.closest('.section-toggle-btn')) return;
            if (e.target.closest('input[type="checkbox"]') || e.target.closest('label[for]')) return;

            const isCollapsed = section.classList.contains('collapsed');

            if (isCollapsed) {
              section.classList.remove('collapsed');
              if (toggleBtn) {
                toggleBtn.setAttribute('aria-expanded', 'true');
                const icon = toggleBtn.querySelector('i');
                if (icon) icon.className = 'bi bi-chevron-up';
              }
            } else {
              section.classList.add('collapsed');
              if (toggleBtn) {
                toggleBtn.setAttribute('aria-expanded', 'false');
                const icon = toggleBtn.querySelector('i');
                if (icon) icon.className = 'bi bi-chevron-down';
              }
            }
          });
        });
      }

      // Initialize on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          initWindowControls();
          initCollapsibleSections();
          notifyParentFormOpened();
        });
      } else {
        initWindowControls();
        initCollapsibleSections();
        notifyParentFormOpened();
      }
    })();
  </script>
</body>
</html>
