<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Documents</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260203" />
</head>
<body>
  <div class="window">
    <!-- Title Bar -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-file-earmark-text am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Product Documents</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
      <div class="form-content" role="region" aria-label="Product Documents form">
        <div class="form-card" data-main-form>
          <!-- Documents Section -->
          <div class="form-section" data-section="documents">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-file-earmark-text"></i>Document Requirements</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Document Requirements" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <form id="pd-form" autocomplete="off">
                <!-- Documents Grid -->
                <div class="table-responsive" style="max-height: 350px; overflow-y: auto;">
                  <table class="table table-sm table-hover align-middle mb-0" aria-label="Product documents list" aria-describedby="pdGridHelp">
                    <thead class="table-light sticky-top">
                      <tr>
                        <th scope="col" style="width: 50px;">#</th>
                        <th scope="col">Description</th>
                        <th scope="col" style="width: 120px;">Is Applicable</th>
                        <th scope="col" style="width: 120px;">Is Mandatory</th>
                      </tr>
                    </thead>
                    <tbody data-pd-grid-body>
                      <tr><td colspan="4" class="text-muted py-2">No documents to display.</td></tr>
                    </tbody>
                  </table>
                </div>
                <p id="pdGridHelp" class="visually-hidden">Product documents list. Use Edit to enable changes.</p>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-action="view" title="View">
            <i class="bi bi-eye"></i>View
          </button>
          <button class="btn-action" type="button" data-action="edit" data-pd-action="edit" title="Edit">
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button class="btn-action" type="button" data-action="save" data-pd-action="save" title="Save" disabled>
            <i class="bi bi-check-lg"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel" data-pd-action="cancel" title="Cancel" disabled>
            <i class="bi bi-x-lg"></i>Cancel
          </button>
          <button class="btn-action" type="button" data-action="close" data-pd-action="back" title="Close">
            <i class="bi bi-box-arrow-right"></i>Close
          </button>
        </div>
      </div>
    </main>

    <!-- Message Panel -->
    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading Documents...</span>
      </div>
    </div>
  </div>

  <!-- Toast notification (hidden) -->
  <div id="pdToast" class="alert d-none position-fixed bottom-0 start-50 translate-middle-x mb-3" role="status" aria-live="polite" style="z-index: 1050;"></div>

  <!-- Service Scripts -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/pages/product/product-documents.js"></script>

  <!-- Window Controls & Behavior -->
  <script>
    (function() {
      /**
       * Send message to parent when form opens
       */
      function notifyParentFormOpened() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleOpened',
              source: 'Product Documents'
            }, '*');
          }
        } catch (error) {
          console.error('Error notifying parent of form open:', error);
        }
      }

      /**
       * Close the child form by notifying parent
       */
      function closeChildForm() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleClosed',
              source: 'Product Documents'
            }, '*');
            if (typeof window.parent.closeChildForm === 'function') {
              window.parent.closeChildForm();
            }
          } else {
            window.close();
          }
        } catch (error) {
          console.error('Error closing form:', error);
        }
      }

      /**
       * Handle window control actions
       */
      function handleWindowAction(action, btn) {
        const windowEl = document.querySelector('.window');
        
        switch (action) {
          case 'refresh':
            document.querySelectorAll('[class*="invalid"]').forEach(el => {
              el.classList.remove(...Array.from(el.classList).filter(c => c.includes('invalid')));
            });
            window.location.reload();
            break;

          case 'maximize':
            if (windowEl) {
              const isMaximized = windowEl.classList.toggle('maximized');
              const icon = btn.querySelector('i');
              if (icon) {
                icon.className = isMaximized ? 'bi bi-fullscreen-exit' : 'bi bi-square';
              }
              btn.title = isMaximized ? 'Restore' : 'Maximize';
              btn.setAttribute('aria-label', isMaximized ? 'Restore window' : 'Maximize window');
              
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ 
                  action: 'toggleSidebarForMaximize',
                  maximize: isMaximized
                }, '*');
              }
            }
            break;

          case 'close':
            closeChildForm();
            break;
        }
      }

      /**
       * Initialize window control buttons
       */
      function initWindowControls() {
        document.querySelectorAll('.de-title-btn[data-action]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const action = btn.getAttribute('data-action');
            handleWindowAction(action, btn);
          });
        });

        // Also wire up the Close button in action panel
        const closeBtn = document.querySelector('[data-action="close"]:not(.de-title-btn)');
        if (closeBtn) {
          closeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            closeChildForm();
          });
        }
      }

      /**
       * Initialize collapsible sections
       */
      function initCollapsibleSections() {
        document.querySelectorAll('.form-section[data-section]').forEach(section => {
          const header = section.querySelector('[data-section-toggle]');
          const toggleBtn = section.querySelector('.section-toggle-btn');

          if (!header) return;

          header.addEventListener('click', function(e) {
            if (e.target.closest('button') && !e.target.closest('.section-toggle-btn')) return;
            if (e.target.closest('input[type="checkbox"]') || e.target.closest('label[for]')) return;

            const isCollapsed = section.classList.contains('collapsed');

            if (isCollapsed) {
              section.classList.remove('collapsed');
              if (toggleBtn) {
                toggleBtn.setAttribute('aria-expanded', 'true');
                const icon = toggleBtn.querySelector('i');
                if (icon) icon.className = 'bi bi-chevron-up';
              }
            } else {
              section.classList.add('collapsed');
              if (toggleBtn) {
                toggleBtn.setAttribute('aria-expanded', 'false');
                const icon = toggleBtn.querySelector('i');
                if (icon) icon.className = 'bi bi-chevron-down';
              }
            }
          });
        });
      }

      // Initialize on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          initWindowControls();
          initCollapsibleSections();
          notifyParentFormOpened();
        });
      } else {
        initWindowControls();
        initCollapsibleSections();
        notifyParentFormOpened();
      }
    })();
  </script>
</body>
</html>
