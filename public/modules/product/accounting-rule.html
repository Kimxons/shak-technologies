<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Rule · Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/maincss.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <style>
        /* Add inline styles for scrollbar control */
        .window {
            overflow: hidden !important;
            height: 100vh;
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 40px); /* Adjust based on header height */
            overflow: hidden;
        }
        
        .sidebar {
            height: 100%;
            overflow-y: auto;
        }
        
        .form-content {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .action-panel {
            height: 100%;
            overflow-y: auto;
        }
        
        /* Remove scroll from body and html */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }
    </style>
</head>
<body data-page="accounting-rule">
    <!-- React Orbs -->
    <div class="cm-react-orbs" aria-hidden="true">
        <span class="cm-react-orb cm-react-orb--primary"></span>
        <span class="cm-react-orb cm-react-orb--secondary"></span>
        <span class="cm-react-orb cm-react-orb--accent"></span>
    </div>

    <div class="window">
        <!-- Header -->
        <div class="am-header" role="banner" aria-label="Window title bar">
            <!-- Header content removed as per original -->
        </div>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Sidebar Navigation -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-header__title">
                        <i class="bi bi-grid-3x3-gap"></i>
                        <span>SUBMODULES</span>
                    </span>
                    <button type="button" class="sidebar-toggle" aria-label="Toggle sidebar">
                        <i class="bi bi-list"></i>
                    </button>
                </div>

                <div class="sidebar-search">
                    <i class="bi bi-search sidebar-search__icon"></i>
                    <input type="text" class="sidebar-search__input" placeholder="Search submodules..." />
                </div>

                <div class="sidebar-content">
                    <!-- Data Entry Section -->
                    <div class="nav-section--card expanded" data-nav-section>
                        <div class="nav-header--card" data-tooltip="Data Entry">
                            <div class="nav-header__content">
                                <i class="bi bi-pencil-square nav-header__icon"></i>
                                <span class="nav-label--card">Data Entry</span>
                            </div>
                            <div class="nav-header__badge">
                                <span class="nav-badge">1</span>
                                <button type="button" class="nav-arrow--card" aria-label="Toggle Data Entry" aria-expanded="true">
                                    <i class="bi bi-chevron-down"></i>
                                </button>
                            </div>
                        </div>
                        <div class="nav-items--card" id="nav-dataentry">
                            <div class="sidebar-item--enhanced" data-child-form="rule-details" data-open-rule-details>
                                <div class="sidebar-item__content">
                                    <i class="bi bi-list-check sidebar-item__icon"></i>
                                    <div class="sidebar-item__text">
                                        <span class="sidebar-item__title">Rule Details</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <!-- Accounting Rule Search -->
                    <div class="form-section" data-section="accounting-rule-search">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title">
                                <i class="bi bi-search me-2"></i>
                                Accounting Rule Search
                            </span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Accounting Rule Search" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue" for="AccountingRuleId">Accounting Rule ID</label>
                                    <div class="input-with-lookup">
                                        <input type="text" class="bs-input" id="AccountingRuleId" name="AccountingRuleId" 
                                               placeholder="Enter rule ID" />
                                        <button class="btn-lookup" type="button" aria-label="Search rule" data-ar-action="search">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="ProductTypes">Product Types</label>
                                    <select class="bs-select" id="ProductTypes" name="ProductTypes">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Accounting Rule Details -->
                    <div class="form-section" data-section="accounting-rule-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title">
                                <i class="bi bi-gear me-2"></i>
                                Accounting Rule Details
                            </span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Accounting Rule Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="Description">Description</label>
                                    <textarea class="bs-input" id="Description" name="Description" rows="2"
                                              placeholder="Enter rule description"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Applicable Events -->
                    <div class="form-section" data-section="applicable-events">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title">
                                <i class="bi bi-calendar-event me-2"></i>
                                Applicable Events
                            </span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Applicable Events" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table class="table table-sm table-hover mb-0" id="applicableEventsTable">
                                    <thead>
                                        <tr>
                                            <th scope="col">Event ID</th>
                                            <th scope="col">Description</th>
                                            <th scope="col" style="width: 15%;">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="ApplicableEventsBody">
                                        <tr data-empty-row>
                                            <td colspan="3" class="text-center py-4 text-muted">
                                                <i class="bi bi-inbox display-6 d-block mb-2"></i>
                                                <small>No records to display</small>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Behind The Scene -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title">
                                <i class="bi bi-info-circle me-2"></i>
                                Behind The Scene
                            </span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="audit-section audit-section--summary">
                                <div class="audit-cell">
                                    <span class="audit-label">Created By</span>
                                    <input type="text" class="form-control" id="CreatedBy" data-field="createdBy" readonly>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified By</span>
                                    <input type="text" class="form-control" id="ModifiedBy" data-field="modifiedBy" readonly>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised By</span>
                                    <input type="text" class="form-control" id="SupervisedBy" data-field="supervisedBy" readonly>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Created On</span>
                                    <input type="text" class="form-control" id="CreatedOn" data-field="createdOn" readonly>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified On</span>
                                    <input type="text" class="form-control" id="ModifiedOn" data-field="modifiedOn" readonly>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised On</span>
                                    <input type="text" class="form-control" id="SupervisedOn" data-field="supervisedOn" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Panel -->
            <div class="action-panel" aria-label="Form actions">
                <!-- Navigation Groups -->
                <div class="nav-group">
                    <button type="button" class="btn-nav" aria-label="Previous Rule">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <span>Accounting Rule</span>
                    <button type="button" class="btn-nav" aria-label="Next Rule">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-view" data-shell-mode="View" data-ar-action="view">
                        <i class="bi bi-eye"></i>View
                    </button>
                    <button type="button" class="btn-action" data-shell-mode="Add">
                        <i class="bi bi-plus-circle"></i>Add
                    </button>
                    <button type="button" class="btn-action" data-shell-mode="Update">
                        <i class="bi bi-pencil-square"></i>Edit
                    </button>
                    <button type="button" class="btn-action btn-delete" data-ar-action="delete">
                        <i class="bi bi-trash"></i>Delete
                    </button>
                    <hr class="my-2">
                    <button type="button" class="btn-action btn-primary" data-ar-action="save">
                        <i class="bi bi-floppy"></i>Save
                    </button>
                    <button type="button" class="btn-action btn-cancel" data-ar-action="cancel">
                        <i class="bi bi-x-circle"></i>Cancel
                    </button>
                </div>
            </div>

            <!-- Child Form Overlay -->
            <div class="child-overlay" data-child-overlay aria-hidden="true">
                <div class="child-frame" role="dialog" aria-modal="true" aria-label="Rule Details">
                    <iframe id="ruleDetailsFrame" class="child-iframe" data-child-iframe title="Rule Details"></iframe>
                </div>
            </div>
        </div>

        <!-- Message Panel -->
        <div class="am-message-panel" id="messagePanel" hidden></div>

        <!-- Toast notifications -->
        <div id="formToast" class="toast align-items-center text-bg-success border-0 position-fixed bottom-0 end-0 m-4 d-none"
             role="alert" aria-live="assertive" aria-atomic="true" style="z-index: 9999; min-width: 260px;">
            <div class="d-flex">
                <div class="toast-body" id="formToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/auth/auth.config.js"></script>
    <script src="../../assets/js/auth/auth.service.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../../assets/js/utils/global-utils.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/pages/product/accounting-rule.js"></script>
    <script>
        console.warn('=== Accounting Rule Script Starting ===');
        
        // Section toggle functionality
        document.querySelectorAll('[data-section-toggle]').forEach(header => {
            header.addEventListener('click', (e) => {
                if (e.target.type === 'checkbox') return;
                
                const section = header.closest('.form-section');
                const toggleBtn = header.querySelector('.section-toggle-btn');
                const content = section.querySelector('[data-section-content]');
                const isCollapsed = section.classList.toggle('collapsed');
                
                if (toggleBtn) {
                    toggleBtn.setAttribute('aria-expanded', !isCollapsed);
                    const icon = toggleBtn.querySelector('i');
                    icon.className = isCollapsed ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
                }
                
                if (content) {
                    if (isCollapsed) {
                        content.style.display = 'none';
                    } else {
                        content.style.display = 'block';
                    }
                }
            });
        });

        // Sidebar nav section toggle
        document.querySelectorAll('.nav-header--card').forEach(header => {
            header.addEventListener('click', () => {
                const section = header.closest('.nav-section--card');
                const arrow = header.querySelector('.nav-arrow--card');
                const navItems = section.querySelector('.nav-items--card');
                const isExpanded = section.classList.toggle('expanded');
                
                if (arrow) {
                    arrow.setAttribute('aria-expanded', isExpanded);
                    const icon = arrow.querySelector('i');
                    icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-right';
                }
                
                if (navItems) {
                    if (isExpanded) {
                        navItems.removeAttribute('hidden');
                        navItems.classList.add('is-visible');
                    } else {
                        navItems.classList.remove('is-visible');
                        setTimeout(() => navItems.setAttribute('hidden', ''), 300);
                    }
                }
            });
        });

        // Rule Details click handler
        document.querySelectorAll('[data-open-rule-details]').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                document.querySelectorAll('.sidebar-item--enhanced').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                handleRuleDetailsClick();
            });
        });

        function handleRuleDetailsClick() {
            const ruleId = document.getElementById('AccountingRuleId').value;
            const productTypeSelect = document.getElementById('ProductTypes');
            const productType = productTypeSelect?.value || '';
            const productTypeText = productTypeSelect?.options[productTypeSelect.selectedIndex]?.text || '';
            
            if (!ruleId) {
                alert('Please enter an Accounting Rule ID first');
                return;
            }
            
            const requestData = {
                RequestID: 'dbo.p_GetRuleDetails',
                FormId: 'dbo.p_GetRuleDetails',
                RequestData: {
                    OurBranchID: '0101',
                    BankID: '00',
                    AccountingRuleId: ruleId,
                    ProductType: productType,
                    ProductTypeDescription: productTypeText,
                    OperatorID: 'ADMIN'
                },
                RequestTime: new Date().toLocaleString(),
                AppName: 'PROJECT_KAIRO',
                Checksum: ''
            };
            
            window.childFormRequestData = requestData;
            openChildForm('rule-details');
        }

        function openChildForm(childKey) {
            const CHILD_FORMS = {
                'rule-details': '../data-entry/rule-details.html'
            };
            
            const path = CHILD_FORMS[childKey];
            const overlay = document.querySelector('[data-child-overlay]');
            const iframe = document.querySelector('[data-child-iframe]');
            
            if (!path || !iframe) {
                console.error('Path or iframe not found');
                return;
            }
            
            iframe.src = path;
            overlay.classList.add('is-open');
            overlay.setAttribute('aria-hidden', 'false');
            
            // Prevent body scroll when child form is open
            document.body.style.overflow = 'hidden';
            
            setTimeout(() => {
                try {
                    iframe.contentWindow.postMessage({
                        type: 'init',
                        data: window.childFormRequestData
                    }, '*');
                } catch (error) {
                    console.error('Error sending postMessage:', error);
                }
            }, 500);
        }

        // Listen for child form close messages
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'submoduleClosed') {
                const overlay = document.querySelector('[data-child-overlay]');
                const iframe = document.querySelector('[data-child-iframe]');
                
                if (overlay) {
                    overlay.classList.remove('is-open');
                    overlay.setAttribute('aria-hidden', 'true');
                }
                if (iframe) {
                    iframe.src = '';
                }
                
                // Restore body scroll
                document.body.style.overflow = '';
                
                document.querySelectorAll('.sidebar-item--enhanced').forEach(i => i.classList.remove('active'));
            }
        });

        // Sidebar toggle (hamburger menu)
        const sidebarToggle = document.querySelector('.sidebar-toggle');
        const sidebar = document.querySelector('.sidebar');
        
        if (sidebarToggle && sidebar) {
            sidebarToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isCollapsed = sidebar.classList.toggle('collapsed');
                sidebarToggle.setAttribute('aria-expanded', !isCollapsed);
                const icon = sidebarToggle.querySelector('i');
                icon.className = isCollapsed ? 'bi bi-list' : 'bi bi-x-lg';
            });
        }

        // Action button handlers
        document.querySelectorAll('[data-ar-action]').forEach(btn => {
            const action = btn.getAttribute('data-ar-action');
            btn.addEventListener('click', () => {
                console.log('Action triggered:', action);
                // Implement action logic here
            });
        });

        // Initialize form sections on load
        function initializeFormSections() {
            document.querySelectorAll('.form-section').forEach(section => {
                const toggleBtn = section.querySelector('.section-toggle-btn');
                const content = section.querySelector('[data-section-content]');
                
                if (toggleBtn && content) {
                    const isCollapsed = section.classList.contains('collapsed');
                    toggleBtn.setAttribute('aria-expanded', !isCollapsed);
                    
                    if (isCollapsed) {
                        content.style.display = 'none';
                    }
                }
            });
            
            // Set initial heights for scroll areas
            const header = document.querySelector('.am-header');
            const headerHeight = header ? header.offsetHeight : 40;
            const mainContainer = document.querySelector('.main-container');
            
            if (mainContainer) {
                mainContainer.style.height = `calc(100vh - ${headerHeight}px)`;
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeFormSections);
        } else {
            initializeFormSections();
        }

        // Handle window resize
        window.addEventListener('resize', initializeFormSections);

        console.warn('=== Accounting Rule Script Loaded ===');
    </script>
</body>
</html>
