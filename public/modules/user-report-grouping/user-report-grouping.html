<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Report Grouping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="grouping-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Report Grouping Information Section -->
                        <div class="form-section" data-section="report-grouping-info">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-file-earmark-bar-graph"></i>Report Grouping Information</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label class="label-blue">Center ID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="centerId" class="kairo-branch-control__id" placeholder="Enter Center ID" aria-label="Center ID">
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchCenterBtn"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Report ID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="reportId" class="kairo-branch-control__id" placeholder="Enter Report ID" aria-label="Report ID">
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchReportBtn"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col" style="grid-column: span 2;">
                                        <label>Description</label>
                                        <input type="text" class="bs-input-text" id="description" name="description" placeholder="Enter description">
                                    </div>
                                </div>
                                <div class="d-flex gap-2 mt-3">
                                    <button type="button" class="btn btn-primary btn-sm" id="newBtn">
                                        <i class="bi bi-file-plus me-1"></i>New
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm" id="removeBtn">
                                        <i class="bi bi-dash-circle me-1"></i>Remove
                                    </button>
                                    <button type="button" class="btn btn-info btn-sm" id="updateBtn">
                                        <i class="bi bi-arrow-repeat me-1"></i>Update
                                    </button>
                                    <button type="button" class="btn btn-secondary btn-sm" id="clearBtn">
                                        <i class="bi bi-eraser me-1"></i>Clear
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Report Groupings Table Section -->
                        <div class="form-section" data-section="report-groupings-table">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-table"></i>Report Groupings</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead class="table-light">
                                            <tr>
                                                <th style="width: 40px;"><i class="bi bi-check-square"></i></th>
                                                <th>Center ID</th>
                                                <th>Description</th>
                                                <th>Report ID</th>
                                                <th>Created Date</th>
                                                <th style="width: 100px;">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="groupingTableBody">
                                            <tr class="empty-row">
                                                <td colspan="6" class="text-center text-muted py-4">
                                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                                    No report groupings to display. Click "New" to create one.
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-action--view" id="viewBtn">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action btn-action--add" id="addBtn">
                        <i class="bi bi-plus-circle"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="btn-action btn-action--edit" id="editBtn">
                        <i class="bi bi-pencil"></i>
                        <span>Edit</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="deleteBtn">
                        <i class="bi bi-trash"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="btn-action btn-action--success" id="saveBtn">
                        <i class="bi bi-save"></i>
                        <span>Save</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="user-report-grouping.js"></script>
</body>
</html>
