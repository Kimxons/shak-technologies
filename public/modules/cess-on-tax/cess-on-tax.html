<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cess On Tax</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="cess-on-tax">
    <div class="window">
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-receipt am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">Cess On Tax</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <main class="main-container">
            <div class="form-content" role="region" aria-label="Cess On Tax form">
                <div class="form-card" data-main-form>
                    <form id="cessForm" autocomplete="off" novalidate>
                        <div class="form-section" data-section="cess-detail">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Cess Detail</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Cess Detail" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="cessId">Cess ID</label>
                                        <div class="kairo-control">
                                            <input type="text" id="cessId" class="kairo-control__id" placeholder="Enter cess ID" disabled />
                                            <button type="button" class="btn-lookup kairo-control__lookup" data-action="searchCess" aria-label="Search Cess" title="Search"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="rounding">Rounding</label>
                                        <select id="rounding" class="bs-select" disabled>
                                            <option value="0.01">Nearest 0.01</option>
                                            <option value="0.05">Nearest 0.05</option>
                                            <option value="0.10">Nearest 0.10</option>
                                            <option value="1.00">Nearest 1.00</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <label class="label-blue" for="description">Description</label>
                                    <input type="text" id="description" class="bs-input-text" placeholder="Enter description" disabled />
                                </div>

                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="payableGlId">Payable GL ID</label>
                                        <div class="kairo-control">
                                            <input type="text" id="payableGlId" class="kairo-control__id" placeholder="Enter payable GL ID" disabled />
                                            <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search" title="Search" disabled><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="paidGlId">Paid GL ID</label>
                                        <div class="kairo-control">
                                            <input type="text" id="paidGlId" class="kairo-control__id" placeholder="Enter paid GL ID" disabled />
                                            <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search" title="Search" disabled><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="receivableGlId">Receivable GL ID</label>
                                        <div class="kairo-control">
                                            <input type="text" id="receivableGlId" class="kairo-control__id" placeholder="Enter receivable GL ID" disabled />
                                            <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search" title="Search" disabled><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="amountPercentage">Amount/ Percentage</label>
                                        <select id="amountPercentage" class="bs-select" disabled>
                                            <option value="">--Select--</option>
                                            <option value="Amount">Amount</option>
                                            <option value="Percentage">Percentage</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-row four-col">
                                    <div class="col">
                                        <label class="label-blue" for="cess">Cess</label>
                                        <input type="number" id="cess" class="bs-input-text" placeholder="Enter cess" step="0.01" disabled />
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="minimumCess">Minimum Cess</label>
                                        <input type="number" id="minimumCess" class="bs-input-text" placeholder="Enter minimum cess" step="0.01" disabled />
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="maximumCess">Maximum Cess</label>
                                        <input type="number" id="maximumCess" class="bs-input-text" placeholder="Enter maximum cess" step="0.01" disabled />
                                    </div>
                                    <div class="col"></div>
                                </div>

                                <div class="form-row">
                                    <label class="label-blue" for="remarks">Remarks</label>
                                    <textarea id="remarks" class="bs-textarea" rows="3" placeholder="Enter remarks" disabled></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="form-section" data-section="audit">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="audit-section audit-section--summary">
                                    <div class="audit-cell">
                                        <span class="audit-label">Created By</span>
                                        <span class="audit-value" id="createdBy"></span>
                                    </div>
                                    <div class="audit-cell">
                                        <span class="audit-label">Modified By</span>
                                        <span class="audit-value" id="modifiedBy"></span>
                                    </div>
                                    <div class="audit-cell">
                                        <span class="audit-label">Supervised By</span>
                                        <span class="audit-value" id="supervisedBy"></span>
                                    </div>
                                    <div class="audit-cell">
                                        <span class="audit-label">Created On</span>
                                        <span class="audit-value" id="createdOn"></span>
                                    </div>
                                    <div class="audit-cell">
                                        <span class="audit-label">Modified On</span>
                                        <span class="audit-value" id="modifiedOn"></span>
                                    </div>
                                    <div class="audit-cell">
                                        <span class="audit-label">Supervised On</span>
                                        <span class="audit-value" id="supervisedOn"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <aside class="action-panel" aria-label="Form actions">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-view" data-action="view" title="View"><i class="bi bi-eye"></i>View</button>
                    <button type="button" class="btn-action" data-action="add" title="Add"><i class="bi bi-plus-circle"></i>Add</button>
                    <button type="button" class="btn-action" data-action="edit" title="Edit"><i class="bi bi-pencil"></i>Edit</button>
                    <button type="button" class="btn-action" data-action="delete" title="Delete"><i class="bi bi-trash"></i>Delete</button>
                    <button type="button" class="btn-action btn-save" data-action="save" title="Save" disabled><i class="bi bi-check-circle"></i>Save</button>
                    <button type="button" class="btn-action btn-cancel" data-action="cancel" title="Cancel" disabled><i class="bi bi-x-circle"></i>Cancel</button>
                </div>
            </aside>
        </main>

        <div class="am-message-panel" role="alert" aria-live="polite">
            <i class="bi bi-info-circle"></i>
            <span></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cess-on-tax.js"></script>
</body>
</html>
