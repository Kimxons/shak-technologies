<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC Amendment Charges</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            padding: 20px;
        }

        .charges-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .charges-table thead th {
            background: #e8eef5;
            color: #2c3e50;
            font-weight: 400;
            text-align: left;
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            white-space: nowrap;
        }

        .charges-table tbody td {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            text-align: left;
        }

        .charges-table tbody tr:hover {
            background: #f7fafc;
        }
    </style>
</head>
<body>
    <table class="charges-table" aria-label="LC Amendment Charges">
        <thead>
            <tr>
                <th>FullChargeWaiver</th>
                <th>ChargeID</th>
                <th>CurrencyID</th>
                <th>Description</th>
                <th>EffectiveRate</th>
                <th>TrxAmount</th>
                <th>LocalAmount</th>
                <th>ChargeAmount</th>
                <th>LocalChargeAmount</th>
                <th>TaxAmount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="10">No records to display.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
