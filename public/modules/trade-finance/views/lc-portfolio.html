<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LC Portfolio · Trade Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="lc-portfolio copilot-theme" data-page="lc-portfolio">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form lc-portfolio__shell" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="lc-portfolio__grid card-surface" aria-label="LC Portfolio grid">
          <div class="lc-portfolio__grid-body">
            <table class="table table-sm lc-portfolio__table" aria-label="LC Portfolio table">
              <thead>
                <tr>
                  <th scope="col">Application ID</th>
                  <th scope="col">LC Number</th>
                  <th scope="col">Expiry Date</th>
                  <th scope="col">Amount</th>
                  <th scope="col">Application Status</th>
                  <th scope="col">Value Date</th>
                  <th scope="col">Currency ID</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="7" class="lc-portfolio__empty">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <footer class="lc-portfolio__footer card-surface" aria-label="Status">
          <span>BR.Net Web Banking</span>
        </footer>
      </section>

      <aside class="cm-legacy-actions lc-portfolio__actions" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" id="lcPortfolioBackBtn">Back</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="../../../assets/js/pages/trade-finance/views/lc-portfolio.embedded.js"></script>
</body>

</html>
