<!doctype html>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

</head>

<body class="lcpo-ms-cancellation copilot-theme" data-page="lcpo-maintenance-settlement-cancellation">
  <div class="cm-react-orbs" aria-hidden="true">

    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lcpo-ms-cancellation-form" class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </button>
          <div class="cm-nav-items is-collapsed">
            <button type="button" class="cm-legacy-nav__item is-active" data-lcpo-ms-nav="extension">
              <span>LC/PO Extension</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-lcpo-ms-nav="cancellation">
              <span>LC/PO Cancellation</span>
            </button>
          </div>
        </div>

        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">

            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </button>
          <div class="cm-nav-items is-collapsed">
            <button type="button" class="cm-legacy-nav__item" data-lcpo-ms-nav="extension-history">
              <span>LC Extension History</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-lcpo-ms-nav="portfolio">
              <span>LC Portfolio</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <header class="lcpo-ms-window-title card-surface">
          <h2 class="cm-shell-title">LC/PO Maintenance/Settlement/Cancellation</h2>
        </header>

        <section class="lcpo-ms-panel card-surface" aria-label="LC/PO details">
          <div class="lcpo-ms-form-grid" role="group" aria-label="Header fields">
            <label class="lcpo-ms-label cbs-label required" for="BranchID">Branch ID</label>
            <input type="text" class="form-control" id="BranchID" name="BranchID" placeholder="0101" required />
            <input type="text" class="form-control" id="BranchName" name="BranchName" placeholder="Head Office" readonly />
            <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search branch">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>

            <label class="lcpo-ms-label cbs-label" for="ApplicationID">Application ID</label>
            <input type="text" class="form-control" id="ApplicationID" name="ApplicationID" />
            <div></div>
            <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search application">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>

            <label class="lcpo-ms-label cbs-label" for="ClientID">Client ID</label>
            <input type="text" class="form-control" id="ClientID" name="ClientID" />
            <div></div>
            <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search client">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>

            <label class="lcpo-ms-label cbs-label" for="AccountID">Account ID</label>
            <input type="text" class="form-control" id="AccountID" name="AccountID" />
            <div></div>
            <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search account">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>

            <label class="lcpo-ms-label cbs-label" for="ProductID">Product ID</label>
            <input type="text" class="form-control" id="ProductID" name="ProductID" />
            <div></div>
            <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search product">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>

            <label class="lcpo-ms-label cbs-label" for="CurrencyID">Currency ID</label>
            <select class="form-select" id="CurrencyID" name="CurrencyID">
              <option selected>--select--</option>
            </select>
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="LCNumber">LC Number</label>
            <input type="text" class="form-control" id="LCNumber" name="LCNumber" />
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="LCType">LC Type</label>
            <select class="form-select" id="LCType" name="LCType">
              <option selected>--select--</option>
            </select>
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="LCConditions">LC Conditions</label>
            <select class="form-select" id="LCConditions" name="LCConditions">
              <option selected>Irrevocable LC</option>
              <option>Revocable LC</option>
            </select>
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="ContractType">Contract Type</label>
            <select class="form-select" id="ContractType" name="ContractType">
              <option selected>--select--</option>
            </select>
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="IDFNumber">IDF Number</label>
            <input type="text" class="form-control" id="IDFNumber" name="IDFNumber" />
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="ExpiryDate">Expiry Date</label>
            <select class="form-select" id="ExpiryDate" name="ExpiryDate">
              <option selected>--select--</option>
            </select>
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="PermitNumber">Permit Number</label>
            <input type="text" class="form-control" id="PermitNumber" name="PermitNumber" />
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="ConfirmationType">Confirmation Type</label>
            <select class="form-select" id="ConfirmationType" name="ConfirmationType">
              <option selected>--select--</option>
            </select>
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="Amount">Amount</label>
            <input type="text" class="form-control" id="Amount" name="Amount" />
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="LocalAmount">Local Amount</label>
            <input type="text" class="form-control" id="LocalAmount" name="LocalAmount" />
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="Beneficiary">Beneficiary</label>
            <input type="text" class="form-control" id="Beneficiary" name="Beneficiary" />
            <div></div>
            <div></div>

            <label class="lcpo-ms-label cbs-label" for="Consignee">Consignee</label>
            <input type="text" class="form-control" id="Consignee" name="Consignee" />

            <input type="text" class="form-control" id="ChargeAccountID" name="ChargeAccountID" />
            <div></div>
            <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search charge account">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>

            <label class="lcpo-ms-label cbs-label" for="NostroAccount">Nostro Account</label>
            <input type="text" class="form-control" id="NostroAccount" name="NostroAccount" />
            <div></div>
            <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search nostro account">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>
          </div>

          <section class="lcpo-ms-section" aria-label="Client details">

            <div class="lcpo-ms-two-col">

                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="ClientLimit">Client Limit</label>
                  <input type="text" class="form-control" id="ClientLimit" name="ClientLimit" />
                </div>
                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="AvailableClientLimit">Available Client Limit</label>
                  <input type="text" class="form-control" id="AvailableClientLimit" name="AvailableClientLimit" />
                </div>
                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="ClientLimitExpiry">Client Limit Expiry</label>
                  <input type="text" class="form-control" id="ClientLimitExpiry" name="ClientLimitExpiry" />

                  <input type="text" class="form-control" id="AccountLimit" name="AccountLimit" />

              <label class="lcpo-ms-checkbox">
                <input class="form-check-input" type="checkbox" id="IsMarginRequired" name="IsMarginRequired" />
                <span>Is Margin Required</span>
              </label>
            </div>

            <div class="lcpo-ms-margin-grid">
              <label class="lcpo-ms-label cbs-label" for="MarginType">Margin Type</label>
              <select class="form-select" id="MarginType" name="MarginType">
                <option selected>--select--</option>
              </select>

              <label class="lcpo-ms-label cbs-label" for="ActualMarginAmount">Actual Margin Amount</label>
              <input type="text" class="form-control" id="ActualMarginAmount" name="ActualMarginAmount" />

              <label class="lcpo-ms-label cbs-label" for="MarginAmount">Margin Amount</label>
              <input type="text" class="form-control" id="MarginAmount" name="MarginAmount" />

              <label class="lcpo-ms-label cbs-label" for="AmountPercentage">Amount/Percentage</label>
              <input type="text" class="form-control" id="AmountPercentage" name="AmountPercentage" />

              <label class="lcpo-ms-label cbs-label" for="MarginAccountID">Margin Account ID</label>
              <div class="lcpo-ms-lookup">
                <input type="text" class="form-control" id="MarginAccountID" name="MarginAccountID" />
                <button class="btn btn-outline-primary lcpo-ms-icon-btn" type="button" aria-label="Search margin account">
                  <i class="bi bi-search" aria-hidden="true"></i>
                </button>
              </div>

            <div class="lcpo-ms-behind-grid">
              <div class="lcpo-ms-behind-grid__col">
                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="LCOutstandingBalance">LC Outstanding Balance</label>
                  <input type="text" class="form-control" id="LCOutstandingBalance" name="LCOutstandingBalance" />

                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="CancelledAmount">Cancelled Amount</label>
                  <input type="text" class="form-control" id="CancelledAmount" name="CancelledAmount" />
                </div>
                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="Status">Status</label>
                  <input type="text" class="form-control" id="Status" name="Status" />
                </div>
                <div class="lcpo-ms-row lcpo-ms-row--textarea">
                  <label class="lcpo-ms-label cbs-label" for="RejectedReason">Rejected Reason</label>
                  <textarea class="form-control" id="RejectedReason" name="RejectedReason" rows="2"></textarea>
                </div>
                <div class="lcpo-ms-row lcpo-ms-row--textarea">
                  <label class="lcpo-ms-label cbs-label" for="CancellationReason">Cancellation Reason</label>
                  <textarea class="form-control" id="CancellationReason" name="CancellationReason" rows="2"></textarea>
                </div>

                <div class="lcpo-ms-two-col">
                  <div class="lcpo-ms-two-col__col">
                    <div class="lcpo-ms-row">
                      <label class="lcpo-ms-label cbs-label" for="CancelledBy">Cancelled By</label>
                      <input type="text" class="form-control" id="CancelledBy" name="CancelledBy" />

                    <div class="lcpo-ms-row">
                      <label class="lcpo-ms-label cbs-label" for="CreatedBy">Created By</label>
                      <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" />
                    </div>
                  </div>
                  <div class="lcpo-ms-two-col__col">

                      <label class="lcpo-ms-label cbs-label" for="CancelledOn">Cancelled On</label>

                      <label class="lcpo-ms-label cbs-label" for="ApprovedBy">Approved By</label>
                      <input type="text" class="form-control" id="ApprovedBy" name="ApprovedBy" />
                    </div>
                  </div>
                </div>
              </div>

              <div class="lcpo-ms-behind-grid__col">
                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="LCSettledAmount">LC Settled Amount</label>
                  <input type="text" class="form-control" id="LCSettledAmount" name="LCSettledAmount" />
                </div>
                <div class="lcpo-ms-row">
                  <label class="lcpo-ms-label cbs-label" for="ExchangeRate">Exchange Rate</label>
                  <input type="text" class="form-control" id="ExchangeRate" name="ExchangeRate" />
                </div>
              </div>
            </div>

        <footer class="lcpo-ms-footer card-surface" aria-label="Status">
          <span>BR.Net Web Banking</span>
        </footer>

        </div>

        <div class="lcpo-ms-actions__spacer" aria-hidden="true"></div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action">View</button>
          <button type="button" class="cm-shell__action" disabled>Cancel</button>
        </div>
      </aside>
