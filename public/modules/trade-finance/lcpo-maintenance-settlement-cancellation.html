<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC/PO Maintenance/Settlement/Cancellation</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../overdraft-application/overdraft-application.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <aside class="sidebar" aria-label="Section navigation">
                <div class="sidebar-title">LC/PO Maintenance/Settlement/Cancellation</div>
                
                <div class="nav-section">
                    <button type="button" class="nav-toggle" data-current-section="dataentry">
                        <i class="bi bi-database" aria-hidden="true"></i>
                        <span class="nav-toggle-label">DataEntry</span>
                        <i class="bi bi-chevron-down nav-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="nav-items">
                        <button type="button" class="nav-item" data-section="lc-extension">
                            <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                            <span>LC/PO Extension</span>
                        </button>
                        <button type="button" class="nav-item" data-section="lc-cancellation">
                            <i class="bi bi-x-circle" aria-hidden="true"></i>
                            <span>LC/PO Cancellation</span>
                        </button>
                        <button type="button" class="nav-item" data-section="messages">
                            <i class="bi bi-envelope" aria-hidden="true"></i>
                            <span>Messages</span>
                        </button>
                        <button type="button" class="nav-item" data-section="discrepancies">
                            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
                            <span>Discrepancies</span>
                        </button>
                        <button type="button" class="nav-item" data-section="availment">
                            <i class="bi bi-check-circle" aria-hidden="true"></i>
                            <span>Availment(Settlement)</span>
                        </button>
                    </div>
                </div>

                <div class="nav-section">
                    <button type="button" class="nav-toggle collapsed" data-current-section="view">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                        <span class="nav-toggle-label">View</span>
                        <i class="bi bi-chevron-down nav-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="nav-items collapsed">
                        <button type="button" class="nav-item" data-section="lc-portfolio">
                            <i class="bi bi-folder" aria-hidden="true"></i>
                            <span>LC Portfolio</span>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="content" role="main">
                <div class="form-section active" data-section="main" style="display: block;">
                    <section class="card">
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="form-control-group">
                                    <label for="branchId" class="form-label"><i class="bi bi-building" aria-hidden="true"></i><span>Branch ID</span></label>
                                    <input type="text" id="branchId" name="branchId" class="form-control" value="0101" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="headOffice" class="form-label"><i class="bi bi-building" aria-hidden="true"></i><span>Head Office</span></label>
                                    <input type="text" id="headOffice" name="headOffice" class="form-control" readonly>
                                </div>

                                <div class="form-control-group">
                                    <label for="applicationId" class="form-label"><i class="bi bi-file-text" aria-hidden="true"></i><span>Application ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="applicationId" name="applicationId" class="form-control">
                                        <button type="button" class="btn-search" aria-label="Search Application ID">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="clientId" class="form-label"><i class="bi bi-person" aria-hidden="true"></i><span>Client ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="clientId" name="clientId" class="form-control">
                                        <button type="button" class="btn-search" aria-label="Search Client ID">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="accountId" class="form-label"><i class="bi bi-bank" aria-hidden="true"></i><span>Account ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="accountId" name="accountId" class="form-control">
                                        <button type="button" class="btn-search" aria-label="Search Account ID">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="productId" class="form-label"><i class="bi bi-box" aria-hidden="true"></i><span>Product ID</span></label>
                                    <input type="text" id="productId" name="productId" class="form-control">
                                </div>
                                <div class="form-control-group">
                                    <label for="currencyId" class="form-label"><i class="bi bi-currency-exchange" aria-hidden="true"></i><span>Currency ID</span></label>
                                    <input type="text" id="currencyId" name="currencyId" class="form-control">
                                </div>

                                <div class="form-control-group">
                                    <label for="lcNumber" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>LC Number</span></label>
                                    <input type="text" id="lcNumber" name="lcNumber" class="form-control">
                                </div>
                                <div class="form-control-group">
                                    <label for="lcType" class="form-label"><i class="bi bi-tag" aria-hidden="true"></i><span>LC Type</span></label>
                                    <select id="lcType" name="lcType" class="form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>

                                <div class="form-control-group">
                                    <label for="lcConditions" class="form-label"><i class="bi bi-list-check" aria-hidden="true"></i><span>LC Conditions</span></label>
                                    <select id="lcConditions" name="lcConditions" class="form-control">
                                        <option value="">Irrevocable LC</option>
                                    </select>
                                </div>
                                <div class="form-control-group">
                                    <label for="contractType" class="form-label"><i class="bi bi-file-earmark-text" aria-hidden="true"></i><span>Contract Type</span></label>
                                    <select id="contractType" name="contractType" class="form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>

                                <div class="form-control-group">
                                    <label for="idfNumber" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>IDF Number</span></label>
                                    <input type="text" id="idfNumber" name="idfNumber" class="form-control">
                                </div>
                                <div class="form-control-group">
                                    <label for="expiryDate" class="form-label"><i class="bi bi-calendar" aria-hidden="true"></i><span>Expiry Date</span></label>
                                    <select id="expiryDate" name="expiryDate" class="form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>

                                <div class="form-control-group">
                                    <label for="permitNumber" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>Permit Number</span></label>
                                    <input type="text" id="permitNumber" name="permitNumber" class="form-control">
                                </div>
                                <div class="form-control-group">
                                    <label for="confirmationType" class="form-label"><i class="bi bi-check-square" aria-hidden="true"></i><span>Confirmation Type</span></label>
                                    <input type="text" id="confirmationType" name="confirmationType" class="form-control">
                                </div>

                                <div class="form-control-group">
                                    <label for="amount" class="form-label"><i class="bi bi-currency-dollar" aria-hidden="true"></i><span>Amount</span></label>
                                    <input type="number" id="amount" name="amount" class="form-control" step="0.01">
                                </div>
                                <div class="form-control-group">
                                    <label for="localAmount" class="form-label"><i class="bi bi-currency-dollar" aria-hidden="true"></i><span>Local Amount</span></label>
                                    <input type="number" id="localAmount" name="localAmount" class="form-control" step="0.01">
                                </div>

                                <div class="form-control-group" style="grid-column: span 2;">
                                    <label for="beneficiary" class="form-label"><i class="bi bi-person-check" aria-hidden="true"></i><span>Beneficiary</span></label>
                                    <input type="text" id="beneficiary" name="beneficiary" class="form-control">
                                </div>

                                <div class="form-control-group" style="grid-column: span 2;">
                                    <label for="consignee" class="form-label"><i class="bi bi-person" aria-hidden="true"></i><span>Consignee</span></label>
                                    <input type="text" id="consignee" name="consignee" class="form-control">
                                </div>

                                <div class="form-control-group">
                                    <label for="chargeAccountId" class="form-label"><i class="bi bi-wallet2" aria-hidden="true"></i><span>Charge AccountID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="chargeAccountId" name="chargeAccountId" class="form-control">
                                        <button type="button" class="btn-search" aria-label="Search Charge Account ID">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="nostroAccount" class="form-label"><i class="bi bi-bank2" aria-hidden="true"></i><span>Nostro Account</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="nostroAccount" name="nostroAccount" class="form-control">
                                        <button type="button" class="btn-search" aria-label="Search Nostro Account">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>
                            </div>
                        </div>
                    </section>

                    <section class="card">
                        <div class="card-header">
                            <i class="bi bi-person-badge" aria-hidden="true"></i>
                            <span>Client Details</span>
                        </div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="form-control-group">
                                    <label for="clientLimit" class="form-label"><i class="bi bi-graph-up" aria-hidden="true"></i><span>Client Limit</span></label>
                                    <input type="number" id="clientLimit" name="clientLimit" class="form-control" step="0.01" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="accountLimit" class="form-label"><i class="bi bi-graph-up" aria-hidden="true"></i><span>Account Limit</span></label>
                                    <input type="number" id="accountLimit" name="accountLimit" class="form-control" step="0.01" readonly>
                                </div>

                                <div class="form-control-group">
                                    <label for="availableClientLimit" class="form-label"><i class="bi bi-graph-down" aria-hidden="true"></i><span>Available Client Limit</span></label>
                                    <input type="number" id="availableClientLimit" name="availableClientLimit" class="form-control" step="0.01" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="availableAccountLimit" class="form-label"><i class="bi bi-graph-down" aria-hidden="true"></i><span>Available Account Limit</span></label>
                                    <input type="number" id="availableAccountLimit" name="availableAccountLimit" class="form-control" step="0.01" readonly>
                                </div>

                                <div class="form-control-group">
                                    <label for="clientLimitExpiry" class="form-label"><i class="bi bi-calendar-x" aria-hidden="true"></i><span>Client Limit Expiry</span></label>
                                    <input type="text" id="clientLimitExpiry" name="clientLimitExpiry" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="accountLimitExpiry" class="form-label"><i class="bi bi-calendar-x" aria-hidden="true"></i><span>Account Limit Expiry</span></label>
                                    <input type="text" id="accountLimitExpiry" name="accountLimitExpiry" class="form-control" readonly>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="card">
                        <div class="card-header">
                            <input type="checkbox" id="isMarginRequired" name="isMarginRequired" style="margin-right: 8px;">
                            <span>Is Margin Required</span>
                        </div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="form-control-group">
                                    <label for="marginType" class="form-label"><i class="bi bi-tag" aria-hidden="true"></i><span>Margin Type</span></label>
                                    <select id="marginType" name="marginType" class="form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="form-control-group">
                                    <label for="actualMarginAmount" class="form-label"><i class="bi bi-currency-dollar" aria-hidden="true"></i><span>Actual Margin Amount</span></label>
                                    <input type="number" id="actualMarginAmount" name="actualMarginAmount" class="form-control" step="0.01">
                                </div>

                                <div class="form-control-group">
                                    <label for="marginAmountPercentage" class="form-label"><i class="bi bi-percent" aria-hidden="true"></i><span>Margin Amount/Percentage</span></label>
                                    <input type="number" id="marginAmountPercentage" name="marginAmountPercentage" class="form-control" step="0.01">
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="marginAccountId" class="form-label"><i class="bi bi-wallet2" aria-hidden="true"></i><span>Margin Account ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="marginAccountId" name="marginAccountId" class="form-control">
                                        <button type="button" class="btn-search" aria-label="Search Margin Account ID">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>
                            </div>
                        </div>
                    </section>

                    <section class="card">
                        <div class="card-header">
                            <i class="bi bi-eye-slash" aria-hidden="true"></i>
                            <span>Behind The Scene</span>
                        </div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="form-control-group">
                                    <label for="lcOutstandingBalance" class="form-label"><i class="bi bi-cash" aria-hidden="true"></i><span>LC Outstanding Balance</span></label>
                                    <input type="number" id="lcOutstandingBalance" name="lcOutstandingBalance" class="form-control" step="0.01" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="lcSettledAmount" class="form-label"><i class="bi bi-check-circle" aria-hidden="true"></i><span>LC Settled Amount</span></label>
                                    <input type="number" id="lcSettledAmount" name="lcSettledAmount" class="form-control" step="0.01" readonly>
                                </div>

                                <div class="form-control-group">
                                    <label for="cancelledAmount" class="form-label"><i class="bi bi-x-circle" aria-hidden="true"></i><span>Cancelled Amount</span></label>
                                    <input type="number" id="cancelledAmount" name="cancelledAmount" class="form-control" step="0.01" readonly>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="status" class="form-label"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Status</span></label>
                                    <input type="text" id="status" name="status" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="exchangeRate" class="form-label"><i class="bi bi-arrow-left-right" aria-hidden="true"></i><span>Exchange Rate</span></label>
                                    <input type="number" id="exchangeRate" name="exchangeRate" class="form-control" step="0.0001" readonly>
                                </div>

                                <div class="form-control-group" style="grid-column: span 2;">
                                    <label for="rejectedReason" class="form-label"><i class="bi bi-x-octagon" aria-hidden="true"></i><span>Rejected Reason</span></label>
                                    <textarea id="rejectedReason" name="rejectedReason" class="form-control" rows="2" readonly></textarea>
                                </div>

                                <div class="form-control-group" style="grid-column: span 2;">
                                    <label for="cancellationReason" class="form-label"><i class="bi bi-x-square" aria-hidden="true"></i><span>Cancellation Reason</span></label>
                                    <textarea id="cancellationReason" name="cancellationReason" class="form-control" rows="2"></textarea>
                                </div>

                                <div class="form-control-group">
                                    <label for="cancelledBy" class="form-label"><i class="bi bi-person" aria-hidden="true"></i><span>Cancelled By</span></label>
                                    <input type="text" id="cancelledBy" name="cancelledBy" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="cancelledOn" class="form-label"><i class="bi bi-calendar-event" aria-hidden="true"></i><span>Cancelled On</span></label>
                                    <input type="text" id="cancelledOn" name="cancelledOn" class="form-control" readonly>
                                </div>

                                <div class="form-control-group">
                                    <label for="createdBy" class="form-label"><i class="bi bi-person-plus" aria-hidden="true"></i><span>Created By</span></label>
                                    <input type="text" id="createdBy" name="createdBy" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="approvedBy" class="form-label"><i class="bi bi-person-check" aria-hidden="true"></i><span>Approved By</span></label>
                                    <input type="text" id="approvedBy" name="approvedBy" class="form-control" readonly>
                                </div>

                                <div class="form-control-group">
                                    <label for="createdOn" class="form-label"><i class="bi bi-calendar-plus" aria-hidden="true"></i><span>Created On</span></label>
                                    <input type="text" id="createdOn" name="createdOn" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="approvedOn" class="form-label"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>Approved On</span></label>
                                    <input type="text" id="approvedOn" name="approvedOn" class="form-control" readonly>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>

            <aside class="action-bar" aria-label="Actions">
                <div style="background: #f0f4f8; padding: 12px 8px; text-align: center; font-weight: 600; font-size: 13px; color: #2c3e50; border-bottom: 1px solid #dde6ed; margin-bottom: 8px;">
                    Application Details
                </div>
                <button class="action-btn view" data-action="view">
                    <i class="bi bi-eye-fill" aria-hidden="true"></i>
                    <span>View</span>
                </button>
                <button class="action-btn cancel" data-action="cancel">
                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                    <span>Cancel</span>
                </button>
            </aside>
        </div>
    </div>

    <script src="../../assets/js/pages/trade-finance/lcpo-maintenance-settlement-cancellation.embedded.js"></script>
</body>
</html>
