<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LC/PO Account Application · Trade Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/trade-finance.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <style>
    /* Ensure label-blue uses the main blue color and bold for Behind the Scene section labels only */
    .lcpo-behind .label-blue {
      color: #4A90E2 !important;
      font-weight: 800 !important;
    }

    /* Match action button width to overdraft application */
    .cm-legacy-actions__group .elc-legacy-action {
      width: 120px;
      min-width: 120px;
      max-width: 120px;
    }

    .lcpo-popout-dialog {
      --bs-modal-width: 1180px;
      max-width: min(1180px, 96vw);
    }

    .lcpo-popout-body {
      height: 720px;
      max-height: 80vh;
      background: transparent;
    }

    .lcpo-popout-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
  </style>
</head>

<body class="lcpo-account-application copilot-theme" data-page="lcpo-account-application">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lcpo-form" class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Form navigation">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            style="background: #357ABD; color: #fff; border: none; border-radius: 4px; padding: 8px 12px; font-weight: 600;"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-caret-up-fill'); this.querySelector('.bi').classList.toggle('bi-caret-down-fill');">
            <span class="cm-nav-toggle__label"><i class="bi bi-pencil-square" aria-hidden="true"></i> DataEntry</span>
            <i class="bi bi-caret-down-fill" aria-hidden="true"></i>
          </button>
          <div class="cm-nav-items is-collapsed" style="background: #4A90E2; border-radius: 4px; margin-top: 4px;">
            <button type="button" class="lcpo-dataentry-item" data-lcpo-dataentry="lc-banks" aria-current="true"
              style="background: #4A90E2; color: #fff; border: none; border-radius: 4px; margin: 2px 0; padding: 8px 12px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
              <i class="bi bi-bank" aria-hidden="true"></i>
              <span>LC Banks</span>
            </button>
            <button type="button" class="lcpo-dataentry-item" data-lcpo-dataentry="lc-more-info"
              style="background: #4A90E2; color: #fff; border: none; border-radius: 4px; margin: 2px 0; padding: 8px 12px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
              <i class="bi bi-info-circle" aria-hidden="true"></i>
              <span>LC More Info</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="cm-legacy-content" aria-label="LC/PO Account Application">
        <section class="card-surface lcpo-surface">
          <header class="lcpo-header">
            <h1 class="lcpo-title">LC/PO Account Application</h1>
          </header>

          <div class="lcpo-panel" role="region" aria-label="Application details">
            <div class="lcpo-fields form-grid two-col">
              <div class="lcpo-row form-control-group">
                <label class="form-label" for="branchId"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></label>
                <div class="input-segmented" aria-label="Branch lookup">
                  <input id="branchId" name="BranchID" type="text" class="form-control segment-id" value="" required
                    data-editable="true" />
                  <div class="segment-divider" aria-hidden="true"></div>
                  <input id="branchName" name="BranchName" type="text" class="form-control segment-desc" value="" readonly
                    aria-label="Branch name" />
                  <button class="btn-inline-search" type="button" data-lookup="branch" aria-label="Search branch">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="lcpo-row form-control-group">
                <label class="form-label" for="applicationId"><i class="bi bi-card-heading" aria-hidden="true"></i><span>Application ID</span></label>
                <div class="input-segmented" aria-label="Application lookup">
                  <input id="applicationId" name="ApplicationID" type="text" class="form-control segment-id" data-editable="true" />
                  <div class="segment-divider" aria-hidden="true"></div>
                  <input id="applicationName" name="ApplicationName" type="text" class="form-control segment-desc" readonly
                    aria-label="Application name" />
                  <button class="btn-inline-search" type="button" data-lookup="application" aria-label="Search application">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="lcpo-row form-control-group">
                <label class="form-label" for="applicationDate"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>Application Date</span></label>
                <input id="applicationDate" name="ApplicationDate" type="date" class="form-control" required data-editable="true" />
              </div>

              <div class="lcpo-row form-control-group">
                <label class="form-label" for="clientId"><i class="bi bi-person-badge" aria-hidden="true"></i><span>Client ID</span></label>
                <div class="input-segmented" aria-label="Client lookup">
                  <input id="clientId" name="ClientID" type="text" class="form-control segment-id" data-editable="true" />
                  <div class="segment-divider" aria-hidden="true"></div>
                  <input id="clientName" name="ClientName" type="text" class="form-control segment-desc" readonly aria-label="Client name" />
                  <button class="btn-inline-search" type="button" data-lookup="client" aria-label="Search client">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="lcpo-row form-control-group">
                <label class="form-label" for="productId"><i class="bi bi-box-seam" aria-hidden="true"></i><span>Product ID</span></label>
                <div class="input-segmented" aria-label="Product lookup">
                  <input id="productId" name="ProductID" type="text" class="form-control segment-id" data-editable="true" />
                  <div class="segment-divider" aria-hidden="true"></div>
                  <input id="productName" name="ProductName" type="text" class="form-control segment-desc" readonly aria-label="Product description" />
                  <button class="btn-inline-search" type="button" data-lookup="product" aria-label="Search product">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="lcpo-row form-control-group">
                <label class="form-label" for="accountId"><i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>Account ID</span></label>
                <div class="input-segmented" aria-label="Account lookup">
                  <input id="accountId" name="AccountID" type="text" class="form-control segment-id" data-editable="true" />
                  <div class="segment-divider" aria-hidden="true"></div>
                  <input id="accountName" name="AccountName" type="text" class="form-control segment-desc" readonly aria-label="Account description" />
                  <button class="btn-inline-search" type="button" data-lookup="account" aria-label="Search account">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="lcpo-row form-control-group">
                <label class="form-label" for="purposeId"><i class="bi bi-flag" aria-hidden="true"></i><span>Purpose ID</span></label>
                <select id="purposeId" name="PurposeID" class="form-select lcpo-select" data-editable="true">
                  <option value="" selected>--Select--</option>
                  <option value="Business Need">Business Need</option>
                  <option value="Applied For TOD">Applied For TOD</option>
                  <option value="Cheque Clearing Purpose">Cheque Clearing Purpose</option>
                </select>
              </div>

              <div class="lcpo-row form-control-group">
                <label class="form-label" for="referenceNo"><span>Reference No.</span></label>
                <input id="referenceNo" name="ReferenceNo" type="text" class="form-control" readonly />
              </div>

              <div class="lcpo-row form-control-group full-row">
                <label class="form-label" for="remarks"><i class="bi bi-journal-text" aria-hidden="true"></i><span>Remarks</span></label>
                <input id="remarks" name="Remarks" type="text" class="form-control" data-editable="true" />
              </div>

              <div class="lcpo-row form-control-group full-row">
                <label class="form-label" for="applicationStatus"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Application Status</span></label>
                <input id="applicationStatus" name="ApplicationStatus" type="text" class="form-control" readonly value=""
                  aria-label="Application status" />
              </div>
            </div>

            <section class="lcpo-behind" aria-label="Behind the scene">
              <button type="button" class="lcpo-behind__title w-100 text-start border-0"
                data-bs-toggle="collapse" data-bs-target="#lcpoBehindCollapse" aria-expanded="false"
                aria-controls="lcpoBehindCollapse">
                <i class="bi bi-eye-fill me-2" aria-hidden="true"></i>
                <span>Behind The Scene</span>
                <span class="lcpo-bts-caret" aria-hidden="true">
                  <i class="bi bi-caret-down-fill"></i>
                  <i class="bi bi-caret-up-fill"></i>
                </span>
              </button>
              <div id="lcpoBehindCollapse" class="lcpo-behind__body collapse">
                <div class="form-grid two-col">
                  <div class="form-control-group">
                    <label class="form-label" for="rejectedBy"><i class="bi bi-person" aria-hidden="true"></i><span>Rejected By</span></label>
                    <input id="rejectedBy" name="RejectedBy" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group">
                    <label class="form-label" for="rejectedOn"><i class="bi bi-calendar" aria-hidden="true"></i><span>Rejected On</span></label>
                    <input id="rejectedOn" name="RejectedOn" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group full-row">
                    <label class="form-label" for="rejectionReason"><i class="bi bi-x-octagon" aria-hidden="true"></i><span>Rejection Reason</span></label>
                    <input id="rejectionReason" name="RejectionReason" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group">
                    <label class="form-label" for="createdBy"><i class="bi bi-person" aria-hidden="true"></i><span>Created By</span></label>
                    <input id="createdBy" name="CreatedBy" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group">
                    <label class="form-label" for="modifiedBy"><i class="bi bi-person" aria-hidden="true"></i><span>Modified By</span></label>
                    <input id="modifiedBy" name="ModifiedBy" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group">
                    <label class="form-label" for="supervisedBy"><i class="bi bi-person" aria-hidden="true"></i><span>Supervised By</span></label>
                    <input id="supervisedBy" name="SupervisedBy" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group">
                    <label class="form-label" for="createdOn"><i class="bi bi-calendar" aria-hidden="true"></i><span>Created On</span></label>
                    <input id="createdOn" name="CreatedOn" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group">
                    <label class="form-label" for="modifiedOn"><i class="bi bi-calendar" aria-hidden="true"></i><span>Modified On</span></label>
                    <input id="modifiedOn" name="ModifiedOn" type="text" class="form-control" readonly />
                  </div>

                  <div class="form-control-group">
                    <label class="form-label" for="supervisedOn"><i class="bi bi-calendar" aria-hidden="true"></i><span>Supervised On</span></label>
                    <input id="supervisedOn" name="SupervisedOn" type="text" class="form-control" readonly />
                  </div>
                </div>

                <div id="lcpoToast" class="alert alert-info mt-2 d-none" role="status" aria-live="polite"></div>
              </div>
            </section>
          </div>
        </section>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions" style="position: relative; height: 100%; min-width: 150px; overflow: visible;">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Navigation</p>
          <div class="lcpo-nav-icons">
            <button type="button" class="lcpo-nav-btn" data-lcpo-nav="prev" aria-label="Previous">
              <i class="bi bi-arrow-left"></i>
            </button>
            <button type="button" class="lcpo-nav-btn" data-lcpo-nav="next" aria-label="Next">
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>
        <div class="cm-legacy-actions__group" style="position: absolute; right: 24px; bottom: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
          <button type="button" class="elc-legacy-action" data-lcpo-action="view">
            <i class="bi bi-eye-fill" aria-hidden="true"></i>
            <span>View</span>
          </button>
          <button type="button" class="elc-legacy-action" data-lcpo-action="add">
            <i class="bi bi-plus-circle" aria-hidden="true"></i>
            <span>Add</span>
          </button>
          <button type="button" class="elc-legacy-action" data-lcpo-action="edit" disabled>
            <i class="bi bi-pencil-fill" aria-hidden="true"></i>
            <span>Edit</span>
          </button>
          <button type="button" class="elc-legacy-action" data-lcpo-action="delete" disabled>
            <i class="bi bi-trash-fill" aria-hidden="true"></i>
            <span>Delete</span>
          </button>
          <button type="button" class="elc-legacy-action" data-lcpo-action="save" disabled>
            <i class="bi bi-save-fill" aria-hidden="true"></i>
            <span>Save</span>
          </button>
          <button type="button" class="elc-legacy-action" data-lcpo-action="cancel" disabled>
            <i class="bi bi-x-circle" aria-hidden="true"></i>
            <span>Cancel</span>
          </button>
        </div>
      </aside>
    </form>
  </div>

  <!-- Data Entry popouts (match legacy fixed-window feel) -->
  <div class="modal fade" id="lcBanksPopout" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered lcpo-popout-dialog">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h5 class="modal-title mb-0 me-auto"><i class="bi bi-bank me-2" aria-hidden="true"></i>LC Banks</h5>
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-lcpo-popout-control="maximize"
              aria-label="Maximize window" aria-pressed="false">
              <i class="bi bi-arrows-fullscreen" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
        <div class="modal-body p-0 lcpo-popout-body">
          <iframe class="lcpo-popout-iframe" src="lc-banks.html" title="LC Banks"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="lcMoreInfoPopout" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered lcpo-popout-dialog">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h5 class="modal-title mb-0 me-auto"><i class="bi bi-info-circle me-2" aria-hidden="true"></i>LC More Info</h5>
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-lcpo-popout-control="maximize"
              aria-label="Maximize window" aria-pressed="false">
              <i class="bi bi-arrows-fullscreen" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
        <div class="modal-body p-0 lcpo-popout-body">
          <iframe class="lcpo-popout-iframe" src="lc-more-info.html" title="LC More Info"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Results Modal -->
  <div class="modal fade" id="searchResultsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 590px; width: 100%;">
      <div class="modal-content" style="border-radius: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <div class="modal-header"
          style="background: linear-gradient(to right, #f8f9fa, #e9ecef); border-bottom: 2px solid #dee2e6; padding: 0.75rem 1rem;">
          <h5 class="modal-title fw-semibold" id="searchResultsTitle" style="color: #2c3e50; font-size: 0.95rem;">Search
            Results</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" style="padding: 1.25rem; background: #f8f9fa;">
          <!-- Search Filters Section -->
          <div class="card mb-3" style="border: 1px solid #dee2e6; border-radius: 0;">
            <div class="card-body" style="padding: 1rem;">
              <div class="row g-3" id="searchFiltersContainer">
                <!-- Dynamic search filters will be inserted here -->
              </div>
              <div class="mt-3 text-end">
                <button type="button" class="btn btn-sm btn-primary" id="searchButton"
                  style="padding: 0.375rem 1.5rem; border-radius: 0;">
                  Search
                </button>
              </div>
            </div>
          </div>

          <!-- Search Results Section -->
          <div class="card" style="border: 1px solid #dee2e6; border-radius: 0;">
            <div class="card-header"
              style="background: linear-gradient(to right, #e3f2fd, #bbdefb); padding: 0.5rem 1rem; border-bottom: 1px solid #90caf9;">
              <strong style="color: #1976d2; font-size: 0.9rem;">Search Results</strong>
            </div>
            <div class="card-body p-0">
              <div id="searchResultsContainer" class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                <table class="table table-hover table-sm mb-0" style="font-size: 0.875rem;">
                  <thead id="searchResultsHeader"
                    style="position: sticky; top: 0; background: #f8f9fa; z-index: 1; border-bottom: 2px solid #dee2e6;">
                  </thead>
                  <tbody id="searchResultsBody"></tbody>
                </table>
              </div>
              <div id="searchResultsEmpty" class="text-center text-muted py-5" style="display: none;">
                <i class="bi bi-search" style="font-size: 2rem; opacity: 0.3;"></i>
                <p class="mt-2 mb-0">No results found</p>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer"
          style="background: #f8f9fa; border-top: 2px solid #dee2e6; padding: 0.75rem 1rem; justify-content: center;">
          <button type="button" class="btn btn-sm" id="prevPageBtn"
            style="padding: 0.375rem 0.75rem; border-radius: 0; background: #6c757d; color: white; min-width: 80px;">
            <i class="bi bi-arrow-left"></i> Previous
          </button>
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal"
            style="padding: 0.375rem 1.5rem; border-radius: 0; min-width: 100px;">OK</button>
          <button type="button" class="btn btn-sm" id="nextPageBtn"
            style="padding: 0.375rem 0.75rem; border-radius: 0; background: #6c757d; color: white; min-width: 80px;">
            Next <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/trade-finance/tradeFinanceService.js"></script>
  <script src="../js/lc-po-account-application.js"></script>
</body>

</html>
