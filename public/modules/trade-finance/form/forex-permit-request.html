<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forex Permit Request · Trade Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/trade-finance.css" />
</head>

<body class="forex-permit-request copilot-theme" data-page="forex-permit-request">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="fpr-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content" aria-label="Forex Permit Request">
        <section class="card-surface elc-surface">
          <div class="elc-header-block" role="region" aria-label="Header identifiers">
            <div class="elc-header-grid">
              <div class="elc-header-row">
                <label class="elc-label" for="BranchID">Branch ID</label>
                <div class="elc-control elc-control--span-all">
                  <div class="input-group elc-input-group" aria-label="Branch lookup">
                    <input id="BranchID" name="BranchID" type="text" class="form-control elc-id" value="" required data-editable="true" />
                    <input id="BranchName" name="BranchName" type="text" class="form-control elc-desc" value="" readonly aria-label="Branch name" />
                    <button class="btn btn-outline-secondary" type="button" data-lookup="branch" aria-label="Search branch">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="elc-header-row">
                <label class="elc-label" for="PermitNo">Permit No</label>
                <div class="elc-control">
                  <div class="input-group elc-input-group elc-input-group--single" aria-label="Permit lookup">
                    <input id="PermitNo" name="PermitNo" type="text" class="form-control" data-editable="true" />
                    <button class="btn btn-outline-secondary" type="button" data-lookup="permit" aria-label="Search permit">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <label class="elc-label" for="ClientID">Client ID</label>
                <div class="elc-control">
                  <div class="input-group elc-input-group" aria-label="Client lookup">
                    <input id="ClientID" name="ClientID" type="text" class="form-control elc-code" data-editable="true" />
                    <input id="ClientName" name="ClientName" type="text" class="form-control elc-desc" readonly aria-label="Client name" />
                    <button class="btn btn-outline-secondary" type="button" data-lookup="client" aria-label="Search client">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <nav class="elc-tabs" aria-label="Forex permit tabs">
            <ul class="nav nav-tabs elc-tablist" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="fpr-tab-request" data-bs-toggle="tab" data-bs-target="#fpr-pane-request" type="button" role="tab" aria-controls="fpr-pane-request" aria-selected="true">Request</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="fpr-tab-documents" data-bs-toggle="tab" data-bs-target="#fpr-pane-documents" type="button" role="tab" aria-controls="fpr-pane-documents" aria-selected="false">Documents</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="fpr-tab-additional" data-bs-toggle="tab" data-bs-target="#fpr-pane-additional" type="button" role="tab" aria-controls="fpr-pane-additional" aria-selected="false">Additional Information</button>
              </li>
            </ul>
          </nav>

          <div class="tab-content elc-tabcontent" id="fpr-tabcontent">
            <!-- Request -->
            <div class="tab-pane fade show active" id="fpr-pane-request" role="tabpanel" aria-labelledby="fpr-tab-request" tabindex="0">
              <div class="elc-section">
                <div class="elc-sectionbar">Permit Request</div>
                <div class="elc-form-grid elc-form-grid--two">
                  <label class="elc-label" for="PermitType">Permit Type</label>
                  <div class="elc-control">
                    <select id="PermitType" name="PermitType" class="form-select" data-editable="true">
                      <option value="" selected>--Select--</option>
                    </select>
                  </div>

                  <label class="elc-label" for="IssueDate">Issue Date</label>
                  <div class="elc-control">
                    <input id="IssueDate" name="IssueDate" type="date" class="form-control" data-editable="true" />
                  </div>

                  <label class="elc-label" for="PermitDays">Permit Days</label>
                  <div class="elc-control">
                    <input id="PermitDays" name="PermitDays" type="text" class="form-control" data-editable="true" />
                  </div>

                  <label class="elc-label" for="ExpiryDate">Expiry Date</label>

                    <input id="ExpiryDate" name="ExpiryDate" type="date" class="form-control" data-editable="true" />

                  <label class="elc-label" for="PermitCurrencyID">Permit CurrencyID</label>

                    <div class="input-group elc-input-group elc-input-group--single" aria-label="Permit currency lookup">
                      <input id="PermitCurrencyID" name="PermitCurrencyID" type="text" class="form-control" data-editable="true" />
                      <button class="btn btn-outline-secondary" type="button" data-lookup="permitCurrency" aria-label="Search permit currency">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>

                  <label class="elc-label" for="ExchangeRate">Exchange Rate</label>
                  <div class="elc-control">
                    <input id="ExchangeRate" name="ExchangeRate" type="text" class="form-control" data-editable="true" />
                  </div>

                  <label class="elc-label" for="PermitAmount">Permit Amount</label>

                    <input id="PermitAmount" name="PermitAmount" type="text" class="form-control" data-editable="true" />

                  <label class="elc-label" for="LocalCurrencyEquivalent">Local Currency Equivalent</label>
                  <div class="elc-control">
                    <input id="LocalCurrencyEquivalent" name="LocalCurrencyEquivalent" type="text" class="form-control" data-editable="true" />

                  <div class="elc-control">
                    <input id="FreightCost" name="FreightCost" type="text" class="form-control" data-editable="true" />

                  <label class="elc-label" for="HSCode">HS Code</label>
                  <div class="elc-control">
                    <input id="HSCode" name="HSCode" type="text" class="form-control" data-editable="true" />

                    <input id="BusinessLicenseNo" name="BusinessLicenseNo" type="text" class="form-control" data-editable="true" />

                  </div>

                  <label class="elc-label" for="GoodsDescription">Goods Description</label>
                  <div class="elc-control">
                    <input id="GoodsDescription" name="GoodsDescription" type="text" class="form-control" data-editable="true" />

                    <input id="TotalPrice" name="TotalPrice" type="text" class="form-control" data-editable="true" />

                    <select id="IncoTerms" name="IncoTerms" class="form-select" data-editable="true">

                    </select>
                  </div>

                  <label class="elc-label" for="PaymentTerms">Payment Terms</label>

                    <select id="PaymentTerms" name="PaymentTerms" class="form-select" data-editable="true">
                      <option value="" selected>--Select--</option>
                    </select>
                  </div>

                  <label class="elc-label" for="FromCountry">From Country</label>
                  <div class="elc-control">
                    <div class="input-group elc-input-group" aria-label="From country lookup">
                      <input id="FromCountry" name="FromCountry" type="text" class="form-control elc-code" data-editable="true" />
                      <input id="FromCountryName" name="FromCountryName" type="text" class="form-control elc-desc" readonly aria-label="From country name" />
                      <button class="btn btn-outline-secondary" type="button" data-lookup="fromCountry" aria-label="Search from country">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>

                  <label class="elc-label" for="ToCountry">To Country</label>
                  <div class="elc-control">
                    <div class="input-group elc-input-group" aria-label="To country lookup">
                      <input id="ToCountry" name="ToCountry" type="text" class="form-control elc-code" data-editable="true" />
                      <input id="ToCountryName" name="ToCountryName" type="text" class="form-control elc-desc" readonly aria-label="To country name" />
                      <button class="btn btn-outline-secondary" type="button" data-lookup="toCountry" aria-label="Search to country">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>

                  <label class="elc-label" for="PortOfLoading">Port Of Loading</label>
                  <div class="elc-control">
                    <input id="PortOfLoading" name="PortOfLoading" type="text" class="form-control" data-editable="true" />

                  <div class="elc-control">

                  </div>

                  <div class="elc-control">
                    <select id="ModeOfTransport" name="ModeOfTransport" class="form-select" data-editable="true">
                      <option value="" selected>--Select--</option>
                    </select>
                  </div>

                  <label class="elc-label" for="SourceOfFCYsFunds">Source Of FCYs Funds</label>
                  <div class="elc-control">
                    <select id="SourceOfFCYsFunds" name="SourceOfFCYsFunds" class="form-select" data-editable="true">
                      <option value="Bank Source" selected>Bank Source</option>
                    </select>
                  </div>

                  <label class="elc-label" for="OriginOfGoods">Origin Of Goods</label>
                  <div class="elc-control">
                    <input id="OriginOfGoods" name="OriginOfGoods" type="text" class="form-control" data-editable="true" />
                  </div>

                  <label class="elc-label" for="FinalDestination">Final Destination</label>
                  <div class="elc-control">
                    <input id="FinalDestination" name="FinalDestination" type="text" class="form-control" data-editable="true" />
                  </div>

                  <label class="elc-label" for="GoodsType">Goods Type</label>
                  <div class="elc-control">
                    <select id="GoodsType" name="GoodsType" class="form-select" data-editable="true">
                      <option value="" selected>--Select--</option>
                    </select>
                  </div>

                  <label class="elc-label" for="PermitCreditDebitAccount">Permit Credit/Debit Account</label>
                  <div class="elc-control elc-control--span-all">
                    <div class="input-group elc-input-group" aria-label="Permit account lookup">
                      <input id="PermitCreditDebitAccount" name="PermitCreditDebitAccount" type="text" class="form-control" data-editable="true" />
                      <button class="btn btn-outline-secondary" type="button" data-lookup="permitAccount" aria-label="Search permit credit/debit account">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Documents -->
            <div class="tab-pane fade" id="fpr-pane-documents" role="tabpanel" aria-labelledby="fpr-tab-documents" tabindex="0">
              <div class="elc-section">
                <div class="elc-sectionbar">Document Details</div>
                <div class="elc-form-grid elc-form-grid--two">
                  <label class="elc-label" for="DocumentID">Document ID</label>
                  <div class="elc-control">
                    <div class="input-group elc-input-group elc-input-group--single" aria-label="Document lookup">
                      <input id="DocumentID" name="DocumentID" type="text" class="form-control" data-editable="true" />
                      <button class="btn btn-outline-secondary" type="button" data-lookup="document" aria-label="Search document">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>

                  <label class="elc-label" for="DocumentNumber">Document Number</label>
                  <div class="elc-control">
                    <input id="DocumentNumber" name="DocumentNumber" type="text" class="form-control" data-editable="true" />
                  </div>

                  <label class="elc-label" for="DocumentType">Document Type</label>
                  <div class="elc-control">
                    <select id="DocumentType" name="DocumentType" class="form-select" data-editable="true">
                      <option value="Original" selected>Original</option>
                      <option value="Copy">Copy</option>
                    </select>
                  </div>

                  <label class="elc-label" for="Location">Location</label>
                  <div class="elc-control">
                    <select id="Location" name="Location" class="form-select" data-editable="true">
                      <option value="" selected>--Select--</option>
                    </select>
                  </div>

                  <label class="elc-label" for="DocumentImage">Document Image</label>
                  <div class="elc-control">
                    <div class="input-group elc-input-group">
                      <input id="DocumentImage" name="DocumentImage" type="text" class="form-control" readonly aria-label="Document image path" />
                      <button class="btn btn-outline-secondary" type="button" data-fpr-browse-image>Browse</button>
                    </div>
                  </div>

                  <label class="elc-label" for="Remarks">Remarks</label>
                  <div class="elc-control elc-control--span-all">
                    <input id="Remarks" name="Remarks" type="text" class="form-control" data-editable="true" />
                  </div>

                  <label class="elc-label" for="ReceivedBy">Received By</label>
                  <div class="elc-control">
                    <div class="input-group elc-input-group" aria-label="Received by lookup">
                      <input id="ReceivedBy" name="ReceivedBy" type="text" class="form-control" data-editable="true" />
                      <button class="btn btn-outline-secondary" type="button" data-lookup="receivedBy" aria-label="Search received by">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>

                  <label class="elc-label" for="ReceivedDate">Received Date</label>
                  <div class="elc-control">
                    <input id="ReceivedDate" name="ReceivedDate" type="date" class="form-control" data-editable="true" />
                  </div>
                </div>

                <div class="elc-toolbar" role="toolbar" aria-label="Document actions">
                  <button type="button" class="btn btn-sm btn-secondary" data-fpr-doc-action="new" disabled>New</button>
                  <button type="button" class="btn btn-sm btn-secondary" data-fpr-doc-action="alter" disabled>Alter</button>
                  <button type="button" class="btn btn-sm btn-secondary" data-fpr-doc-action="remove" disabled>Remove</button>
                  <button type="button" class="btn btn-sm btn-secondary" data-fpr-doc-action="update" disabled>Update</button>
                  <button type="button" class="btn btn-sm btn-secondary" data-fpr-doc-action="clear" disabled>Clear</button>
                </div>

                <div class="elc-tablewrap" aria-label="Documents list">
                  <table class="table table-sm table-bordered mb-0 elc-table">
                    <thead>
                      <tr>
                        <th scope="col">DocumentID</th>
                        <th scope="col">Document Type Name</th>
                        <th scope="col">LocationID Name</th>
                        <th scope="col">Remarks</th>
                        <th scope="col">Received By</th>
                        <th scope="col">Received Date</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="6" class="text-muted">No records to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Additional Information -->
            <div class="tab-pane fade" id="fpr-pane-additional" role="tabpanel" aria-labelledby="fpr-tab-additional" tabindex="0">
              <div class="elc-section">
                <div class="elc-sectionbar">Additional Information</div>
                <div class="elc-form-grid elc-form-grid--one">

                  <label class="elc-label" for="SupplierAddress4">Address 4</label>
                  <div class="elc-control">
                    <textarea id="SupplierAddress4" name="SupplierAddress4" class="form-control elc-textarea" rows="2" data-editable="true"></textarea>
                  </div>

              </div>

              <div class="elc-section mt-2">
