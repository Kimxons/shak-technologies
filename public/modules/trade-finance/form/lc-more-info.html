<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LC More Info · Trade Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/trade-finance.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --lc-popout-width: 1120px;
      --lc-popout-height: 640px;
      --lc-actions-width: 180px;
      --lc-legacy-blue: #0b77c5;
      --lc-legacy-blue-2: #0a6ab0;
      --lc-legacy-bg: #eaf4ff;
      --lc-legacy-border: #7fb3dd;
    }

    html,
    body {
      height: 100%;
      background: transparent;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Poppins", system-ui, -apple-system, sans-serif;
      color: #0f2e4f;
    }

    .lc-popout-root {
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
    }

    .lc-popout {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--lc-actions-width);
      gap: 12px;
      min-width: 0;
      min-height: 0;
    }

    .lc-main {
      background: var(--lc-legacy-bg);
      border: 1px solid var(--lc-legacy-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      min-height: 0;
    }

    #lcMoreInfoForm {
      overflow: auto;
      min-height: 0;
    }

    .lc-titlebar {
      background: var(--lc-legacy-blue);
      color: #fff;
      font-weight: 600;
      padding: 6px 10px;
      font-size: 0.95rem;
    }

    .lc-section {
      border-top: 3px solid var(--lc-legacy-blue-2);
      border-left: 1px solid var(--lc-legacy-border);
      border-right: 1px solid var(--lc-legacy-border);
      border-bottom: 1px solid var(--lc-legacy-border);
      background: #f6fbff;
      margin: 10px;
    }

    .lc-section__header {
      background: var(--lc-legacy-blue);
      color: #fff;
      font-weight: 600;
      padding: 4px 10px;
      font-size: 0.9rem;
    }

    button.lc-section__header {
      width: 100%;
      text-align: left;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button.lc-section__header:focus {
      outline: none;
      box-shadow: none;
    }

    .lc-bts-caret {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      color: #ffffff;
    }

    .lc-bts-caret .bi-caret-up-fill {
      display: none;
    }

    button.lc-section__header[aria-expanded="true"] .lc-bts-caret .bi-caret-down-fill {
      display: none;
    }

    button.lc-section__header[aria-expanded="true"] .lc-bts-caret .bi-caret-up-fill {
      display: inline-block;
    }

    .lc-grid {
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 160px 1fr 160px 1fr 40px;
      gap: 8px 10px;
      align-items: center;
    }

    .lc-label {
      font-weight: 800;
      color: #4169E1;
      font-size: 0.9rem;
      text-align: right;
      padding-right: 6px;
      white-space: nowrap;
    }

    .lc-input,
    .lc-select {
      height: 34px;
      border: 1px solid #b9cff1;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.95rem;
      background: #fff;
      width: 100%;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-weight: 700;
      text-transform: none;
    }

    .lc-input:focus,
    .lc-select:focus {
      outline: none;
      border-color: #2f67ff;
      box-shadow: 0 0 0 3px rgba(47, 103, 255, 0.18);
    }

    .lc-input[disabled],
    .lc-select[disabled] {
      background: #eef5fb;
      color: #3b4a58;
    }

    .lc-input--span {
      grid-column: 2 / span 3;
    }

    .lc-lookup {
      width: 38px;
      height: 34px;
      border: none;
      border-radius: 4px;
      background: linear-gradient(135deg, #2f7bff, #2a63ff);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 0 2px 6px rgba(33, 82, 200, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }

    .lc-lookup i {
      color: #fff;
      font-size: 1rem;
    }

    .lc-lookup:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(33, 82, 200, 0.4);
    }

    .lc-lookup:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(33, 82, 200, 0.35);
    }

    .lc-lookup:disabled {
      opacity: 0.6;
      filter: grayscale(0.1);
      box-shadow: none;
    }

    .lc-category {
      padding: 10px 12px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
      align-items: center;
    }

    .lc-category .form-check {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #0a3a66;
    }

    .lc-actions {
      display: grid;
      grid-auto-rows: min-content;
      gap: 8px;
      align-content: end;
      padding: 54px 8px 8px;
      height: 100%;
    }

    .lc-actions .btn {
      width: 100%;
      height: 34px;
      font-weight: 600;
    }

    .lc-actions .btn-outline-secondary {
      background: #f3f5f7;
    }

    .lc-status {
      padding: 6px 12px;
      border-top: 1px solid var(--lc-legacy-border);
      color: #c70000;
      font-weight: 700;
      background: #dff0ff;
      margin: 0 10px 10px;
      position: sticky;
      bottom: 0;
    }

    .lc-bts-grid {
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr) 140px minmax(0, 1fr) 140px minmax(0, 1fr);
      gap: 8px 10px;
      align-items: center;
    }

    .lc-toast {
      margin: 0 10px;
      display: none;
    }

    .lc-toast.is-visible {
      display: block;
    }

    /* Overdraft-like 2-column field grid (override legacy grid) */
    .lc-grid.form-grid.two-col {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 16px;
      align-items: start;
    }
  </style>
</head>

<body class="copilot-theme" data-page="lc-more-info">
  <div class="lc-popout-root">
    <div class="lc-popout" role="application" aria-label="LC More Info popout window">
      <section class="lc-main" aria-label="LC More Info">
        <form id="lcMoreInfoForm" autocomplete="off" novalidate>
          <section class="lc-section" aria-label="Identifiers">
            <div class="lc-grid form-grid two-col">
              <div class="form-control-group">
                <label class="form-label" for="BranchID"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></label>
                <div class="input-segmented" aria-label="Branch lookup">
                  <input class="form-control segment-id" id="BranchID" name="BranchID" type="text" value="" required data-editable="true" />
                  <div class="segment-divider" aria-hidden="true"></div>
                  <input class="form-control segment-desc" id="BranchName" name="BranchName" type="text" value="" readonly aria-label="Branch name" />
                </div>
              </div>

              <div class="form-control-group">
                <label class="form-label" for="ApplicationID"><i class="bi bi-card-heading" aria-hidden="true"></i><span>Application ID</span></label>
                <input class="form-control" id="ApplicationID" name="ApplicationID" type="text" value="" required data-editable="true" />
              </div>

              <div class="form-control-group full-row">
                <label class="form-label" for="DescriptionOfGoods"><i class="bi bi-box-seam" aria-hidden="true"></i><span>Description Of Goods</span></label>
                <input class="form-control" id="DescriptionOfGoods" name="DescriptionOfGoods" type="text" data-editable="true" />
              </div>
            </div>
          </section>

          <section class="lc-section" aria-label="LC Category">
            <div class="lc-section__header">LC Catagory</div>
            <div class="lc-category">
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="Revocable" name="LCRevocable" data-editable="true" />
                <span class="form-check-label">Revocable</span>
              </label>
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="IRevocable" name="LCIrrevocable" data-editable="true" />
                <span class="form-check-label">Irrevocable</span>
              </label>
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="Revolving" name="LCRevolving" data-editable="true" />
                <span class="form-check-label">Revolving</span>
              </label>
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="Confirmed" name="LCConfirmed" data-editable="true" />
                <span class="form-check-label">Confirmed</span>
              </label>
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="Transferable" name="LCTransferable" data-editable="true" />
                <span class="form-check-label">Transferable</span>
              </label>
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="TransShipment" name="LCTransShipment" data-editable="true" />
                <span class="form-check-label">Trans Shipment</span>
              </label>
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="PartialShipment" name="LCPartialShipment" data-editable="true" />
                <span class="form-check-label">Partial Shipment</span>
              </label>
              <div></div>
            </div>
          </section>

          <section class="lc-section" aria-label="Shipment details">
            <div class="lc-grid form-grid two-col">
              <div class="form-control-group">
                <label class="form-label" for="CountryOfOrigin"><i class="bi bi-globe" aria-hidden="true"></i><span>Country Of Origin</span></label>
                <select class="form-select" id="CountryOfOrigin" name="CountryOfOrigin" data-editable="true">
                  <option value="" selected>--Select--</option>
                  <option value="KE">Kenya</option>
                  <option value="UG">Uganda</option>
                  <option value="TZ">Tanzania</option>
                  <option value="RW">Rwanda</option>
                </select>
              </div>

              <div class="form-control-group">
                <label class="form-label" for="ShipmentBy"><i class="bi bi-truck" aria-hidden="true"></i><span>Shipment By</span></label>
                <input class="form-control" id="ShipmentBy" name="ShipmentBy" type="text" data-editable="true" />
              </div>

              <div class="form-control-group full-row">
                <label class="form-label" for="ShipmentFrom"><i class="bi bi-arrow-up-circle" aria-hidden="true"></i><span>Shipment From</span></label>
                <input class="form-control" id="ShipmentFrom" name="ShipmentFrom" type="text" data-editable="true" />
              </div>

              <div class="form-control-group full-row">
                <label class="form-label" for="ShipmentTo"><i class="bi bi-arrow-down-circle" aria-hidden="true"></i><span>Shipment To</span></label>
                <input class="form-control" id="ShipmentTo" name="ShipmentTo" type="text" data-editable="true" />
              </div>

              <div class="form-control-group full-row">
                <label class="form-label" for="ShipmentMarks"><i class="bi bi-tag" aria-hidden="true"></i><span>Shipment Marks</span></label>
                <input class="form-control" id="ShipmentMarks" name="ShipmentMarks" type="text" data-editable="true" />
              </div>

              <div class="form-control-group">
                <label class="form-label" for="ShipmentDate"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>Shipment Date</span></label>
                <input class="form-control" id="ShipmentDate" name="ShipmentDate" type="date" data-editable="true" />
              </div>

              <div class="form-control-group">
                <label class="form-label" for="LastShipmentDateAllowed"><i class="bi bi-calendar-x" aria-hidden="true"></i><span>Last Shipment Date Allowed</span></label>
                <input class="form-control" id="LastShipmentDateAllowed" name="LastShipmentDateAllowed" type="date" data-editable="true" />
              </div>
            </div>
          </section>

          <div id="lcMoreInfoToast" class="alert alert-info lc-toast" role="status" aria-live="polite"></div>

          <section class="lc-section" aria-label="Behind the scene">
            <button type="button" class="lc-section__header" data-bs-toggle="collapse" data-bs-target="#lcMoreInfoBts"
              aria-expanded="false" aria-controls="lcMoreInfoBts">
              <i class="bi bi-eye-fill me-2" aria-hidden="true"></i><span>Behind The Scene</span>
              <span class="lc-bts-caret" aria-hidden="true">
                <i class="bi bi-caret-down-fill"></i>
                <i class="bi bi-caret-up-fill"></i>
              </span>
            </button>
            <div id="lcMoreInfoBts" class="collapse">
              <div class="lc-bts-grid form-grid two-col">
              <div class="form-control-group">
                <label class="form-label" for="CreatedBy"><i class="bi bi-person" aria-hidden="true"></i><span>Created By</span></label>
                <input class="form-control" id="CreatedBy" name="CreatedBy" type="text" readonly />
              </div>
              <div class="form-control-group">
                <label class="form-label" for="ModifiedBy"><i class="bi bi-person" aria-hidden="true"></i><span>Modified By</span></label>
                <input class="form-control" id="ModifiedBy" name="ModifiedBy" type="text" readonly />
              </div>
              <div class="form-control-group">
                <label class="form-label" for="SupervisedBy"><i class="bi bi-person" aria-hidden="true"></i><span>Supervised By</span></label>
                <input class="form-control" id="SupervisedBy" name="SupervisedBy" type="text" readonly />
              </div>
              <div class="form-control-group">
                <label class="form-label" for="CreatedOn"><i class="bi bi-calendar" aria-hidden="true"></i><span>Created On</span></label>
                <input class="form-control" id="CreatedOn" name="CreatedOn" type="text" readonly />
              </div>
              <div class="form-control-group">
                <label class="form-label" for="ModifiedOn"><i class="bi bi-calendar" aria-hidden="true"></i><span>Modified On</span></label>
                <input class="form-control" id="ModifiedOn" name="ModifiedOn" type="text" readonly />
              </div>
              <div class="form-control-group">
                <label class="form-label" for="SupervisedOn"><i class="bi bi-calendar" aria-hidden="true"></i><span>Supervised On</span></label>
                <input class="form-control" id="SupervisedOn" name="SupervisedOn" type="text" readonly />
              </div>
              </div>
            </div>
          </section>

          <div class="lc-status" id="lcMoreInfoStatus" role="status" aria-live="polite">&nbsp;</div>
        </form>
      </section>

      <aside class="lc-actions" aria-label="Actions">
        <button type="button" class="elc-legacy-action" data-action="add">
          <i class="bi bi-plus-circle" aria-hidden="true"></i>
          <span>Add</span>
        </button>
        <button type="button" class="elc-legacy-action" data-action="edit" disabled>
          <i class="bi bi-pencil-fill" aria-hidden="true"></i>
          <span>Edit</span>
        </button>
        <button type="button" class="elc-legacy-action" data-action="delete" disabled>
          <i class="bi bi-trash-fill" aria-hidden="true"></i>
          <span>Delete</span>
        </button>
        <button type="button" class="elc-legacy-action" data-action="save" disabled>
          <i class="bi bi-save-fill" aria-hidden="true"></i>
          <span>Save</span>
        </button>
        <button type="button" class="elc-legacy-action" data-action="cancel" disabled>
          <i class="bi bi-x-circle" aria-hidden="true"></i>
          <span>Cancel</span>
        </button>
        <div style="height: 12px;"></div>
        <button type="button" class="elc-legacy-action" data-action="back">
          <i class="bi bi-arrow-left-circle" aria-hidden="true"></i>
          <span>Back</span>
        </button>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/trade-finance/tradeFinanceService.js"></script>
  <script src="../js/lc-more-info.js"></script>
</body>

</html>
