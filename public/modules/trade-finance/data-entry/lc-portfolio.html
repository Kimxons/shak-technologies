<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC Portfolio</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../overdraft-application/overdraft-application.css">
</head>
<body style="background: #f5f7fa; margin: 0; padding: 0;">
    <div class="module-shell" style="min-height: 100vh;">
        <div class="module-layout" style="display: grid; grid-template-columns: 1fr 120px; min-height: 100vh; background: rgba(255, 255, 255, 0.85); align-items: flex-start;">
            <main class="content" role="main" style="padding: 16px; flex: 1;">
                <section class="card">
                    <div class="card-body">
                        <table class="data-table" style="width: 100%; font-size: 13px;">
                            <thead>
                                <tr>
                                    <th>Application ID</th>
                                    <th>LC Number</th>
                                    <th>Expiry Date</th>
                                    <th>Amount</th>
                                    <th>Application Status</th>
                                    <th>Value Date</th>
                                    <th>Currency ID</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1020240002</td>
                                    <td>LC/2024/2</td>
                                    <td>2024/11/13</td>
                                    <td style="text-align: right;">20953</td>
                                    <td>Approved</td>
                                    <td>2024/08/15</td>
                                    <td>USD</td>
                                </tr>
                                <tr>
                                    <td>1020250049</td>
                                    <td>TSD/IBO/LCL-00016/2025</td>
                                    <td>2025/02/23</td>
                                    <td style="text-align: right;">10000</td>
                                    <td>Approved</td>
                                    <td>2025/01/24</td>
                                    <td>USD</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>

            <aside class="action-bar" aria-label="Actions">
                <button class="action-btn view" data-action="back">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    <span>Back</span>
                </button>
            </aside>
        </div>
    </div>

    <script src="../../../assets/js/pages/trade-finance/data-entry/lc-portfolio.embedded.js"></script>
</body>
</html>
