<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC Extension History</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../overdraft-application/overdraft-application.css">
</head>
<body style="background: #f5f7fa; margin: 0; padding: 0;">
    <div class="module-shell" style="min-height: 100vh;">
        <div class="module-layout" style="display: grid; grid-template-columns: 1fr 120px; min-height: 100vh; background: rgba(255, 255, 255, 0.85); align-items: flex-start;">
            <main class="content" role="main" style="padding: 16px; flex: 1;">
                <section class="card">
                    <div class="card-body">
                        <table class="data-table" style="width: 100%; font-size: 13px;">
                            <thead>
                                <tr>
                                    <th>Application ID</th>
                                    <th>Extension Date</th>
                                    <th>Original Expiry</th>
                                    <th>New Expiry</th>
                                    <th>Extension Days</th>
                                    <th>Status</th>
                                    <th>Created By</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="7" style="text-align: left; padding: 16px; color: #2c3e50;">No records to display.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>

            <aside class="action-bar" aria-label="Actions">
                <button class="action-btn view" data-action="back">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    <span>Back</span>
                </button>
            </aside>
        </div>
    </div>

    <script src="../../../assets/js/pages/trade-finance/data-entry/lc-extension-history.embedded.js"></script>
</body>
</html>
