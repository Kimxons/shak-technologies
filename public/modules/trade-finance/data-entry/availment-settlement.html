<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availment(Settlement)</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../overdraft-application/overdraft-application.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout" style="grid-template-columns: 1fr 120px;">
            <main class="content" role="main" style="padding: 16px;">
                <section class="card">
                    <div class="card-body">
                        <div class="form-grid" style="grid-template-columns: repeat(2, 1fr); gap: 12px;">
                            <div class="form-control-group">
                                <label for="applicationId" class="form-label" style="color: #0000FF; font-weight: 600;"><span>Application ID</span></label>
                                <div class="input-segmented">
                                    <input type="text" id="applicationId" name="applicationId" class="form-control" value="1020240002">
                                    <button type="button" class="btn-search" aria-label="Search Application ID">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-control-group">
                                <label for="referenceNo" class="form-label"><span>Reference No.</span></label>
                                <input type="text" id="referenceNo" name="referenceNo" class="form-control" value="LC/2024/2" readonly>
                            </div>

                            <div class="form-control-group" style="grid-column: span 2;">
                                <label for="clientId" class="form-label" style="color: #0000FF; font-weight: 600;"><span>Client ID</span></label>
                                <div style="display: flex; gap: 8px; align-items: center;">
                                    <input type="text" id="clientId" name="clientId" class="form-control" value="2308007382" readonly style="width: 150px;">
                                    <input type="text" id="clientName" name="clientName" class="form-control" value="SUNCITY ENGINEERING AND TRADING PRIVATE LIMITED COMPANY" readonly style="flex: 1;">
                                    <button type="button" class="btn-search" aria-label="Search Client ID" style="padding: 6px 12px; height: 32px;">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-control-group" style="grid-column: span 2;">
                                <label for="accountId" class="form-label" style="color: #0000FF; font-weight: 600;"><span>Account ID</span></label>
                                <div style="display: flex; gap: 8px; align-items: center;">
                                    <input type="text" id="accountId" name="accountId" class="form-control" value="0104370000003" readonly style="width: 150px;">
                                    <input type="text" id="accountName" name="accountName" class="form-control" value="SUNCITY ENGINEERING AND TRADING PRIVATE LIMITED COMPANY" readonly style="flex: 1;">
                                    <button type="button" class="btn-search" aria-label="Search Account ID" style="padding: 6px 12px; height: 32px;">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div style="margin-top: 16px;">
                    <ul class="nav nav-tabs" style="border-bottom: 2px solid #2b7abf; margin: 0; padding: 0; list-style: none; display: flex;">
                        <li style="margin: 0;">
                            <button class="nav-link active" style="background: #2b7abf; color: white; border: none; padding: 8px 16px; cursor: pointer; font-weight: 600;">Settlement Details</button>
                        </li>
                        <li style="margin: 0;">
                            <button class="nav-link" style="background: #e8eef5; color: #2c3e50; border: none; padding: 8px 16px; cursor: pointer;">Documents</button>
                        </li>
                    </ul>
                </div>

                <section class="card" style="margin-top: 0; border-top-left-radius: 0;">
                    <div class="card-header" style="background: #2b7abf; color: white; padding: 8px 12px;">
                        <span>Settlement Details</span>
                    </div>
                    <div class="card-body">
                        <div class="form-grid" style="grid-template-columns: repeat(2, 1fr); gap: 12px;">
                            <div class="form-control-group">
                                <label for="trxCurrencyId" class="form-label" style="color: #0000FF; font-weight: 600;"><span>Trx CurrencyID</span></label>
                                <div class="input-segmented">
                                    <input type="text" id="trxCurrencyId" name="trxCurrencyId" class="form-control">
                                    <button type="button" class="btn-search" aria-label="Search Currency ID">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-control-group">
                                <label for="availmentType" class="form-label"><span>Availment Type</span></label>
                                <select id="availmentType" name="availmentType" class="form-control">
                                    <option value="Payment" selected>Payment</option>
                                </select>
                            </div>

                            <div class="form-control-group" style="grid-column: span 2;">
                                <label for="nostroAccount" class="form-label"><span>Nostro Account</span></label>
                                <div class="input-segmented">
                                    <input type="text" id="nostroAccount" name="nostroAccount" class="form-control" style="flex: 1;">
                                    <button type="button" class="btn-search" aria-label="Search Nostro Account">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-control-group">
                                <label for="amount" class="form-label" style="color: #0000FF; font-weight: 600;"><span>Amount</span></label>
                                <input type="text" id="amount" name="amount" class="form-control" value="20,953.00" style="text-align: right;">
                            </div>
                            <div class="form-control-group">
                                <label for="localAmount" class="form-label"><span>Local Amount</span></label>
                                <input type="text" id="localAmount" name="localAmount" class="form-control" value="2,442,229.30" style="text-align: right;">
                            </div>

                            <div class="form-control-group">
                                <label for="exchangeRate" class="form-label"><span>Exchange Rate</span></label>
                                <input type="text" id="exchangeRate" name="exchangeRate" class="form-control">
                            </div>
                            <div class="form-control-group">
                                <label for="interestRate" class="form-label"><span>Interest Rate</span></label>
                                <input type="text" id="interestRate" name="interestRate" class="form-control">
                            </div>

                            <div class="form-control-group">
                                <label for="liabilityAmount" class="form-label" style="color: #0000FF; font-weight: 600;"><span>Liability Amount</span></label>
                                <input type="text" id="liabilityAmount" name="liabilityAmount" class="form-control">
                            </div>
                            <div class="form-control-group">
                                <label for="fxPermitNumber" class="form-label"><span>FX Permit Number</span></label>
                                <div class="input-segmented">
                                    <input type="text" id="fxPermitNumber" name="fxPermitNumber" class="form-control">
                                    <button type="button" class="btn-search" aria-label="Search FX Permit Number">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-control-group">
                                <label for="accountType" class="form-label"><span>Account Type</span></label>
                                <select id="accountType" name="accountType" class="form-control">
                                    <option value="Customer" selected>Customer</option>
                                </select>
                            </div>
                            <div class="form-control-group"></div>

                            <div class="form-control-group" style="grid-column: span 2;">
                                <label for="settlementAccountId" class="form-label"><span>Settlement AccountID</span></label>
                                <div style="display: flex; gap: 8px;">
                                    <input type="text" id="settlementAccountId" name="settlementAccountId" class="form-control" value="2308390000013" style="width: 150px;">
                                    <input type="text" id="settlementAccountDetails" name="settlementAccountDetails" class="form-control" style="flex: 1;">
                                    <button type="button" class="btn-search" aria-label="Search Settlement Account ID" style="padding: 6px 12px; height: 32px;">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-control-group" style="grid-column: span 2;">
                                <label for="remarks" class="form-label"><span>Remarks</span></label>
                                <textarea id="remarks" name="remarks" class="form-control" rows="2"></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card" style="margin-top: 16px;">
                    <div class="card-header" style="background: #2b7abf; color: white; padding: 8px 12px;">
                        <span>TransactionDetails</span>
                    </div>
                    <div class="card-body">
                        <table class="data-table" style="width: 100%; font-size: 13px;">
                            <thead>
                                <tr>
                                    <th>Component</th>
                                    <th>CR AccountID</th>
                                    <th>CrAccountName</th>
                                    <th>DrAcco...</th>
                                    <th>DR AccountID</th>
                                    <th>DrAccountNa...</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="empty-row">
                                    <td colspan="6" style="text-align: left; padding: 12px;">No records to display.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="card" style="margin-top: 16px;">
                    <div class="card-header" style="background: #2b7abf; color: white; padding: 8px 12px;">
                        <span>Behind The Scene</span>
                    </div>
                    <div class="card-body">
                        <div class="form-grid" style="grid-template-columns: repeat(2, 1fr); gap: 12px;">
                            <div class="form-control-group">
                                <label for="lcAmount" class="form-label"><span>LC Amount</span></label>
                                <input type="text" id="lcAmount" name="lcAmount" class="form-control" readonly>
                            </div>
                            <div class="form-control-group">
                                <label for="settledAmount" class="form-label"><span>Settled Amount</span></label>
                                <input type="text" id="settledAmount" name="settledAmount" class="form-control" value="0.00" style="text-align: right;" readonly>
                            </div>

                            <div class="form-control-group">
                                <label for="outstandingSettlementAmount" class="form-label"><span>Outstanding Settlement Amount</span></label>
                                <input type="text" id="outstandingSettlementAmount" name="outstandingSettlementAmount" class="form-control" value="20,953.00" style="text-align: right;" readonly>
                            </div>
                            <div class="form-control-group">
                                <label for="marginAmountPercentage" class="form-label"><span>Margin Amount/Percentage</span></label>
                                <input type="text" id="marginAmountPercentage" name="marginAmountPercentage" class="form-control" value="100.00" style="text-align: right;" readonly>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <aside class="action-bar" aria-label="Actions">
                <button class="action-btn view" data-action="back">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    <span>Back</span>
                </button>
                <button class="action-btn view" data-action="approve">
                    <i class="bi bi-check-circle" aria-hidden="true"></i>
                    <span>Approve</span>
                </button>
                <button class="action-btn cancel" data-action="reject">
                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                    <span>Reject</span>
                </button>
                <button class="action-btn view" data-action="charges">
                    <i class="bi bi-currency-dollar" aria-hidden="true"></i>
                    <span>Charges</span>
                </button>
                <button class="action-btn view" data-action="swift">
                    <i class="bi bi-envelope" aria-hidden="true"></i>
                    <span>Swift Message</span>
                </button>
                <button class="action-btn view" data-action="showimage">
                    <i class="bi bi-image" aria-hidden="true"></i>
                    <span>ShowImage</span>
                </button>
                <button class="action-btn view" data-action="view">
                    <i class="bi bi-eye-fill" aria-hidden="true"></i>
                    <span>View</span>
                </button>
                <button class="action-btn add" data-action="add">
                    <i class="bi bi-plus-circle" aria-hidden="true"></i>
                    <span>Add</span>
                </button>
                <button class="action-btn edit" data-action="edit">
                    <i class="bi bi-pencil-fill" aria-hidden="true"></i>
                    <span>Edit</span>
                </button>
                <button class="action-btn save" data-action="save">
                    <i class="bi bi-save-fill" aria-hidden="true"></i>
                    <span>Save</span>
                </button>
                <button class="action-btn cancel" data-action="cancel">
                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                    <span>Cancel</span>
                </button>
            </aside>
        </div>
    </div>

    <script src="../../../assets/js/pages/trade-finance/data-entry/availment-settlement.embedded.js"></script>
</body>
</html>
