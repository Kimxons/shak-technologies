<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Credit Risk Acceptance · SPM Score Classification</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body data-page="spm-score-classification">
  <div class="window">
    <div class="am-header" hidden role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-list-check am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Credit Risk Acceptance · SPM Score Classification</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container sidebar-collapsed" aria-label="SPM Score Classification">
      <!-- Left Sidebar -->
      <div class="sidebar collapsed" id="main-sidebar" aria-label="Options menu">
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-shield-check" aria-hidden="true"></i>SPM</span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">
            <i class="bi bi-list" aria-hidden="true"></i>
          </button>
        </div>

        <div class="sidebar-content" role="navigation" aria-label="Submodules">
          <div class="nav-section nav-section--card is-open" data-nav-section data-section-name="Data Entry">
            <div class="nav-header nav-header--card is-open" data-spmral-toggle="dataentry-menu" aria-expanded="true">
              <div class="nav-header__content">
                <i class="bi bi-folder-fill nav-header__icon" aria-hidden="true"></i>
                <span class="nav-label nav-label--card">Data Entry</span>
              </div>
              <div class="nav-header__badge">
                <span class="nav-badge">2</span>
                <button type="button" class="nav-arrow nav-arrow--card" aria-label="Toggle Data Entry" aria-expanded="true" aria-controls="spmsc-nav-dataentry">
                  <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="nav-items nav-items--card" id="spmsc-nav-dataentry" data-spmral-subnav="dataentry-menu">
              <div class="sidebar-item sidebar-item--enhanced active" role="button" tabindex="0" aria-current="page" data-tooltip="SPM Score Classification">
                <div class="sidebar-item__content">
                  <i class="bi bi-list-check sidebar-item__icon" aria-hidden="true"></i>
                  <div class="sidebar-item__text">
                    <div class="sidebar-item__title">SPM Score Classification</div>
                    <div class="sidebar-item__description">Maintain score bands</div>
                  </div>
                </div>
              </div>

              <div class="sidebar-item sidebar-item--enhanced" role="button" tabindex="0" data-spmral-route="../views/SPMRiskAcceptanceLevel.html" aria-label="Open Risk Acceptance Level" data-tooltip="Risk Acceptance Level">
                <div class="sidebar-item__content">
                  <i class="bi bi-shield-check sidebar-item__icon" aria-hidden="true"></i>
                  <div class="sidebar-item__text">
                    <div class="sidebar-item__title">Risk Acceptance Level</div>
                    <div class="sidebar-item__description">Maintain acceptance levels</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content" role="region" aria-label="SPM score classification content">
        <div class="form-card" data-main-form>
          <form autocomplete="off" novalidate>
            <div class="form-section" data-section="score-classification">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid" aria-hidden="true"></i>Score Classification</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Score Classification" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="scoreFrom">Score From</label>
                    <input id="scoreFrom" type="text" class="bs-input-text form-control" style="max-width: 180px;" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="scoreTo">Score To</label>
                    <input id="scoreTo" type="text" class="bs-input-text form-control" style="max-width: 180px;" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="scoreClassification">Score Classification</label>
                    <select id="scoreClassification" class="bs-select form-select" style="max-width: 180px;">
                      <option value="">--Select--</option>
                      <option value="1">Insignificant</option>
                      <option value="2">Average</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="scoreDecision">Score Decision</label>
                    <select id="scoreDecision" class="bs-select form-select" style="max-width: 180px;">
                      <option value="">--Select--</option>
                      <option value="1">Decline</option>
                      <option value="2">Accept</option>
                    </select>
                  </div>
                </div>

                <div class="form-action-buttons" aria-label="Score classification row actions">
                  <button type="button" class="btn-form-action"><i class="bi bi-plus-circle" aria-hidden="true"></i>New</button>
                  <button type="button" class="btn-form-action" disabled><i class="bi bi-check2-square" aria-hidden="true"></i>Add To List</button>
                  <button type="button" class="btn-form-action" disabled><i class="bi bi-pencil-square" aria-hidden="true"></i>Alter</button>
                  <button type="button" class="btn-form-action" disabled><i class="bi bi-trash" aria-hidden="true"></i>Remove</button>
                </div>

                <div class="form-section-table" role="region" aria-label="Score classification list">
                  <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                      <thead>
                        <tr>
                          <th scope="col">Score From</th>
                          <th scope="col">Score To</th>
                          <th scope="col">Score Classification</th>
                          <th scope="col">Score Decision</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td colspan="4" class="text-center py-3 text-muted">No records to display.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-gear" aria-hidden="true"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="behind-scene p-4 p-lg-5">
                  <div class="row gx-5 gy-4">
                    <div class="col-12 col-md-6 d-flex flex-column gap-4">
                      <div>
                        <label class="label-blue mb-2" for="scCreatedBy">Created By</label>
                        <input id="scCreatedBy" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Created By" />
                      </div>
                      <div>
                        <label class="label-blue mb-2" for="scCreatedOn">Created On</label>
                        <input id="scCreatedOn" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Created On" />
                      </div>
                    </div>

                    <div class="col-12 col-md-6 d-flex flex-column gap-4">
                      <div>
                        <label class="label-blue mb-2" for="scModifiedBy">Modified By</label>
                        <input id="scModifiedBy" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Modified By" />
                      </div>
                      <div>
                        <label class="label-blue mb-2" for="scModifiedOn">Modified On</label>
                        <input id="scModifiedOn" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Modified On" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Actions -->
      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button class="btn-action" type="button" title="Add" disabled><i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Add</button>
          <button class="btn-action" type="button" title="Edit" disabled><i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Edit</button>
          <button class="btn-action" type="button" title="Save" disabled><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Save</button>
          <button class="btn-action btn-cancel" type="button" title="Cancel" disabled data-spmsc-cancel><i class="bi bi-x-circle me-1" aria-hidden="true"></i>Cancel</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle" aria-hidden="true"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../assets/js/pages/other-modules/data-entry/SPMScoreClassification.embedded.js"></script>
  <script>
    (function initStandardShellBehavior() {
      function closeChildForm() {
        try {
          window.parent.postMessage({ type: 'submoduleClosed', source: 'SPM Score Classification' }, '*');
        } catch (_) {}
        try { window.close(); } catch (_) {}
      }

      function handleWindowAction(action) {
        if (action === 'refresh') {
          location.reload();
        } else if (action === 'maximize') {
          try {
            window.parent.postMessage({ type: 'toggleSidebarForMaximize' }, '*');
          } catch (_) {}
          document.querySelector('.window')?.classList.toggle('maximized');
        } else if (action === 'close') {
          closeChildForm();
        }
      }

      document.querySelectorAll('.am-header [data-action]').forEach((btn) => {
        const action = btn.getAttribute('data-action');
        if (['refresh', 'maximize', 'close'].includes(action)) {
          btn.addEventListener('click', () => handleWindowAction(action));
        }
      });

      const sidebarToggle = document.getElementById('sidebarToggle');
      sidebarToggle?.addEventListener('click', () => {
        const sidebar = document.getElementById('main-sidebar');
        const isCollapsed = sidebar?.classList.toggle('collapsed');
        sidebarToggle.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
        document.querySelector('.main-container')?.classList.toggle('sidebar-collapsed', !!isCollapsed);
      });

      document.querySelectorAll('[data-section-toggle]').forEach((header) => {
        header.addEventListener('click', () => {
          const section = header.closest('.form-section');
          if (!section) return;
          const content = section.querySelector('[data-section-content]');
          const btn = section.querySelector('.section-toggle-btn');
          if (!content || !btn) return;
          const isHidden = content.hasAttribute('hidden');
          if (isHidden) {
            content.removeAttribute('hidden');
            btn.setAttribute('aria-expanded', 'true');
            btn.querySelector('i')?.classList.remove('bi-chevron-down');
            btn.querySelector('i')?.classList.add('bi-chevron-up');
          } else {
            content.setAttribute('hidden', '');
            btn.setAttribute('aria-expanded', 'false');
            btn.querySelector('i')?.classList.remove('bi-chevron-up');
            btn.querySelector('i')?.classList.add('bi-chevron-down');
          }
        });
      });
    })();
  </script>
</body>

</html>
