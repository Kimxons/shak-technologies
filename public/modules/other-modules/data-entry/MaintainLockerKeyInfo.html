<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintain Locker · Locker KeyInfo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme maintain-locker maintain-locker-keyinfo" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerAccess.html">
              <span>Locker Access</span>
            </button>
            <button type="button" class="cm-legacy-nav__item is-active" aria-current="page">
              <span>Locker KeyInfo</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerClose.html">
              <span>Close Locker</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerSignatories.html">
              <span>Locker Signatories</span>
            </button>
          </div>
        </div>

      </aside>

      <section class="cm-legacy-content" aria-label="Locker KeyInfo content">
        <div class="cm-scroll-region">
          <section class="card-surface maintain-locker__group" aria-label="Locker Key Loss Details">
            <div class="maintain-locker__group-header">Locker Key Loss Details</div>
            <div class="maintain-locker__group-body">
              <div class="mlki-form">
                <div class="mlki-row">
                  <div class="mlki-label">Date</div>
                  <div class="mlki-field">
                    <div class="input-group mlki-date">
                      <select class="form-select" aria-label="Key loss date">
                        <option>29/Aug/2025</option>
                      </select>
                      <button class="btn btn-outline-primary" type="button" aria-label="Pick date">
                        <i class="bi bi-calendar-event"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="mlki-row">
                  <div class="mlki-label">Charge AccountID</div>
                  <div class="mlki-field">
                    <div class="input-group">
                      <input type="text" class="form-control" aria-label="Charge account ID" />
                      <input type="text" class="form-control" aria-label="Charge account name" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search charge account">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="mlki-row mlki-row--split">
                  <div class="mlki-label">Locker Key Lost Charges</div>
                  <div class="mlki-field">
                    <div class="mlki-split">
                      <input type="text" class="form-control mlki-short" value="0" aria-label="Locker key lost charges" />
                      <label class="form-check mlki-check" for="waiverCharges">
                        <input class="form-check-input" type="checkbox" id="waiverCharges" />
                        <span class="form-check-label">Waiver Charges</span>
                      </label>
                    </div>
                  </div>
                </div>

                <div class="mlki-row">
                  <div class="mlki-label">Remarks</div>
                  <div class="mlki-field">
                    <input type="text" class="form-control" aria-label="Remarks" />
                  </div>
                </div>

                <div class="mlki-row">
                  <div class="mlki-label">Instructed By</div>
                  <div class="mlki-field">
                    <div class="mlki-inline">
                      <input type="text" class="form-control mlki-short" aria-label="Instructed by" />
                      <div class="mlki-spacer"></div>
                      <button type="button" class="btn mlki-inline-action" disabled>Key Lost</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div class="maintain-locker__grid" role="region" aria-label="Key loss history">
            <table class="table table-sm mb-0">
              <thead>
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col">OldKey</th>
                  <th scope="col">NewKey</th>
                  <th scope="col">Charges</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="4" class="text-muted">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <section class="card-surface maintain-locker__group mt-3" aria-label="Locker Key Issue Details">
            <div class="maintain-locker__group-header">Locker Key Issue Details</div>
            <div class="maintain-locker__group-body">
              <div class="mlki-form">
                <div class="mlki-row mlki-row--two">
                  <div class="mlki-label">Date</div>
                  <div class="mlki-field">
                    <div class="input-group mlki-date">
                      <select class="form-select" aria-label="Key issue date">
                        <option>--Select--</option>
                      </select>
                      <button class="btn btn-outline-primary" type="button" aria-label="Pick date">
                        <i class="bi bi-calendar-event"></i>
                      </button>
                    </div>
                  </div>

                  <div class="mlki-label">New Key</div>
                  <div class="mlki-field">
                    <input type="text" class="form-control mlki-short" aria-label="New key" />
                  </div>
                </div>

                <div class="mlki-row mlki-row--two">
                  <div class="mlki-label">Old Key</div>
                  <div class="mlki-field">
                    <input type="text" class="form-control mlki-short" aria-label="Old key" />
                  </div>

                  <div class="mlki-label">Instructed By</div>
                  <div class="mlki-field">
                    <div class="mlki-inline">
                      <input type="text" class="form-control mlki-short" aria-label="Instructed by" />
                      <div class="mlki-spacer"></div>
                      <button type="button" class="btn mlki-inline-action" disabled>Found / Issue New Key</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="card-surface maintain-locker__group mt-3" aria-label="Behind The Scene">
            <div class="maintain-locker__group-header">Behind The Scene</div>
            <div class="maintain-locker__group-body">
              <div class="row g-2">
                <div class="col-12 col-lg-4">
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="createdBy">Created By</label>
                        <input id="createdBy" type="text" class="form-control" />
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="createdOn">Created On</label>
                        <input id="createdOn" type="text" class="form-control" />
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="modifiedBy">Modified By</label>
                        <input id="modifiedBy" type="text" class="form-control" />
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="modifiedOn">Modified On</label>
                        <input id="modifiedOn" type="text" class="form-control" />
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="supervisedBy">Supervised By</label>
                        <input id="supervisedBy" type="text" class="form-control" />
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="supervisedOn">Supervised On</label>
                        <input id="supervisedOn" type="text" class="form-control" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action">Add</button>
          <button type="button" class="cm-shell__action" disabled>Edit</button>
          <button type="button" class="cm-shell__action" disabled>Save</button>
          <button type="button" class="cm-shell__action" disabled>Cancel</button>
          <button type="button" class="cm-shell__action" data-ml-back>Back</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/other-modules/data-entry/MaintainLockerKeyInfo.embedded.js"></script>
</body>

</html>
