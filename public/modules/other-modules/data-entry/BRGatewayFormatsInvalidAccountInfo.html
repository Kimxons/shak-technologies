    <span class="cm-react-orb cm-react-orb--accent"></span>

    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="BR Gateway Formats navigation">
        <div class="cm-nav-section">

            </button>

            <div class="brgf-subnav" data-brgf-subnav="dataentry-menu">
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="../views/BRGatewayFormats.html"
                onclick="location.href='../views/BRGatewayFormats.html'"><span>Format Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="BRGatewayFormatsInFieldDetails.html"
                onclick="location.href='BRGatewayFormatsInFieldDetails.html'"><span>In Field Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="BRGatewayFormatsOutFieldDetails.html"

              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"

              <button type="button" class="cm-legacy-nav__item brgf-subnav__item is-active"

              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="BRGatewayFormatsFolderInfo.html"
                onclick="location.href='BRGatewayFormatsFolderInfo.html'"><span>Folder Info</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item" disabled><span>Recent
                  Activities</span></button>
            </div>
          </div>
        </div>

      <section class="cm-legacy-content">
        <div class="brgf-layout">
          <div>
            <div class="brgf-window-title card-surface" aria-label="Invalid Account Info header">
              <div class="brgf-window-title__bar">
                <i class="bi bi-exclamation-octagon" aria-hidden="true"></i>
                <span>Invalid Account Info ::</span>
              </div>
            </div>

            <section class="brgf-panel card-surface mt-2" aria-label="Account details">
              <div class="brgf-panel__header">Account Details</div>
              <div class="brgf-panel__body">
                <div class="row g-3">
                  <div class="col-12">
                    <div class="brgf-branch-row">
                      <div class="cbs-field brgf-branch-row__label">
                        <label class="cbs-label" for="iaiBranchId">Branch ID</label>
                      </div>
                      <div class="brgf-branch-row__inputs">
                        <input type="text" id="iaiBranchId" class="form-control brgf-branch-code" value="0101" />
                        <div class="input-group brgf-branch-name">
                          <input type="text" class="form-control" value="Head Office" />
                          <button class="btn btn-outline-primary" type="button" aria-label="Search branch">
                            <i class="bi bi-search"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="brgf-branch-row">
                      <div class="cbs-field brgf-branch-row__label">
                        <label class="cbs-label" for="iaiAccountTag">Account Tag</label>
                      </div>
                      <div class="brgf-branch-row__inputs brgf-branch-row__inputs--single">
                        <select id="iaiAccountTag" class="form-select">
                          <option value="">--Select--</option>
                          <option value="general-ledger" selected>General Ledger</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field">
                      <label class="cbs-label" for="iaiAccountId">Account ID</label>
                      <div class="brgf-split-input-group" role="group" aria-label="Account ID">
                        <input type="text" id="iaiAccountId" class="form-control brgf-split-input-group__code" />
                        <input type="text" class="form-control" aria-label="Account description" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search account">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field">
                      <label class="cbs-label" for="iaiCreditTrxId">Credit Trx ID</label>
                      <div class="brgf-split-input-group" role="group" aria-label="Credit Trx ID">
                        <input type="text" id="iaiCreditTrxId" class="form-control brgf-split-input-group__code" />
                        <input type="text" class="form-control" aria-label="Credit trx description" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search credit trx">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field">
                      <label class="cbs-label" for="iaiDebitTrxId">Debit Trx ID</label>
                      <div class="brgf-split-input-group" role="group" aria-label="Debit Trx ID">
                        <input type="text" id="iaiDebitTrxId" class="form-control brgf-split-input-group__code" />

                        <button class="btn btn-outline-primary" type="button" aria-label="Search debit trx">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field">
                      <label class="cbs-label" for="iaiNarration">Narration</label>
                      <input type="text" id="iaiNarration" class="form-control" />
                    </div>
                  </div>
                </div>

              <div class="brgf-panel__body">
                <div class="row g-3">
                  <div class="col-12 col-lg-4">
                    <div class="row g-2">
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="iaiCreatedBy">Created By</label>

                      <div class="col-6">

                      </div>
                      <div class="col-6">
                        <div class="cbs-field">

                    <div class="row g-2">
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="iaiSupervisedBy">Supervised By</label>
                          <input type="text" id="iaiSupervisedBy" class="form-control" />
                        </div>
                      </div>
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="iaiSupervisedOn">Supervised On</label>
                          <input type="text" id="iaiSupervisedOn" class="form-control" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            <button type="button" class="btn btn-outline-secondary brgf-action">Add</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Edit</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Delete</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Save</button>
            <button type="button" class="btn btn-outline-secondary brgf-action">Cancel</button>
