<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintain Locker · Close Locker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme maintain-locker maintain-locker-close" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerAccess.html"><span>Locker Access</span></button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerKeyInfo.html"><span>Locker KeyInfo</span></button>
            <button type="button" class="cm-legacy-nav__item is-active" aria-current="page"><span>Close Locker</span></button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerSignatories.html"><span>Locker Signatories</span></button>
          </div>
        </div>

      </aside>

      <section class="cm-legacy-content" aria-label="Close Locker content">
        <div class="cm-scroll-region">
          <section class="card-surface maintain-locker__group" aria-label="Locker Closure Details">
            <div class="maintain-locker__group-header">Locker Closure Details</div>
            <div class="maintain-locker__group-body">
              <div class="mlclose-form">
                <div class="mlclose-row mlclose-row--two">
                  <div class="mlclose-label">Rental Amount</div>
                  <div class="mlclose-field">
                    <input type="text" class="form-control mlclose-short" />
                  </div>

                  <div class="mlclose-label">Rental Amount Paid</div>
                  <div class="mlclose-field">
                    <input type="text" class="form-control mlclose-short" />
                  </div>
                </div>

                <div class="mlclose-row">
                  <div class="mlclose-label">Charge AccountID</div>
                  <div class="mlclose-field">
                    <div class="input-group">
                      <input type="text" class="form-control" aria-label="Charge account ID" />
                      <input type="text" class="form-control" aria-label="Charge account name" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search charge account">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="mlclose-row mlclose-row--two">
                  <div class="mlclose-label">Charge Balance</div>
                  <div class="mlclose-field">
                    <input type="text" class="form-control mlclose-short" />
                  </div>

                  <div class="mlclose-label">Expiry Date</div>
                  <div class="mlclose-field">
                    <input type="text" class="form-control mlclose-short" />
                  </div>
                </div>

                <div class="mlclose-row mlclose-row--two">
                  <div class="mlclose-label">Surrender On</div>
                  <div class="mlclose-field">
                    <div class="input-group mlclose-date">
                      <select class="form-select" aria-label="Surrender on">
                        <option>--Select--</option>
                      </select>
                      <button class="btn btn-outline-primary" type="button" aria-label="Pick surrender date">
                        <i class="bi bi-calendar-event"></i>
                      </button>
                    </div>
                  </div>

                  <div class="mlclose-label">Surrender Reason</div>
                  <div class="mlclose-field">
                    <input type="text" class="form-control" />
                  </div>
                </div>

                <div class="mlclose-row mlclose-row--two">
                  <div class="mlclose-label">Surrender By</div>
                  <div class="mlclose-field">
                    <input type="text" class="form-control mlclose-short" />
                  </div>

                  <div class="mlclose-label"></div>
                  <div class="mlclose-field mlclose-field--end">
                    <button type="button" class="btn mlclose-proceed" disabled>Proceed</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div class="maintain-locker__grid" role="region" aria-label="Closure charges grid">
            <table class="table table-sm mb-0">
              <thead>
                <tr>
                  <th scope="col">ComponentID</th>
                  <th scope="col">Amount</th>
                  <th scope="col">CrAccountID</th>
                  <th scope="col">CrAccountName</th>
                  <th scope="col">DrAccountID</th>
                  <th scope="col">DrAccountName</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="6" class="text-muted">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <section class="card-surface maintain-locker__group mt-3" aria-label="Behind The Scene">
            <div class="maintain-locker__group-header">Behind The Scene</div>
            <div class="maintain-locker__group-body">
              <div class="row g-2">
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdBy">Created By</label>
                    <input id="createdBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedBy">Modified By</label>
                    <input id="modifiedBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedBy">Supervised By</label>
                    <input id="supervisedBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdOn">Created On</label>
                    <input id="createdOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedOn">Modified On</label>
                    <input id="modifiedOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedOn">Supervised On</label>
                    <input id="supervisedOn" type="text" class="form-control" />
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" disabled>Add</button>
          <button type="button" class="cm-shell__action" disabled>Edit</button>
          <button type="button" class="cm-shell__action" disabled>Save</button>
          <button type="button" class="cm-shell__action" disabled>Cancel</button>
          <button type="button" class="cm-shell__action" data-ml-back>Back</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/other-modules/data-entry/MaintainLockerClose.embedded.js"></script>
</body>

</html>
