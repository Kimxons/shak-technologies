<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BR Gateway Formats · Folder Info</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../overdraft-application/overdraft-application.css" />
</head>

<body class="br-gateway-formats module-shell" data-page="br-gateway-formats" style="background:transparent;">
  <div class="cm-react-orbs d-none" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="BR Gateway Formats navigation">
        <div class="cm-nav-section">
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item brgf-nav-parent" data-brgf-toggle="dataentry-menu"
              aria-expanded="true">
              <span>DataEntry</span>
              <i class="bi bi-caret-right-fill brgf-nav-caret" aria-hidden="true"></i>
            </button>

            <div class="brgf-subnav" data-brgf-subnav="dataentry-menu">
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="../views/BRGatewayFormats.html"
                onclick="location.href='../views/BRGatewayFormats.html'"><span>Format Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="BRGatewayFormatsInFieldDetails.html"
                onclick="location.href='BRGatewayFormatsInFieldDetails.html'"><span>In Field Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="BRGatewayFormatsOutFieldDetails.html"
                onclick="location.href='BRGatewayFormatsOutFieldDetails.html'"><span>Out Field Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="BRGatewayFormatsContraAccountInfo.html"
                onclick="location.href='BRGatewayFormatsContraAccountInfo.html'"><span>Contra Account
                  Info</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="BRGatewayFormatsInvalidAccountInfo.html"
                onclick="location.href='BRGatewayFormatsInvalidAccountInfo.html'"><span>Invalid Account
                  Info</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item is-active"
                aria-current="page"><span>Folder Info</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item" disabled><span>Recent
                  Activities</span></button>
            </div>
          </div>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <div class="brgf-layout">
          <div>
            <div class="brgf-window-title card-surface" aria-label="Folder Info header">
              <div class="brgf-window-title__bar">
                <i class="bi bi-folder2-open" aria-hidden="true"></i>
                <span>Folder Info ::</span>
              </div>
            </div>

            <section class="brgf-panel card-surface mt-2" aria-label="Folder information">
              <div class="brgf-panel__header">Folder Information</div>
              <div class="brgf-panel__body">
                <div class="brgf-folder-block" aria-label="Folder information block 1">
                  <div class="brgf-folder-grid">
                    <div class="brgf-legacy-label">In Folder</div>
                    <input type="text" class="form-control" aria-label="In Folder" />

                    <div class="brgf-legacy-label">Out Folder</div>
                    <input type="text" class="form-control" aria-label="Out Folder" />

                    <div class="brgf-legacy-label">Valid</div>
                    <input type="text" class="form-control" aria-label="Valid" />

                    <div class="brgf-legacy-label">Invalid</div>
                    <input type="text" class="form-control" aria-label="Invalid" />
                  </div>
                </div>

                <hr class="brgf-folder-divider" />

                <div class="brgf-folder-block" aria-label="Folder information block 2">
                  <div class="brgf-folder-grid brgf-folder-grid--compact">
                    <div class="brgf-legacy-label">In Folder</div>
                    <input type="text" class="form-control" aria-label="In Folder 2" />

                    <div class="brgf-legacy-label">Out Folder</div>
                    <input type="text" class="form-control" aria-label="Out Folder 2" />

                    <div class="brgf-legacy-label">Valid</div>
                    <input type="text" class="form-control" aria-label="Valid 2" />

                    <div class="brgf-legacy-label">Invalid</div>
                    <input type="text" class="form-control" aria-label="Invalid 2" />
                  </div>
                </div>
              </div>
            </section>

            <section class="brgf-panel card-surface mt-3" aria-label="Behind the scene">
              <div class="brgf-panel__header">Behind The Scene</div>
              <div class="brgf-panel__body">
                <div class="row g-3">
                  <div class="col-12 col-lg-4">
                    <div class="row g-2">
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fiCreatedBy">Created By</label>
                          <input type="text" id="fiCreatedBy" class="form-control" />
                        </div>
                      </div>
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fiCreatedOn">Created On</label>
                          <input type="text" id="fiCreatedOn" class="form-control" />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-lg-4">
                    <div class="row g-2">
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fiModifiedBy">Modified By</label>
                          <input type="text" id="fiModifiedBy" class="form-control" />
                        </div>
                      </div>
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fiModifiedOn">Modified On</label>
                          <input type="text" id="fiModifiedOn" class="form-control" />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-lg-4">
                    <div class="row g-2">
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fiSupervisedBy">Supervised By</label>
                          <input type="text" id="fiSupervisedBy" class="form-control" />
                        </div>
                      </div>
                      <div class="col-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fiSupervisedOn">Supervised On</label>
                          <input type="text" id="fiSupervisedOn" class="form-control" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <div class="brgf-status card-surface mt-2" role="status" aria-live="polite">
              <span class="brgf-status__text brgf-status__text--info">No details Found [No:1011]</span>
            </div>
          </div>

          <aside class="brgf-actions" aria-label="Actions">
            <button type="button" class="btn btn-outline-secondary brgf-action">Add</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Edit</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Delete</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Save</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Cancel</button>
            <button type="button" class="btn btn-outline-secondary brgf-action" data-brgf-back>Back</button>
          </aside>
        </div>
      </section>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/other-modules/data-entry/BRGatewayFormatsFolderInfo.embedded.js"></script>
</body>

</html>
