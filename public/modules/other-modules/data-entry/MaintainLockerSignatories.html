<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintain Locker · Locker Signatories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme maintain-locker maintain-locker-signatories" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerAccess.html"><span>Locker Access</span></button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerKeyInfo.html"><span>Locker KeyInfo</span></button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerClose.html"><span>Close Locker</span></button>
            <button type="button" class="cm-legacy-nav__item is-active" aria-current="page"><span>Locker Signatories</span></button>
          </div>
        </div>

      </aside>

      <section class="cm-legacy-content" aria-label="Locker Signatories content">
        <div class="cm-scroll-region">
          <section class="card-surface maintain-locker__group" aria-label="Signatories">
            <div class="maintain-locker__group-header">Signatories</div>
            <div class="maintain-locker__group-body">
              <div class="mlsig-layout">
                <div class="mlsig-main">
                  <div class="mlsig-form">
                    <div class="mlsig-row mlsig-row--two">
                      <div class="mlsig-label">Signatory ID</div>
                      <div class="mlsig-field">
                        <div class="input-group">
                          <input id="signatoryId" type="text" class="form-control" />
                          <button class="btn btn-outline-primary" type="button" aria-label="Search signatory">
                            <i class="bi bi-search"></i>
                          </button>
                        </div>
                      </div>

                      <div class="mlsig-label">Group ID</div>
                      <div class="mlsig-field">
                        <div class="input-group">
                          <input id="groupId" type="text" class="form-control" />
                          <button class="btn btn-outline-primary" type="button" aria-label="Search group">
                            <i class="bi bi-search"></i>
                          </button>
                        </div>
                      </div>
                    </div>

                    <div class="mlsig-row mlsig-row--two">
                      <div class="mlsig-label">Signatory Type</div>
                      <div class="mlsig-field">
                        <select id="signatoryType" class="form-select">
                          <option value="">--Select--</option>
                        </select>
                      </div>

                      <div class="mlsig-label">Sequence No</div>
                      <div class="mlsig-field">
                        <input id="sequenceNo" type="text" class="form-control mlsig-short" />
                      </div>
                    </div>

                    <div class="mlsig-row mlsig-row--two">
                      <div class="mlsig-label">Limit</div>
                      <div class="mlsig-field">
                        <input id="limit" type="text" class="form-control mlsig-short" />
                      </div>

                      <div class="mlsig-label"></div>
                      <div class="mlsig-field mlsig-field--inline">
                        <label class="form-check mlsig-check" for="isMandatory">
                          <span class="mlsig-check__label">Is Mandatory</span>
                          <input class="form-check-input" type="checkbox" id="isMandatory" />
                        </label>
                      </div>
                    </div>

                    <div class="mlsig-row">
                      <div class="mlsig-label">Mandates</div>
                      <div class="mlsig-field">
                        <div class="input-group mlsig-date">
                          <select id="mandates" class="form-select">
                            <option>--Select--</option>
                          </select>
                          <button class="btn btn-outline-primary" type="button" aria-label="Pick mandate">
                            <i class="bi bi-chevron-down"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="mlsig-toolbar" role="toolbar" aria-label="Signatories actions">
                    <button type="button" class="btn mlsig-tool" disabled>New</button>
                    <button type="button" class="btn mlsig-tool" disabled>Alter</button>
                    <button type="button" class="btn mlsig-tool" disabled>Remove</button>
                    <button type="button" class="btn mlsig-tool" disabled>Update</button>
                    <button type="button" class="btn mlsig-tool" disabled>Clear</button>
                    <button type="button" class="btn mlsig-tool" disabled>Close</button>
                  </div>

                  <div class="maintain-locker__grid" role="region" aria-label="Signatories grid">
                    <table class="table table-sm mb-0">
                      <thead>
                        <tr>
                          <th scope="col">Signatory ID</th>
                          <th scope="col">Signatory Name</th>
                          <th scope="col">Signatory Type</th>
                          <th scope="col">Group ID</th>
                          <th scope="col">Sequence No</th>
                          <th scope="col">Is Mandatory</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td colspan="6" class="text-muted">No records to display.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                <aside class="mlsig-side" aria-label="Signatory capture">
                  <button type="button" class="btn mlsig-side-btn" disabled>Signature</button>
                  <button type="button" class="btn mlsig-side-btn" disabled>Photo</button>
                  <button type="button" class="btn mlsig-side-btn" disabled>Both</button>
                </aside>
              </div>
            </div>
          </section>

          <section class="card-surface maintain-locker__group mt-3" aria-label="Behind The Scene">
            <div class="maintain-locker__group-header">Behind The Scene</div>
            <div class="maintain-locker__group-body">
              <div class="row g-2">
                <div class="col-12">
                  <div class="row g-2">
                    <div class="col-12 col-lg-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="operatingMode">Operating Mode</label>
                        <input id="operatingMode" type="text" class="form-control" />
                      </div>
                    </div>
                    <div class="col-12 col-lg-6">
                      <div class="cbs-field cm-compact-field">
                        <label class="cbs-label" for="operatingInstruction">Operating Instruction</label>
                        <input id="operatingInstruction" type="text" class="form-control" />
                      </div>
                    </div>
                  </div>
                  <hr class="maintain-locker__divider" />
                </div>

                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdBy">Created By</label>
                    <input id="createdBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedBy">Modified By</label>
                    <input id="modifiedBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedBy">Supervised By</label>
                    <input id="supervisedBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdOn">Created On</label>
                    <input id="createdOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedOn">Modified On</label>
                    <input id="modifiedOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedOn">Supervised On</label>
                    <input id="supervisedOn" type="text" class="form-control" />
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" disabled>Add</button>
          <button type="button" class="cm-shell__action" disabled>Edit</button>
          <button type="button" class="cm-shell__action" disabled>Save</button>
          <button type="button" class="cm-shell__action" disabled>Cancel</button>
          <button type="button" class="cm-shell__action" data-ml-back>Back</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/other-modules/data-entry/MaintainLockerSignatories.embedded.js"></script>
</body>

</html>
