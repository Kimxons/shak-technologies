<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notification Attachment · Other Modules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme notification-attachment" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item is-active" aria-current="page">
              <span>Notification Attachment</span>
            </button>
          </div>
        </div>

        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">Recent Activities</span>
            <i class="bi bi-chevron-right"></i>
          </button>
          <div class="cm-nav-items is-collapsed"></div>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <section class="card-surface notification-attachment__group" aria-label="Notification Attachment Details">
          <div class="notification-attachment__group-header">Notification Attachment Details</div>
          <div class="notification-attachment__group-body">
            <div class="row g-2">
              <div class="col-12">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="attachmentId">Attachment ID</label>
                  <div class="input-group">
                    <input id="attachmentId" type="text" class="form-control" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search attachment">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="attachmentType">Attachment Type</label>
                  <select id="attachmentType" class="form-select">
                    <option>HTML</option>
                    <option>PDF</option>
                    <option>Text</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="attachmentSource">Attachment Source</label>
                  <div class="input-group">
                    <input id="attachmentSource" type="text" class="form-control" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search attachment source">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="attachmentName">Attachment Name</label>
                  <select id="attachmentName" class="form-select">
                    <option value="">--Select--</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="row g-2 align-items-end">
                  <div class="col-12 col-md-5">
                    <div class="form-check cm-compact-field notification-attachment__check">
                      <input class="form-check-input" type="checkbox" id="shouldEncrypt" />
                      <label class="form-check-label" for="shouldEncrypt">Should Encrypt</label>
                    </div>
                  </div>
                  <div class="col-12 col-md-7">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="encryptionKey">Encryption Key</label>
                      <select id="encryptionKey" class="form-select">
                        <option value="">--Select--</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-12 col-lg-8">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="reportParameters">Report Parameters</label>
                  <select id="reportParameters" class="form-select">
                    <option>Last Working Date</option>
                  </select>
                </div>
              </div>

              <div class="col-12">
                <div class="notification-attachment__inline-actions">
                  <button type="button" class="btn btn-outline-secondary" disabled>Alter</button>
                  <button type="button" class="btn btn-outline-secondary" disabled>Remove</button>
                  <button type="button" class="btn btn-outline-secondary" disabled>Update</button>
                </div>
              </div>

              <div class="col-12">
                <div class="notification-attachment__grid" role="region" aria-label="Attachment parameters">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr>
                        <th scope="col">Parameter Name</th>
                        <th scope="col">Parameter Input</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="2" class="text-muted">No records to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface notification-attachment__group" aria-label="Behind The Scene">
            <div class="notification-attachment__group-header">Behind The Scene</div>
            <div class="notification-attachment__group-body">
              <div class="row g-2">
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdBy">Created By</label>
                    <input id="createdBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedBy">Modified By</label>
                    <input id="modifiedBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedBy">Supervised By</label>
                    <input id="supervisedBy" type="text" class="form-control" />
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action">View</button>
          <button type="button" class="cm-shell__action">Add</button>
          <button type="button" class="cm-shell__action" disabled>Edit</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-na-cancel>Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="../../../assets/js/pages/other-modules/data-entry/NotificationAttachment.embedded.js"></script>
</body>

</html>
