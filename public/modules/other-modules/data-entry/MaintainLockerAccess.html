<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintain Locker · Locker Access</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme maintain-locker maintain-locker-access" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item is-active" aria-current="page">
              <span>Locker Access</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerKeyInfo.html">
              <span>Locker KeyInfo</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerClose.html">
              <span>Close Locker</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="MaintainLockerSignatories.html">
              <span>Locker Signatories</span>
            </button>
          </div>
        </div>

      </aside>

      <section class="cm-legacy-content" aria-label="Locker Access content">
        <div class="cm-scroll-region">
          <section class="card-surface maintain-locker__group" aria-label="Locker Access">
            <div class="maintain-locker__group-header">Locker Access</div>
            <div class="maintain-locker__group-body">
              <div class="row g-2 align-items-end">
                <div class="col-12 col-lg-6">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="signatory">Signatory</label>
                    <select id="signatory" class="form-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-lg-6">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="accessDate">Access Date</label>
                    <div class="input-group">
                      <select id="accessDate" class="form-select">
                        <option value="">--Select--</option>
                      </select>
                      <button class="btn btn-outline-primary" type="button" aria-label="Pick access date">
                        <i class="bi bi-calendar-event"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-6">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="timeIn">Time (In)</label>
                    <div class="input-group">
                      <input id="timeIn" type="text" class="form-control" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Pick time in">
                        <i class="bi bi-clock"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-6">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="timeOut">Time (Out)</label>
                    <div class="input-group">
                      <input id="timeOut" type="text" class="form-control" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Pick time out">
                        <i class="bi bi-clock"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="maintain-locker__grid mt-2" role="region" aria-label="Locker access log">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr>
                      <th scope="col">Signatory</th>
                      <th scope="col">Access Date</th>
                      <th scope="col">Time (In)</th>
                      <th scope="col">Time (Out)</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="4" class="text-muted">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="card-surface maintain-locker__group mt-3" aria-label="Behind The Scene">
            <div class="maintain-locker__group-header">Behind The Scene</div>
            <div class="maintain-locker__group-body">
              <div class="row g-2">
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdBy">Created By</label>
                    <input id="createdBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedBy">Modified By</label>
                    <input id="modifiedBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedBy">Supervised By</label>
                    <input id="supervisedBy" type="text" class="form-control" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdOn">Created On</label>
                    <input id="createdOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedOn">Modified On</label>
                    <input id="modifiedOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedOn">Supervised On</label>
                    <input id="supervisedOn" type="text" class="form-control" />
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div class="mlaccess__status" role="status" aria-live="polite">
            Failed to convert parameter value from a String to a Int32.
          </div>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Actions</p>
          <button type="button" class="cm-shell__action" disabled>CheckIn</button>
          <button type="button" class="cm-shell__action" disabled>CheckOut</button>
          <button type="button" class="cm-shell__action" disabled>Delete</button>
          <button type="button" class="cm-shell__action" disabled>Cancel</button>
          <button type="button" class="cm-shell__action" data-ml-back>Back</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/other-modules/data-entry/MaintainLockerAccess.embedded.js"></script>
</body>

</html>
