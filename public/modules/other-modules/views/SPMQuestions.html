<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPM &amp; Credit Scoring Questions</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body data-page="spm-questions">
  <div class="window">
    <div class="am-header" hidden role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-question-circle am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">SPM &amp; Credit Scoring Questions</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container" aria-label="SPM Questions">
      <!-- Left Sidebar -->
      <div class="sidebar collapsed" id="main-sidebar" aria-label="Options menu" hidden>
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-shield-check" aria-hidden="true"></i>SPM</span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">
            <i class="bi bi-list" aria-hidden="true"></i>
          </button>
        </div>

        <div class="sidebar-content" role="navigation" aria-label="Submodules">
          <div class="nav-section nav-section--card is-open" data-nav-section data-section-name="Other Modules">
            <div class="nav-header nav-header--card is-open" aria-expanded="true">
              <div class="nav-header__content">
                <i class="bi bi-grid-3x3-gap-fill nav-header__icon" aria-hidden="true"></i>
                <span class="nav-label nav-label--card">Other Modules</span>
              </div>
              <div class="nav-header__badge">
                <span class="nav-badge">1</span>
              </div>
            </div>

            <div class="nav-items nav-items--card" aria-label="Other Modules items">
              <div class="sidebar-item sidebar-item--enhanced active" role="button" tabindex="0" aria-current="page" data-tooltip="SPM Questions">
                <div class="sidebar-item__content">
                  <i class="bi bi-question-circle sidebar-item__icon" aria-hidden="true"></i>
                  <div class="sidebar-item__text">
                    <div class="sidebar-item__title">SPM Questions</div>
                    <div class="sidebar-item__description">Maintain scoring questions</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content" role="region" aria-label="SPM Questions content">
        <div class="form-card" data-main-form>
          <form autocomplete="off" novalidate>
            <div class="form-section" data-section="spm-questions">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid" aria-hidden="true"></i>Social Performance Monitoring And Credit Scoring Questions</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle SPM Questions" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col" role="group" aria-label="Question details">
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="questionId">Question ID / Description</label>
                    <div class="d-flex align-items-stretch gap-0 w-100">
                      <input id="questionId" type="text" class="bs-input-text form-control rounded-end-0" style="flex: 0 1 30%; min-width: 0;" aria-label="Question ID" maxlength="50" />
                      <input id="questionDescription" type="text" class="bs-input-text form-control rounded-0 border-start-0 border-end-0" style="flex: 0 1 50%; min-width: 0;" readonly aria-readonly="true" aria-label="Question Description" title="Question Description" placeholder="Description" maxlength="200" />
                      <button type="button" class="btn-lookup rounded-start-0" style="flex: 0 0 28px;" aria-label="Search Question ID" title="Search" data-open-search="question">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="functionName">Function Name</label>
                    <input id="functionName" type="text" class="bs-input-text form-control" style="max-width: 200px;" maxlength="50" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="sourceOfInformation">Source Of Information</label>
                    <select id="sourceOfInformation" class="bs-select form-select" style="max-width: 180px;">
                      <option value="">--Select--</option>
                      <option value="Automated">Automated</option>
                      <option value="Manual">Manual</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="questionTypeId">QuestionType ID</label>
                    <select id="questionTypeId" class="bs-select form-select" style="max-width: 180px;">
                      <option value="">--Select--</option>
                      <option value="Credit Score">Credit Score</option>
                      <option value="SPM Score">SPM Score</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="answer">Answer</label>
                    <input id="answer" type="text" class="bs-input-text form-control" style="max-width: 200px;" maxlength="200" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="weight">Weight</label>
                    <input id="weight" type="number" class="bs-input-text form-control" style="max-width: 180px;" min="0" max="100" step="any" />
                  </div>
                </div>

                <div class="spmq__toolbar form-action-buttons" aria-label="Question toolbar">
                  <button type="button" class="spmq__toolbar-btn btn-form-action"><i class="bi bi-plus-circle" aria-hidden="true"></i>New</button>
                  <button type="button" class="spmq__toolbar-btn btn-form-action" disabled><i class="bi bi-pencil-square" aria-hidden="true"></i>Alter</button>
                  <button type="button" class="spmq__toolbar-btn btn-form-action" disabled><i class="bi bi-trash" aria-hidden="true"></i>Remove</button>
                  <button type="button" class="spmq__toolbar-btn btn-form-action" disabled><i class="bi bi-check2-square" aria-hidden="true"></i>Update</button>
                  <button type="button" class="spmq__toolbar-btn btn-form-action" disabled><i class="bi bi-eraser" aria-hidden="true"></i>Clear</button>
                </div>

                <div class="spmq__grid form-section-table" role="region" aria-label="Answer list">
                  <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                      <thead>
                        <tr>
                          <th scope="col">Answer</th>
                          <th scope="col" class="w-25">Weight</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td colspan="2" class="text-muted">No records to display.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-gear" aria-hidden="true"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="behind-scene p-4 p-lg-5">
                  <div class="row gx-5 gy-4">
                    <div class="col-12 col-md-4 d-flex flex-column gap-4">
                      <div>
                        <label class="label-blue mb-2" for="createdBy">Created By</label>
                        <input id="createdBy" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Created By" />
                      </div>
                      <div>
                        <label class="label-blue mb-2" for="createdOn">Created On</label>
                        <input id="createdOn" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Created On" />
                      </div>
                    </div>

                    <div class="col-12 col-md-4 d-flex flex-column gap-4">
                      <div>
                        <label class="label-blue mb-2" for="modifiedBy">Modified By</label>
                        <input id="modifiedBy" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Modified By" />
                      </div>
                      <div>
                        <label class="label-blue mb-2" for="modifiedOn">Modified On</label>
                        <input id="modifiedOn" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Modified On" />
                      </div>
                    </div>

                    <div class="col-12 col-md-4 d-flex flex-column gap-4">
                      <div>
                        <label class="label-blue mb-2" for="supervisedBy">Supervised By</label>
                        <input id="supervisedBy" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Supervised By" />
                      </div>
                      <div>
                        <label class="label-blue mb-2" for="supervisedOn">Supervised On</label>
                        <input id="supervisedOn" type="text" class="bs-input-text w-100 d-block" readonly aria-readonly="true" title="Supervised On" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Action Panel (keep cm-legacy-actions__group + cm-shell__action hooks for SPMQuestions.js) -->
      <aside class="action-panel" aria-label="Actions">
        <div class="spmq__nav-arrows" aria-label="Record navigation">
          <button type="button" class="spmq__arrow-btn" aria-label="Previous record" title="Previous">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
          </button>
          <button type="button" class="spmq__arrow-btn" aria-label="Next record" title="Next">
            <i class="bi bi-arrow-right" aria-hidden="true"></i>
          </button>
        </div>

        <div class="action-buttons cm-legacy-actions__group">
          <button class="btn-action btn-view cm-shell__action" type="button"><i class="bi bi-eye me-1" aria-hidden="true"></i>View</button>
          <button class="btn-action cm-shell__action" type="button" disabled><i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Add</button>
          <button class="btn-action cm-shell__action" type="button" disabled><i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Edit</button>
          <button class="btn-action cm-shell__action" type="button" disabled><i class="bi bi-trash3 me-1" aria-hidden="true"></i>Delete</button>
          <button class="btn-action cm-shell__action cm-shell__action--success" type="button" disabled><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Save</button>
          <button class="btn-action btn-cancel cm-shell__action cm-shell__action--danger" type="button"><i class="bi bi-x-circle me-1" aria-hidden="true"></i>Cancel</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle" aria-hidden="true"></i>
      <span></span>
    </div>
  </div>

  <!-- Question Lookup Modal -->
  <div class="modal fade" id="questionLookupModal" tabindex="-1" aria-labelledby="questionLookupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white d-flex justify-content-between align-items-center">
          <div>
            <h5 class="modal-title mb-0" id="questionLookupModalLabel">Questions</h5>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-sm btn-outline-light" id="questionSearchRefresh" aria-label="Refresh" data-question-refresh>
              <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>

        <div class="modal-body cm-lookup__body">
          <!-- Filter Form -->
          <form class="cm-lookup__filters row g-3 align-items-end mb-3" data-question-lookup-form>
            <div class="col-md-5">
              <label class="form-label">Question ID</label>
              <input type="text" class="form-control form-control-sm" data-question-filter="QuestionID" placeholder="Filter by ID..." />
            </div>
            <div class="col-md-5">
              <label class="form-label">Description</label>
              <input type="text" class="form-control form-control-sm" data-question-filter="Description" placeholder="Filter by description..." />
            </div>
            <div class="col-md-2">
              <button type="button" class="btn btn-sm btn-outline-secondary w-100" data-question-reset>Reset</button>
            </div>
          </form>

          <!-- Results Section -->
          <div class="cm-lookup__results card-surface">
            <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
              <table class="table table-sm table-hover align-middle mb-0 cm-lookup__table">
                <thead class="sticky-top bg-white">
                  <tr>
                    <th scope="col">Question ID</th>
                    <th scope="col">Description</th>
                    <th scope="col" class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody data-question-lookup-results></tbody>
              </table>
            </div>

            <!-- Empty State -->
            <div class="cm-lookup__empty d-none" data-question-lookup-empty>
              No questions found.
            </div>

            <!-- Loading State -->
            <div class="cm-lookup__loading d-none" data-question-lookup-loading>
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer bg-primary justify-content-center">
          <button type="button" class="btn btn-light border px-5" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../assets/js/services/otherModuleService/spmQuestionsService.js"></script>
  <script src="../../../assets/js/pages/other-modules/views/SPMQuestions.js"></script>
  <script>
    (function initStandardShellBehavior() {
      function closeChildForm() {
        try {
          window.parent.postMessage({ type: 'submoduleClosed', source: 'SPM Questions' }, '*');
        } catch (_) {}
        try { window.close(); } catch (_) {}
      }

      function handleWindowAction(action) {
        if (action === 'refresh') {
          location.reload();
        } else if (action === 'maximize') {
          try {
            window.parent.postMessage({ type: 'toggleSidebarForMaximize' }, '*');
          } catch (_) {}
          document.querySelector('.window')?.classList.toggle('maximized');
        } else if (action === 'close') {
          closeChildForm();
        }
      }

      document.querySelectorAll('.am-header [data-action]').forEach((btn) => {
        const action = btn.getAttribute('data-action');
        if (['refresh', 'maximize', 'close'].includes(action)) {
          btn.addEventListener('click', () => handleWindowAction(action));
        }
      });

      const sidebarToggle = document.getElementById('sidebarToggle');
      sidebarToggle?.addEventListener('click', () => {
        const sidebar = document.getElementById('main-sidebar');
        const isCollapsed = sidebar?.classList.toggle('collapsed');
        sidebarToggle.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
        document.querySelector('.main-container')?.classList.toggle('sidebar-collapsed', !!isCollapsed);
      });

      document.querySelectorAll('[data-section-toggle]').forEach((header) => {
        header.addEventListener('click', (e) => {
          const target = e.target;
          if (target && target.closest && target.closest('button') && !target.closest('.section-toggle-btn')) {
            return;
          }

          const section = header.closest('.form-section');
          if (!section) return;
          const content = section.querySelector('[data-section-content]');
          const btn = section.querySelector('.section-toggle-btn');
          if (!content || !btn) return;
          const isHidden = content.hasAttribute('hidden');
          if (isHidden) {
            content.removeAttribute('hidden');
            btn.setAttribute('aria-expanded', 'true');
            btn.querySelector('i')?.classList.remove('bi-chevron-down');
            btn.querySelector('i')?.classList.add('bi-chevron-up');
          } else {
            content.setAttribute('hidden', '');
            btn.setAttribute('aria-expanded', 'false');
            btn.querySelector('i')?.classList.remove('bi-chevron-up');
            btn.querySelector('i')?.classList.add('bi-chevron-down');
          }
        });
      });
    })();
  </script>
</body>

</html>
