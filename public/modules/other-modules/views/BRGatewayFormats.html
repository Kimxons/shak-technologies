<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BR Gateway Formats</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../../overdraft-application/overdraft-application.css" />
</head>

<body class="br-gateway-formats module-shell" data-page="br-gateway-formats" style="background:transparent;">
  <div class="cm-react-orbs d-none" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="BR Gateway Formats navigation">
        <div class="cm-nav-section">
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item brgf-nav-parent" data-brgf-nav="dataentry"
              data-brgf-toggle="dataentry-menu" aria-expanded="false">
              <span>DataEntry</span>
              <i class="bi bi-caret-right-fill brgf-nav-caret" aria-hidden="true"></i>
            </button>

            <div class="brgf-subnav" data-brgf-subnav="dataentry-menu" hidden>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item is-active"
                aria-current="page"><span>Format Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="../data-entry/BRGatewayFormatsInFieldDetails.html"
                onclick="location.href='../data-entry/BRGatewayFormatsInFieldDetails.html'"><span>In Field
                  Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="../data-entry/BRGatewayFormatsOutFieldDetails.html"
                onclick="location.href='../data-entry/BRGatewayFormatsOutFieldDetails.html'"><span>Out Field
                  Details</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="../data-entry/BRGatewayFormatsContraAccountInfo.html"
                onclick="location.href='../data-entry/BRGatewayFormatsContraAccountInfo.html'"><span>Contra Account
                  Info</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="../data-entry/BRGatewayFormatsInvalidAccountInfo.html"
                onclick="location.href='../data-entry/BRGatewayFormatsInvalidAccountInfo.html'"><span>Invalid Account
                  Info</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item"
                data-brgf-route="../data-entry/BRGatewayFormatsFolderInfo.html"
                onclick="location.href='../data-entry/BRGatewayFormatsFolderInfo.html'"><span>Folder
                  Info</span></button>
              <button type="button" class="cm-legacy-nav__item brgf-subnav__item" disabled><span>Recent
                  Activities</span></button>
            </div>
          </div>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <div class="brgf-view" data-brgf-view="dataentry">
          <div class="brgf-layout">
            <section class="brgf-panel card-surface" aria-label="Format details">
              <div class="brgf-panel__header">Format Details</div>
              <div class="brgf-panel__body">
                <div class="row g-3 align-items-start">
                  <div class="col-12 col-xl-8">
                    <div class="row g-3">
                      <div class="col-12 col-md-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="formatId">Format ID</label>
                          <div class="input-group">
                            <input type="text" id="formatId" class="form-control" />
                            <button class="btn btn-outline-primary" type="button" aria-label="Search format">
                              <i class="bi bi-search"></i>
                            </button>
                          </div>
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="description">Description</label>
                          <input type="text" id="description" class="form-control" />
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="currencyId">Currency ID</label>
                          <div class="input-group">
                            <input type="text" id="currencyId" class="form-control" />
                            <button class="btn btn-outline-primary" type="button" aria-label="Search currency">
                              <i class="bi bi-search"></i>
                            </button>
                          </div>
                        </div>
                      </div>

                      <div class="col-12 col-md-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="formatType">Format Type</label>
                          <select id="formatType" class="form-select">
                            <option value="">--Select--</option>
                          </select>
                        </div>
                      </div>

                      <div class="col-12 col-md-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="processType">Process Type</label>
                          <select id="processType" class="form-select">
                            <option value="">--Select--</option>
                          </select>
                        </div>
                      </div>

                      <div class="col-12 col-md-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="startDate">Start Date</label>
                          <input type="date" id="startDate" class="form-control" />
                        </div>
                      </div>

                      <div class="col-12 col-md-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fileFormat">File Format</label>
                          <select id="fileFormat" class="form-select">
                            <option value="">--Select--</option>
                          </select>
                        </div>
                      </div>

                      <div class="col-12 col-md-6">
                        <div class="cbs-field">
                          <label class="cbs-label" for="delimiter">Delimiter</label>
                          <select id="delimiter" class="form-select">
                            <option value="">--Select--</option>
                          </select>
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="filePath">File Path</label>
                          <input type="text" id="filePath" class="form-control" />
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="procedureName">Procedure Name</label>
                          <select id="procedureName" class="form-select">
                            <option value="">--Select--</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-xl-4">
                    <div class="row g-3">
                      <div class="col-12">
                        <div class="form-check brgf-inline-check">
                          <input class="form-check-input" type="checkbox" id="autoProcess" />
                          <label class="form-check-label" for="autoProcess">Auto Process</label>
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="transactionType">Transaction Type</label>
                          <select id="transactionType" class="form-select">
                            <option value="">--Select--</option>
                          </select>
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="expiryDate">Expiry Date</label>
                          <input type="date" id="expiryDate" class="form-control" />
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="fileType">File Type</label>
                          <select id="fileType" class="form-select">
                            <option value="">--Select--</option>
                          </select>
                        </div>
                      </div>

                      <div class="col-12">
                        <div class="cbs-field">
                          <label class="cbs-label" for="startAtRow">Start At Row</label>
                          <input type="text" id="startAtRow" class="form-control" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <aside class="brgf-actions" aria-label="Actions">
              <button type="button" class="btn btn-outline-secondary brgf-action">View</button>
              <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Add</button>
              <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Edit</button>
              <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Delete</button>
              <button type="button" class="btn btn-outline-secondary brgf-action" disabled>Save</button>
              <button type="button" class="btn btn-outline-secondary brgf-action">Cancel</button>
            </aside>
          </div>

          <section class="brgf-panel card-surface mt-3" aria-label="Behind the scene">
            <div class="brgf-panel__header">Behind The Scene</div>
            <div class="brgf-panel__body">
              <div class="row g-3">
                <div class="col-12 col-lg-4">
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="cbs-field">
                        <label class="cbs-label" for="createdBy">Created By</label>
                        <input type="text" id="createdBy" class="form-control" />
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="cbs-field">
                        <label class="cbs-label" for="createdOn">Created On</label>
                        <input type="text" id="createdOn" class="form-control" />
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="cbs-field">
                        <label class="cbs-label" for="modifiedBy">Modified By</label>
                        <input type="text" id="modifiedBy" class="form-control" />
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="cbs-field">
                        <label class="cbs-label" for="modifiedOn">Modified On</label>
                        <input type="text" id="modifiedOn" class="form-control" />
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="cbs-field">
                        <label class="cbs-label" for="supervisedBy">Supervised By</label>
                        <input type="text" id="supervisedBy" class="form-control" />
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="cbs-field">
                        <label class="cbs-label" for="supervisedOn">Supervised On</label>
                        <input type="text" id="supervisedOn" class="form-control" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/other-modules/views/BRGatewayFormats.embedded.js"></script>
</body>

</html>
