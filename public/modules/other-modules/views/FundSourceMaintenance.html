<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fund Source Maintenance · Other Modules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../../../assets/css/pages/other-modules/fund-source-premium.css" />
</head>

<body class="client-maintenance copilot-theme fund-source fund-source-maintenance" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <!-- Main Content Area -->
    <div class="fs-main-content">
      <form id="fund-source-form" autocomplete="off" novalidate>
        <!-- Funder Identification Section -->
        <section class="card-surface p-3">
          <header>
            <h3 class="section-title">Funder Identification</h3>
          </header>
          <div class="fs-grid mt-3">
            <div class="fs-form-group">
              <label for="funderId">Funder ID</label>
              <div class="input-group">
                <input type="text" id="funderId" name="FunderID" placeholder="e.g., FND001">
                <button type="button" class="btn btn-lookup" id="openFunderSearch" title="Search Funder">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div class="fs-form-group">
              <label for="funderName">Funder Name</label>
              <input type="text" id="funderName" placeholder="Funder Name">
            </div>
          </div>
        </section>

        <!-- Fund Source Details Section -->
        <section class="card-surface p-3 mt-3">
          <header>
            <h3 class="section-title">Fund Source Details</h3>
          </header>
          <div class="fs-grid mt-3">
            <div class="fs-form-group">
              <label for="address1">Address 1</label>
              <input type="text" id="address1" required aria-required="true" placeholder="Street Address">
            </div>
            <div class="fs-form-group">
              <label for="address2">Address 2</label>
              <input type="text" id="address2" placeholder="Suite, Floor, etc.">
            </div>
            <div class="fs-form-group">
              <label for="city">City</label>
              <select id="city" required aria-required="true">
                <option value="">--Select City--</option>
              </select>
            </div>
            <div class="fs-form-group">
              <label for="country">Country</label>
              <select id="country" required aria-required="true">
                <option value="">--Select Country--</option>
              </select>
            </div>
            <div class="fs-form-group">
              <label for="zipCode">Zip Code</label>
              <input type="text" id="zipCode" placeholder="Postal Code">
            </div>
            <div class="fs-form-group">
              <label for="emailId">Email ID</label>
              <input type="email" id="emailId" placeholder="example@domain.com">
            </div>
            <div class="fs-form-group">
              <label for="phone1">Phone 1</label>
              <input type="text" id="phone1" placeholder="Primary Phone">
            </div>
            <div class="fs-form-group">
              <label for="phone2">Phone 2</label>
              <input type="text" id="phone2" placeholder="Secondary Phone">
            </div>
            <div class="fs-form-group">
              <label for="mobile">Mobile</label>
              <input type="text" id="mobile" placeholder="Mobile Number">
            </div>
            <div class="fs-form-group">
              <label for="faxNo">Fax No</label>
              <input type="text" id="faxNo" placeholder="Fax Number">
            </div>
            <div class="fs-form-group">
              <label for="contactPerson">Contact Person</label>
              <input type="text" id="contactPerson" placeholder="Full Name">
            </div>
            <div class="fs-form-group">
              <!-- Empty for alignment -->
            </div>
          </div>
          <div class="fs-form-group px-2 mt-3">
            <label for="remarks">Remarks</label>
            <textarea id="remarks" rows="2" placeholder="Additional notes..."></textarea>
          </div>
        </section>

        <!-- Behind The Scene Section -->
        <section class="card-surface p-3 mt-3">
          <header>
            <h3 class="section-title">Behind The Scene</h3>
          </header>
          <div class="fs-bts-grid mt-3">
            <div class="fs-bts-col">
              <div class="fs-bts-row">
                <label for="createdBy">Created By</label>
                <input type="text" id="createdBy" class="audit-input" readonly>
              </div>
              <div class="fs-bts-row">
                <label for="createdOn">Created On</label>
                <input type="text" id="createdOn" class="audit-input" readonly>
              </div>
            </div>
            <div class="fs-bts-col">
              <div class="fs-bts-row">
                <label for="modifiedBy">Modified By</label>
                <input type="text" id="modifiedBy" class="audit-input" readonly>
              </div>
              <div class="fs-bts-row">
                <label for="modifiedOn">Modified On</label>
                <input type="text" id="modifiedOn" class="audit-input" readonly>
              </div>
            </div>
            <div class="fs-bts-col">
              <div class="fs-bts-row">
                <label for="supervisedBy">Supervised By</label>
                <input type="text" id="supervisedBy" class="audit-input" readonly>
              </div>
              <div class="fs-bts-row">
                <label for="supervisedOn">Supervised On</label>
                <input type="text" id="supervisedOn" class="audit-input" readonly>
              </div>
            </div>
          </div>
          <div id="fsmToast" class="fa-alert"></div>
        </section>
      </form>
    </div>

    <!-- Action Buttons Sidebar -->
    <aside class="action-panel card-surface" aria-label="Actions">
      <div class="cm-legacy-actions__group">
        <p class="cm-legacy-actions__title">Actions</p>
        <div class="cp-actions">
          <button type="button" class="cm-shell__action btn-view">
            <i class="bi bi-eye"></i> <span>View</span>
          </button>
          <button type="button" class="cm-shell__action btn-add">
            <i class="bi bi-plus-lg"></i> <span>Add</span>
          </button>
          <button type="button" class="cm-shell__action btn-edit">
            <i class="bi bi-pencil-square"></i> <span>Edit</span>
          </button>
          <button type="button" class="cm-shell__action btn-delete">
            <i class="bi bi-trash"></i> <span>Delete</span>
          </button>
          <button type="button" class="cm-shell__action btn-save">
            <i class="bi bi-check-lg"></i> <span>Save</span>
          </button>
          <button type="button" class="cm-shell__action btn-cancel" data-always-enabled>
            <i class="bi bi-x-lg"></i> <span>Cancel</span>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../assets/js/services/otherModuleService/otherModuleService.js"></script>
  <script src="../../../modules/other-modules/common/fundsourcemaintenancesearch-modal.js"></script>
  <script>
    // Funder search modal functionality
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('openFunderSearch');
      if (!btn) return;
      btn.addEventListener('click', function () {
        let modal = document.getElementById('funderSearchModal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'funderSearchModal';
          modal.style.position = 'fixed';
          modal.style.top = '0';
          modal.style.left = '0';
          modal.style.width = '100vw';
          modal.style.height = '100vh';
          modal.style.background = 'rgba(0,0,0,0.5)';
          modal.style.zIndex = '9999';
          modal.style.backdropFilter = 'blur(4px)';
          modal.innerHTML = `
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.2);width:700px;max-width:95vw;max-height:90vh;overflow:hidden;border:1px solid #dde6ed;">
                <div style="padding:1rem;background:#4a6a8a;color:#fff;display:flex;justify-content:space-between;align-items:center;">
                  <h5 style="margin:0;font-size:1rem;font-weight:600;">Search Funder</h5>
                  <button id="closeFunderSearchModal" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1;">&times;</button>
                </div>
                <iframe src="../../../modules/other-modules/common/fundsourcemaintenancesearch.html" style="width:100%;height:500px;border:none;"></iframe>
              </div>
            `;
          document.body.appendChild(modal);
          document.getElementById('closeFunderSearchModal').onclick = function () {
            modal.remove();
          };
        }
        modal.style.display = 'block';
      });

      window.addEventListener('message', function (event) {
        if (!event.data) return;

        if (event.data.type === 'FUNDER_SELECTED') {
          document.getElementById('funderId').value = event.data.funderId || '';
          if (document.getElementById('funderName')) {
            document.getElementById('funderName').value = event.data.data?.FunderName || '';
          }
          const modal = document.getElementById('funderSearchModal');
          if (modal) modal.remove();
        }

        if (event.data.type === 'kairo-dataentry-close') {
          const modal = document.getElementById('funderSearchModal');
          if (modal) modal.remove();
        }
      });
    });

    // Toast helper to match standard Premium pages
    function setToast(message, type = 'info') {
      const alertEl = document.getElementById('fsmToast');
      if (alertEl) {
        alertEl.textContent = message;
        alertEl.className = 'fa-alert show ' + type;
        setTimeout(() => alertEl.classList.remove('show'), 5000);
      }
    }
  </script>

  <script src="../../../assets/js/pages/other-modules/views/FundSourceMaintenance.js"></script>
</body>

</html>
