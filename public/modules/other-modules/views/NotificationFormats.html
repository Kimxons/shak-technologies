<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notification Settings · Other Modules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme notification-formats" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item" onclick="location.href='../data-entry/NotificationAttachment.html'">
              <span>Notification Attachment</span>
            </button>
          </div>
        </div>

        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">Recent Activities</span>
            <i class="bi bi-chevron-right"></i>
          </button>
          <div class="cm-nav-items is-collapsed"></div>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <section class="card-surface notification-formats__group" aria-label="Format Details">
          <div class="notification-formats__group-header">Format Details</div>
          <div class="notification-formats__group-body">
            <div class="row g-2">
              <div class="col-12">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="notificationId">Notification ID</label>
                  <div class="input-group">
                    <input id="notificationId" type="text" class="form-control" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search notification">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="notificationType">Notification Type</label>
                  <select id="notificationType" class="form-select">
                    <option value="">--Select--</option>
                    <option>e-Mail</option>
                    <option>SMS</option>
                    <option>In-App</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="triggerId">Trigger ID</label>
                  <div class="input-group">
                    <select id="triggerId" class="form-select">
                      <option value="">--Select--</option>
                      <option>Merge Client Accounts</option>
                    </select>
                    <button class="btn btn-outline-primary" type="button" aria-label="Search trigger">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="triggerType">Trigger Type</label>
                  <select id="triggerType" class="form-select">
                    <option value="">--Select--</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="chargeId">Charge ID</label>
                  <div class="input-group">
                    <input id="chargeId" type="text" class="form-control" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search charge">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="col-12">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="subject">Subject</label>
                  <input id="subject" type="text" class="form-control" />
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="subjectParam">Msg Parameters</label>
                  <div class="input-group">
                    <select id="subjectParam" class="form-select">
                      <option value="">--Select--</option>
                      <option value="{{ClientID}}">Client ID</option>
                      <option value="{{ClientName}}">Client Name</option>
                      <option value="{{AccountNo}}">Account No</option>
                    </select>
                    <button class="btn btn-outline-secondary" type="button" data-insert="subject">
                      Place Subj
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface notification-formats__group" aria-label="Message">
            <div class="notification-formats__group-header">Message</div>
            <div class="notification-formats__group-body">
              <div class="row g-2 align-items-end">
                <div class="col-12 col-lg-8">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="messageParam">Msg Parameters</label>
                    <div class="input-group">
                      <select id="messageParam" class="form-select">
                        <option value="">--Select--</option>
                        <option value="{{ClientID}}">Client ID</option>
                        <option value="{{ClientName}}">Client Name</option>
                        <option value="{{AccountNo}}">Account No</option>
                        <option value="{{Amount}}">Amount</option>
                      </select>
                      <button class="btn btn-outline-secondary" type="button" data-insert="message">
                        Place Msg
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="mt-2">
                <textarea id="messageBody" class="form-control" rows="12" aria-label="Message"></textarea>
              </div>
            </div>
          </section>

          <section class="card-surface notification-formats__group" aria-label="Behind The Scene">
            <div class="notification-formats__group-header">Behind The Scene</div>
            <div class="notification-formats__group-body">
              <div class="row g-2">
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdBy">Created By</label>
                    <input id="createdBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedBy">Modified By</label>
                    <input id="modifiedBy" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedBy">Supervised By</label>
                    <input id="supervisedBy" type="text" class="form-control" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="createdOn">Created On</label>
                    <input id="createdOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="modifiedOn">Modified On</label>
                    <input id="modifiedOn" type="text" class="form-control" />
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="cbs-field cm-compact-field">
                    <label class="cbs-label" for="supervisedOn">Supervised On</label>
                    <input id="supervisedOn" type="text" class="form-control" />
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action">View</button>
          <button type="button" class="cm-shell__action" disabled>Add</button>
          <button type="button" class="cm-shell__action" disabled>Edit</button>
          <button type="button" class="cm-shell__action" disabled>Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-nf-cancel>Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="../../../assets/js/pages/other-modules/views/NotificationFormats.embedded.js"></script>
</body>

</html>
