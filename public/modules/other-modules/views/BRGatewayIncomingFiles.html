<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BR Gateway Incoming Files · Other Modules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme br-gateway-incoming-files" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="brgif-layout">
          <section class="brgif-panel card-surface" aria-label="Format details">
            <div class="brgif-panel__header">Format Details</div>
            <div class="brgif-panel__body">
              <div class="brgif-form" aria-label="Incoming file parameters">
                <div class="brgif-row">
                  <div class="brgif-label">Format ID</div>
                  <div class="brgif-field">
                    <div class="brgif-field--spread" role="group" aria-label="Format ID">
                      <input type="text" class="form-control brgif-short" />
                      <span class="brgif-field__spacer" aria-hidden="true"></span>
                      <button class="btn btn-outline-primary" type="button" aria-label="Search format">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="brgif-row">
                  <div class="brgif-label">Description</div>
                  <div class="brgif-field">
                    <input type="text" class="form-control" />
                  </div>
                </div>

                <div class="brgif-row">
                  <div class="brgif-label">Currency ID</div>
                  <div class="brgif-field">
                    <div class="brgif-field--spread" role="group" aria-label="Currency ID">
                      <input type="text" class="form-control" />
                      <span class="brgif-field__spacer" aria-hidden="true"></span>
                      <button class="btn btn-outline-primary" type="button" aria-label="Search currency">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="brgif-row">
                  <div class="brgif-label">Narration</div>
                  <div class="brgif-field">
                    <input type="text" class="form-control" />
                  </div>
                </div>

                <div class="brgif-row">
                  <div class="brgif-label">Is File Encrypted</div>
                  <div class="brgif-field brgif-inline">
                    <div class="form-check m-0">
                      <input class="form-check-input" type="checkbox" id="brgifIsEncrypted" aria-label="Is File Encrypted" />
                    </div>
                  </div>
                </div>

                <div class="brgif-row">
                  <div class="brgif-label">File Path</div>
                  <div class="brgif-field">
                    <div class="brgif-filepath" role="group" aria-label="File Path">
                      <input type="text" class="form-control" />
                      <button class="btn btn-outline-secondary" type="button" disabled>Browse</button>
                    </div>
                  </div>
                </div>

                <div class="brgif-row brgif-row--two">
                  <div class="brgif-label">Value Date</div>
                  <div class="brgif-field">
                    <div class="input-group">
                      <input type="text" class="form-control brgif-date" value="29/Aug/2025" />
                      <button class="btn brgif-date-btn" type="button" aria-label="Select date">
                        <i class="bi bi-caret-down-fill"></i>
                      </button>
                    </div>
                  </div>

                  <div class="brgif-label">Company</div>
                  <div class="brgif-field">
                    <select class="form-select" aria-label="Company">
                      <option value="">--Select--</option>
                      <option value="TSEDEY" selected>TSEDEY</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="brgif-divider" aria-hidden="true"></div>

              <div class="brgif-grid" role="region" aria-label="Incoming files grid">
                <table class="table table-sm">
                  <thead>
                    <tr>
                      <th scope="col">TrxBranchID</th>
                      <th scope="col">Account ID</th>
                      <th scope="col">Name</th>
                      <th scope="col">Amount</th>
                      <th scope="col">Product ID</th>
                      <th scope="col">Error Remarks</th>
                      <th scope="col">Account Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="7" class="text-muted">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <aside class="brgif-actions" aria-label="Actions">
            <button type="button" class="btn brgif-action">View</button>
            <button type="button" class="btn brgif-action" disabled>Add</button>
            <button type="button" class="btn brgif-action" disabled>Post</button>
            <button type="button" class="btn brgif-action brgif-action--primary">Cancel</button>
            <button type="button" class="btn brgif-action" disabled>Back</button>
          </aside>
        </div>
      </section>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
