<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintain Locker · Other Modules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme maintain-locker" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item" data-ml-route="../data-entry/MaintainLockerAccess.html">
              <span>Locker Access</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="../data-entry/MaintainLockerKeyInfo.html">
              <span>Locker KeyInfo</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="../data-entry/MaintainLockerClose.html">
              <span>Close Locker</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" data-ml-route="../data-entry/MaintainLockerSignatories.html">
              <span>Locker Signatories</span>
            </button>
          </div>
        </div>

      </aside>

      <section class="cm-legacy-content" aria-label="Maintain Locker content">
        <div class="cm-scroll-region">
          <section class="card-surface maintain-locker__group" aria-label="Locker Account Details">
              <div class="maintain-locker__group-header">Locker Account Details</div>
              <div class="maintain-locker__group-body">
                <div class="row g-2">
                  <div class="col-12">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="branchId">Branch ID</label>
                      <div class="input-group">
                        <input id="branchId" type="text" class="form-control" value="0101" />
                        <input id="branchName" type="text" class="form-control" value="Head Office" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search branch">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="clientId">Client ID</label>
                      <div class="input-group">
                        <input id="clientId" type="text" class="form-control" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search client">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="productId">Product ID</label>
                      <div class="input-group">
                        <input id="productId" type="text" class="form-control" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search product">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerAccountId">Locker AccountID</label>
                      <div class="input-group">
                        <input id="lockerAccountId" type="text" class="form-control" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search locker account">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="chargeAccountId">Charge AccountID</label>
                      <div class="input-group">
                        <input id="chargeAccountId" type="text" class="form-control" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search charge account">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <hr class="maintain-locker__divider" />
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerDescription">Locker Description</label>
                      <div class="input-group">
                        <input id="lockerDescription" type="text" class="form-control" />
                        <button class="btn btn-outline-primary" type="button" aria-label="Search locker description">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerNo">Locker No</label>
                      <input id="lockerNo" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerKeyNumber">Locker Key Number</label>
                      <input id="lockerKeyNumber" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerIssuedOn">Locker Issued On</label>
                      <select id="lockerIssuedOn" class="form-select">
                        <option value="">--Select--</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerRentalDuration">Locker Rental Duration</label>
                      <input id="lockerRentalDuration" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="rentalAmount">Rental Amount</label>
                      <input id="rentalAmount" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="applyCharge">Apply Charge</label>
                      <select id="applyCharge" class="form-select">
                        <option>Immediately</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-12 col-lg-6">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="expiryDate">Expiry Date</label>
                      <input id="expiryDate" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="row g-2 align-items-end">
                      <div class="col-12 col-lg-8">
                        <div class="cbs-field cm-compact-field">
                          <label class="cbs-label" for="remarks">Remarks</label>
                          <textarea id="remarks" class="form-control" rows="3"></textarea>
                        </div>
                      </div>
                      <div class="col-12 col-lg-4 d-flex justify-content-lg-end">
                        <button type="button" class="btn btn-outline-secondary maintain-locker__proceed" disabled>
                          Proceed
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="maintain-locker__grid" role="region" aria-label="Locker accounts grid">
                      <table class="table table-sm mb-0">
                        <thead>
                          <tr>
                            <th scope="col">ComponentID</th>
                            <th scope="col">Amount</th>
                            <th scope="col">CrAccountID</th>
                            <th scope="col">CrAccountName</th>
                            <th scope="col">DrAccountID</th>
                            <th scope="col">DrAccountName</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="6" class="text-muted">No records to display.</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </section>

          <section class="card-surface maintain-locker__group mt-3" aria-label="Behind The Scene">
              <div class="maintain-locker__group-header">Behind The Scene</div>
              <div class="maintain-locker__group-body">
                <div class="row g-2">
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerStatus">Locker Status</label>
                      <input id="lockerStatus" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="rentalAmountPaid">Rental Amount Paid</label>
                      <input id="rentalAmountPaid" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="lockerKeyLostCharges">Locker Key Lost Charges</label>
                      <input id="lockerKeyLostCharges" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="surrenderOn">Surrender On</label>
                      <input id="surrenderOn" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="surrenderReason">Surrender Reason</label>
                      <input id="surrenderReason" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="surrenderBy">Surrender By</label>
                      <input id="surrenderBy" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12">
                    <hr class="maintain-locker__divider" />
                  </div>

                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="createdBy">Created By</label>
                      <input id="createdBy" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="modifiedBy">Modified By</label>
                      <input id="modifiedBy" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="supervisedBy">Supervised By</label>
                      <input id="supervisedBy" type="text" class="form-control" />
                    </div>
                  </div>

                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="createdOn">Created On</label>
                      <input id="createdOn" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="modifiedOn">Modified On</label>
                      <input id="modifiedOn" type="text" class="form-control" />
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="cbs-field cm-compact-field">
                      <label class="cbs-label" for="supervisedOn">Supervised On</label>
                      <input id="supervisedOn" type="text" class="form-control" />
                    </div>
                  </div>
                </div>
              </div>
            </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="maintain-locker__side-nav" aria-label="Record navigation">
          <div class="maintain-locker__side-row">
            <button type="button" class="maintain-locker__arrow" aria-label="Previous account">
              <i class="bi bi-arrow-left-square-fill" aria-hidden="true"></i>
            </button>
            <span class="maintain-locker__side-label">Account</span>
            <button type="button" class="maintain-locker__arrow" aria-label="Next account">
              <i class="bi bi-arrow-right-square-fill" aria-hidden="true"></i>
            </button>
          </div>
          <div class="maintain-locker__side-row">
            <button type="button" class="maintain-locker__arrow" aria-label="Previous locker number">
              <i class="bi bi-arrow-left-square-fill" aria-hidden="true"></i>
            </button>
            <span class="maintain-locker__side-label">Locker No</span>
            <button type="button" class="maintain-locker__arrow" aria-label="Next locker number">
              <i class="bi bi-arrow-right-square-fill" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Actions</p>
          <button type="button" class="cm-shell__action">View</button>
          <button type="button" class="cm-shell__action">Add</button>
          <button type="button" class="cm-shell__action" disabled>Edit</button>
          <button type="button" class="cm-shell__action" disabled>Save</button>
          <button type="button" class="cm-shell__action" disabled>Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/other-modules/views/MaintainLocker.embedded.js"></script>
</body>

</html>
