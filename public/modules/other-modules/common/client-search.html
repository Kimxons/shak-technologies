<!DOCTYPE html>
<html lang="en">
<head>

  <div class="dataentry-container">

            <div class="card-body form-grid two-col">

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Search · System Security</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="client-search.css" />
</head>
<body>
  <div class="dataentry-container">
    <div class="dataentry-main">
      <div class="dataentry-content">
        <form id="clientSearchForm" class="form" novalidate>
          <section class="card">
            <div class="card-header">
              <i class="bi bi-search" aria-hidden="true"></i>
              <span>Client Search Criteria</span>
            </div>
            <div class="card-body form-grid two-col">
              <div class="form-control-group">
                <label for="ClientID" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>Client ID</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="ClientID" name="ClientID" class="form-control search-field" data-field="ClientID" placeholder="Enter client ID" />
                </div>
              </div>
              <div class="form-control-group">
                <label for="ClientName" class="form-label"><i class="bi bi-person" aria-hidden="true"></i><span>Name</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="ClientName" name="ClientName" class="form-control search-field" data-field="ClientName" placeholder="Enter name" />
                </div>
              </div>

              <div class="form-control-group">
                <label for="IDNumber" class="form-label"><i class="bi bi-card-text" aria-hidden="true"></i><span>ID Number</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="IDNumber" name="IDNumber" class="form-control search-field" data-field="IDNumber" placeholder="Enter ID number" />
                </div>
              </div>
              <div class="form-control-group">
                <label for="MobileNo" class="form-label"><i class="bi bi-phone" aria-hidden="true"></i><span>Mobile No</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="MobileNo" name="MobileNo" class="form-control search-field" data-field="MobileNo" placeholder="Enter mobile number" />
                </div>
              </div>

              <div class="form-control-group">
                <label for="ClientApplicationID" class="form-label"><i class="bi bi-file-earmark-text" aria-hidden="true"></i><span>Client Application ID</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="ClientApplicationID" name="ClientApplicationID" class="form-control search-field" data-field="ClientApplicationID" placeholder="Enter application ID" />
                </div>
              </div>
              <div class="form-control-group">
                <label for="AccountID" class="form-label"><i class="bi bi-bank" aria-hidden="true"></i><span>Account ID</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="AccountID" name="AccountID" class="form-control search-field" data-field="AccountID" placeholder="Enter account ID" />
                </div>
              </div>

              <div class="form-control-group">
                <label for="MotherName" class="form-label"><i class="bi bi-person-heart" aria-hidden="true"></i><span>Mother Name</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="MotherName" name="MotherName" class="form-control search-field" data-field="MotherName" placeholder="Enter mother name" />
                </div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <i class="bi bi-table" aria-hidden="true"></i>
              <span>Search Results</span>
            </div>
            <div class="card-body">
              <div class="data-table">
                <table style="width: 100%; border-collapse: collapse;">
                  <thead>
                    <tr style="background: var(--primary); color: var(--white);">
                      <th style="padding: 8px; border: 1px solid var(--border);">Client ID</th>
                      <th style="padding: 8px; border: 1px solid var(--border);">Name</th>
                      <th style="padding: 8px; border: 1px solid var(--border);">ID Number</th>
                      <th style="padding: 8px; border: 1px solid var(--border);">Application ID</th>
                      <th style="padding: 8px; border: 1px solid var(--border);">Account ID</th>
                    </tr>
                  </thead>
                  <tbody id="resultsBody">
                    <tr>
                      <td colspan="5" style="padding: 20px; text-align: center; color: var(--text-light);">No results found</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </form>
      </div>
      <div class="dataentry-sidebar">
        <div class="dataentry-actions">
          <button type="button" class="action-btn search" id="btnSearch">
            <i class="bi bi-search" aria-hidden="true"></i>
            <span>Search</span>
          </button>
          <button type="button" class="action-btn cancel" data-dataentry-close>
            <i class="bi bi-x-circle" aria-hidden="true"></i>
            <span>Cancel</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const close = () => window.parent?.postMessage?.({ type: 'kairo-dataentry-close' }, '*');

      document.querySelectorAll('[data-dataentry-close]').forEach((btn) => {
        btn.addEventListener('click', () => close());
      });
    })();
  </script>

  <!-- Scripts -->
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="client-search-modal.js"></script>
</body>
</html>
