<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funder Search · Fund Source Maintenance</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="fundsourcemaintenancesearch.css" />
</head>
<body>
  <div class="window search-container">
    <form id="clientSearchForm" class="form" novalidate>
      <!-- Search Criteria Section -->
      <section class="card">
        <div class="card-header">
          <i class="bi bi-search" aria-hidden="true"></i>
          <span>Funder Search Criteria</span>
        </div>
        <div class="card-body">
          <div class="search-row">
            <div class="search-fields">
              <div class="form-control-group">
                <label for="searchFunderId" class="form-label"><i class="bi bi-person-badge" aria-hidden="true"></i><span>Funder ID</span></label>
                <div class="input-with-action">
                  <select id="funderIdOperator" class="form-control filter-op">
                    <option value="Like">Like</option>
                    <option value="Exactly">Exactly</option>
                  </select>
                  <input type="text" id="searchFunderId" class="form-control search-field" data-field="DonorID" placeholder="Enter Funder ID" />
                </div>
              </div>
              <div class="form-control-group">
                <label for="searchFunderName" class="form-label"><i class="bi bi-building" aria-hidden="true"></i><span>Funder Name</span></label>
                <div class="input-with-action">
                  <select id="funderNameOperator" class="form-control filter-op">
                    <option value="Like">Like</option>
                    <option value="Exactly">Exactly</option>
                  </select>
                  <input type="text" id="searchFunderName" class="form-control search-field" data-field="DonorName" placeholder="Enter Funder Name" />
                </div>
              </div>
            </div>
            <div class="search-actions">
              <button type="button" class="action-btn search" id="btnSearch">
                <i class="bi bi-search" aria-hidden="true"></i>
                <span>Search</span>
              </button>
              <button type="button" class="action-btn cancel" data-dataentry-close>
                <i class="bi bi-x-circle" aria-hidden="true"></i>
                <span>Cancel</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Results Section -->
      <section class="card">
        <div class="card-header">
          <i class="bi bi-table" aria-hidden="true"></i>
          <span>Search Results</span>
        </div>
        <div class="card-body">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Funder ID</th>
                  <th>Funder Name</th>
                </tr>
              </thead>
              <tbody id="resultsBody">
                <tr>
                  <td colspan="2" class="no-results">No results found</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </form>
  </div>
  <!-- Load required services -->
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../assets/js/services/shared/searchService.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="fundsourcemaintenancesearch-modal.js"></script>
</body>
</html>
