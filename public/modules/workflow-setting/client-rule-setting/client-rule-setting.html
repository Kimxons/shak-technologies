<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Rule Setting · Kairo Banking</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="client-rule-setting.css">
</head>
<body>
  <div class="kairo-container">
    <!-- Left Sidebar -->
    <aside class="kairo-sidebar">
      <div class="sidebar-section active">
        <div class="section-header">
          <i class="bi bi-caret-down-fill"></i>
          <span>DataEntry</span>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-header">
          <i class="bi bi-caret-right-fill"></i>
          <span>Group Loan Menu wise</span>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-header">
          <i class="bi bi-caret-right-fill"></i>
          <span>Rule Setting</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="kairo-content">
      <div id="statusMessage" class="status-message"></div>
      
      <form id="clientRuleForm" autocomplete="off" novalidate>
        <!-- Main Form Section -->
        <div class="kairo-card">
          <div class="card-body">
            <div class="form-grid-2col">
              <div class="form-group">
                <label for="workflowTypeId">
                  <i class="bi bi-diagram-3"></i>
                  <span>WorkFlow Type ID</span>
                </label>
                <div class="input-with-icon">
                  <input type="text" id="workflowTypeId" name="workflowTypeId" disabled>
                  <button type="button" class="search-btn" onclick="searchWorkflowType()" disabled>
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label for="workflowStage">
                  <i class="bi bi-flow"></i>
                  <span>Workflow Stage</span>
                </label>
                <select id="workflowStage" name="workflowStage" disabled>
                  <option value="">--Select--</option>
                  <option value="initiation">Initiation</option>
                  <option value="approval">Approval</option>
                  <option value="verification">Verification</option>
                  <option value="disbursement">Disbursement</option>
                  <option value="closure">Closure</option>
                </select>
              </div>

              <div class="form-group">
                <label for="ruleType">
                  <i class="bi bi-gear"></i>
                  <span>Rule Type</span>
                </label>
                <select id="ruleType" name="ruleType" disabled>
                  <option value="">--Select--</option>
                  <option value="validation">Validation Rules</option>
                  <option value="approval">Approval Rules</option>
                  <option value="calculation">Calculation Rules</option>
                  <option value="notification">Notification Rules</option>
                  <option value="mandatory">Mandatory Rules</option>
                </select>
              </div>

              <div class="form-group">
                <label for="ruleId">
                  <i class="bi bi-key"></i>
                  <span>Rule ID</span>
                </label>
                <div class="input-with-icon">
                  <input type="text" id="ruleId" name="ruleId" disabled>
                  <button type="button" class="search-btn" onclick="searchRule()" disabled>
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="form-group checkbox-group">
                <label>
                  <input type="checkbox" id="isMandatory" name="isMandatory" disabled>
                  <span>Is Mandatory</span>
                </label>
              </div>

              <div class="form-group checkbox-group">
                <label>
                  <input type="checkbox" id="allowOverride" name="allowOverride" disabled>
                  <span>Allow Override</span>
                </label>
              </div>
            </div>

            <!-- Data Grid with Action Buttons on Top -->
            <!-- Action Buttons -->
            <div class="form-actions">
              <button type="button" class="form-btn" id="newBtn" onclick="handleNew()">New</button>
              <button type="button" class="form-btn" id="alterBtn" onclick="handleAlter()" disabled>Alter</button>
              <button type="button" class="form-btn" id="removeBtn" onclick="handleRemove()" disabled>Remove</button>
              <button type="button" class="form-btn" id="updateBtn" onclick="handleUpdate()" disabled>Update</button>
              <button type="button" class="form-btn" id="clearBtn" onclick="handleClear()">Clear</button>
            </div>

            <!-- Data Grid -->
            <div class="data-grid">
              <div class="grid-header">
                <div class="grid-col">Rule ID</div>
                <div class="grid-col">Description</div>
                <div class="grid-col">IsMandatory</div>
                <div class="grid-col">RuleTypeName</div>
                <div class="grid-col">CanBeOverridden</div>
              </div>
              <div class="grid-body" id="gridBody">
                <div class="empty-state">No Records To Display</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div class="kairo-card">
          <div class="card-header">
            <i class="bi bi-caret-down-fill"></i>
            <span>Behind The Scene</span>
          </div>
          <div class="card-body">
            <div class="form-grid-3col">
              <div class="form-group">
                <label for="createdBy">
                  <i class="bi bi-person-plus"></i>
                  <span>Created By</span>
                </label>
                <input type="text" id="createdBy" name="createdBy" readonly>
              </div>

              <div class="form-group">
                <label for="modifiedBy">
                  <i class="bi bi-person-gear"></i>
                  <span>Modified By</span>
                </label>
                <input type="text" id="modifiedBy" name="modifiedBy" readonly>
              </div>

              <div class="form-group">
                <label for="supervisedBy">
                  <i class="bi bi-person-badge"></i>
                  <span>Supervised By</span>
                </label>
                <input type="text" id="supervisedBy" name="supervisedBy" readonly>
              </div>

              <div class="form-group">
                <label for="createdOn">
                  <i class="bi bi-calendar-check"></i>
                  <span>Created On</span>
                </label>
                <input type="text" id="createdOn" name="createdOn" readonly>
              </div>

              <div class="form-group">
                <label for="modifiedOn">
                  <i class="bi bi-calendar-event"></i>
                  <span>Modified On</span>
                </label>
                <input type="text" id="modifiedOn" name="modifiedOn" readonly>
              </div>

              <div class="form-group">
                <label for="supervisedOn">
                  <i class="bi bi-calendar-plus"></i>
                  <span>Supervised On</span>
                </label>
                <input type="text" id="supervisedOn" name="supervisedOn" readonly>
              </div>
            </div>
          </div>
        </div>
      </form>
    </main>

    <!-- Right Action Panel -->
    <aside class="kairo-actions">
      <div class="nav-buttons">
        <button type="button" class="nav-btn" onclick="navigateType(-1)">
          <i class="bi bi-arrow-left-circle"></i>
        </button>
        <span class="nav-label">Type</span>
        <button type="button" class="nav-btn" onclick="navigateType(1)">
          <i class="bi bi-arrow-right-circle"></i>
        </button>
      </div>

      <div class="nav-buttons">
        <button type="button" class="nav-btn" onclick="navigateStage(-1)">
          <i class="bi bi-arrow-left-circle"></i>
        </button>
        <span class="nav-label">Stage</span>
        <button type="button" class="nav-btn" onclick="navigateStage(1)">
          <i class="bi bi-arrow-right-circle"></i>
        </button>
      </div>

      <button type="button" class="action-btn" onclick="handleViewAll()">
        <i class="bi bi-list-ul"></i>
        <span>View All</span>
      </button>

      <div class="divider"></div>

      <button type="button" class="action-btn" onclick="handleView()">
        <i class="bi bi-eye"></i>
        <span>View</span>
      </button>
      <button type="button" class="action-btn" onclick="handleAdd()">
        <i class="bi bi-plus-circle"></i>
        <span>Add</span>
      </button>
      <button type="button" class="action-btn" onclick="handleEdit()">
        <i class="bi bi-pencil-square"></i>
        <span>Edit</span>
      </button>
      <button type="button" class="action-btn action-delete" onclick="handleDelete()">
        <i class="bi bi-trash"></i>
        <span>Delete</span>
      </button>
      <button type="button" class="action-btn action-save" id="saveBtn" onclick="handleSave()" disabled>
        <i class="bi bi-floppy"></i>
        <span>Save</span>
      </button>
      <button type="button" class="action-btn action-cancel" id="cancelBtn" onclick="handleCancel()" disabled>
        <i class="bi bi-x-circle"></i>
        <span>Cancel</span>
      </button>
    </aside>
  </div>

  <script src="client-rule-setting.js"></script>
</body>
</html>
