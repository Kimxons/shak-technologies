<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Rates</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="interest-rates-modal.css">
</head>
<body>
    <!-- Interest Rates Modal Container -->
    <div class="interest-modal-container">
        <div class="interest-content">
            <div class="content-scroll">
                <!-- Rate Configuration Section -->
                <div class="form-card">
                    <div class="rate-config-grid">
                        <div class="form-group">
                            <label for="rateType"><i class="bi bi-percent"></i> Rate Type</label>
                            <select id="rateType" class="form-input">
                                <option value="">--Select--</option>
                                <option value="advance">Advance Type</option>
                                <option value="deposit">Deposit Type</option>
                                <option value="loan">Loan Type</option>
                                <option value="overdraft">Overdraft Type</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="effectiveDate"><i class="bi bi-calendar-check"></i> Effective Date</label>
                            <select id="effectiveDate" class="form-input">
                                <option value="">--Select--</option>
                            </select>
                            <button class="search-icon-btn-inline" id="searchEffectiveDateBtn" title="Search Date">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>

                        <div class="form-group">
                            <label for="expiryDate"><i class="bi bi-calendar-x"></i> Expiry Date</label>
                            <select id="expiryDate" class="form-input">
                                <option value="">--Select--</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="baseRate"><i class="bi bi-graph-up"></i> Base Rate</label>
                            <input type="number" id="baseRate" class="form-input" step="0.01" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="refId"><i class="bi bi-hash"></i> Ref ID</label>
                            <input type="text" id="refId" class="form-input" placeholder="Enter Ref ID">
                        </div>
                    </div>
                </div>

                <!-- Amount Slab Wise Rate Section -->
                <div class="slab-card">
                    <div class="slab-header">
                        <h3><i class="bi bi-list-ol"></i> Amount Slab Wise Rate Of Interest</h3>
                    </div>
                    <div class="slab-content">
                        <table class="slab-table">
                            <thead>
                                <tr>
                                    <th style="width: 15%;">From</th>
                                    <th style="width: 15%;">To</th>
                                    <th style="width: 20%;">Mark Up / Down</th>
                                    <th style="width: 20%;">Effective Rate</th>
                                    <th style="width: 10%;"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <div class="slab-label">Amount 1.</div>
                                        <input type="number" class="slab-input" id="amount1From" value="0.00" step="0.01">
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount1To" step="0.01">
                                    </td>
                                    <td>
                                        <select class="slab-select" id="amount1MarkUp">
                                            <option value="">--Sel</option>
                                            <option value="up">Mark Up</option>
                                            <option value="down">Mark Down</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount1Rate" step="0.01">
                                    </td>
                                    <td rowspan="5" style="vertical-align: top; padding-top: 10px;">
                                        <button class="btn-slab-add" title="Add Row">
                                            <i class="bi bi-plus-circle-fill"></i>
                                        </button>
                                        <button class="btn-slab-add" title="Remove Row" style="margin-left: 5px;">
                                            <i class="bi bi-dash-circle-fill"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="slab-label">Amount 2.</div>
                                        <input type="number" class="slab-input" id="amount2From" step="0.01">
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount2To" step="0.01">
                                    </td>
                                    <td>
                                        <select class="slab-select" id="amount2MarkUp">
                                            <option value="">--Sel</option>
                                            <option value="up">Mark Up</option>
                                            <option value="down">Mark Down</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount2Rate" step="0.01">
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="slab-label">Amount 3.</div>
                                        <input type="number" class="slab-input" id="amount3From" step="0.01">
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount3To" step="0.01">
                                    </td>
                                    <td>
                                        <select class="slab-select" id="amount3MarkUp">
                                            <option value="">--Sel</option>
                                            <option value="up">Mark Up</option>
                                            <option value="down">Mark Down</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount3Rate" step="0.01">
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="slab-label">Amount 4.</div>
                                        <input type="number" class="slab-input" id="amount4From" step="0.01">
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount4To" step="0.01">
                                    </td>
                                    <td>
                                        <select class="slab-select" id="amount4MarkUp">
                                            <option value="">--Sel</option>
                                            <option value="up">Mark Up</option>
                                            <option value="down">Mark Down</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount4Rate" step="0.01">
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="slab-label">Amount 5.</div>
                                        <input type="number" class="slab-input" id="amount5From" step="0.01">
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount5To" step="0.01">
                                    </td>
                                    <td>
                                        <select class="slab-select" id="amount5MarkUp">
                                            <option value="">--Sel</option>
                                            <option value="up">Mark Up</option>
                                            <option value="down">Mark Down</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="amount5Rate" step="0.01">
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="slab-label">Penalty Rate</div>
                                    </td>
                                    <td>
                                        <select class="slab-select" id="penaltyMarkUp">
                                            <option value="">--Sel</option>
                                            <option value="up">Mark Up</option>
                                            <option value="down">Mark Down</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" class="slab-input" id="penaltyRate" step="0.01">
                                    </td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Interest Rates History Table -->
                <div class="history-card">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>RefNo</th>
                                <th>EffectiveDate</th>
                                <th>CeilingAmount1</th>
                                <th>EffectiveRate1</th>
                                <th>CeilingAmount2</th>
                                <th>EffectiveRate2</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr class="empty-row">
                                <td colspan="6">There are no Items to be Displayed</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Behind The Scene Section -->
                <div class="scene-card">
                    <div class="scene-header">
                        <h3><i class="bi bi-info-circle"></i> Behind The Scene</h3>
                    </div>
                    <div class="scene-content">
                        <div class="scene-grid-3col">
                            <div class="form-group">
                                <label for="createdBy"><i class="bi bi-person"></i> Created By</label>
                                <input type="text" id="createdBy" class="form-input-readonly" readonly>
                            </div>

                            <div class="form-group">
                                <label for="modifiedBy"><i class="bi bi-person-gear"></i> Modified By</label>
                                <input type="text" id="modifiedBy" class="form-input-readonly" readonly>
                            </div>

                            <div class="form-group">
                                <label for="supervisedBy"><i class="bi bi-person-check"></i> Supervised By</label>
                                <input type="text" id="supervisedBy" class="form-input-readonly" readonly>
                            </div>

                            <div class="form-group">
                                <label for="createdOn"><i class="bi bi-calendar-plus"></i> Created On</label>
                                <input type="text" id="createdOn" class="form-input-readonly" readonly>
                            </div>

                            <div class="form-group">
                                <label for="modifiedOn"><i class="bi bi-calendar-event"></i> Modified On</label>
                                <input type="text" id="modifiedOn" class="form-input-readonly" readonly>
                            </div>

                            <div class="form-group">
                                <label for="supervisedOn"><i class="bi bi-calendar-check"></i> Supervised On</label>
                                <input type="text" id="supervisedOn" class="form-input-readonly" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Error/Status Message -->
                <div id="statusMessage" class="status-message hidden"></div>
            </div>
        </div>

        <!-- Action Buttons Sidebar -->
        <div class="action-sidebar">
            <button class="btn-sidebar btn-view" id="viewBtn">
                <i class="bi bi-eye-fill"></i> View
            </button>
            <button class="btn-sidebar btn-add" id="addBtn">
                <i class="bi bi-plus-circle"></i> Add
            </button>
            <button class="btn-sidebar btn-edit" id="editBtn">
                <i class="bi bi-pencil-fill"></i> Edit
            </button>
            <button class="btn-sidebar btn-delete" id="deleteBtn">
                <i class="bi bi-trash-fill"></i> Delete
            </button>
            <button class="btn-sidebar btn-save" id="saveBtn">
                <i class="bi bi-save-fill"></i> Save
            </button>
            <button class="btn-sidebar btn-cancel" id="cancelBtn">
                <i class="bi bi-x-circle"></i> Cancel
            </button>
            <div class="action-divider"></div>
            <button class="btn-sidebar btn-back" id="backBtn">
                <i class="bi bi-arrow-left-circle"></i> Back
            </button>
        </div>
    </div>

    <script src="interest-rates-modal.js"></script>
</body>
</html>
