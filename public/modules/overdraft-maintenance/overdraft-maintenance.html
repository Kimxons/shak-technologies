<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overdraft Maintenance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="overdraft-maintenance.css">
</head>
<body>
    <!-- Overdraft Maintenance Container -->
    <div class="overdraft-container">
        <!-- Left Sidebar Navigation -->
        <div class="overdraft-sidebar">
            <div class="sidebar-header">
                <h3><i class="bi bi-screwdriver-wrench"></i> Overdraft Maintenance</h3>
            </div>
            <div class="sidebar-menu">
                <button class="menu-item active" data-section="dataentry">
                    <i class="bi bi-keyboard-fill"></i> DataEntry
                </button>
                <button class="menu-item" data-section="guarantor">
                    <i class="bi bi-person-check-fill"></i> Guarantor
                </button>
                <button class="menu-item" data-section="interest-rates">
                    <i class="bi bi-percent"></i> Interest Rates
                </button>
                <button class="menu-item" data-section="documents">
                    <i class="bi bi-file-earmark-text"></i> Documents
                </button>
                <button class="menu-item" data-section="recent-activities">
                    <i class="bi bi-clock-history"></i> Recent Activities
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="overdraft-content">
            <div class="content-scroll">
                <!-- Account Identification Section -->
                <div class="form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="branchId"><i class="bi bi-building-fill"></i> Branch ID</label>
                            <div class="input-display-group">
                                <input type="text" id="branchId" class="form-input-small" value="0101">
                                <input type="text" id="branchName" class="form-input-flex" value="Head Office" readonly>
                                <button class="search-icon-btn-inline" id="searchBranchBtn" title="Search Branch">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="clientId"><i class="bi bi-person-badge"></i> Client ID</label>
                            <div class="input-display-group">
                                <input type="text" id="clientId" class="form-input-flex" placeholder="Enter client ID">
                                <button class="search-icon-btn-inline" id="searchClientBtn" title="Search Client">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label for="accountId"><i class="bi bi-bank"></i> Account ID</label>
                            <div class="input-display-group">
                                <input type="text" id="accountId" class="form-input-flex" placeholder="Enter account ID">
                                <button class="search-icon-btn-inline" id="searchAccountBtn" title="Search Account">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Overdraft Details Section -->
                <div class="form-card">
                    <div class="card-header">
                        <h3><i class="bi bi-credit-card-2-front"></i> Overdraft Details</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="amount"><i class="bi bi-cash-stack"></i> Amount</label>
                            <input type="number" id="amount" class="form-input" placeholder="Enter amount">
                        </div>

                        <div class="form-group">
                            <label for="creditOfficer"><i class="bi bi-person-workspace"></i> Credit Officer</label>
                            <input type="text" id="creditOfficer" class="form-input" placeholder="Enter credit officer">
                        </div>

                        <div class="form-group">
                            <label for="expiryDate"><i class="bi bi-calendar-x"></i> Expiry Date</label>
                            <input type="date" id="expiryDate" class="form-input" value="0001-01-01">
                        </div>

                        <div class="form-group">
                            <label for="reviewDate"><i class="bi bi-calendar-check"></i> Review Date</label>
                            <input type="date" id="reviewDate" class="form-input" value="0001-01-01">
                        </div>

                        <div class="form-group full-width">
                            <label for="remarks"><i class="bi bi-chat-left-text"></i> Remarks</label>
                            <textarea id="remarks" class="form-textarea" rows="2" placeholder="Enter remarks"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="clientLimit"><i class="bi bi-shield-check"></i> Client Limit</label>
                            <input type="number" id="clientLimit" class="form-input" placeholder="Enter client limit">
                        </div>

                        <div class="form-group">
                            <label for="clientLimitExpiry"><i class="bi bi-calendar-event"></i> Client Limit Expiry</label>
                            <input type="date" id="clientLimitExpiry" class="form-input" value="0001-01-01">
                        </div>

                        <div class="form-group">
                            <label for="mainRepaymentAccountId"><i class="bi bi-bank2"></i> Main Repayment AccountID</label>
                            <div class="input-display-group">
                                <input type="text" id="mainRepaymentAccountId" class="form-input-flex" placeholder="Enter account ID">
                                <button class="search-icon-btn-inline" id="searchRepaymentBtn" title="Search Account">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="drawingPower"><i class="bi bi-lightning-charge"></i> Drawing Power</label>
                            <input type="number" id="drawingPower" class="form-input" placeholder="Enter drawing power">
                        </div>
                    </div>
                </div>

                <!-- Limit Details Section -->
                <div class="form-card">
                    <div class="card-header">
                        <h3><i class="bi bi-sliders"></i> Limit Details</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="limitId"><i class="bi bi-hash"></i> Limit ID</label>
                            <input type="text" id="limitId" class="form-input" placeholder="Enter limit ID">
                        </div>

                        <div class="form-group">
                            <label for="healthCode"><i class="bi bi-heart-pulse"></i> Health Code</label>
                            <select id="healthCode" class="form-input">
                                <option value="">--Select--</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="todLimitAmount"><i class="bi bi-currency-exchange"></i> TOD Limit Amount</label>
                            <input type="number" id="todLimitAmount" class="form-input" placeholder="Enter TOD limit">
                        </div>

                        <div class="form-group">
                            <label for="todExpiry"><i class="bi bi-calendar-range"></i> TOD Expiry</label>
                            <input type="date" id="todExpiry" class="form-input" value="0001-01-01">
                        </div>

                        <div class="form-group">
                            <label for="odLimitAmount"><i class="bi bi-currency-dollar"></i> OD Limit Amount</label>
                            <input type="number" id="odLimitAmount" class="form-input" placeholder="Enter OD limit">
                        </div>

                        <div class="form-group">
                            <label for="odExpiry"><i class="bi bi-calendar-range-fill"></i> OD Expiry</label>
                            <input type="date" id="odExpiry" class="form-input" value="0001-01-01">
                        </div>
                    </div>
                </div>

                <!-- Interest & Provision Section -->
                <div class="form-card">
                    <div class="card-header">
                        <h3><i class="bi bi-percent"></i> Interest & Provision</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="accruedInterest"><i class="bi bi-calculator"></i> Accrued Interest</label>
                            <input type="number" id="accruedInterest" class="form-input" placeholder="Enter accrued interest">
                        </div>

                        <div class="form-group">
                            <label for="interestDue"><i class="bi bi-exclamation-triangle"></i> Interest Due</label>
                            <input type="number" id="interestDue" class="form-input" placeholder="Enter interest due">
                        </div>

                        <div class="form-group">
                            <label for="provisionAmount"><i class="bi bi-piggy-bank"></i> Provision Amount</label>
                            <input type="number" id="provisionAmount" class="form-input" placeholder="Enter provision">
                        </div>

                        <div class="form-group">
                            <label for="suspendedInterest"><i class="bi bi-pause-circle"></i> Suspended Interest</label>
                            <input type="number" id="suspendedInterest" class="form-input" placeholder="Enter suspended interest">
                        </div>

                        <div class="form-group">
                            <label for="interestDueDays"><i class="bi bi-calendar-day"></i> Interest Due Days</label>
                            <input type="number" id="interestDueDays" class="form-input" placeholder="Enter days">
                        </div>

                        <div class="form-group">
                            <label for="excessDays"><i class="bi bi-calendar-plus"></i> Excess Days</label>
                            <input type="number" id="excessDays" class="form-input" placeholder="Enter excess days">
                        </div>
                    </div>
                </div>

                <!-- Behind The Scene Section -->
                <div class="scene-card">
                    <div class="scene-header">
                        <h3><i class="bi bi-info-circle"></i> Behind The Scene</h3>
                    </div>
                    <div class="scene-grid">
                        <div class="form-group">
                            <label for="clearBalance"><i class="bi bi-check-circle"></i> Clear Balance</label>
                            <input type="number" id="clearBalance" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="freezedAmount"><i class="bi bi-lock-fill"></i> Freezed Amount</label>
                            <input type="number" id="freezedAmount" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="unclearBalance"><i class="bi bi-hourglass-split"></i> Unclear Balance</label>
                            <input type="number" id="unclearBalance" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="availableBalance"><i class="bi bi-wallet2"></i> Available Balance</label>
                            <input type="number" id="availableBalance" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="unsupervisedCredit"><i class="bi bi-arrow-up-circle"></i> UnSupervised Credit</label>
                            <input type="number" id="unsupervisedCredit" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="totalBalance"><i class="bi bi-calculator-fill"></i> Total Balance</label>
                            <input type="number" id="totalBalance" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="unsupervisedDebit"><i class="bi bi-arrow-down-circle"></i> Unsupervised Debit</label>
                            <input type="number" id="unsupervisedDebit" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="productId"><i class="bi bi-box"></i> Product ID</label>
                            <input type="text" id="productId" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="status"><i class="bi bi-flag-fill"></i> Status</label>
                            <input type="text" id="status" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="currencyId"><i class="bi bi-currency-exchange"></i> Currency ID</label>
                            <input type="text" id="currencyId" class="form-input-readonly" readonly>
                        </div>
                    </div>

                    <div class="scene-separator"></div>

                    <div class="scene-grid-audit">
                        <div class="form-group">
                            <label for="createdBy"><i class="bi bi-person"></i> Created By</label>
                            <input type="text" id="createdBy" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="modifiedBy"><i class="bi bi-person-gear"></i> Modified By</label>
                            <input type="text" id="modifiedBy" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="supervisedBy"><i class="bi bi-person-check"></i> Supervised By</label>
                            <input type="text" id="supervisedBy" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="createdOn"><i class="bi bi-calendar-plus"></i> Created On</label>
                            <input type="text" id="createdOn" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="modifiedOn"><i class="bi bi-calendar-event"></i> Modified On</label>
                            <input type="text" id="modifiedOn" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="supervisedOn"><i class="bi bi-calendar-check"></i> Supervised On</label>
                            <input type="text" id="supervisedOn" class="form-input-readonly" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons Sidebar -->
        <div class="action-sidebar">
            <div class="navigation-buttons">
                <button class="btn-nav btn-prev" id="prevAccountBtn" title="Previous Account">
                    <i class="bi bi-arrow-left-circle-fill"></i>
                </button>
                <button class="btn-nav btn-next" id="nextAccountBtn" title="Next Account">
                    <i class="bi bi-arrow-right-circle-fill"></i>
                </button>
            </div>
            <div class="action-divider"></div>
            <button class="btn-sidebar btn-view" id="viewBtn">
                <i class="bi bi-eye-fill"></i> View
            </button>
            <button class="btn-sidebar btn-edit" id="editBtn">
                <i class="bi bi-pencil-fill"></i> Edit
            </button>
            <button class="btn-sidebar btn-review" id="reviewBtn">
                <i class="bi bi-clipboard-check"></i> Review
            </button>
            <button class="btn-sidebar btn-save" id="saveBtn">
                <i class="bi bi-save-fill"></i> Save
            </button>
            <button class="btn-sidebar btn-cancel" id="cancelBtn">
                <i class="bi bi-x-circle"></i> Cancel
            </button>
        </div>
    </div>

    <!-- Guarantor Modal -->
    <div id="guarantorModal" class="od-modal">
        <div class="od-modal-content">
            <div class="od-modal-header">
                <h2><i class="bi bi-person-check-fill"></i> Guarantor Management</h2>
                <button class="od-modal-close" onclick="closeGuarantorModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="od-modal-body">
                <iframe src="guarantor-modal.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <!-- Interest Rates Modal -->
    <div id="interestRatesModal" class="od-modal">
        <div class="od-modal-content">
            <div class="od-modal-header">
                <h2><i class="bi bi-percent"></i> Interest Rates</h2>
                <button class="od-modal-close" onclick="closeInterestRatesModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="od-modal-body">
                <iframe src="interest-rates-modal.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <!-- Documents Modal -->
    <div id="documentsModal" class="od-modal">
        <div class="od-modal-content">
            <div class="od-modal-header">
                <h2><i class="bi bi-file-earmark-text"></i> Documents</h2>
                <button class="od-modal-close" onclick="closeDocumentsModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="od-modal-body">
                <iframe src="documents-modal.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <script src="overdraft-maintenance.js"></script>
</body>
</html>
