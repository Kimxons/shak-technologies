<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Special Interest Rates · Deposit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
<link rel="stylesheet" href="../../assets/css/treasury.css" /></head>

<body class="deposit-maintenance copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>
  <div class="cm-workspace">
    <div class="p-2">
      <div class="d-flex gap-2 align-items-stretch">
        <div class="flex-grow-1 min-w-0">
          <section class="card-surface p-0 overflow-hidden tr-panel" aria-label="Special interest rates">
            <div class="tr-panel__header">Special Interest Rates</div>
            <div class="tr-panel__body">
              <div class="cbs-grid cbs-grid--two cbs-grid--tight">
                <div class="cbs-field">
                  <label class="cbs-label" for="EffectiveDate">Effective Date</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="EffectiveDate" name="EffectiveDate" data-date-picker placeholder="dd/mmm/yyyy" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search effective date"><i class="bi bi-search"></i></button>
                  </div>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ReferenceNo">Reference No.</label>
                  <input type="text" class="form-control" id="ReferenceNo" name="ReferenceNo" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="InterestRate">Interest Rate</label>
                  <input type="text" class="form-control" id="InterestRate" name="InterestRate" />
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 justify-content-center mt-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" disabled>New</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" disabled>Alter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" disabled>Remove</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" disabled>Update</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" disabled>Clear</button>
              </div>

              <hr class="my-3" />

              <div class="table-responsive">
                <table class="table tr-table mb-0" aria-label="Special interest rate list">
                  <thead>
                    <tr>
                      <th scope="col">ReferenceNo</th>
                      <th scope="col">Start Date</th>
                      <th scope="col">End Date</th>
                      <th scope="col">Interest Rate</th>
                      <th scope="col">(Days)</th>
                      <th scope="col">Interest</th>
                      <th scope="col">Tax</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="7" class="py-2">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="card-surface p-0 overflow-hidden tr-panel mt-2" aria-label="Behind the scene">
            <div class="tr-panel__header">Behind The Scene</div>
            <div class="tr-panel__body">
              <div class="row g-2">
                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="CreatedBy">Created By</label></div>
                    <div class="col"><input type="text" class="form-control" id="CreatedBy" name="CreatedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="CreatedOn">Created On</label></div>
                    <div class="col"><input type="text" class="form-control" id="CreatedOn" name="CreatedOn" readonly /></div>
                  </div>
                </div>

                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="ModifiedBy">Modified By</label></div>
                    <div class="col"><input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="ModifiedOn">Modified On</label></div>
                    <div class="col"><input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" readonly /></div>
                  </div>
                </div>

                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="SupervisedBy">Supervised By</label></div>
                    <div class="col"><input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="SupervisedOn">Supervised On</label></div>
                    <div class="col"><input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" readonly /></div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <aside class="cm-legacy-actions card-surface" aria-label="Special interest rates actions" style="width: clamp(110px, 9vw, 150px);">
          <div class="cm-legacy-actions__group">
            <button type="button" class="cm-shell__action">View</button>
            <button type="button" class="cm-shell__action">Add</button>
            <button type="button" class="cm-shell__action" disabled>Edit</button>
          </div>

          <div class="cm-legacy-actions__group">
            <button type="button" class="cm-shell__action" disabled>Delete</button>
            <button type="button" class="cm-shell__action cm-shell__action--success" disabled>Save</button>
            <button type="button" class="cm-shell__action cm-shell__action--danger">Cancel</button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
