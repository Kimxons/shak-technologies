<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rule Details · Accounting Rule</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201" />
</head>

<body class="copilot-theme" data-page="rule-details">
  <div class="window">
    <!-- Title Bar -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-calculator am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Rule Details</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container" aria-label="Rule Details form">
      <div class="form-content" role="region">
        <div class="form-card" data-main-form>
          <!-- Filter & Search Section -->
          <div class="form-section" data-section="filter-search">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-search"></i>Filter & Search
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Filter & Search" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="Event">Event</label>
                  <select class="bs-select" id="Event" name="Event">
                    <option value="">--Select--</option>
                  </select>
                </div>
                <div class="col">
                  <label class="label-blue" for="ProductTypes">Product Types</label>
                  <input type="text" class="bs-input" id="ProductTypes" name="ProductTypes" readonly />
                </div>
              </div>
            </div>
          </div>

          <!-- Rule Details Section -->
          <div class="form-section" data-section="rule-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-receipt"></i>Rule Details
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Rule Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="Component">Component</label>
                  <select class="bs-select" id="Component" name="Component" disabled>
                    <option value="">--Select--</option>
                  </select>
                </div>
                <div class="col">
                  <label class="label-blue">Component Details</label>
                  <div class="text-muted pt-2 small" id="ComponentDetails">Component details will appear here</div>
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="DebitAccountTag">Debit Account Tag</label>
                  <select class="bs-select" id="DebitAccountTag" name="DebitAccountTag" disabled>
                    <option value="">--Select--</option>
                  </select>
                </div>
                <div class="col"></div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="CreditAccountTag">Credit Account Tag</label>
                  <select class="bs-select" id="CreditAccountTag" name="CreditAccountTag" disabled>
                    <option value="">--Select--</option>
                  </select>
                </div>
                <div class="col"></div>
              </div>

              <div class="form-row">
                <div class="col">
                  <label class="label-blue" for="Narration">Narration</label>
                  <input type="text" class="bs-input" id="Narration" name="Narration" placeholder="Enter narration" disabled />
                </div>
              </div>

              <!-- Inline Action Buttons -->
              <div class="d-flex flex-wrap gap-2 justify-content-center mt-2" role="group" aria-label="Rule details row actions">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-inline-action="new" disabled>New</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-inline-action="alter" disabled>Alter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-inline-action="remove" disabled>Remove</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-inline-action="update" disabled>Update</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-inline-action="clear" disabled>Clear</button>
              </div>
            </div>
          </div>

          <!-- Rule Details Grid Section -->
          <div class="form-section" data-section="grid">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-table"></i>Rule Details List
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Grid" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content p-0" data-section-content>
              <hr class="my-3" />

              <div class="table-responsive">
                <table class="table table-striped mb-0" id="RuleDetailsTable" aria-label="Rule details list">
                  <thead>
                    <tr>
                      <th scope="col">Component</th>
                      <th scope="col">Debit Account Tag</th>
                      <th scope="col">Credit Account Tag</th>
                      <th scope="col">Debit Trx ID</th>
                      <th scope="col">Credit Trx ID</th>
                    </tr>
                  </thead>
                  <tbody id="RuleDetailsBody">
                    <tr>
                      <td colspan="5" class="py-2">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              
              <!-- Order Controls (from first HTML, positioned like second HTML) -->
              <div class="d-flex justify-content-between align-items-center p-2 border-top">
                <div class="order-controls" id="orderControls" aria-label="Order controls">
                  <button class="btn btn-sm btn-outline-primary order-btn" type="button" data-order-action="up" 
                          aria-label="Move up" title="Move Up">
                    <i class="bi bi-arrow-up"></i>
                  </button>
                  <span class="small fw-bold text-primary text-uppercase order-label">Order</span>
                  <button class="btn btn-sm btn-outline-primary order-btn" type="button" data-order-action="down" 
                          aria-label="Move down" title="Move Down">
                    <i class="bi bi-arrow-down"></i>
                  </button>
                </div>
                <span class="badge bg-secondary" id="recordCount">0 records</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view">
            <i class="bi bi-eye"></i>View
          </button>
          <button type="button" class="btn-action" data-action="add" disabled>
            <i class="bi bi-plus-circle"></i>Add
          </button>
          <button type="button" class="btn-action" data-action="edit" disabled>
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button type="button" class="btn-action btn-danger" data-action="delete" disabled>
            <i class="bi bi-trash"></i>Delete
          </button>
          <button type="button" class="btn-action btn-save" data-action="save" disabled>
            <i class="bi bi-floppy"></i>Save
          </button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel" disabled>
            <i class="bi bi-x-circle"></i>Cancel
          </button>
          <button type="button" class="btn-action" data-action="back">
            <i class="bi bi-arrow-left"></i>Back
          </button>
        </div>
      </div>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading...</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/product/productLgLcService.js?v=3"></script>
  <script src="../../assets/js/pages/product/rule-details.js"></script>
  <script>
    (function() {
      // Window controls
      function closeChild() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ action: 'submoduleClosed', source: 'rule-details' }, '*');
          } else {
            window.close();
          }
        } catch (err) {
          console.error('Error closing child form:', err);
        }
      }

      function handleWindowAction(action, btn) {
        const win = document.querySelector('.window');
        switch (action) {
          case 'refresh':
            window.location.reload();
            break;
          case 'maximize':
            if (!win) return;
            const isMax = win.classList.toggle('maximized');
            const icon = btn.querySelector('i');
            if (icon) icon.className = isMax ? 'bi bi-fullscreen-exit' : 'bi bi-square';
            btn.title = isMax ? 'Restore' : 'Maximize';
            btn.setAttribute('aria-label', isMax ? 'Restore window' : 'Maximize window');
            break;
          case 'close':
            closeChild();
            break;
        }
      }

      function initWindowControls() {
        document.querySelectorAll('.de-title-btn[data-action]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            handleWindowAction(btn.getAttribute('data-action'), btn);
          });
        });
      }

      // Section toggle functionality
      function initSectionToggles() {
        document.querySelectorAll('[data-section-toggle]').forEach((header) => {
          header.style.cursor = 'pointer';
          header.addEventListener('click', function(e) {
            if (e.target.closest('input, select, textarea')) return;
            if (e.target.closest('button') && !e.target.closest('.section-toggle-btn')) return;
            
            const section = this.closest('.form-section');
            if (!section) return;
            
            const content = section.querySelector('[data-section-content]');
            const btn = this.querySelector('.section-toggle-btn');
            const icon = btn ? btn.querySelector('i') : null;
            const isExpanded = btn ? btn.getAttribute('aria-expanded') === 'true' : true;

            if (content) {
              content.hidden = isExpanded;
            }
            if (btn) {
              btn.setAttribute('aria-expanded', String(!isExpanded));
            }
            if (icon) {
              icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
            }
          });
        });
      }

      function init() {
        initWindowControls();
        initSectionToggles();
        console.log('[RuleDetails] UI initialized');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
