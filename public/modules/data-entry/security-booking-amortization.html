<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amortization Schedule · Security Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
<link rel="stylesheet" href="../../assets/css/treasury.css" /></head>

<body class="security-booking copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <div class="p-2">
      <div class="d-flex gap-2 align-items-stretch">
        <div class="flex-grow-1 min-w-0">
          <section class="card-surface p-0 overflow-hidden tr-panel" aria-label="Amortization schedule content">
            <div class="tr-panel__body">
              <div class="cbs-grid cbs-grid--four cbs-grid--tight">
                <div class="cbs-field">
                  <label class="cbs-label" for="AmortInstNo">Inst No.</label>
                  <input type="text" class="form-control" id="AmortInstNo" name="AmortInstNo" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ScheduleStartDate">Schedule Start Date</label>
                  <select class="form-select" id="ScheduleStartDate" name="ScheduleStartDate"><option value="">01/Jan/0001</option></select>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="AmortMarketValue">Market Value</label>
                  <input type="text" class="form-control" id="AmortMarketValue" name="AmortMarketValue" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="EffectiveInterest">Effective Interest</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="EffectiveInterest" name="EffectiveInterest" />
                    <button type="button" class="btn btn-outline-secondary" disabled>Calculate</button>
                  </div>
                </div>
              </div>
            </div>

          <div class="tr-panel__body p-0 border-top">
            <div class="table-responsive">
              <table class="table tr-table mb-0" aria-label="Amortization schedule table">
                <thead>
                  <tr>
                    <th scope="col">Inst No.</th>
                    <th scope="col">SchDate</th>
                    <th scope="col">PMT</th>
                    <th scope="col">Interest</th>
                    <th scope="col">Amortization</th>
                    <th scope="col">Carrying Value</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="6" class="py-2">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <section class="p-0 overflow-hidden tr-panel border-top" aria-label="Behind the scene (amortization)">
            <div class="tr-panel__header">Behind The Scene</div>
            <div class="tr-panel__body">
              <div class="row g-3">
                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-6 text-sm-end"><label class="sb-kpi-label" for="AmortCreatedBy">Created By</label></div>
                    <div class="col"><input type="text" class="form-control" id="AmortCreatedBy" name="AmortCreatedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-6 text-sm-end"><label class="sb-kpi-label" for="AmortCreatedOn">Created On</label></div>
                    <div class="col"><input type="text" class="form-control" id="AmortCreatedOn" name="AmortCreatedOn" readonly /></div>
                  </div>
                </div>
                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-6 text-sm-end"><label class="sb-kpi-label" for="AmortModifiedBy">Modified By</label></div>
                    <div class="col"><input type="text" class="form-control" id="AmortModifiedBy" name="AmortModifiedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-6 text-sm-end"><label class="sb-kpi-label" for="AmortModifiedOn">Modified On</label></div>
                    <div class="col"><input type="text" class="form-control" id="AmortModifiedOn" name="AmortModifiedOn" readonly /></div>
                  </div>
                </div>
                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-6 text-sm-end"><label class="sb-kpi-label" for="AmortSupervisedBy">Supervised By</label></div>
                    <div class="col"><input type="text" class="form-control" id="AmortSupervisedBy" name="AmortSupervisedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-6 text-sm-end"><label class="sb-kpi-label" for="AmortSupervisedOn">Supervised On</label></div>
                    <div class="col"><input type="text" class="form-control" id="AmortSupervisedOn" name="AmortSupervisedOn" readonly /></div>
                  </div>
                </div>
              </div>
            </div>
          </section>
          </section>
        </div>

        <aside class="cm-legacy-actions card-surface" aria-label="Amortization schedule actions" style="width: clamp(110px, 9vw, 150px);">
          <div class="cm-legacy-actions__group">
            <button type="button" class="cm-shell__action">View</button>
            <button type="button" class="cm-shell__action">Add</button>
            <button type="button" class="cm-shell__action" disabled>Edit</button>
          </div>

          <div class="cm-legacy-actions__group">
            <button type="button" class="cm-shell__action" disabled>Delete</button>
            <button type="button" class="cm-shell__action cm-shell__action--success" disabled>Save</button>
            <button type="button" class="cm-shell__action cm-shell__action--danger">Cancel</button>
          </div>
        </aside>
      </div>
    </div>
  </div>
</body>

</html>
