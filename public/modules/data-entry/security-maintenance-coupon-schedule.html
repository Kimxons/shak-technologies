<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coupon Schedule · Security Maintenance</title>
  <!-- Match Account Maintenance DataEntry (Documents) look -->
  <link rel="stylesheet" href="../account-maintenance/DataEntry/account-documents.css" />
  <link rel="stylesheet" href="../account-maintenance/DataEntry/dataentry-theme.css" />
  <style>
    /* Small additions for Coupon Schedule fields/table using the same ACD shell */
    .csc-checkbox {
      width: 14px;
      height: 14px;
    }

    .csc-field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .csc-field-row .acd-input {
      max-width: 240px;
    }

    .csc-final {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
      white-space: nowrap;
    }

    /* Fields layout */
    .csc-top-fields {
      min-width: 0;
    }

    /* Horizontal centered button row matching signatories exactly */
    .csc-actions {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      padding: 10px 0 14px 0 !important;
      margin: 0 !important;
      width: 100% !important;
    }

    .csc-btn {
      min-width: 100px !important;
      max-width: 100px !important;
      height: 28px !important;
      padding: 0 20px !important;
      border-radius: 3px !important;
      border: 1px solid #b5b5b5 !important;
      background: linear-gradient(to bottom, #f5f5f5, #e0e0e0) !important;
      color: #333 !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08) !important;
      text-align: center !important;
      line-height: 1 !important;
      display: inline-block !important;
    }

    .csc-btn:disabled {
      opacity: 0.5 !important;
      cursor: not-allowed !important;
    }

    /* Right action panel buttons like legacy */
    .csc-side-btn {
      width: 100%;
      height: 36px;
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      background: linear-gradient(#f7f7f7, #e6e6e6);
      font-weight: 700;
      color: #5a6c7d;
    }

    /* Align action buttons at the bottom-right like the legacy load screen */
    .acd-action-panel {
      display: flex;
      flex-direction: column;
    }

    .acd-action-panel .acd-action-buttons {
      margin-top: auto;
    }

    .csc-side-btn:disabled {
      opacity: 0.65;
    }

    .csc-side-btn--cancel {
      color: #000;
      text-decoration: underline;
    }

    .csc-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid var(--border, #dde6ed);
    }

    .csc-table th,
    .csc-table td {
      border: 1px solid rgba(10, 107, 165, 0.12);
      padding: 6px 8px;
      font-size: 11px;
    }

    .csc-table th {
      background: rgba(10, 107, 165, 0.06);
      color: var(--text-dark, #2c3e50);
      font-weight: 700;
    }

    .csc-muted {
      color: var(--text-gray, #5a6c7d);
    }
  </style>
</head>

<body>
  <div class="acd-window" id="cscWindow">
    <!-- <div class="acd-title-bar" role="banner" aria-label="Window title bar">
      <div class="acd-title-bar__left">
        <span class="acd-title-bar__icon" aria-hidden="true">☰</span>
        <span class="acd-title-bar__text">1201 : Coupon Schedule</span>
      </div>
      <div class="acd-title-bar__right" aria-label="Window controls">
        <button class="acd-title-btn" type="button" data-csc-title-action="refresh" title="Refresh" aria-label="Refresh">🔄</button>
        <button class="acd-title-btn" type="button" data-csc-title-action="minimize" title="Minimize" aria-label="Minimize">—</button>
        <button class="acd-title-btn close" type="button" data-csc-title-action="close" title="Close" aria-label="Close">✕</button>
      </div>
    </div> -->

    <div class="acd-main">
      <div class="acd-form-shell" role="region" aria-label="Coupon Schedule form">
        <div class="acd-section-header">Coupon Schedule</div>

        <form class="acd-form" autocomplete="off">
          <div class="acd-row acd-row--split">
            <div class="acd-split">
              <label class="acd-label acd-label--blue" for="InstNo">Inst No.</label>
              <input type="text" id="InstNo" name="InstNo" class="acd-input acd-input--docid" />
            </div>
            <div class="acd-split">
              <label class="acd-label acd-label--blue" for="Period">Period</label>
              <input type="text" id="Period" name="Period" class="acd-input" />
            </div>
          </div>

          <div class="acd-row acd-row--split">
            <div class="acd-split">
              <label class="acd-label acd-label--blue" for="CouponDate">Coupon Date</label>
              <input type="text" id="CouponDate" name="CouponDate" class="acd-input" data-date-picker placeholder="dd/mmm/yyyy" />
            </div>
            <div class="acd-split">
              <div class="csc-field-row">
                <label class="acd-label acd-label--blue" for="Percentage" style="min-width: 82px;">Percentage</label>
                <input type="text" id="Percentage" name="Percentage" class="acd-input" />
                <span class="csc-final">
                  <label class="acd-label" for="IsFinal" style="min-width: auto;">Final</label>
                  <input class="csc-checkbox" type="checkbox" id="IsFinal" name="IsFinal" />
                </span>
              </div>
            </div>
          </div>

          <div class="acd-row acd-row--split">
            <div class="acd-split">
              <div class="csc-field-row">
                <label class="acd-label" for="IsMultipleRedemption" style="min-width: 120px;">Mutiple Redemption</label>
                <input class="csc-checkbox" type="checkbox" id="IsMultipleRedemption" name="IsMultipleRedemption" />
              </div>
            </div>
            <div class="acd-split"></div>
          </div>

          <div class="acd-section-header" style="margin-top: 6px;">Schedule</div>
          <div style="overflow: auto; max-height: 280px;">
            <table class="csc-table" aria-label="Coupon schedule table" id="cscTable">
              <thead>
                <tr>
                  <th scope="col" style="width: 120px;">Inst No.</th>
                  <th scope="col" style="width: 160px;">Is Mutiple Redeem</th>
                  <th scope="col">Coupon Date</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="3" class="csc-muted">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="acd-section-header" style="margin-top: 10px;">Behind The Scene</div>

          <div class="acd-audit-grid" role="group" aria-label="Behind the scene audit">
            <div class="acd-audit-block">
              <div class="acd-audit-row">
                <label class="acd-label" for="CreatedBy">Created By</label>
                <input type="text" id="CreatedBy" name="CreatedBy" class="acd-input acd-input--audit" readonly />
              </div>
              <div class="acd-audit-row">
                <label class="acd-label" for="CreatedOn">Created On</label>
                <input type="text" id="CreatedOn" name="CreatedOn" class="acd-input acd-input--audit" readonly />
              </div>
            </div>

            <div class="acd-audit-block">
              <div class="acd-audit-row">
                <label class="acd-label" for="ModifiedBy">Modified By</label>
                <input type="text" id="ModifiedBy" name="ModifiedBy" class="acd-input acd-input--audit" readonly />
              </div>
              <div class="acd-audit-row">
                <label class="acd-label" for="ModifiedOn">Modified On</label>
                <input type="text" id="ModifiedOn" name="ModifiedOn" class="acd-input acd-input--audit" readonly />
              </div>
            </div>

            <div class="acd-audit-block">
              <div class="acd-audit-row">
                <label class="acd-label" for="SupervisedBy">Supervised By</label>
                <input type="text" id="SupervisedBy" name="SupervisedBy" class="acd-input acd-input--audit" readonly />
              </div>
              <div class="acd-audit-row">
                <label class="acd-label" for="SupervisedOn">Supervised On</label>
                <input type="text" id="SupervisedOn" name="SupervisedOn" class="acd-input acd-input--audit" readonly />
              </div>
            </div>
          </div>
        </form>
      </div>

      <aside class="acd-action-panel" aria-label="Actions">
        <div class="acd-action-buttons" role="group" aria-label="Record actions" style="gap: 10px;">
          <button class="csc-side-btn" type="button" disabled>Edit</button>
          <button class="csc-side-btn" type="button" disabled>Reset</button>
          <button class="csc-side-btn" type="button" disabled>Save</button>
          <button class="csc-side-btn csc-side-btn--cancel" type="button" data-csc-title-action="close">Cancel</button>
        </div>
      </aside>
    </div>

    <div class="acd-status-bar" role="status"><span class="csc-muted"></span></div>
  </div>

  <script src="../../js/pages/treasury/security-maintenance-coupon-schedule.js"></script>
</body>

</html>
