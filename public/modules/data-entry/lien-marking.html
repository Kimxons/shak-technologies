<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lien Marking · Deposit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
<link rel="stylesheet" href="../../assets/css/treasury.css" /></head>

<body class="deposit-maintenance copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>
  <div class="cm-workspace">
    <div class="p-2">
      <div class="d-flex gap-2 align-items-stretch">
        <div class="flex-grow-1 min-w-0">
          <section class="card-surface p-0 overflow-hidden tr-panel" aria-label="Lien marking">
            <div class="tr-panel__header">Lien Marking</div>
            <div class="tr-panel__body">
              <div class="cbs-grid cbs-grid--two cbs-grid--tight mb-2">
                <div class="cbs-field">
                  <label class="cbs-label" for="ReferenceNo">Reference No.</label>
                  <input type="text" class="form-control" id="ReferenceNo" name="ReferenceNo" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="LienDate">Lien Date</label>
                  <input type="text" class="form-control" id="LienDate" name="LienDate" data-date-picker placeholder="dd/mmm/yyyy" />
                </div>
              </div>

              <hr class="my-3" />

              <div class="cbs-grid cbs-grid--two cbs-grid--tight">
                <div class="cbs-field">
                  <label class="cbs-label" for="AdvanceBranchId">Advance Branch ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="AdvanceBranchId" name="AdvanceBranchId" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search branch"><i class="bi bi-search"></i></button>
                  </div>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="AdvanceAccountId">Advance Account ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="AdvanceAccountId" name="AdvanceAccountId" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search account"><i class="bi bi-search"></i></button>
                  </div>
                </div>
              </div>

              <hr class="my-3" />

              <div class="cbs-grid cbs-grid--two cbs-grid--tight">
                <div class="cbs-field">
                  <label class="cbs-label" for="InstructedBy">Instructed By</label>
                  <input type="text" class="form-control" id="InstructedBy" name="InstructedBy" />
                </div>

                <div class="cbs-field"></div>

                <div class="cbs-field cbs-full">
                  <label class="cbs-label" for="LienRemarks">Remarks</label>
                  <textarea class="form-control" id="LienRemarks" name="LienRemarks" rows="2"></textarea>
                </div>
              </div>

              <hr class="my-3" />

              <div class="cbs-grid cbs-grid--two cbs-grid--tight">
                <div class="cbs-field">
                  <label class="cbs-label" for="ReleaseInstructedBy">Release Instructed By</label>
                  <input type="text" class="form-control" id="ReleaseInstructedBy" name="ReleaseInstructedBy" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ReleaseDate">Release Date</label>
                  <input type="text" class="form-control" id="ReleaseDate" name="ReleaseDate" data-date-picker placeholder="dd/mmm/yyyy" />
                </div>

                <div class="cbs-field cbs-full">
                  <label class="cbs-label" for="ReleaseRemarks">Release Remarks</label>
                  <textarea class="form-control" id="ReleaseRemarks" name="ReleaseRemarks" rows="2"></textarea>
                </div>
              </div>

              <hr class="my-3" />

              <div class="cbs-grid cbs-grid--two cbs-grid--tight">
                <div class="cbs-field">
                  <label class="cbs-label" for="BtsProductId">Product ID</label>
                  <input type="text" class="form-control" id="BtsProductId" name="BtsProductId" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="BtsCurrencyId">Currency ID</label>
                  <input type="text" class="form-control" id="BtsCurrencyId" name="BtsCurrencyId" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="DepositAmount">Deposit Amount</label>
                  <input type="text" class="form-control" id="DepositAmount" name="DepositAmount" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="MaturityAmount">Maturity Amount</label>
                  <input type="text" class="form-control" id="MaturityAmount" name="MaturityAmount" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="DepositDate">Deposit Date</label>
                  <input type="text" class="form-control" id="DepositDate" name="DepositDate" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="MaturityDate">Maturity Date</label>
                  <input type="text" class="form-control" id="MaturityDate" name="MaturityDate" readonly />
                </div>
              </div>

              <hr class="my-3" />

              <div class="row g-2">
                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="CreatedBy">Created By</label></div>
                    <div class="col"><input type="text" class="form-control" id="CreatedBy" name="CreatedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="CreatedOn">Created On</label></div>
                    <div class="col"><input type="text" class="form-control" id="CreatedOn" name="CreatedOn" readonly /></div>
                  </div>
                </div>

                <div class="col-lg-4"></div>

                <div class="col-lg-4">
                  <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="SupervisedBy">Supervised By</label></div>
                    <div class="col"><input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" readonly /></div>
                  </div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-12 col-sm-5 text-sm-end"><label class="tr-label" for="SupervisedOn">Supervised On</label></div>
                    <div class="col"><input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" readonly /></div>
                  </div>
                </div>
              </div>

              <div class="mt-2" style="color: var(--bs-danger); font-weight: 600;">No Account details found [No:130007]</div>
            </div>
          </section>
        </div>

        <aside class="cm-legacy-actions card-surface" aria-label="Lien marking actions" style="width: clamp(110px, 9vw, 150px);">
          <div class="cm-legacy-actions__group">
            <button type="button" class="cm-shell__action">View</button>
            <button type="button" class="cm-shell__action">Add</button>
            <button type="button" class="cm-shell__action" disabled>Edit</button>
          </div>

          <div class="cm-legacy-actions__group">
            <button type="button" class="cm-shell__action" disabled>Delete</button>
            <button type="button" class="cm-shell__action cm-shell__action--success" disabled>Save</button>
            <button type="button" class="cm-shell__action cm-shell__action--danger">Cancel</button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
