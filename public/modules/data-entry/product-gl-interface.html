<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product GL Interface · Product</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201" />
</head>
<body class="copilot-theme" data-page="product-gl-interface">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-diagram-3 am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Product GL Interface</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container" aria-label="Product GL Interface form">
      <div class="form-content" role="region">
        <div class="form-card" data-main-form>
          <div class="form-section" data-section="gl-interface">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-diagram-3"></i>GL Interface</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle GL Interface" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="GlAccountTag">Account Tag</label>
                  <select class="bs-select" id="GlAccountTag" name="GlAccountTag"></select>
                </div>
                <div class="col">
                  <label class="label-blue" for="GlAccountId">Account ID</label>
                  <div class="input-group">
                    <input type="text" class="bs-input-text form-control" id="GlAccountId" name="GlAccountId" />
                    <button class="btn btn-outline-primary" type="button" data-pgi-search="account" aria-label="Search account id">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 justify-content-center mt-2" role="group" aria-label="GL interface row actions">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-pgi-action="alter" disabled>Alter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-pgi-action="remove" disabled>Remove</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-pgi-action="update-row" disabled>Update</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-pgi-action="clear" disabled>Clear</button>
              </div>

              <hr class="my-3" />

              <div class="table-responsive">
                <table class="table table-striped mb-0" aria-label="GL interface mappings">
                  <thead>
                    <tr>
                      <th scope="col">Account Tag</th>
                      <th scope="col" style="width: 160px;">Account ID</th>
                      <th scope="col">Account Name</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="3" class="py-2">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="GlCreatedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="GlCreatedOn">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="GlModifiedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="GlModifiedOn">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="GlSupervisedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="GlSupervisedOn">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button class="btn-action" type="button" data-pgi-action="add" title="Add">
            <i class="bi bi-plus-circle"></i>Add
          </button>
          <button class="btn-action" type="button" data-shell-mode="update" title="Edit">
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button class="btn-action btn-delete" type="button" data-pgi-action="delete" title="Delete">
            <i class="bi bi-trash3"></i>Delete
          </button>
          <button class="btn-action btn-save" type="button" data-pgi-action="save" title="Save">
            <i class="bi bi-check-lg"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-pgi-action="cancel" title="Cancel">
            <i class="bi bi-x-circle"></i>Cancel
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/services/glAccountSearchService.js"></script>
  <script src="../../assets/js/pages/product/product-gl-interface.js"></script>
  <script>
    (function () {
      function closeChild() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'closeChildForm' }, '*');
          } else {
            window.close();
          }
        } catch (err) {
          console.error('Error closing child form:', err);
        }
      }

      function handleWindowAction(action, btn) {
        const win = document.querySelector('.window');
        switch (action) {
          case 'refresh':
            window.location.reload();
            break;
          case 'maximize':
            if (!win) return;
            const isMax = win.classList.toggle('maximized');
            const icon = btn.querySelector('i');
            if (icon) icon.className = isMax ? 'bi bi-fullscreen-exit' : 'bi bi-square';
            btn.title = isMax ? 'Restore' : 'Maximize';
            btn.setAttribute('aria-label', isMax ? 'Restore window' : 'Maximize window');
            break;
          case 'close':
            closeChild();
            break;
        }
      }

      function initWindowControls() {
        document.querySelectorAll('.de-title-btn[data-action]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            handleWindowAction(btn.getAttribute('data-action'), btn);
          });
        });
      }

      // Section toggle functionality
      function initSectionToggles() {
        document.querySelectorAll('[data-section-toggle]').forEach((header) => {
          // Remove any existing listeners by cloning
          const newHeader = header.cloneNode(true);
          header.parentNode.replaceChild(newHeader, header);
          
          newHeader.style.cursor = 'pointer';
          newHeader.addEventListener('click', function(e) {
            // Don't toggle if clicking on inputs or non-toggle buttons
            if (e.target.closest('input, select, textarea')) return;
            if (e.target.closest('button') && !e.target.closest('.section-toggle-btn')) return;
            
            const section = this.closest('.form-section');
            if (!section) return;
            
            const content = section.querySelector('[data-section-content]');
            const btn = this.querySelector('.section-toggle-btn');
            const icon = btn ? btn.querySelector('i') : null;
            const isExpanded = btn ? btn.getAttribute('aria-expanded') === 'true' : true;

            if (content) {
              content.hidden = isExpanded;
            }
            if (btn) {
              btn.setAttribute('aria-expanded', String(!isExpanded));
            }
            if (icon) {
              icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
            }
          });
        });
      }

      function init() {
        initWindowControls();
        initSectionToggles();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
