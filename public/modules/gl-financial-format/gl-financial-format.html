<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL Financial Format · General Ledger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="gl-financial-format.css" />
</head>

<body class="client-maintenance copilot-theme gl-financial-format" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="gl-financial-format-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-scroll-region">
          <!-- Header area to mirror classic window caption -->
          <section class="card-surface gff-main-form">
            <div class="gff-header">
              <h3 class="gff-title">GL Financial Format</h3>
              <div class="gff-toolbar">
                <label for="glReportType" class="cbs-label me-2">GL Report Type</label>
                <select id="glReportType" class="form-select form-select-sm gff-report-select" aria-label="GL Report Type">
                  <option value="">--Select--</option>
                </select>
              </div>
            </div>

            <!-- Type Section -->
            <div class="gff-types mb-3" style="display: none;" id="typesSection">
              <div class="table-responsive">
                <table class="table table-sm table-bordered align-middle mb-0">
                  <thead>
                    <tr class="text-muted">
                      <th style="width: 60px;"></th>
                      <th style="width: 100px;">Type</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody id="typesTableBody">
                    <tr><td colspan="3" class="text-muted py-2">No types loaded</td></tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Group Type and Sub Type sections -->
            <div class="row g-3 gff-canvases" id="groupSubTypeSection" style="display: none;">
              <div class="col-md-6">
                <div class="gff-canvas card-surface--muted">
                  <div class="gff-canvas-title">Group Type</div>
                  <div class="gff-canvas-body" style="max-height: 200px; overflow-y: auto;">
                    <table class="table table-sm table-bordered align-middle mb-0">
                      <thead>
                        <tr class="text-muted">
                          <th style="width: 60px;"></th>
                          <th style="width: 100px;">Group Type</th>
                          <th>Description</th>
                        </tr>
                      </thead>
                      <tbody id="groupTypeTableBody">
                        <tr><td colspan="3" class="text-muted py-2">No items loaded</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="gff-canvas card-surface--muted">
                  <div class="gff-canvas-title">Sub Type</div>
                  <div class="gff-canvas-body" style="max-height: 200px; overflow-y: auto;">
                    <table class="table table-sm table-bordered align-middle mb-0">
                      <thead>
                        <tr class="text-muted">
                          <th style="width: 60px;"></th>
                          <th style="width: 100px;">Sub Type</th>
                          <th>Description</th>
                        </tr>
                      </thead>
                      <tbody id="subTypeTableBody">
                        <tr><td colspan="3" class="text-muted py-2">No items loaded</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <!-- Account Grid -->
            <div class="gff-grid card-surface--muted mt-3">
              <div class="table-responsive">
                <table class="table table-sm table-borderless align-middle mb-0">
                  <thead>
                    <tr class="text-muted">
                      <th style="width: 220px;">Account ID</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="2" class="text-muted py-4">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- Footer bar echoing classic tab strip area -->
          <section class="card-surface gff-footer">
            <h3 class="gff-section-title">BR.Net Web Banking</h3>
          </section>
        </div>
      </section>

      <!-- Actions rail (right) -->
      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group gff-actions-top">
          <button type="button" class="cm-shell__action" id="printBtn"><i class="bi bi-printer me-1"></i>Print</button>
        </div>
        <div class="cm-legacy-actions__group gff-actions-bottom">
          <button type="button" class="cm-shell__action" id="viewBtn">View</button>
          <button type="button" class="cm-shell__action" id="editBtn">Edit</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" id="saveBtn">Save</button>
          <button type="button" class="cm-shell__action" id="cancelBtn">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="gl-financial-format.js"></script>
</body>

</html>
