<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Penalty Calculation Rule</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="loan-penalty-calculation-rule">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-exclamation-triangle am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Loan Penalty Calculation Rule</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Loan Penalty Calculation Rule form">
        <div class="form-card" data-main-form>
          <form id="loanPenaltyCalcForm" autocomplete="off" novalidate>
            <div class="form-section" data-section="loan-penalty-detail">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid" aria-hidden="true"></i>Loan Penalty Calculation Detail</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Loan Penalty Calculation Detail" aria-expanded="true"><i class="bi bi-chevron-up" aria-hidden="true"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="penaltyRuleId">Penalty Rule ID</label>
                    <div class="kairo-control">
                      <input type="text" id="penaltyRuleId" name="penaltyRuleId" class="kairo-control__id" autocomplete="off" required />
                      <button type="button" class="btn-lookup kairo-control__lookup" data-action="searchPenaltyRule" aria-label="Search Penalty Rule" title="Search"><i class="bi bi-search" aria-hidden="true"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ruleName">Rule Name</label>
                    <input type="text" id="ruleName" name="ruleName" class="bs-input-text" autocomplete="off" required />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="penaltyType">Penalty Type</label>
                    <select id="penaltyType" name="penaltyType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="late_payment">Late Payment Penalty</option>
                      <option value="default">Default Penalty</option>
                      <option value="early_settlement">Early Settlement Penalty</option>
                      <option value="missed_payment">Missed Payment Penalty</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="penaltyMethod">Penalty Calculation Method</label>
                    <select id="penaltyMethod" name="penaltyMethod" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="percentage">Percentage of Outstanding</option>
                      <option value="flat_fee">Flat Fee</option>
                      <option value="daily_rate">Daily Penalty Rate</option>
                      <option value="tiered">Tiered Penalty</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="penaltyBasis">Penalty Basis</label>
                    <select id="penaltyBasis" name="penaltyBasis" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="overdue_amount">Overdue Amount</option>
                      <option value="installment_amount">Installment Amount</option>
                      <option value="outstanding_balance">Outstanding Balance</option>
                      <option value="original_principal">Original Principal</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="balanceType">Balance Type</label>
                    <select id="balanceType" name="balanceType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="available">Available Balance</option>
                      <option value="ledger">Ledger Balance</option>
                      <option value="cleared">Cleared Balance</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="triggerCondition">Trigger Condition</label>
                    <select id="triggerCondition" name="triggerCondition" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="days_overdue">Days Overdue</option>
                      <option value="missed_payment">Missed Payment</option>
                      <option value="default_status">Default Status</option>
                      <option value="early_settlement">Early Settlement</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="dayCountBasis">Day Count Basis</label>
                    <select id="dayCountBasis" name="dayCountBasis" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="actual360">Actual/360</option>
                      <option value="actual365">Actual/365</option>
                      <option value="30360">30/360</option>
                      <option value="actualactual">Actual/Actual</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="daysThreshold">Days Overdue Threshold</label>
                    <input type="number" id="daysThreshold" name="daysThreshold" class="bs-input-text" min="0" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="penaltyRateAmount">Penalty Rate/Amount</label>
                    <input type="number" id="penaltyRateAmount" name="penaltyRateAmount" class="bs-input-text" step="0.01" min="0" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="effectiveDate">Effective Date</label>
                    <input type="text" id="effectiveDate" name="effectiveDate" class="bs-input-text" data-date-picker placeholder="dd/mmm/yyyy" autocomplete="off" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="expiryDate">Expiry Date</label>
                    <input type="text" id="expiryDate" name="expiryDate" class="bs-input-text" data-date-picker placeholder="dd/mmm/yyyy" autocomplete="off" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="waivePenalty" name="waivePenalty" />
                      <label class="form-check-label" for="waivePenalty">Allow Penalty Waiver</label>
                    </div>
                  </div>
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="cappedPenalty" name="cappedPenalty" />
                      <label class="form-check-label" for="cappedPenalty">Capped Penalty</label>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="compoundPenalty" name="compoundPenalty" />
                      <label class="form-check-label" for="compoundPenalty">Compound Penalty</label>
                    </div>
                  </div>
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="autoApply" name="autoApply" />
                      <label class="form-check-label" for="autoApply">Auto-Apply Penalty</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="audit">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history" aria-hidden="true"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true"><i class="bi bi-chevron-up" aria-hidden="true"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section audit-section--summary">
                  <div class="audit-cell"><span class="audit-label">Created By</span><span class="audit-value" id="createdBy">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Created On</span><span class="audit-value" id="createdOn">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Created Time</span><span class="audit-value" id="createdTime">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified By</span><span class="audit-value" id="modifiedBy">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified On</span><span class="audit-value" id="modifiedOn">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified Time</span><span class="audit-value" id="modifiedTime">-</span></div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <aside class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view" title="View"><i class="bi bi-eye" aria-hidden="true"></i>View</button>
          <button type="button" class="btn-action" data-action="add" title="Add"><i class="bi bi-plus-circle" aria-hidden="true"></i>Add</button>
          <button type="button" class="btn-action" data-action="edit" title="Edit"><i class="bi bi-pencil" aria-hidden="true"></i>Edit</button>
          <button type="button" class="btn-action" data-action="delete" title="Delete"><i class="bi bi-trash" aria-hidden="true"></i>Delete</button>
          <button type="button" class="btn-action btn-save" id="saveBtn" data-action="save" title="Save" disabled><i class="bi bi-check-circle" aria-hidden="true"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" id="cancelBtn" data-action="cancel" title="Cancel" disabled><i class="bi bi-x-circle" aria-hidden="true"></i>Cancel</button>
          <button type="button" class="btn-action" data-action="back" title="Back"><i class="bi bi-box-arrow-left" aria-hidden="true"></i>Back</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle" aria-hidden="true"></i>
      <span></span>
    </div>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/searchService.js"></script>
  <script src="../../assets/js/shared/search-modal.js"></script>
  <script src="loan-penalty-calculation-rule.js"></script>
</body>
</html>
