<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Role Access Rights · Data Entry</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="role-access-rights.css" />
  <link rel="stylesheet" href="../../../account-maintenance/DataEntry/dataentry-theme.css" />
  <style>
    /* Uniform styling for all text elements */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    
    /* Table styling */
    table {
      font-size: 13px;
    }
    
    table th {
      font-size: 13px;
      font-weight: 600;
    }
    
    table td {
      font-size: 13px;
    }
    
    /* Card headers */
    .card-header {
      font-size: 14px;
      font-weight: 600;
    }
    
    /* All labels */
    label {
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }
    
    /* All input fields */
    input[type="text"],
    input[type="number"] {
      font-size: 13px;
      font-family: inherit;
      color: #333;
    }
    
    /* Checkboxes */
    input[type="checkbox"] {
      cursor: pointer;
    }
    
    input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }
    
    /* Table row hover consistency */
    tbody tr {
      transition: background-color 0.15s ease;
    }
  </style>
</head>

<body>
  <div class="cu-window" data-cu-window>
    <div class="cu-title-bar" role="banner" aria-label="Window title bar">
      <div class="cu-title-bar__left">
        <span class="cu-title-bar__icon" aria-hidden="true"></span>
        <span class="cu-title-bar__text">Role Access Rights</span>
      </div>
      <div class="cu-title-bar__right" aria-label="Window controls">
        <button class="cu-title-btn close" type="button" data-cu-close title="Close" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="cu-main">
      <div class="cu-content-shell" role="region" aria-label="Role Access Rights">
        <div class="cu-scroll">
        <!-- Left Column: Module Tables -->
        <div style="display: flex; gap: 16px; height: 100%;">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 450px;">
            <!-- Main Modules Table -->
            <section class="card" style="flex: 1; display: flex; flex-direction: column;">
              <div class="card-body" style="display: flex; flex-direction: column; height: 100%;">
                <div style="flex: 1; overflow-y: auto;">
                  <table id="mainModulesTable" style="width: 100%; border-collapse: collapse;">
                    <thead style="position: sticky; top: 0; z-index: 1;">
                      <tr style="background: var(--primary); color: var(--white);">
                        <th style="padding: 8px; border: 1px solid var(--border); text-align: left;">Main Module</th>
                        <th style="padding: 8px; border: 1px solid var(--border); text-align: left;">Module Type</th>
                        <th style="padding: 8px; border: 1px solid var(--border); text-align: center; width: 100px;">Is Selected</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="3" style="padding: 20px; text-align: center; color: var(--text-light);">No modules to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>

            <!-- Module Screens Table -->
            <section class="card" style="flex: 1; display: flex; flex-direction: column;">
              <div class="card-body" style="display: flex; flex-direction: column; height: 100%;">
                <div style="flex: 1; overflow-y: auto;">
                  <table id="moduleScreensTable" style="width: 100%; border-collapse: collapse;">
                    <thead style="position: sticky; top: 0; z-index: 1;">
                      <tr style="background: var(--primary); color: var(--white);">
                        <th style="padding: 8px; border: 1px solid var(--border); text-align: left;">Module Name</th>
                        <th style="padding: 8px; border: 1px solid var(--border); text-align: center; width: 100px;">Is Selected</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="2" style="padding: 20px; text-align: center; color: var(--text-light);">Select a module to view screens.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>

          <!-- Right Column: Rights Panels -->
          <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 450px;">
            <!-- Module Rights Panel -->
            <section class="card">
              <div class="card-header" style="background: var(--primary); color: var(--white); padding: 8px 16px; font-weight: 600;">
                Module Rights
              </div>
              <div class="card-body" style="padding: 16px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="margin: 0; flex: 1;">Allow Add</label>
                    <input type="checkbox" id="allowAdd" disabled style="width: 18px; height: 18px;" />
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="margin: 0; flex: 1;">Allow Edit</label>
                    <input type="checkbox" id="allowEdit" disabled style="width: 18px; height: 18px;" />
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="margin: 0; flex: 1;">Allow Delete</label>
                    <input type="checkbox" id="allowDelete" disabled style="width: 18px; height: 18px;" />
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="margin: 0; flex: 1;">Is Supervision Required</label>
                    <input type="checkbox" id="supervisionRequired" disabled style="width: 18px; height: 18px;" />
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Credit Posting Limit</label>
                    <input type="text" id="creditPostingLimit" value="0.00" disabled style="width: 100%; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Debit Posting Limit</label>
                    <input type="text" id="debitPostingLimit" value="0.00" disabled style="width: 100%; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Supervision Rights Panel -->
            <section class="card">
              <div class="card-header" style="background: var(--primary); color: var(--white); padding: 8px 16px; font-weight: 600;">
                Supervision Rights
              </div>
              <div class="card-body" style="padding: 16px;">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="margin: 0; flex: 1;">Allow Supervision</label>
                    <input type="checkbox" id="allowSupervision" disabled style="width: 18px; height: 18px;" />
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                    <label style="margin: 0;">Credit Supervision Limit</label>
                    <input type="text" id="creditSupervisionLimit" value="0.00" disabled style="width: 120px; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                    <label style="margin: 0;">Debit Supervision Limit</label>
                    <input type="text" id="debitSupervisionLimit" value="0.00" disabled style="width: 120px; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                    <label style="margin: 0;">Excess Supervision Limit</label>
                    <input type="text" id="excessSupervisionLimit" value="0.00" disabled style="width: 120px; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                    <label style="margin: 0;">Joint Credit Supervision Limit</label>
                    <input type="text" id="jointCreditSupervisionLimit" value="0.00" disabled style="width: 120px; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                    <label style="margin: 0;">Joint Debit Supervision Limit</label>
                    <input type="text" id="jointDebitSupervisionLimit" value="0.00" disabled style="width: 120px; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                    <label style="margin: 0;">Joint Excess Supervision Limit</label>
                    <input type="text" id="jointExcessSupervisionLimit" value="0.00" disabled style="width: 120px; padding: 6px; text-align: right; border: 1px solid var(--border);" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Behind The Scene Panel -->
            <section class="card">
              <div class="card-header" style="background: var(--primary); color: var(--white); padding: 8px 16px; font-weight: 600;">
                Behind The Scene
              </div>
              <div class="card-body" style="padding: 16px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Created By</label>
                    <input type="text" id="createdBy" disabled style="width: 100%; padding: 6px; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Created On</label>
                    <input type="text" id="createdOn" disabled style="width: 100%; padding: 6px; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Modified By</label>
                    <input type="text" id="modifiedBy" disabled style="width: 100%; padding: 6px; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Modified On</label>
                    <input type="text" id="modifiedOn" disabled style="width: 100%; padding: 6px; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Supervised By</label>
                    <input type="text" id="supervisedBy" disabled style="width: 100%; padding: 6px; border: 1px solid var(--border);" />
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="margin: 0;">Supervised On</label>
                    <input type="text" id="supervisedOn" disabled style="width: 100%; padding: 6px; border: 1px solid var(--border);" />
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div class="cu-action-panel">
        <div class="cu-preview">
          <!-- Preview area could show role details -->
        </div>
        <div class="cu-actions">
          <button class="cu-action-btn" type="button" data-cu-edit>
            <i class="bi bi-pencil-fill" aria-hidden="true"></i>
            <span>Edit</span>
          </button>
          <button class="cu-action-btn" type="button" data-cu-save disabled>
            <i class="bi bi-save-fill" aria-hidden="true"></i>
            <span>Save</span>
          </button>
          <button class="cu-action-btn" type="button" data-cu-cancel>
            <i class="bi bi-x-circle" aria-hidden="true"></i>
            <span>Cancel</span>
          </button>
          <button class="cu-action-btn" type="button" data-cu-back>
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Back</span>
          </button>
        </div>
      </div>
    </div>

    <div class="cu-status-bar">
      <div class="cu-message" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script src="../../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script>
    (function () {
      const close = () => window.parent?.postMessage?.({ type: 'kairo-dataentry-close' }, '*');
      
      let currentRoleData = null;
      let roleModulesData = [];
      let mainModulesData = [];
      let selectedMainModule = null;
      let selectedScreen = null;
      let isEditMode = false;
      
      // Get role data from parent window
      function getRoleFromParent() {
        try {
          if (window.parent && (window.parent.currentRole || window.parent.currentRecord)) {
            return window.parent.currentRole || window.parent.currentRecord;
          }
        } catch (error) {
          console.error('Cannot access parent role data:', error);
        }
        return null;
      }
      
      // Show loading indicator in main modules table
      function showLoading(show = true) {
        const tbody = document.querySelector('#mainModulesTable tbody');
        if (!tbody) return;
        
        if (show) {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" style="padding: 40px; text-align: center; color: var(--text-gray);">
                <i class="bi bi-hourglass-split" style="font-size: 24px; display: block; margin-bottom: 10px; animation: spin 2s linear infinite;"></i>
                <span>Loading role access rights...</span>
              </td>
            </tr>
          `;
        }
      }
      
      // Group modules by main module
      function groupModulesByMainModule(modules) {
        const grouped = {};
        modules.forEach(module => {
          const mainModuleName = module.ModuleName || module.MainModule || 'Other';
          if (!grouped[mainModuleName]) {
            grouped[mainModuleName] = {
              mainModule: mainModuleName,
              moduleType: module.ModuleType || 'Module',
              screens: []
            };
          }
          grouped[mainModuleName].screens.push(module);
        });
        return Object.values(grouped);
      }
      
      // Populate main modules table
      function populateMainModulesTable(groupedModules) {
        const tbody = document.querySelector('#mainModulesTable tbody');
        if (!tbody) return;
        
        if (!groupedModules || groupedModules.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" style="padding: 20px; text-align: center; color: var(--text-light);">
                No modules found for this role.
              </td>
            </tr>
          `;
          return;
        }
        
        tbody.innerHTML = groupedModules.map((group, index) => {
          const hasSelectedScreens = group.screens.some(s => s.IsSelected || s.CanView || s.CanAdd || s.CanEdit);
          return `
            <tr data-module-index="${index}" style="cursor: pointer; ${selectedMainModule === group ? 'background-color: #e3f2fd;' : ''}" 
                onmouseover="this.style.backgroundColor='#f5f5f5'" 
                onmouseout="this.style.backgroundColor='${selectedMainModule === group ? '#e3f2fd' : 'white'}'">
              <td style="padding: 8px; border: 1px solid var(--border);">${group.mainModule}</td>
              <td style="padding: 8px; border: 1px solid var(--border);">${group.moduleType}</td>
              <td style="padding: 8px; border: 1px solid var(--border); text-align: center;">
                <input type="checkbox" ${hasSelectedScreens ? 'checked' : ''} disabled style="pointer-events: none;" />
              </td>
            </tr>
          `;
        }).join('');
        
        // Add click handlers
        tbody.querySelectorAll('tr[data-module-index]').forEach(row => {
          row.addEventListener('click', function() {
            const index = parseInt(this.getAttribute('data-module-index'));
            selectMainModule(groupedModules[index]);
          });
        });
      }
      
      // Select a main module and show its screens
      function selectMainModule(moduleGroup) {
        selectedMainModule = moduleGroup;
        selectedScreen = null;
        populateMainModulesTable(mainModulesData);
        populateModuleScreensTable(moduleGroup.screens);
        clearRightsPanel();
      }
      
      // Populate module screens table
      function populateModuleScreensTable(screens) {
        const tbody = document.querySelector('#moduleScreensTable tbody');
        if (!tbody) return;
        
        if (!screens || screens.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="2" style="padding: 20px; text-align: center; color: var(--text-light);">
                No screens found for this module.
              </td>
            </tr>
          `;
          return;
        }
        
        tbody.innerHTML = screens.map((screen, index) => {
          const isSelected = screen.IsSelected || screen.CanView || screen.CanAdd || screen.CanEdit;
          return `
            <tr data-screen-index="${index}" style="cursor: pointer; ${selectedScreen === screen ? 'background-color: #e3f2fd;' : ''}"
                onmouseover="this.style.backgroundColor='#f5f5f5'" 
                onmouseout="this.style.backgroundColor='${selectedScreen === screen ? '#e3f2fd' : 'white'}'">
              <td style="padding: 8px; border: 1px solid var(--border);">${screen.ScreenName || screen.ModuleName || '-'}</td>
              <td style="padding: 8px; border: 1px solid var(--border); text-align: center;">
                <input type="checkbox" ${isSelected ? 'checked' : ''} disabled style="pointer-events: none;" />
              </td>
            </tr>
          `;
        }).join('');
        
        // Add click handlers
        tbody.querySelectorAll('tr[data-screen-index]').forEach(row => {
          row.addEventListener('click', function() {
            const index = parseInt(this.getAttribute('data-screen-index'));
            selectScreen(screens[index]);
          });
        });
      }
      
      // Select a screen and show its rights
      function selectScreen(screen) {
        selectedScreen = screen;
        populateModuleScreensTable(selectedMainModule.screens);
        populateRightsPanel(screen);
      }
      
      // Clear rights panel
      function clearRightsPanel() {
        document.getElementById('allowAdd').checked = false;
        document.getElementById('allowEdit').checked = false;
        document.getElementById('allowDelete').checked = false;
        document.getElementById('supervisionRequired').checked = false;
        document.getElementById('creditPostingLimit').value = '0.00';
        document.getElementById('debitPostingLimit').value = '0.00';
        document.getElementById('allowSupervision').checked = false;
        document.getElementById('creditSupervisionLimit').value = '0.00';
        document.getElementById('debitSupervisionLimit').value = '0.00';
        document.getElementById('excessSupervisionLimit').value = '0.00';
        document.getElementById('jointCreditSupervisionLimit').value = '0.00';
        document.getElementById('jointDebitSupervisionLimit').value = '0.00';
        document.getElementById('jointExcessSupervisionLimit').value = '0.00';
        document.getElementById('createdBy').value = '';
        document.getElementById('createdOn').value = '';
        document.getElementById('modifiedBy').value = '';
        document.getElementById('modifiedOn').value = '';
        document.getElementById('supervisedBy').value = '';
        document.getElementById('supervisedOn').value = '';
      }
      
      // Populate rights panel with screen data
      function populateRightsPanel(screen) {
        document.getElementById('allowAdd').checked = screen.CanAdd || false;
        document.getElementById('allowEdit').checked = screen.CanEdit || false;
        document.getElementById('allowDelete').checked = screen.CanDelete || false;
        document.getElementById('supervisionRequired').checked = screen.SupervisionRequired || false;
        document.getElementById('creditPostingLimit').value = screen.CreditPostingLimit || '0.00';
        document.getElementById('debitPostingLimit').value = screen.DebitPostingLimit || '0.00';
        document.getElementById('allowSupervision').checked = screen.CanSupervise || false;
        document.getElementById('creditSupervisionLimit').value = screen.CreditSupervisionLimit || '0.00';
        document.getElementById('debitSupervisionLimit').value = screen.DebitSupervisionLimit || '0.00';
        document.getElementById('excessSupervisionLimit').value = screen.ExcessSupervisionLimit || '0.00';
        document.getElementById('jointCreditSupervisionLimit').value = screen.JointCreditSupervisionLimit || '0.00';
        document.getElementById('jointDebitSupervisionLimit').value = screen.JointDebitSupervisionLimit || '0.00';
        document.getElementById('jointExcessSupervisionLimit').value = screen.JointExcessSupervisionLimit || '0.00';
        document.getElementById('createdBy').value = screen.CreatedBy || '';
        document.getElementById('createdOn').value = screen.CreatedOn || '';
        document.getElementById('modifiedBy').value = screen.ModifiedBy || '';
        document.getElementById('modifiedOn').value = screen.ModifiedOn || '';
        document.getElementById('supervisedBy').value = screen.SupervisedBy || '';
        document.getElementById('supervisedOn').value = screen.SupervisedOn || '';
      }
      
      // Toggle edit mode
      function toggleEditMode(enable) {
        isEditMode = enable;
        const inputs = document.querySelectorAll('#allowAdd, #allowEdit, #allowDelete, #supervisionRequired, #creditPostingLimit, #debitPostingLimit, #allowSupervision, #creditSupervisionLimit, #debitSupervisionLimit, #excessSupervisionLimit, #jointCreditSupervisionLimit, #jointDebitSupervisionLimit, #jointExcessSupervisionLimit');
        inputs.forEach(input => {
          input.disabled = !enable;
        });
        
        const saveBtn = document.querySelector('[data-cu-save]');
        const editBtn = document.querySelector('[data-cu-edit]');
        if (saveBtn) saveBtn.disabled = !enable;
        if (editBtn) editBtn.disabled = enable;
      }
      
      // Fetch role modules from API
      async function fetchRoleModules() {
        currentRoleData = getRoleFromParent();
        
        if (!currentRoleData) {
          console.warn('No role selected in parent window');
          const tbody = document.querySelector('#mainModulesTable tbody');
          if (tbody) {
            tbody.innerHTML = `
              <tr>
                <td colspan="3" style="padding: 20px; text-align: center; color: var(--warning);">
                  <i class="bi bi-exclamation-triangle" style="font-size: 20px; display: block; margin-bottom: 8px;"></i>
                  Please select a role in the main screen first.
                </td>
              </tr>
            `;
          }
          return;
        }
        
        const roleId = currentRoleData.RoleID || currentRoleData.id;
        console.log('Fetching role modules for RoleID:', roleId);
        
        showLoading(true);
        
        try {
          // Access RoleService from parent window
          const RoleService = window.parent?.RoleService;
          const Environment = window.parent?.Environment || {};
          
          if (!RoleService) {
            throw new Error('RoleService not available');
          }
          
          const requestData = {
            RoleID: roleId,
            OurBranchID: Environment.defaultBranchId || '002',
            OperatorID: Environment.operatorId || 'CSADM'
          };
          
          console.log('Request data:', requestData);
          
          const response = await RoleService.getRoleModules(requestData);
          console.log('Role modules response:', response);
          
          if (!response.success) {
            throw new Error(response.message || 'Failed to fetch role modules');
          }
          
          // Parse response - modules might be in Details or Details01
          roleModulesData = response.data?.Details || response.data?.Details01 || [];
          console.log('Role modules data:', roleModulesData);
          
          // Group by main module
          mainModulesData = groupModulesByMainModule(roleModulesData);
          populateMainModulesTable(mainModulesData);
          
        } catch (error) {
          console.error('Error fetching role modules:', error);
          const tbody = document.querySelector('#mainModulesTable tbody');
          if (tbody) {
            tbody.innerHTML = `
              <tr>
                <td colspan="3" style="padding: 20px; text-align: center; color: var(--danger);">
                  <i class="bi bi-x-circle" style="font-size: 20px; display: block; margin-bottom: 8px;"></i>
                  Error loading role access rights: ${error.message}
                </td>
              </tr>
            `;
          }
        }
      }
      
      // Close button handlers
      document.querySelectorAll('[data-cu-close], [data-cu-cancel], [data-cu-back]').forEach((btn) => {
        btn.addEventListener('click', () => close());
      });

      // Action button handlers
      document.querySelectorAll('[data-cu-edit], [data-cu-save]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const type = btn.getAttribute('data-cu-edit') ? 'edit' : btn.getAttribute('data-cu-save') ? 'save' : null;
          if (type === 'edit') {
            if (!selectedScreen) {
              window.alert('Please select a screen first.');
              return;
            }
            toggleEditMode(true);
          } else if (type === 'save') {
            if (!selectedScreen) {
              window.alert('Please select a screen first.');
              return;
            }
            // Save functionality
            window.alert('Save functionality will be implemented to update the selected screen rights.');
            toggleEditMode(false);
          }
        });
      });
      
      // Load data when page loads
      document.addEventListener('DOMContentLoaded', () => {
        fetchRoleModules();
      });
      
      // Also fetch when iframe becomes visible
      if (document.readyState === 'complete') {
        fetchRoleModules();
      }
      
      // Add spinner animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
      `;
      document.head.appendChild(style);
    })();

    // Handle close button
    document.addEventListener('DOMContentLoaded', function() {
      const closeBtn = document.querySelector('[data-cu-close]');
      if (closeBtn) {
        closeBtn.addEventListener('click', function() {
          window.parent.postMessage({ type: 'kairo-dataentry-close' }, '*');
        });
      }

      // Handle back button
      const backBtn = document.querySelector('[data-cu-back]');
      if (backBtn) {
        backBtn.addEventListener('click', function() {
          window.parent.postMessage({ type: 'kairo-dataentry-close' }, '*');
        });
      }
    });
  </script>
</body>
