<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unlock Users · System Security</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="unlock-users.css" />
</head>

<body>
  <div class="module-shell">
    <div class="module-layout">
      <aside class="sidebar" aria-label="Section navigation">
        <div class="sidebar-title">Unlock Users</div>
      </aside>

      <main class="content" role="main">
        <form id="unlock-users-form" class="form" autocomplete="off" novalidate>
          <section class="card">
            <div class="card-header">
              <i class="bi bi-building" aria-hidden="true"></i>
              <span>Branch Selection</span>
            </div>
            <div class="card-body form-grid two-col">
              <div class="form-control-group">
                <label for="branchId" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></label>
                <input type="text" id="branchId" name="branchId" class="form-control" value="0101" placeholder="Enter branch ID">
              </div>
              <div class="form-control-group">
                <label for="branchName" class="form-label"><i class="bi bi-shop" aria-hidden="true"></i><span>Branch Name</span></label>
                <div class="input-with-action">
                  <input type="text" id="branchName" name="branchName" class="form-control" value="Head Office" readonly>
                  <button type="button" class="action-icon-btn" data-uu-branch-search aria-label="Search branch">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <i class="bi bi-people" aria-hidden="true"></i>
              <span>Logged In Operators</span>
            </div>
            <div class="card-body">
              <div class="table-container">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Operator ID</th>
                      <th>Time Logged In</th>
                      <th>IP Address</th>
                      <th style="width: 3rem; text-align: center;">
                        <input type="checkbox" class="table-checkbox" aria-label="Select all" data-uu-select-all disabled />
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="4" style="text-align: center; padding: 20px; color: var(--text-light);">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </form>
      </main>

      <aside class="action-bar" aria-label="Actions">
        <button type="button" class="action-btn view" data-uu-action="view">
          <i class="bi bi-eye-fill" aria-hidden="true"></i>
          <span>View</span>
        </button>
        <button type="button" class="action-btn process" data-uu-action="process" disabled>
          <i class="bi bi-check-circle" aria-hidden="true"></i>
          <span>Process</span>
        </button>
        <button type="button" class="action-btn cancel" data-uu-action="cancel">
          <i class="bi bi-x-circle" aria-hidden="true"></i>
          <span>Cancel</span>
        </button>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/system-security/unlock-users.embedded.js"></script>
</body>

</html>
