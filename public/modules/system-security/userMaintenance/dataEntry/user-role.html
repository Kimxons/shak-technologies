<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Role</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="user-role.css" />
  <link rel="stylesheet" href="../../account-maintenance/DataEntry/dataentry-theme.css" />
  <link rel="stylesheet" href="../../../common/toast-messages/toast-messages.css" />
</head>
<body>
  <div class="ur-window" data-ur-window>
    <div class="ur-title-bar" role="banner" aria-label="Window title bar">
      <div class="ur-title-bar__left">
        <span class="ur-title-bar__icon" aria-hidden="true"></span>
        <span class="ur-title-bar__text">User Role Assignment </span>
      </div>
      <div class="ur-title-bar__right" aria-label="Window controls">
        <button class="ur-title-btn" type="button" data-ur-refresh title="Refresh" aria-label="Refresh">🔄</button>
        <button class="ur-title-btn" type="button" data-ur-minimize title="Minimize" aria-label="Minimize">—</button>
        <button class="ur-title-btn close" type="button" data-ur-close title="Close" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="ur-main">
      <div class="ur-content-shell" role="region" aria-label="User Role Assignment">
        <div class="ur-scroll">
          <div class="ur-top-box" role="group" aria-label="Role assignment details">
            <div class="ur-row ur-row--text">
              <label class="ur-label"></label>
              <div class="ur-checkbox-group">
                <input type="checkbox" id="allBranches" class="ur-checkbox" />
                <label for="allBranches" class="ur-checkbox-label">All Branches</label>
              </div>
            </div>

            <div class="ur-row ur-row--text">
              <label class="ur-label" for="regionId">Region ID</label>
              <div class="ur-input-group">
                <input id="regionId" type="text" class="ur-input" />
                <button class="ur-lookup-btn" type="button" data-ur-lookup="region" title="Lookup region">🔍</button>
              </div>
            </div>

            <div class="ur-row ur-row--text">
              <label class="ur-label ur-label--blue" for="branchId">Branch ID</label>
              <div class="ur-input-group">
                <input id="branchId" type="text" class="ur-input" />
                <button class="ur-lookup-btn" type="button" data-ur-lookup="branch" title="Lookup branch">🔍</button>
              </div>
            </div>

            <div class="ur-row ur-row--text">
              <label class="ur-label ur-label--blue" for="roleId">Role ID</label>
              <select id="roleId" class="ur-select">
                <option value="CW">CW</option>
              </select>
            </div>

            <div class="ur-row ur-row--text">
              <label class="ur-label ur-label--blue" for="accessLevel">Access Level</label>
              <select id="accessLevel" class="ur-select">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
              </select>
            </div>

            <div class="ur-row ur-row--text">
              <label class="ur-label" for="supervisorId">Supervisor ID</label>
              <div class="ur-input-group">
                <input id="supervisorId" type="text" class="ur-input" />
                <button class="ur-lookup-btn" type="button" data-ur-lookup="supervisor" title="Lookup supervisor">🔍</button>
              </div>
            </div>

            <div class="ur-row ur-row--text">
              <label class="ur-label" for="supervisorRoleId">Supervisor Role ID</label>
              <div class="ur-input-group">
                <input id="supervisorRoleId" type="text" class="ur-input" />
                <button class="ur-lookup-btn" type="button" data-ur-lookup="supervisorRole" title="Lookup supervisor role">🔍</button>
              </div>
            </div>

            <div class="ur-row ur-row--text">
              <label class="ur-label" for="expiryDate">Expiry Date</label>
              <select id="expiryDate" class="ur-select">
                <option></option>
                <option>1 Year</option>
                <option>2 Years</option>
                <option>Permanent</option>
              </select>
            </div>
          </div>

          <div class="ur-table-actions">
            <button class="ur-table-btn" type="button" data-ur-new>New</button>
            <button class="ur-table-btn" type="button" data-ur-alter>Alter</button>
            <button class="ur-table-btn" type="button" data-ur-remove>Remove</button>
            <button class="ur-table-btn" type="button" data-ur-update>Update</button>
            <button class="ur-table-btn" type="button" data-ur-clear>Clear</button>
          </div>

          <div class="ur-table-container">
            <table class="ur-table">
              <thead>
                <tr>
                  <th>Region ID</th>
                  <th>Branch ID</th>
                  <th>Role ID</th>
                  <th>Role Name</th>
                  <th>Access Level</th>
                  <th>Supervisor ID</th>
                  <th>Expiry Date</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="7" class="ur-no-data">No roles assigned yet</td>
                </tr>
              </tbody>
            </table>
          </div>


          <div class="ur-section-header">Behind the Scenes</div>

          <div class="ur-audit" style="margin-top: 10px;margin-bottom: 10px;">
            <div class="ur-audit-col">
              <div class="ur-audit-row">
                <label class="ur-label" for="createdBy">Created By</label>
                <input id="createdBy" type="text" class="ur-input ur-input--short" readonly />
              </div>
              <div class="ur-audit-row">
                <label class="ur-label" for="modifiedBy">Modified By</label>
                <input id="modifiedBy" type="text" class="ur-input ur-input--short" readonly />
              </div>
              <div class="ur-audit-row">
                <label class="ur-label" for="supervisedBy">Supervised By</label>
                <input id="supervisedBy" type="text" class="ur-input ur-input--short" readonly />
              </div>
            </div>
            <div class="ur-audit-col">
              <div class="ur-audit-row">
                <label class="ur-label" for="createdOn">Created On</label>
                <input id="createdOn" type="text" class="ur-input ur-input--short" readonly />
              </div>
              <div class="ur-audit-row">
                <label class="ur-label" for="modifiedOn">Modified On</label>
                <input id="modifiedOn" type="text" class="ur-input ur-input--short" readonly />
              </div>
              <div class="ur-audit-row">
                <label class="ur-label" for="supervisedOn">Supervised On</label>
                <input id="supervisedOn" type="text" class="ur-input ur-input--short" readonly />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="ur-action-panel">
        <div class="ur-preview">
          <!-- Preview area could show role details -->
        </div>
        <div class="ur-actions">
          <button class="ur-action-btn" type="button" data-ur-add>
            <i class="bi bi-plus-circle"></i>
            <span>Add</span>
          </button>
          <button class="ur-action-btn" type="button" data-ur-edit>
            <i class="bi bi-pencil-square"></i>
            <span>Edit</span>
          </button>
          <button class="ur-action-btn" type="button" data-ur-delete>
            <i class="bi bi-trash"></i>
            <span>Delete</span>
          </button>
          <button class="ur-action-btn" type="button" data-ur-save>
            <i class="bi bi-save2"></i>
            <span>Save</span>
          </button>
          <button class="ur-action-btn" type="button" data-ur-cancel>
            <i class="bi bi-x-circle"></i>
            <span>Cancel</span>
          </button>
          <button class="ur-action-btn" type="button" data-ur-back>
            <i class="bi bi-arrow-left"></i>
            <span>Back</span>
          </button>
        </div>
      </div>
    </div>

    <div class="ur-status-bar">
      <div class="ur-message" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script src="../../../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../common/toast-messages/toast-messages.js"></script>
  <script src="user-role.js"></script>
</body>
</html>
