<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Blocking / Unblocking</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="user-blocking-unblocking.css" />
  <link rel="stylesheet" href="../../account-maintenance/DataEntry/dataentry-theme.css" />
</head>
<body>
  <div class="ubu-window" data-ubu-window>
    <div class="ubu-title-bar" role="banner" aria-label="Window title bar">
      <div class="ubu-title-bar__left">
        <span class="ubu-title-bar__icon" aria-hidden="true">☰</span>
        <span class="ubu-title-bar__text">User Blocking / Unblocking ::</span>
      </div>
      <div class="ubu-title-bar__right" aria-label="Window controls">
        <button class="ubu-title-btn" type="button" data-ubu-refresh title="Refresh" aria-label="Refresh">🔄</button>
        <button class="ubu-title-btn" type="button" data-ubu-minimize title="Minimize" aria-label="Minimize">—</button>
        <button class="ubu-title-btn close" type="button" data-ubu-close title="Close" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="ubu-main">
      <div class="ubu-content-shell" role="region" aria-label="User Blocking / Unblocking">
        <div class="ubu-scroll">
          <div class="ubu-top-box" role="group" aria-label="Blocking details">
            <div class="ubu-row ubu-row--reason">
              <label class="ubu-label ubu-label--blue" for="reason">Reason</label>
              <select id="reason" class="ubu-select">
                <option></option>
                <option>Account Breach</option>
                <option>Suspicious Activity</option>
                <option>Policy Violation</option>
                <option>Administrative Hold</option>
              </select>
            </div>

            <div class="ubu-row ubu-row--text">
              <label class="ubu-label" for="description">Description</label>
              <input id="description" type="text" class="ubu-input" />
            </div>

            <div class="ubu-row ubu-row--text">
              <label class="ubu-label ubu-label--blue" for="instructionGivenBy">Instruction Given By</label>
              <div class="ubu-input-group">
                <input id="instructionGivenBy" type="text" class="ubu-input" />
                <button class="ubu-lookup-btn" type="button" data-ubu-lookup="user" title="Search User">🔍</button>
              </div>
            </div>
          </div>

          <div class="ubu-section-header">Behind The Scene</div>

          <div class="ubu-bts" role="group" aria-label="Behind the scene">
            <div class="ubu-bts-grid">
              <div class="ubu-bts-row">
                <label class="ubu-label" for="previousStatus">Previous Status</label>
                <input id="previousStatus" type="text" class="ubu-input ubu-input--short" readonly />
              </div>
              <div class="ubu-bts-row">
                <label class="ubu-label" for="statusDate">Date</label>
                <input id="statusDate" type="text" class="ubu-input ubu-input--short" readonly />
              </div>
              <div class="ubu-bts-row ubu-bts-row--wide">
                <label class="ubu-label" for="statusReason">Reason</label>
                <textarea id="statusReason" class="ubu-input" rows="2" readonly></textarea>
              </div>
              <div class="ubu-bts-row ubu-bts-row--wide">
                <label class="ubu-label" for="statusDescription">Description</label>
                <textarea id="statusDescription" class="ubu-input" rows="2" readonly></textarea>
              </div>
              <div class="ubu-bts-row ubu-bts-row--wide">
                <label class="ubu-label" for="statusInstructionGivenBy">Instruction Given By</label>
                <textarea id="statusInstructionGivenBy" class="ubu-input" rows="2" readonly></textarea>
              </div>
            </div>
          </div>

          <div class="ubu-section-header">Audit Trail</div>

          <div class="ubu-audit">
            <div class="ubu-audit-col">
              <div class="ubu-audit-row">
                <label class="ubu-label" for="createdBy">Created By</label>
                <input id="createdBy" type="text" class="ubu-input ubu-input--short" readonly />
              </div>
              <div class="ubu-audit-row">
                <label class="ubu-label" for="supervisedBy">Supervised By</label>
                <input id="supervisedBy" type="text" class="ubu-input ubu-input--short" readonly />
              </div>
            </div>
            <div class="ubu-audit-col ubu-audit-col--right">
              <div class="ubu-audit-row">
                <label class="ubu-label" for="createdOn">Created On</label>
                <input id="createdOn" type="text" class="ubu-input ubu-input--short" readonly />
              </div>
              <div class="ubu-audit-row">
                <label class="ubu-label" for="supervisedOn">Supervised On</label>
                <input id="supervisedOn" type="text" class="ubu-input ubu-input--short" readonly />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="ubu-action-panel">
        <div class="ubu-preview">
          <!-- Preview area could show user details -->
        </div>
        <div class="ubu-actions">
          <button class="ubu-action-btn" type="button" data-ubu-hide>
            <i class="bi bi-eye-slash"></i>
            <span>Hide</span>
          </button>
          <button class="ubu-action-btn" type="button" data-ubu-history>
            <i class="bi bi-clock-history"></i>
            <span>History</span>
          </button>
          <button class="ubu-action-btn" type="button" data-ubu-add>
            <i class="bi bi-plus-circle"></i>
            <span>Add</span>
          </button>
          <button class="ubu-action-btn" type="button" data-ubu-save>
            <i class="bi bi-save2"></i>
            <span>Save</span>
          </button>
          <button class="ubu-action-btn" type="button" data-ubu-cancel>
            <i class="bi bi-x-circle"></i>
            <span>Cancel</span>
          </button>
          <button class="ubu-action-btn" type="button" data-ubu-back>
            <i class="bi bi-arrow-left"></i>
            <span>Back</span>
          </button>
        </div>
      </div>
    </div>

    <div class="ubu-status-bar">
      <div class="ubu-message" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- Search Modal Overlay -->
  <div class="ubu-search-overlay" id="ubuSearchOverlay" style="display: none;">
    <div class="ubu-search-modal">
      <div class="ubu-search-header">
        <h3>User Search</h3>
        <button type="button" class="ubu-search-close" id="ubuSearchClose">&times;</button>
      </div>
      <div class="ubu-search-body">
        <iframe id="ubuSearchFrame" src="about:blank" frameborder="0" width="100%" height="100%"></iframe>
      </div>
    </div>
  </div>

  <script src="user-blocking-unblocking.js"></script>
</body>
</html>
