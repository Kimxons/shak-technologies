<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Person · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="contact-person copilot-theme">
  <div class="window">
    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <form id="contact-person-form" autocomplete="off" novalidate>
          <div class="form-card">
            <!-- Contact Person Information Section -->
            <div class="form-section" data-section="contact-info">
              <div class="section-header">
                <h2 class="section-header__title"><i class="bi bi-person-circle"></i>Contact Person Information</h2>
                <button type="button" class="section-toggle-btn" aria-label="Toggle section" aria-expanded="true">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
              <div class="section-content">
                <!-- Row 1: Contact Person ID and Name -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="ContactPersonID">Contact Person ID</label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" id="ContactPersonID" class="kairo-control__id" aria-label="Contact Person ID" data-always-enabled required>
                      <input type="text" id="ContactPersonDesc" class="kairo-control__name" aria-label="Contact Person Name" placeholder="Contact Person Name" readonly>
                      <button type="button" class="btn-lookup kairo-control__lookup" data-target-input="ContactPersonID" data-contact-action="search" aria-label="Search Contact Person" data-always-enabled><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="Name">Name</label>
                    <input type="text" class="bs-input-text" id="Name" name="Name" required>
                  </div>
                </div>

                <!-- Row 2: Title and Phone -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="Title">Title</label>
                    <select id="Title" name="Title" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="Dr">Doctor</option>
                      <option value="Mr">Mr</option>
                      <option value="Ms">Ms</option>
                      <option value="Mrs">Mrs</option>
                      <option value="Not-Specified">Not-Specified</option>
                      <option value="Prof">Professor</option>
                      <option value="Amb">Ambassador</option>
                      <option value="Priest">Priest</option>
                    </select>
                  </div>
                  <div class="col">
                    <label for="Phone">Phone</label>
                    <input type="text" class="bs-input-text" id="Phone" name="Phone">
                  </div>
                </div>

                <!-- Row 3: Email and Is Active -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="Email">Email</label>
                    <input type="email" class="bs-input-text" id="Email" name="Email">
                  </div>
                  <div class="col">
                    <label for="IsActive">Is Active</label>
                    <div class="d-flex align-items-center gap-2">
                      <input type="checkbox" id="IsActive" name="IsActive" checked>
                      <span class="small text-muted">Active</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle section" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Right Action Panel -->
      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action active" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" data-contact-action="delete"><i class="bi bi-trash"></i> Delete</button>
          <button type="button" class="btn-action" data-contact-action="save" disabled><i class="bi bi-save"></i> Save</button>
          <button type="button" class="btn-action" data-contact-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/contact-person.js"></script>
</body>

</html>
