<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Maintain Banks</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="maintain-banks.css">
    <style>
        .test-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #f8f9fa;
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 15px;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10000;
        }
        .test-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #007bff;
        }
        .test-btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .test-btn:hover {
            background: #0056b3;
        }
        .test-btn.secondary {
            background: #6c757d;
        }
        .test-btn.secondary:hover {
            background: #545b62;
        }
        .test-input {
            width: 100%;
            padding: 6px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .console-log {
            max-height: 200px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            margin-top: 10px;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px;
        }
        .log-success { color: #4ec9b0; }
        .log-error { color: #f48771; }
        .log-info { color: #569cd6; }
    </style>
</head>
<body>
    <!-- Test Control Panel -->
    <div class="test-panel">
        <h3>🧪 Test Controls</h3>
        
        <label style="font-size: 12px; margin-top: 5px;">Bank ID to Fetch:</label>
        <input type="text" id="testBankId" class="test-input" placeholder="e.g., 01, 02, etc." value="01">
        <button class="test-btn" onclick="testFetchBank()">🔍 Fetch Bank</button>
        
        <hr style="margin: 15px 0; border-color: #dee2e6;">
        
        <button class="test-btn secondary" onclick="testPopulateForm()">📝 Populate Test Data</button>
        <button class="test-btn secondary" onclick="testClearForm()">🗑️ Clear Form</button>
        <button class="test-btn secondary" onclick="testGetFormData()">📊 Get Form Data</button>
        
        <hr style="margin: 15px 0; border-color: #dee2e6;">
        
        <button class="test-btn" onclick="testAddMode()">➕ Switch to Add Mode</button>
        <button class="test-btn" onclick="testEditMode()">✏️ Switch to Edit Mode</button>
        <button class="test-btn" onclick="testViewMode()">👁️ Switch to View Mode</button>
        
        <hr style="margin: 15px 0; border-color: #dee2e6;">
        
        <button class="test-btn" onclick="clearConsole()">🧹 Clear Console</button>
        
        <div class="console-log" id="testConsole">
            <div class="log-entry log-info">Test console ready...</div>
        </div>
    </div>

    <!-- Main Form (from maintain-banks.html) -->
    <div class="module-shell">
        <div class="module-layout">
            <aside class="sidebar" aria-label="Section navigation">
                <div class="sidebar-title">Maintain Banks (TEST MODE)</div>
                <div class="nav-section">
                    <button type="button" class="nav-toggle" data-current-section="dataentry">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span class="nav-toggle-label">DataEntry</span>
                        <i class="bi bi-chevron-down nav-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="nav-items" style="display: none;">
                        <button type="button" class="nav-item" data-section="bank-limit">
                            <i class="bi bi-cash-stack" aria-hidden="true"></i>
                            <span>Bank Limit Maintenance</span>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="content" role="main">
                <div id="statusMessage" class="status hidden" role="status" aria-live="polite">
                    <i class="bi" aria-hidden="true"></i>
                    <span class="status-text"></span>
                    <button type="button" class="status-close" aria-label="Dismiss message">✕</button>
                </div>

                <div id="bankDetailsSection" class="section-content">
                    <form class="form" id="bankDetailsForm">
                        <div class="form-section">
                            <div class="card">
                                <div class="card-header">
                                    <i class="bi bi-building"></i>
                                    <span>Bank Details</span>
                                </div>
                                <div class="card-body">
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label for="bankId" class="form-label">Bank ID</label>
                                            <div class="input-with-button">
                                                <input type="text" id="bankId" class="form-control" placeholder="">
                                                <button type="button" class="btn-search" aria-label="Search Bank">
                                                    <i class="bi bi-search"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="shortName" class="form-label">Short Name</label>
                                            <input type="text" id="shortName" class="form-control" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group form-group-full">
                                            <label for="bankName" class="form-label">Bank Name</label>
                                            <input type="text" id="bankName" class="form-control" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label for="type" class="form-label">Type</label>
                                            <select id="type" class="form-control">
                                                <option value="">--Select--</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label for="clientId" class="form-label">Client ID</label>
                                            <div class="input-with-button">
                                                <input type="text" id="clientId" class="form-control" placeholder="">
                                                <button type="button" class="btn-search" aria-label="Search Client">
                                                    <i class="bi bi-search"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label for="creditRating" class="form-label">Credit Rating</label>
                                            <input type="text" id="creditRating" class="form-control" placeholder="">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <i class="bi bi-check-square"></i>
                                    <span>Is Clearing Bank</span>
                                </div>
                                <div class="card-body">
                                    <div class="form-row">
                                        <div class="form-group">
                                            <div class="checkbox-group">
                                                <input type="checkbox" id="isLocalClearing" class="form-checkbox">
                                                <label for="isLocalClearing" class="checkbox-label">Is Local Clearing</label>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="checkbox-group">
                                                <input type="checkbox" id="isForeignClearing" class="form-checkbox">
                                                <label for="isForeignClearing" class="checkbox-label">Is Foreign Clearing</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group form-group-full">
                                            <label for="clearingThrough" class="form-label">Clearing Through</label>
                                            <input type="text" id="clearingThrough" class="form-control" placeholder="">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <i class="bi bi-info-circle"></i>
                                    <span>Behind The Scene</span>
                                </div>
                                <div class="card-body">
                                    <div class="bts-grid">
                                        <div class="bts-item">
                                            <label class="bts-label">Created By</label>
                                            <input type="text" class="bts-input" readonly>
                                        </div>
                                        <div class="bts-item">
                                            <label class="bts-label">Created On</label>
                                            <input type="text" class="bts-input" readonly>
                                        </div>
                                        <div class="bts-item">
                                            <label class="bts-label">Modified By</label>
                                            <input type="text" class="bts-input" readonly>
                                        </div>
                                        <div class="bts-item">
                                            <label class="bts-label">Modified On</label>
                                            <input type="text" class="bts-input" readonly>
                                        </div>
                                        <div class="bts-item">
                                            <label class="bts-label">Supervised By</label>
                                            <input type="text" class="bts-input" readonly>
                                        </div>
                                        <div class="bts-item">
                                            <label class="bts-label">Supervised On</label>
                                            <input type="text" class="bts-input" readonly>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </main>

            <aside class="actions-panel" aria-label="Action buttons">
                <div class="action-buttons">
                    <button type="button" class="action-button" id="btnView" title="View">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="action-button" id="btnAdd" title="Add">
                        <i class="bi bi-plus-circle"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="action-button" id="btnEdit" title="Edit">
                        <i class="bi bi-pencil"></i>
                        <span>Edit</span>
                    </button>
                    <button type="button" class="action-button" id="btnDelete" title="Delete">
                        <i class="bi bi-trash"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="action-button" id="btnSave" title="Save">
                        <i class="bi bi-floppy"></i>
                        <span>Save</span>
                    </button>
                    <button type="button" class="action-button" id="btnCancel" title="Cancel">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Prevent flatpickr errors from parent scripts -->
    <script>
        // This page doesn't use date pickers, so prevent initialization errors
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('formatDate')) {
                e.preventDefault();
                console.warn('⚠️ Date picker initialization skipped (not needed on this page)');
                return true;
            }
        }, true);
    </script>

    <!-- Load Environment and Services -->
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="maintain-banks.js"></script>

    <!-- Test Scripts -->
    <script>
        function logToConsole(message, type = 'info') {
            const console = document.getElementById('testConsole');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('testConsole').innerHTML = '<div class="log-entry log-info">Console cleared...</div>';
        }

        function testFetchBank() {
            const bankId = document.getElementById('testBankId').value.trim();
            if (!bankId) {
                logToConsole('Please enter a Bank ID', 'error');
                return;
            }
            logToConsole(`Fetching bank ID: ${bankId}`, 'info');
            window.MaintainBanksDebug.testFetch(bankId);
        }

        function testPopulateForm() {
            logToConsole('Populating test data...', 'info');
            window.MaintainBanksDebug.populateTestData();
            logToConsole('Test data populated', 'success');
        }

        function testClearForm() {
            logToConsole('Clearing form...', 'info');
            document.getElementById('bankDetailsForm').reset();
            logToConsole('Form cleared', 'success');
        }

        function testGetFormData() {
            const data = window.MaintainBanksDebug.getFormData();
            logToConsole('Form data: ' + JSON.stringify(data, null, 2), 'info');
            console.log('Form Data:', data);
        }

        function testAddMode() {
            logToConsole('Switching to Add mode...', 'info');
            window.MaintainBanksDebug.setMode('add');
            logToConsole('Add mode activated', 'success');
        }

        function testEditMode() {
            logToConsole('Switching to Edit mode...', 'info');
            window.MaintainBanksDebug.setMode('edit');
            logToConsole('Edit mode activated', 'success');
        }

        function testViewMode() {
            logToConsole('Switching to View mode...', 'info');
            window.MaintainBanksDebug.setMode('view');
            logToConsole('View mode activated', 'success');
        }

        // Intercept console logs
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
            ).join(' ');
            
            if (message.includes('✅') || message.includes('success')) {
                logToConsole(message, 'success');
            } else if (message.includes('❌') || message.includes('error') || message.includes('Error')) {
                logToConsole(message, 'error');
            } else {
                logToConsole(message, 'info');
            }
        };

        logToConsole('Test page loaded successfully', 'success');
        logToConsole('Open browser console (F12) for detailed logs', 'info');
    </script>
</body>
</html>
