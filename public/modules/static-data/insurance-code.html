<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insurance Code · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="insurance-code">
  <div class="window">
    <div class="main-container">
      <div class="form-content">
        <div class="form-card" data-main-form>
          <form id="insurance-code-form" autocomplete="off" novalidate>
            <div class="form-section" data-section="insurance-code-details">
              <div class="section-content" data-section-content>
                <div class="alert alert-danger d-flex align-items-center justify-content-between py-2 px-3 mb-3 d-none" role="alert" data-insurance-code-alert hidden>
                  <div class="d-flex align-items-center gap-2 small">
                    <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                    <span data-insurance-code-alert-text></span>
                  </div>
                  <button type="button" class="btn-close" aria-label="Close" data-insurance-code-alert-close></button>
                </div>

                <div class="form-row">
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="InsuranceCode">Insurance Code</label>
                    <div class="d-flex gap-0 w-100" style="max-width: 760px;">
                      <input type="text" class="bs-input-text form-control rounded-end-0" style="flex: 0 0 30%; width: auto;" id="InsuranceCode" name="InsuranceCode" required data-always-enabled />
                      <input type="text" class="bs-input-text form-control rounded-0" style="flex: 0 0 50%; width: auto;" id="Description" name="Description" aria-label="Description" />
                      <button class="btn-lookup rounded-start-0" type="button" style="flex: 0 0 auto;" aria-label="Search insurance code" data-insurance-code-action="search" data-always-enabled>
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="IsActive">Is Active</label>
                    <div class="d-flex align-items-center">
                      <input class="bs-checkbox" type="checkbox" id="IsActive" name="IsActive" />
                    </div>
                  </div>
                  <div class="col"></div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye" aria-hidden="true"></i>BEHIND THE SCENE</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
      <aside class="action-panel">
        <div class="action-buttons">
          <button type="button" class="btn-action" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" data-insurance-code-action="delete"><i class="bi bi-trash"></i> Delete</button>
          <button type="button" class="btn-action" data-insurance-code-action="save"><i class="bi bi-save"></i> Save</button>
          <button type="button" class="btn-action" data-insurance-code-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <!-- Insurance Code Lookup Modal -->
  <div class="modal fade" id="insuranceCodeLookupModal" tabindex="-1" aria-labelledby="insuranceCodeLookupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white d-flex justify-content-between align-items-center">
          <div>
            <p class="mb-0 small">Static Data</p>
            <h5 class="modal-title" id="insuranceCodeLookupModalLabel">Find an Insurance Code</h5>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-sm btn-outline-light" id="insuranceCodeSearchRefresh" aria-label="Refresh" title="Refresh">
              <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>

        <div class="modal-body">
          <form id="insuranceCodeLookupForm" class="row g-3 align-items-end mb-3">
            <div class="col-md-4">
              <label class="form-label" for="insuranceCodeSearchCode">Insurance Code</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="insuranceCodeSearchModeCode" aria-label="Insurance code match mode">
                  <option value="Like">Contains</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="insuranceCodeSearchCode" placeholder="Enter Insurance Code" />
              </div>
            </div>

            <div class="col-md-4">
              <label class="form-label" for="insuranceCodeSearchDesc">Description</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="insuranceCodeSearchModeDesc" aria-label="Description match mode">
                  <option value="Like">Contains</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="insuranceCodeSearchDesc" placeholder="Enter Description" />
              </div>
            </div>

            <div class="col-md-4">
              <label class="form-label" for="insuranceCodeSearchStatus">Status</label>
              <select class="form-select form-select-sm" id="insuranceCodeSearchStatus">
                <option value="all" selected>All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="col-12 text-center">
              <button type="submit" class="btn btn-primary btn-sm" id="insuranceCodeSearchSubmit">
                <i class="bi bi-search" aria-hidden="true"></i> Search
              </button>
            </div>
          </form>

          <div class="position-relative" style="min-height: 300px;">
            <div class="table-responsive">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Insurance Code</th>
                    <th scope="col">Description</th>
                    <th scope="col">Active</th>
                    <th scope="col" class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="insuranceCodeSearchResults"></tbody>
              </table>
            </div>

            <div id="insuranceCodeSearchEmpty" class="text-center py-5 text-muted">No insurance codes found.</div>

            <div id="insuranceCodeSearchLoading" class="d-none position-absolute top-50 start-50 translate-middle">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer bg-primary justify-content-center">
          <button type="button" class="btn btn-light border px-5" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/insurance-code.js"></script>
</body>
</html>
