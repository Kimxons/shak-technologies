<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Channels Transaction Settings · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="channels-transaction-settings copilot-theme">
  <div class="window">
    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <form id="channels-transaction-settings-form" autocomplete="off" novalidate>
          <div class="form-card">
            <!-- Channels Transaction Settings Section -->
            <div class="form-section" data-section="settings-info">
              <div class="section-header">
                <h2 class="section-header__title"><i class="bi bi-sliders"></i>Channels Transaction Settings</h2>
                <button type="button" class="section-toggle-btn" aria-label="Toggle section" aria-expanded="true">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
              <div class="section-content">
                <!-- Row 1: Locale, Processing Code, Charge ID -->
                <div class="form-row three-col">
                  <div class="col">
                    <label class="label-blue" for="Locale">Locale</label>
                    <select class="bs-select" id="Locale" name="Locale">
                      <option value="" selected>--Select--</option>
                      <option value="EN">EN</option>
                      <option value="SW">SW</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ProcessingCode">Processing Code</label>
                    <select class="bs-select" id="ProcessingCode" name="ProcessingCode">
                      <option value="" selected>--Select--</option>
                      <option value="001">001</option>
                      <option value="002">002</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ChargeId">Charge ID</label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" id="ChargeId" class="kairo-control__id" aria-label="Charge ID" data-always-enabled>
                      <input type="text" id="ChargeDesc" class="kairo-control__name" aria-label="Charge Description" placeholder="Charge Description" readonly>
                      <button type="button" class="btn-lookup kairo-control__lookup" data-target-input="ChargeId" aria-label="Search Charge" data-always-enabled><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <!-- Grid Table -->
                <div class="grid-table-container">
                  <table class="grid-table">
                    <thead>
                      <tr>
                        <th>Locale</th>
                        <th>Processing Code</th>
                        <th>Charge ID</th>
                      </tr>
                    </thead>
                    <tbody id="settingsGridBody"></tbody>
                  </table>
                </div>

                <!-- Grid Action Buttons -->
                <div class="grid-actions">
                  <button type="button" class="btn-grid-action" data-cts-grid-action="new" disabled>New</button>
                  <button type="button" class="btn-grid-action" data-cts-grid-action="alter" disabled>Alter</button>
                  <button type="button" class="btn-grid-action" data-cts-grid-action="remove" disabled>Remove</button>
                  <button type="button" class="btn-grid-action" data-cts-grid-action="update" disabled>Update</button>
                  <button type="button" class="btn-grid-action" data-cts-grid-action="clear" disabled>Clear</button>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header">
                <h2 class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</h2>
                <button type="button" class="section-toggle-btn" aria-label="Toggle section" aria-expanded="true">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
              <div class="section-content">
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Right Action Panel -->
      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action active" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" data-cts-action="save" disabled><i class="bi bi-save"></i> Save</button>
          <button type="button" class="btn-action" data-cts-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </div>
    <div class="am-message-panel"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/channels-transaction-settings.js"></script>
</body>

</html>
