<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insurance Policy · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="insurance-policy">
  <div class="window">
    <div class="main-container">
      <div class="form-content" aria-label="Insurance Policy Maintenance Content">
        <div class="form-card" data-main-form>
          <form id="insurance-policy-form" autocomplete="off" novalidate>
            <div class="form-section" data-section="insurance-policy-info">
              <div class="alert alert-danger d-flex align-items-center justify-content-between py-2 px-3 mb-3 d-none" role="alert" data-insurance-policy-alert>
                <div class="d-flex align-items-center gap-2 small">
                  <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                  <span data-insurance-policy-alert-text></span>
                </div>
                <button type="button" class="btn-close" aria-label="Close" data-insurance-policy-alert-close></button>
              </div>
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-file-text"></i>Insurance Policy Information</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Insurance Policy Information" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="PolicyNo">Policy No</label>
                    <div class="d-flex align-items-stretch gap-0 flex-grow-1 w-100">
                      <input type="text" class="bs-input-text flex-grow-1 rounded-end-0" id="PolicyNo" name="PolicyNo" required data-always-enabled />
                      <button class="btn-lookup" type="button" aria-label="Search policy" data-always-enabled data-insurance-policy-action="search">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="PolicyDate">Policy Date</label>
                    <input type="date" class="bs-input-text" id="PolicyDate" name="PolicyDate" required />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="InsuranceCode">Insurance Code</label>
                    <div class="d-flex align-items-stretch gap-0 flex-grow-1 w-100">
                      <input type="text" class="bs-input-text flex-grow-1 rounded-end-0" id="InsuranceCode" name="InsuranceCode" required />
                      <button class="btn-lookup rounded-start-0" type="button" aria-label="Search insurance code" data-always-enabled data-insurance-policy-action="search-insurance-code">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="InsuranceCodeDesc">Code Description</label>
                    <input type="text" class="bs-input-text" id="InsuranceCodeDesc" name="InsuranceCodeDesc" disabled />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="InsuranceCompanyId">Insurance Company ID</label>
                    <div class="d-flex align-items-stretch gap-0 flex-grow-1 w-100">
                      <input type="text" class="bs-input-text flex-grow-1 rounded-end-0" id="InsuranceCompanyId" name="InsuranceCompanyId" required />
                      <button class="btn-lookup rounded-start-0" type="button" aria-label="Search insurance company" data-always-enabled data-insurance-policy-action="search-insurance-company">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="InsuranceCompanyName">Company Name</label>
                    <input type="text" class="bs-input-text" id="InsuranceCompanyName" name="InsuranceCompanyName" disabled />
                  </div>
                </div>

                <div class="form-row two-col">
  <div class="col">
    <label class="label-blue" for="Address">Address</label>
    <input type="text" class="bs-input-text" id="Address" name="Address" />
  </div>
  <div class="col">
    <label class="label-blue" for="City">City</label>
    <select class="bs-select" id="City" name="City">
      <option value="" selected>--Select--</option>
    </select>
  </div>
</div>


                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="Phone">Phone</label>
                    <input type="text" class="bs-input-text" id="Phone" name="Phone" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="Country">Country</label>
                    <select class="bs-select" id="Country" name="Country">
                      <option value="" selected>--Select--</option>
                    </select>
                    <input type="hidden" id="CountryName" name="CountryName" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="AgentName">Agent Name</label>
                    <input type="text" class="bs-input-text" id="AgentName" name="AgentName" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="IsActive">Is Active</label>
                    <div class="d-flex align-items-center">
                      <input class="bs-checkbox" type="checkbox" id="IsActive" name="IsActive" checked />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye"></i>BEHIND THE SCENE</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-shell-mode="View"><i class="bi bi-eye me-1" aria-hidden="true"></i>View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Edit</button>
          <button type="button" class="btn-action" data-insurance-policy-action="delete"><i class="bi bi-trash me-1" aria-hidden="true"></i>Delete</button>
          <button type="button" class="btn-action" data-insurance-policy-action="save" disabled><i class="bi bi-save me-1" aria-hidden="true"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" data-insurance-policy-action="cancel"><i class="bi bi-x-circle me-1" aria-hidden="true"></i>Cancel</button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../assets/js/services/shared/searchService.js"></script>
  <script src="../../assets/js/services/static-data/staticDataService.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/services/search/insuranceSearchServices.js"></script>
  <script src="../../assets/js/pages/static-data/insurance-policy.js"></script>
</body>

</html>
