<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Limit Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../../assets/css/styles.css">
</head>
<body>
  <div class="window">
    <div class="main-container">
      <div class="form-content" role="region" aria-label="Bank Limit Maintenance form">
        <div class="form-card" data-main-form>
          <!-- Bank Details Section -->
          <div class="form-section" data-section="bank-details">
            <div class="section-header" data-section-toggle>
              <i class="bi bi-bank2 me-2"></i>Bank Details
              <button type="button" class="btn btn-sm btn-link ms-auto" aria-label="Toggle Bank Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <form id="bankLimitForm" autocomplete="off">
                <!-- Row 1: Type -->
                <div class="row g-3 mb-3">
                  <div class="col-6">
                    <label class="label-blue" for="type">Type</label>
                    <select id="type" name="type" class="bs-select" disabled>
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col-6"></div>
                </div>

                <!-- Row 2: Currency ID -->
                <div class="row g-3 mb-3">
                  <div class="col-6">
                    <div class="d-flex flex-column gap-2">
                      <label class="label-blue">Currency ID / Name</label>
                      <div class="d-flex gap-2">
                        <input id="currencyId" name="currencyId" type="text" class="bs-input-text form-control" placeholder="EUR">
                        <input id="currencyName" name="currencyName" type="text" class="bs-input-text form-control" placeholder="EURO" readonly>
                        <button class="btn-lookup" type="button" data-lookup="currencyId" title="Lookup Currency" aria-label="Lookup Currency"><i class="bi bi-search"></i></button>
                      </div>
                    </div>
                  </div>
                  <div class="col-6"></div>
                </div>

                <!-- Row 3: Limit & Expiry Date -->
                <div class="row g-3 mb-3">
                  <div class="col-6">
                    <label class="label-blue" for="limit">Limit</label>
                    <input id="limit" name="limit" type="number" class="bs-input-text money-field" step="0.01" placeholder="0.00">
                  </div>
                  <div class="col-6">
                    <div class="d-flex flex-column gap-2">
                      <label class="label-blue">Expiry Date</label>
                      <div class="d-flex gap-2">
                        <input id="expiryDate" name="expiryDate" type="text" class="bs-input-text form-control" data-date-picker placeholder="dd mmm yyyy">
                        <button class="btn-lookup" type="button" id="calendarBtn" data-action="calendar" title="Pick Date" aria-label="Pick Date"><i class="bi bi-calendar-event"></i></button>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Row 4: Remarks -->
                <div class="row g-3 mb-3">
                  <div class="col-12">
                    <label class="label-blue" for="remarks">Remarks</label>
                    <input id="remarks" name="remarks" type="text" class="bs-input-text">
                  </div>
                </div>

                <!-- Action Buttons Row -->
                <div class="row g-3 mb-3">
                  <div class="col-12">
                    <div class="d-flex gap-2 justify-content-center">
                      <button type="button" class="btn-action" id="btnNew" data-action="new" title="New" disabled>
                        <i class="bi bi-plus-circle me-1"></i>New
                      </button>
                      <button type="button" class="btn-action" id="btnAlter" data-action="alter" title="Alter" disabled>
                        <i class="bi bi-pencil-square me-1"></i>Alter
                      </button>
                      <button type="button" class="btn-action" id="btnRemove" data-action="remove" title="Remove" disabled>
                        <i class="bi bi-trash me-1"></i>Remove
                      </button>
                      <button type="button" class="btn-action" id="btnUpdate" data-action="update" title="Update" disabled>
                        <i class="bi bi-check-lg me-1"></i>Update
                      </button>
                      <button type="button" class="btn-action btn-cancel" id="btnClear" data-action="clear" title="Clear" disabled>
                        <i class="bi bi-x-circle me-1"></i>Clear
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- Limit Records Section -->
          <div class="form-section" data-section="limit-records">
            <div class="section-header" data-section-toggle>
              <i class="bi bi-table me-2"></i>Limit Records
              <button type="button" class="btn btn-sm btn-link ms-auto" aria-label="Toggle Limit Records" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <table class="table table-sm table-hover" id="limitTable" style="table-layout: fixed;">
                <thead>
                  <tr>
                    <th>Limit Type Name</th>
                    <th>Currency Name</th>
                    <th class="text-end">Limit</th>
                    <th>Expiry Date</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="no-data">
                    <td colspan="4" class="text-center text-muted fst-italic">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Behind The Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <i class="bi bi-gear me-2"></i>Behind The Scene
              <button type="button" class="btn btn-sm btn-link ms-auto" aria-label="Toggle Behind The Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section">
                <div class="audit-item">
                  <label>Created By</label>
                  <input type="text" id="createdBy" class="form-control" value="-" readonly>
                </div>
                <div class="audit-item">
                  <label>Created On</label>
                  <input type="text" id="createdOn" class="form-control" value="-" readonly>
                </div>
                <div class="audit-item">
                  <label>Modified By</label>
                  <input type="text" id="modifiedBy" class="form-control" value="-" readonly>
                </div>
                <div class="audit-item">
                  <label>Modified On</label>
                  <input type="text" id="modifiedOn" class="form-control" value="-" readonly>
                </div>
                <div class="audit-item">
                  <label>Supervised By</label>
                  <input type="text" id="supervisedBy" class="form-control" value="-" readonly>
                </div>
                <div class="audit-item">
                  <label>Supervised On</label>
                  <input type="text" id="supervisedOn" class="form-control" value="-" readonly>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Vertical Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action" id="btnAdd" title="Add">
            <i class="bi bi-plus-circle me-1"></i>Add
          </button>
          <button type="button" class="btn-action" id="btnEdit" title="Edit" disabled>
            <i class="bi bi-pencil-square me-1"></i>Edit
          </button>
          <button type="button" class="btn-action" id="btnDelete" title="Delete" disabled>
            <i class="bi bi-trash me-1"></i>Delete
          </button>
          <button type="button" class="btn-action" id="btnSave" title="Save" data-action="save" disabled>
            <i class="bi bi-check-lg me-1"></i>Save
          </button>
          <button type="button" class="btn-action btn-cancel" id="btnCancel" title="Cancel" data-action="cancel" disabled>
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <button type="button" class="btn-action" id="btnBack" title="Back">
            <i class="bi bi-arrow-left me-1"></i>Back
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Load Environment Configuration -->
  <script src="../../../../assets/js/environment.js"></script>
  <script src="../../../../assets/js/services/shared/coreApi.js"></script>
  <!-- Load Service Loader (which loads CoreApi and other services) -->
  <script src="../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../../assets/js/ui/date-pickers.js"></script>

  <script src="../../../bank-limit-maintenance/bank-limit-maintenance.js"></script>

  <!-- Window Controls & Section Toggles -->
  <script>
    (function() {
      /**
       * Send message to parent when form opens
       */
      function notifyParentFormOpened() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleOpened',
              source: 'Bank Limit Maintenance'
            }, '*');
          }
        } catch (error) {
          console.error('Error notifying parent of form open:', error);
        }
      }

      /**
       * Close the child form by notifying parent
       */
      function closeChildForm() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleClosed',
              source: 'Bank Limit Maintenance'
            }, '*');
          } else {
            window.close();
          }
        } catch (error) {
          console.error('Error closing form:', error);
        }
      }

      /**
       * Initialize section toggles
       */
      function initSectionToggles() {
        document.querySelectorAll('[data-section-toggle]').forEach(header => {
          header.addEventListener('click', (e) => {
            const section = header.closest('.form-section');
            const content = section.querySelector('[data-section-content]');
            const toggleBtn = header.querySelector('button[aria-label*="Toggle"]');
            const icon = toggleBtn?.querySelector('i');
            
            if (content) {
              const isHidden = content.hidden;
              content.hidden = !isHidden;
              
              if (icon) {
                icon.className = isHidden ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
              }
              if (toggleBtn) {
                toggleBtn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
              }
            }
          });
        });
      }

      // Initialize on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          initSectionToggles();
          notifyParentFormOpened();
        });
      } else {
        initSectionToggles();
        notifyParentFormOpened();
      }
    })();
  </script>
</body> 
</html>
