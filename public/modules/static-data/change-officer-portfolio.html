<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Officer Portfolio · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <!-- <link rel="stylesheet" href="./static-data.css" /> -->
</head>

<body class="change-officer-portfolio copilot-theme" data-page="static-data-change-officer-portfolio">
  <div class="window">
    <form id="change-officer-portfolio-form" autocomplete="off" novalidate>
      <div class="main-container">
        <!-- Sidebar purposefully omitted -->

        <section class="form-content" aria-label="Change Officer Portfolio Content">
          <div class="form-card">
            <!-- Portfolio Search Section -->
            <div class="form-section" data-section="portfolio-search">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-search"></i> Portfolio Search</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Portfolio Search"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="BranchId">Branch</label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" class="kairo-branch-control__id" id="BranchId" name="BranchId"
                        aria-label="Branch ID" data-always-enabled />
                      <input type="text" class="kairo-branch-control__name" id="BranchName" name="BranchName"
                        aria-label="Branch Name" placeholder="Branch Name" readonly />
                      <button type="button" class="btn-lookup kairo-branch-control__lookup" aria-label="Search Branch"
                        data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="OfficerId">Officer</label>
                    <div class="kairo-user-control" data-kairo-user-control>
                      <input type="text" class="kairo-user-control__id" id="OfficerId" name="OfficerId"
                        aria-label="Officer ID" data-always-enabled />
                      <input type="text" class="kairo-user-control__name" id="OfficerName" name="OfficerName"
                        aria-label="Officer Name" placeholder="Officer Name" readonly />
                      <button type="button" class="btn-lookup kairo-user-control__lookup" aria-label="Search Officer"
                        data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="Designation">Designation</label>
                    <select class="bs-select" id="Designation" name="Designation">
                      <option value="">--Select--</option>
                      <option>Branch Manager</option>
                      <option>Loan Officer</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="PortfolioType">Portfolio Type</label>
                    <select class="bs-select" id="PortfolioType" name="PortfolioType">
                      <option value="">--Select--</option>
                      <option>Group</option>
                      <option>Center</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="OfficerId">Officer</label>
                    <div class="kairo-user-control" data-kairo-user-control>
                      <input type="text" class="kairo-user-control__id" id="OfficerId" name="OfficerId"
                        aria-label="Officer ID" data-always-enabled />
                      <input type="text" class="kairo-user-control__name" id="OfficerName" name="OfficerName"
                        aria-label="Officer Name" placeholder="Officer Name" readonly />
                      <button type="button" class="btn-lookup kairo-user-control__lookup" aria-label="Search Officer"
                        data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <!-- Empty column for spacing -->
                  </div>
                </div>
              </div>
            </div>

            <!-- Portfolio Transfer Section -->
            <div class="form-section" data-section="portfolio-transfer">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-arrow-left-right"></i> Portfolio Transfer</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Portfolio Transfer"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="FromGroupId">From Portfolio</label>
                    <div class="kairo-user-control" data-kairo-user-control>
                      <input type="text" class="kairo-user-control__id" id="FromGroupId" name="FromGroupId"
                        aria-label="From Portfolio ID" data-always-enabled />
                      <input type="text" class="kairo-user-control__name" id="FromGroupName" name="FromGroupName"
                        aria-label="From Portfolio Name" placeholder="Portfolio Name" readonly />
                      <button type="button" class="btn-lookup kairo-user-control__lookup"
                        aria-label="Search From Portfolio" data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ToGroupId">To Portfolio</label>
                    <div class="kairo-user-control" data-kairo-user-control>
                      <input type="text" class="kairo-user-control__id" id="ToGroupId" name="ToGroupId"
                        aria-label="To Portfolio ID" data-always-enabled />
                      <input type="text" class="kairo-user-control__name" id="ToGroupName" name="ToGroupName"
                        aria-label="To Portfolio Name" placeholder="Portfolio Name" readonly />
                      <button type="button" class="btn-lookup kairo-user-control__lookup"
                        aria-label="Search To Portfolio" data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Authorization Section -->
            <div class="form-section" data-section="authorization">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-shield-check"></i> Authorization</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Authorization" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="SignInOfficerId">Authorized By</label>
                    <div class="kairo-user-control" data-kairo-user-control>
                      <input type="text" class="kairo-user-control__id" id="SignInOfficerId" name="SignInOfficerId"
                        aria-label="Officer ID" data-always-enabled />
                      <input type="text" class="kairo-user-control__name" id="SignInOfficerName"
                        name="SignInOfficerName" aria-label="Officer Name" placeholder="Officer Name" readonly />
                      <button type="button" class="btn-lookup kairo-user-control__lookup" aria-label="Search Officer"
                        data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="EffectiveDate">Effective Date</label>
                    <input type="text" class="bs-input-text" id="EffectiveDate" name="EffectiveDate"
                      placeholder="YYYY-MM-DD" data-date-picker />
                  </div>
                </div>
              </div>
            </div>

            <!-- Centers Section -->
            <div class="form-section" data-section="centers">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-building"></i> Centers to Transfer</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Centers" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th scope="col" class="text-center">
                          <input class="form-check-input" type="checkbox" aria-label="Select all" />
                        </th>
                        <th scope="col">Center ID</th>
                        <th scope="col">Center Name</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="3" class="text-center text-muted py-4">No records to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="action-panel" aria-label="Actions">
          <div class="action-buttons">
            <button type="button" class="btn-action btn-view" data-shell-mode="View">
              <i class="bi bi-eye me-1"></i>View
            </button>
            <button type="button" class="btn-action" data-shell-mode="Change">
              <i class="bi bi-pencil me-1"></i>Change
            </button>
            <button type="button" class="btn-action" data-cop-action="save" disabled>
              <i class="bi bi-check me-1"></i>Save
            </button>
            <button type="button" class="btn-action" data-cop-action="cancel" disabled>
              <i class="bi bi-x me-1"></i>Cancel
            </button>
          </div>
        </aside>
      </div>
    </form>
    <div class="am-message-panel"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/ui/date-picker-trigger.js"></script>
  <script src="../../assets/js/pages/static-data/change-officer-portfolio.js"></script>
</body>

</html>
