<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Class Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=20260205">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        
        /* Modern Table Styles */
        #subClassificationsTable {
            font-size: 0.85rem;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        #subClassificationsTable thead th {
            background: linear-gradient(180deg, #0d6efd 0%, #0b5ed7 100%);
            color: white;
            font-weight: 600;
            padding: 10px 8px;
            border: none;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }
        
        #subClassificationsTable tbody tr {
            transition: all 0.15s ease;
        }
        
        #subClassificationsTable tbody tr:hover {
            background-color: #e7f1ff !important;
            transform: scale(1.002);
        }
        
        #subClassificationsTable tbody tr.selected {
            background-color: #cfe2ff !important;
            box-shadow: inset 3px 0 0 #0d6efd;
        }
        
        #subClassificationsTable tbody td {
            padding: 8px;
            vertical-align: middle;
            border-color: #dee2e6;
        }
        
        #subClassificationsTable tbody tr:nth-child(odd) {
            background-color: #f8f9fa;
        }
        
        #subClassificationsTable tbody tr:nth-child(even) {
            background-color: #ffffff;
        }
        
        .table-responsive {
            border: 1px solid #dee2e6;
            border-radius: 6px;
            margin: 10px 15px 15px;
        }
    </style>
</head>
<body data-page="loan-classification-detail">
    <div class="window" style="height: 100%; display: flex; flex-direction: column;">
        <!-- Title Bar -->
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-layers-fill am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">Loan Class Detail</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window">
                    <i class="bi bi-square"></i>
                </button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>

        <!-- Main Container -->
        <main class="main-container" style="flex: 1; overflow: hidden;">
            <!-- Form Content -->
            <div class="form-content" style="flex: 1; overflow-y: auto;">
                <div class="form-card" data-main-form>
                    <!-- Sub Classification Form Fields -->
                    <div class="form-section" data-section="sub-classification-form">
                        <div class="section-content" data-section-content style="padding: 15px;">
                            <form id="sub-classification-form">
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="loanType">Loan Type</label>
                                        <select id="loanType" class="bs-select">
                                            <option value="">--Select--</option>
                                            <!-- Options loaded from database -->
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="subClassId">Sub Class ID</label>
                                        <select id="subClassId" class="bs-select">
                                            <option value="">--Select--</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="fromAgingDays">From Aging Days</label>
                                        <input type="number" id="fromAgingDays" class="bs-input-text" placeholder="">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="toAgingDays">To Aging Days</label>
                                        <input type="number" id="toAgingDays" class="bs-input-text" placeholder="">
                                    </div>
                                </div>

                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Is Specific Provision</label>
                                        <div class="form-check">
                                            <input type="checkbox" id="isSpecificProvision" class="form-check-input">
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Under NPA</label>
                                        <div class="form-check">
                                            <input type="checkbox" id="underNPA" class="form-check-input">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="probabilityOfDefault">Probability Of Default</label>
                                        <input type="text" id="probabilityOfDefault" class="bs-input-text" placeholder="">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="lossGivenDefault">Loss Given Default</label>
                                        <input type="text" id="lossGivenDefault" class="bs-input-text" placeholder="">
                                    </div>
                                </div>

                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="provisionRate">Provision Rate</label>
                                        <div class="input-with-suffix">
                                            <input type="text" id="provisionRate" class="bs-input-text" placeholder="">
                                            <span class="suffix">%</span>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="penalty">Penalty</label>
                                        <div class="input-with-suffix">
                                            <input type="text" id="penalty" class="bs-input-text" placeholder="">
                                            <span class="suffix">%</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Form Action Buttons -->
                                <div class="form-action-buttons">
                                    <button type="button" class="btn-form-action" id="newBtn"><i class="bi bi-plus-lg"></i> New</button>
                                    <button type="button" class="btn-form-action" id="alterBtn"><i class="bi bi-pencil-square"></i> Alter</button>
                                    <button type="button" class="btn-form-action" id="removeBtn"><i class="bi bi-trash"></i> Remove</button>
                                    <button type="button" class="btn-form-action" id="updateBtn"><i class="bi bi-arrow-repeat"></i> Update</button>
                                    <button type="button" class="btn-form-action" id="clearBtn"><i class="bi bi-x-circle"></i> Clear</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Sub Classifications Table Section -->
                    <div class="form-section" data-section="sub-classifications-table">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-table"></i>Sub Classifications</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Sub Classifications" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                                <table class="table table-striped table-hover table-bordered table-sm" id="subClassificationsTable">
                                    <thead class="table-primary sticky-top">
                                        <tr>
                                            <th style="min-width: 120px;">Sub Class</th>
                                            <th style="min-width: 100px; text-align: center;">From Days</th>
                                            <th style="min-width: 100px; text-align: center;">To Days</th>
                                            <th style="min-width: 80px; text-align: center;">Specific Prov.</th>
                                            <th style="min-width: 80px; text-align: center;">Under NPA</th>
                                            <th style="min-width: 100px; text-align: right;">Provision %</th>
                                            <th style="min-width: 100px; text-align: right;">POD</th>
                                            <th style="min-width: 100px; text-align: right;">LGD</th>
                                            <th style="min-width: 100px; text-align: right;">Penalty %</th>
                                        </tr>
                                    </thead>
                                    <tbody id="subClassificationsTableBody">
                                        <tr>
                                            <td colspan="9" class="text-center text-muted py-4">Select a Loan Type and click View to load records.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button class="btn-action" type="button" data-action="view"><i class="bi bi-eye"></i><span>View</span></button>
                    <button class="btn-action" type="button" data-action="add"><i class="bi bi-plus-circle"></i><span>Add</span></button>
                    <button class="btn-action" type="button" data-action="edit"><i class="bi bi-pencil"></i><span>Edit</span></button>
                    <button class="btn-action btn-delete" type="button" data-action="delete"><i class="bi bi-trash"></i><span>Delete</span></button>
                    <button class="btn-action" type="button" data-action="save"><i class="bi bi-check-circle"></i><span>Save</span></button>
                    <button class="btn-action btn-cancel" type="button" data-action="cancel"><i class="bi bi-x-circle"></i><span>Cancel</span></button>
                    <button class="btn-action" type="button" data-action="back"><i class="bi bi-arrow-left"></i><span>Back</span></button>
                </div>
            </div>
        </main>

        <!-- Status Bar -->
        <div class="status-bar">
            <span>BR.Net Web Banking</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/common/form-init.js"></script>
    <!-- Core Services for Database Lookups -->
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../assets/js/services/shared/lookupService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ================================================================
            // STATE - ClassID from parent form
            // ================================================================
            let currentClassId = '';
            
            // Listen for ClassID from parent
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'setClassId') {
                    currentClassId = event.data.classId || '';
                    console.log('[LoanClassDetail] Received ClassID from parent:', currentClassId);
                    
                    // Clear and reload table if LoanType is already selected
                    const loanTypeSelect = document.getElementById('loanType');
                    if (loanTypeSelect && loanTypeSelect.value) {
                        loadClassDetails(currentClassId, loanTypeSelect.value);
                    }
                }
            });
            
            // ================================================================
            // LOAD TABLE DATA FROM DATABASE
            // ================================================================
            
            /**
             * Load Loan Class Details from database
             * Calls: exec p_GetLoanClassDetails @BankID, @ClassID, @LoanTypeID, @OperatorID, @OurBranchID
             */
            async function loadClassDetails(classId, loanTypeId) {
                if (!classId || !loanTypeId) {
                    console.log('[LoanClassDetail] Missing ClassID or LoanTypeID, skipping load');
                    return;
                }
                
                const tableBody = document.getElementById('subClassificationsTableBody');
                if (!tableBody) return;
                
                try {
                    console.log('[LoanClassDetail] Loading class details for ClassID:', classId, 'LoanTypeID:', loanTypeId);
                    
                    // Show loading state
                    tableBody.innerHTML = '<tr><td colspan="9" class="text-center"><i class="bi bi-hourglass-split"></i> Loading...</td></tr>';
                    
                    // Get environment settings
                    const baseUrl = (Environment.baseUrl || Environment.baseUrlCommon || 'http://172.16.2.31:3306').replace(/\/+$/, '');
                    const bankId = Environment.bankId || '00';
                    const operatorId = Environment.operatorId || sessionStorage.getItem('operatorId') || 'JOHN_KIMANI';
                    const branchId = Environment.ourBranchId || sessionStorage.getItem('ourBranchId') || '0101';
                    
                    // Build request
                    const requestData = {
                        BankID: bankId,
                        ClassID: classId,
                        LoanTypeID: loanTypeId,
                        OperatorID: operatorId,
                        OurBranchID: branchId
                    };
                    
                    const envelope = {
                        RequestID: 'dbo.p_GetLoanClassDetails',
                        FormId: 'dbo.p_GetLoanClassDetails',
                        FormID: 'dbo.p_GetLoanClassDetails',
                        RequestData: requestData,
                        RequestTime: new Date().toISOString().slice(0, 19),
                        AppName: 'CORE_BANKING',
                        Checksum: ''
                    };
                    
                    console.log('[LoanClassDetail] Request envelope:', envelope);
                    
                    const response = await fetch(`${baseUrl}/api/OldAPI`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(envelope)
                    });
                    
                    const result = await response.json();
                    console.log('[LoanClassDetail] p_GetLoanClassDetails response:', result);
                    
                    // Handle different response formats:
                    // Format 1: { success: true, data: [...], Details: [...] }
                    // Format 2: { Details: [...], Details01: [...] } - Details01 contains the sub-class data
                    let rows = [];
                    
                    if (result.Details01 && Array.isArray(result.Details01)) {
                        // Details01 contains the sub-classification records
                        rows = result.Details01;
                        console.log('[LoanClassDetail] Found data in Details01:', rows.length, 'rows');
                    } else if (result.success && result.data) {
                        rows = Array.isArray(result.data) ? result.data : [result.data];
                    } else if (result.Details && Array.isArray(result.Details)) {
                        rows = result.Details;
                    } else if (result.data?.Details01) {
                        rows = result.data.Details01;
                    } else if (result.data?.Details) {
                        rows = result.data.Details;
                    }
                    
                    // Filter out empty or error rows
                    rows = rows.filter(r => r && (r.SubClassID || r.SubClass));
                    
                    console.log('[LoanClassDetail] Table rows after filtering:', rows);
                    
                    if (rows.length > 0) {
                        populateTable(rows);
                    } else {
                        tableBody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">No records found for this classification and loan type.</td></tr>';
                    }
                } catch (error) {
                    console.error('[LoanClassDetail] Error loading class details:', error);
                    tableBody.innerHTML = '<tr><td colspan="9" class="text-center text-danger">Error loading data. Please try again.</td></tr>';
                }
            }
            
            /**
             * Populate table with data rows
             * Store raw data in dataset for form population
             */
            let tableData = []; // Store table data for form population
            
            function populateTable(rows) {
                const tableBody = document.getElementById('subClassificationsTableBody');
                if (!tableBody) return;
                
                tableBody.innerHTML = '';
                tableData = rows; // Store for later use
                
                // Log first row keys for debugging field names
                if (rows.length > 0) {
                    console.log('[LoanClassDetail] First row keys:', Object.keys(rows[0]));
                    console.log('[LoanClassDetail] First row data:', rows[0]);
                }
                
                rows.forEach((row, index) => {
                    const tr = document.createElement('tr');
                    tr.dataset.index = index;
                    tr.style.cursor = 'pointer';
                    
                    // Store raw data as JSON in dataset
                    tr.dataset.rawData = JSON.stringify(row);
                    
                    // Extract values using exact field names from API response
                    // SubClass - display "SubClassID - SubClass" format (e.g., "01 - Normal / Pass")
                    const subClassId = row.SubClassID || '-';
                    const subClassName = row.SubClass || '';
                    const subClassDisplay = subClassName ? `${subClassId} - ${subClassName}` : subClassId;
                    
                    // Aging days - exact field names: AgingFromDays, AgingToDays
                    const fromDays = row.AgingFromDays ?? row.FromAgingDays ?? '-';
                    const toDays = row.AgingToDays ?? row.ToAgingDays ?? '-';
                    
                    // IsSpecificProvision - boolean from API
                    const isSpecificProvision = row.IsSpecificProvision === true;
                    
                    // UnderNPA - boolean from API
                    const underNPA = row.UnderNPA === true;
                    
                    // ProvisionRate - number from API
                    const provisionRate = row.ProvisionRate;
                    const provisionDisplay = (provisionRate !== null && provisionRate !== undefined) ? `${provisionRate}%` : '-';
                    
                    // POD - Probability of Default (check if exists in response)
                    const pod = row.ProbabilityOfDefault ?? row.POD ?? row.PD ?? null;
                    const podDisplay = (pod !== null && pod !== undefined) ? pod : '-';
                    
                    // LGD - Loss Given Default (check if exists in response)
                    const lgd = row.LossGivenDefault ?? row.LGD ?? null;
                    const lgdDisplay = (lgd !== null && lgd !== undefined) ? lgd : '-';
                    
                    // Penalty Rate (check if exists in response)
                    const penalty = row.Penalty ?? row.PenaltyRate ?? null;
                    const penaltyDisplay = (penalty !== null && penalty !== undefined) ? `${penalty}%` : '-';
                    
                    tr.innerHTML = `
                        <td class="fw-medium">${subClassDisplay}</td>
                        <td class="text-center">${fromDays}</td>
                        <td class="text-center">${toDays}</td>
                        <td class="text-center">${isSpecificProvision ? '<i class="bi bi-check-circle-fill text-success"></i>' : '<i class="bi bi-x-circle text-muted"></i>'}</td>
                        <td class="text-center">${underNPA ? '<i class="bi bi-check-circle-fill text-warning"></i>' : '<i class="bi bi-x-circle text-muted"></i>'}</td>
                        <td class="text-end">${provisionDisplay}</td>
                        <td class="text-end">${podDisplay}</td>
                        <td class="text-end">${lgdDisplay}</td>
                        <td class="text-end">${penaltyDisplay}</td>
                    `;
                    tableBody.appendChild(tr);
                });
                
                console.log('[LoanClassDetail] Table populated with', rows.length, 'rows');
            }
            
            // ================================================================
            // LOAD DROPDOWNS FROM DATABASE
            // ================================================================
            
            /**
             * Load Loan Type dropdown from database
             * Uses t_SystemCodeDetail where ID = 'LoanTypeID'
             */
            async function loadLoanTypeDropdown() {
                const loanTypeSelect = document.getElementById('loanType');
                if (!loanTypeSelect) return;
                
                try {
                    // Check if LookupService is available
                    if (typeof LookupService === 'undefined') {
                        console.error('[LoanClassDetail] LookupService not loaded');
                        return;
                    }
                    
                    console.log('[LoanClassDetail] Loading Loan Types from database...');
                    
                    // Fetch from database using LookupService
                    const options = await LookupService.getSystemCodeOptions('LoanTypeID');
                    
                    console.log('[LoanClassDetail] Loan Types loaded:', options);
                    
                    // Clear existing options except the default
                    loanTypeSelect.innerHTML = '<option value="">--Select--</option>';
                    
                    // Populate dropdown with database values
                    // options format: { value: SubCodeID, label: Description, order: DisplayOrder }
                    if (options && options.length > 0) {
                        options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt.value; // SubCodeID (e.g., 'N', 'F', 'R')
                            option.textContent = opt.label; // Description (e.g., 'Normal', 'Refinance', 'Rescheduled')
                            loanTypeSelect.appendChild(option);
                        });
                        console.log('[LoanClassDetail] Loan Type dropdown populated with', options.length, 'items');
                    } else {
                        console.warn('[LoanClassDetail] No Loan Types returned from database');
                    }
                } catch (error) {
                    console.error('[LoanClassDetail] Error loading Loan Types:', error);
                }
            }
            
            /**
             * Load Sub Class dropdown from database
             * Uses t_SystemCodeDetail where ID = 'LoanSubClassificationID' or 'SubClassificationID'
             * Expected values: Normal/Pass, Watch, SubStandard, Doubtful, Loss
             */
            async function loadSubClassDropdown() {
                const subClassSelect = document.getElementById('subClassId');
                if (!subClassSelect) return;
                
                try {
                    if (typeof LookupService === 'undefined') return;
                    
                    console.log('[LoanClassDetail] Loading Sub Classes from database...');
                    
                    // Try multiple possible system code IDs
                    const possibleCodeIds = [
                        'LoanSubClassificationID',
                        'SubClassificationID', 
                        'LoanSubClassID',
                        'ClassificationID',
                        'LoanClassID'
                    ];
                    
                    let options = [];
                    
                    for (const codeId of possibleCodeIds) {
                        try {
                            options = await LookupService.getSystemCodeOptions(codeId);
                            if (options && options.length > 0) {
                                console.log(`[LoanClassDetail] Sub Classes found using ${codeId}:`, options);
                                break;
                            }
                        } catch (e) {
                            console.log(`[LoanClassDetail] No results for ${codeId}, trying next...`);
                        }
                    }
                    
                    console.log('[LoanClassDetail] Sub Classes loaded:', options);
                    
                    subClassSelect.innerHTML = '<option value="">--Select--</option>';
                    
                    if (options && options.length > 0) {
                        options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt.value;
                            option.textContent = opt.label;
                            subClassSelect.appendChild(option);
                        });
                        console.log('[LoanClassDetail] Sub Class dropdown populated with', options.length, 'items');
                    } else {
                        console.warn('[LoanClassDetail] No Sub Classes returned from database');
                    }
                } catch (error) {
                    console.error('[LoanClassDetail] Error loading Sub Classes:', error);
                }
            }
            
            // Load all dropdowns on page load
            loadLoanTypeDropdown();
            loadSubClassDropdown();
            
            // ================================================================
            // LOAN TYPE CHANGE HANDLER - Load table data
            // ================================================================
            const loanTypeSelect = document.getElementById('loanType');
            if (loanTypeSelect) {
                loanTypeSelect.addEventListener('change', function() {
                    const selectedLoanType = this.value;
                    console.log('[LoanClassDetail] Loan Type changed to:', selectedLoanType);
                    
                    if (selectedLoanType && currentClassId) {
                        loadClassDetails(currentClassId, selectedLoanType);
                    } else if (!currentClassId) {
                        console.warn('[LoanClassDetail] ClassID not set yet, waiting for parent message');
                    }
                });
            }
            
            // Window control buttons
            const closeBtn = document.querySelector('[data-action="close"]');
            const maximizeBtn = document.querySelector('[data-action="maximize"]');
            const refreshBtn = document.querySelector('[data-action="refresh"]');
            const backBtn = document.querySelector('[data-action="back"]');

            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'submoduleClosed', modalId: 'detailModal' }, '*');
                    }
                });
            }

            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'submoduleClosed', modalId: 'detailModal' }, '*');
                    }
                });
            }

            if (maximizeBtn) {
                maximizeBtn.addEventListener('click', function() {
                    const windowEl = document.querySelector('.window');
                    if (windowEl) {
                        windowEl.classList.toggle('maximized');
                        const icon = this.querySelector('i');
                        if (windowEl.classList.contains('maximized')) {
                            icon.classList.remove('bi-square');
                            icon.classList.add('bi-fullscreen-exit');
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'toggleSidebarForMaximize', maximize: true }, '*');
                            }
                        } else {
                            icon.classList.remove('bi-fullscreen-exit');
                            icon.classList.add('bi-square');
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'toggleSidebarForMaximize', maximize: false }, '*');
                            }
                        }
                    }
                });
            }

            if (refreshBtn) {
                refreshBtn.addEventListener('click', function() {
                    console.log('Refreshing loan class detail data...');
                    const loanType = document.getElementById('loanType').value;
                    if (loanType && currentClassId) {
                        loadClassDetails(currentClassId, loanType);
                    }
                });
            }

            // Action Panel Buttons (View, Add, Edit, Delete, Save, Cancel, Back)
            const viewBtn = document.querySelector('[data-action="view"]');
            const addBtn = document.querySelector('[data-action="add"]');
            const editBtn = document.querySelector('[data-action="edit"]');
            const deleteBtn = document.querySelector('[data-action="delete"]');
            const saveBtn = document.querySelector('[data-action="save"]');
            const cancelBtn = document.querySelector('[data-action="cancel"]');
            
            // View button - Load table data from database
            if (viewBtn) {
                viewBtn.addEventListener('click', function() {
                    const loanType = document.getElementById('loanType').value;
                    if (!loanType) {
                        alert('Please select a Loan Type first');
                        return;
                    }
                    if (!currentClassId) {
                        alert('No classification loaded. Please select a classification from the main form.');
                        return;
                    }
                    console.log('[LoanClassDetail] View clicked - Loading data for ClassID:', currentClassId, 'LoanType:', loanType);
                    loadClassDetails(currentClassId, loanType);
                });
            }

            // Form Action Buttons
            const newBtn = document.getElementById('newBtn');
            const alterBtn = document.getElementById('alterBtn');
            const removeBtn = document.getElementById('removeBtn');
            const updateBtn = document.getElementById('updateBtn');
            const clearBtn = document.getElementById('clearBtn');

            if (newBtn) {
                newBtn.addEventListener('click', function() {
                    clearForm();
                    enableFormFields(true);
                    console.log('New sub classification mode');
                });
            }

            if (alterBtn) {
                alterBtn.addEventListener('click', function() {
                    if (selectedRow) {
                        enableFormFields(true);
                        console.log('Alter mode - editing selected record');
                    } else {
                        alert('Please select a record to alter');
                    }
                });
            }

            if (removeBtn) {
                removeBtn.addEventListener('click', function() {
                    if (selectedRow) {
                        if (confirm('Are you sure you want to remove this sub classification?')) {
                            selectedRow.remove();
                            clearForm();
                            selectedRow = null;
                            console.log('Record removed');
                        }
                    } else {
                        alert('Please select a record to remove');
                    }
                });
            }

            if (updateBtn) {
                updateBtn.addEventListener('click', function() {
                    if (validateForm()) {
                        saveFormData();
                        console.log('Sub classification updated');
                    }
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', function() {
                    clearForm();
                    selectedRow = null;
                    console.log('Form cleared');
                });
            }

            // Table row selection
            let selectedRow = null;
            const tableBody = document.getElementById('subClassificationsTableBody');

            if (tableBody) {
                tableBody.addEventListener('click', function(e) {
                    const row = e.target.closest('tr');
                    if (row && !row.querySelector('td[colspan]')) {
                        // Deselect previous
                        if (selectedRow) {
                            selectedRow.classList.remove('selected');
                        }
                        // Select new
                        row.classList.add('selected');
                        selectedRow = row;
                        populateFormFromRow(row);
                    }
                });
            }

            function clearForm() {
                document.getElementById('sub-classification-form').reset();
            }

            function enableFormFields(enable) {
                const form = document.getElementById('sub-classification-form');
                const inputs = form.querySelectorAll('input, select');
                inputs.forEach(input => {
                    input.disabled = !enable;
                });
            }

            function validateForm() {
                const loanType = document.getElementById('loanType').value;
                const subClassId = document.getElementById('subClassId').value;
                
                if (!loanType) {
                    alert('Please select a Loan Type');
                    return false;
                }
                if (!subClassId) {
                    alert('Please select a Sub Class ID');
                    return false;
                }
                return true;
            }

            function saveFormData() {
                // TODO: Implement save to API
                console.log('Saving form data...');
            }

            function populateFormFromRow(row) {
                // Try to get raw data from dataset first
                let rawData = null;
                if (row.dataset && row.dataset.rawData) {
                    try {
                        rawData = JSON.parse(row.dataset.rawData);
                    } catch (e) {
                        console.warn('[LoanClassDetail] Could not parse raw data:', e);
                    }
                }
                
                if (rawData) {
                    // Use raw data for accurate values
                    const subClassId = rawData.SubClassID || rawData.SubClass || '';
                    const subClassSelect = document.getElementById('subClassId');
                    
                    // Set SubClass dropdown
                    if (subClassSelect) {
                        for (let i = 0; i < subClassSelect.options.length; i++) {
                            if (subClassSelect.options[i].value === subClassId) {
                                subClassSelect.selectedIndex = i;
                                break;
                            }
                        }
                    }
                    
                    // Populate other fields from raw data
                    document.getElementById('fromAgingDays').value = rawData.FromAgingDays ?? rawData.FromDays ?? '';
                    document.getElementById('toAgingDays').value = rawData.ToAgingDays ?? rawData.ToDays ?? '';
                    document.getElementById('isSpecificProvision').checked = !!rawData.IsSpecificProvision;
                    document.getElementById('underNPA').checked = !!rawData.UnderNPA;
                    document.getElementById('provisionRate').value = rawData.ProvisionRate ?? '';
                    document.getElementById('probabilityOfDefault').value = rawData.ProbabilityOfDefault ?? rawData.POD ?? '';
                    document.getElementById('lossGivenDefault').value = rawData.LossGivenDefault ?? rawData.LGD ?? '';
                    document.getElementById('penalty').value = rawData.Penalty ?? '';
                    
                    console.log('[LoanClassDetail] Form populated from raw data:', rawData);
                } else {
                    // Fallback to parsing cells
                    const cells = row.querySelectorAll('td');
                    if (cells.length >= 9) {
                        const subClassValue = cells[0].textContent.trim();
                        const subClassSelect = document.getElementById('subClassId');
                        
                        if (subClassSelect) {
                            for (let i = 0; i < subClassSelect.options.length; i++) {
                                const optValue = subClassSelect.options[i].value;
                                const optText = subClassSelect.options[i].textContent;
                                if (optValue === subClassValue || optText === subClassValue) {
                                    subClassSelect.selectedIndex = i;
                                    break;
                                }
                            }
                        }
                        
                        const fromAgingDays = cells[1].textContent.trim();
                        const toAgingDays = cells[2].textContent.trim();
                        
                        document.getElementById('fromAgingDays').value = fromAgingDays !== '-' ? fromAgingDays : '';
                        document.getElementById('toAgingDays').value = toAgingDays !== '-' ? toAgingDays : '';
                        document.getElementById('isSpecificProvision').checked = cells[3].textContent.toLowerCase() === 'yes';
                        document.getElementById('underNPA').checked = cells[4].textContent.toLowerCase() === 'yes';
                        
                        const provisionRate = cells[5].textContent.replace('%', '').trim();
                        const probabilityOfDefault = cells[6].textContent.trim();
                        const lossGivenDefault = cells[7].textContent.trim();
                        const penalty = cells[8].textContent.replace('%', '').trim();
                        
                        document.getElementById('provisionRate').value = provisionRate !== '-' ? provisionRate : '';
                        document.getElementById('probabilityOfDefault').value = probabilityOfDefault !== '-' ? probabilityOfDefault : '';
                        document.getElementById('lossGivenDefault').value = lossGivenDefault !== '-' ? lossGivenDefault : '';
                        document.getElementById('penalty').value = penalty !== '-' ? penalty : '';
                        
                        console.log('[LoanClassDetail] Form populated from cells');
                    }
                }
            }

            function loadTableData() {
                // Use the current LoanType and ClassID to reload table
                const loanType = document.getElementById('loanType').value;
                if (loanType && currentClassId) {
                    loadClassDetails(currentClassId, loanType);
                } else {
                    console.log('[LoanClassDetail] Cannot load table - missing LoanType or ClassID');
                }
            }

            // Notify parent that modal is open
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'submoduleOpened', modalId: 'detailModal' }, '*');
            }
        });
    </script>
</body>
</html>
