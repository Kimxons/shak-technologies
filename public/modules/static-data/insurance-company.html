<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insurance Company · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/maincss.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="insurance-company copilot-theme" data-page="static-data-insurance-company">
  <div class="window">
    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <form id="insurance-company-form" autocomplete="off" novalidate>
          <div class="form-card">
            <!-- Insurance Details Section -->
            <div class="form-section" data-section="insurance-details">
              <div class="section-header">
                <h2 class="section-header__title"><i class="bi bi-building"></i>Insurance Company Details</h2>
                <button type="button" class="section-toggle-btn" aria-label="Toggle section" aria-expanded="true">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
              <div class="section-content">
                <!-- Validation/Success Message Banner -->
                <div class="validation-summary" role="status" aria-live="polite" style="display: none; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); border: 1px solid #28a745; color: #155724;">
                  <i class="bi bi-check-circle validation-summary__icon" style="margin-right: 8px;"></i>
                  <span class="validation-summary__text"></span>
                  <button type="button" class="validation-summary__close" aria-label="Close notification" style="background: none; border: none; float: right; cursor: pointer; color: #155724;">
                    <i class="bi bi-x"></i>
                  </button>
                </div>

                <!-- Row 1: Insurance ID and Company -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="InsuranceID">Insurance ID</label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" id="InsuranceID" class="kairo-control__id" aria-label="Insurance ID" data-always-enabled>
                      <input type="text" id="InsuranceName" class="kairo-control__name" aria-label="Insurance Name" placeholder="Company Name" readonly>
                      <button type="button" class="btn-lookup kairo-control__lookup" data-target-input="InsuranceID" data-insurance-company-action="search" aria-label="Search Insurance"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="Company">Company</label>
                    <input type="text" class="bs-input-text" id="Company" name="Company" required>
                  </div>
                </div>

                <!-- Row 2: Address 1 and Address 2 -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="Address1">Address 1</label>
                    <input type="text" class="bs-input-text" id="Address1" name="Address1" required>
                  </div>
                  <div class="col">
                    <label for="Address2">Address 2</label>
                    <input type="text" class="bs-input-text" id="Address2" name="Address2">
                  </div>
                </div>

                <!-- Row 3: City and Country -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="City">City</label>
                    <select class="bs-select" id="City" name="City">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col">
                    <label for="Country">Country</label>
                    <select class="bs-select" id="Country" name="Country">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <!-- Row 4: Zip Code and Email -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="ZipCode">Zip Code</label>
                    <input type="text" class="bs-input-text" id="ZipCode" name="ZipCode">
                  </div>
                  <div class="col">
                    <label for="EmailID">Email ID</label>
                    <input type="email" class="bs-input-text" id="EmailID" name="EmailID">
                  </div>
                </div>

                <!-- Row 5: Phone 1 and Phone 2 -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="Phone1">Phone 1</label>
                    <input type="text" class="bs-input-text" id="Phone1" name="Phone1">
                  </div>
                  <div class="col">
                    <label for="Phone2">Phone 2</label>
                    <input type="text" class="bs-input-text" id="Phone2" name="Phone2">
                  </div>
                </div>

                <!-- Row 6: Mobile and Fax -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="Mobile">Mobile</label>
                    <input type="text" class="bs-input-text" id="Mobile" name="Mobile">
                  </div>
                  <div class="col">
                    <label for="FaxNo">Fax No</label>
                    <input type="text" class="bs-input-text" id="FaxNo" name="FaxNo">
                  </div>
                </div>

                <!-- Row 7: Contact Person -->
                <div class="form-row">
                  <div class="form-group">
                    <label for="ContactPerson">Contact Person</label>
                    <input type="text" class="bs-input-text" id="ContactPerson" name="ContactPerson">
                  </div>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle section" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Right Action Panel -->
      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" data-insurance-company-action="delete"><i class="bi bi-trash"></i> Delete</button>
          <button type="button" class="btn-action" data-insurance-company-action="save" disabled><i class="bi bi-save"></i> Save</button>
          <button type="button" class="btn-action" data-insurance-company-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Ensure base configuration is available before services -->
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>

  <!-- Core services used by StaticDataService -->
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/services/static-data/staticDataService.js"></script>

  <!-- Auth (optional but improves payload defaults) -->
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>

  <!-- Page script last -->
  <script src="../../assets/js/pages/static-data/insurance-company.js"></script>
</body>

</html>
