<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transaction Description · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <!-- <link rel="stylesheet" href="./static-data.css" /> -->
</head>

<body class="transaction-description copilot-theme">
  <div class="window">
    <div class="main-container d-flex">
      <!-- Left side: Form content -->
      <section class="form-content flex-grow-1" aria-label="Transaction Description Maintenance Content">
        <form id="transaction-description-form" autocomplete="off" novalidate>
          <div class="form-card">
            <div class="form-section" data-section="transaction-info">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-file-text"></i> Transaction Description</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Transaction Description" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="TrxDescriptionID">Transaction ID</label>
                    <div class="kairo-lookup-control d-flex align-items-stretch">
                      <input type="text" class="bs-input-text kairo-lookup-control__id flex-grow-1" id="TrxDescriptionID" name="TrxDescriptionID" data-always-enabled required />
                      <button class="btn-lookup kairo-lookup-control__btn" type="button" aria-label="Search" data-always-enabled id="btnLookupTrx">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="Description">Description</label>
                    <input type="text" class="bs-input-text" id="Description" name="Description" required />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="TransactionTypeID">Type</label>
                    <select class="bs-select" id="TransactionTypeID" name="TransactionTypeID">
                      <option value="1">Debit</option>
                      <option value="2">Credit</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="TrxCategoryID">Category</label>
                    <select class="bs-select" id="TrxCategoryID" name="TrxCategoryID">
                      <option value="">--Select--</option>
                      <option value="CHR">CHR - Charge</option>
                      <option value="COM">COM - Commission</option>
                      <option value="INC">INC - Income</option>
                      <option value="SER">SER - Service</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="IsChargeable">Chargeable</label>
                    <div class="d-flex align-items-center gap-2">
                      <input class="bs-checkbox" type="checkbox" id="IsChargeable" name="IsChargeable" />
                    </div>
                  </div>
                  <div class="col">
                    <!-- Empty column for spacing -->
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye"></i> Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="IsBlocked">Blocked</label>
                    <div class="d-flex align-items-center gap-2">
                      <input class="bs-checkbox" type="checkbox" id="IsBlocked" name="IsBlocked" data-never-editable />
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="IsSystemTrx">Is System</label>
                    <div class="d-flex align-items-center gap-2">
                      <input class="bs-checkbox" type="checkbox" id="IsSystemTrx" name="IsSystemTrx" data-never-editable />
                    </div>
                  </div>
                </div>

                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </section>

      <!-- Right side: Action panel -->
      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <div class="d-flex gap-1 mb-2">
            <button type="button" class="btn-action flex-grow-1" data-trx-nav="prev">
              <i class="bi bi-chevron-left"></i>
            </button>
            <button type="button" class="btn-action flex-grow-1" data-trx-nav="next">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
          <button type="button" class="btn-action" data-shell-mode="View">
            <i class="bi bi-eye me-1"></i> View
          </button>
          <button type="button" class="btn-action" data-shell-mode="Add">
            <i class="bi bi-plus-circle me-1"></i> Add
          </button>
          <button type="button" class="btn-action" data-shell-mode="Update">
            <i class="bi bi-pencil-square me-1"></i> Edit
          </button>
          <button type="button" class="btn-action" data-trx-action="delete">
            <i class="bi bi-trash me-1"></i> Delete
          </button>
          <button type="button" class="btn-action" data-trx-action="save" disabled>
            <i class="bi bi-check-lg me-1"></i> Save
          </button>
          <button type="button" class="btn-action btn-cancel" data-trx-action="cancel">
            <i class="bi bi-x-circle me-1"></i> Cancel
          </button>
        </div>
      </aside>
    </div>
    <div class="am-message-panel"></div>
  </div>

  <div class="modal fade" id="trxLookupModal" tabindex="-1" aria-labelledby="trxLookupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-search"></i>
            <h5 class="modal-title" id="trxLookupModalLabel">Find Transaction Description</h5>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <form id="trxLookupForm" class="container-fluid p-0">
            <div class="row g-3 align-items-center">
              <div class="col-12 col-lg-8">
                <div class="row g-2 align-items-center">
                  <div class="col-12 col-md-2 text-md-end">
                    <label class="form-label mb-0" for="trxSearchId">Transaction ID</label>
                  </div>
                  <div class="col-12 col-md-3">
                    <select class="form-select" id="trxSearchModeId">
                      <option value="Like" selected>Like</option>
                      <option value="Exact">Exact</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-7">
                    <input type="text" class="form-control" id="trxSearchId" />
                  </div>
                </div>
                <div class="row g-2 align-items-center mt-2">
                  <div class="col-12 col-md-2 text-md-end">
                    <label class="form-label mb-0" for="trxSearchName">Description</label>
                  </div>
                  <div class="col-12 col-md-3">
                    <select class="form-select" id="trxSearchModeName">
                      <option value="Like" selected>Like</option>
                      <option value="Exact">Exact</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-7">
                    <input type="text" class="form-control" id="trxSearchName" />
                  </div>
                </div>
              </div>
              <div class="col-12 col-lg-4 d-flex justify-content-lg-end gap-2">
                <button type="submit" class="btn btn-primary" id="trxSearchSubmit">
                  <i class="bi bi-search me-1"></i>Search
                </button>
                <button type="button" class="btn btn-outline-secondary" id="trxSearchRefresh">
                  <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                </button>
              </div>
            </div>
          </form>

          <div class="mt-3">
            <div class="fw-semibold mb-2 border-bottom pb-2">Search
              Results</div>
            <div class="position-relative">
              <div class="table-responsive">
                <table class="table table-sm table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th scope="col">ID</th>
                      <th scope="col">Description</th>
                      <th scope="col">Type</th>
                      <th scope="col" class="text-end">Action</th>
                    </tr>
                  </thead>
                  <tbody id="trxSearchResults"></tbody>
                </table>
              </div>
              <div id="trxSearchEmpty" class="text-center py-5 text-muted">No records found.</div>
              <div id="trxSearchLoading" class="d-none position-absolute top-50 start-50 translate-middle">
                <div class="spinner-border text-primary" role="status"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="trxSearchPrev" disabled>
              <i class="bi bi-chevron-left"></i> Previous
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="trxSearchNext" disabled>
              Next <i class="bi bi-chevron-right"></i>
            </button>
            <span id="trxSearchPageInfo" class="ms-2 text-muted small"></span>
          </div>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/transaction-description.js"></script>
</body>

</html>
