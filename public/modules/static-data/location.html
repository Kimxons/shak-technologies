<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Location · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="location copilot-theme">
  <div class="window">
    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <form id="location-form" autocomplete="off" novalidate>
          <div class="form-card">
            <!-- Location Information Section -->
            <div class="form-section" data-section="location-info">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-geo-alt"></i> Location Information</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Location Information" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <!-- Row 1: Location ID and Location Name -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="LocationID">Location ID</label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" id="LocationID" class="kairo-control__id" aria-label="Location ID" data-always-enabled>
                      <input type="text" id="LocationDesc" class="kairo-control__name" aria-label="Location Description" placeholder="Location Name" readonly>
                      <button type="button" class="btn-lookup kairo-control__lookup" data-target-input="LocationID" data-location-action="search" aria-label="Search Location"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="LocationName">Location Name</label>
                    <input type="text" class="bs-input-text" id="LocationName" name="LocationName" required>
                  </div>
                </div>

                <!-- Row 2: Building and Room/Office -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="Building">Building</label>
                    <textarea class="bs-textarea" id="Building" name="Building" rows="2"></textarea>
                  </div>
                  <div class="col">
                    <label for="RoomOffice">Room/Office</label>
                    <textarea class="bs-textarea" id="RoomOffice" name="RoomOffice" rows="2"></textarea>
                  </div>
                </div>

                <!-- Row 3: Store Checkbox -->
                <div class="form-row two-col">
                  <div class="col">
                    <label for="Store">Store</label>
                    <div class="d-flex align-items-center gap-2">
                      <input type="checkbox" class="bs-checkbox" id="Store" name="Store">
                      <span class="small text-muted">Mark as Store</span>
                    </div>
                  </div>
                  <div class="col">
                    <!-- Empty column for spacing -->
                  </div>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye"></i> Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Right Action Panel -->
      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" data-location-action="delete"><i class="bi bi-trash"></i> Delete</button>
          <button type="button" class="btn-action" data-location-action="save" disabled><i class="bi bi-save"></i> Save</button>
          <button type="button" class="btn-action" data-location-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/location.js"></script>
</body>

</html>
