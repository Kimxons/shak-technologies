<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGO Maintenance · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <!-- <link rel="stylesheet" href="./static-data.css" /> -->
</head>

<body class="device-maintenance ngo-maintenance copilot-theme">
  <div class="window">
    <div class="main-container">
      <section class="form-content" aria-label="NGO Maintenance Content">
        <form id="ngo-maintenance-form" autocomplete="off" novalidate>
          <div class="form-card">
            <div class="form-section" data-section="ngo-info">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-building"></i> NGO Information</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle NGO Information" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <!-- Validation/Success Message Banner -->
                <div class="validation-summary" role="status" aria-live="polite">
                  <i class="bi bi-check-circle validation-summary__icon"></i>
                  <span class="validation-summary__text"></span>
                  <button type="button" class="validation-summary__close" aria-label="Close notification">
                    <i class="bi bi-x"></i>
                  </button>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="NgoId">NGO ID</label>
                    <div class="kairo-user-control" data-kairo-user-control>
                      <input type="text" class="kairo-user-control__id" id="NgoId" name="NgoId" aria-label="NGO ID" data-always-enabled />
                      <!-- <input type="text" class="kairo-user-control__name" id="NgoIdName" name="NgoIdName" aria-label="NGO Name" placeholder="NGO Name" readonly style="background-color: #f8f9fa;" /> -->
                      <button type="button" class="btn-lookup kairo-user-control__lookup" aria-label="Search NGO" data-always-enabled data-nmo-action="search">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="NgoName">NGO Name</label>
                    <input type="text" class="bs-input-text" id="NgoName" name="NgoName" aria-label="NGO Name" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="EstablishedDate">Established Date</label>
                    <input type="text" class="bs-input-date" id="EstablishedDate" name="EstablishedDate" data-native-date aria-label="Established Date" />
                  </div>
                  <div class="col">
                    <label for="RegistrationNo">Registration No.</label>
                    <input type="text" class="bs-input-text" id="RegistrationNo" name="RegistrationNo" aria-label="Registration No" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="RegistrationDetail">Registration Detail</label>
                    <input type="text" class="bs-input-text" id="RegistrationDetail" name="RegistrationDetail" aria-label="Registration Detail" />
                  </div>
                  <div class="col">
                    <label for="AffiliatedDate">Affiliated Date</label>
                    <input type="text" class="bs-input-date" id="AffiliatedDate" name="AffiliatedDate" data-native-date aria-label="Affiliated Date" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="ContactPerson">Contact Person</label>
                    <input type="text" class="bs-input-text" id="ContactPerson" name="ContactPerson" aria-label="Contact Person" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="City">City</label>
                    <select class="bs-select" id="City" name="City" aria-label="City">
                      <option value="" selected>--Select--</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="Country">Country</label>
                    <select class="bs-select" id="Country" name="Country" aria-label="Country">
                      <option value="" selected>--Select--</option>
                    </select>
                  </div>
                  <div class="col">
                    <label for="ZipCode">Zip Code</label>
                    <input type="text" class="bs-input-text" id="ZipCode" name="ZipCode" aria-label="Zip Code" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="Address1">Address 1</label>
                    <input type="text" class="bs-input-text" id="Address1" name="Address1" aria-label="Address 1" />
                  </div>
                  <div class="col">
                    <label for="Address2">Address 2</label>
                    <input type="text" class="bs-input-text" id="Address2" name="Address2" aria-label="Address 2" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="EmailId">Email ID</label>
                    <input type="text" class="bs-input-text" id="EmailId" name="EmailId" aria-label="Email ID" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="PhoneHome">Phone(Home)</label>
                    <input type="text" class="bs-input-text" id="PhoneHome" name="PhoneHome" aria-label="Phone Home" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="PhoneWork">Phone(Work)</label>
                    <input type="text" class="bs-input-text" id="PhoneWork" name="PhoneWork" aria-label="Phone Work" />
                  </div>
                  <div class="col">
                    <label for="Mobile">Mobile</label>
                    <input type="text" class="bs-input-text" id="Mobile" name="Mobile" aria-label="Mobile" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="FaxNo">Fax No</label>
                    <input type="text" class="bs-input-text" id="FaxNo" name="FaxNo" aria-label="Fax No" />
                  </div>
                  <div class="col">
                    <!-- Empty column for spacing -->
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="ByLawDetails">By Law Details</label>
                    <textarea class="bs-textarea" id="ByLawDetails" name="ByLawDetails" rows="2" aria-label="By Law Details"></textarea>
                  </div>
                  <div class="col">
                    <!-- Empty column for spacing -->
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye"></i> Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </section>

      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-shell-mode="View">
            <i class="bi bi-eye me-1"></i> View
          </button>
          <button type="button" class="btn-action" data-shell-mode="Add">
            <i class="bi bi-plus-circle me-1"></i> Add
          </button>
          <button type="button" class="btn-action" data-shell-mode="Update">
            <i class="bi bi-pencil-square me-1"></i> Edit
          </button>
          <button type="button" class="btn-action" data-nmo-action="delete">
            <i class="bi bi-trash me-1"></i> Delete
          </button>
          <button type="button" class="btn-action" data-nmo-action="save" disabled>
            <i class="bi bi-check-lg me-1"></i> Save
          </button>
          <button type="button" class="btn-action btn-cancel" data-nmo-action="cancel">
            <i class="bi bi-x-circle me-1"></i> Cancel
          </button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <!-- <script src="../../assets/js/ui/date-picker-trigger.js"></script> -->
  <script src="../../assets/js/pages/static-data/ngo-maintenance.js"></script>
</body>
</html>
