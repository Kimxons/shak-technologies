<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Classification - Static Data</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="loan-classification.css">
</head>
<body data-page="loan-classification">
  <div class="window">
    <!-- Main Container -->
    <div class="main-container">
      <!-- Left Sidebar -->
      <div class="sidebar collapsed" id="main-sidebar">
        <!-- SUBMODULES Header -->
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-grid-3x3-gap-fill"></i><span>SUBMODULES</span></span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <!-- Scrollable Content -->
        <div class="sidebar-content">
          <!-- Data Entry Section -->
          <div class="nav-section nav-section--card" data-nav-section data-section-name="Data Entry">
            <div class="nav-header nav-header--card" data-tooltip="Data Entry">
              <div class="nav-header__content">
                <i class="bi bi-folder-fill nav-header__icon"></i>
                <span class="nav-label nav-label--card">Data Entry</span>
              </div>
              <div class="nav-header__badge">
                <span class="nav-badge">1</span>
                <button type="button" class="nav-arrow nav-arrow--card" aria-label="Toggle Data Entry" aria-expanded="false">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items nav-items--card" id="nav-dataentry">
              <div class="sidebar-item sidebar-item--enhanced active" data-section="loan-class-detail" data-tooltip="Loan Class Detail" data-modal-target="detailModal">
                <div class="sidebar-item__content">
                  <i class="bi bi-layers-fill sidebar-item__icon"></i>
                  <div class="sidebar-item__text">
                    <div class="sidebar-item__title">Loan Class Detail</div>
                    <div class="sidebar-item__description">View and manage classification details</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card" data-main-form>
          <!-- Classification Details Section -->
          <div class="form-section" data-section="classification-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-layers"></i>Classification Details</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Classification Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <form id="classification-form">
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="classId">Class ID</label>
                    <div class="input-with-search">
                      <input type="text" id="classId" class="bs-input-text" aria-label="Class ID" placeholder="Enter Class ID">
                      <button type="button" id="btnClassIdLookup" class="btn-lookup" aria-label="Search Class">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="className">Class Name</label>
                    <input type="text" id="className" class="bs-input-text" placeholder="Enter Class Name">
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- Behind the Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section">
                <div class="audit-block">
                  <div class="audit-item">
                    <label>Created By</label>
                    <span class="audit-value" id="createdBy" data-field="createdBy">-</span>
                  </div>
                  <div class="audit-item">
                    <label>Created On</label>
                    <span class="audit-value" id="createdOn" data-field="createdOn">-</span>
                  </div>
                </div>
                <div class="audit-block">
                  <div class="audit-item">
                    <label>Modified By</label>
                    <span class="audit-value" id="modifiedBy" data-field="modifiedBy">-</span>
                  </div>
                  <div class="audit-item">
                    <label>Modified On</label>
                    <span class="audit-value" id="modifiedOn" data-field="modifiedOn">-</span>
                  </div>
                </div>
                <div class="audit-block">
                  <div class="audit-item">
                    <label>Supervised By</label>
                    <span class="audit-value" id="supervisedBy" data-field="supervisedBy">-</span>
                  </div>
                  <div class="audit-item">
                    <label>Supervised On</label>
                    <span class="audit-value" id="supervisedOn" data-field="supervisedOn">-</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Action Panel -->
      <div class="action-panel">
        <!-- Navigation Arrows -->
        <div class="nav-group">
          <button class="btn-nav green" aria-label="Previous Record" id="btnPrev"><i class="bi bi-chevron-left"></i></button>
          <span id="recordInfo">0 / 0</span>
          <button class="btn-nav green" aria-label="Next Record" id="btnNext"><i class="bi bi-chevron-right"></i></button>
        </div>

        <div class="action-buttons">
          <button class="btn-action" type="button" data-action="view"><i class="bi bi-eye"></i><span>View</span></button>
          <button class="btn-action" type="button" data-action="add"><i class="bi bi-plus-circle"></i><span>Add</span></button>
          <button class="btn-action" type="button" data-action="edit"><i class="bi bi-pencil"></i><span>Edit</span></button>
          <button class="btn-action" type="button" data-action="save"><i class="bi bi-check-circle"></i><span>Save</span></button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel"><i class="bi bi-x-circle"></i><span>Cancel</span></button>
          <button class="btn-action btn-delete" type="button" data-action="delete"><i class="bi bi-trash"></i><span>Delete</span></button>
        </div>
      </div>
    </div>

    <!-- Message Panel -->
    <div class="am-message-panel" id="messagePanel" hidden>
      <span class="am-message-panel__icon"><i class="bi bi-info-circle"></i></span>
      <span class="am-message-panel__text" id="messagePanelText"></span>
      <button type="button" class="am-message-panel__close" id="messagePanelClose" aria-label="Close message">
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>

  <!-- Class ID Lookup Modal -->
  <div class="lookup-modal" id="classIdLookupModal">
    <div class="lookup-modal__content">
      <div class="lookup-modal__header">
        <span class="lookup-modal__title">
          <i class="bi bi-search"></i>
          Loan Class
        </span>
        <button class="lookup-modal__close" id="btnCloseLookup" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="lookup-modal__body">
        <!-- Search Filters - Legacy Style -->
        <div class="lookup-filters">
          <div class="lookup-filter-row">
            <label>Class ID</label>
            <select id="classIdOperator" class="lookup-operator">
              <option value="Like">Like</option>
              <option value="Equals">Equals</option>
              <option value="StartsWith">Starts With</option>
              <option value="EndsWith">Ends With</option>
            </select>
            <input type="text" id="searchClassId" class="lookup-filter-input" placeholder="">
          </div>
          <div class="lookup-filter-row">
            <label>Class Name</label>
            <select id="classNameOperator" class="lookup-operator">
              <option value="Like">Like</option>
              <option value="Equals">Equals</option>
              <option value="StartsWith">Starts With</option>
              <option value="EndsWith">Ends With</option>
            </select>
            <input type="text" id="searchClassName" class="lookup-filter-input" placeholder="">
          </div>
          <div class="lookup-filter-actions">
            <button type="button" class="lookup-search-btn" id="btnSearchLookup">
              <i class="bi bi-search"></i> Search
            </button>
          </div>
        </div>
        
        <!-- Results Table -->
        <div class="lookup-results-section">
          <div class="lookup-results-header">Search Results</div>
          <div class="lookup-table-container">
            <table class="lookup-modal__table">
              <thead>
                <tr>
                  <th style="width: 40px;">#</th>
                  <th>ClassID</th>
                  <th>ClassName</th>
                </tr>
              </thead>
              <tbody id="lookupTableBody">
                <!-- Populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="lookup-modal__footer">
        <div class="lookup-nav-buttons">
          <button class="lookup-nav-btn" id="btnLookupPrev" aria-label="Previous page">
            <i class="bi bi-chevron-left"></i>
          </button>
          <button class="lookup-modal__btn lookup-modal__btn--primary" id="btnSelectLookup">
            OK
          </button>
          <button class="lookup-nav-btn" id="btnLookupNext" aria-label="Next page">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loan Class Detail Sub-Modal -->
  <div class="modal fade submodule-modal" id="detailModal" tabindex="-1" data-bs-backdrop="false" aria-labelledby="detailModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <iframe id="detailModalFrame" src="loan-classification-detail-modal.html" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Note: form-init.js not included - loan-classification.embedded.js handles all toggles -->
  <!-- Core Services -->
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../assets/js/pages/static-data/loan-classification.embedded.js"></script>
</body>
</html>
