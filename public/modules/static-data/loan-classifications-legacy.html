<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Classification · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <style>
    html, body {
        height: 100%;
        overflow: hidden;
    }
    .cm-workspace {
        height: 100%;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
    }
    .cm-shell-form {
        height: 100%;
    }

    /* Main Container for the central part */
    .main-panel {
        display: flex;
        flex-direction: column;
        border: 1px solid #99bce8;
        background-color: #e6f2ff; /* Light blue background from screenshot */
        height: 100%;
        padding: 4px;
    }

    /* Header Bar Style (Blue gradient) */
    .panel-header {
        background: linear-gradient(to bottom, #2989d8 0%, #1e5799 100%);
        color: white;
        padding: 5px 10px;
        font-weight: bold;
        font-size: 0.9rem;
        border: 1px solid #104080;
        min-height: 28px; /* Ensure visible bar height */
    }

    /* Behind The Scene Header */
    .bts-header {
        background: linear-gradient(to bottom, #2989d8 0%, #1e5799 100%);
        color: white;
        padding: 2px 10px;
        font-weight: bold;
        font-size: 0.85rem;
        border: 1px solid #104080;
        margin-bottom: 5px;
    }

    .form-area {
        flex-grow: 1; /* Take up available space */
        padding: 30px 15px; /* Increased top padding matching "space between" */
    }

    .bts-area {
        padding: 5px;
        border-top: 1px solid white;
    }

    /* Labels */
    .field-label {
        color: blue;
        font-weight: bold;
        font-size: 0.9rem;
        text-align: right;
    }

    /* Inputs */
    .form-control-sm {
        border-radius: 0;
        border: 1px solid #7f9db9;
    }

    /* Search Icon */
    .search-icon {
        width: 20px;
        height: 20px;
        margin-left: 5px;
        cursor: pointer;
    }

    /* Right Sidebar Buttons */
    .right-sidebar {
        display: flex;
        flex-direction: column;
        padding-left: 5px;
        height: 100%;
    }

    .action-btn {
        background: linear-gradient(to bottom, #f0f0f0 0%, #d0d0d0 100%);
        border: 1px solid #999;
        margin-bottom: 4px;
        width: 100%;
        text-align: center;
        padding: 4px 0;
        font-size: 0.85rem;
        font-weight: 600;
        color: black;
        cursor: pointer;
    }

    .action-btn:hover {
        background: #e0e0e0;
    }

    .action-btn.underline {
        text-decoration: underline;
    }

    .nav-arrow {
        font-size: 2rem;
        color: #5cb85c;
        cursor: pointer;
        display: inline-block;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    .nav-arrow:hover {
        color: #4cae4c;
    }

    .bts-label {
        font-size: 0.8rem;
        text-align: right;
        padding-right: 5px;
    }
    .bts-input {
        font-size: 0.8rem;
        background-color: white;
    }

    /* Data Entry Left Nav override */
    .cm-legacy-nav {
        border-right: none;
    }
    .cm-legacy-nav__item {
        border-bottom: 1px solid #ddd;
    }
    .cm-legacy-nav__item.active {
        background-color: #dbeeff;
        font-weight: bold;
    }

    /* Modal Specific Styles */
    .modal-header-custom {
        background: linear-gradient(to bottom, #b4d5f5 0%, #90b8e6 100%);
        border-bottom: 1px solid #7a9cc5;
        padding: 4px 10px;
    }
    .modal-title-custom {
        font-size: 0.9rem;
        font-weight: bold;
        color: #003366;
    }
    .modal-form-box {
        border: 1px solid #2989d8;
        padding: 10px;
        margin-bottom: 15px;
        background-color: #f0f8ff;
    }
    .modal-form-header-line {
        height: 15px;
        background-color: #007bff;
        margin: -10px -10px 10px -10px;
    }
    .detail-label {
        color: blue;
        font-weight: bold;
        font-size: 0.85rem;
        text-align: right;
    }
    .detail-input {
        border: 1px solid #7f9db9;
        font-size: 0.85rem;
        padding: 2px 5px;
        border-radius: 0;
    }
    .action-bar {
        text-align: center;
        margin-bottom: 15px;
    }
    .action-bar-btn {
        background: #dcdcdc;
        border: 1px solid #888;
        color: #333;
        font-weight: bold;
        font-size: 0.85rem;
        padding: 4px 15px;
        margin: 0 5px;
    }
    .action-bar-btn:hover {
        background: #c0c0c0;
    }
    .detail-table-container {
        border: 1px solid #a0a0a0;
        background: white;
        height: 200px;
        overflow-y: auto;
    }
    .detail-table th {
        background-color: #e6e6fa;
        color: #333;
        font-size: 0.8rem;
        font-weight: normal;
        border: 1px solid #d0d0d0;
        text-align: center;
        padding: 4px;
    }
    .detail-table td {
        font-size: 0.8rem;
        padding: 4px;
        border: 1px solid #eee;
    }
  </style>
</head>

<body class="client-maintenance copilot-theme" data-page="loan-classifications">
  <div class="cm-workspace">
    <form id="loan-classification-form" class="cm-shell-form" autocomplete="off">
      <!-- 1. Left Sidebar -->
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle" style="background: #e0e0e0; border: 1px solid #ccc; width: 100%; margin-bottom: 5px; text-align: left; padding: 5px;">
            DataEntry
            <i class="bi bi-caret-up-fill float-end"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" id="btnLoanClassDetail" class="cm-legacy-nav__item active" style="width: 100%; text-align: left; padding: 5px 10px; border: 1px solid #a0cfec; background: #b0d8f5;">
              Loan Class Detail
            </button>
          </div>
        </div>
      </aside>

      <!-- 2. Middle Content -->
      <div class="main-panel">

          <!-- Top Blue Bar -->
          <div class="panel-header">
              <!-- Note: In the screenshot this is just a blue bar, maybe text is separate?
                   Actually looking closely, there is no text in the blue bar in the screenshot for the top part.
                   Wait, the screenshot says "Loan Classification" In the Window Title.
                   Inside the form, there is a blue bar, then fields.
              -->
          </div>

          <!-- Form Fields Area -->
          <div class="form-area">
               <div class="row mb-2">
                   <label class="col-sm-3 col-form-label field-label">Class ID</label>
                   <div class="col-sm-4">
                       <div class="d-flex align-items-center">
                          <input type="text" class="form-control form-control-sm" value="LLCL">
                          <img src="../../assets/images/silvicon.png" class="search-icon" alt="Search" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<i class=\'bi bi-search text-secondary ms-2\'></i>')">
                       </div>
                   </div>
               </div>
               <div class="row mb-2">
                   <label class="col-sm-3 col-form-label field-label">Class Name</label>
                   <div class="col-sm-9">
                       <input type="text" class="form-control form-control-sm" value="Loan Loss Classification">
                   </div>
               </div>
          </div>

          <!-- Bottom Section: Behind The Scene -->
          <div class="bts-header">Behind The Scene</div>
          <div class="bts-area">
               <div class="row g-1">
                   <div class="col-4">
                       <div class="row g-0 align-items-center mb-1">
                           <div class="col-4 bts-label">Created By</div>
                           <div class="col-8"><input type="text" class="form-control form-control-sm bts-input" value="TEMESGEN" readonly></div>
                       </div>
                       <div class="row g-0 align-items-center">
                           <div class="col-4 bts-label">Created On</div>
                           <div class="col-8"><input type="text" class="form-control form-control-sm bts-input" value="24/Aug/2015" readonly></div>
                       </div>
                   </div>
                   <div class="col-4">
                       <div class="row g-0 align-items-center mb-1">
                           <div class="col-4 bts-label">Modified By</div>
                           <div class="col-8"><input type="text" class="form-control form-control-sm bts-input" readonly></div>
                       </div>
                       <div class="row g-0 align-items-center">
                           <div class="col-4 bts-label">Modified On</div>
                           <div class="col-8"><input type="text" class="form-control form-control-sm bts-input" readonly></div>
                       </div>
                   </div>
                   <div class="col-4">
                       <div class="row g-0 align-items-center mb-1">
                           <div class="col-4 bts-label">Supervised By</div>
                           <div class="col-8"><input type="text" class="form-control form-control-sm bts-input" readonly></div>
                       </div>
                       <div class="row g-0 align-items-center">
                           <div class="col-4 bts-label">Supervised On</div>
                           <div class="col-8"><input type="text" class="form-control form-control-sm bts-input" readonly></div>
                       </div>
                   </div>
               </div>
          </div>
      </div>

      <!-- 3. Right Sidebar -->
      <aside class="right-sidebar">
           <!-- Arrows -->
           <div class="d-flex justify-content-between px-2 mb-5 mt-4">
               <i class="bi bi-arrow-left-square-fill nav-arrow"></i>
               <i class="bi bi-arrow-right-square-fill nav-arrow"></i>
           </div>

           <!-- Spacer to push buttons down to match screenshot approximate location -->
           <div style="flex-grow: 0.8;"></div>

           <!-- Action Buttons -->
           <div class="d-flex flex-column">
               <button type="button" class="action-btn">View</button>
               <button type="button" class="action-btn">Add</button>
               <button type="button" class="action-btn underline">Edit</button>
               <button type="button" class="action-btn underline">Delete</button>
               <button type="button" class="action-btn">Save</button>
               <button type="button" class="action-btn">Cancel</button>
           </div>

           <div style="flex-grow: 0.1;"></div>
      </aside>

    </form>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="detailModal" tabindex="-1" data-bs-backdrop="false" style="background: rgba(0,0,0,0.1);">
      <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content" style="background-color: #e6f2ff; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 1px solid #7a9cc5;">
              <div class="modal-header-custom d-flex justify-content-between align-items-center">
                  <div class="d-flex align-items-center">
                      <i class="bi bi-card-list me-2"></i>
                      <span class="modal-title-custom">Loan Class Detail</span>
                  </div>
                  <div>
                      <button type="button" class="btn btn-sm p-0" data-bs-dismiss="modal" style="color: #444;"><i class="bi bi-x-square"></i></button>
                  </div>
              </div>
              <div class="modal-body p-2 d-flex">
                  <!-- Main Content Area -->
                  <div class="flex-grow-1 d-flex flex-column pe-2">
                       <!-- Form Box -->
                       <div class="modal-form-box">
                           <div class="modal-form-header-line"></div>

                           <div class="row mb-2">
                               <label for="loanType" class="col-sm-3 detail-label">Loan Type</label>
                               <div class="col-sm-6">
                                   <select id="loanType" class="form-select form-select-sm detail-input">
                                       <option selected>Normal</option>
                                   </select>
                               </div>
                           </div>
                           <div class="row mb-2">
                               <label for="subClassId" class="col-sm-3 detail-label">Sub Class ID</label>
                               <div class="col-sm-6">
                                   <select id="subClassId" class="form-select form-select-sm detail-input">
                                       <option selected>--Select--</option>
                                   </select>
                               </div>
                           </div>

                           <div class="row mb-2">
                               <label class="col-sm-3 detail-label">From Aging Days</label>
                               <div class="col-sm-2">
                                   <input type="text" class="form-control form-control-sm detail-input">
                               </div>
                               <label class="col-sm-3 detail-label">To Aging Days</label>
                               <div class="col-sm-2">
                                   <input type="text" class="form-control form-control-sm detail-input">
                               </div>
                           </div>

                           <div class="row mb-2">
                               <label class="col-sm-3 detail-label">Is Specific Provision</label>
                               <div class="col-sm-2">
                                   <input type="checkbox">
                               </div>
                               <label class="col-sm-3 detail-label">Under NPA</label>
                               <div class="col-sm-2">
                                   <input type="checkbox">
                               </div>
                           </div>

                           <div class="row mb-2">
                               <label class="col-sm-3 detail-label">Probability Of Default</label>
                               <div class="col-sm-2">
                                   <input type="text" class="form-control form-control-sm detail-input">
                               </div>
                               <label class="col-sm-3 detail-label">Loss Given Default</label>
                               <div class="col-sm-2">
                                   <input type="text" class="form-control form-control-sm detail-input">
                               </div>
                           </div>

                           <div class="row mb-2">
                               <label class="col-sm-3 detail-label">Provision Rate</label>
                               <div class="col-sm-2 d-flex align-items-center">
                                   <input type="text" class="form-control form-control-sm detail-input me-1"> %
                               </div>
                               <label class="col-sm-3 detail-label">Penalty</label>
                               <div class="col-sm-2 d-flex align-items-center">
                                   <input type="text" class="form-control form-control-sm detail-input me-1"> %
                               </div>
                           </div>

                       </div>

                       <!-- Action Bar -->
                       <div class="action-bar">
                           <button type="button" class="action-bar-btn"><span style="text-decoration: underline;">N</span>ew</button>
                           <button type="button" class="action-bar-btn"><span style="text-decoration: underline;">A</span>lter</button>
                           <button type="button" class="action-bar-btn"><span style="text-decoration: underline;">R</span>emove</button>
                           <button type="button" class="action-bar-btn"><span style="text-decoration: underline;">U</span>pdate</button>
                           <button type="button" class="action-bar-btn"><span style="text-decoration: underline;">C</span>lear</button>
                       </div>

                       <!-- Table -->
                       <div class="detail-table-container">
                           <table class="table table-bordered table-sm mb-0 detail-table">
                               <thead>
                                   <tr>
                                       <th style="min-width: 60px;">Sub Class</th>
                                       <th>From Aging Days</th>
                                       <th>To Aging Days</th>
                                       <th>Is Specification Provision</th>
                                       <th>Under NPA</th>
                                       <th>Provision Rate</th>
                                       <th>Probability Of Default</th>
                                       <th>Loss Given Default</th>
                                       <th>Penalty</th>
                                   </tr>
                               </thead>
                               <tbody>
                                   <tr>
                                       <td colspan="9" class="p-2">No records to display.</td>
                                   </tr>
                               </tbody>
                           </table>
                       </div>
                  </div>

                  <!-- Right Sidebar Buttons -->
                  <div class="d-flex flex-column gap-2 pt-5" style="width: 120px;">
                      <div style="flex-grow: 1;"></div>
                      <button type="button" class="action-btn"><span style="text-decoration: underline; font-weight: bold;">V</span>iew</button>
                      <button type="button" class="action-btn"><span style="text-decoration: underline;">A</span>dd</button>
                      <button type="button" class="action-btn"><span style="text-decoration: underline;">E</span>dit</button>
                      <button type="button" class="action-btn"><span style="text-decoration: underline;">D</span>elete</button>
                      <button type="button" class="action-btn"><span style="text-decoration: underline;">S</span>ave</button>
                      <button type="button" class="action-btn"><span style="text-decoration: underline;">C</span>ancel</button>

                      <div class="mb-3"></div>
                      <button type="button" class="action-btn" data-bs-dismiss="modal"><span style="text-decoration: underline; font-weight: bold;">B</span>ack</button>
                  </div>
              </div>

              <!-- Bottom Status Bar -->
              <div style="background: #cfdbeb; border-top: 1px solid #999; padding: 2px 5px; font-size: 0.75rem;">
                  BR.Net Web Banking
              </div>
          </div>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/pages/static-data/loan-classifications.embedded.js"></script>
</body>
</html>
