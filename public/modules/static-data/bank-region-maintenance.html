<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Region Maintenance - Static Data</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/maincss.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <!-- <link rel="stylesheet" href="bank-region-maintenance.css"> -->
</head>
<body data-page="bank-region-maintenance">
  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <div class="window">
    <!-- Main Container -->
    <div class="main-container main-container--no-sidebar">
      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card" data-main-form>
          <!-- Region Search Section -->
          <div class="form-section" data-section="region-search">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-map"></i>Region Selection</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Region Selection" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <!-- Validation/Success Message Banner -->
              <div class="validation-summary" role="status" aria-live="polite">
                <i class="bi bi-check-circle validation-summary__icon"></i>
                <span class="validation-summary__text"></span>
                <button type="button" class="validation-summary__close" aria-label="Close notification">
                  <i class="bi bi-x"></i>
                </button>
              </div>

              <form id="region-form">
                <div class="form-row">
                  <div class="col region-select-col">
                    <label class="label-blue" for="Region">Region</label>
                    <select id="Region" name="Region" class="bs-select">
                      <option value="">Select Region</option>
                    </select>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- Branches Section -->
          <div class="form-section" data-section="branches">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-building"></i>Branches</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Branches" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="table-responsive">
                <table class="table table-sm table-bordered table-hover">
                  <thead class="table-light">
                    <tr>
                      <th><input type="checkbox" id="selectAllBranches" class="form-check-input" aria-label="Select All"></th>
                      <th>Branch ID</th>
                      <th>Branch Name</th>
                    </tr>
                  </thead>
                  <tbody id="branches-tbody">
                    <tr>
                      <td colspan="3" class="text-center text-muted">No records to display. Please select a region.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Behind the Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section">
                <div class="audit-block">
                  <div class="audit-item">
                    <label>Created By</label>
                    <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                  </div>
                  <div class="audit-item">
                    <label>Created On</label>
                    <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                  </div>
                </div>
                <div class="audit-block">
                  <div class="audit-item">
                    <label>Supervised By</label>
                    <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                  </div>
                  <div class="audit-item">
                    <label>Supervised On</label>
                    <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-action="view"><i class="bi bi-eye"></i><span>View</span></button>
          <button class="btn-action" type="button" data-action="edit" disabled><i class="bi bi-pencil"></i><span>Edit</span></button>
          <button class="btn-action btn-action--success" type="button" data-action="save" disabled><i class="bi bi-check-circle"></i><span>Save</span></button>
          <button class="btn-action" type="button" data-action="cancel" disabled><i class="bi bi-x-circle"></i><span>Cancel</span></button>
        </div>
      </div>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/common/form-init.js"></script>
  <!-- Core Services -->
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../assets/js/services/branchesService.js"></script>
  <script src="../../assets/js/pages/static-data/bank-region-maintenance.embedded.js"></script>
</body>
</html>
