<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bin Maintenance · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="bin-maintenance" data-page="static-data-bin-maintenance">
  <div class="kairo-toast-container" data-kairo-toast-container aria-live="polite" aria-relevant="additions"></div>

  <div class="window">
    <div class="main-container">
      <div class="form-content">
        <div class="form-card" data-main-form>
          <form id="bin-maintenance-form" autocomplete="off" novalidate>
            <div class="alert alert-danger d-flex align-items-center justify-content-between py-2 px-3 mb-3 d-none" role="alert" data-bin-maintenance-alert hidden>
              <div class="d-flex align-items-center gap-2 small">
                <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                <span data-bin-maintenance-alert-text></span>
              </div>
              <button type="button" class="btn-close" aria-label="Close" data-bin-maintenance-alert-close></button>
            </div>

            <div class="form-section" data-section="bin-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-card-list" aria-hidden="true"></i>Bin Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Bin Details" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col" style="flex: 0 0 50%; max-width: 50%;">
                    <label class="label-blue bs-label-mand" for="Bin">Bin</label>
                    <div class="d-flex gap-0 w-100">
                      <input type="text" class="bs-input-text form-control rounded-end-0" id="Bin" name="Bin" data-always-enabled />
                      <button type="button" class="btn-lookup rounded-start-0" aria-label="Search bin" data-bm-lookup="bin" data-always-enabled>
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col"></div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="gl-accounts">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-journal-text" aria-hidden="true"></i>GL Accounts</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle GL Accounts" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="PayableGlId">Payable GL ID</label>
                    <div class="d-flex gap-0 w-100">
                      <input type="text" class="bs-input-text flex-fill rounded-end-0" id="PayableGlId" name="PayableGlId" />
                      <input type="text" class="bs-input-text flex-fill rounded-0" id="PayableGlName" name="PayableGlName" readonly aria-label="Payable GL Name" />
                      <button type="button" class="btn-lookup rounded-start-0" data-bm-action="search-payable-gl" data-always-enabled aria-label="Search Payable GL">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ReceivableGlId">Receivable GL ID</label>
                    <div class="d-flex gap-0 w-100">
                      <input type="text" class="bs-input-text flex-fill rounded-end-0" id="ReceivableGlId" name="ReceivableGlId" />
                      <input type="text" class="bs-input-text flex-fill rounded-0" id="ReceivableGlName" name="ReceivableGlName" readonly aria-label="Receivable GL Name" />
                      <button type="button" class="btn-lookup rounded-start-0" data-bm-action="search-receivable-gl" data-always-enabled aria-label="Search Receivable GL">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye" aria-hidden="true"></i>BEHIND THE SCENE</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" data-bm-action="save" disabled><i class="bi bi-check"></i> Save</button>
          <button type="button" class="btn-action" data-bm-action="cancel"><i class="bi bi-x"></i> Cancel</button>
        </div>
      </aside>
    </div>
    <div class="am-message-panel"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/services/static-data/staticDataService.js"></script>
  <script src="../../assets/js/services/glAccountSearchService.js"></script>
  <script src="../../assets/js/pages/static-data/bin-maintenance.js"></script>
</body>

</html>
