<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Analysis · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="loan-analysis copilot-theme" data-page="loan-analysis">
  <div class="window">
    <form id="loan-analysis-form" autocomplete="off" novalidate>
      <div class="main-container">
        <!-- Sidebar purposefully omitted -->

        <section class="form-content" aria-label="Loan Analysis Content">
          <div class="form-card">
            <!-- Loan Analysis Section -->
            <div class="form-section" data-section="loan-analysis">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-diagram-3"></i> Loan Analysis</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Loan Analysis" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="LoanAnalysisId">Loan Analysis ID</label>
                    <div class="kairo-user-control" data-kairo-user-control>
                      <input type="text" id="LoanAnalysisId" name="LoanAnalysisId" class="kairo-user-control__id" aria-label="Loan Analysis ID" data-always-enabled />
                      <button type="button" id="btnLoanAnalysisLookup" class="btn-lookup kairo-user-control__lookup" aria-label="Search Loan Analysis" data-target-input="LoanAnalysisId" data-la-action="search" data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="NoOfSlabs">No Of Slabs</label>
                    <input type="text" class="bs-input-text" id="NoOfSlabs" name="NoOfSlabs" />
                  </div>
                </div>


                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="Description">Description</label>
                    <input type="text" class="bs-input-text" id="Description" name="Description" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="AnalysisTypeId">Analysis Type</label>
                    <select class="bs-select" id="AnalysisTypeId" name="AnalysisTypeId">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- Analysis Details Section -->
            <div class="form-section" data-section="analysis-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-table"></i> Analysis Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Analysis Details" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row">
                  <label class="label-blue" for="DetailDescription">Description</label>
                  <input type="text" class="bs-input-text" id="DetailDescription" name="DetailDescription" />
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="FromValue">From Value</label>
                    <input type="text" class="bs-input-text" id="FromValue" name="FromValue" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ToValue">To Value</label>
                    <input type="text" class="bs-input-text" id="ToValue" name="ToValue" />
                  </div>
                </div>

                <div class="d-flex gap-2 mb-3">
                  <button type="button" class="btn-action" data-la-grid-action="new" disabled>
                    <i class="bi bi-plus me-1"></i>New
                  </button>
                  <button type="button" class="btn-action" data-la-grid-action="alter" disabled>
                    <i class="bi bi-pencil me-1"></i>Alter
                  </button>
                  <button type="button" class="btn-action" data-la-grid-action="remove" disabled>
                    <i class="bi bi-trash me-1"></i>Remove
                  </button>
                  <button type="button" class="btn-action" data-la-grid-action="update" disabled>
                    <i class="bi bi-arrow-clockwise me-1"></i>Update
                  </button>
                  <button type="button" class="btn-action" data-la-grid-action="clear" disabled>
                    <i class="bi bi-x me-1"></i>Clear
                  </button>
                </div>

                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0" id="slabsTable">
                    <thead class="table-light">
                      <tr>
                        <th scope="col">Description</th>
                        <th scope="col">Analysis From</th>
                        <th scope="col">Analysis To</th>
                      </tr>
                    </thead>
                    <tbody id="slabsTableBody">
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section - Static Display -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye"></i> Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy" data-la-audit></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn" data-la-audit></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy" data-la-audit></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn" data-la-audit></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy" data-la-audit></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn" data-la-audit></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="action-panel" aria-label="Actions">
          <div class="action-buttons">
            <button type="button" class="btn-action btn-view" data-shell-mode="View"><i class="bi bi-eye me-1"></i>View</button>
            <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus me-1"></i>Add</button>
            <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil me-1"></i>Edit</button>
            <button type="button" class="btn-action" data-la-action="delete" disabled><i class="bi bi-trash me-1"></i>Delete</button>
            <button type="button" class="btn-action" data-la-action="save" disabled><i class="bi bi-check me-1"></i>Save</button>
            <button type="button" class="btn-action" data-la-action="cancel"><i class="bi bi-x me-1"></i>Cancel</button>
          </div>
        </aside>
      </div>
    </form>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <!-- Loan Analysis Search Modal -->
    <div class="modal fade" id="loanAnalysisSearchModal" tabindex="-1" aria-labelledby="loanAnalysisSearchModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="loanAnalysisSearchModalLabel">
              <i class="bi bi-search me-2"></i>Loan Analysis ID
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- Search Filters -->
            <div class="search-filters mb-3">
              <div class="row g-2 align-items-center mb-2">
                <div class="col-md-3">
                  <label class="form-label mb-0">Loan Analysis ID</label>
                </div>
                <div class="col-md-3">
                  <select class="form-select form-select-sm" id="searchLoanAnalysisIdMode">
                    <option value="Like" selected>Like</option>
                    <option value="Equal">Equal</option>
                    <option value="StartsWith">Starts With</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <input type="text" class="form-control form-control-sm" id="searchLoanAnalysisId" placeholder="">
                </div>
              </div>
              <div class="row g-2 align-items-center mb-2">
                <div class="col-md-3">
                  <label class="form-label mb-0">Description</label>
                </div>
                <div class="col-md-3">
                  <select class="form-select form-select-sm" id="searchDescriptionMode">
                    <option value="Like" selected>Like</option>
                    <option value="Equal">Equal</option>
                    <option value="StartsWith">Starts With</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <input type="text" class="form-control form-control-sm" id="searchDescription" placeholder="">
                </div>
              </div>
              <div class="row g-2 align-items-center mb-2">
                <div class="col-md-3">
                  <label class="form-label mb-0">Analysis Type</label>
                </div>
                <div class="col-md-3">
                  <!-- Mode not needed for dropdown, use direct match -->
                </div>
                <div class="col-md-6">
                  <select class="form-select form-select-sm" id="searchAnalysisTypeId">
                    <option value="">--All--</option>
                  </select>
                </div>
              </div>
              <div class="text-center mt-3">
                <button type="button" class="btn btn-primary btn-sm" id="btnSearchLoanAnalysis">
                  <i class="bi bi-search me-1"></i>Search
                </button>
              </div>
            </div>

            <!-- Search Results Tab -->
            <ul class="nav nav-tabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="searchResultsTab" data-bs-toggle="tab" data-bs-target="#searchResultsPane" type="button" role="tab">
                  Search Results
                </button>
              </li>
            </ul>
            <div class="tab-content">
              <div class="tab-pane fade show active" id="searchResultsPane" role="tabpanel">
                <div class="table-responsive">
                  <table class="table table-sm table-hover table-bordered mb-0" id="loanAnalysisSearchTable">
                    <thead class="table-light">
                      <tr>
                        <th>#</th>
                        <th>LoanAnalysisID</th>
                        <th>Description</th>
                        <th>AnalysisTypeID</th>
                      </tr>
                    </thead>
                    <tbody id="loanAnalysisSearchResults">
                      <!-- Results will be populated here -->
                    </tbody>
                  </table>
                </div>
                <div id="loanAnalysisSearchEmpty" class="text-center text-muted py-3 d-none">
                  No results found.
                </div>
                <div id="loanAnalysisSearchLoader" class="text-center py-3 d-none">
                  <div class="spinner-border spinner-border-sm text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  <span class="ms-2">Searching...</span>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSearchPrev" disabled>
              <i class="bi bi-arrow-left"></i>
            </button>
            <button type="button" class="btn btn-primary btn-sm px-4" id="btnSearchOk">
              OK
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSearchNext" disabled>
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/loan-analysis.js"></script>
</body>

</html>
