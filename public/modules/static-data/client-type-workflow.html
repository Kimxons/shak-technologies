<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client Type WorkFlow · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201">
</head>

<body class="client-type-workflow copilot-theme" data-page="static-data-client-type-workflow">
  <div class="window">
    <form id="client-type-workflow-form" autocomplete="off" novalidate>
      <div class="main-container">
        <!-- Sidebar purposefully omitted -->

        <section class="form-content" aria-label="Client Type WorkFlow Content">
          <div class="form-card">
            <!-- Client Type WorkFlow Section -->
            <div class="form-section" data-section="client-type-workflow">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-diagram-project"></i> Client Type WorkFlow Configuration</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Client Type WorkFlow" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row mb-3">
                  <label class="label-blue" for="WorkflowId">Workflow ID</label>
                  <select class="bs-select" id="WorkflowId" name="WorkflowId">
                    <option value="">--Select--</option>
                  </select>
                </div>

                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th scope="col" class="text-center">
                          <input type="checkbox" class="form-check-input grid-select-all" aria-label="Select all" />
                        </th>
                        <th scope="col">Client Type</th>
                        <th scope="col">Client Type Name</th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- Table rows will be populated here -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history"></i> Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Action Panel -->
        <aside class="action-panel" aria-label="Actions">
          <div class="action-buttons">
            <button type="button" class="btn-action btn-view" data-ctw-action="view"><i class="bi bi-eye me-1"></i>View</button>
            <button type="button" class="btn-action" data-ctw-action="edit"><i class="bi bi-pencil me-1"></i>Edit</button>
            <button type="button" class="btn-action" data-ctw-action="save" disabled><i class="bi bi-check me-1"></i>Save</button>
            <button type="button" class="btn-action" data-ctw-action="cancel" disabled><i class="bi bi-x me-1"></i>Cancel</button>
          </div>
        </aside>
      </div>
    </form>
    <div class="am-message-panel"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/client-type-workflow.js"></script>
</body>
</html>
