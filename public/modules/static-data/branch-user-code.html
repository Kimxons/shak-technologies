<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branch User Code · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.min.css" />
  <link rel="stylesheet" href="../../assets/css/maincss.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="branch-user-code copilot-theme" data-page="static-data-branch-user-code">
  <div class="window">
    <form id="branch-user-code-form" autocomplete="off" novalidate>
      <div class="main-container">
        <!-- Sidebar purposefully omitted -->

        <section class="form-content" aria-label="Branch User Code Content">
          <div class="form-card">
            <!-- Branch User Code Section -->
            <div class="form-section" data-section="branch-user-code">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-code-square"></i> Branch User Code Search</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Branch User Code" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <!-- Validation/Success Message Banner -->
                <div class="validation-summary" role="status" aria-live="polite" style="display: none; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); border: 1px solid #28a745; color: #155724;">
                  <i class="bi bi-check-circle validation-summary__icon" style="margin-right: 8px;"></i>
                  <span class="validation-summary__text"></span>
                  <button type="button" class="validation-summary__close" aria-label="Close notification" style="background: none; border: none; float: right; cursor: pointer; color: #155724;">
                    <i class="bi bi-x"></i>
                  </button>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="CodeID">Code ID</label>
                    <div class="kairo-user-control" data-kairo-lookup-control>
                      <input type="text" class="kairo-user-control__id" id="CodeID" name="CodeID" aria-label="Code ID" data-always-enabled />
                      <input type="text" class="kairo-user-control__name" id="CodeName" name="CodeName" aria-label="Code Name" placeholder="Code Name" readonly />
                      <button type="button" class="btn-lookup kairo-user-control__lookup" aria-label="Search Code" data-always-enabled data-bruc-action="search">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col"></div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="SubCode">Sub Code</label>
                    <input type="text" class="bs-input-text" id="SubCode" name="SubCode" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="Description">Description</label>
                    <input type="text" class="bs-input-text" id="Description" name="Description" />
                  </div>
                </div>
              </div>
            </div>

            <!-- Sub Code Details Section -->
            <div class="form-section" data-section="sub-code-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-table"></i> Sub Code Details (<span id="subCodeCount">0</span>)</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Sub Code Details" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="d-flex gap-2 mb-3">
                  <button type="button" class="btn-action" data-bruc-grid-action="new" disabled>
                    <i class="bi bi-plus me-1"></i>New
                  </button>
                  <button type="button" class="btn-action" data-bruc-grid-action="alter" disabled>
                    <i class="bi bi-pencil me-1"></i>Alter
                  </button>
                  <button type="button" class="btn-action" data-bruc-grid-action="remove" disabled>
                    <i class="bi bi-trash me-1"></i>Remove
                  </button>
                  <button type="button" class="btn-action" data-bruc-grid-action="update" disabled>
                    <i class="bi bi-arrow-clockwise me-1"></i>Update
                  </button>
                  <button type="button" class="btn-action" data-bruc-grid-action="clear" disabled>
                    <i class="bi bi-x me-1"></i>Clear
                  </button>
                </div>

                <div class="table-responsive">
                  <table id="subCodesTable" class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th scope="col">Sub Code ID</th>
                        <th scope="col">Description</th>
                      </tr>
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye"></i> Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Action Panel -->
        <aside class="action-panel" aria-label="Actions">
          <div class="action-buttons">
            <button type="button" class="btn-action btn-view" data-bruc-action="view"><i class="bi bi-eye me-1"></i>View</button>
            <button type="button" class="btn-action" data-bruc-action="add"><i class="bi bi-plus me-1"></i>Add</button>
            <button type="button" class="btn-action" data-bruc-action="edit"><i class="bi bi-pencil me-1"></i>Edit</button>
            <button type="button" class="btn-action" data-bruc-action="save" disabled><i class="bi bi-check me-1"></i>Save</button>
            <button type="button" class="btn-action" data-bruc-action="cancel" disabled><i class="bi bi-x me-1"></i>Cancel</button>
          </div>
        </aside>
      </div>
    </form>
    <div class="am-message-panel"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/pages/static-data/branch-user-code.js"></script>
</body>

</html>
