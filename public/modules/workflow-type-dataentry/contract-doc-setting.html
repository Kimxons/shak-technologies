<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Document Setting · Kairo Banking</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="contract-doc-setting.css">
</head>
<body>
  <div class="kairo-container">
    <!-- Main Content Area (No left sidebar) -->
    <main class="kairo-content">
      <div id="statusMessage" class="status-message"></div>
      
      <form id="contractDocSettingForm" autocomplete="off" novalidate>
        <!-- Contract Document Setting Header Section -->
        <div class="kairo-card">
          <div class="card-header card-header-blue">
            <i class="bi bi-file-earmark-text"></i>
            <span>Contract Document Setting</span>
          </div>
          <div class="card-body">
            <div class="form-grid-2col">
              <div class="form-group">
                <label for="workflowStage">
                  <i class="bi bi-diagram-3"></i>
                  <span>Workflow Stage</span>
                </label>
                <select id="workflowStage" name="workflowStage" required>
                  <option value="">--Select--</option>
                  <option value="APPLICATION">Application</option>
                  <option value="APPRAISAL">Appraisal</option>
                  <option value="SANCTION">Sanction</option>
                  <option value="DISBURSEMENT">Disbursement</option>
                </select>
              </div>

              <div class="form-group">
                <label for="contractFormatId">
                  <i class="bi bi-file-text"></i>
                  <span>Contract Format ID</span>
                </label>
                <div class="input-with-search">
                  <input type="text" id="contractFormatId" name="contractFormatId" required>
                  <button type="button" class="btn-search" onclick="searchContractFormat()">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- Action Buttons Row -->
            <div class="button-row">
              <button type="button" class="btn-secondary" onclick="handleNew()">
                <i class="bi bi-plus-circle"></i>
                <span>New</span>
              </button>
              <button type="button" class="btn-secondary" onclick="handleRemove()">
                <i class="bi bi-trash"></i>
                <span>Remove</span>
              </button>
              <button type="button" class="btn-secondary" onclick="handleUpdate()">
                <i class="bi bi-arrow-repeat"></i>
                <span>Update</span>
              </button>
              <button type="button" class="btn-secondary" onclick="handleClear()">
                <i class="bi bi-x-square"></i>
                <span>Clear</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Contract Documents Table Section -->
        <div class="kairo-card">
          <div class="card-body">
            <div class="table-container">
              <table class="kairo-table">
                <thead>
                  <tr>
                    <th style="width: 50%;">Workflow Stage</th>
                    <th style="width: 50%;">Contract Format ID</th>
                  </tr>
                </thead>
                <tbody id="contractDocTableBody">
                  <tr>
                    <td colspan="2" class="no-records">No Records To Display</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div class="kairo-card">
          <div class="card-header card-header-blue">
            <i class="bi bi-eye-slash"></i>
            <span>Behind The Scene</span>
          </div>
          <div class="card-body">
            <div class="form-grid-2col">
              <div class="form-group">
                <label for="createdBy">
                  <i class="bi bi-person"></i>
                  <span>Created By</span>
                </label>
                <input type="text" id="createdBy" name="createdBy" readonly>
              </div>

              <div class="form-group">
                <label for="supervisedBy">
                  <i class="bi bi-person-check"></i>
                  <span>Supervised By</span>
                </label>
                <input type="text" id="supervisedBy" name="supervisedBy" readonly>
              </div>

              <div class="form-group">
                <label for="createdOn">
                  <i class="bi bi-calendar"></i>
                  <span>Created On</span>
                </label>
                <input type="text" id="createdOn" name="createdOn" readonly>
              </div>

              <div class="form-group">
                <label for="supervisedOn">
                  <i class="bi bi-calendar-check"></i>
                  <span>Supervised On</span>
                </label>
                <input type="text" id="supervisedOn" name="supervisedOn" readonly>
              </div>
            </div>
          </div>
        </div>
      </form>
    </main>

    <!-- Right Action Sidebar -->
    <aside class="kairo-actions">
      <button type="button" class="btn-action btn-add" onclick="handleAdd()" title="Add (Alt+A)">
        <i class="bi bi-plus-circle"></i>
        <span>Add</span>
      </button>

      <button type="button" class="btn-action btn-edit" onclick="handleEdit()" title="Edit (Alt+E)">
        <i class="bi bi-pencil"></i>
        <span>Edit</span>
      </button>

      <button type="button" class="btn-action btn-delete" onclick="handleDelete()" title="Delete (Alt+D)">
        <i class="bi bi-trash"></i>
        <span>Delete</span>
      </button>

      <button type="button" class="btn-action btn-save" onclick="handleSave()" title="Save (Ctrl+S)">
        <i class="bi bi-save"></i>
        <span>Save</span>
      </button>

      <button type="button" class="btn-action btn-cancel" onclick="handleCancel()" title="Cancel (ESC)">
        <i class="bi bi-x-circle"></i>
        <span>Cancel</span>
      </button>

      <button type="button" class="btn-action btn-back" onclick="handleBack()" title="Back (Alt+B)">
        <i class="bi bi-arrow-left-circle"></i>
        <span>Back</span>
      </button>
    </aside>
  </div>

  <!-- Modals Container -->
  <div id="modalsContainer"></div>

  <script src="contract-doc-setting.js"></script>
</body>
</html>
