<div class="report-mapping">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Form Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <!-- Branch ID -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Branch ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="branchIdField" placeholder="0101" />
                <input type="text" class="form-control" placeholder="Head Office" style="border-left: none;" />
                <button class="btn" type="button" data-search="branchId">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div></div>
          </div>

          <!-- Report -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Report</label>
              <div class="input-group">
                <input type="text" class="form-control" id="reportField" />
                <button class="btn" type="button" data-search="report">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div></div>
          </div>

          <!-- Description Header -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Description Header</label>
              <div class="input-group">
                <input type="text" class="form-control" id="descriptionHeaderField" />
                <button class="btn" type="button" data-search="descriptionHeader">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div></div>
          </div>

          <!-- Description -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Description</label>
              <div class="input-group">
                <input type="text" class="form-control" id="descriptionField" />
                <button class="btn" type="button" data-search="description">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div></div>
          </div>

          <!-- Description Type and Formula -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Description Type</label>
              <select class="form-select" id="descriptionTypeSelect">
                <option value="Field_Value">Field_Value</option>
                <option value="Value_Field">Value_Field</option>
                <option value="Custom">Custom</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Formula</label>
              <input type="text" class="form-control" id="formulaInput" />
            </div>
          </div>

          <!-- Formula Expression -->
          <div style="margin-bottom: 12px;">
            <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Formula Expression</label>
            <textarea class="form-control" id="formulaExpressionTextarea" style="height: 120px; resize: none;"></textarea>
          </div>

          <!-- Account Type and Accounts -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Account Type</label>
              <select class="form-select" id="accountTypeSelect">
                <option value="GL_Accounts">GL Accounts</option>
                <option value="Customer_Accounts">Customer Accounts</option>
                <option value="Product_Accounts">Product Accounts</option>
              </select>
            </div>
            <div></div>
          </div>

          <!-- Accounts Field -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Accounts</label>
              <div class="input-group">
                <input type="text" class="form-control" id="accountsField" />
                <button class="btn" type="button" data-search="accounts">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div></div>
          </div>

          <!-- Action Buttons Row -->
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px;">
            <button class="rm-action-btn-secondary" id="newBtn">New</button>
            <button class="rm-action-btn-secondary" id="removeBtn">Remove</button>
            <button class="rm-action-btn-secondary" id="updateBtn">Update</button>
            <button class="rm-action-btn-secondary" id="clearBtn">Clear</button>
          </div>
        </div>

        <!-- ReportMap Account Section -->
        <div style="padding: 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; margin-bottom: 8px; font-weight: 600; font-size: 0.8rem;">
            ReportMap Account
          </div>
          <div style="flex: 1; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 0.375rem;">
            <table class="table" style="margin-bottom: 0;">
              <thead>
                <tr>
                  <th>AccountID</th>
                  <th>Account Description</th>
                </tr>
              </thead>
              <tbody id="reportMapTableBody">
                <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                  <td colspan="2" style="padding: 20px;">No records to display</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 12px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; font-weight: 600; font-size: 0.8rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="rm-action-btn" id="viewBtn">View</button>
      <button class="rm-action-btn" id="addBtn">Add</button>
      <button class="rm-action-btn" id="editBtn">Edit</button>
      <button class="rm-action-btn" id="saveBtn">Save</button>
      <button class="rm-action-btn" id="deleteBtn">Delete</button>
      <button class="rm-action-btn" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<link rel="stylesheet" href="report-mapping.css">
<script src="report-mapping.js"></script>
