<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Notification</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/maincss.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    /* Enhanced table styling to match Product Charges grid */
    .table-responsive {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      padding: 16px;
    }

    #notificationTable {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 0;
    }

    #notificationTable thead th {
      background: #f8f9fa;
      color: #2c3e50;
      font-weight: 700;
      font-size: 11px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 2px solid #dee2e6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #notificationTable tbody td {
      padding: 14px 16px;
      font-size: 11px;
      color: #495057;
      border-bottom: 1px solid #e9ecef;
      background: white;
    }

    #notificationTable tbody tr:hover {
      background-color: #f8f9fa;
    }

    #notificationTable tbody tr:last-child td {
      border-bottom: none;
    }

    /* Checkbox styling */
    #notificationTable .bs-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
    }

    /* Center checkbox column */
    #notificationTable th:first-child,
    #notificationTable td:first-child {
      text-align: center;
      padding: 12px 8px;
    }

    /* Empty state styling */
    #notificationTable tbody td.text-center {
      color: #6c757d;
      font-style: italic;
      padding: 40px 16px;
    }

    /* Behind the Scene section styling */
    .audit-section--summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 24px;
      padding: 16px;
    }

    .audit-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .audit-label {
      font-size: 10px;
      font-weight: 700;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .audit-value {
      font-size: 11px;
      color: #495057;
      padding: 6px 0;
      min-height: 22px;
      border-bottom: 1px solid #e9ecef;
    }

    /* Remove section padding for cleaner look */
    .form-section {
      margin-bottom: 12px;
    }

    .section-content {
      padding: 0;
    }

    .form-section[data-section="behind-scene"] .section-content {
      padding: 0;
    }
  </style>
</head>

<body>
  <div class="window">
    <!-- Header -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-bell am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Product Notification</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window">
          <i class="bi bi-square"></i>
        </button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container" aria-label="Product Notification form">
      <!-- Form Content -->
      <div class="form-content" role="region" aria-label="Product Notification form">
        <div class="form-card" data-main-form>
          <!-- Product Notification Section -->
          <div class="form-section" data-section="notification-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-bell"></i>Product Notification</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Product Notification" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="table-responsive">
                <table class="table table-sm table-hover" id="notificationTable">
                  <thead>
                    <tr>
                      <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAll" class="bs-checkbox" /></th>
                      <th>NotificationID</th>
                      <th>NotificationType</th>
                      <th>NotificationMessage</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="4" class="text-center text-muted">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Behind The Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action" id="editBtn">
            <i class="bi bi-pencil me-1"></i>Edit
          </button>
          <button type="button" class="btn-action" id="saveBtn" disabled>
            <i class="bi bi-floppy me-1"></i>Save
          </button>
          <button type="button" class="btn-action" id="cancelBtn" disabled>
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <button type="button" class="btn-action" id="backBtn" data-action="back">
            <i class="bi bi-arrow-left"></i>Back
          </button>
        </div>
      </div>
    </main>

    <!-- Message Panel -->
    <div class="am-message-panel" id="messagePanel" hidden></div>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/product-management/product-notification.embedded.js"></script>
  <script>
    // Section toggle functionality
    document.querySelectorAll('[data-section-toggle]').forEach(header => {
      header.addEventListener('click', () => {
        const section = header.closest('.form-section');
        const toggleBtn = header.querySelector('.section-toggle-btn');
        const isCollapsed = section.classList.toggle('collapsed');
        if (toggleBtn) {
          toggleBtn.setAttribute('aria-expanded', !isCollapsed);
        }
      });
    });

    // Select all checkbox handler
    document.getElementById('selectAll')?.addEventListener('change', function() {
      const checkboxes = document.querySelectorAll('.notification-checkbox');
      checkboxes.forEach(cb => cb.checked = this.checked);
    });

    // Window control actions
    document.querySelectorAll('.am-header__right [data-action]').forEach(btn => {
      const action = btn.getAttribute('data-action');
      btn.addEventListener('click', () => {
        if (action === 'refresh') window.location.reload();
        else if (action === 'maximize') {
          const windowEl = document.querySelector('.window');
          const isMaximized = windowEl.classList.toggle('maximized');
          btn.querySelector('i').className = isMaximized ? 'bi bi-fullscreen-exit' : 'bi bi-square';
          btn.title = isMaximized ? 'Restore' : 'Maximize';
        } else if (action === 'close') {
          goBack();
        }
      });
    });

    // Back button handler
    function goBack() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'close-child' }, '*');
      }
      const overlay = window.parent?.document?.querySelector('[data-child-overlay]');
      if (overlay) {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
      }
      if (window.history.length > 1) {
        window.history.back();
      }
    }

    document.getElementById('backBtn')?.addEventListener('click', goBack);
  </script>
</body>

</html>
