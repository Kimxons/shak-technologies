<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installment Allocations</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    /* Hide sidebar for child form */
    .sidebar {
      display: none;
    }

    /* Adjust main container to remove sidebar space */
    .main-container {
      --sidebar-width: 0px;
    }

    .form-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .two-panel-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      background: linear-gradient(to bottom, #4a90e2, #357abd);
      color: white;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 11px;
      border-bottom: 2px solid #2b6199;
    }

    .panel-content {
      flex: 1;
      overflow: auto;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d32f2f;
      font-size: 11px;
      padding: 20px;
    }

    .behind-scene-section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }

    .behind-scene-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      background: white;
    }

    .behind-scene-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .behind-scene-item label {
      font-weight: 700;
      font-size: 10px;
      color: #357abd;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .behind-scene-item input {
      padding: 6px 10px;
      border: 1px solid rgba(10, 107, 165, 0.2);
      border-radius: 4px;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>

<body>
  <div class="window">
    <div class="main-container">
      <div class="sidebar"></div>

      <div class="form-content">
        <!-- Title -->
        <div class="section-header">
          <i class="bi bi-sliders"></i> INSTALLMENT ALLOCATIONS
        </div>

        <!-- Two-Panel Layout: Installment Components and Priority -->
        <div class="two-panel-container">
          <!-- Installment Components Panel -->
          <div class="panel">
            <div class="panel-header">Installment Components</div>
            <div class="panel-content">
              No records to display.
            </div>
          </div>

          <!-- Priority Panel -->
          <div class="panel">
            <div class="panel-header">Priority</div>
            <div class="panel-content">
              No records to display.
            </div>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div class="section-header">
          <i class="bi bi-info-circle"></i> BEHIND THE SCENE
        </div>
        <div class="behind-scene-section">
          <div class="behind-scene-grid">
            <div class="behind-scene-item">
              <label>Modified By</label>
              <input type="text" id="modifiedBy" class="bs-input-text" readonly>
            </div>
            <div class="behind-scene-item">
              <label>Supervised By</label>
              <input type="text" id="supervisedBy" class="bs-input-text" readonly>
            </div>
            <div class="behind-scene-item">
              <label>Modified On</label>
              <input type="text" id="modifiedOn" class="bs-input-text" readonly>
            </div>
            <div class="behind-scene-item">
              <label>Supervised On</label>
              <input type="text" id="supervisedOn" class="bs-input-text" readonly>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button class="btn-action" id="editBtn">
            <i class="bi bi-pencil me-1"></i>Edit
          </button>
          <button class="btn-action" id="saveBtn" style="display: none;">
            <i class="bi bi-floppy me-1"></i>Save
          </button>
          <button class="btn-action" id="cancelBtn" style="display: none;">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <button class="btn-action" id="backBtn">
            <i class="bi bi-arrow-left me-1"></i>Back
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/product-management/installment-allocations.embedded.js"></script>
</body>

</html>
