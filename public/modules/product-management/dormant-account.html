<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dormant Account Settings</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    /* Hide sidebar for child form */
    .sidebar {
      display: none;
    }

    /* Main container positioning */
    .main-container {
      --sidebar-width: 0px !important;
      position: relative !important;
      width: 100% !important;
      display: block !important;
    }
    
    /* Form content full width */
    .form-content {
      width: calc(100% - 130px) !important;
      margin-right: 0 !important;
      padding-right: 0 !important;
    }
    
    /* Action panel fixed on the right */
    .action-panel {
      position: absolute !important;
      top: 200px !important;
      right: 10px !important;
      width: 110px !important;
      height: auto !important;
      padding: 0 !important;
      margin: 0 !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
      z-index: 100 !important;
    }
    
    .action-buttons {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
    }
    
    .btn-action {
      width: 110px !important;
      padding: 8px 10px !important;
      font-size: 11px !important;
      height: 32px !important;
      white-space: nowrap !important;
      text-overflow: ellipsis !important;
      overflow: hidden !important;
    }
    
    /* Label color matching parent */
    label {
      color: #1e293b !important;
      font-size: 10px !important;
      font-weight: 600 !important;
    }
    
    /* Make input fields smaller */
    .bs-input-text,
    .bs-select,
    input[type="text"],
    input[type="number"],
    select {
      height: 28px !important;
      font-size: 10px !important;
      padding: 4px 8px !important;
    }
    
    .btn-lookup {
      width: 28px !important;
      height: 28px !important;
      padding: 0 !important;
      font-size: 11px !important;
    }
    
    .bs-checkbox {
      width: 16px !important;
      height: 16px !important;
    }
    
    .section-header {
      font-size: 11px !important;
      padding: 6px 10px !important;
      margin: 8px 0 6px 0 !important;
    }
    
    .kairo-field {
      gap: 3px !important;
    }
  </style>
</head>

<body>
  <div class="window">
    <div class="main-container">
      <!-- Left Sidebar -->
      <div class="sidebar">
        <!-- Empty sidebar - no navigation items needed for child form -->
      </div>

      <!-- Form Content -->
      <div class="form-content">
        <!-- First Section - 4 column grid -->
        <div class="kairo-grid-4">
          <div class="kairo-field">
            <label>Dormant Days</label>
            <input type="text" id="dormantDays" name="dormantDays" class="bs-input-text" />
          </div>
          <div class="kairo-field">
            <label>Balance From</label>
            <input type="text" id="balanceFrom" name="balanceFrom" class="bs-input-text" />
          </div>
          <div class="kairo-field">
            <label>Balance To</label>
            <input type="text" id="balanceTo" name="balanceTo" class="bs-input-text" />
          </div>
          <div class="kairo-field">
            <label>Allow Credit</label>
            <input type="checkbox" id="allowCredit" name="allowCredit" class="bs-checkbox" />
          </div>
        </div>

        <!-- Do Change Product Section -->
        <div class="section-header">
          <i class="bi bi-arrow-repeat"></i> Do Change Product ?
        </div>
        <div class="kairo-grid-4">
          <div class="kairo-field">
            <label>Change Product ID On Dormancy</label>
            <input type="checkbox" id="changeProductID" name="changeProductID" class="bs-checkbox" />
          </div>
          <div class="kairo-field" style="grid-column: span 3;">
            <label>Dormant Product ID</label>
            <div style="display: flex; gap: 4px;">
              <input type="text" id="dormantProductID" name="dormantProductID" class="bs-input-text" style="flex: 1;" />
              <button class="btn-lookup" aria-label="Lookup Product"><i class="bi bi-search"></i></button>
            </div>
          </div>
        </div>

        <!-- Move Balance Section -->
        <div class="section-header">
          <i class="bi bi-arrow-left-right"></i> Move Balance
        </div>
        <div class="kairo-grid-4">
          <div class="kairo-field">
            <label>Close Account</label>
            <input type="checkbox" id="closeAccount" name="closeAccount" class="bs-checkbox" />
          </div>
          <div class="kairo-field">
            <label>Credit Balance GL</label>
            <div style="display: flex; gap: 4px;">
              <input type="text" id="creditBalanceGL" name="creditBalanceGL" class="bs-input-text" style="flex: 1;" />
              <button class="btn-lookup" aria-label="Lookup Account"><i class="bi bi-search"></i></button>
            </div>
          </div>
          <div class="kairo-field">
            <label>Debit Balance GL</label>
            <div style="display: flex; gap: 4px;">
              <input type="text" id="debitBalanceGL" name="debitBalanceGL" class="bs-input-text" style="flex: 1;" />
              <button class="btn-lookup" aria-label="Lookup Account"><i class="bi bi-search"></i></button>
            </div>
          </div>
          <div class="kairo-field">
            <label>Close Dormant Days</label>
            <input type="text" id="closeDormantDays" name="closeDormantDays" class="bs-input-text" />
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div class="section-header">
          <i class="bi bi-info-circle"></i> Behind The Scene
        </div>
        <div class="kairo-grid-4" style="grid-template-columns: repeat(3, 1fr);">
          <div class="kairo-field">
            <label>Created By</label>
            <input type="text" class="bs-input-text" readonly />
          </div>
          <div class="kairo-field">
            <label>Created On</label>
            <input type="text" class="bs-input-text" readonly />
          </div>
          <div class="kairo-field">
            <label>Modified By</label>
            <input type="text" class="bs-input-text" readonly />
          </div>
          <div class="kairo-field">
            <label>Modified On</label>
            <input type="text" class="bs-input-text" readonly />
          </div>
          <div class="kairo-field">
            <label>Supervised By</label>
            <input type="text" class="bs-input-text" readonly />
          </div>
          <div class="kairo-field">
            <label>Supervised On</label>
              <input type="text" class="bs-input-text" readonly />
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button type="button" class="btn-action">
            <i class="bi bi-plus-lg me-1"></i>Add
          </button>
          <button type="button" class="btn-action">
            <i class="bi bi-pencil me-1"></i>Edit
          </button>
          <button type="button" class="btn-action">
            <i class="bi bi-trash me-1"></i>Delete
          </button>
          <button type="button" class="btn-action">
            <i class="bi bi-floppy me-1"></i>Save
          </button>
          <button type="button" class="btn-action">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <button type="button" class="btn-action" id="backBtn">
            <i class="bi bi-arrow-left me-1"></i>Back
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Lookup Modal -->
  <div class="modal fade" id="productLookupModal" tabindex="-1" aria-labelledby="productLookupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white d-flex justify-content-between align-items-center">
          <div>
            <h5 class="modal-title" id="productLookupModalLabel">Find Product</h5>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="row g-3 align-items-end mb-3" id="productLookupForm">
            <div class="col-md-5">
              <label class="form-label">Product ID</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="productSearchModeId">
                  <option value="Like">Like</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="productSearchId" placeholder="Enter Product ID" />
              </div>
            </div>
            <div class="col-md-5">
              <label class="form-label">Product Name</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="productSearchModeName">
                  <option value="Like">Like</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="productSearchName" placeholder="Enter Product Name" />
              </div>
            </div>
            <div class="col-md-2 text-md-end">
              <button type="submit" class="btn btn-primary btn-sm w-100" id="productSearchSubmit">
                Search
              </button>
            </div>
          </form>

          <div class="position-relative" style="min-height: 300px;">
            <div class="table-responsive">
              <table class="table table-sm table-bordered table-hover align-middle mb-0">
                <thead class="table-primary">
                  <tr>
                    <th scope="col" style="width: 60px;">#</th>
                    <th scope="col">Product ID</th>
                    <th scope="col">Product Name</th>
                  </tr>
                </thead>
                <tbody id="productSearchResults">
                  <tr>
                    <td colspan="3" class="text-center text-muted py-4">
                      No results. Click "Search" to find products.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div id="productSearchLoading" class="d-none position-absolute top-50 start-50 translate-middle">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="productSelectBtn" disabled><i class="bi bi-check-circle me-1"></i>OK</button>
        </div>
      </div>
    </div>
  </div>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/product-management/dormant-account.embedded.js"></script>
</body>
</html>
