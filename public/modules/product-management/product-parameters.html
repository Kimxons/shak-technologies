<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Parameters</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    /* Hide sidebar for child form */
    .sidebar {
      display: none;
    }

    /* Adjust main container to remove sidebar space */
    .main-container {
      --sidebar-width: 0px;
    }

    .form-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: calc(100vh - 100px);
    }

    .data-table-container {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      min-height: 500px;
      flex: 1;
    }

    .data-table-header {
      background: linear-gradient(to bottom, #4a90e2, #357abd);
      color: white;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 11px;
      border-bottom: 2px solid #2b6199;
    }

    .data-table-wrapper {
      padding: 12px;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 450px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
    }

    .data-table thead {
      background: #f0f4f8;
    }

    .data-table th {
      background: #f0f4f8;
      color: #1e293b;
      font-weight: 800;
      padding: 8px 10px;
      text-align: left;
      border-bottom: 2px solid #ddd;
      border-right: 1px solid #e5e7eb;
      font-size: 10px;
    }

    .data-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
      color: #475569;
      font-size: 10px;
    }

    .data-table tbody tr:hover {
      background: rgba(10, 107, 165, 0.04);
    }

    .data-table input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .data-table input[type="text"] {
      width: 100%;
      border: 1px solid #e5e7eb;
      padding: 4px 8px;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .data-table input[type="text"]:focus {
      outline: none;
      border-color: #357abd;
      background: white;
    }

    .behind-scene-section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }

    .behind-scene-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      background: white;
    }

    .behind-scene-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .behind-scene-item label {
      font-weight: 700;
      font-size: 10px;
      color: #357abd;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .behind-scene-item input {
      padding: 6px 10px;
      border: 1px solid rgba(10, 107, 165, 0.2);
      border-radius: 4px;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .data-table input[type="checkbox"] {
      cursor: pointer;
    }

    .data-table input[type="checkbox"]:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="window">
    <div class="main-container">
      <div class="sidebar"></div>

      <div class="form-content">
        <!-- Title -->
        <div class="section-header">
          <i class="bi bi-sliders"></i> PRODUCT PARAMETERS
        </div>

        <!-- Product Parameters Table -->
        <div class="data-table-container">
          <div class="data-table-header">Product Parameters</div>
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 40px;"><input type="checkbox" id="selectAll" /></th>
                  <th>Grouping</th>
                  <th>Description</th>
                  <th>Narration</th>
                  <th>Value</th>
                </tr>
              </thead>
              <tbody id="parametersTableBody">
                <!-- Data will be loaded from backend -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div class="section-header">
          <i class="bi bi-info-circle"></i> BEHIND THE SCENE
        </div>
        <div class="behind-scene-section">
          <div class="behind-scene-grid">
            <div class="behind-scene-item">
              <label>Modified By</label>
              <input type="text" class="bs-input-text" readonly />
            </div>
            <div class="behind-scene-item">
              <label>Supervised By</label>
              <input type="text" class="bs-input-text" readonly />
            </div>
            <div class="behind-scene-item">
              <label>Modified On</label>
              <input type="text" class="bs-input-text" readonly />
            </div>
            <div class="behind-scene-item">
              <label>Supervised On</label>
              <input type="text" class="bs-input-text" readonly />
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button type="button" class="btn-action" id="editBtn">
            <i class="bi bi-pencil me-1"></i>Edit
          </button>
          <button type="button" class="btn-action" id="saveBtn" disabled>
            <i class="bi bi-floppy me-1"></i>Save
          </button>
          <button type="button" class="btn-action" id="cancelBtn" disabled>
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <button type="button" class="btn-action" id="backBtn">
            <i class="bi bi-arrow-left me-1"></i>Back
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/product-management/product-parameters.embedded.js?v=12"></script>
</body>

</html>
