<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product (SB, CA, CS, SH) · Product</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>
  <div class="cm-workspace">
    <form id="product-sbcacs-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-scroll-region">
          <section class="card-surface">
            <div class="p-3">

              <!-- Filter Section -->
              <h5 class="mb-3">Filter Criteria</h5>
              <div class="row mb-3">
                <div class="col-md-4">
                  <div class="form-group">
                    <label class="form-label">Bank ID</label>
                    <input type="text" id="bankID" class="form-control" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group">
                    <label class="form-label">Branch ID</label>
                    <input type="text" id="branchID" class="form-control" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group">
                    <label class="form-label">Operator ID</label>
                    <input type="text" id="operatorID" class="form-control" />
                  </div>
                </div>
              </div>

              <hr />

              <!-- Search Section -->
              <h5 class="mb-3">Search Product</h5>
              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Product ID</label>
                    <input type="text" id="productID" class="form-control" placeholder="Enter Product ID" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Product Type</label>
                    <select id="productTypeID" class="form-control">
                      <option value="">Select Product Type</option>
                      <option value="SB">Savings Account (SB)</option>
                      <option value="CA">Current Account (CA)</option>
                      <option value="CS">Cash Credit (CS)</option>
                      <option value="SH">Secured Loan (SH)</option>
                    </select>
                  </div>
                </div>
              </div>

              <hr />

              <!-- Details Section -->
              <h5 class="mb-3">Product Details</h5>
              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Product Code</label>
                    <input type="text" id="productCode" class="form-control" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Product Name</label>
                    <input type="text" id="productName" class="form-control" />
                  </div>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-12">
                  <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="3"></textarea>
                  </div>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Minimum Balance</label>
                    <input type="number" id="minimumBalance" class="form-control" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Maximum Balance</label>
                    <input type="number" id="maximumBalance" class="form-control" />
                  </div>
                </div>
              </div>

              <hr />

              <!-- Audit Section -->
              <h5 class="mb-3">Audit Information</h5>
              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Created By</label>
                    <input type="text" id="createdBy" class="form-control" readonly />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Created On</label>
                    <input type="text" id="createdOn" class="form-control" readonly />
                  </div>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Modified By</label>
                    <input type="text" id="modifiedBy" class="form-control" readonly />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Modified On</label>
                    <input type="text" id="modifiedOn" class="form-control" readonly />
                  </div>
                </div>
              </div>

            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <button type="button" class="btn-close" id="closeBtn" title="Close and return to parent form">Close</button>
        <button type="button" class="cm-shell__action">Process</button>
        <button type="button" class="cm-shell__action">Add</button>
        <button type="button" class="cm-shell__action">Edit</button>
        <button type="button" class="cm-shell__action cm-shell__action--danger">Delete</button>
        <button type="button" class="cm-shell__action cm-shell__action--success">Save</button>
      </aside>
    </form>
  </div>

  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/products/product-sbcacs.js"></script>
</body>

</html>
