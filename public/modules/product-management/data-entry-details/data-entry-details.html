<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Entry Details · Accounting Rule</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    body.data-entry-page {
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .data-entry-container {
      display: flex;
      height: 100vh;
      width: 100%;
      background-color: #f5f5f5;
    }

    .data-entry-sidebar {
      width: 150px;
      background-color: #e8f1ff;
      padding: 15px;
      border-right: 1px solid #d0d0d0;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .data-entry-sidebar h6 {
      font-size: 12px;
      font-weight: bold;
      color: #003366;
      margin-bottom: 10px;
      margin-top: 15px;
    }

    .data-entry-sidebar a {
      display: block;
      font-size: 11px;
      color: #003366;
      text-decoration: none;
      padding: 5px 8px;
      border-radius: 3px;
      margin-bottom: 3px;
      cursor: pointer;
    }

    .data-entry-sidebar a:hover {
      background-color: #d0e0f0;
    }

    .data-entry-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .data-entry-header {
      background-color: white;
      padding: 15px 20px;
      border-bottom: 1px solid #d0d0d0;
      display: flex;
      gap: 20px;
      align-items: flex-end;
    }

    .data-entry-header .form-group {
      margin-bottom: 0;
    }

    .data-entry-header label {
      font-size: 12px;
      font-weight: bold;
      color: #003366;
      display: block;
      margin-bottom: 3px;
    }

    .data-entry-header input,
    .data-entry-header select {
      font-size: 12px;
      height: 28px;
      padding: 4px 8px;
    }

    .data-entry-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 15px 20px;
    }

    .data-entry-section {
      background-color: white;
      border: 1px solid #b0c4de;
      border-radius: 3px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .data-entry-section-header {
      background-color: #1e90ff;
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      font-size: 13px;
    }

    .data-entry-section-body {
      padding: 15px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .data-entry-form-group {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .data-entry-form-group label {
      font-size: 12px;
      font-weight: bold;
      color: #003366;
      text-align: right;
      white-space: nowrap;
    }

    .data-entry-form-group input,
    .data-entry-form-group select {
      font-size: 12px;
      height: 24px;
      padding: 3px 6px;
    }

    .data-entry-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .data-entry-buttons button {
      font-size: 11px;
      padding: 6px 14px;
      height: 28px;
      background-color: #e8e8e8;
      border: 1px solid #999;
      border-radius: 3px;
      cursor: pointer;
      color: #333;
    }

    .data-entry-buttons button:hover {
      background-color: #d8d8d8;
    }

    .data-entry-table {
      flex: 1;
      overflow: auto;
    }

    .data-entry-table table {
      font-size: 12px;
      border-collapse: collapse;
      width: 100%;
    }

    .data-entry-table th {
      background-color: #f0f0f0;
      border: 1px solid #d0d0d0;
      padding: 8px;
      text-align: left;
      font-weight: bold;
      color: #333;
    }

    .data-entry-table td {
      border: 1px solid #d0d0d0;
      padding: 8px;
      color: #666;
    }

    .data-entry-table tr:hover {
      background-color: #f9f9f9;
    }

    .data-entry-actions {
      width: 80px;
      background-color: #e8f1ff;
      padding: 15px;
      border-left: 1px solid #d0d0d0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .data-entry-actions button {
      font-size: 11px;
      padding: 6px 10px;
      height: 28px;
      background-color: #e8e8e8;
      border: 1px solid #999;
      border-radius: 3px;
      cursor: pointer;
      color: #333;
      text-align: center;
    }

    .data-entry-actions button:hover {
      background-color: #d8d8d8;
    }

    .data-entry-footer {
      background-color: #e8f1ff;
      padding: 10px 20px;
      border-top: 1px solid #d0d0d0;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>

<body class="data-entry-page">
  <div class="data-entry-container">
    <aside class="data-entry-sidebar">
      <h6>DataEntry</h6>
      <a href="#" id="goBackLink">Go Back</a>
      <a href="#" class="active">View</a>
    </aside>

    <div class="data-entry-main">
      <div class="data-entry-header">
        <div class="form-group">
          <label for="accountingRuleID">Accounting Rule ID</label>
          <input type="text" id="accountingRuleID" name="accountingRuleID" class="form-control" placeholder="RULE00001" />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" class="form-control" placeholder="Rule description" />
        </div>
        <div class="form-group">
          <label for="productTypes">Product Types</label>
          <select id="productTypes" name="productTypes" class="form-control">
            <option value="">--Select--</option>
            <option value="SB">Savings Bank</option>
            <option value="CA">Current Account</option>
            <option value="CS">Cash Management</option>
            <option value="FD">Fixed Deposit</option>
            <option value="RD">Recurring Deposit</option>
          </select>
        </div>
      </div>

      <div class="data-entry-content">
        <div class="data-entry-section">
          <div class="data-entry-section-header">Applicable Events</div>
          <div class="data-entry-section-body">
            <div class="data-entry-buttons">
              <button type="button" class="btn-new">New</button>
              <button type="button" class="btn-alter">Alter</button>
              <button type="button" class="btn-remove">Remove</button>
              <button type="button" class="btn-update">Update</button>
              <button type="button" class="btn-clear">Clear</button>
            </div>

            <div class="data-entry-table">
              <table>
                <thead>
                  <tr>
                    <th>Event ID</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="2" style="text-align: center; color: #999;">No Records To Display</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="data-entry-footer">
        BR.Net Web Banking
      </div>
    </div>

    <aside class="data-entry-actions">
      <button type="button" class="btn-view">View</button>
      <button type="button" class="btn-add">Add</button>
      <button type="button" class="btn-edit">Edit</button>
      <button type="button" class="btn-delete">Delete</button>
      <button type="button" class="btn-save">Save</button>
      <button type="button" class="btn-cancel">Cancel</button>
      <button type="button" class="btn-back" id="backBtn">Back</button>
    </aside>
  </div>

  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../../../assets/js/pages/product-management/data-entry-details/data-entry-details.embedded.js"></script>
</body>

</html>
