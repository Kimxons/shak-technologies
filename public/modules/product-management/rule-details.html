<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rule Details · Accounting Rule</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    body.rule-details-page {
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .rule-details-container {
      display: flex;
      height: 100vh;
      width: 100%;
      background-color: #f5f5f5;
    }

    .rule-details-sidebar {
      width: 150px;
      background-color: #e8f1ff;
      padding: 15px;
      border-right: 1px solid #d0d0d0;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .rule-details-sidebar h6 {
      font-size: 12px;
      font-weight: bold;
      color: #003366;
      margin-bottom: 10px;
      margin-top: 15px;
    }

    .rule-details-sidebar a {
      display: block;
      font-size: 11px;
      color: #003366;
      text-decoration: none;
      padding: 5px 8px;
      border-radius: 3px;
      margin-bottom: 3px;
      cursor: pointer;
    }

    .rule-details-sidebar a:hover {
      background-color: #d0e0f0;
    }

    .rule-details-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .rule-details-header {
      background-color: white;
      padding: 15px 20px;
      border-bottom: 1px solid #d0d0d0;
      display: flex;
      gap: 20px;
      align-items: flex-end;
    }

    .rule-details-header .form-group {
      margin-bottom: 0;
    }

    .rule-details-header label {
      font-size: 12px;
      font-weight: bold;
      color: #003366;
      display: block;
      margin-bottom: 3px;
    }

    .rule-details-header input,
    .rule-details-header select {
      font-size: 12px;
      height: 28px;
      padding: 4px 8px;
    }

    .rule-details-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 15px 20px;
    }

    .rule-details-section {
      background-color: white;
      border: 1px solid #b0c4de;
      border-radius: 3px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .rule-details-section-header {
      background-color: #1e90ff;
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      font-size: 13px;
    }

    .rule-details-section-body {
      padding: 15px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rule-details-form-group {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .rule-details-form-group label {
      font-size: 12px;
      font-weight: bold;
      color: #003366;
      text-align: right;
      white-space: nowrap;
    }

    .rule-details-form-group input,
    .rule-details-form-group select {
      font-size: 12px;
      height: 24px;
      padding: 3px 6px;
    }

    .rule-details-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: center;
    }

    .rule-details-buttons button {
      font-size: 11px;
      padding: 6px 14px;
      height: 28px;
      background-color: #e8e8e8;
      border: 1px solid #999;
      border-radius: 3px;
      cursor: pointer;
      color: #333;
    }

    .rule-details-buttons button:hover {
      background-color: #d8d8d8;
    }

    .rule-details-table {
      flex: 1;
      overflow: auto;
    }

    .rule-details-table table {
      font-size: 12px;
      border-collapse: collapse;
      width: 100%;
    }

    .rule-details-table th {
      background-color: #f0f0f0;
      border: 1px solid #d0d0d0;
      padding: 8px;
      text-align: left;
      font-weight: bold;
      color: #333;
    }

    .rule-details-table td {
      border: 1px solid #d0d0d0;
      padding: 8px;
      color: #666;
    }

    .rule-details-table tr:hover {
      background-color: #f9f9f9;
    }

    .rule-details-actions {
      width: 80px;
      background-color: #e8f1ff;
      padding: 15px;
      border-left: 1px solid #d0d0d0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rule-details-actions button {
      font-size: 11px;
      padding: 6px 10px;
      height: 28px;
      background-color: #e8e8e8;
      border: 1px solid #999;
      border-radius: 3px;
      cursor: pointer;
      color: #333;
      text-align: center;
    }

    .rule-details-actions button:hover {
      background-color: #d8d8d8;
    }

    .rule-details-footer {
      background-color: #e8f1ff;
      padding: 10px 20px;
      border-top: 1px solid #d0d0d0;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>

<body class="rule-details-page">
  <div class="rule-details-container">
    <aside class="rule-details-sidebar">
      <h6>DataEntry</h6>
      <a href="#" id="goBackLink">Go Back</a>

      <h6>Rule Details</h6>
      <a href="#" class="active">Rule Details</a>
    </aside>

    <div class="rule-details-main">
      <div class="rule-details-header">
        <div class="form-group">
          <label for="event">Event</label>
          <select id="event" name="event" class="form-control">
            <option value="">--Select--</option>
          </select>
        </div>
        <div class="form-group">
          <label for="productTypes">Product Types</label>
          <select id="productTypes" name="productTypes" class="form-control">
            <option value="">--Select--</option>
          </select>
        </div>
      </div>

      <div class="rule-details-content">
        <div class="rule-details-section">
          <div class="rule-details-section-header">Rule Details</div>
          <div class="rule-details-section-body">
            <div class="rule-details-form-group">
              <label for="component">Component</label>
              <select id="component" name="component" class="form-control">
                <option value="">--Select--</option>
              </select>
            </div>

            <div class="rule-details-form-group">
              <label for="componentDetails">Component details</label>
              <input type="text" id="componentDetails" name="componentDetails" class="form-control"
                placeholder="" />
            </div>

            <div class="rule-details-form-group">
              <label for="debitAccountTag">Debit Account Tag</label>
              <select id="debitAccountTag" name="debitAccountTag" class="form-control">
                <option value="">--Select--</option>
              </select>
            </div>

            <div class="rule-details-form-group">
              <label for="creditAccountTag">Credit Account Tag</label>
              <select id="creditAccountTag" name="creditAccountTag" class="form-control">
                <option value="">--Select--</option>
              </select>
            </div>

            <div class="rule-details-form-group">
              <label for="narration">Narration</label>
              <input type="text" id="narration" name="narration" class="form-control" placeholder="" />
            </div>

            <div class="rule-details-buttons">
              <button type="button" class="btn-new">New</button>
              <button type="button" class="btn-alter">Alter</button>
              <button type="button" class="btn-remove">Remove</button>
              <button type="button" class="btn-update">Update</button>
              <button type="button" class="btn-clear">Clear</button>
            </div>

            <div class="rule-details-table">
              <table>
                <thead>
                  <tr>
                    <th>Component</th>
                    <th>Debit Account Tag</th>
                    <th>Credit Account Tag</th>
                    <th>Debit Trx ID</th>
                    <th>Credit Trx ID</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="5" style="text-align: center; color: #999;">No Records To Display</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="rule-details-footer">
        BR.Net Web Banking
      </div>
    </div>

    <aside class="rule-details-actions">
      <button type="button" class="btn-view">View</button>
      <div style="height: 20px; display: flex; align-items: center; justify-content: center;">
        <small style="color: #666;">Order</small>
      </div>
      <button type="button" class="btn-close" id="closeBtn" title="Close and return to parent form">Close</button>
      <button type="button" class="btn-add">Add</button>
      <button type="button" class="btn-edit">Edit</button>
      <button type="button" class="btn-delete">Delete</button>
      <button type="button" class="btn-save">Save</button>
      <button type="button" class="btn-cancel">Cancel</button>
      <button type="button" class="btn-back" id="backBtn">Back</button>
    </aside>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/product-management/rule-details.embedded.js"></script>

</body>

</html>
