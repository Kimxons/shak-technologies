<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Documents</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/maincss.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    /* Enhanced table styling to match General Conditions grid */
    .table-responsive {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      padding: 16px;
    }

    #documentsTable {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 0;
    }

    #documentsTable thead th {
      background: #f8f9fa;
      color: #2c3e50;
      font-weight: 700;
      font-size: 11px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 2px solid #dee2e6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #documentsTable tbody td {
      padding: 14px 16px;
      font-size: 11px;
      color: #495057;
      border-bottom: 1px solid #e9ecef;
      background: white;
    }

    #documentsTable tbody tr:hover {
      background-color: #f8f9fa;
    }

    #documentsTable tbody tr:last-child td {
      border-bottom: none;
    }

    /* Checkbox styling */
    #documentsTable .bs-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
    }

    /* Column alignment */
    #documentsTable th:nth-child(2),
    #documentsTable th:nth-child(3),
    #documentsTable td:nth-child(2),
    #documentsTable td:nth-child(3) {
      text-align: center;
    }

    /* Remove section header collapse styling */
    .form-section {
      margin-bottom: 0;
    }

    .section-content {
      padding: 0;
    }
  </style>
</head>

<body>
  <div class="window">
    <!-- Header -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-file-earmark am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Product Documents</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window">
          <i class="bi bi-square"></i>
        </button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container" aria-label="Product Documents form">
      <!-- Form Content -->
      <div class="form-content" role="region" aria-label="Product Documents form">
        <div class="form-card" data-main-form>
          <!-- Product Documents Section -->
          <div class="form-section" data-section="documents-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-file-earmark"></i> Product Documents</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Product Documents" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="table-responsive">
                <table class="table table-sm table-hover data-grid-table" id="documentsTable">
                  <thead>
                    <tr>
                      <th>Description</th>
                      <th style="width: 120px; text-align: center;">IsApplicable</th>
                      <th style="width: 120px; text-align: center;">Is Mandatory</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Data will be populated from backend -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action" id="editBtn">
            <i class="bi bi-pencil me-1"></i>Edit
          </button>
          <button type="button" class="btn-action" id="saveBtn">
            <i class="bi bi-floppy me-1"></i>Save
          </button>
          <button type="button" class="btn-action" id="cancelBtn">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <button type="button" class="btn-action" id="backBtn" data-action="back">
            <i class="bi bi-arrow-left"></i>Back
          </button>
        </div>
      </div>
    </main>

    <!-- Message Panel -->
    <div class="am-message-panel" id="messagePanel" hidden></div>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/product-management/product-documents.embedded.js"></script>
  <script>
    // Section toggle functionality
    document.querySelectorAll('[data-section-toggle]').forEach(header => {
      header.addEventListener('click', () => {
        const section = header.closest('.form-section');
        const toggleBtn = header.querySelector('.section-toggle-btn');
        const isCollapsed = section.classList.toggle('collapsed');
        if (toggleBtn) {
          toggleBtn.setAttribute('aria-expanded', !isCollapsed);
        }
      });
    });

    // Row selection
    document.querySelectorAll('.data-grid__row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.type !== 'checkbox') {
          document.querySelectorAll('.data-grid__row').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
        }
      });
    });

    // Window control actions
    document.querySelectorAll('.am-header__right [data-action]').forEach(btn => {
      const action = btn.getAttribute('data-action');
      btn.addEventListener('click', () => {
        if (action === 'refresh') window.location.reload();
        else if (action === 'maximize') {
          const windowEl = document.querySelector('.window');
          const isMaximized = windowEl.classList.toggle('maximized');
          btn.querySelector('i').className = isMaximized ? 'bi bi-fullscreen-exit' : 'bi bi-square';
          btn.title = isMaximized ? 'Restore' : 'Maximize';
        } else if (action === 'close') {
          goBack();
        }
      });
    });

    // Back button handler
    function goBack() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'close-child' }, '*');
      }
      const overlay = window.parent?.document?.querySelector('[data-child-overlay]');
      if (overlay) {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
      }
      if (window.history.length > 1) {
        window.history.back();
      }
    }

    document.getElementById('backBtn')?.addEventListener('click', goBack);
  </script>
</body>

</html>
