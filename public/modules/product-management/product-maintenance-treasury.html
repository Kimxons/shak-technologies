<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products Maintenance - Treasury · Product</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>
  <div class="cm-workspace">
    <form id="product-maintenance-treasury-form" class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">DataEntry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item"><span>Product GL Interface</span></button>
            <button type="button" class="cm-legacy-nav__item"><span>Product Documents</span></button>
            <button type="button" class="cm-legacy-nav__item"><span>User Defined Fields</span></button>
            <button type="button" class="cm-legacy-nav__item"><span>Product Charges</span></button>
          </div>
        </div>
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">Recent Activities</span>
            <i class="bi bi-chevron-right"></i>
          </button>
          <div class="cm-nav-items is-collapsed">
          </div>
        </div>
      </aside>

      <section class="cm-legacy-content">

        <div class="cm-scroll-region">
          <section class="card-surface">
            <div class="p-3">

              <!-- Main Product Fields -->
              <div class="kairo-grid-4">
                <div class="kairo-field">
                  <label class="label-blue">Product</label>
                  <div style="display: flex; gap: 4px;">
                    <input type="text" class="bs-input-text" style="flex: 1;">
                    <button class="btn-lookup" aria-label="Lookup Product"><i class="bi bi-search"></i></button>
                  </div>
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Treasury Product Type</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Currency</label>
                  <div style="display: flex; gap: 4px;">
                    <input type="text" class="bs-input-text" style="flex: 1;">
                    <button class="btn-lookup" aria-label="Lookup Currency"><i class="bi bi-search"></i></button>
                  </div>
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Product Category</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Product Code</label>
                  <input type="text" class="bs-input-text">
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Valid From</label>
                  <input type="date" class="bs-input-text" value="0001-01-01">
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Accounting Rule</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Valid To</label>
                  <input type="date" class="bs-input-text" value="0001-01-01">
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Account Class ID</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label class="label-blue">Customer Restriction</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>
              </div>

              <!-- Is Credit Interest Procedure Applicable Section -->
              <div class="section-header">
                <input type="checkbox" id="isCreditInterestApplicable" class="bs-checkbox me-2">
                <label for="isCreditInterestApplicable" style="cursor: pointer; margin: 0;"><i class="bi bi-percent"></i> CREDIT INTEREST PROCEDURE</label>
              </div>

              <div class="kairo-grid-4">
                <div class="kairo-field">
                  <label>Day Count Basis</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Interest Rounding</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Tax Rule</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Int. Accrual Frequency</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Int. Appl. Frequency</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <div class="checkbox-row">
                    <input type="checkbox" id="isInterestTaxable" class="bs-checkbox">
                    <label for="isInterestTaxable">Is Interest Taxable</label>
                  </div>
                </div>

                <div class="kairo-field">
                  <div class="checkbox-row">
                    <input type="checkbox" id="accrueInterest" class="bs-checkbox">
                    <label for="accrueInterest">Accrue Interest</label>
                  </div>
                </div>
              </div>

              <!-- Is Debit Interest Procedure Applicable Section -->
              <div class="section-header">
                <input type="checkbox" id="isDebitInterestApplicable" class="bs-checkbox me-2">
                <label for="isDebitInterestApplicable" style="cursor: pointer; margin: 0;"><i class="bi bi-percent"></i> DEBIT INTEREST PROCEDURE</label>
              </div>

              <div class="kairo-grid-4">
                <div class="kairo-field">
                  <label>Day Count Basis</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Interest Rounding</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Tax Rule</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Int. Accrual Frequency</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <label>Int. Appl. Frequency</label>
                  <select class="bs-select">
                    <option>--Select--</option>
                  </select>
                </div>

                <div class="kairo-field">
                  <div class="checkbox-row">
                    <input type="checkbox" id="isInterestTaxableDebit" class="bs-checkbox">
                    <label for="isInterestTaxableDebit">Is Interest Taxable</label>
                  </div>
                </div>

                <div class="kairo-field">
                  <div class="checkbox-row">
                    <input type="checkbox" id="accrueInterestDebit" class="bs-checkbox">
                    <label for="accrueInterestDebit">Accrue Interest</label>
                  </div>
                </div>
              </div>

              <!-- Product Settings Section -->
              <div class="section-header">
                <input type="checkbox" id="productSettings" class="bs-checkbox me-2">
                <label for="productSettings" style="cursor: pointer; margin: 0;"><i class="bi bi-gear"></i> PRODUCT SETTINGS</label>
              </div>

              <div class="kairo-grid-4">
                <!-- Product settings fields will be added here -->
              </div>

            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Mode switch</p>
          <button type="button" class="cm-shell__action">View</button>
          <button type="button" class="cm-shell__action">Add</button>
          <button type="button" class="cm-shell__action">Edit</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger">Delete</button>
        </div>
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Workflow</p>
          <button type="button" class="cm-shell__action cm-shell__action--success">Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger">Cancel</button>
        </div>
      </aside>
    </form>
  </div></body>
</body>

</html>
