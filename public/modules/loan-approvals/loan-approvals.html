<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approvals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <form id="loanApprovalsForm" novalidate>
                        <!-- Application Information Section -->
                        <div class="form-section" data-section="application-info">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-info-circle"></i> Application Information</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Application Information" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label class="label-blue">Branch ID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="branchId" class="kairo-branch-control__id" aria-label="Branch ID">
                                            <input type="text" id="branchDescription" class="kairo-branch-control__name" placeholder="Branch Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchBranchBtn" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label>Reference No.</label>
                                        <input type="text" id="referenceNo" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col"></div>
                                    <div class="col"></div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>WorkFlow Type ID</label>
                                        <div class="kairo-control" data-kairo-control>
                                            <input type="text" id="workflowTypeId" class="kairo-control__id" aria-label="WorkFlow Type ID">
                                            <input type="text" id="workflowTypeName" class="kairo-control__name" placeholder="Workflow Name" readonly>
                                            <button type="button" class="btn-lookup kairo-control__lookup" id="searchWorkflowBtn" aria-label="Search Workflow"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Application ID</label>
                                        <div class="kairo-control" data-kairo-control>
                                            <input type="text" id="applicationId" class="kairo-control__id" aria-label="Application ID">
                                            <input type="text" id="applicationName" class="kairo-control__name" placeholder="Application Name" readonly>
                                            <button type="button" class="btn-lookup kairo-control__lookup" id="searchApplicationBtn" aria-label="Search Application"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label>Application Date</label>
                                        <input type="text" id="applicationDate" class="bs-input-text" placeholder="dd mmm yyyy" readonly>
                                    </div>
                                    <div class="col"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Recommendation Details Section -->
                        <div class="form-section" data-section="recommendation-details">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-clipboard-check"></i> Recommendation Details</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Recommendation Details" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <!-- Applied vs Recommended Comparison Table -->
                                <table class="table table-bordered table-sm mb-3">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width: 25%"></th>
                                            <th style="width: 25%">Applied</th>
                                            <th style="width: 25%">Recommended</th>
                                            <th style="width: 25%"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><label class="label-blue">Loan Amount</label></td>
                                            <td><input type="text" id="loanAmountApplied" class="bs-input-text" placeholder="0.00" readonly></td>
                                            <td><input type="text" id="loanAmountRecommended" class="bs-input-text" placeholder="0.00"></td>
                                            <td></td>
                                        </tr>
                                        <tr>
                                            <td><label class="label-blue">Term</label></td>
                                            <td><input type="text" id="termApplied" class="bs-input-text" placeholder="0" readonly></td>
                                            <td><input type="text" id="termRecommended" class="bs-input-text" placeholder="0"></td>
                                            <td><span class="text-muted">(Month(s))</span></td>
                                        </tr>
                                        <tr>
                                            <td><label>Repayment Frequency</label></td>
                                            <td><input type="text" id="repaymentFrequencyApplied" class="bs-input-text" readonly></td>
                                            <td>
                                                <select id="repaymentFrequencyRecommended" class="bs-select">
                                                    <option value="">-- Select --</option>
                                                    <option value="daily">Daily</option>
                                                    <option value="weekly">Weekly</option>
                                                    <option value="monthly">Monthly</option>
                                                    <option value="quarterly">Quarterly</option>
                                                    <option value="yearly">Yearly</option>
                                                </select>
                                            </td>
                                            <td></td>
                                        </tr>
                                        <tr>
                                            <td><label class="label-blue">Repayment Term</label></td>
                                            <td><input type="text" id="repaymentTermApplied" class="bs-input-text" placeholder="0" readonly></td>
                                            <td><input type="text" id="repaymentTermRecommended" class="bs-input-text" placeholder="0"></td>
                                            <td></td>
                                        </tr>
                                        <tr>
                                            <td><label class="label-blue">Approved Amount</label></td>
                                            <td><input type="text" id="approvedAmountApplied" class="bs-input-text" placeholder="0.00" readonly></td>
                                            <td><input type="text" id="approvedAmountRecommended" class="bs-input-text" placeholder="0.00"></td>
                                            <td></td>
                                        </tr>
                                        <tr>
                                            <td><label>Marking Rate</label></td>
                                            <td>
                                                <div class="d-flex gap-1 align-items-center">
                                                    <input type="text" id="markingRateApplied" class="bs-input-text" style="width: 80px" placeholder="0.00" readonly>
                                                    <span>()</span>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="d-flex gap-1 align-items-center">
                                                    <select id="markingRateSign" class="bs-select" style="width: 50px">
                                                        <option value="+">+</option>
                                                        <option value="-">-</option>
                                                    </select>
                                                    <input type="text" id="markingRateRecommended" class="bs-input-text" style="flex: 1" placeholder="0.00">
                                                </div>
                                            </td>
                                            <td>
                                                <label>Interest Rate Type</label>
                                                <input type="text" id="interestRateType" class="bs-input-text" placeholder="Interest Rate Type" readonly>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td><label>Interest Rate</label></td>
                                            <td><input type="text" id="interestRateApplied" class="bs-input-text" placeholder="0.00" readonly></td>
                                            <td><input type="text" id="interestRateRecommended" class="bs-input-text" placeholder="0.00"></td>
                                            <td>
                                                <label>Base Rate</label>
                                                <input type="text" id="baseRate" class="bs-input-text" placeholder="0.00" readonly>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td><label class="label-blue">Account Class</label></td>
                                            <td>
                                                <input type="text" id="accountClassApplied" class="bs-input-text" readonly>
                                            </td>
                                            <td>
                                                <select id="accountClassRecommended" class="bs-select">
                                                    <option value="">--Select--</option>
                                                </select>
                                            </td>
                                            <td>
                                                <label>Loan Type</label>
                                                <input type="text" id="loanType" class="bs-input-text" placeholder="Loan Type" readonly>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td><label>Remarks</label></td>
                                            <td colspan="3"><input type="text" id="remarks" class="bs-input-text" placeholder="Enter remarks"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Approval Details Section -->
                        <div class="form-section" data-section="approval-details">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-check2-square"></i> Approval Details</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Approval Details" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-bordered table-sm" id="approvalDetailsTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Role ID</th>
                                                <th>Upper Limit</th>
                                                <th>Appraised By</th>
                                                <th>Appraised On</th>
                                                <th>Appraised Amount</th>
                                                <th>Remarks</th>
                                            </tr>
                                        </thead>
                                        <tbody id="approvalDetailsTableBody">
                                            <tr>
                                                <td colspan="6" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Behind The Scene Section -->
                        <div class="form-section" data-section="behind-the-scene">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-eye-slash"></i> Behind The Scene</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Client ID</label>
                                        <div class="kairo-control" data-kairo-control>
                                            <input type="text" id="clientId" class="kairo-control__id" readonly>
                                            <input type="text" id="clientName" class="kairo-control__name" placeholder="Client Name" readonly>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label>Mailing Address</label>
                                        <input type="text" id="mailingAddress" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label>City</label>
                                        <input type="text" id="city" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Phone</label>
                                        <input type="text" id="phone" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Product ID</label>
                                        <input type="text" id="productId" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Currency ID</label>
                                        <input type="text" id="currencyId" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Collateral Value</label>
                                        <input type="text" id="collateralValue" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label>No Of Guarantors</label>
                                        <input type="text" id="noOfGuarantors" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Calculation Method</label>
                                        <input type="text" id="calculationMethod" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Application Status</label>
                                        <input type="text" id="applicationStatus" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col"></div>
                                    <div class="col"></div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Action Panel -->
            <div class="action-panel">
                <!-- Navigation Arrows -->
                <div class="nav-group mb-3">
                    <span class="nav-group__title">Navigate</span>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" class="btn-nav-arrow" id="navPrevBtn" title="Previous Record">
                            <i class="bi bi-arrow-left-circle-fill"></i>
                        </button>
                        <button type="button" class="btn-nav-arrow" id="navNextBtn" title="Next Record">
                            <i class="bi bi-arrow-right-circle-fill"></i>
                        </button>
                    </div>
                </div>
                
                <div class="action-panel__header">Actions</div>
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-view" id="viewBtn">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action" id="editBtn">
                        <i class="bi bi-pencil"></i>
                        <span>Edit</span>
                    </button>
                    <button type="button" class="btn-action btn-cancel" id="rejectBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Reject</span>
                    </button>
                    <button type="button" class="btn-action btn-save" id="approveBtn">
                        <i class="bi bi-check-circle"></i>
                        <span>Approve</span>
                    </button>
                    <button type="button" class="btn-action" id="cancelBtn">
                        <i class="bi bi-x-lg"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/auth/auth.config.js"></script>
    <script src="../../assets/js/auth/auth.service.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../../assets/js/services/search/branchSearchService.js"></script>
    <script src="loan-approvals.js"></script>
</body>
</html>
