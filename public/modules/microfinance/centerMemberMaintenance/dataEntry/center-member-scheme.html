
<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Center Member Scheme · Data Entry</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
	<link rel="stylesheet" href="../../../../assets/css/styles.css" />

	<style>
		/* Center Member Scheme: lookup modal styling (EXACT SearchModal colors used by Account Maintenance SearchService) */
		body[data-page="center-maintenance"] {
			--cms-searchmodal-bar-bg: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
			--cms-searchmodal-grid-head-bg: linear-gradient(to bottom, #4a90e2, #357abd);
			--cms-searchmodal-grid-head-border: #2868ab;
			--cms-searchmodal-row-even: #e8f4ff;
			--cms-searchmodal-row-hover: #d0e8ff;
			--cms-searchmodal-btn-bg: #e0e0e0;
			--cms-searchmodal-btn-border: #999;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .modal-header.bg-primary,
		body[data-page="center-maintenance"] #cmsLookupModal .modal-footer.bg-primary {
			background: var(--cms-searchmodal-bar-bg) !important;
			border-color: #e0e0e0 !important;
			color: #ffffff !important;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .modal-title {
			color: #ffffff !important;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .cms-lookup__table thead tr {
			background: var(--cms-searchmodal-grid-head-bg) !important;
			color: #ffffff !important;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .cms-lookup__table thead th {
			background: transparent !important;
			color: #ffffff !important;
			border-color: var(--cms-searchmodal-grid-head-border) !important;
			font-weight: 600;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .cms-lookup__table thead th:first-child {
			width: 40px;
			text-align: center;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .cms-lookup__table tbody td:first-child {
			text-align: center;
			font-weight: 600;
			color: #111827;
		}

		/* Zebra striping: 1st row white, 2nd row blueish (match SearchModal) */
		body[data-page="center-maintenance"] #cmsLookupModal .cms-lookup__table.table-striped > tbody > tr:nth-of-type(odd) > * {
			background-color: #ffffff !important;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .cms-lookup__table.table-striped > tbody > tr:nth-of-type(even) > * {
			background-color: var(--cms-searchmodal-row-even) !important;
		}

		body[data-page="center-maintenance"] #cmsLookupModal .cms-lookup__table tbody tr:hover > * {
			background-color: var(--cms-searchmodal-row-hover) !important;
		}

		/* Match SearchModal grey buttons (Search + OK) */
		body[data-page="center-maintenance"] #cmsLookupModal #cmsLookupAdvancedSearchBtn,
		body[data-page="center-maintenance"] #cmsLookupModal .modal-footer.bg-primary .btn {
			padding: 6px 28px !important;
			background: var(--cms-searchmodal-btn-bg) !important;
			border: 1px solid var(--cms-searchmodal-btn-border) !important;
			border-radius: 3px !important;
			cursor: pointer;
			font-size: 13px !important;
			font-weight: 500 !important;
			color: #111827 !important;
			box-shadow: none !important;
		}

		body[data-page="center-maintenance"] #cmsLookupModal #cmsLookupAdvancedSearchBtn:hover {
			background: #d5d5d5 !important;
		}
	</style>
</head>

<body class="center-maintenance copilot-theme" data-page="center-maintenance">
	<div class="window" aria-label="Center Member Scheme">
		<div class="title-bar" role="banner" aria-label="Window title bar">
			<div class="title-bar-left">
				<i class="bi bi-ui-checks-grid title-icon" aria-hidden="true"></i>
				<span class="title-text">Center Member Scheme</span>
			</div>
			<div class="title-bar-right" role="toolbar" aria-label="Window controls">
				<button type="button" class="title-btn refresh" aria-label="Refresh">
					<i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
				</button>
				<button type="button" class="title-btn" aria-label="Maximize">
					<i class="bi bi-square" aria-hidden="true"></i>
				</button>
				<button type="button" class="title-btn close" data-dataentry-close aria-label="Close">
					<i class="bi bi-x-lg" aria-hidden="true"></i>
				</button>
			</div>
		</div>

		<main class="main-container" aria-label="Center Member Scheme">
			<div class="form-content" role="region" aria-label="Center Member Scheme form">
				<div class="form-card" data-main-form>
					<div class="form-section" data-section="scheme-details">
						<div class="section-header" data-section-toggle aria-expanded="true">
							<span class="section-header__title"><i class="bi bi-ui-checks-grid" aria-hidden="true"></i>Center Member Scheme</span>
							<button type="button" class="section-toggle-btn" aria-label="Toggle Center Member Scheme" aria-expanded="true">
								<i class="bi bi-chevron-up" aria-hidden="true"></i>
							</button>
						</div>
						<div class="section-content" data-section-content>
							<form class="row g-1" aria-label="Scheme details">
								<div class="col-12">
									<label for="SchemeId" class="form-label label-blue">Scheme ID <span class="text-danger">*</span></label>
									<div class="kairo-control" data-kairo-control>
										<input type="text" id="SchemeId" name="SchemeId" class="kairo-control__id" aria-label="Scheme ID" placeholder="Scheme ID" />
										<input type="text" id="SchemeName" name="SchemeName" class="kairo-control__name" aria-label="Scheme Name" placeholder="Scheme Name" readonly />
										<button type="button" class="btn-lookup kairo-control__lookup" aria-label="Lookup scheme" data-cms-lookup="scheme">
											<i class="bi bi-search" aria-hidden="true"></i>
										</button>
									</div>
								</div>

								<div class="col-12 col-lg-4">
									<label for="PrimaryCollateral" class="form-label">Primary Collateral</label>
									<input class="form-control" id="PrimaryCollateral" name="PrimaryCollateral" />
								</div>

								<div class="col-12 col-lg-4">
									<label for="CollateralRatio" class="form-label">Collateral Ratio</label>
									<input class="form-control" id="CollateralRatio" name="CollateralRatio" />
								</div>

								<div class="col-12 col-lg-4">
									<label for="SavingsAmount" class="form-label">Savings Amount</label>
									<input class="form-control" id="SavingsAmount" name="SavingsAmount" />
								</div>

								<div class="col-12 col-lg-4">
									<label for="SecondaryCollateral" class="form-label">Secondary Collateral</label>
									<input class="form-control" id="SecondaryCollateral" name="SecondaryCollateral" />
								</div>

								<div class="col-12 col-lg-4">
									<label for="AdditionalCollateral" class="form-label">Additional Collateral</label>
									<input class="form-control" id="AdditionalCollateral" name="AdditionalCollateral" />
								</div>

								<div class="col-12 col-lg-4">
									<label for="JoinDate" class="form-label">Join Date</label>
									<input class="form-control" id="JoinDate" name="JoinDate" placeholder="dd-MMM-yyyy" />
								</div>

								<div class="col-12 col-lg-6">
									<label for="LoanLevelNo" class="form-label label-blue">Loan Level No <span class="text-danger">*</span></label>
									<input class="form-control" id="LoanLevelNo" name="LoanLevelNo" />
								</div>

								<div class="col-12 col-lg-6">
									<label for="Status" class="form-label label-blue">Status <span class="text-danger">*</span></label>
									<select class="form-select" id="Status" name="Status">
										<option selected>--Select--</option>
										<option>Active</option>
										<option>Inactive</option>
									</select>
								</div>
							</form>
						</div>
					</div>

					<div class="form-section" data-section="behind-the-scene">
						<div class="section-header" data-section-toggle aria-expanded="true">
							<span class="section-header__title"><i class="bi bi-activity" aria-hidden="true"></i>Behind The Scene</span>
							<button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
								<i class="bi bi-chevron-up" aria-hidden="true"></i>
							</button>
						</div>
						<div class="section-content" data-section-content>
							<div class="behind-scene" aria-label="Behind The Scene">
								<form class="row g-1">
									<div class="col-12 col-lg-3">
										<label for="LoanAccountId" class="form-label">Loan Account ID</label>
										<input class="form-control" id="LoanAccountId" name="LoanAccountId" disabled />
									</div>

									<div class="col-12 col-lg-3">
										<label for="LoanProductId" class="form-label">Loan Product ID</label>
										<input class="form-control" id="LoanProductId" name="LoanProductId" disabled />
									</div>

									<div class="col-12 col-lg-3">
										<label for="SavingAccountId" class="form-label">Saving Account ID</label>
										<input class="form-control" id="SavingAccountId" name="SavingAccountId" disabled />
									</div>

									<div class="col-12 col-lg-3">
										<label for="SavingProductId" class="form-label">Saving Product ID</label>
										<input class="form-control" id="SavingProductId" name="SavingProductId" disabled />
									</div>

									<div class="col-12 col-lg-3">
										<label for="CycleNo" class="form-label">Cycle No</label>
										<input class="form-control" id="CycleNo" name="CycleNo" disabled />
									</div>

									<div class="col-12 col-lg-3">
										<label for="CreatedBy" class="form-label">Created By</label>
										<input class="form-control" id="CreatedBy" name="CreatedBy" disabled />
									</div>

									<div class="col-12 col-lg-3">
										<label for="ModifiedBy" class="form-label">Modified By</label>
										<input class="form-control" id="ModifiedBy" name="ModifiedBy" disabled />
									</div>

									<div class="col-12 col-lg-3">
										<label for="SupervisedBy" class="form-label">Supervised By</label>
										<input class="form-control" id="SupervisedBy" name="SupervisedBy" disabled />
									</div>

									<div class="col-12 col-lg-4">
										<label for="CreatedOn" class="form-label">Created On</label>
										<input class="form-control" id="CreatedOn" name="CreatedOn" disabled />
									</div>

									<div class="col-12 col-lg-4">
										<label for="ModifiedOn" class="form-label">Modified On</label>
										<input class="form-control" id="ModifiedOn" name="ModifiedOn" disabled />
									</div>

									<div class="col-12 col-lg-4">
										<label for="SupervisedOn" class="form-label">Supervised On</label>
										<input class="form-control" id="SupervisedOn" name="SupervisedOn" disabled />
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>

			<aside class="action-panel" aria-label="Actions">
				<div class="nav-group" aria-label="Record navigation">
					<button type="button" class="btn-nav" data-cms-nav="previous" aria-label="Previous Record" disabled>
						<i class="bi bi-chevron-left" aria-hidden="true"></i>
					</button>
					<span>Record</span>
					<button type="button" class="btn-nav" data-cms-nav="next" aria-label="Next Record" disabled>
						<i class="bi bi-chevron-right" aria-hidden="true"></i>
					</button>
				</div>

				<div class="action-buttons">
					<button type="button" class="btn-action btn-view" data-cms-de-action="view" disabled>
						<i class="bi bi-eye me-1" aria-hidden="true"></i>View
					</button>
					<button type="button" class="btn-action" data-cms-de-action="add">
						<i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Add
					</button>
					<button type="button" class="btn-action" data-cms-de-action="edit" disabled>
						<i class="bi bi-pencil me-1" aria-hidden="true"></i>Edit
					</button>
					<button type="button" class="btn-action btn-delete" data-cms-de-action="delete" disabled>
						<i class="bi bi-trash me-1" aria-hidden="true"></i>Delete
					</button>
					<button type="button" class="btn-action btn-save" data-cms-de-action="save" disabled>
						<i class="bi bi-check-circle me-1" aria-hidden="true"></i>Save
					</button>
					<button type="button" class="btn-action btn-cancel" data-cms-de-action="cancel" data-dataentry-close>
						<i class="bi bi-x-circle me-1" aria-hidden="true"></i>Cancel
					</button>
					<button type="button" class="btn-action btn-cancel" data-cms-de-action="back" data-dataentry-close>
						<i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back
					</button>
				</div>
			</aside>
		</main>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="../../../../assets/js/pages/microfinance/centerMemberMaintenance/dataEntry/center-member-scheme.embedded.js"></script>
	<script src="../../../../assets/js/environment.js"></script>
	<script src="../../../../assets/js/services/shared/coreApi.js"></script>
	<script src="../../../../assets/js/services/microfinance/groupMemberMaintenanceService.js"></script>
	<script src="../../../../assets/js/pages/microfinance/centerMemberMaintenance/dataEntry/center-member-scheme.js"></script>
</body>

</html>
