    /* Center Member Maintenance: lookup modal styling (EXACT SearchModal colors used by Account Maintenance SearchService) */
    body[data-page="center-member-maintenance"] {
      --cmm-searchmodal-bar-bg: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
      --cmm-searchmodal-grid-head-bg: linear-gradient(to bottom, #4a90e2, #357abd);

      --cmm-searchmodal-row-even: #e8f4ff;
      --cmm-searchmodal-row-hover: #d0e8ff;
      --cmm-searchmodal-btn-bg: #e0e0e0;
      --cmm-searchmodal-btn-border: #999;
    }

    body[data-page="center-member-maintenance"] #lookupModal .modal-header.bg-primary,
    body[data-page="center-member-maintenance"] #lookupModal .modal-footer.bg-primary {
      background: var(--cmm-searchmodal-bar-bg) !important;
      border-color: #e0e0e0 !important;
      color: #ffffff !important;
    }

    body[data-page="center-member-maintenance"] #lookupModal .modal-title {
      color: #ffffff !important;
    }

    body[data-page="center-member-maintenance"] #lookupModal .cmm-lookup__table thead tr {
      background: var(--cmm-searchmodal-grid-head-bg) !important;
      color: #ffffff !important;
    }

    body[data-page="center-member-maintenance"] #lookupModal .cmm-lookup__table thead th {
      background: transparent !important;
      color: #ffffff !important;
      border-color: var(--cmm-searchmodal-grid-head-border) !important;
      font-weight: 600;
    }

    body[data-page="center-member-maintenance"] #lookupModal .cmm-lookup__table thead th:first-child {
      width: 40px;
      text-align: center;
    }

    body[data-page="center-member-maintenance"] #lookupModal .cmm-lookup__table tbody td:first-child {
      text-align: center;
      font-weight: 600;
      color: #111827;
    }

    /* Zebra striping: 1st row white, 2nd row blueish (match SearchModal) */
    body[data-page="center-member-maintenance"] #lookupModal .cmm-lookup__table.table-striped > tbody > tr:nth-of-type(odd) > * {
      background-color: #ffffff !important;
    }

    body[data-page="center-member-maintenance"] #lookupModal .cmm-lookup__table.table-striped > tbody > tr:nth-of-type(even) > * {
      background-color: var(--cmm-searchmodal-row-even) !important;
    }

    body[data-page="center-member-maintenance"] #lookupModal .cmm-lookup__table tbody tr:hover > * {
      background-color: var(--cmm-searchmodal-row-hover) !important;
    }

    /* Match SearchModal grey buttons (Search + OK) */
    body[data-page="center-member-maintenance"] #lookupModal #lookupSearchBtn,
    body[data-page="center-member-maintenance"] #lookupModal #lookupAdvancedSearchBtn,
    body[data-page="center-member-maintenance"] #lookupModal .modal-footer.bg-primary .btn {
      padding: 6px 28px !important;
      background: var(--cmm-searchmodal-btn-bg) !important;
      border: 1px solid var(--cmm-searchmodal-btn-border) !important;
      border-radius: 3px !important;
      cursor: pointer;
      font-size: 13px !important;
      font-weight: 500 !important;
      color: #111827 !important;
      box-shadow: none !important;
    }

    body[data-page="center-member-maintenance"] #lookupModal #lookupSearchBtn:hover,
    body[data-page="center-member-maintenance"] #lookupModal #lookupAdvancedSearchBtn:hover {
      background: #d5d5d5 !important;
    }

    /* Docked inline DataEntry (Account Maintenance-style; replaces modal popup) */
    body.cmm-inline-open {
      overflow: hidden;
    }

    #centerMemberMaintenanceDataEntryModal.cmm-dataentry-inline {
      position: fixed;
      left: var(--de-left, 0px);
      top: var(--de-top, 0px);
      width: var(--de-width, 800px);

      background: #ffffff;

    /* Submodule Title Bar (match main window title-bar look) */
    #centerMemberMaintenanceDataEntryModal.cmm-dataentry-inline {

    #centerMemberMaintenanceDataEntryModal.cmm-dataentry-inline .cmm-de-titlebar {

      right: 0;
      top: 0;

  <script>
    (function () {
      let closeDockedDataEntry = null;
      let activeDockedFrameWindow = null;

      // Allow embedded submodule pages to request closing (they send { type: 'kairo-dataentry-close' })
      window.addEventListener('message', (evt) => {
        try {
          if (!evt || !evt.data || evt.data.type !== 'kairo-dataentry-close') return;
          if (activeDockedFrameWindow && evt.source !== activeDockedFrameWindow) return;
          closeDockedDataEntry?.();
        } catch {
          // ignore
        }
      });

      function ensureCenterMemberSchemeMenuItem() {
        const menu = document.getElementById('menu-dataentry');
        if (!menu) return;
        const existing = menu.querySelector('[data-cmm-open="dataEntry/center-member-scheme.html"]');
        if (existing) return;

        menu.insertAdjacentHTML(
          'beforeend',
          '<div class="sidebar-item sidebar-item--enhanced menu-item" data-cmm-open="dataEntry/center-member-scheme.html" data-tooltip="Center Member Scheme">' +
            '<div class="sidebar-item__content">' +
              '<i class="bi bi-people-fill sidebar-item__icon"></i>' +
              '<div class="sidebar-item__text">' +
                '<div class="sidebar-item__title">Center Member Scheme</div>' +
                '<div class="sidebar-item__description">Manage member schemes</div>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }

      function setSectionOpen(sectionEl, isOpen) {
        if (!sectionEl) return;
        sectionEl.classList.toggle('is-open', Boolean(isOpen));
        sectionEl.classList.toggle('expanded', Boolean(isOpen));

        const toggle = sectionEl.querySelector('.menu-arrow');
        const items = sectionEl.querySelector('.menu-items');

        if (toggle) {
          toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          const icon = toggle.querySelector('i');
          if (icon) icon.className = isOpen ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
        }

        if (items) {
          if (items.id === 'menu-dataentry') ensureCenterMemberSchemeMenuItem();
          items.hidden = !isOpen;
          items.style.display = '';
        }
      }

      function wireNavSections() {
        const sections = Array.from(document.querySelectorAll('[data-nav-section]'));
        if (!sections.length) return;

        sections.forEach((section) => {
          const header = section.querySelector('.nav-header--card');
          if (!header) return;

          header.addEventListener('click', (e) => {
            if (e.target?.closest?.('.nav-badge')) return;

            const sidebar = document.getElementById('main-sidebar');
            const mainContainer = document.querySelector('.main-container');
            const toggleBtn = document.getElementById('sidebarToggle');
            const isCollapsed = sidebar && sidebar.classList.contains('collapsed');

            // If sidebar is collapsed, expand it first and open this section
            if (isCollapsed) {
              sidebar.classList.remove('collapsed');
              if (mainContainer) mainContainer.classList.remove('sidebar-collapsed');
              if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
              // Restore submenu visibility based on current open state
              sections.forEach((s) => setSectionOpen(s, false));
              setSectionOpen(section, true);
              return;
            }

            const willOpen = !section.classList.contains('is-open');
            sections.forEach((s) => setSectionOpen(s, false));
            setSectionOpen(section, willOpen);
          });
        });

        // ensure initial state is consistent with markup
        sections.forEach((section) => {
          const toggle = section.querySelector('.menu-arrow');
          const initialOpen = toggle?.getAttribute('aria-expanded') === 'true';
          setSectionOpen(section, Boolean(initialOpen));
        });
      }

      function wireSidebarToggle() {
        const sidebar = document.getElementById('main-sidebar');
        const toggle = document.getElementById('sidebarToggle');
        const mainContainer = document.querySelector('.main-container');
        const sections = Array.from(document.querySelectorAll('[data-nav-section]'));
        if (!sidebar || !toggle) return;

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          e.preventDefault();

          const isCollapsed = sidebar.classList.contains('collapsed');
          if (isCollapsed) {
            // Expanding
            sidebar.classList.remove('collapsed');
            if (mainContainer) mainContainer.classList.remove('sidebar-collapsed');
            toggle.setAttribute('aria-expanded', 'true');

            // Restore submenu visibility: only show for open section
            sections.forEach((section) => {
              const isOpen = section.classList.contains('is-open');
              setSectionOpen(section, isOpen);
            });
          } else {
            // Collapsing
            sidebar.classList.add('collapsed');
            if (mainContainer) mainContainer.classList.add('sidebar-collapsed');
            toggle.setAttribute('aria-expanded', 'false');

            // When collapsed, show all nav-items (icon-only mode) like Account Maintenance
            document.querySelectorAll('.menu-items').forEach((items) => {
              if (items.id === 'menu-dataentry') ensureCenterMemberSchemeMenuItem();
              items.hidden = false;
              items.style.display = '';
            });
          }
        });
      }

      function wireSubmoduleSearch() {
        const searchInput = document.getElementById('submoduleSearch');
        const clearButton = document.getElementById('submoduleSearchClear');
        if (!searchInput) return;

        const toggleClearVisibility = () => {
          if (!clearButton) return;
          const hasValue = Boolean(String(searchInput.value || '').trim());
          clearButton.classList.toggle('is-visible', hasValue);
          clearButton.setAttribute('aria-hidden', hasValue ? 'false' : 'true');
        };

        const applySubmoduleFilter = () => {
          const searchTerm = String(searchInput.value || '').toLowerCase().trim();
          const allItems = document.querySelectorAll('.sidebar-item--enhanced[data-cmm-open]');
          const sections = Array.from(document.querySelectorAll('[data-nav-section]'));

          ensureCenterMemberSchemeMenuItem();

          allItems.forEach((item) => {
            const title = item.querySelector('.sidebar-item__title')?.textContent?.toLowerCase?.() || '';
            const description = item.querySelector('.sidebar-item__description')?.textContent?.toLowerCase?.() || '';
            const matches = !searchTerm || title.includes(searchTerm) || description.includes(searchTerm);
            item.style.display = matches ? '' : 'none';
          });

          sections.forEach((section) => {
            const items = section.querySelectorAll('.sidebar-item--enhanced[data-cmm-open]');
            const visibleItems = Array.from(items).filter((item) => item.style.display !== 'none');
            const navItems = section.querySelector('.menu-items');

            if (!navItems) return;

            if (searchTerm) {
              if (visibleItems.length > 0) {
                setSectionOpen(section, true);
                navItems.style.display = '';
              } else {
                setSectionOpen(section, false);
                navItems.style.display = 'none';
              }
            } else {
              navItems.style.display = '';
              // When search is cleared, collapse all sections (Account Maintenance behavior)
              setSectionOpen(section, false);
            }
          });

          toggleClearVisibility();
        };

        searchInput.addEventListener('input', applySubmoduleFilter);
        if (clearButton) {
          clearButton.addEventListener('click', () => {
            if (!searchInput.value) return;
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input', { bubbles: true }));
            searchInput.focus();
          });
          toggleClearVisibility();
        }
      }

      // Init sidebar behavior
      ensureCenterMemberSchemeMenuItem();
      wireNavSections();
      wireSidebarToggle();
      wireSubmoduleSearch();

      // Section toggle (form sections)
      document.querySelectorAll('[data-section-toggle]').forEach((header) => {
        header.addEventListener('click', (e) => {
          // prevent double-toggling when clicking the button inside
          const isButton = e.target?.closest?.('.section-toggle-btn');
          if (isButton && e.currentTarget !== header) return;
          const section = header.closest('.form-section');
          const content = section?.querySelector('[data-section-content]');
          const toggle = header.querySelector('.section-toggle-btn');
          if (!content || !toggle) return;
          const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
          if (isExpanded) {
            content.style.display = 'none';
            toggle.setAttribute('aria-expanded', 'false');
            toggle.querySelector('i').className = 'bi bi-chevron-down';
          } else {
            content.style.display = 'block';
            toggle.setAttribute('aria-expanded', 'true');
            toggle.querySelector('i').className = 'bi bi-chevron-up';
          }
        });
      });

      // DataEntry open (event delegation so dynamically inserted items also work)
      document.querySelector('.sidebar-content')?.addEventListener('click', (e) => {
        const item = e.target?.closest?.('[data-cmm-open]');
        if (!item) return;
        e.preventDefault();

        function dockDataEntryModal(modalEl) {
          try {
            const sidebar = document.getElementById('main-sidebar') || document.querySelector('.sidebar');
            const actionPanel = document.querySelector('.action-panel');
            const windowEl = document.querySelector('.window') || document.body;
            if (!sidebar || !actionPanel || !windowEl) return;

            const sidebarRect = sidebar.getBoundingClientRect();
            const actionRect = actionPanel.getBoundingClientRect();
            const windowRect = windowEl.getBoundingClientRect();

            // Left edge starts immediately after submenu ends
            const left = Math.round(sidebarRect.right);
            // Top/height aligns to the master window container
            const top = Math.round(windowRect.top);
            const height = Math.round(windowRect.height);
            // Width spans: master center-data width + master button-bar width
            const width = Math.max(320, Math.round(actionRect.right - sidebarRect.right));

            modalEl.style.setProperty('--de-left', `${left}px`);
            modalEl.style.setProperty('--de-top', `${top}px`);
            modalEl.style.setProperty('--de-width', `${width}px`);
            modalEl.style.setProperty('--de-height', `${height}px`);
          } catch (err) {
            console.warn('[CenterMemberMaintenance] Failed to dock DataEntry modal:', err);
          }
        }

        // Check if user is in Add or Edit mode
        const formState = window.currentFormState;
        if (formState !== 'edit') {
          window.showToast('Please load a record in View Mode before accessing this module.', 'warning');
          return;
        }

        // Validate required fields before opening Center Member Scheme
        const referenceNoInput = document.getElementById('ReferenceNo');
        const seriesInput = document.getElementById('Series');
        const clientIdInput = document.getElementById('ClientId');
        const clientNameInput = document.getElementById('ClientName');

        const referenceNo = String(referenceNoInput?.value || '').trim();
        const series = String(seriesInput?.value || '').trim();
        const clientId = String(clientIdInput?.value || '').trim();
        const clientName = String(clientNameInput?.value || '').trim();

        if (!referenceNo || !series || !clientId || !clientName) {
          window.showToast('Please ensure all required fields (Reference No, Series, Client ID, and Client Name) are filled in the master screen before accessing this module.', 'warning');
          return;
        }

        const url = item.getAttribute('data-cmm-open');
        const modalEl = document.getElementById('centerMemberMaintenanceDataEntryModal');
        const frame = document.getElementById('centerMemberMaintenanceDataEntryFrame');
        if (!modalEl || !frame || !url) return;

        // Close any previous docked submodule
        if (typeof closeDockedDataEntry === 'function') {
          closeDockedDataEntry();
        }

        dockDataEntryModal(modalEl);

        // Set the overlay title like Account Maintenance (use sidebar item title)
        const titleText = String(item.querySelector('.sidebar-item__title')?.textContent || '').trim() || 'Submodule';
        const titleEl = modalEl.querySelector('[data-cmm-de-title]');
        if (titleEl) titleEl.textContent = titleText;

        frame.src = url;
        modalEl.hidden = false;
        document.body.classList.add('cmm-inline-open');
        activeDockedFrameWindow = frame.contentWindow;

        // Highlight current submodule in sidebar
        document
          .querySelectorAll('.sidebar-item--enhanced[data-cmm-open].active')
          .forEach((el) => el.classList.remove('active'));
        item.classList.add('active');

        const onResize = () => dockDataEntryModal(modalEl);
        const onKeyDown = (evt) => {
          if (evt.key === 'Escape') {
            evt.preventDefault();
            closeDockedDataEntry?.();
          }
        };

        const closeBtn = modalEl.querySelector('[data-cmm-de-close]');
        const onCloseClick = (evt) => {
          evt.preventDefault();
          closeDockedDataEntry?.();
        };

        window.addEventListener('resize', onResize);
        document.addEventListener('keydown', onKeyDown);
        closeBtn?.addEventListener('click', onCloseClick);

        closeDockedDataEntry = () => {
          try {
            window.removeEventListener('resize', onResize);
            document.removeEventListener('keydown', onKeyDown);
            closeBtn?.removeEventListener('click', onCloseClick);
          } catch {
            // ignore
          }

          // Clear submodule highlight so it's obvious we're back on master
          document
            .querySelectorAll('.sidebar-item--enhanced[data-cmm-open].active')
            .forEach((el) => el.classList.remove('active'));

          frame.src = 'about:blank';
          modalEl.hidden = true;
          document.body.classList.remove('cmm-inline-open');
          closeDockedDataEntry = null;
          activeDockedFrameWindow = null;
        };
      });
    })();
  </script>
</body>
</html>
