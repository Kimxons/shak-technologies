<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Loan/Disbursement-Reversal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201">
    <style>
        /* Center Loan Disbursement Reversal: Modern kairo-control styling (match Center Penalty) */
        body[data-page="center-loan-disbursement-reversal"] {
            --cldr-control-height: 30px;
            --cldr-control-font-size: 13px;
            --cldr-control-pad-y: 5px;
            --cldr-control-pad-x: 8px;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control {
            display: flex;
            gap: 0;
            align-items: stretch;
            background: #ffffff;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            overflow: hidden;
            min-height: var(--cldr-control-height);
            height: var(--cldr-control-height);
            padding: 0;
            box-sizing: border-box;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control > input[type="text"] {
            width: 100%;
            min-height: var(--cldr-control-height);
            height: var(--cldr-control-height) !important;
            min-height: 0;
            padding: var(--cldr-control-pad-y) var(--cldr-control-pad-x);
            border: none !important;
            box-shadow: none !important;
            outline: none;
            font-size: var(--cldr-control-font-size);
            background: #ffffff;
            margin: 0;
            display: block;
            align-self: stretch;
            line-height: 1.2;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control__id {
            flex: 0 0 45%;
            border-right: 1px solid #d0d0d0;
            background: #ffffff;
            align-self: stretch;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control__id:focus {
            outline: none;
            box-shadow: none;
            background: #f5f5f5;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control__name {
            flex: 1;
            background: #f9f9f9;
            color: #666;
            align-self: stretch;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control__name:focus {
            outline: none;
            box-shadow: none;
            background: #f5f5f5;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control .btn-lookup {
            flex: 0 0 var(--cldr-control-height);
            width: var(--cldr-control-height);
            height: var(--cldr-control-height);
            padding: 0;
            border: none;
            border-left: 1px solid #d0d0d0;
            background: #f5f5f5;
            color: #0f6ba7;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
            margin: 0;
            border-radius: 0;
            align-self: stretch;
            transition: all 0.2s ease;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control .btn-lookup i {
            pointer-events: none;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control .btn-lookup:hover {
            background: #e8e8e8;
            color: #0f4d7d;
        }

        body[data-page="center-loan-disbursement-reversal"] .kairo-control .btn-lookup:active {
            background: #d5d5d5;
        }

        /* SearchModal styling for Group Search (cldr-group prefix) */
        .cldr-group-modal {
            --modal-header-bg: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
            --modal-table-header-bg: linear-gradient(to bottom, #4a90e2, #357abd);
            --zebra-color: #e8f4ff;
            --zebra-hover: #d0e8ff;
            --btn-color: #e0e0e0;
        }

        .cldr-group-modal .modal-header {
            background: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
            color: white;
            padding: 16px 20px;
            border: none;
        }

        .cldr-group-modal .modal-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .cldr-group-modal .btn-close-white {
            filter: brightness(0) invert(1);
        }

        .cldr-group-modal .modal-body {
            padding: 0;
        }

        .cldr-group-modal .search-filters {
            padding: 16px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
        }

        .cldr-group-modal .search-filters .row {
            gap: 12px;
        }

        .cldr-group-modal .search-filters .col {
            flex: 1;
        }

        .cldr-group-modal .search-filters label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            display: block;
            font-weight: 500;
        }

        .cldr-group-modal .search-filters input,
        .cldr-group-modal .search-filters select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
            background: white;
        }

        .cldr-group-modal .search-filters input:focus,
        .cldr-group-modal .search-filters select:focus {
            outline: none;
            border-color: #1e7cc4;
            box-shadow: 0 0 0 3px rgba(30, 124, 196, 0.1);
        }

        .cldr-group-modal .btn-search {
            background: #0f6ba7;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            align-self: flex-end;
        }

        .cldr-group-modal .btn-search:hover {
            background: #0a4d75;
        }

        .cldr-group-modal .btn-cancel {
            background: #f5f5f5;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            padding: 8px 20px;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cldr-group-modal .btn-cancel:hover {
            background: #ffebee;
        }

        .cldr-group-modal .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .cldr-group-modal .results-table thead {
            background: linear-gradient(to bottom, #4a90e2, #357abd);
            color: white;
        }

        .cldr-group-modal .results-table thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            border: none;
        }

        .cldr-group-modal .results-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        .cldr-group-modal .results-table tbody tr:nth-child(even) {
            background-color: #e8f4ff;
        }

        .cldr-group-modal .results-table tbody tr:hover {
            background-color: #d0e8ff !important;
            cursor: pointer;
        }

        .cldr-group-modal .results-table tbody tr.selected {
            background-color: #bfe0ff !important;
        }

        .cldr-group-modal .results-table tbody td {
            padding: 10px 16px;
            color: #333;
        }

        .cldr-group-modal .modal-footer {
            background: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
            padding: 12px 20px;
            border: none;
            text-align: center;
        }

        .cldr-group-modal .btn-ok {
            background: #e0e0e0;
            color: #333;
            border: 1px solid #999;
            padding: 8px 24px;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cldr-group-modal .btn-ok:hover {
            background: #d5d5d5;
        }

        .cldr-group-modal .btn-ok:active {
            background: #c5c5c5;
        }
    </style>
</head>
<body data-page="center-loan-disbursement-reversal">
    <!-- Toast Container -->
    <div class="kairo-toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="window">
        <div class="main-container no-sidebar">

            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <!-- Search Details Section -->
                    <div class="form-section" data-section="search-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-search"></i>Search Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Search Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Branch ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="branchId" class="kairo-control__id" aria-label="Branch ID" placeholder="Branch ID" value="0101">
                                        <input type="text" id="branchName" class="kairo-control__name" placeholder="Branch Name" readonly aria-label="Branch Name">
                                        <button type="button" class="btn-lookup" data-search="branch" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Center ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="centerId" class="kairo-control__id" aria-label="Center ID" placeholder="Center ID">
                                        <input type="text" id="centerName" class="kairo-control__name" placeholder="Center Name" readonly aria-label="Center Name">
                                        <button type="button" class="btn-lookup" data-search="center" aria-label="Search Center"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Group ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="groupId" class="kairo-control__id" aria-label="Group ID" placeholder="Group ID">
                                        <input type="text" id="groupName" class="kairo-control__name" placeholder="Group Name" readonly aria-label="Group Name">
                                        <button type="button" class="btn-lookup" data-search="group" aria-label="Search Group"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Scheme ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="schemeId" class="kairo-control__id" aria-label="Scheme ID" placeholder="Scheme ID">
                                        <input type="text" id="schemeName" class="kairo-control__name" placeholder="Scheme Name" readonly aria-label="Scheme Name">
                                        <button type="button" class="btn-lookup" data-search="scheme" aria-label="Search Scheme"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Group Loan Accounts Section -->
                    <div class="form-section" data-section="loan-accounts">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-table"></i>Group Loan Accounts</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Group Loan Accounts" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table id="loanAccountsTable" class="table table-sm table-hover table-bordered align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width: 40px;"><input type="checkbox" class="bs-checkbox" id="selectAll" onclick="handleSelectAll()"></th>
                                            <th>Client ID</th>
                                            <th>Client Name</th>
                                            <th>Application ID</th>
                                            <th>Loan Account ID</th>
                                            <th class="text-end">Loan Amount</th>
                                            <th class="text-end">Disbursed Amount</th>
                                            <th>Disbursed By</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="8" class="text-center text-muted py-4">No records to display</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Cancellation Reason Section -->
                    <div class="form-section" data-section="cancellation-reason">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-x-circle"></i>Cancellation Reason</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Cancellation Reason" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Reason</label>
                                    <select id="cancellationReason" class="bs-select" aria-label="Cancellation Reason">
                                        <option value="">Select Reason</option>
                                        <option value="operational">Operational Mistake</option>
                                        <option value="wrongCenter">Wrong Center</option>
                                        <option value="duplicate">Duplicate Disbursement</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Remarks</label>
                                    <input type="text" id="remarks" class="bs-input-text" placeholder="Enter remarks" aria-label="Remarks">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Behind The Scene Section -->
                    <div class="form-section behind-scene" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Product ID</label>
                                    <input type="text" id="productId" class="bs-input-text" placeholder="Product ID" readonly aria-label="Product ID">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Currency ID</label>
                                    <input type="text" id="currencyId" class="bs-input-text" placeholder="Currency ID" readonly aria-label="Currency ID">
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Reversal Type</label>
                                    <input type="text" id="reversalType" class="bs-input-text" placeholder="Reversal Type" readonly aria-label="Reversal Type">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Disbursement Type</label>
                                    <input type="text" id="disbursementType" class="bs-input-text" placeholder="Disbursement Type" readonly aria-label="Disbursement Type">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button class="btn-action action-button view underline" data-action="view" title="View"><i class="bi bi-eye me-1"></i>View</button>
                    <button class="btn-action action-button edit" data-action="edit" title="Edit"><i class="bi bi-pencil me-1"></i>Edit</button>
                    <button class="btn-action action-button save" data-action="save" title="Save"><i class="bi bi-floppy me-1"></i>Save</button>
                    <button class="btn-action action-button cancel" data-action="cancel" title="Cancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SearchModal containers (SearchModal mounts into <body>, these are left as semantic anchors) -->
    <div id="cldr-branch-modal-container"></div>
    <div id="cldr-center-modal-container"></div>
    <div id="cldr-group-modal-container"></div>
    <div id="cldr-scheme-modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="center-loan-disbursement-reversal-new.js?v=20260203"></script>
    <script>
        // Initialize sidebar toggle and section interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('main-sidebar');
            
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    const isExpanded = !sidebar.classList.contains('collapsed');
                    sidebarToggle.setAttribute('aria-expanded', isExpanded);
                });
            }

            // Nav section toggles
            document.querySelectorAll('.nav-arrow--card').forEach(arrow => {
                arrow.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const section = this.closest('.nav-section');
                    const items = section.querySelector('.nav-items--card');
                    const isOpen = section.classList.toggle('is-open');
                    
                    this.setAttribute('aria-expanded', isOpen);
                    items.hidden = !isOpen;
                    
                    const icon = this.querySelector('i');
                    icon.className = isOpen ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
                });
            });

            // Section toggles for form sections
            document.querySelectorAll('[data-section-toggle]').forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.closest('.form-section');
                    const content = section.querySelector('[data-section-content]');
                    const btn = this.querySelector('.section-toggle-btn');
                    const icon = btn.querySelector('i');
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    
                    btn.setAttribute('aria-expanded', !isExpanded);
                    content.hidden = isExpanded;
                    icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
                });
            });

            // Sidebar item click handlers
            document.querySelectorAll('.sidebar-item[data-dataentry]').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
