<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
  <style>
    /* Visual indication for selected products */
    .product-row--selected {
      background: linear-gradient(135deg, rgba(25, 135, 84, 0.08) 0%, rgba(25, 135, 84, 0.04) 100%) !important;
      border-left: 3px solid #198754;
    }
    
    .product-row--selected td {
      font-weight: 500;
    }
    
    .product-row--selected td:first-child {
      padding-left: calc(0.5rem - 3px); /* Adjust for border */
    }
    
    /* Checked checkbox styling */
    .product-row--selected .form-check-input:checked {
      background-color: #198754;
      border-color: #198754;
    }
    
    .product-row--selected .form-check-input:checked:disabled {
      background-color: #198754;
      border-color: #198754;
      opacity: 0.8;
    }
    
    /* Default product indicator */
    .product-row--default {
      background: linear-gradient(135deg, rgba(13, 110, 253, 0.08) 0%, rgba(13, 110, 253, 0.04) 100%) !important;
    }
    
    .product-row--selected.product-row--default {
      background: linear-gradient(135deg, rgba(25, 135, 84, 0.12) 0%, rgba(13, 110, 253, 0.06) 100%) !important;
    }
    
    /* Row hover in edit mode */
    .products-edit-mode .product-row--editable:hover {
      background-color: rgba(0, 0, 0, 0.05) !important;
      cursor: pointer;
    }
    
    /* Non-editable rows in edit mode */
    .products-edit-mode .product-row--locked {
      opacity: 0.7;
    }
    
    .products-edit-mode .product-row--locked td {
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div class="window">
    <!-- Header -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-box-seam am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Products</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data" id="btnRefresh">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window" id="btnClose">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container" aria-label="Products form">
      <!-- Form Content -->
      <div class="form-content" role="region" aria-label="Products form">
        <div class="form-card" data-main-form>
          <!-- Products Table Section -->
          <div class="form-section" data-section="products">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-box-seam"></i>Products</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Products" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="table-responsive mw-100">
                <table class="table table-sm table-hover table-striped align-middle mb-0 w-100">
                  <thead>
                    <tr>
                      <th scope="col" class="text-center col-1"></th>
                      <th scope="col">Product Type</th>
                      <th scope="col">Product ID</th>
                      <th scope="col">Description</th>
                      <th scope="col">Is Default</th>
                    </tr>
                  </thead>
                  <tbody id="productsTableBody">
                    <!-- Products will be loaded dynamically from API -->
                    <tr>
                      <td colspan="5" class="text-center text-muted py-4">
                        <i class="bi bi-hourglass-split fs-2 d-block mb-2"></i>
                        Loading products...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Audit Section -->
          <div class="form-section" data-section="audit">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-row">
                <div class="audit-item">
                  <label class="label-blue">Created By</label>
                  <input type="text" class="bs-input-text" id="ClpCreatedBy" name="ClpCreatedBy" disabled />
                </div>
                <div class="audit-item">
                  <label class="label-blue">Supervised By</label>
                  <input type="text" class="bs-input-text" id="ClpSupervisedBy" name="ClpSupervisedBy" disabled />
                </div>
              </div>
              <div class="audit-row">
                <div class="audit-item">
                  <label class="label-blue">Created On</label>
                  <input type="text" class="bs-input-text" id="ClpCreatedOn" name="ClpCreatedOn" disabled />
                </div>
                <div class="audit-item">
                  <label class="label-blue">Supervised On</label>
                  <input type="text" class="bs-input-text" id="ClpSupervisedOn" name="ClpSupervisedOn" disabled />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action" id="btnEdit" data-clp-action="edit" title="Edit">
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button type="button" class="btn-action" id="btnSave" data-clp-action="save" title="Save" disabled>
            <i class="bi bi-check-lg"></i>Save
          </button>
          <button type="button" class="btn-action btn-cancel" id="btnCancel" data-clp-action="cancel" title="Cancel">
            <i class="bi bi-x-lg"></i>Cancel
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container for notifications -->
  <div class="kairo-toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../../assets/js/utils/global-utils.js"></script>
  <script src="../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../common/toast-messages/toast-messages.js"></script>
  <script src="products.js"></script>
</body>

</html>
