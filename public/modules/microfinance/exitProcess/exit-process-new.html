<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exit Process · MicroFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201">

    <style>
        /* Exit Process: lookup modal styling (match Center Member Maintenance SearchModal look) */
        body[data-page="exit-process"] {
            --ep-searchmodal-bar-bg: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
            --ep-searchmodal-grid-head-bg: linear-gradient(to bottom, #4a90e2, #357abd);
            --ep-searchmodal-grid-head-border: #2868ab;
            --ep-searchmodal-row-even: #e8f4ff;
            --ep-searchmodal-row-hover: #d0e8ff;
            --ep-searchmodal-btn-bg: #e0e0e0;
            --ep-searchmodal-btn-border: #999;
        }

        body[data-page="exit-process"] #epLookupModal .modal-header.bg-primary,
        body[data-page="exit-process"] #epLookupModal .modal-footer.bg-primary {
            background: var(--ep-searchmodal-bar-bg) !important;
            border-color: #e0e0e0 !important;
            color: #ffffff !important;
        }

        body[data-page="exit-process"] #epLookupModal .modal-title {
            color: #ffffff !important;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table thead tr {
            background: var(--ep-searchmodal-grid-head-bg) !important;
            color: #ffffff !important;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table thead th {
            background: transparent !important;
            color: #ffffff !important;
            border-color: var(--ep-searchmodal-grid-head-border) !important;
            font-weight: 600;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table thead th:first-child {
            width: 40px;
            text-align: center;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table tbody td:first-child {
            text-align: center;
            font-weight: 600;
            color: #111827;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table.table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: #ffffff !important;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table.table-striped > tbody > tr:nth-of-type(even) > * {
            background-color: var(--ep-searchmodal-row-even) !important;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table tbody tr:hover > * {
            background-color: var(--ep-searchmodal-row-hover) !important;
        }

        body[data-page="exit-process"] #epLookupModal #epLookupSearchBtn,
        body[data-page="exit-process"] #epLookupModal .modal-footer.bg-primary .btn {
            padding: 6px 28px !important;
            background: var(--ep-searchmodal-btn-bg) !important;
            border: 1px solid var(--ep-searchmodal-btn-border) !important;
            border-radius: 3px !important;
            cursor: pointer;
            font-size: 13px !important;
            font-weight: 500 !important;
            color: #111827 !important;
            box-shadow: none !important;
        }

        body[data-page="exit-process"] #epLookupModal #epLookupSearchBtn:hover,
        body[data-page="exit-process"] #epLookupModal .modal-footer.bg-primary .btn:hover {
            background: #d5d5d5 !important;
        }

        body[data-page="exit-process"] #epLookupModal .ep-lookup__table tbody tr {
            cursor: pointer;
        }

        /* Exit Process: action panel uses Print in the nav slot */
        body[data-page="exit-process"] .action-panel .nav-group {
            width: 100%;
        }
        body[data-page="exit-process"] .action-panel .nav-group .btn-action {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Exit Process: 3-column form rows for Client Details */
        body[data-page="exit-process"] .form-row.ep-three-col {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 16px;
            row-gap: 12px;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        body[data-page="exit-process"] .form-row.ep-three-col > .col {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            min-width: 0;
        }

        body[data-page="exit-process"] .form-row.ep-three-col > .col label {
            min-width: 0;
            text-align: left;
            padding-right: 0;
        }

        @media (max-width: 992px) {
            body[data-page="exit-process"] .form-row.ep-three-col {
                grid-template-columns: 1fr;
            }
        }

        /* Exit Details: 4-column rows (match legacy layout) */
        body[data-page="exit-process"] .form-row.ep-four-col {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            column-gap: 16px;
            row-gap: 12px;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        body[data-page="exit-process"] .form-row.ep-four-col > .col {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            min-width: 0;
        }

        body[data-page="exit-process"] .form-row.ep-four-col > .col label {
            min-width: 0;
            text-align: left;
            padding-right: 0;
        }

        @media (max-width: 1200px) {
            body[data-page="exit-process"] .form-row.ep-four-col {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 768px) {
            body[data-page="exit-process"] .form-row.ep-four-col {
                grid-template-columns: 1fr;
            }
        }

        /* Exit Process: transactions grids + portfolio layout */
        body[data-page="exit-process"] .ep-grid-title {
            background: linear-gradient(90deg, var(--primary, #4A90E2) 0%, var(--primary-dark, #357ABD) 100%);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 12px;
            border: 1px solid rgba(53, 122, 189, 0.9);
            border-bottom: none;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            letter-spacing: 0.01em;
        }

        body[data-page="exit-process"] .ep-grid-wrap {
            border: 1px solid #c7d3e3;
            border-top: none;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            overflow: hidden;
            background: #fff;
        }

        body[data-page="exit-process"] .ep-grid-wrap table {
            margin-bottom: 0;
        }

        body[data-page="exit-process"] .ep-grid-wrap thead th {
            background: #f0f6ff;
            border-bottom: 1px solid #c7d3e3;
            font-weight: 600;
            font-size: 13px;
        }

        body[data-page="exit-process"] .ep-grid-wrap tbody td {
            font-size: 13px;
        }

        body[data-page="exit-process"] .ep-total-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }

        body[data-page="exit-process"] .ep-total-row label {
            margin: 0;
            font-weight: 600;
            color: #111827;
        }

        body[data-page="exit-process"] .ep-portfolio {
            margin-top: 14px;
        }

        /* Make the portfolio section surface as crisp as the top panels */
        body[data-page="exit-process"] .ep-portfolio .section-content {
            background: #ffffff;
        }

        body[data-page="exit-process"] .ep-portfolio .ep-portfolio-inner {
            padding: 12px;
            background: #ffffff;
            border: 1px solid #c7d3e3;
            border-radius: 6px;
        }

        /* Portfolio: placeholders + disabled values should remain readable */
        body[data-page="exit-process"] .ep-portfolio input::placeholder {
            color: rgba(17, 24, 39, 0.58);
            font-weight: 600;
        }

        body[data-page="exit-process"] .ep-portfolio input:disabled {
            opacity: 1;
            color: #111827;
            -webkit-text-fill-color: #111827;
        }

        body[data-page="exit-process"] .ep-portfolio .ep-portfolio-empty {
            visibility: hidden;
        }
    </style>
</head>
<body data-page="exit-process">
    <!-- Toast Container -->
    <div class="kairo-toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="window">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <div id="statusMsg" class="status-msg hidden" role="status" aria-live="polite">
                        <span class="status-text"></span>
                    </div>

                    <!-- Client Details Section -->
                    <div class="form-section" data-section="client-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-person"></i>Client Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Client Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>

                        <!-- Row 1: Branch / Center / Group -->
                        <div class="form-row ep-three-col">
                            <div class="col">
                                <label class="label-blue">Branch ID</label>
                                <div class="kairo-control" data-kairo-control>
                                    <input type="text" id="branchId" class="kairo-control__id" aria-label="Branch ID" placeholder="Branch ID">
                                    <input type="text" id="branchName" class="kairo-control__name" aria-label="Branch Name" placeholder="Branch Name" readonly>
                                    <button type="button" class="btn-lookup search-btn" data-ep-lookup="branch" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                </div>
                            </div>

                            <div class="col">
                                <label class="label-blue">Center ID</label>
                                <div class="kairo-control" data-kairo-control>
                                    <input type="text" id="centerId" class="kairo-control__id" aria-label="Center ID" placeholder="Center ID">
                                    <input type="text" id="centerName" class="kairo-control__name" aria-label="Center Name" placeholder="Center Name" readonly>
                                    <button type="button" class="btn-lookup search-btn" data-ep-lookup="center" aria-label="Search Center"><i class="bi bi-search"></i></button>
                                </div>
                            </div>

                            <div class="col">
                                <label class="label-blue">Group ID</label>
                                <div class="kairo-control" data-kairo-control>
                                    <input type="text" id="groupId" class="kairo-control__id" aria-label="Group ID" placeholder="Group ID">
                                    <input type="text" id="groupName" class="kairo-control__name" aria-label="Group Name" placeholder="Group Name" readonly>
                                    <button type="button" class="btn-lookup search-btn" data-ep-lookup="group" aria-label="Search Group"><i class="bi bi-search"></i></button>
                                </div>
                            </div>
                        </div>

                        <!-- Row 2: Client / Exit Reason / Exit Date -->
                        <div class="form-row ep-three-col">
                            <div class="col">
                                <label class="label-blue">Client ID</label>
                                <div class="kairo-client-control" data-kairo-control>
                                    <input type="text" id="clientId" class="kairo-client-control__id" aria-label="Client ID" placeholder="Client ID">
                                    <input type="text" id="clientName" class="kairo-client-control__name" aria-label="Client Name" placeholder="Client Name" readonly>
                                    <button type="button" class="btn-lookup search-btn" data-ep-lookup="client" aria-label="Search Client"><i class="bi bi-search"></i></button>
                                </div>
                            </div>

                            <div class="col">
                                <label class="label-blue">Exit Reason</label>
                                <select id="exitReason" class="bs-select">
                                    <option value="">Select Reason</option>
                                    <option value="graduation">Graduation</option>
                                    <option value="voluntary">Voluntary Exit</option>
                                    <option value="deceased">Deceased</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="label-blue">Exit Date</label>
                                <input type="date" id="exitDate" class="bs-input-date">
                            </div>
                        </div>
                        </div>
                    </div>

                    <!-- Exit Details Section -->
                    <div class="form-section" data-section="exit-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-cash-stack"></i>Exit Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Exit Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <!-- Tab Navigation -->
                            <ul class="nav nav-tabs mb-3" id="exitDetailsTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="exitDetailsTab" data-bs-toggle="tab" data-bs-target="#exitDetailsPane" type="button" role="tab" aria-controls="exitDetailsPane" aria-selected="true">
                                        <i class="bi bi-file-text me-1"></i>Exit Details
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="forfeitDetailsTab" data-bs-toggle="tab" data-bs-target="#forfeitDetailsPane" type="button" role="tab" aria-controls="forfeitDetailsPane" aria-selected="false">
                                        <i class="bi bi-exclamation-triangle me-1"></i>Forfeit Details
                                    </button>
                                </li>
                            </ul>
                            
                            <!-- Tab Content -->
                            <div class="tab-content" id="exitDetailsTabContent">
                                <!-- Exit Details Tab -->
                                <div class="tab-pane fade show active" id="exitDetailsPane" role="tabpanel" aria-labelledby="exitDetailsTab">
                                    <div class="form-row ep-four-col">
                                        <div class="col">
                                            <label class="label-blue">Total Recoverable</label>
                                            <input type="number" id="totalRecoverable" class="bs-input-number" placeholder="0.00">
                                        </div>
                                        <div class="col">
                                            <label class="label-blue">Total Payable</label>
                                            <input type="number" id="totalPayable" class="bs-input-number" placeholder="0.00">
                                        </div>
                                        <div class="col">
                                            <label class="label-blue">Forfeit Savings</label>
                                            <input type="number" id="forfeitSavings" class="bs-input-number" placeholder="0.00">
                                        </div>
                                        <div class="col">
                                            <label class="label-blue">Forfeit Collateral</label>
                                            <input type="number" id="forfeitCollateral" class="bs-input-number" placeholder="0.00">
                                        </div>
                                    </div>

                                    <div class="form-row ep-four-col">
                                        <div class="col">
                                            <label class="label-blue">Charge-Off Loss</label>
                                            <input type="number" id="chargeOffLoss" class="bs-input-number" placeholder="0.00">
                                        </div>
                                        <div class="col">
                                            <label class="label-blue">Charge-Off Insurance</label>
                                            <input type="number" id="chargeOffInsurance" class="bs-input-number" placeholder="0.00">
                                        </div>
                                        <div class="col">
                                            <label class="label-blue">Net Payable</label>
                                            <input type="number" id="netPayable" class="bs-input-number" placeholder="0.00">
                                        </div>
                                        <div class="col">
                                            <label class="label-blue">Net Receivable</label>
                                            <input type="number" id="netReceivable" class="bs-input-number" placeholder="0.00">
                                        </div>
                                    </div>

                                    <!-- Transactions Panel (collapsible like standardized forms) -->
                                    <div class="form-section mt-3" id="accountsSection" data-section="transactions">
                                        <div class="section-header" data-section-toggle>
                                            <span class="section-header__title"><i class="bi bi-list-ul"></i>Transactions</span>
                                            <button type="button" class="section-toggle-btn" aria-label="Toggle Transactions" aria-expanded="true">
                                                <i class="bi bi-chevron-up"></i>
                                            </button>
                                        </div>
                                        <div class="section-content" data-section-content>
                                            <div class="table-responsive">
                                                <table class="table table-sm table-striped">
                                                    <thead>
                                                        <tr>
                                                            <th style="min-width: 140px;">Account ID</th>
                                                            <th style="min-width: 220px;">Account Name</th>
                                                            <th style="width: 120px;" class="text-end">Amount</th>
                                                            <th>TrxDescription</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="accountsBody"></tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Forfeit Details Tab -->
                                <div class="tab-pane fade" id="forfeitDetailsPane" role="tabpanel" aria-labelledby="forfeitDetailsTab">
                                    <!-- Forfeit Transactions Grid (Forfeit Tab) -->
                                    <div class="form-section mt-3" id="forfeitSection" data-section="forfeit-transactions">
                                        <div class="section-header" data-section-toggle>
                                            <span class="section-header__title"><i class="bi bi-exclamation-triangle"></i>Forfeit Details</span>
                                            <button type="button" class="section-toggle-btn" aria-label="Toggle Forfeit Details" aria-expanded="true">
                                                <i class="bi bi-chevron-up"></i>
                                            </button>
                                        </div>
                                        <div class="section-content" data-section-content>
                                            <div class="table-responsive">
                                                <table class="table table-sm table-striped">
                                                    <thead>
                                                        <tr>
                                                            <th style="width: 120px;">Account Type</th>
                                                            <th style="min-width: 160px;">Account ID</th>
                                                            <th>Description</th>
                                                            <th style="width: 140px;">Transaction Type</th>
                                                            <th style="width: 120px;" class="text-end">Amount</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="forfeitBody"></tbody>
                                                </table>
                                            </div>

                                            <div class="ep-total-row">
                                                <label for="totalForfeitAmount">Total Forfeit Amount</label>
                                                <input type="number" id="totalForfeitAmount" class="bs-input-number" style="width: 220px;" placeholder="0.00" readonly>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Client Portfolio Panel (collapsible) -->
                            <div class="form-section ep-portfolio" id="portfolioSection" data-section="client-portfolio">
                                <div class="section-header" data-section-toggle>
                                    <span class="section-header__title"><i class="bi bi-briefcase"></i>Client Portfolio</span>
                                    <button type="button" class="section-toggle-btn" aria-label="Toggle Client Portfolio" aria-expanded="true">
                                        <i class="bi bi-chevron-up"></i>
                                    </button>
                                </div>
                                <div class="section-content" data-section-content>
                                    <div class="ep-portfolio-inner">
                                        <div class="form-row ep-four-col">
                                            <div class="col">
                                                <label class="label-blue">Primary Collateral</label>
                                                <input type="number" id="primaryCollateral" class="bs-input-number" placeholder="0.00">
                                            </div>
                                            <div class="col">
                                                <label class="label-blue">Loan Balance</label>
                                                <input type="number" id="loanBalance" class="bs-input-number" placeholder="0.00">
                                            </div>
                                            <div class="col">
                                                <label class="label-blue">Credit Interest</label>
                                                <input type="number" id="creditInterest" class="bs-input-number" placeholder="0.00">
                                            </div>
                                            <div class="col">
                                                <label class="label-blue">Debit Interest</label>
                                                <input type="number" id="debitInterest" class="bs-input-number" placeholder="0.00">
                                            </div>
                                        </div>

                                        <div class="form-row ep-four-col">
                                            <div class="col">
                                                <label class="label-blue">Tax</label>
                                                <input type="number" id="tax" class="bs-input-number" placeholder="0.00">
                                            </div>
                                            <div class="col">
                                                <label class="label-blue">Others</label>
                                                <input type="number" id="others" class="bs-input-number" placeholder="0.00">
                                            </div>
                                            <div class="col">
                                                <label class="label-blue">Secondary Collateral</label>
                                                <input type="number" id="secondaryCollateral" class="bs-input-number" placeholder="0.00">
                                            </div>
                                            <div class="col">
                                                <label class="label-blue">Net Balance</label>
                                                <input type="number" id="netBalance" class="bs-input-number" placeholder="0.00">
                                            </div>
                                        </div>

                                        <div class="form-row ep-four-col">
                                            <div class="col">
                                                <label class="label-blue">Additional Collateral</label>
                                                <input type="number" id="additionalCollateral" class="bs-input-number" placeholder="0.00">
                                            </div>
                                            <div class="col ep-portfolio-empty"></div>
                                            <div class="col ep-portfolio-empty"></div>
                                            <div class="col ep-portfolio-empty"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="nav-group">
					<button class="btn-action" id="btnPrint" title="Print"><i class="bi bi-printer"></i>Print</button>
                </div>

                <div class="action-buttons">
                    <button class="btn-action underline" id="btnView" title="View"><i class="bi bi-eye me-1"></i>View</button>
                    <button class="btn-action" id="btnAdd" title="Add" hidden><i class="bi bi-plus-circle me-1"></i>Add</button>


                    <button class="btn-action" id="btnSave" title="Save"><i class="bi bi-floppy me-1"></i>Save</button>
                    <button class="btn-action" id="btnCancel" title="Cancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Generic Lookup Modal (Branch / Center / Group) -->
    <div class="modal fade" id="epLookupModal" tabindex="-1" aria-labelledby="epLookupModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary">
                    <h5 class="modal-title" id="epLookupModalLabel">Lookup</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="epLookupForm" class="row g-2 align-items-end">
                        <div class="col-5">
                            <label class="form-label" id="epLookupIdLabel">ID</label>
                            <input type="text" class="form-control form-control-sm" id="epLookupId" autocomplete="off">
                        </div>
                        <div class="col-1">
                            <label class="form-label">Mode</label>
                            <select class="form-select form-select-sm" id="epLookupIdMode" aria-label="ID search mode">
                                <option value="Like" selected>Like</option>
                                <option value="Exact">Exact</option>
                            </select>
                        </div>

                        <div class="col-5">
                            <label class="form-label" id="epLookupNameLabel">Name</label>
                            <input type="text" class="form-control form-control-sm" id="epLookupName" autocomplete="off">
                        </div>

                        <div class="col-1">
                            <label class="form-label">Mode</label>
                            <select class="form-select form-select-sm" id="epLookupNameMode" aria-label="Name search mode">
                                <option value="Like" selected>Like</option>
                                <option value="Exact">Exact</option>
                            </select>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn" id="epLookupSearchBtn"><i class="bi bi-search me-1"></i>Search</button>
                        </div>
                    </form>

                    <div class="small text-muted mt-2" id="epLookupMeta"></div>

                    <div class="table-responsive mt-2">
                        <table class="table table-striped table-sm ep-lookup__table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th id="epLookupCol1">ID</th>
                                    <th id="epLookupCol2">Name</th>
                                </tr>
