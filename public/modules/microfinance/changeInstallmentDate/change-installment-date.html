<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Installment Date · MicroFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201">
</head>
<body>
    <!-- Toast Container -->
    <div class="kairo-toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="window">
        <!-- Main Container -->
        <div class="main-container">

            <!-- Form Content -->
            <div class="form-content form-content-without-leftbar">
                <div class="form-card" data-main-form>
                    <!-- Identifiers Section -->
                    <div class="form-section" data-section="identifiers">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-info-square"></i>Identifiers</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Identifiers" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Branch ID</label>
                                    <div class="kairo-branch-control" data-kairo-control>
                                        <input type="text" id="BranchId" class="kairo-branch-control__id" aria-label="Branch ID" value="0101">
                                        <input type="text" id="BranchName" class="kairo-branch-control__name" aria-label="Branch Name" value="Head Office" readonly>
                                        <button type="button" class="btn-lookup" data-search="branch" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Center ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="CenterId" class="kairo-control__id" aria-label="Center ID" placeholder="Center ID">
                                        <input type="text" id="CenterName" class="kairo-control__name" aria-label="Center Name" placeholder="Center Name" readonly>
                                        <button type="button" class="btn-lookup" data-search="center" aria-label="Search Center"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <label class="label-blue">Scheme ID</label>
                                <div class="kairo-control" data-kairo-control>
                                    <input type="text" id="SchemeId" class="kairo-control__id" aria-label="Scheme ID" placeholder="Scheme ID">
                                    <input type="text" id="SchemeName" class="kairo-control__name" aria-label="Scheme Name" placeholder="Scheme Name" readonly>
                                    <button type="button" class="btn-lookup" data-search="scheme" aria-label="Search Scheme"><i class="bi bi-search"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Change Options Section -->
                    <div class="form-section" data-section="change-options">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-gear"></i>Change Options</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Change Options" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue d-flex align-items-center gap-2">
                                        <input type="radio" name="ChangeMode" value="holiday" class="bs-radio" checked>
                                        Marking Holiday
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Date</label>
                                    <input type="date" class="bs-input-date" id="InstallmentDate" placeholder="Select date">
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue d-flex align-items-center gap-2">
                                        <input type="radio" name="ChangeMode" value="meeting" class="bs-radio">
                                        Changing Meeting Day
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Day Of Week</label>
                                    <select class="bs-select" id="DayOfWeek">
                                        <option selected>--Select--</option>
                                        <option>Monday</option>
                                        <option>Tuesday</option>
                                        <option>Wednesday</option>
                                        <option>Thursday</option>
                                        <option>Friday</option>
                                        <option>Saturday</option>
                                        <option>Sunday</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Description</label>
                                    <input type="text" class="bs-input-text" id="Description" placeholder="Enter description">
                                </div>
                                <div class="col d-flex align-items-end">
                                    <button type="button" class="btn-action" id="btnGenerate">
                                        <i class="bi bi-play-circle me-1"></i>Generate
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Installment List Section -->
                    <div class="form-section" data-section="installment-list">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-list-ol"></i>Installment List</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Installment List" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table class="table table-striped table-hover" id="installmentTable">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Actual Inst Date</th>
                                            <th>New Inst Date</th>
                                            <th>Expected Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody id="installmentTableBody">
                                        <tr>
                                            <td colspan="3" class="text-center text-muted">No records to display.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Behind The Scene Section -->
                    <div class="form-section behind-scene" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-eye-slash"></i>Behind The Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Product ID</label>
                                    <input type="text" class="bs-input-text" id="ProductId" placeholder="Product ID" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Currency</label>
                                    <input type="text" class="bs-input-text" id="Currency" placeholder="Currency" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="nav-group">
                    <button class="btn-nav green" aria-label="Previous Scheme"><i class="bi bi-chevron-left"></i></button>
                    <span>Scheme</span>
                    <button class="btn-nav green" aria-label="Next Scheme"><i class="bi bi-chevron-right"></i></button>
                </div>

                <div class="action-buttons">
                    <button class="btn-action" data-action="save" title="Save"><i class="bi bi-floppy me-1"></i>Save</button>
                    <button class="btn-action" data-action="cancel" title="Cancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Modal (unified for Branch, Center, Scheme) -->
    <style>
      /* Search Modal Styling - Consistent Blue Gradient Theme */
      .cid-search-modal .modal-dialog {
        max-width: 900px;
        width: 90%;
      }
      .cid-search-modal .modal-header {
        background: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
        color: #fff;
        padding: 0.75rem 1rem;
        border-bottom: none;
      }
      .cid-search-modal .modal-title {
        font-weight: 600;
        font-size: 1rem;
      }
      .cid-search-modal .btn-close {
        filter: brightness(0) invert(1);
        opacity: 0.9;
      }
      .cid-search-modal .btn-close:hover {
        opacity: 1;
      }
      .cid-search-modal .modal-body {
        padding: 0;
        height: 500px;
        overflow: hidden;
      }
      .cid-search-modal .modal-body iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
    <div class="modal fade cid-search-modal" id="searchModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="searchModalTitle">Search</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <iframe id="searchModalFrame" title="Search" src="about:blank"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="change-installment-date.js"></script>
    <script>
        // Initialize sidebar toggle and section interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('main-sidebar');
            
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    const isExpanded = !sidebar.classList.contains('collapsed');
                    sidebarToggle.setAttribute('aria-expanded', isExpanded);
                });
            }

            // Nav section toggles
            document.querySelectorAll('.nav-arrow--card').forEach(arrow => {
                arrow.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const section = this.closest('.nav-section');
                    const items = section.querySelector('.nav-items--card');
                    const isOpen = section.classList.toggle('is-open');
                    
                    this.setAttribute('aria-expanded', isOpen);
                    items.hidden = !isOpen;
                    
                    const icon = this.querySelector('i');
                    icon.className = isOpen ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
                });
            });

            // Section toggles for form sections
            document.querySelectorAll('[data-section-toggle]').forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.closest('.form-section');
                    const content = section.querySelector('[data-section-content]');
                    const btn = this.querySelector('.section-toggle-btn');
                    const icon = btn.querySelector('i');
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    
                    btn.setAttribute('aria-expanded', !isExpanded);
                    content.hidden = isExpanded;
                    icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
                });
            });

            // Sidebar item click handlers
            document.querySelectorAll('.sidebar-item[data-dataentry]').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
