<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forfeit Recovery · MicroFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201">
</head>
<body>
    <!-- Toast Container -->
    <div class="kairo-toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="window">
        <!-- Main Container -->
        <div class="main-container">


            <!-- Form Content -->
            <div class="form-content form-content-without-leftbar">
                <div class="form-card" data-main-form>
                    <!-- Client Details Section -->
                    <div class="form-section" data-section="client-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-person"></i>Client Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Client Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Center ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="centerId" class="kairo-control__id" aria-label="Center ID" placeholder="Center ID">
                                        <input type="text" id="centerName" class="kairo-control__name" placeholder="Center Name" readonly aria-label="Center Name">
                                        <button type="button" class="btn-lookup" data-search="center" aria-label="Search Center"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Group ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="groupId" class="kairo-control__id" aria-label="Group ID" placeholder="Group ID">
                                        <input type="text" id="groupName" class="kairo-control__name" placeholder="Group Name" readonly aria-label="Group Name">
                                        <button type="button" class="btn-lookup" data-search="group" aria-label="Search Group"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Client ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="clientId" class="kairo-control__id" aria-label="Client ID" placeholder="Client ID">
                                        <input type="text" id="clientName" class="kairo-control__name" placeholder="Client Name" readonly aria-label="Client Name">
                                        <button type="button" class="btn-lookup" data-search="client" aria-label="Search Client"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Forfeit Recovery Details Section -->
                    <div class="form-section" data-section="forfeit-recovery-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-cash-coin"></i>Forfeit Recovery Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Forfeit Recovery Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Amount Recovered</label>
                                    <input type="number" id="amountRecovered" class="bs-input-number" placeholder="0.00" readonly aria-label="Amount Recovered">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Exchange Rate</label>
                                    <input type="number" id="exchangeRate" class="bs-input-number" placeholder="1.00" readonly aria-label="Exchange Rate">
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Credit Officer</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="creditOfficer" class="kairo-control__id" placeholder="Officer ID" readonly aria-label="Credit Officer ID">
                                        <input type="text" id="officerName" class="kairo-control__name" placeholder="Officer Name" readonly aria-label="Officer Name">
                                        <button type="button" class="btn-lookup" data-search="officer" aria-label="Search Officer"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Remarks</label>
                                    <input type="text" id="remarks" class="bs-input-text" placeholder="Enter remarks" readonly aria-label="Remarks">
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="d-flex align-items-center gap-2">
                                        <input class="bs-checkbox" type="checkbox" id="recoveredChargeOff" disabled>
                                        Recovered Against Charge Off
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex align-items-center gap-2">
                                        <input class="bs-checkbox" type="checkbox" id="recoveredForfeit" disabled>
                                        Recovered Against Forfeit
                                    </label>
                                </div>
                            </div>
                            <div class="form-row d-flex justify-content-end mt-2">
                                <button type="button" class="btn btn-primary btn-sm" id="btnContinue" onclick="handleContinue()">
                                    <i class="bi bi-arrow-right-circle me-1"></i>Continue
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Transaction Details Section -->
                    <div class="form-section" data-section="transaction-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-list-columns-reverse"></i>Transaction & Recovery Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Transaction Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <!-- Bootstrap Nav Tabs -->
                            <ul class="nav nav-tabs mb-3" id="detailsTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="transaction-tab" data-bs-toggle="tab" data-bs-target="#transaction-pane" type="button" role="tab" aria-controls="transaction-pane" aria-selected="true">
                                        <i class="bi bi-receipt me-1"></i>Transaction Details
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="recovery-tab" data-bs-toggle="tab" data-bs-target="#recovery-pane" type="button" role="tab" aria-controls="recovery-pane" aria-selected="false">
                                        <i class="bi bi-arrow-repeat me-1"></i>Recovery Details
                                    </button>
                                </li>
                            </ul>
                            <div class="tab-content" id="detailsTabContent">
                                <!-- Transaction Details Tab -->
                                <div class="tab-pane fade show active" id="transaction-pane" role="tabpanel" aria-labelledby="transaction-tab">
                                    <div class="table-responsive">
                                        <table id="transactionTable" class="table table-sm table-hover table-bordered align-middle mb-0">
                                            <thead class="table-light">
                                                <tr>
                                                    <th>Account Type</th>
                                                    <th>Account ID</th>
                                                    <th>Description</th>
                                                    <th>Transaction Type</th>
                                                    <th class="text-end">Amount</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td colspan="5" class="text-center text-muted py-4">No records</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <!-- Recovery Details Tab -->
                                <div class="tab-pane fade" id="recovery-pane" role="tabpanel" aria-labelledby="recovery-tab">
                                    <div class="table-responsive">
                                        <table id="recoveryTable" class="table table-sm table-hover table-bordered align-middle mb-0">
                                            <thead class="table-light">
                                                <tr>
                                                    <th>Name</th>
                                                    <th>Account ID</th>
                                                    <th class="text-end">Forfeited Amount</th>
                                                    <th class="text-end">OS Forfeit</th>
                                                    <th class="text-end">Recovered Amount</th>
                                                    <th>Recovery Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td colspan="6" class="text-center text-muted py-4">No records</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="nav-group">
                    <button class="btn-nav green" aria-label="Previous Client"><i class="bi bi-chevron-left"></i></button>
                    <span>Client</span>
                    <button class="btn-nav green" aria-label="Next Client"><i class="bi bi-chevron-right"></i></button>
                </div>

                <div class="action-buttons">
                    <button class="btn-action action-button view underline" data-action="view" title="View"><i class="bi bi-eye me-1"></i>View</button>
                    <button class="btn-action action-button add" data-action="add" title="Add" disabled><i class="bi bi-plus-circle me-1"></i>Add</button>
                    <button class="btn-action action-button save" data-action="save" title="Save" disabled><i class="bi bi-floppy me-1"></i>Save</button>
                    <button class="btn-action action-button cancel" data-action="cancel" title="Cancel" disabled><i class="bi bi-x-circle me-1"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Center Search Modal -->
    <div class="modal fade" id="centerSearchModal" tabindex="-1" aria-labelledby="centerSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="centerSearchModalLabel">Center Search</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="centerSearchFrame" style="width: 100%; height: 500px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Group Search Modal -->
    <div class="modal fade" id="groupSearchModal" tabindex="-1" aria-labelledby="groupSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="groupSearchModalLabel">Group Search</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="groupSearchFrame" style="width: 100%; height: 500px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Client Search Modal -->
    <div class="modal fade" id="clientSearchModal" tabindex="-1" aria-labelledby="clientSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="clientSearchModalLabel">Client Search</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="clientSearchFrame" style="width: 100%; height: 500px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Officer Search Modal -->
    <div class="modal fade" id="officerSearchModal" tabindex="-1" aria-labelledby="officerSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="officerSearchModalLabel">Credit Officer Search</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="officerSearchFrame" style="width: 100%; height: 500px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="forfeit-recovery-new.js"></script>
    <script>
        // Initialize sidebar toggle and section interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('main-sidebar');
            
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    const isExpanded = !sidebar.classList.contains('collapsed');
                    sidebarToggle.setAttribute('aria-expanded', isExpanded);
                });
            }

            // Nav section toggles
            document.querySelectorAll('.nav-arrow--card').forEach(arrow => {
                arrow.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const section = this.closest('.nav-section');
                    const items = section.querySelector('.nav-items--card');
                    const isOpen = section.classList.toggle('is-open');
                    
                    this.setAttribute('aria-expanded', isOpen);
                    items.hidden = !isOpen;
                    
                    const icon = this.querySelector('i');
                    icon.className = isOpen ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
                });
            });

            // Section toggles for form sections
            document.querySelectorAll('[data-section-toggle]').forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.closest('.form-section');
                    const content = section.querySelector('[data-section-content]');
                    const btn = this.querySelector('.section-toggle-btn');
                    const icon = btn.querySelector('i');
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    
                    btn.setAttribute('aria-expanded', !isExpanded);
                    content.hidden = isExpanded;
                    icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
                });
            });

            // Sidebar item click handlers
            document.querySelectorAll('.sidebar-item[data-dataentry]').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
