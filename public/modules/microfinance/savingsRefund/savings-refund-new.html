<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Refund · MicroFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201">
</head>
<body>
    <!-- Toast Container -->
    <div class="kairo-toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="window">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content form-content-without-leftbar">
                <div class="form-card" data-main-form>
                    <!-- Client Details Section -->
                    <div class="form-section" data-section="client-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-person"></i>Client Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Client Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Center ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="centerId" class="kairo-control__id" aria-label="Center ID" placeholder="Center ID">
                                        <input type="text" id="centerName" class="kairo-control__name" placeholder="Center Name" readonly aria-label="Center Name">
                                        <button type="button" class="btn-lookup" data-search="center" aria-label="Search Center"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Group ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="groupId" class="kairo-control__id" aria-label="Group ID" placeholder="Group ID">
                                        <input type="text" id="groupName" class="kairo-control__name" placeholder="Group Name" readonly aria-label="Group Name">
                                        <button type="button" class="btn-lookup" data-search="group" aria-label="Search Group"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Client ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="clientId" class="kairo-control__id" aria-label="Client ID" placeholder="Client ID">
                                        <input type="text" id="clientName" class="kairo-control__name" placeholder="Client Name" readonly aria-label="Client Name">
                                        <button type="button" class="btn-lookup" data-search="client" aria-label="Search Client"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Exit History Section -->
                    <div class="form-section" data-section="exit-history">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-clock-history"></i>Exit History</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Exit History" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Exit Date</label>
                                    <input type="text" id="exitDate" class="bs-input-text" placeholder="Exit Date" readonly aria-label="Exit Date">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Exit Reason</label>
                                    <input type="text" id="exitReason" class="bs-input-text" placeholder="Exit Reason" readonly aria-label="Exit Reason">
                                </div>
                            </div>
                            <div class="form-row three-col">
                                <div class="col">
                                    <label class="label-blue">Next Of Kin</label>
                                    <input type="text" id="nextOfKin" class="bs-input-text" placeholder="Next Of Kin" readonly aria-label="Next Of Kin">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Unclaimed Amount</label>
                                    <input type="number" id="unclaimedAmount" class="bs-input-number" placeholder="0.00" readonly aria-label="Unclaimed Amount">
                                </div>
                                <div class="col">
                                    <label class="label-blue">O/S Unclaimed</label>
                                    <input type="number" id="osUnclaimed" class="bs-input-number" placeholder="0.00" readonly aria-label="O/S Unclaimed">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Transaction Details Section -->
                    <div class="form-section" data-section="transaction-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-cash-stack"></i>Transaction Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Transaction Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Transaction Type</label>
                                    <select id="transactionType" class="bs-select" onchange="handleTransactionTypeChange()" disabled aria-label="Transaction Type">
                                        <option value="">Select Type</option>
                                        <option value="transfer">Transfer</option>
                                        <option value="cash">Cash</option>
                                        <option value="adjustment">Adjustment</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Account Type</label>
                                    <select id="accountType" class="bs-select" disabled aria-label="Account Type">
                                        <option value="">Select Type</option>
                                        <option value="customer">Customer</option>
                                        <option value="gl">GL</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Account ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="accountId" class="kairo-control__id" placeholder="Account ID" readonly aria-label="Account ID">
                                        <input type="text" id="accountName" class="kairo-control__name" placeholder="Account Name" readonly aria-label="Account Name">
                                        <button type="button" class="btn-lookup" data-search="account" aria-label="Search Account" disabled><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Narration</label>
                                    <input type="text" id="narration" class="bs-input-text" placeholder="Enter narration" readonly aria-label="Narration">
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Transaction Amount</label>
                                    <input type="number" id="transactionAmount" class="bs-input-number" placeholder="0.00" readonly aria-label="Transaction Amount">
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="nav-group">
                    <button class="btn-nav green" aria-label="Previous Client"><i class="bi bi-chevron-left"></i></button>
                    <span>Client</span>
                    <button class="btn-nav green" aria-label="Next Client"><i class="bi bi-chevron-right"></i></button>
                </div>

                <div class="action-buttons">
                    <button class="btn-action action-button" id="btnIdentification" onclick="handleIdentification()" disabled title="Identification"><i class="bi bi-person-badge me-1"></i>Identification</button>
                    <button class="btn-action action-button view underline" id="btnView" onclick="handleView()" title="View"><i class="bi bi-eye me-1"></i>View</button>
                    <button class="btn-action action-button add" id="btnAdd" onclick="handleAdd()" disabled title="Add"><i class="bi bi-plus-circle me-1"></i>Add</button>
                    <button class="btn-action action-button save" id="btnSave" onclick="handleSave()" disabled title="Save"><i class="bi bi-floppy me-1"></i>Save</button>
                    <button class="btn-action action-button cancel" id="btnCancel" onclick="handleCancel()" disabled title="Cancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Center Search Modal -->
    <div class="modal fade" id="centerSearchModal" tabindex="-1" aria-labelledby="centerSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="centerSearchModalLabel">Center Search</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="centerSearchFrame" style="width: 100%; height: 500px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Group Search Modal -->
    <div class="modal fade" id="groupSearchModal" tabindex="-1" aria-labelledby="groupSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="groupSearchModalLabel">Group Search</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="groupSearchFrame" style="width: 100%; height: 500px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Client Search Modal -->
    <div class="modal fade" id="clientSearchModal" tabindex="-1" aria-labelledby="clientSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="clientSearchModalLabel">Client Search</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="clientSearchFrame" style="width: 100%; height: 500px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="savings-refund-new.js"></script>
    <script>
        // Initialize sidebar toggle and section interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('main-sidebar');
            
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    const isExpanded = !sidebar.classList.contains('collapsed');
                    sidebarToggle.setAttribute('aria-expanded', isExpanded);
                });
            }

            // Nav section toggles
            document.querySelectorAll('.nav-arrow--card').forEach(arrow => {
                arrow.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const section = this.closest('.nav-section');
                    const items = section.querySelector('.nav-items--card');
                    const isOpen = section.classList.toggle('is-open');
                    
                    this.setAttribute('aria-expanded', isOpen);
                    items.hidden = !isOpen;
                    
                    const icon = this.querySelector('i');
                    icon.className = isOpen ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
                });
            });

            // Section toggles for form sections
            document.querySelectorAll('[data-section-toggle]').forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.closest('.form-section');
                    const content = section.querySelector('[data-section-content]');
                    const btn = this.querySelector('.section-toggle-btn');
                    const icon = btn.querySelector('i');
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    
                    btn.setAttribute('aria-expanded', !isExpanded);
                    content.hidden = isExpanded;
                    icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
                });
            });

            // Sidebar item click handlers
            document.querySelectorAll('.sidebar-item[data-dataentry]').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
