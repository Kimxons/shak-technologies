<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Attendance · MicroFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201">
</head>
<body>
    <!-- Toast Container -->
    <div class="kairo-toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="window">
        <!-- Main Container -->
        <div class="main-container no-sidebar">

            <!-- Form Content -->
            <div class="form-content form-content-without-leftbar">
                <div class="form-card" data-main-form>
                    <!-- Attendance Details Section - Collapsible -->
                    <div class="form-section" data-section="attendance-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Attendance Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Attendance Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <form id="center-attendance-form" autocomplete="off" novalidate>
                                <!-- Row 1: CenterID, Meeting Date -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="label-blue" for="CenterId">Center ID</label>
                                        <div class="kairo-control" data-kairo-control>
                                            <input type="text" id="CenterId" class="kairo-control__id" aria-label="Center ID">
                                            <input type="text" id="CenterName" class="kairo-control__name" aria-label="Center Name" readonly>
                                            <button type="button" class="btn-lookup kairo-control__lookup" data-ca-lookup="center" aria-label="Lookup center"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="label-blue" for="MeetingDate">Meeting Date</label>
                                        <div class="d-flex gap-2">
                                            <input type="text" id="MeetingDate" class="bs-input-text flex-grow-1" aria-label="Meeting Date">
                                            <button type="button" class="btn-lookup" data-ca-lookup="meeting-date" aria-label="Lookup meeting date"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Row 2: Officer ID, Meeting Place -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="label-blue" for="OfficerId">Officer ID</label>
                                        <div class="kairo-control" data-kairo-control>
                                            <input type="text" id="OfficerId" class="kairo-control__id" aria-label="Officer ID">
                                            <input type="text" id="OfficerName" class="kairo-control__name" aria-label="Officer Name" readonly>
                                            <button type="button" class="btn-lookup kairo-control__lookup" data-ca-lookup="officer" aria-label="Lookup officer"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="MeetingPlace">Meeting Place</label>
                                        <input type="text" id="MeetingPlace" class="bs-input-text" aria-label="Meeting Place">
                                    </div>
                                </div>

                                <!-- Row 3: Remarks -->
                                <div class="row g-2">
                                    <div class="col-12">
                                        <label class="form-label mb-1" for="Remarks">Remarks</label>
                                        <textarea id="Remarks" class="bs-textarea" aria-label="Remarks" style="height: 28px; min-height: 28px; resize: none;"></textarea>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Attendance List Section - Collapsible -->
                    <div class="form-section" data-section="attendance-list">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-table"></i>Attendance List</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Attendance List" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Client ID</th>
                                            <th>Client Name</th>
                                            <th>Attendance Status</th>
                                            <th>Payment Type Description</th>
                                        </tr>
                                    </thead>
                                    <tbody id="attendanceTableBody">
                                        <tr>
                                            <td colspan="4" class="text-center text-muted">No records to display</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="nav-group">
                    <button class="btn-nav green" aria-label="Previous Center"><i class="bi bi-chevron-left"></i></button>
                    <span>Center</span>
                    <button class="btn-nav green" aria-label="Next Center"><i class="bi bi-chevron-right"></i></button>
                </div>

                <div class="action-buttons">
                    <button class="btn-action btn-view" type="button" onclick="handleView()" data-ca-action="view" title="View"><i class="bi bi-eye me-1"></i>View</button>
                    <button class="btn-action" type="button" onclick="handleEdit()" data-ca-action="edit" title="Edit" disabled><i class="bi bi-pencil-square me-1"></i>Edit</button>
                    <button class="btn-action" type="button" onclick="handleDelete()" data-ca-action="delete" title="Delete" disabled><i class="bi bi-trash me-1"></i>Delete</button>
                    <button class="btn-action" type="button" onclick="handleSave()" data-ca-action="save" data-action="save" title="Save" disabled><i class="bi bi-check-lg me-1"></i>Save</button>
                    <button class="btn-action btn-cancel" type="button" onclick="handleCancel()" data-ca-action="cancel" data-action="cancel" title="Cancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Modal (for Center, Officer, Meeting Date lookups) -->
    <style>
      /* Search Modal Styling - Consistent Blue Gradient Theme */
      .ca-search-modal .modal-dialog {
        max-width: 900px;
        width: 90%;
      }
      .ca-search-modal .modal-header {
        background: linear-gradient(90deg, #1e7cc4 0%, #1a6ba3 100%);
        color: #fff;
        padding: 0.75rem 1rem;
        border-bottom: none;
      }
      .ca-search-modal .modal-title {
        font-weight: 600;
        font-size: 1rem;
      }
      .ca-search-modal .btn-close {
        filter: brightness(0) invert(1);
        opacity: 0.9;
      }
      .ca-search-modal .btn-close:hover {
        opacity: 1;
      }
      .ca-search-modal .modal-body {
        padding: 0;
        height: 500px;
        overflow: hidden;
      }
      .ca-search-modal .modal-body iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
    <div class="modal fade ca-search-modal" id="searchModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="searchModalTitle">Search</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <iframe id="searchModalFrame" title="Search" src="about:blank"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/environment.js"></script>
    <script src="../../../assets/js/auth/auth.config.js"></script>
    <script src="../../../assets/js/auth/auth.service.js"></script>
    <script src="../../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../../assets/js/services/shared/lookupService.js"></script>
    <script src="../../../assets/js/services/microfinance/microfinanceService.js"></script>
    <script src="../../../assets/js/app.js"></script>
    <script src="../../common/toast-messages/toast-messages.js"></script>
    <script src="../../common/confirmationDialog/confirmation-dialog.js"></script>
    <script src="center-attendance-new.js"></script>
    <script>
        // Initialize sidebar toggle and section interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('main-sidebar');
            
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    const isExpanded = !sidebar.classList.contains('collapsed');
                    sidebarToggle.setAttribute('aria-expanded', isExpanded);
                });
            }

            // Nav section toggles
            document.querySelectorAll('.nav-arrow--card').forEach(arrow => {
                arrow.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const section = this.closest('.nav-section');
                    const items = section.querySelector('.nav-items--card');
                    const isOpen = section.classList.toggle('is-open');
                    
                    this.setAttribute('aria-expanded', isOpen);
                    items.hidden = !isOpen;
                    
                    const icon = this.querySelector('i');
                    icon.className = isOpen ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
                });
            });

            // Section toggles for form sections
            document.querySelectorAll('[data-section-toggle]').forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.closest('.form-section');
                    const content = section.querySelector('[data-section-content]');
                    const btn = this.querySelector('.section-toggle-btn');
                    const icon = btn.querySelector('i');
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    
                    btn.setAttribute('aria-expanded', !isExpanded);
                    content.hidden = isExpanded;
                    icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
                });
            });

            // Sidebar item click handlers
            document.querySelectorAll('.sidebar-item[data-dataentry]').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
