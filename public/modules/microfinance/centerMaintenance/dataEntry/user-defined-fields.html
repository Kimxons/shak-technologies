<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Defined Fields</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css?v=20260201" />
</head>
<body>
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-sliders am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">User Defined Fields</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data" id="btnRefresh">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window" id="btnMaximize">
          <i class="bi bi-square"></i>
        </button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window" id="btnClose">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <main class="main-container" aria-label="User Defined Fields form">
      <div class="form-content" role="region" aria-label="User Defined Fields form">
        <div class="form-card" data-main-form>
          <!-- User Defined Fields Section -->
          <div class="form-section" data-section="user-defined-fields">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-sliders"></i>User Defined Fields</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle User Defined Fields" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div id="userDefinedFieldsContainer" class="text-center text-muted py-5">
                <i class="bi bi-hourglass-split" style="font-size: 32px; margin-bottom: 16px; display: block; opacity: 0.5;"></i>
                <p style="font-size: 14px; margin: 0;">Loading user-defined fields...</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-action="view" title="View">
            <i class="bi bi-eye"></i>View
          </button>
          <button class="btn-action" type="button" data-action="edit" title="Edit" disabled>
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button class="btn-action" type="button" data-action="save" title="Save" disabled>
            <i class="bi bi-check-lg"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel" title="Cancel">
            <i class="bi bi-x-lg"></i>Cancel
          </button>
        </div>
      </div>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading...</span>
      </div>
    </div>
  </div>

  <script src="../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../../assets/js/environment.js"></script>
  <script src="user-defined-fields.js"></script>

  <!-- Window Controls & Blur Behavior -->
  <script>
    (function() {
      /**
       * Send message to parent when form opens
       */
      function notifyParentFormOpened() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleOpened',
              source: 'User Defined Fields'
            }, '*');
          }
        } catch (error) {
          console.error('Error notifying parent of form open:', error);
        }
      }

      /**
       * Close the child form by notifying parent
       */
      function closeChildForm() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleClosed',
              source: 'User Defined Fields'
            }, '*');
          } else {
            window.close();
          }
        } catch (error) {
          console.error('Error closing form:', error);
        }
      }

      /**
       * Handle window control actions
       */
      function handleWindowAction(action, btn) {
        const windowEl = document.querySelector('.window');
        
        switch (action) {
          case 'refresh':
            document.querySelectorAll('[class*="invalid"]').forEach(el => {
              el.classList.remove(...Array.from(el.classList).filter(c => c.includes('invalid')));
            });
            window.location.reload();
            break;

          case 'maximize':
            if (windowEl) {
              const isMaximized = windowEl.classList.toggle('maximized');
              const icon = btn.querySelector('i');
              if (icon) {
                icon.className = isMaximized ? 'bi bi-fullscreen-exit' : 'bi bi-square';
              }
              btn.title = isMaximized ? 'Restore' : 'Maximize';
              btn.setAttribute('aria-label', isMaximized ? 'Restore window' : 'Maximize window');
              
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ 
                  action: 'toggleSidebarForMaximize',
                  maximize: isMaximized
                }, '*');
              }
            }
            break;

          case 'close':
          case 'cancel':
            closeChildForm();
            break;
        }
      }

      /**
       * Initialize window control buttons
       */
      function initWindowControls() {
        document.querySelectorAll('.am-btn[data-action], .btn-action[data-action]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const action = btn.getAttribute('data-action');
            handleWindowAction(action, btn);
          });
        });
      }

      /**
       * Initialize section toggle functionality
       */
      function initSectionToggles() {
        document.querySelectorAll('[data-section-toggle]').forEach(header => {
          header.addEventListener('click', function() {
            const section = this.closest('.form-section');
            const content = section.querySelector('[data-section-content]');
            const btn = this.querySelector('.section-toggle-btn');
            const icon = btn.querySelector('i');
            const isExpanded = btn.getAttribute('aria-expanded') === 'true';
            
            btn.setAttribute('aria-expanded', !isExpanded);
            section.classList.toggle('collapsed');
            icon.className = isExpanded ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
          });
        });
      }

      // Initialize on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          initWindowControls();
          initSectionToggles();
          notifyParentFormOpened();
        });
      } else {
        initWindowControls();
        initSectionToggles();
        notifyParentFormOpened();
      }
    })();
  </script>
</body>
</html>
