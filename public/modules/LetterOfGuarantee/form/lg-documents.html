<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documents · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/lg-documents.css" />
</head>

<body class="lg-documents copilot-theme" data-page="lg-documents">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lg-documents-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-content-scroll">
          <section id="lg-documents-main" class="cm-section cm-section--active" data-step="lg-documents-main">
            <div class="card-surface p-3">
              <h3 class="section-title section-title--full mb-3">Documents</h3>

              <div class="row g-3">
                <div class="col-12 col-lg-8">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DocumentID">Document ID</label>
                    <div class="input-group">
                      <input type="text" class="form-control cbs-lookup-id" id="DocumentID" name="DocumentID" data-editable="true" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search document" data-lg-documents-lookup="document">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-8">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Description">Description</label>
                    <input type="text" class="form-control" id="Description" name="Description" data-editable="true" />
                  </div>
                </div>

                <div class="col-12 col-lg-8">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Remarks">Remarks</label>
                    <input type="text" class="form-control" id="Remarks" name="Remarks" data-editable="true" />
                  </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DocumentClass">Document Class</label>
                    <select class="form-select" id="DocumentClass" name="DocumentClass" data-editable="true">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <h3 class="section-title section-title--full mb-3">Behind The Scene</h3>

              <div class="cbs-grid cbs-grid--tight" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
                <div class="cbs-field">
                  <label class="cbs-label" for="CreatedBy">Created By</label>
                  <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" readonly />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ModifiedBy">Modified By</label>
                  <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" readonly />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="SupervisedBy">Supervised By</label>
                  <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" readonly />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="CreatedOn">Created On</label>
                  <input type="text" class="form-control" id="CreatedOn" name="CreatedOn" readonly />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ModifiedOn">Modified On</label>
                  <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" readonly />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="SupervisedOn">Supervised On</label>
                  <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" readonly />
                </div>
              </div>

              <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <div class="d-flex justify-content-between gap-2">
            <button type="button" class="cm-shell__action cm-shell__action--ghost" data-nav-action="prev" aria-label="Previous">
              <i class="bi bi-arrow-left"></i>
            </button>
            <button type="button" class="cm-shell__action cm-shell__action--ghost" data-nav-action="next" aria-label="Next">
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-documents-action="view">View</button>
          <button type="button" class="cm-shell__action" data-lg-documents-action="add" disabled>Add</button>
          <button type="button" class="cm-shell__action" data-lg-documents-action="edit" disabled>Edit</button>
          <button type="button" class="cm-shell__action" data-lg-documents-action="delete" disabled>Delete</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" data-lg-documents-action="save" disabled>Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-lg-documents-action="cancel">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/lg-documents.js"></script>
</body>

</html>
