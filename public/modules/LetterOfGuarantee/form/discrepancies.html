<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discrepancies</title>
  <link rel="stylesheet" href="discrepancies.css" />
</head>

<body>
  <div class="window" role="application" aria-label="Discrepancies">
    <div class="main-container">
      <div class="content">
        <div class="panel" aria-label="Discrepancies Menu">
          <div class="panel-title">Discrepancies Menu</div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="form-row">
                <label for="discrepancyId">DiscrepancyID</label>
                <input type="text" id="discrepancyId" class="input-wide" data-editable="true" disabled />
                <button class="btn-lookup" type="button" id="discrepancyLookup" aria-label="Lookup discrepancy">🔍</button>
              </div>

              <div class="form-row">
                <label for="documentId">Document ID</label>
                <input type="text" id="documentId" class="input-wide" data-editable="true" disabled />
                <button class="btn-lookup" type="button" id="documentLookup" aria-label="Lookup document">🔍</button>
              </div>

              <div class="form-row">
                <label for="documentImage">Document Image</label>
                <input type="text" id="documentImage" class="input-mid" data-editable="true" disabled />
                <button class="btn-browse" type="button" id="browseBtn">Browse</button>
                <input type="file" id="documentFile" class="file-input" accept="image/*" />
              </div>

              <div class="form-row">
                <label for="status">Status</label>
                <select id="status" class="select-mid" data-editable="true" disabled>
                  <option value="">--Select--</option>
                </select>

                <label class="label-inline" for="statusDate">Status Date</label>
                <select id="statusDate" class="select-mid" data-editable="true" disabled>
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="form-row">
                <label for="reportingDate">Reporting Date</label>
                <select id="reportingDate" class="select-mid" data-editable="true" disabled>
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="form-row form-row--top">
                <label for="remarks">Remarks</label>
                <textarea id="remarks" class="textarea" rows="3" data-editable="true" disabled></textarea>
              </div>

              <div class="form-row">
                <label class="label-blue" for="swiftMessage">Swift Message</label>
                <select id="swiftMessage" class="select-mid" data-editable="true" disabled>
                  <option value="MT734" selected>MT734</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="row-inline-actions" aria-label="Discrepancy actions">
          <button type="button" class="btn-inline" disabled>New</button>
          <button type="button" class="btn-inline" disabled>Alter</button>
          <button type="button" class="btn-inline" disabled>Remove</button>
          <button type="button" class="btn-inline" disabled>Update</button>
          <button type="button" class="btn-inline" disabled>Clear</button>
        </div>

        <div class="grid-shell" aria-label="Discrepancies table">
          <div class="grid-table" role="table" aria-label="Discrepancies">
            <div class="grid-header" role="row">
              <div class="grid-cell" role="columnheader">DiscrepancyName</div>
              <div class="grid-cell" role="columnheader">DocumentName</div>
              <div class="grid-cell" role="columnheader">Status</div>
              <div class="grid-cell" role="columnheader">StatusDate</div>
              <div class="grid-cell" role="columnheader">ReportingDate</div>
              <div class="grid-cell" role="columnheader">Remarks</div>
            </div>
            <div class="grid-body" role="rowgroup">
              <div class="grid-empty" role="row">
                <div class="grid-empty__cell" role="cell">No records to display.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="section-header">Behind The Scene</div>
        <div class="section-body">
          <div class="behind-grid">
            <div class="behind-col">
              <div class="form-row">
                <label for="createdBy">Created By</label>
                <input type="text" id="createdBy" class="input-mid" readonly />
              </div>
              <div class="form-row">
                <label for="modifiedBy">Modified By</label>
                <input type="text" id="modifiedBy" class="input-mid" readonly />
              </div>
              <div class="form-row">
                <label for="deletedBy">Deleted By</label>
                <input type="text" id="deletedBy" class="input-mid" readonly />
              </div>
            </div>

            <div class="behind-col">
              <div class="form-row">
                <label for="createdOn">Created On</label>
                <input type="text" id="createdOn" class="input-mid" readonly />
              </div>
              <div class="form-row">
                <label for="modifiedOn">Modified On</label>
                <input type="text" id="modifiedOn" class="input-mid" readonly />
              </div>
              <div class="form-row">
                <label for="deletedOn">Deleted On</label>
                <input type="text" id="deletedOn" class="input-mid" readonly />
              </div>
            </div>
          </div>
        </div>
      </div>

      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons action-buttons--top">
          <button class="btn-action" type="button" id="approveBtn" disabled>Approve</button>
          <button class="btn-action" type="button" id="swiftBtn" disabled>Swift Message</button>
          <button class="btn-action" type="button" id="chargesBtn">Charges</button>
        </div>

        <div class="action-buttons action-buttons--middle">
          <button class="btn-action" type="button" id="showImageBtn" disabled>ShowImage</button>
        </div>

        <div class="action-buttons action-buttons--bottom">
          <button class="btn-action" type="button" data-mode="view">View</button>
          <button class="btn-action" type="button" data-mode="add">Add</button>
          <button class="btn-action" type="button" id="editBtn" disabled>Edit</button>
          <button class="btn-action" type="button" id="deleteBtn" disabled>Delete</button>
          <button class="btn-action" type="button" id="saveBtn" disabled>Save</button>
          <button class="btn-action" type="button" id="cancelBtn" disabled>Cancel</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="discrepancies.js"></script>
</body>

</html>
