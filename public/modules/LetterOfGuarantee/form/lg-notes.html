<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/lg-notes.css" />
</head>

<body class="lg-notes copilot-theme" data-page="lg-notes">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lg-notes-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-content-scroll">
          <section id="lg-notes-main" class="cm-section cm-section--active" data-step="lg-notes-main">
            <div class="card-surface p-3">
              <div class="row g-3">
                <div class="col-12">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Notes">Notes</label>
                    <textarea class="form-control" id="Notes" name="Notes" rows="10" data-editable="true"></textarea>
                  </div>
                </div>
              </div>
              <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <div class="d-flex justify-content-between gap-2">
            <button type="button" class="cm-shell__action cm-shell__action--ghost" data-nav-action="prev" aria-label="Previous">
              <i class="bi bi-arrow-left"></i>
            </button>
            <button type="button" class="cm-shell__action cm-shell__action--ghost" data-nav-action="next" aria-label="Next">
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-notes-action="save">Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-lg-notes-action="close">Close</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/pages/LetterOfGuarantee/form/lg-notes.embedded.js"></script>
</body>

</html>
