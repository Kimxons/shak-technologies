<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guarantor Details · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/lg-guarantors.css" />
</head>

<body class="lg-guarantors copilot-theme" data-page="lg-guarantors">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lg-guarantors-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-content-scroll">
          <section id="lg-guarantors-main" class="cm-section cm-section--active" data-step="lg-guarantors-main">
            <div class="card-surface p-3">
              <h3 class="section-title section-title--full mb-3 w-100">Guarantor Details</h3>

              <div class="row g-3">
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="GuarantorTypeID">Guarantor Type</label>
                    <select class="form-select" id="GuarantorTypeID" name="GuarantorTypeID" data-editable="true">
                      <option value="">--Select--</option>
                    </select>
                  </div>

                  <div class="cbs-field mt-3">
                    <label class="cbs-label" for="GuaranteeAmount">Guarantee Amount</label>
                    <input type="number" class="form-control" id="GuaranteeAmount" name="GuaranteeAmount" data-editable="true" />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label required" for="GuarantorID">Guarantor ID</label>
                    <div class="input-group">
                      <input type="text" class="form-control cbs-lookup-id" id="GuarantorID" name="GuarantorID" data-editable="true" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search guarantor" data-lg-guarantors-lookup="guarantor">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="InstitutionClientID">Institution/Client ID</label>
                    <div class="input-group">
                      <input type="text" class="form-control cbs-lookup-id" id="InstitutionClientID" name="InstitutionClientID" data-editable="true" />
                      <input type="text" class="form-control cbs-lookup-desc" id="InstitutionClientName" name="InstitutionClientName" placeholder="" readonly />
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Remarks">Remarks</label>
                    <textarea class="form-control" id="Remarks" name="Remarks" rows="3" data-editable="true"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <div class="table-responsive">
                <table class="table table-sm table-bordered mb-0">
                  <thead>
                    <tr>
                      <th>Guarantor ID</th>
                      <th>Guarantor Name</th>
                      <th>Guarantee Amount</th>
                    </tr>
                  </thead>
                  <tbody id="guarantorsGridBody">
                    <tr>
                      <td colspan="3">No records to display.</td>
                    </tr>
                  </tbody>
                </table>

                <div class="d-flex justify-content-between align-items-center mt-2" id="guarantorsPager">
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="guarantorsPrevBtn">Prev</button>
                  <div class="small text-muted" id="guarantorsPageInfo">Page 0 of 0</div>
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="guarantorsNextBtn">Next</button>
                </div>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <h3 class="section-title section-title--full mb-3 w-100">Behind The Scene</h3>

              <div class="row g-3">
                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="SignedBy">Signed By</label>
                    <input type="text" class="form-control" id="SignedBy" name="SignedBy" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="BehindGuaranteeAmount">Guarantee Amount</label>
                    <input type="number" class="form-control" id="BehindGuaranteeAmount" name="BehindGuaranteeAmount" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="MaxGuaranteeAmount">Max. Guarantee Amount</label>
                    <input type="number" class="form-control" id="MaxGuaranteeAmount" name="MaxGuaranteeAmount" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="LoansAlreadyGuaranteed">No. Of Loans Already Guaranteed</label>
                    <input type="number" class="form-control" id="LoansAlreadyGuaranteed" name="LoansAlreadyGuaranteed" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="MaxNoOfLoan">Max. No. Of Loan</label>
                    <input type="number" class="form-control" id="MaxNoOfLoan" name="MaxNoOfLoan" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="NetWorth">Net Worth</label>
                    <input type="number" class="form-control" id="NetWorth" name="NetWorth" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Liability">Liability</label>
                    <input type="number" class="form-control" id="Liability" name="Liability" readonly />
                  </div>
                </div>
              </div>

              <hr class="my-3" />

              <div class="cbs-grid cbs-grid--tight" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
                <div class="cbs-field">
                  <label class="cbs-label" for="CreatedBy">Created By</label>
                  <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="ModifiedBy">Modified By</label>
                  <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="SupervisedBy">Supervised By</label>
                  <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="CreatedOn">Created On</label>
                  <input type="text" class="form-control" id="CreatedOn" name="CreatedOn" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="ModifiedOn">Modified On</label>
                  <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="SupervisedOn">Supervised On</label>
                  <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" readonly />
                </div>
              </div>

              <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-guarantors-mode="add">Add</button>
          <button type="button" class="cm-shell__action" data-lg-guarantors-mode="edit">Edit</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" data-lg-guarantors-action="save" disabled>Save</button>
          <button type="button" class="cm-shell__action" data-lg-guarantors-action="cancel" disabled>Cancel</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-lg-guarantors-action="back">Back</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../js/lg-guarantors.js"></script>
</body>

</html>
