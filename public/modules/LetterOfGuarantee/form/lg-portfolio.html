<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LG Portfolio · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/lg-portfolio.css" />
</head>

<body class="lg-portfolio copilot-theme" data-page="lg-portfolio">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lg-portfolio-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-content-scroll">
          <section id="lg-portfolio-main" class="cm-section cm-section--active" data-step="lg-portfolio-main">
            <div class="card-surface p-2 d-flex flex-column" style="min-height: 0;">
              <div class="table-responsive flex-grow-1" style="min-height: 0;">
                <table class="table table-sm table-bordered mb-0">
                  <thead>
                    <tr>
                      <th>Application ID</th>
                      <th>LG Number</th>
                      <th>Expiry Date</th>
                      <th>Amount</th>
                      <th>Application Status</th>
                      <th>Value Date</th>
                      <th>Currency ID</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="7">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-portfolio-action="back">Back</button>
        </div>
      </aside>

      <div class="lg-portfolio-footer bg-body-tertiary border-top small text-muted px-2 py-1">
        BR.Net Web Banking
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/lg-portfolio.js"></script>
</body>

</html>
