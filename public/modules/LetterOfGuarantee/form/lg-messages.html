<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LG Messages · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/lg-messages.css" />
</head>

<body class="lg-messages copilot-theme" data-page="lg-messages">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lg-messages-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-content-scroll">
          <section id="lg-messages-main" class="cm-section cm-section--active" data-step="lg-messages-main">
            <div class="card-surface p-3">
              <h3 class="section-title mb-3">Messages And Advises Menu</h3>

              <div class="row g-3">
                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="MessageID">MessageID</label>
                    <div class="input-group">
                      <input type="text" class="form-control cbs-lookup-id" id="MessageID" name="MessageID" data-editable="true" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search message" data-lg-messages-lookup="message">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="MessageType">Message Type</label>
                    <select class="form-select" id="MessageType" name="MessageType" data-editable="true">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Medium">Medium</label>
                    <select class="form-select" id="Medium" name="Medium" data-editable="true">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Language">Language</label>
                    <select class="form-select" id="Language" name="Language" data-editable="true">
                      <option value="English" selected>English</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="SwiftMessage">Swift Message</label>
                    <select class="form-select" id="SwiftMessage" name="SwiftMessage" data-editable="true">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <div class="d-flex gap-2 justify-content-center my-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-messages-action="new" disabled>New</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-messages-action="alter" disabled>Alter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-messages-action="remove" disabled>Remove</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-messages-action="update" disabled>Update</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-messages-action="clear" disabled>Clear</button>
              </div>

              <div class="table-responsive">
                <table class="table table-sm table-bordered mb-0">
                  <thead>
                    <tr>
                      <th>MessageID</th>
                      <th>MessageType</th>
                      <th>Medium</th>
                      <th>Language</th>
                      <th>SwiftMessage</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="6">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <h3 class="section-title section-title--full mb-3">Behind The Scene</h3>

              <div class="row g-3">
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="BehindStatus">Status</label>
                    <input type="text" class="form-control" id="BehindStatus" name="BehindStatus" readonly />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="CreatedOn">Created On</label>
                    <input type="date" class="form-control" id="CreatedOn" name="CreatedOn" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="CreatedBy">Created By</label>
                    <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="ModifiedOn">Modified On</label>
                    <input type="date" class="form-control" id="ModifiedOn" name="ModifiedOn" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="ModifiedBy">Modified By</label>
                    <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" readonly />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DeletedOn">Deleted On</label>
                    <input type="date" class="form-control" id="DeletedOn" name="DeletedOn" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DeletedBy">Deleted By</label>
                    <input type="text" class="form-control" id="DeletedBy" name="DeletedBy" readonly />
                  </div>
                </div>
              </div>

              <div class="text-danger fw-semibold small mt-2 d-none"></div>
              <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-messages-action="generate" disabled>Generate</button>
          <button type="button" class="cm-shell__action" data-lg-messages-action="preview" disabled>Preview</button>
          <button type="button" class="cm-shell__action" data-lg-messages-action="approve" disabled>Approve</button>
          <button type="button" class="cm-shell__action" data-lg-messages-action="reject" disabled>Reject</button>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-messages-action="view" disabled>View</button>
          <button type="button" class="cm-shell__action" data-lg-messages-action="add">Add</button>
          <button type="button" class="cm-shell__action" data-lg-messages-action="edit" disabled>Edit</button>
          <button type="button" class="cm-shell__action" data-lg-messages-action="delete" disabled>Delete</button>
          <button type="button" class="cm-shell__action" data-lg-messages-action="save" disabled>Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-lg-messages-action="cancel">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/lg-messages.js"></script>
</body>

</html>
