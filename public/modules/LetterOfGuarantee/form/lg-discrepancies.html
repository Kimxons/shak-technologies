<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LG Discrepancies · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/lg-discrepancies.css" />
</head>

<body class="lg-discrepancies copilot-theme" data-page="lg-discrepancies">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lg-discrepancies-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-content-scroll">
          <section id="lg-discrepancies-main" class="cm-section cm-section--active" data-step="lg-discrepancies-main">
            <div class="card-surface p-3">
              <h3 class="section-title section-title--full mb-3">Discrepancies Menu</h3>

              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DiscrepancyID">DiscrepancyID</label>
                    <div class="input-group">
                      <input type="text" class="form-control cbs-lookup-id" id="DiscrepancyID" name="DiscrepancyID" data-editable="true" />
                      <input type="text" class="form-control cbs-lookup-desc" id="DiscrepancyName" name="DiscrepancyName" placeholder="" readonly />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search discrepancy" data-lg-discrepancies-lookup="discrepancy">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DocumentID">Document ID</label>
                    <div class="input-group">
                      <input type="text" class="form-control cbs-lookup-id" id="DocumentID" name="DocumentID" data-editable="true" />
                      <input type="text" class="form-control cbs-lookup-desc" id="DocumentName" name="DocumentName" placeholder="" readonly />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search document" data-lg-discrepancies-lookup="document">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DocumentImageName">Document Image</label>
                    <div class="input-group">
                      <input type="text" class="form-control" id="DocumentImageName" name="DocumentImageName" readonly />
                      <button class="btn btn-outline-secondary" type="button" data-lg-discrepancies-action="browse-image">Browse</button>
                    </div>
                    <input type="file" id="DocumentImageFile" class="d-none" accept="image/*" />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Status">Status</label>
                    <select class="form-select" id="Status" name="Status" data-editable="true">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="StatusDate">Status Date</label>
                    <input type="date" class="form-control" id="StatusDate" name="StatusDate" data-editable="true" />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="ReportingDate">Reporting Date</label>
                    <input type="date" class="form-control" id="ReportingDate" name="ReportingDate" data-editable="true" />
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <div class="cbs-field">
                    <label class="cbs-label" for="SwiftMessage">Swift Message</label>
                    <select class="form-select" id="SwiftMessage" name="SwiftMessage" data-editable="true">
                      <option value="">--Select--</option>
                      <option value="MT734">MT734</option>
                    </select>
                  </div>
                </div>

                <div class="col-12">
                  <div class="cbs-field">
                    <label class="cbs-label" for="Remarks">Remarks</label>
                    <textarea class="form-control" id="Remarks" name="Remarks" rows="3" data-editable="true"></textarea>
                  </div>
                </div>

              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <div class="d-flex gap-2 justify-content-center my-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-discrepancies-action="new" disabled>New</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-discrepancies-action="alter" disabled>Alter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-discrepancies-action="remove" disabled>Remove</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-discrepancies-action="update" disabled>Update</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-lg-discrepancies-action="clear" disabled>Clear</button>
              </div>

              <div class="table-responsive">
                <table class="table table-sm table-bordered mb-0">
                  <thead>
                    <tr>
                      <th>DiscrepancyName</th>
                      <th>DocumentName</th>
                      <th>Status</th>
                      <th>StatusDate</th>
                      <th>ReportingDate</th>
                      <th>Remarks</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="6">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <h3 class="section-title section-title--full mb-3">Behind The Scene</h3>

              <div class="row g-3">
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="CreatedBy">Created By</label>
                    <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" readonly />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="CreatedOn">Created On</label>
                    <input type="date" class="form-control" id="CreatedOn" name="CreatedOn" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="ModifiedBy">Modified By</label>
                    <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" readonly />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="ModifiedOn">Modified On</label>
                    <input type="date" class="form-control" id="ModifiedOn" name="ModifiedOn" readonly />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DeletedBy">Deleted By</label>
                    <input type="text" class="form-control" id="DeletedBy" name="DeletedBy" readonly />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="cbs-field">
                    <label class="cbs-label" for="DeletedOn">Deleted On</label>
                    <input type="date" class="form-control" id="DeletedOn" name="DeletedOn" readonly />
                  </div>
                </div>
              </div>

              <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="approve" disabled>Approve</button>
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="swift-message" disabled>Swift Message</button>
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="charges">Charges</button>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="show-image" disabled>ShowImage</button>
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="view" disabled>View</button>
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="add">Add</button>
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="edit" disabled>Edit</button>
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="delete" disabled>Delete</button>
          <button type="button" class="cm-shell__action" data-lg-discrepancies-action="save" disabled>Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-lg-discrepancies-action="cancel">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/lg-discrepancies.js"></script>
</body>

</html>
