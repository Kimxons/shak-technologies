<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LG Account Application · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/lg-application.css" />
</head>

<body class="lg-application copilot-theme" data-page="lg-application">

  <style>
    html, body, .cm-workspace {
      height: 100%;
      min-height: 0;
    }
    .cm-workspace {
      display: flex;
      flex-direction: column;
    }
    #lg-application-form.cm-shell-form {
      flex: 1 1 auto;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }
    .cm-legacy-nav.card-surface,
    .cm-legacy-actions.card-surface {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
  </style>
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="lg-application-form" class="cm-shell-form d-flex flex-row align-items-stretch h-100" autocomplete="off" novalidate style="height:100vh;min-height:0;">
      <aside class="cm-legacy-nav card-surface h-100" aria-label="Options menu" style="height:100%;">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle d-flex align-items-center w-100 px-3 py-2 border-0 bg-primary text-white fw-semibold" style="font-size:1rem; border-radius: 0.5rem 0.5rem 0 0;" onclick="this.classList.toggle('collapsed'); var items=this.nextElementSibling; items.classList.toggle('is-collapsed'); var icon=this.querySelector('.bi'); icon.classList.toggle('bi-chevron-down'); icon.classList.toggle('bi-chevron-up');">
            <i class="bi bi-pencil-square me-2"></i>
            <span class="cm-nav-toggle__label flex-grow-1">DataEntry</span>
            <i class="bi bi-chevron-up ms-2"></i>
          </button>
          <div class="cm-nav-items" style="border-radius:0 0 0.5rem 0.5rem;">
            <button type="button" class="cm-legacy-nav__item w-100 text-start px-3 py-2 border-0 bg-white" data-open-parent-modal="lgDocumentsModal" style="border-radius:0.5rem 0.5rem 0 0;">
              Documents
            </button>
            <button type="button" class="cm-legacy-nav__item w-100 text-start px-3 py-2 border-0 bg-white" data-open-parent-modal="lgGuarantorsModal">
              Guarantor Details
            </button>
            <button type="button" class="cm-legacy-nav__item w-100 text-start px-3 py-2 border-0 bg-white" data-open-parent-modal="lgNotesModal" style="border-radius:0 0 0.5rem 0.5rem;">
              Notes
            </button>
          </div>
        </div>
      </aside>

      <section class="cm-legacy-content flex-grow-1" style="height:100%;">
        <div class="cm-content-scroll">
          <section id="lg-application" class="cm-section cm-section--active" data-step="lg-application">
            <div class="card-surface p-3">
              <div class="cbs-grid cbs-grid--quad">
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label required" for="BranchID">Branch ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control cbs-lookup-id" id="BranchID" name="BranchID" placeholder="e.g. 0101" required />
                    <button class="btn btn-outline-primary" type="button" data-lookup="branch" aria-label="Search branch">
                      <i class="bi bi-search"></i>
                    </button>
                    <input type="text" class="form-control" id="BranchName" name="BranchName" placeholder="Branch Name" readonly />
                  </div>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label required" for="ApplicationID">Application ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="ApplicationID" name="ApplicationID" required />
                    <button class="btn btn-outline-primary" type="button" data-lookup="application" aria-label="Search application">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ApplicationDate">Application Date</label>
                  <input type="date" class="form-control" id="ApplicationDate" name="ApplicationDate" data-editable="true" />
                </div>

                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label required" for="ClientID">Client ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control cbs-lookup-id" id="ClientID" name="ClientID" required data-editable="true" />
                    <button class="btn btn-outline-primary" type="button" data-lookup="client" aria-label="Search client">
                      <i class="bi bi-search"></i>
                    </button>
                    <input type="text" class="form-control" id="ClientName" name="ClientName" placeholder="Client Name" readonly />
                  </div>
                </div>

                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label required" for="ProductID">Product ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control cbs-lookup-id" id="ProductID" name="ProductID" required data-editable="true" />
                    <button class="btn btn-outline-primary" type="button" data-lookup="product" aria-label="Search product">
                      <i class="bi bi-search"></i>
                    </button>
                    <input type="text" class="form-control" id="ProductName" name="ProductName" placeholder="Product Name" readonly />
                  </div>
                </div>

                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="AccountID">Account ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control cbs-lookup-id" id="AccountID" name="AccountID" data-editable="true" />
                    <button class="btn btn-outline-primary" type="button" data-lookup="account" aria-label="Search account">
                      <i class="bi bi-search"></i>
                    </button>
                    <input type="text" class="form-control" id="AccountDescription" name="AccountDescription" placeholder="Account Description" readonly />
                  </div>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="PurposeID">Purpose ID</label>
                  <select class="form-select" id="PurposeID" name="PurposeID" data-editable="true">
                    <option value="">--Select--</option>
                  </select>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ReferenceNo">Reference No.</label>
                  <input type="text" class="form-control" id="ReferenceNo" name="ReferenceNo" data-editable="true" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="LimitAmount">Limit Amount</label>
                  <input type="number" class="form-control" id="LimitAmount" name="LimitAmount" data-editable="true" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ExpiryDate">Expiry Date</label>
                  <input type="date" class="form-control" id="ExpiryDate" name="ExpiryDate" data-editable="true" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="ExchangeRate">Exchange Rate</label>
                  <input type="number" class="form-control" id="ExchangeRate" name="ExchangeRate" data-editable="true" step="0.0001" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="LocalAmount">Local Amount</label>
                  <input type="number" class="form-control" id="LocalAmount" name="LocalAmount" data-editable="true" readonly />
                </div>

                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="Remarks">Remarks</label>
                  <input type="text" class="form-control" id="Remarks" name="Remarks" data-editable="true" />
                </div>
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="ApplicationStatus">Application Status</label>
                  <input type="text" class="form-control" id="ApplicationStatus" name="ApplicationStatus" data-editable="true" />
                </div>
              </div>

              <div class="mt-3">
                <div class="card-surface p-0">
                  <div class="cm-nav-toggle" style="cursor: default;">
                    <span class="cm-nav-toggle__label">Behind The Scene</span>
                    <span></span>
                  </div>
                  <div class="p-3">
                    <div class="cbs-grid cbs-grid--four">
                      <div class="cbs-field">
                        <label class="cbs-label" for="RejectedBy">Rejected By</label>
                        <input type="text" class="form-control" id="RejectedBy" name="RejectedBy" readonly />
                      </div>
                      <div class="cbs-field">
                        <label class="cbs-label" for="RejectedOn">Rejected On</label>
                        <input type="text" class="form-control" id="RejectedOn" name="RejectedOn" readonly />
                      </div>
                      <div class="cbs-field" style="grid-column: span 2;">
                        <label class="cbs-label" for="RejectionReason">Rejection Reason</label>
                        <input type="text" class="form-control" id="RejectionReason" name="RejectionReason" readonly />
                      </div>

                      <div style="grid-column: span 4;">
                        <div class="cbs-grid cbs-grid--tight" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
                          <div class="cbs-field">
                            <label class="cbs-label" for="CreatedBy">Created By</label>
                            <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" readonly />
                          </div>

                          <div class="cbs-field">
                            <label class="cbs-label" for="ModifiedBy">Modified By</label>
                            <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" readonly />
                          </div>

                          <div class="cbs-field">
                            <label class="cbs-label" for="SupervisedBy">Supervised By</label>
                            <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" readonly />
                          </div>
                        </div>
                      </div>

                      <div style="grid-column: span 4;">
                        <div class="cbs-grid cbs-grid--tight" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
                          <div class="cbs-field">
                            <label class="cbs-label" for="CreatedOn">Created On</label>
                            <input type="text" class="form-control" id="CreatedOn" name="CreatedOn" readonly />
                          </div>

                          <div class="cbs-field">
                            <label class="cbs-label" for="ModifiedOn">Modified On</label>
                            <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" readonly />
                          </div>

                          <div class="cbs-field">
                            <label class="cbs-label" for="SupervisedOn">Supervised On</label>
                            <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" readonly />
                          </div>
                        </div>
                      </div>
                    </div>

                    <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>



      <aside class="cm-legacy-actions card-surface h-100 d-flex flex-column" style="min-width:180px;height:100%;">
        <div class="d-flex flex-column h-100 justify-content-between" style="height:100%;min-height:0;">
          <!-- Navigation Buttons (Top) -->
          <div class="d-flex flex-column align-items-center gap-2 pt-3 px-2" style="flex-shrink:0;">
            <!-- Navigation Button with LG styling -->
            <div class="d-flex align-items-center gap-2 justify-content-center w-100">
              <button type="button" class="btn btn-outline-success rounded-circle d-flex align-items-center justify-content-center" style="width:32px;height:32px;flex-shrink:0;" aria-label="Previous Application" data-lg-nav="previous" disabled>
                <i class="bi bi-chevron-left"></i>
              </button>
              <span class="small text-secondary text-nowrap">Application</span>
              <button type="button" class="btn btn-outline-success rounded-circle d-flex align-items-center justify-content-center" style="width:32px;height:32px;flex-shrink:0;" aria-label="Next Application" data-lg-nav="next" disabled>
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>
          </div>
          <!-- Spacer between navigation and data buttons -->
          <div class="flex-grow-1"></div>
          <!-- Data Manipulation Buttons (Bottom) -->
          <div class="d-flex flex-column gap-2 pb-3 px-2" style="flex-shrink:0;">
            <button type="button" class="btn btn-outline-primary d-flex align-items-center justify-content-center gap-2" id="viewBtn" data-lg-mode="view">
              <i class="bi bi-eye"></i> View
            </button>
            <button type="button" class="btn btn-outline-success d-flex align-items-center justify-content-center gap-2" data-lg-mode="add">
              <i class="bi bi-plus-circle"></i> Add
            </button>
            <button type="button" class="btn btn-outline-warning d-flex align-items-center justify-content-center gap-2" data-lg-mode="edit" disabled>
              <i class="bi bi-pencil-square"></i> Edit
            </button>
            <button type="button" class="btn btn-outline-danger d-flex align-items-center justify-content-center gap-2" data-lg-action="delete" disabled>
              <i class="bi bi-trash"></i> Delete
            </button>
            <button type="button" class="btn btn-outline-danger d-flex align-items-center justify-content-center gap-2" id="saveBtn" data-lg-action="save" disabled>
              <i class="bi bi-save"></i> Save
            </button>
            <button type="button" class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2" data-lg-action="cancel" disabled>
              <i class="bi bi-x-circle"></i> Cancel
            </button>
          </div>
        </div>
      </aside>
    </form>
  </div>

  <!-- Lookup Modal -->
  <div class="modal fade" id="lookupModal" tabindex="-1" aria-labelledby="lookupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="lookupModalLabel">Lookup</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-2 align-items-end mb-3" id="lookupSimpleSearch">
            <div class="col-12 col-md-8">
              <label for="lookupSearchInput" class="form-label mb-1">Search</label>
              <input type="text" class="form-control" id="lookupSearchInput" placeholder="Type to search..." />
            </div>
            <div class="col-12 col-md-4 d-flex gap-2">
              <button type="button" class="btn btn-primary flex-fill" id="lookupSearchBtn">Search</button>
              <button type="button" class="btn btn-outline-secondary flex-fill" id="lookupClearBtn">Clear</button>
            </div>
          </div>

          <!-- Advanced product search (shown only for ProductID lookup) -->
          <div class="mb-3 d-none" id="lookupAdvancedSearch">
            <form class="row g-2 align-items-end" id="lookupAdvancedForm" data-lookup-form>
              <!-- Branch lookup fields -->
              <div class="row g-2 align-items-end" data-lookup-scope="branch">
                <div class="col-12 col-lg-6">
                  <label class="form-label mb-1">Branch ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="OurBranchID" aria-label="Branch ID Filter Type" title="Branch ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="OurBranchID" placeholder="e.g. 0101" title="Branch ID Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-6">
                  <label class="form-label mb-1">Branch Name</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="BranchName" aria-label="Branch Name Filter Type" title="Branch Name Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="BranchName" placeholder="Branch name" title="Branch Name Search Term" />
                  </div>
                </div>
              </div>

              <!-- LG Application lookup fields -->
              <div class="row g-2 align-items-end d-none" data-lookup-scope="application">
                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Application ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="ApplicationID" aria-label="Application ID Filter Type" title="Application ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="ApplicationID" placeholder="e.g. 2024000008" title="Application ID Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Client ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="ClientID" aria-label="Client ID Filter Type" title="Client ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="ClientID" placeholder="e.g. CSK00092" title="Client ID Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Product ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="ProductID" aria-label="Product ID Filter Type" title="Product ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="ProductID" placeholder="e.g. LG001" title="Product ID Search Term" />
                  </div>
                </div>
              </div>

              <!-- Client lookup fields (mirrors client maintenance) -->
              <div class="row g-2 align-items-end d-none" data-lookup-scope="client">
                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Client ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="ClientID" aria-label="Client ID Filter Type" title="Client ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="ClientID" placeholder="e.g. CSK00092" title="Client ID Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Client Name</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="ClientName" aria-label="Client Name Filter Type" title="Client Name Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="ClientName" placeholder="Client name" title="Client Name Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">ID Number</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="IDNumber" aria-label="ID Number Filter Type" title="ID Number Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="IDNumber" placeholder="National ID" title="ID Number Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Mobile No</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="MobileNo" aria-label="Mobile No Filter Type" title="Mobile No Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="MobileNo" placeholder="e.g. 0712..." title="Mobile No Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Legacy Account ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="LegacyAccountID" aria-label="Legacy Account ID Filter Type" title="Legacy Account ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="LegacyAccountID" placeholder="Legacy account" title="Legacy Account Search Term" />
                  </div>
                </div>
              </div>

              <!-- Product lookup fields -->
              <div class="row g-2 align-items-end d-none" data-lookup-scope="product">
                <div class="col-12 col-lg-6">
                  <label class="form-label mb-1">Product ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="ProductID" aria-label="Product ID Filter Type" title="Product ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="ProductID" placeholder="e.g. LG001" title="Product ID Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-6">
                  <label class="form-label mb-1">Description</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="Description" aria-label="Description Filter Type" title="Description Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="Description" placeholder="Product name / description" title="Description Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Product Type</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="ProductTypeID" aria-label="Product Type Filter Type" title="Product Type Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="ProductTypeID" placeholder="e.g. LG" title="Product Type Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Currency</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="CurrencyID" aria-label="Currency Filter Type" title="Currency Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="CurrencyID" placeholder="e.g. ETB" title="Currency Search Term" />
                  </div>
                </div>
              </div>

              <!-- Account lookup fields -->
              <div class="row g-2 align-items-end d-none" data-lookup-scope="account">
                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Account ID</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="AccountID" aria-label="Account ID Filter Type" title="Account ID Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="AccountID" placeholder="Account ID" title="Account ID Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Account Name</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="AccountName" aria-label="Account Name Filter Type" title="Account Name Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
                    </select>
                    <input type="text" class="form-control" data-lookup-field="AccountName" placeholder="Account name" title="Account Name Search Term" />
                  </div>
                </div>

                <div class="col-12 col-lg-4">
                  <label class="form-label mb-1">Currency</label>
                  <div class="input-group">
                    <select class="form-select" data-lookup-mode="CurrencyID" aria-label="Currency Filter Type" title="Currency Filter Type">
                      <option value="Like" selected>Contains</option>
                      <option value="Exact">Exact</option>
