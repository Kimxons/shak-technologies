<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Close LG · Letter of Guarantee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="../css/close-lg.css" />
</head>

<body class="close-lg copilot-theme" data-page="close-lg">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="close-lg-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-content-scroll">
          <section id="close-lg-main" class="cm-section cm-section--active" data-step="close-lg-main">
            <div class="card-surface p-3">
              <div class="cbs-grid cbs-grid--quad">
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="ApplicationID">Application ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control cbs-lookup-id" id="ApplicationID" name="ApplicationID" data-editable="true" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search application" data-close-lg-lookup="application">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="cbs-field" style="grid-column: span 4;">
                  <label class="cbs-label" for="ClientID">Client ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control cbs-lookup-id" id="ClientID" name="ClientID" data-editable="true" />
                    <input type="text" class="form-control" id="ClientName" name="ClientName" placeholder="" readonly />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search client" data-close-lg-lookup="client">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="cbs-field" style="grid-column: span 4;">
                  <label class="cbs-label" for="AccountID">Account ID</label>
                  <div class="input-group">
                    <input type="text" class="form-control cbs-lookup-id" id="AccountID" name="AccountID" data-editable="true" />
                    <input type="text" class="form-control" id="AccountName" name="AccountName" placeholder="" readonly />
                    <button class="btn btn-outline-primary" type="button" aria-label="Search account" data-close-lg-lookup="account">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="cbs-field" style="grid-column: span 1;">
                  <label class="cbs-label" for="LGNumber">LG Number</label>
                  <input type="text" class="form-control" id="LGNumber" name="LGNumber" data-editable="true" />
                </div>

                <div class="cbs-field" style="grid-column: span 1;">
                  <label class="cbs-label" for="ExpiryDate">Expiry Date</label>
                  <input type="date" class="form-control" id="ExpiryDate" name="ExpiryDate" data-editable="true" />
                </div>

                <div class="cbs-field" style="grid-column: span 4;">
                  <label class="cbs-label" for="ReleasedReason">Released Reason</label>
                  <input type="text" class="form-control" id="ReleasedReason" name="ReleasedReason" data-editable="true" />
                </div>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <h3 class="section-title mb-3">Transaction Details</h3>

              <div class="cbs-grid cbs-grid--quad">
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="Component">Component</label>
                  <input type="text" class="form-control" id="Component" name="Component" data-editable="true" />
                </div>
                <div class="cbs-field" style="grid-column: span 1;">
                  <label class="cbs-label" for="ActualAmount">Actual Amount</label>
                  <input type="number" class="form-control" id="ActualAmount" name="ActualAmount" data-editable="true" />
                </div>
                <div class="cbs-field" style="grid-column: span 1;">
                  <label class="cbs-label" for="SettlementAmount">Settlement Amount</label>
                  <input type="number" class="form-control" id="SettlementAmount" name="SettlementAmount" data-editable="true" />
                </div>
              </div>

              <div class="d-flex gap-2 justify-content-center my-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-close-lg-action="alter">Alter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-close-lg-action="update">Update</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-close-lg-action="clear-grid">Clear</button>
              </div>

              <div class="table-responsive">
                <table class="table table-sm table-bordered mb-0">
                  <thead>
                    <tr>
                      <th>Component</th>
                      <th>CR AccountID</th>
                      <th>CrAccountName</th>
                      <th>DrAccountTypeID</th>
                      <th>DR AccountID</th>
                      <th>DrAccountName</th>
                      <th>Actual Amount</th>
                      <th>Settlement Amount</th>
                      <th>IsEditable</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="9">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="cbs-grid cbs-grid--quad mt-2">
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="NetAmount">Net Amount</label>
                  <input type="number" class="form-control" id="NetAmount" name="NetAmount" readonly />
                </div>
              </div>
            </div>

            <div class="card-surface p-3 mt-3">
              <h3 class="section-title section-title--full mb-3">Behind The Scene</h3>
              <div class="cbs-grid cbs-grid--quad">
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="ReleasedBy">Released By</label>
                  <input type="text" class="form-control" id="ReleasedBy" name="ReleasedBy" readonly />
                </div>
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="ReleasedOn">Released On</label>
                  <input type="date" class="form-control" id="ReleasedOn" name="ReleasedOn" readonly />
                </div>
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="SupervisedBy">Supervised By</label>
                  <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" readonly />
                </div>
                <div class="cbs-field" style="grid-column: span 2;">
                  <label class="cbs-label" for="SupervisedOn">Supervised On</label>
                  <input type="date" class="form-control" id="SupervisedOn" name="SupervisedOn" readonly />
                </div>
              </div>

              <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-close-lg-action="charges">Charges</button>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-close-lg-action="add">Add</button>
          <button type="button" class="cm-shell__action" data-close-lg-action="close">Close</button>
          <button type="button" class="cm-shell__action" data-close-lg-action="cancel">Cancel</button>
          <button type="button" class="cm-shell__action" data-close-lg-action="back">Back</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/close-lg.js"></script>
</body>

</html>
