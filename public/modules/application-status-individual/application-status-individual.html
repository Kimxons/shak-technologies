<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Status - Individual</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <!-- Main Container -->
        <div class="main-container main-container--no-sidebar">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <form id="applicationStatusForm" novalidate>
                        <!-- Search Criteria Section -->
                        <div class="form-section" data-section="search-criteria">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-funnel"></i> Search Criteria</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Search Criteria" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Branch ID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="branchId" class="kairo-branch-control__id" placeholder="ID">
                                            <input type="text" id="branchName" class="kairo-branch-control__name" placeholder="Branch Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchBranchBtn" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">WorkFlow Type ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="workflowTypeId" class="kairo-branch-control__id" placeholder="ID">
                                            <input type="text" id="workflowTypeName" class="kairo-branch-control__name" placeholder="WorkFlow Type Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchWorkflowTypeBtn" aria-label="Search WorkFlow Type"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Application ID</label>
                                        <div class="kairo-control" data-kairo-control>
                                            <input type="text" id="applicationId" class="kairo-control__id" placeholder="Application ID">
                                            <button type="button" class="btn-lookup kairo-control__lookup" id="searchApplicationBtn" aria-label="Search Application"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Application Details Section -->
                        <div class="form-section" data-section="application-details">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-file-text"></i> Application Details</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Application Details" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Client ID</label>
                                        <input type="text" id="clientId" class="bs-input-text" placeholder="Client ID" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Phone</label>
                                        <input type="text" id="phone" class="bs-input-text" placeholder="Phone" readonly>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col">
                                        <label class="label-blue">Mailing Address</label>
                                        <input type="text" id="mailingAddress" class="bs-input-text" placeholder="Mailing Address" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">City</label>
                                        <input type="text" id="city" class="bs-input-text" placeholder="City" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Account ID</label>
                                        <input type="text" id="accountId" class="bs-input-text" placeholder="Account ID" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Product ID</label>
                                        <input type="text" id="productId" class="bs-input-text" placeholder="Product ID" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Loan Amount</label>
                                        <input type="text" id="loanAmount" class="bs-input-text" placeholder="Loan Amount" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Currency ID</label>
                                        <input type="text" id="currencyId" class="bs-input-text" placeholder="Currency ID" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Term</label>
                                        <input type="text" id="term" class="bs-input-text" placeholder="Term" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Repayment Term</label>
                                        <input type="text" id="repaymentTerm" class="bs-input-text" placeholder="Repayment Term" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Interest Rate</label>
                                        <input type="text" id="interestRate" class="bs-input-text" placeholder="Interest Rate" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Interest Rate Type</label>
                                        <input type="text" id="interestRateType" class="bs-input-text" placeholder="Interest Rate Type" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Installment Amount</label>
                                        <input type="text" id="installmentAmount" class="bs-input-text" placeholder="Installment Amount" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Calculation Method</label>
                                        <input type="text" id="calculationMethod" class="bs-input-text" placeholder="Calculation Method" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Net Collateral Value</label>
                                        <input type="text" id="netCollateralValue" class="bs-input-text" placeholder="Net Collateral Value" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Application Status</label>
                                        <input type="text" id="applicationStatus" class="bs-input-text" placeholder="Application Status" readonly>
                                    </div>
                                    <div class="col"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Status Reasons Section -->
                        <div class="form-section" data-section="status-reasons">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-clipboard-check"></i> Status Reasons</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Status Reasons" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-sm table-bordered table-hover">
                                        <thead class="table-light">
                                            <tr>
                                                <th>RuleName</th>
                                                <th>RuleType</th>
                                                <th>IsPassed</th>
                                                <th>Remarks</th>
                                            </tr>
                                        </thead>
                                        <tbody id="statusReasonsTableBody">
                                            <tr>
                                                <td colspan="4" class="text-center text-muted">No Records To Display</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" id="viewBtn">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/common/form-init.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="application-status-individual.js"></script>
</body>
</html>
