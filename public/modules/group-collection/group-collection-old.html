<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Group Collection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="group-collection.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="group-collection">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Form Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <!-- Row 1: Branch ID and Center ID -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Branch ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="branchIdField" placeholder="0101" />
                <input type="text" class="form-control" placeholder="Head Office" style="border-left: none;" />
                <button class="btn" type="button" data-search="branchId">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Center ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="centerIdField" />
                <button class="btn" type="button" data-search="centerId">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Row 2: Credit Officer ID and Serial ID -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Credit Officer ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="creditOfficerIdField" />
                <button class="btn" type="button" data-search="creditOfficerId">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #5b9fd9; font-size: 0.75rem; display: block; margin-bottom: 4px;">Serial ID</label>
              <input type="text" class="form-control" id="serialIdField" />
            </div>
          </div>
        </div>

        <!-- Group Projection Details Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; margin-bottom: 8px; font-weight: 600; font-size: 0.8rem;">
            Group Projection Details
          </div>
          <div style="flex: 1; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 0.375rem; margin-bottom: 12px;">
            <table class="table" style="margin-bottom: 0;">
              <thead>
                <tr>
                  <th style="width: 30px;"><input type="checkbox" id="selectAllCheckbox" /></th>
                  <th>Component</th>
                  <th>Expected Amount</th>
                  <th>Received Amount</th>
                </tr>
              </thead>
              <tbody id="projectionDetailsBody">
                <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                  <td colspan="4" style="padding: 20px;">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Total Expected and Total Received -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Total Expected</label>
              <input type="text" class="form-control" id="totalExpectedField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Total Received</label>
              <input type="text" class="form-control" id="totalReceivedField" readonly style="background-color: #f9fafb;" />
            </div>
          </div>
        </div>

        <!-- Collection Details Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <!-- Row 1: Value Date and Till -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Value Date</label>
              <select class="form-select" id="valueDateSelect">
                <option value="">--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Till</label>
              <input type="text" class="form-control" id="tillField" />
            </div>
          </div>

          <!-- Row 2: Transaction Type and Ref # -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Transaction Type</label>
              <select class="form-select" id="transactionTypeSelect">
                <option value="">--Select--</option>
                <option value="Cash">Cash</option>
                <option value="Cheque">Cheque</option>
                <option value="Transfer">Transfer</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Ref #</label>
              <input type="text" class="form-control" id="refField" />
            </div>
          </div>

          <!-- Row 3: Center Collection AccountID and Contra Account ID -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Center Collection AccountID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="centerCollectionAcctIdField" />
                <button class="btn" type="button" data-search="centerCollectionAcctId">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Contra Account ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="contraAccountIdField" />
                <button class="btn" type="button" data-search="contraAccountId">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Row 4: Narration -->
          <div>
            <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Narration</label>
            <textarea class="form-control" id="narrationField" style="height: 60px; resize: none;"></textarea>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; margin-bottom: 8px; font-weight: 600; font-size: 0.8rem;">
            Behind The Scene
          </div>

          <!-- Row 1: Saving Balance, Member #, O/S Loan Balance -->
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Saving Balance</label>
              <input type="text" class="form-control" id="savingBalanceField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Member #</label>
              <input type="text" class="form-control" id="memberField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">O/S Loan Balance</label>
              <input type="text" class="form-control" id="osLoanBalanceField" readonly style="background-color: #f9fafb;" />
            </div>
          </div>

          <!-- Row 2: Net Balance, Saving / OS Loan %, Total Loan Amount -->
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Net Balance</label>
              <input type="text" class="form-control" id="netBalanceField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Saving / OS Loan %</label>
              <input type="text" class="form-control" id="savingOsLoanPctField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Total Loan Amount</label>
              <input type="text" class="form-control" id="totalLoanAmountField" readonly style="background-color: #f9fafb;" />
            </div>
          </div>

          <!-- Row 3: Created By, Supervised By -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Created By</label>
              <input type="text" class="form-control" id="createdByField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Supervised By</label>
              <input type="text" class="form-control" id="supervisedByField" readonly style="background-color: #f9fafb;" />
            </div>
          </div>

          <!-- Row 4: Created On, Supervised On -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Created On</label>
              <input type="text" class="form-control" id="createdOnField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Supervised On</label>
              <input type="text" class="form-control" id="supervisedOnField" readonly style="background-color: #f9fafb;" />
            </div>
          </div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 12px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; font-weight: 600; font-size: 0.8rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="gc-action-btn" id="viewAllBtn">View All</button>
      <button class="gc-action-btn" id="printBtn">Print</button>
      <button class="gc-action-btn" id="denominationBtn">Denomination</button>
      <button class="gc-action-btn" id="viewBtn">View</button>
      <button class="gc-action-btn" id="addBtn">Add</button>
      <button class="gc-action-btn" id="editBtn">Edit</button>
      <button class="gc-action-btn" id="deleteBtn">Delete</button>
      <button class="gc-action-btn" id="saveBtn">Save</button>
      <button class="gc-action-btn" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script src="group-collection.js"></script>
</body>
</html>
