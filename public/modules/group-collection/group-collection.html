<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Group Collection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>

  <!-- Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

  <div class="window">
    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card" data-main-form>
          
          <!-- Query Form Section -->
          <div class="form-section" data-section="query-form">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-search"></i> Query Form</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Query Form" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Branch</label>
                  <div class="kairo-branch-control" data-kairo-branch-control>
                    <input type="text" id="branchIdField" class="kairo-branch-control__id" aria-label="Branch ID" placeholder="ID">
                    <input type="text" id="branchNameField" class="kairo-branch-control__name" aria-label="Branch Name" placeholder="Branch Name" readonly>
                    <button type="button" class="btn-lookup kairo-branch-control__lookup" data-search="branchId" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label>Serial ID</label>
                  <input type="text" id="serialIdField" class="bs-input-text">
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Center</label>
                  <div class="kairo-branch-control" data-kairo-center-control>
                    <input type="text" id="centerIdField" class="kairo-branch-control__id" aria-label="Center ID" placeholder="ID">
                    <input type="text" id="centerNameField" class="kairo-branch-control__name" aria-label="Center Name" placeholder="Center Name" readonly>
                    <button type="button" class="btn-lookup kairo-branch-control__lookup" data-search="centerId" aria-label="Search Center"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Credit Officer</label>
                  <div class="kairo-branch-control" data-kairo-officer-control>
                    <input type="text" id="creditOfficerIdField" class="kairo-branch-control__id" aria-label="Credit Officer ID" placeholder="ID">
                    <input type="text" id="creditOfficerNameField" class="kairo-branch-control__name" aria-label="Credit Officer Name" placeholder="Officer Name" readonly>
                    <button type="button" class="btn-lookup kairo-branch-control__lookup" data-search="creditOfficerId" aria-label="Search Officer"><i class="bi bi-search"></i></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Group Projection Details Section -->
          <div class="form-section" data-section="projection-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-grid"></i> Group Projection Details</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Projection Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="table-responsive mb-3">
                <table class="table table-bordered table-hover table-sm">
                  <thead class="table-light">
                    <tr>
                      <th style="width: 50px; text-align: center;"><input type="checkbox" class="form-check-input" id="selectAllCheckbox" /></th>
                      <th>Component</th>
                      <th style="text-align: right;">Expected Amount</th>
                      <th style="text-align: right;">Received Amount</th>
                    </tr>
                  </thead>
                  <tbody id="projectionDetailsBody">
                    <tr>
                      <td colspan="4" class="text-center text-muted" style="padding: 20px;">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Total Summary -->
              <div class="form-row two-col">
                <div class="col">
                  <label>Total Expected</label>
                  <input type="text" id="totalExpectedField" class="bs-input-text" data-format="money" readonly />
                </div>
                <div class="col">
                  <label>Total Received</label>
                  <input type="text" id="totalReceivedField" class="bs-input-text" data-format="money" readonly />
                </div>
              </div>
            </div>
          </div>

          <!-- Collection Details Section -->
          <div class="form-section" data-section="collection-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-collection"></i> Collection Details</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Collection Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label>Value Date</label>
                  <div class="input-group">
                    <input type="text" id="valueDateField" class="form-control" placeholder="Select date" readonly />
                    <button type="button" class="input-group-text date-picker-icon" aria-label="Open calendar"><i class="bi bi-calendar3"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label>Till</label>
                  <input type="text" id="tillField" class="bs-input-text" />
                  <input type="hidden" id="tillIdField" />
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label>Transaction Type</label>
                  <select class="form-select" id="transactionTypeSelect">
                    <option value="">--Select--</option>
                  </select>
                </div>
                <div class="col">
                  <label>Ref #</label>
                  <input type="text" id="refField" class="bs-input-text" />
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label>Center Collection AccountID</label>
                  <div class="kairo-branch-control" data-kairo-collection-control>
                    <input type="text" id="centerCollectionAcctIdField" class="kairo-branch-control__id" aria-label="Collection Account ID" placeholder="ID">
                    <input type="text" id="centerCollectionAcctNameField" class="kairo-branch-control__name" aria-label="Collection Account Name" placeholder="Account Name" readonly>
                    <button type="button" class="btn-lookup kairo-branch-control__lookup" data-search="centerCollectionAcctId" aria-label="Search Account"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label>Contra Account ID</label>
                  <div class="kairo-branch-control" data-kairo-contra-control>
                    <input type="text" id="contraAccountIdField" class="kairo-branch-control__id" aria-label="Contra Account ID" placeholder="ID">
                    <input type="text" id="contraAccountNameField" class="kairo-branch-control__name" aria-label="Contra Account Name" placeholder="Account Name" readonly>
                    <button type="button" class="btn-lookup kairo-branch-control__lookup" data-search="contraAccountId" aria-label="Search Contra"><i class="bi bi-search"></i></button>
                  </div>
                </div>
              </div>

              <div class="form-row">
                <label>Narration</label>
                <textarea id="narrationField" class="form-control" rows="2"></textarea>
              </div>
            </div>
          </div>

          <!-- Behind The Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i> Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="behind-scene">
                <div class="behind-scene-grid">
                  <div class="behind-scene-item">
                    <label>Saving Balance</label>
                    <div class="value-row"><span class="behind-scene-value" id="savingBalanceField"></span></div>
                  </div>
                  <div class="behind-scene-item">
                    <label>Member #</label>
                    <div class="value-row"><span class="behind-scene-value" id="memberField"></span></div>
                  </div>
                  <div class="behind-scene-item">
                    <label>O/S Loan Balance</label>
                    <div class="value-row"><span class="behind-scene-value" id="osLoanBalanceField"></span></div>
                  </div>
                  <div class="behind-scene-item">
                    <label>Saving / OS Loan %</label>
                    <div class="value-row"><span class="behind-scene-value" id="savingOsLoanPctField"></span></div>
                  </div>
                  <div class="behind-scene-item">
                    <label>Net Balance</label>
                    <div class="value-row"><span class="behind-scene-value" id="netBalanceField"></span></div>
                  </div>
                  <div class="behind-scene-item">
                    <label>Total Loan Amount</label>
                    <div class="value-row"><span class="behind-scene-value" id="totalLoanAmountField"></span></div>
                  </div>
                </div>
              </div>

              <!-- Audit Trail -->
              <div class="audit-section">
                <div class="audit-block">
                  <div class="audit-item">
                    <label>Created By</label>
                    <span class="audit-value" id="createdByField"></span>
                  </div>
                  <div class="audit-item">
                    <label>Created On</label>
                    <span class="audit-value" id="createdOnField"></span>
                  </div>
                </div>
                <div class="audit-block">
                  <div class="audit-item">
                    <label>Supervised By</label>
                    <span class="audit-value" id="supervisedByField"></span>
                  </div>
                  <div class="audit-item">
                    <label>Supervised On</label>
                    <span class="audit-value" id="supervisedOnField"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Right Action Panel -->
      <div class="action-panel">
        <!-- Top Quick Actions -->
        <div class="action-buttons-top">
          <button id="viewAllBtn" class="btn-action" type="button"><i class="bi bi-list-ul me-1"></i>View All</button>
          <button id="printBtn" class="btn-action" type="button"><i class="bi bi-printer me-1"></i>Print</button>
          <button id="denominationBtn" class="btn-action" type="button"><i class="bi bi-currency-dollar me-1"></i>Denom</button>
        </div>
        <!-- Bottom CRUD Actions -->
        <div class="action-buttons">
          <button id="viewBtn" class="btn-action btn-view" type="button"><i class="bi bi-eye me-1"></i>View</button>
          <button id="addBtn" class="btn-action" type="button"><i class="bi bi-plus-circle me-1"></i>Add</button>
          <button id="editBtn" class="btn-action" type="button"><i class="bi bi-pencil-square me-1"></i>Edit</button>
          <button id="deleteBtn" class="btn-action btn-cancel" type="button"><i class="bi bi-trash me-1"></i>Delete</button>
          <button id="saveBtn" class="btn-action" type="button" data-action="save"><i class="bi bi-check-lg me-1"></i>Save</button>
          <button id="cancelBtn" class="btn-action btn-cancel" type="button" data-action="cancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Results Modal (Bootstrap Modal) -->
  <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <div>
            <p class="mb-0 small">Group Collection</p>
            <h5 class="modal-title" id="searchModalLabel">Search Results</h5>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Filter Section -->
          <div class="row g-3 mb-3">
            <div class="col-md-5">
              <label class="form-label small">ID</label>
              <div class="input-group input-group-sm">
                <select id="branchIdOperator" class="form-select" style="max-width: 100px;">
                  <option value="like">Like</option>
                  <option value="equals">Equals</option>
                  <option value="starts">Starts With</option>
                </select>
                <input type="text" id="filterBranchId" class="form-control" placeholder="Enter ID" />
              </div>
            </div>
            <div class="col-md-5">
              <label class="form-label small">Name</label>
              <div class="input-group input-group-sm">
                <select id="branchNameOperator" class="form-select" style="max-width: 100px;">
                  <option value="like">Like</option>
                  <option value="equals">Equals</option>
                  <option value="starts">Starts With</option>
                </select>
                <input type="text" id="filterBranchName" class="form-control" placeholder="Enter Name" />
              </div>
            </div>
            <div class="col-md-2 d-flex align-items-end gap-2">
              <button id="applyFilterBtn" class="btn btn-primary btn-sm"><i class="bi bi-search"></i></button>
              <button id="clearFilterBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-circle"></i></button>
            </div>
          </div>
          <!-- Results Table -->
          <div class="table-responsive">
            <table class="table table-bordered table-hover table-sm" id="searchResultsTable">
              <thead class="table-light">
                <tr>
                  <th id="searchHeaderId">ID</th>
                  <th id="searchHeaderName">Name</th>
                  <th style="width: 80px;">Action</th>
                </tr>
              </thead>
              <tbody id="searchResultsBody">
                <tr>
                  <td colspan="3" class="text-center text-muted" style="padding: 20px;">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <small class="text-muted me-auto">Results from Core Banking.</small>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="group-collection.js"></script>
</body>
</html>
