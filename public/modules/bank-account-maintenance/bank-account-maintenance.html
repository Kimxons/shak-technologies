<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank Account Maintenance · Other Modules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    /* Compact Flatpickr calendar */
    .flatpickr-calendar {
      font-size: 12px;
      width: 260px !important;
    }
    .flatpickr-calendar .flatpickr-month {
      height: 28px;
    }
    .flatpickr-calendar .flatpickr-current-month {
      font-size: 13px;
      padding-top: 4px;
    }
    .flatpickr-calendar .flatpickr-weekdays {
      height: 24px;
    }
    .flatpickr-calendar .flatpickr-weekday {
      font-size: 11px;
    }
    .flatpickr-calendar .flatpickr-days {
      width: 260px !important;
    }
    .flatpickr-calendar .dayContainer {
      width: 260px !important;
      min-width: 260px !important;
      max-width: 260px !important;
    }
    .flatpickr-calendar .flatpickr-day {
      width: 34px;
      height: 30px;
      line-height: 30px;
      font-size: 12px;
    }
    /* Reconciliation Keys validation styling */
    #reconciliationKeysContainer.is-invalid {
      border: 2px solid #dc3545;
      border-radius: 6px;
      padding: 8px;
      background-color: rgba(220, 53, 69, 0.05);
    }
    #reconciliationKeysContainer.is-invalid .form-check-input {
      border-color: #dc3545;
    }
  </style>
</head>

<body class="bank-account-maintenance" data-page="bank-account-maintenance">
  <div class="kairo-toast-container" data-kairo-toast-container aria-live="polite" aria-relevant="additions"></div>

  <div class="window" data-module="bank-account-maintenance">
    <div class="main-container">
      <div class="form-content">
        <div class="form-card" data-main-form>
          <form id="bank-account-maintenance-form" autocomplete="off" novalidate>

            <!-- Application Details Section -->
            <div class="form-section" data-section="application-details">
              <div class="alert alert-danger d-flex align-items-center justify-content-between py-2 px-3 mb-3 d-none" role="alert" data-bam-alert>
                <div class="d-flex align-items-center gap-2 small">
                  <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                  <span data-bam-alert-text></span>
                </div>
                <button type="button" class="btn-close" aria-label="Close" data-bam-alert-close></button>
              </div>
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid" aria-hidden="true"></i>Application Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Application Details" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>

                <!-- Row 1: GL Account ID + Base Branch -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="glAccountId">GL Account ID</label>
                    <div class="d-flex gap-0 w-100">
                      <input type="text" class="bs-input-text form-control rounded-end-0" style="flex: 0 0 30%; width: auto;" id="glAccountId" name="glAccountId" placeholder="Type GL Account ID" data-always-enabled />
                      <input type="text" class="bs-input-text form-control rounded-0" style="flex: 0 0 50%; width: auto;" id="glAccountDescription" name="glAccountDescription" aria-label="GL Account Description" readonly />
                      <button type="button" class="btn-lookup rounded-start-0" aria-label="Lookup GL Account" title="Lookup GL Account">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue bs-label-mand" for="baseBranch">Base Branch</label>
                    <div class="d-flex gap-0 w-100">
                      <input type="text" class="bs-input-text form-control rounded-end-0" style="flex: 0 0 30%; width: auto;" id="baseBranch" name="baseBranch" placeholder="Type Base Branch" data-always-enabled />
                      <input type="text" class="bs-input-text form-control rounded-0" style="flex: 0 0 50%; width: auto;" id="baseBranchDescription" name="baseBranchDescription" aria-label="Base Branch Description" readonly />
                      <button type="button" class="btn-lookup rounded-start-0" aria-label="Lookup Base Branch" title="Lookup Base Branch">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Row 2: Bank Account No + Bank Account Name -->
                <div class="form-row two-col">
                  <div class="col" style="flex: 0 0 50%; max-width: 50%;">
                    <label class="label-blue bs-label-mand" for="bankAccountNo">Bank Account No</label>
                    <input type="text" class="bs-input-text form-control w-100" id="bankAccountNo" name="bankAccountNo" />
                  </div>
                  <div class="col" style="flex: 0 0 60%; max-width: 60%;">
                    <label class="label-blue" for="bankAccountName">Bank Account Name</label>
                    <input type="text" class="bs-input-text form-control w-100" id="bankAccountName" name="bankAccountName" />
                  </div>
                </div>

                <!-- Row 3: Reconciliation Keys -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue">Reconciliation Keys</label>
                    <div class="d-flex flex-column gap-3 mt-2" id="reconciliationKeysContainer">
                      <label class="d-flex align-items-center gap-2 mb-0" for="checkIdAmount" style="cursor: pointer;">
                        <input class="form-check-input" type="checkbox" id="checkIdAmount" name="checkIdAmount" style="width: 18px; height: 18px; margin: 0; flex-shrink: 0;" />
                        <span>Cheque ID + Amount</span>
                      </label>
                      <label class="d-flex align-items-center gap-2 mb-0" for="referenceNoAmount" style="cursor: pointer;">
                        <input class="form-check-input" type="checkbox" id="referenceNoAmount" name="referenceNoAmount" style="width: 18px; height: 18px; margin: 0; flex-shrink: 0;" />
                        <span>Reference No + Amount</span>
                      </label>
                    </div>
                  </div>
                  <div class="col"></div>
                </div>

                <!-- Row 4: Start Date + Bank Opening Balance Date + Bank Opening Balance -->
                <div class="form-row" style="display: flex; gap: 1rem;">
                  <div class="col" style="flex: 0 0 30%; max-width: 30%;">
                    <label class="label-blue" for="startDate">Start Date</label>
                    <div class="d-flex gap-0 w-100">
                      <input type="text" class="bs-input-text form-control flex-grow-1 rounded-end-0" id="startDate" name="startDate" placeholder="DD/Mon/YYYY" readonly />
                      <button type="button" class="btn-lookup rounded-start-0" id="startDatePickBtn" aria-label="Pick Start Date" title="Pick Start Date">
                        <i class="bi bi-calendar3" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col" style="flex: 0 0 30%; max-width: 30%;">
                    <label class="label-blue" for="bankOpeningBalanceDate">Bank Opening Balance Date</label>
                    <div class="d-flex gap-0 w-100">
                      <input type="text" class="bs-input-text form-control flex-grow-1 rounded-end-0 text-start" style="text-align: left !important;" id="bankOpeningBalanceDate" name="bankOpeningBalanceDate" placeholder="DD/Mon/YYYY" readonly />
                      <button type="button" class="btn-lookup rounded-start-0" id="bankOpeningBalanceDatePickBtn" aria-label="Pick Bank Opening Balance Date" title="Pick Bank Opening Balance Date">
                        <i class="bi bi-calendar3" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col" style="flex: 0 0 20%; max-width: 20%;">
                    <label class="label-blue" for="bankOpeningBalance">Bank Opening Balance</label>
                    <input type="text" class="bs-input-text form-control w-100" id="bankOpeningBalance" name="bankOpeningBalance" />
                  </div>
                </div>

              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-eye" aria-hidden="true"></i>BEHIND THE SCENE</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="behind-scene p-4 p-lg-5">
                  <div class="row gx-5 gy-4">
                    <div class="col-12 col-md-6 d-flex flex-column gap-4">
                      <div>
                        <label class="label-blue mb-2" for="glSyncDate">GL Sync Date</label>
                        <input type="text" class="bs-input-text form-control w-100 d-block" id="glSyncDate" name="glSyncDate" readonly disabled />
                      </div>
                    </div>
                    <div class="col-12 col-md-6 d-flex flex-column gap-4">
                      <div>
                        <label class="label-blue mb-2" for="reconciliationDate">Reconciliation Date</label>
                        <input type="text" class="bs-input-text form-control w-100 d-block" id="reconciliationDate" name="reconciliationDate" readonly disabled />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </form>
        </div>
      </div>

      <!-- Right Action Panel -->
      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" id="viewBtn" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" id="addBtn" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" id="synchronizeBtn"><i class="bi bi-arrow-repeat"></i> Synchronize</button>
          <button type="button" class="btn-action" id="editBtn" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" id="deleteBtn"><i class="bi bi-trash"></i> Delete</button>
          <button type="button" class="btn-action" id="saveBtn"><i class="bi bi-check"></i> Save</button>
          <button type="button" class="btn-action btn-cancel" id="cancelBtn"><i class="bi bi-x"></i> Cancel</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- GL Account Lookup Modal -->
  <div class="modal fade" id="glAccountLookupModal" tabindex="-1" aria-labelledby="glAccountLookupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white d-flex justify-content-between align-items-center">
          <div>
            <p class="mb-0 small">GL Account</p>
            <h5 class="modal-title" id="glAccountLookupModalLabel">Find a GL Account</h5>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-sm btn-outline-light" id="glAccountSearchRefresh" aria-label="Refresh" title="Refresh">
              <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>

        <div class="modal-body">
          <form id="glAccountLookupForm" class="row g-3 align-items-end mb-3">
            <div class="col-md-4">
              <label class="form-label" for="glAccountSearchId">GL Account ID</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="glAccountSearchModeId" aria-label="GL Account ID match mode">
                  <option value="Like">Contains</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="glAccountSearchId" placeholder="e.g. 1001" />
              </div>
            </div>

            <div class="col-md-4">
              <label class="form-label" for="glAccountSearchDesc">Description</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="glAccountSearchModeDesc" aria-label="Description match mode">
                  <option value="Like">Contains</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="glAccountSearchDesc" placeholder="Account description" />
              </div>
            </div>

            <div class="col-md-4 text-center">
              <button type="submit" class="btn btn-primary btn-sm" id="glAccountSearchSubmit">
                <i class="bi bi-search" aria-hidden="true"></i> Search
              </button>
            </div>
          </form>

          <div class="position-relative" style="min-height: 300px;">
            <div class="table-responsive">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">GL Account ID</th>
                    <th scope="col">Description</th>
                    <th scope="col">GL Account Type</th>
                    <th scope="col">Currency</th>
                    <th scope="col" class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="glAccountSearchResults"></tbody>
              </table>
            </div>

            <div id="glAccountSearchEmpty" class="text-center py-5 text-muted">No GL accounts found.</div>

            <div id="glAccountSearchLoading" class="d-none position-absolute top-50 start-50 translate-middle">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer bg-primary justify-content-center">
          <button type="button" class="btn btn-light border px-5" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Branch Lookup Modal -->
  <div class="modal fade" id="branchLookupModal" tabindex="-1" aria-labelledby="branchLookupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white d-flex justify-content-between align-items-center">
          <div>
            <p class="mb-0 small">Branch</p>
            <h5 class="modal-title" id="branchLookupModalLabel">Find a Branch</h5>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-sm btn-outline-light" id="branchSearchRefresh" aria-label="Refresh" title="Refresh">
              <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>

        <div class="modal-body">
          <form id="branchLookupForm" class="row g-3 align-items-end mb-3">
            <div class="col-md-4">
              <label class="form-label" for="branchSearchId">Branch ID</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="branchSearchModeId" aria-label="Branch ID match mode">
                  <option value="Like">Contains</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="branchSearchId" placeholder="e.g. 001" />
              </div>
            </div>

            <div class="col-md-4">
              <label class="form-label" for="branchSearchName">Branch Name</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="branchSearchModeName" aria-label="Branch Name match mode">
                  <option value="Like">Contains</option>
                  <option value="Exact">Exact</option>
                </select>
                <input type="text" class="form-control" id="branchSearchName" placeholder="Branch name" />
              </div>
            </div>

            <div class="col-md-4 text-center">
              <button type="submit" class="btn btn-primary btn-sm" id="branchSearchSubmit">
                <i class="bi bi-search" aria-hidden="true"></i> Search
              </button>
            </div>
          </form>

          <div class="position-relative" style="min-height: 300px;">
            <div class="table-responsive">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Branch ID</th>
                    <th scope="col">Branch Name</th>
                    <th scope="col" class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="branchSearchResults"></tbody>
              </table>
            </div>

            <div id="branchSearchEmpty" class="text-center py-5 text-muted">No branches found.</div>

            <div id="branchSearchLoading" class="d-none position-absolute top-50 start-50 translate-middle">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer bg-primary justify-content-center">
          <button type="button" class="btn btn-light border px-5" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="bank-account-maintenance.js"></script>
</body>

</html>
