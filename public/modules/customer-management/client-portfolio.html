<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portfolio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201" />
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/modules/export-data.js"></script>
</head>
<body>
  <div class="window">
    <div class="am-header" role="banner">
      <div class="am-header__left">
        <i class="bi bi-bar-chart am-header__icon"></i>
        <span class="am-header__title">Client Portfolio</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn-secondary" type="button" data-action="close" title="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Client Portfolio">
        <div class="form-card">

          <!-- Filter Section -->
          <div class="form-section" data-section="filters">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-funnel"></i>Portfolio Filters</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Filters" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="row g-3">
                <div class="col-6">
                  <label for="portfolioType" class="form-label">Portfolio Type <span class="gcp-required">*</span></label>
                  <select id="portfolioType" class="form-select form-select-sm">
                    <option value="">--Select--</option>
                    <option value="PORTFOLIO">Portfolio</option>
                    <option value="PRODUCTTYPE">Product Type</option>
                    <option value="ACCOUNTSTREND">Accounts Trend</option>
                  </select>
                </div>
                <div class="col-6">
                  <label for="productType" class="form-label">Product Type</label>
                  <select id="productType" class="form-select form-select-sm" disabled>
                    <option value="">--Select--</option>
                  </select>
                </div>
              </div>

              <div class="row g-3">
                <div class="col-6 d-none" id="fromDateGroup">
                  <label for="fromDate" class="form-label">From Date <span class="gcp-required">*</span></label>
                  <input type="date" id="fromDate" class="form-control form-control-sm" />
                </div>
                <div class="col-6">
                  <label for="toDate" class="form-label">To Date <span class="gcp-required">*</span></label>
                  <input type="date" id="toDate" class="form-control form-control-sm" />
                </div>
              </div>

              <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary btn-sm" id="btnView">
                  <i class="bi bi-play-fill"></i> View
                </button>
                <button type="button" class="btn btn-secondary btn-sm" id="btnClear">
                  <i class="bi bi-arrow-clockwise"></i> Clear
                </button>
              </div>
            </div>
          </div>

          <!-- Chart Section -->
          <div class="form-section" data-section="chart">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-graph-up"></i>Portfolio Analysis</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Chart" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div id="loadingIndicator" class="gcp-loading d-none">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Generating chart...</p>
              </div>
              <div id="chartPlaceholder" class="gcp-chart-placeholder">
                <div class="gcp-placeholder-content">
                  <div class="gcp-placeholder-icon">
                    <i class="bi bi-bar-chart"></i>
                  </div>
                  <p>Select filters and click View to generate chart</p>
                </div>
              </div>
              <div id="portfolioChart" class="gcp-chart d-none"></div>
            </div>
          </div>

          <!-- Statistics Section -->
          <div class="form-section" data-section="stats">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-calculator"></i>Summary Statistics</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Statistics" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Total Accounts</span>
                  <span class="audit-value" id="totalAccounts">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Total Balance</span>
                  <span class="audit-value" id="totalBalance">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Average Balance</span>
                  <span class="audit-value" id="averageBalance">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Highest Balance</span>
                  <span class="audit-value" id="highestBalance">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <aside class="action-panel">
        <div class="d-flex flex-column gap-2">
          <button class="btn-action" type="button" data-action="export"><i class="bi bi-download"></i><span>Export</span></button>
          <button class="btn-action" type="button" data-action="print"><i class="bi bi-printer"></i><span>Print</span></button>
          <button class="btn-action" type="button" data-action="refresh"><i class="bi bi-arrow-clockwise"></i><span>Refresh</span></button>
          <button class="btn-action btn-cancel" type="button" data-action="close"><i class="bi bi-x-lg"></i><span>Close</span></button>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/pages/customer-management/graphical-client-portfolio.js?v=20260210"></script>
  <script>
    document.querySelectorAll('[data-action="refresh"], [data-action="maximize"], [data-action="close"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = btn.dataset.action;
        if (action === 'refresh') {
          location.reload();
        } else if (action === 'maximize') {
          const windowEl = document.querySelector('.window');
          windowEl.classList.toggle('maximized');
          window.parent.postMessage({ action: 'toggleSidebarForMaximize', isMaximized: windowEl.classList.contains('maximized') }, '*');
        } else if (action === 'close') {
          window.parent.postMessage('close-client-portfolio', '*');
        }
      });
    });

    document.querySelectorAll('[data-section-toggle]').forEach(header => {
      header.addEventListener('click', () => {
        const section = header.closest('.form-section');
        const content = section.querySelector('[data-section-content]');
        const icon = header.querySelector('.section-toggle-btn i');
        if (content.hidden) {
          content.hidden = false;
          if (icon) icon.className = 'bi bi-chevron-up';
        } else {
          content.hidden = true;
          if (icon) icon.className = 'bi bi-chevron-down';
        }
      });
    });

    window.parent.postMessage({ action: 'submoduleOpened' }, '*');
  </script>
</body>
</html>
