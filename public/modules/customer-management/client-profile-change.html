<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Profile Change</title>
    <!-- Use relative link to the base framework in account-maintenance -->
    <link rel="stylesheet" href="DataEntry/dataentry-client-base.css?v=20250128" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        /* Module specific overrides */
        .de-card__header {
            background: linear-gradient(180deg, #4A7C95 0%, #3D6A7F 100%) !important;
            flex-shrink: 0;
            color: white !important;
        }

        .de-card__header--muted,
        .de-card__header--bts {
            background: linear-gradient(180deg, #4A7C95 0%, #3D6A7F 100%) !important;
            color: white !important;
            cursor: default !important;
        }

        .de-card__header--bts:hover {
            background: linear-gradient(180deg, #4A7C95 0%, #3D6A7F 100%) !important;
        }

        /* Force full height for embedded view */
        html,
        body,
        .de-window {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        .de-label--blue {
            color: #4A7C95;
            font-weight: 700;
        }

        .de-input,
        .de-select,
        .bs-input-text,
        .bs-select,
        .de-table__body td,
        .bs-textarea {
            color: #1e293b !important;
            font-size: 11px !important;
            font-weight: 800 !important;
        }

        .de-input::placeholder,
        .bs-input-text::placeholder,
        .bs-textarea::placeholder {
            color: #9ca3af;
            font-weight: 400 !important;
        }

        /* Custom Table Height */
        .de-card--grid {
            flex: 1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            margin-top: 15px;
        }

        .de-card__body--table {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 !important;
        }

        .de-table-wrap {
            flex: 1;
            overflow-y: auto;
        }

        /* BTS Toggle Button Styling Override */
        .de-bts-toggle {
            color: white !important;
            background: rgba(255, 255, 255, 0.2) !important;
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .de-bts-toggle:hover {
            background: rgba(255, 255, 255, 0.3) !important;
        }

        .de-bts-toggle i {
            transition: transform 0.3s ease;
        }

        /* Disabled action button styling */
        .de-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Scrollable body for large forms */
        /* Scrollable body for large forms */
        .de-card__body--scroll {
            overflow-y: auto;
            max-height: 600px;
            /* Increased height */
            padding-right: 8px;
            /* Adjust as needed */
            padding-right: 8px;
            /* Avoid scrollbar covering content */
        }
    </style>
</head>

<body>
    <div class="de-window">
        <main class="de-main de-main--with-panel">
            <div class="de-form-shell" role="region" aria-label="Client Profile Change form">
                <!-- Main Form Card -->
                <section class="de-card">
                    <header class="de-card__header">
                        <span class="de-card__title"><i class="bi bi-person-lines-fill"></i> Client Profile Change
                            Information</span>
                        <div class="de-card__actions">
                            <button class="de-btn-icon" type="button" onclick="location.reload()" title="Reset Form">
                                <i class="bi bi-eraser"></i>
                            </button>
                        </div>
                    </header>

                    <div class="de-card__body section-body-bordered de-card__body--scroll">
                        <div class="de-form-grid">
                            <!-- Row 1 -->
                            <div class="de-field de-field--span3">
                                <label class="de-label de-label--blue" for="clientName">Client Name</label>
                                <input type="text" id="clientName" name="clientName" placeholder="Full Client Name"
                                    class="de-input bs-input-text">
                            </div>

                            <!-- Row 2 -->
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="title">Title</label>
                                <select id="title" name="title" class="de-select bs-select">
                                    <option>--Select--</option>
                                    <option>Mr.</option>
                                    <option>Mrs.</option>
                                    <option>Ms.</option>
                                    <option>Dr.</option>
                                </select>
                            </div>
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="firstName">First Name</label>
                                <input type="text" id="firstName" name="firstName" placeholder="First Name"
                                    class="de-input bs-input-text">
                            </div>
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="middleName">Middle Name</label>
                                <input type="text" id="middleName" name="middleName" placeholder="Middle Name"
                                    class="de-input bs-input-text">
                            </div>

                            <!-- Row 3 -->
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="lastName">Last Name</label>
                                <input type="text" id="lastName" name="lastName" placeholder="Last Name"
                                    class="de-input bs-input-text">
                            </div>
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="gender">Gender</label>
                                <select id="gender" name="gender" class="de-select bs-select">
                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>
                                </select>
                            </div>
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="dob">Date Of Birth</label>
                                <input type="text" id="dob" name="dob" class="de-input bs-input-text"
                                    placeholder="DD-MMM-YYYY, hh:mm AM/PM">
                            </div>

                            <!-- Row 4 -->
                            <div class="de-field">
                                <label class="de-label" for="age">Age</label>
                                <input type="text" id="age" name="age" placeholder="Calculated Age" readonly
                                    class="de-input bs-input-text" style="background: #f1f5f9;">
                            </div>
                            <div class="de-field">
                                <label class="de-label" for="ageAsOn">Age As On</label>
                                <input type="date" id="ageAsOn" name="ageAsOn" class="de-input bs-input-text">
                            </div>
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="clientType">Client Type</label>
                                <select id="clientType" name="clientType" class="de-select bs-select">
                                    <option>Individual Client</option>
                                    <option>Corporate Client</option>
                                </select>
                            </div>

                            <!-- Row 5 -->
                            <div class="de-field">
                                <label class="de-label" for="documentsReceived">Documents Received</label>
                                <input type="text" id="documentsReceived" name="documentsReceived"
                                    placeholder="List received documents" class="de-input bs-input-text">
                            </div>
                            <div class="de-field">
                                <label class="de-label" for="receivedOn">Received On</label>
                                <input type="date" id="receivedOn" name="receivedOn" class="de-input bs-input-text">
                            </div>
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="changedReason">Changed Reason</label>
                                <select id="changedReason" name="changedReason" class="de-select bs-select">
                                    <option>Wrong Data</option>
                                    <option>Name Change</option>
                                    <option>Document Update</option>
                                </select>
                            </div>

                            <!-- Row 6: Remarks -->
                            <div class="de-field de-field--full">
                                <label class="de-label" for="remarks">Remarks</label>
                                <textarea id="remarks" name="remarks" placeholder="Nature of profile change..."
                                    class="de-textarea bs-textarea" style="height: 60px; resize: none;"></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Grid Section for Change History -->
                <section class="de-card de-card--grid">
                    <header class="de-card__header de-card__header--muted">
                        <span class="de-card__title"><i class="bi bi-clock-history"></i> CHANGE HISTORY</span>
                    </header>
                    <div class="de-card__body de-card__body--table">
                        <div class="de-table-wrap">
                            <table class="de-table history-table">
                                <thead class="de-table__head">
                                    <tr>
                                        <th>Changed Date</th>
                                        <th>Name</th>
                                        <th>Gender</th>
                                        <th>IS DOB Given</th>
                                        <th>Date of Birth</th>
                                        <th>Age</th>
                                        <th>Age As On</th>
                                        <th>Created By</th>
                                        <th>Supervised By</th>
                                    </tr>
                                </thead>
                                <tbody class="de-table__body">
                                    <tr>
                                        <td colspan="9" class="de-table__empty-cell">
                                            <div class="de-empty-state">
                                                <i class="bi bi-inbox"></i>
                                                <span>No records to display.</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Behind The Scene Section -->
                <section class="de-card de-card--bts" id="btsSection">
                    <header class="de-card__header de-card__header--bts" id="btsHeader">
                        <span class="de-card__title"><i class="bi bi-gear"></i> BEHIND THE SCENE</span>
                        <button type="button" class="de-bts-toggle" aria-label="Toggle Behind The Scene">
                            <i class="bi bi-chevron-up"></i>
                        </button>
                    </header>
                    <div class="de-card__body de-card__body--bts" id="btsBody">
                        <div class="de-audit-grid">
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Created By</span>
                                <span class="de-audit-value" id="createdBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Created On</span>
                                <span class="de-audit-value" id="createdOn">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Modified By</span>
                                <span class="de-audit-value" id="modifiedBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Modified On</span>
                                <span class="de-audit-value" id="modifiedOn">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Supervised By</span>
                                <span class="de-audit-value" id="supervisedBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Supervised On</span>
                                <span class="de-audit-value" id="supervisedOn">-</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Action Panel -->
            <aside class="de-action-panel">
                <div class="de-action-group de-action-group--bottom">
                    <button class="de-action-btn btn-action action-edit" type="button">
                        <i class="bi bi-pencil-square"></i><span>Edit</span>
                    </button>
                    <button class="de-action-btn btn-action action-save de-action-btn--save" type="button" disabled>
                        <i class="bi bi-check-lg"></i><span>Save</span>
                    </button>
                    <button class="de-action-btn btn-action action-cancel de-action-btn--cancel" type="button" disabled>
                        <i class="bi bi-x-lg"></i><span>Cancel</span>
                    </button>
                    <button class="de-action-btn btn-action action-back de-action-btn--cancel" type="button">
                        <i class="bi bi-box-arrow-right"></i><span>Close</span>
                    </button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../../assets/js/services/client/clientService.js"></script>
    <script src="../shared/toast-notification.js"></script>

    <!-- Framework Utilities -->
    <script src="../account-maintenance/DataEntry/dataentry-base.js?v=20250128"></script>
    <script src="client-profile-change.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.de-bts-toggle');
            const btsSection = document.getElementById('btsSection');

            if (toggleBtn && btsSection) {
                const body = document.getElementById('btsBody');

                // Initial State: Closed
                body.style.display = 'none';
                const initialIcon = toggleBtn.querySelector('i');
                if (initialIcon) {
                    initialIcon.style.transform = 'rotate(180deg)';
                }

                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const isHidden = body.style.display === 'none';
                    body.style.display = isHidden ? 'block' : 'none';

                    const icon = toggleBtn.querySelector('i');
                    if (icon) {
                        icon.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
                    }
                });
            }
        });
    </script>
</body>

</html>
