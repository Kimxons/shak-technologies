<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Lookup</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <style>
        :root {
            --primary: #1F6DB1;
            --primary-dark: #165A96;
            --border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --bg: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .search-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            height: 100%;
            box-sizing: border-box;
        }

        .search-header {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input-group {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            height: 32px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-search {
            height: 32px;
            padding: 0 16px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-search:hover {
            background: var(--primary-dark);
        }

        .results-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .table-wrapper {
            flex: 1;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #f1f5f9;
            padding: 10px;
            text-align: left;
            font-weight: 700;
            color: var(--text-dark);
            position: sticky;
            top: 0;
            border-bottom: 1px solid var(--border);
            z-index: 1;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        tr:hover td {
            background-color: #f0f7ff;
        }

        tr.selected td {
            background-color: #e0f2fe;
            color: var(--primary);
            font-weight: 600;
        }

        .status-msg {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="search-container">
        <div class="search-header">
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="Search by Branch ID or Name..." />
                <button class="btn-search" id="btnSearch">
                    <i class="bi bi-search"></i> Search
                </button>
            </div>
        </div>

        <div class="results-section">
            <div class="table-wrapper">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th style="width: 30%;">Branch ID</th>
                            <th style="width: 70%;">Branch Name</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr>
                            <td colspan="2" class="status-msg">Click 'Search' to view clearing branches</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="./branch-lookup.js"></script>
</body>

</html>
