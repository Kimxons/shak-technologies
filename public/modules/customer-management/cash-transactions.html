<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cash Transactions · Customer Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="cash-transactions copilot-theme" data-page="cash-transactions">
  <main class="container-fluid py-2">
    <section class="card-surface overflow-hidden ct-shell d-flex flex-column">
      <header class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
        <h1 class="h6 mb-0 fw-semibold">Cash Transactions</h1>
        <div class="d-flex gap-2 align-items-center">
          <small class="text-muted">Serial ID</small>
          <input class="form-control form-control-sm" style="max-width: 160px" type="text" aria-label="Serial ID" />
        </div>
      </header>

      <div class="p-3 ct-body">
        <div class="row g-3 h-100">
          <div class="col-12 col-lg-9 h-100">
            <div class="ct-form-scroll h-100">
              <form class="needs-validation" novalidate>
              <div class="row g-2 align-items-end">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="txType">Transaction Type</label>
                  <select id="txType" class="form-select form-select-sm">
                    <option value="">--Select--</option>
                    <option>Cash Deposit</option>
                    <option>Cash Withdrawal</option>
                    <option>Cash Transfer</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="accountType">Account Type</label>
                  <select id="accountType" class="form-select form-select-sm">
                    <option>Customer</option>
                    <option>GL</option>
                  </select>
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="branchId">Branch ID</label>
                  <div class="input-group input-group-sm">
                    <input id="branchId" class="form-control" type="text" value="9001" />
                    <input class="form-control" type="text" value="ADAMA BRANCH" aria-label="Branch name" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup branch">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="accountId">Account ID</label>
                  <div class="input-group input-group-sm">
                    <input id="accountId" class="form-control" type="text" placeholder="Enter account" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup account">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <hr class="my-3" />

              <div class="row g-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="instrumentType">Instrument Type</label>
                  <select id="instrumentType" class="form-select form-select-sm">
                    <option>Voucher</option>
                    <option>Cheque</option>
                    <option>Cash</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="instrumentId">Instrument ID</label>
                  <input id="instrumentId" class="form-control form-control-sm" type="text" />
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="instrumentDate">Instrument Date</label>
                  <div class="input-group input-group-sm">
                    <select id="instrumentDate" class="form-select">
                      <option value="">--Select--</option>
                      <option>Today</option>
                      <option>Yesterday</option>
                    </select>
                    <button class="btn btn-outline-primary" type="button" aria-label="Pick date">
                      <i class="bi bi-calendar"></i>
                    </button>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="referenceNo">Reference No.</label>
                  <input id="referenceNo" class="form-control form-control-sm" type="text" />
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="txCurrency">Transaction Currency</label>
                  <div class="input-group input-group-sm">
                    <input id="txCurrency" class="form-control" type="text" placeholder="Currency" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup currency">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="txId">Transaction ID</label>
                  <div class="input-group input-group-sm">
                    <input id="txId" class="form-control" type="text" placeholder="Auto" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup transaction">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="narration">Narration</label>
                  <input id="narration" class="form-control form-control-sm" type="text" />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="amount">Transaction Amount</label>
                  <input id="amount" class="form-control form-control-sm" type="text" inputmode="decimal" />
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12">
                  <label class="form-label mb-1" for="sourceOfProceeds">Source Of Proceeds</label>
                  <input id="sourceOfProceeds" class="form-control form-control-sm" type="text" />
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="waiveCharges" />
                    <label class="form-check-label" for="waiveCharges">Waive Charges</label>
                  </div>
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="chargeAmount">Charge Amount</label>
                  <input id="chargeAmount" class="form-control form-control-sm" type="text" inputmode="decimal" />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="chargeCurrency">Charge Currency ID</label>
                  <div class="input-group input-group-sm">
                    <input id="chargeCurrency" class="form-control" type="text" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup charge currency">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="exchangeRate">Exchange Rate</label>
                  <input id="exchangeRate" class="form-control form-control-sm" type="text" inputmode="decimal" />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="forexGainLoss">Forex Gain / Loss</label>
                  <input id="forexGainLoss" class="form-control form-control-sm" type="text" inputmode="decimal" />
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="localAmount">Local Amount</label>
                  <input id="localAmount" class="form-control form-control-sm" type="text" inputmode="decimal" />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="foreignAmount">Foreign Amount</label>
                  <input id="foreignAmount" class="form-control form-control-sm" type="text" inputmode="decimal" />
                </div>
              </div>

              <hr class="my-3" />

              <div class="card-surface p-2">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <strong class="small">Behind The Scene</strong>
                  <small class="text-muted">Read-only balances &amp; limits</small>
                </div>

                <div class="row g-2">
                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="clearBalance">Clear Balance</label>
                    <div class="input-group input-group-sm">
                      <input id="clearBalance" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="drawingPower">Drawing Power</label>
                    <div class="input-group input-group-sm">
                      <input id="drawingPower" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="uncleared">Under Balance</label>
                    <div class="input-group input-group-sm">
                      <input id="uncleared" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="freezeAmount">Freeze Amount</label>
                    <div class="input-group input-group-sm">
                      <input id="freezeAmount" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="unsupervisedCredit">UnSupervised Credit</label>
                    <div class="input-group input-group-sm">
                      <input id="unsupervisedCredit" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="minimumBalance">Minimum Balance</label>
                    <div class="input-group input-group-sm">
                      <input id="minimumBalance" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="unsupervisedDebit">UnSupervised Debit</label>
                    <div class="input-group input-group-sm">
                      <input id="unsupervisedDebit" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="depositBalance">Deposit Balance</label>
                    <div class="input-group input-group-sm">
                      <input id="depositBalance" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="availableBalance">Available Balance</label>
                    <div class="input-group input-group-sm">
                      <input id="availableBalance" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="totalBalance">Total Balance</label>
                    <div class="input-group input-group-sm">
                      <input id="totalBalance" class="form-control" type="text" disabled />
                      <button class="btn btn-outline-secondary" type="button" aria-label="Details">
                        <i class="bi bi-plus"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="row g-2 mt-2">
                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="accountCurrencyId">Account Currency ID</label>
                    <input id="accountCurrencyId" class="form-control form-control-sm" type="text" disabled />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="accountProductId">Account Product ID</label>
                    <input id="accountProductId" class="form-control form-control-sm" type="text" disabled />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="systemDate">System Date</label>
                    <input id="systemDate" class="form-control form-control-sm" type="text" value="13/Aug/2025" disabled />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label mb-1" for="dayStatus">Day Status</label>
                    <input id="dayStatus" class="form-control form-control-sm" type="text" value="Open" disabled />
                  </div>
                  <div class="col-12">
                    <label class="form-label mb-1" for="signature">Signature</label>
                    <input id="signature" class="form-control form-control-sm" type="text" disabled />
                  </div>
                </div>
              </div>
              </form>
            </div>
          </div>

          <div class="col-12 col-lg-3">
            <div class="d-grid gap-2 ct-sidebar">
              <div class="card-surface p-2">
                <div class="d-grid gap-2">
                  <button class="btn btn-outline-secondary btn-sm" type="button">Local Branch</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button">View All</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" disabled>Denomination</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" disabled>Print</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" disabled>Teller Balance</button>
                </div>
              </div>

              <div class="card-surface p-2">
                <div class="d-flex align-items-center justify-content-between">
                  <strong class="small">Account Info</strong>
                  <small class="text-muted">ETB</small>
                </div>
                <hr class="my-2" />
                <div class="d-flex justify-content-between small">
                  <span>OpBalance</span>
                  <span class="text-danger">0.00</span>
                </div>
                <div class="d-flex justify-content-between small">
                  <span>ClBalance</span>
                  <span class="text-danger">-389,670.00</span>
                </div>
                <div class="d-flex justify-content-between small">
                  <span>TotalCredits</span>
                  <span>0.00</span>
                </div>
                <div class="d-flex justify-content-between small">
                  <span>TotalDebits</span>
                  <span class="text-danger">-389,670.00</span>
                </div>
                <div class="d-flex justify-content-between small">
                  <span>Supervise</span>
                  <span class="text-warning">0.00</span>
                </div>
                <div class="d-flex justify-content-between small">
                  <span>UnSupervise</span>
                  <span class="text-success">100.00</span>
                </div>
              </div>

              <div class="card-surface p-2">
                <div class="d-grid gap-2">
                  <button class="btn btn-outline-secondary btn-sm" type="button">View</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button">Add</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" disabled>Edit</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" disabled>Delete</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" disabled>Save</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" disabled>Cancel</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/customer-management/cash-transactions.js"></script>
</body>

</html>
