<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Device Maintenance · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme" data-page="device-maintenance">
  <div class="cm-workspace">
    <div class="sdm-window card-surface">
      <header class="sdm-titlebar" aria-label="Window title">
        <span>Device Maintenance</span>
      </header>

      <form id="device-form" class="sdm-layout" autocomplete="off" novalidate>
        <section class="sdm-main" aria-label="Device maintenance content">
          <section class="sdm-panel" aria-label="Device inputs">
            <div class="sdm-grid">
              <label class="sdm-label" for="BranchID">Branch ID</label>
              <div class="sdm-control">
                <input type="text" class="form-control form-control-sm" id="BranchID" name="BranchID" value="001"
                  required />
              </div>
              <div class="sdm-icon">
                <button type="button" class="btn btn-sm btn-outline-secondary" aria-label="Lookup branch">
                  <i class="bi bi-search"></i>
                </button>
              </div>

              <label class="sdm-label" for="DeviceID">Device ID</label>
              <div class="sdm-control">
                <input type="text" class="form-control form-control-sm" id="DeviceID" name="DeviceID" value="ATM001"
                  required />
              </div>
              <div class="sdm-icon">
                <button type="button" class="btn btn-sm btn-outline-secondary" aria-label="Lookup device">
                  <i class="bi bi-search"></i>
                </button>
              </div>

              <label class="sdm-label" for="DeviceDescription">Device Description</label>
              <div class="sdm-control sdm-control--wide">
                <input type="text" class="form-control form-control-sm" id="DeviceDescription" name="DeviceDescription"
                  value="Updated Main Branch ATM Device - Modified" />
              </div>
              <div class="sdm-icon">
                <button type="button" class="btn btn-sm btn-outline-secondary" aria-label="Lookup device description">
                  <i class="bi bi-search"></i>
                </button>
              </div>

              <label class="sdm-label" for="SettlementGL">Settlement GL</label>
              <div class="sdm-control">
                <input type="text" class="form-control form-control-sm" id="SettlementGL" name="SettlementGL" />
              </div>
              <div class="sdm-icon">
                <button type="button" class="btn btn-sm btn-outline-secondary" aria-label="Lookup settlement GL">
                  <i class="bi bi-search"></i>
                </button>
              </div>

              <label class="sdm-label" for="ReceivableGL">Receivable GL</label>
              <div class="sdm-control">
                <input type="text" class="form-control form-control-sm" id="ReceivableGL" name="ReceivableGL" />
              </div>
              <div class="sdm-icon">
                <button type="button" class="btn btn-sm btn-outline-secondary" aria-label="Lookup receivable GL">
                  <i class="bi bi-search"></i>
                </button>
              </div>

              <label class="sdm-label" for="IsActive">Is Active</label>
              <div class="sdm-control sdm-control--inline">
                <input class="form-check-input" type="checkbox" id="IsActive" name="IsActive" checked />
              </div>
              <div class="sdm-icon"></div>

              <label class="sdm-label" for="IsLocal">Is Local</label>
              <div class="sdm-control sdm-control--inline">
                <input class="form-check-input" type="checkbox" id="IsLocal" name="IsLocal" checked />
              </div>
              <div class="sdm-icon"></div>

              <label class="sdm-label" for="BankID">Bank ID</label>
              <div class="sdm-control">
                <input type="text" class="form-control form-control-sm" id="BankID" name="BankID" />
              </div>
              <div class="sdm-icon">
                <button type="button" class="btn btn-sm btn-outline-secondary" aria-label="Lookup bank">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
          </section>

          <section class="sdm-toolbar" aria-label="Form actions">
            <button type="button" class="btn btn-sm btn-secondary" disabled>New</button>
            <button type="button" class="btn btn-sm btn-secondary" disabled>Alter</button>
            <button type="button" class="btn btn-sm btn-secondary" disabled>Remove</button>
            <button type="button" class="btn btn-sm btn-secondary" disabled>Update</button>
            <button type="button" class="btn btn-sm btn-secondary" disabled>Clear</button>
          </section>

          <section class="sdm-table" aria-label="Device list">
            <div class="table-responsive">
              <table class="table table-sm table-hover align-middle mb-0 cm-table">
                <thead class="table-light">
                  <tr>
                    <th scope="col">DeviceID</th>
                    <th scope="col">BranchID</th>
                    <th scope="col">Settlement GL</th>
                    <th scope="col">Receivable GL</th>
                    <th scope="col">IsActive</th>
                    <th scope="col">Description</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>ATM001</td>
                    <td>001</td>
                    <td></td>
                    <td></td>
                    <td>true</td>
                    <td>Updated Main Branch ATM Device - Modified</td>
                  </tr>
                  <tr>
                    <td>ATM002</td>
                    <td>001</td>
                    <td></td>
                    <td></td>
                    <td>false</td>
                    <td>Inactive ATM Device for Testing</td>
                  </tr>
                  <tr>
                    <td>ATM004</td>
                    <td>001</td>
                    <td>GL002</td>
                    <td>GL003</td>
                    <td>true</td>
                    <td>ATM Device with Full Details</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="sdm-audit" aria-label="Behind the scene">
            <div class="sdm-audit__bar">Behind The Scene</div>
            <div class="sdm-audit__grid">
              <div class="sdm-audit__cell">
                <label class="sdm-label" for="CreatedBy">Created By</label>
                <input type="text" class="form-control form-control-sm" id="CreatedBy" name="CreatedBy" />
              </div>
              <div class="sdm-audit__cell">
                <label class="sdm-label" for="ModifiedBy">Modified By</label>
                <input type="text" class="form-control form-control-sm" id="ModifiedBy" name="ModifiedBy" />
              </div>
              <div class="sdm-audit__cell">
                <label class="sdm-label" for="SupervisedBy">Supervised By</label>
                <input type="text" class="form-control form-control-sm" id="SupervisedBy" name="SupervisedBy" />
              </div>
              <div class="sdm-audit__cell">
                <label class="sdm-label" for="CreatedOn">Created On</label>
                <input type="text" class="form-control form-control-sm" id="CreatedOn" name="CreatedOn" />
              </div>
              <div class="sdm-audit__cell">
                <label class="sdm-label" for="ModifiedOn">Modified On</label>
                <input type="text" class="form-control form-control-sm" id="ModifiedOn" name="ModifiedOn" />
              </div>
              <div class="sdm-audit__cell">
                <label class="sdm-label" for="SupervisedOn">Supervised On</label>
                <input type="text" class="form-control form-control-sm" id="SupervisedOn" name="SupervisedOn" />
              </div>
            </div>
          </section>
        </section>

        <aside class="sdm-side" aria-label="Right-side actions">
          <button type="button" class="btn btn-sm btn-secondary w-100" disabled>View</button>
          <button type="button" class="btn btn-sm btn-secondary w-100" disabled>Add</button>
          <button type="button" class="btn btn-sm btn-secondary w-100">Edit</button>
          <button type="button" class="btn btn-sm btn-secondary w-100" disabled>Save</button>
          <button type="button" class="btn btn-sm btn-secondary w-100">Cancel</button>
          <button type="button" class="btn btn-sm btn-secondary w-100">Back</button>
        </aside>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/customer-management/device-maintenance.js"></script>
</body>

</html>
