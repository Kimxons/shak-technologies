<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LG Collaterals</title>
  <link rel="stylesheet" href="lg-collaterals.css" />
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-left">
        <span class="title-icon">☰</span>
        <span class="title-text">0101 ::</span>
      </div>
      <div class="title-bar-right">
        <button class="title-btn" type="button" aria-label="Minimize">─</button>
        <button class="title-btn" type="button" aria-label="Maximize">☐</button>
        <button class="title-btn close" type="button" aria-label="Close" id="closeX">✕</button>
      </div>
    </div>

    <div class="main-container">
      <div class="form-content">
        <div class="form-box">
          <div class="form-grid">
            <div class="form-row">
              <label class="label-blue">Collateral ID</label>
              <input type="text" id="collateralId" class="input-mid" />
              <input type="text" id="collateralDesc" class="input-wide" readonly />
              <button class="btn-lookup" type="button" id="collateralLookup" aria-label="Lookup collateral">🔍</button>
            </div>

            <div class="form-row">
              <label>Apportioned Ratio</label>
              <input type="text" id="apportionedRatio" class="input-mid" data-editable="true" disabled />
              <label class="label-inline">Assigned Date</label>
              <input type="text" id="assignedDate" class="input-mid" data-editable="true" disabled />
            </div>

            <div class="form-row">
              <label class="label-blue">Apportioned Value</label>
              <input type="text" id="apportionedValue" class="input-mid" data-editable="true" disabled />
              <label class="label-inline">Exchange Rate</label>
              <input type="text" id="exchangeRate" class="input-mid" data-editable="true" disabled />
            </div>

            <div class="form-row">
              <label class="label-blue">Margin</label>
              <input type="text" id="margin" class="input-mid" data-editable="true" disabled />
            </div>

            <div class="form-row">
              <label>Apportioned Collateral Value</label>
              <input type="text" id="apportionedCollateralValue" class="input-mid" data-editable="true" disabled />
            </div>

            <div class="form-row">
              <label>LG Collateral Value</label>
              <input type="text" id="lgCollateralValue" class="input-mid" data-editable="true" disabled />
            </div>
          </div>
        </div>

        <div class="section-header">Collateral Details</div>
        <div class="section-body">
          <div class="form-grid">
            <div class="form-row">
              <label>Owner</label>
              <input type="text" id="owner" class="input-wide" data-editable="true" disabled />
            </div>
            <div class="form-row">
              <label>Collateral Type</label>
              <input type="text" id="collateralType" class="input-mid" data-editable="true" disabled />
              <label class="label-inline">Currency ID</label>
              <input type="text" id="currencyId" class="input-mid" data-editable="true" disabled />
            </div>
            <div class="form-row">
              <label>Collateral Value</label>
              <input type="text" id="collateralValue" class="input-mid" data-editable="true" disabled />
              <label class="label-inline">Used Collateral Value</label>
              <input type="text" id="usedCollateralValue" class="input-mid" data-editable="true" disabled />
            </div>
          </div>
        </div>

        <div class="section-header">LG Details</div>
        <div class="section-body">
          <div class="form-grid">
            <div class="form-row">
              <label>Sanction Amount</label>
              <input type="text" id="sanctionAmount" class="input-mid" data-editable="true" disabled />
              <label class="label-inline">Currency ID</label>
              <input type="text" id="lgCurrencyId" class="input-mid" data-editable="true" disabled />
            </div>
          </div>
        </div>

        <div class="section-header">Behind The Scene</div>
        <div class="section-body">
          <div class="form-grid">
            <div class="form-row">
              <label>Application Status</label>
              <input type="text" id="applicationStatus" class="input-wide" readonly />
            </div>
            <div class="form-row">
              <label>Created By</label>
              <input type="text" id="createdBy" class="input-mid" readonly />
              <label class="label-inline">Modified By</label>
              <input type="text" id="modifiedBy" class="input-mid" readonly />
            </div>
            <div class="form-row">
              <label>Created On</label>
              <input type="text" id="createdOn" class="input-mid" readonly />
              <label class="label-inline">Modified On</label>
              <input type="text" id="modifiedOn" class="input-mid" readonly />
            </div>
          </div>
        </div>
      </div>

      <aside class="action-panel" aria-label="Actions">
        <div class="nav-arrows">
          <button type="button" class="nav-arrow" aria-label="Previous">⬅</button>
          <button type="button" class="nav-arrow" aria-label="Next">➡</button>
        </div>
        <div class="action-buttons">
          <button class="btn-action" type="button" data-mode="view">View</button>
          <button class="btn-action" type="button" data-mode="add">Add</button>
          <button class="btn-action" type="button" data-mode="edit">Edit</button>
          <button class="btn-action" type="button" id="deleteBtn">Delete</button>
          <button class="btn-action" type="button" id="saveBtn" disabled>Save</button>
          <button class="btn-action" type="button" id="cancelBtn" disabled>Cancel</button>
          <button class="btn-action" type="button" id="backBtn">Back</button>
        </div>
      </aside>
    </div>

    <div class="status-bar" aria-label="Status">
      <span id="statusText"></span>
    </div>
  </div>

  <script src="lg-collaterals.js"></script>
</body>
</html>
