<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan History</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201" />
</head>
<body>
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-clock-history am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Loan History</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn-secondary" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Loan History">
        <div class="form-card" data-main-form>
          <!-- Loan History Table Section -->
          <div class="form-section" data-section="loan-history">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-clock-history"></i>Loan History</span>
              <span class="de-record-count" id="recordCount">(0 records)</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Loan History" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content style="overflow-x: auto;">
              <table class="table table-sm table-hover align-middle mb-0" id="loanHistoryTable">
                <thead class="table-light">
                  <tr>
                    <th>Application ID</th>
                    <th>Loan Series</th>
                    <th>First Disbursement Date</th>
                    <th class="text-end">Sanctioned Amount</th>
                    <th class="text-end">Disbursed Amount</th>
                    <th>Term</th>
                    <th>Interest Rate</th>
                    <th>Closed Date</th>
                    <th>File Number</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="9" class="text-center text-muted py-4">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <aside class="action-panel">
        <div class="d-flex flex-column gap-2">
          <button class="btn-action" type="button" data-action="view" title="View"><i class="bi bi-eye"></i><span>View</span></button>
          <button class="btn-action" type="button" data-action="print" title="Print"><i class="bi bi-printer"></i><span>Print</span></button>
          <button class="btn-action" type="button" data-action="refresh" title="Refresh"><i class="bi bi-arrow-clockwise"></i><span>Refresh</span></button>
          <button class="btn-action btn-cancel" type="button" data-action="close" title="Close"><i class="bi bi-x-lg"></i><span>Close</span></button>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core Dependencies -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/loans/loansService.js"></script>
  <script src="../../assets/js/services/loans/loanHistoryService.js"></script>
  <script src="../../assets/js/pages/customer-management/loan-history.js?v=20260210"></script>
  <script>
    // Window control handlers
    document.querySelectorAll('[data-action="refresh"], [data-action="maximize"], [data-action="close"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = btn.dataset.action;
        if (action === 'refresh') {
          location.reload();
        } else if (action === 'maximize') {
          const windowEl = document.querySelector('.window');
          windowEl.classList.toggle('maximized');
          window.parent.postMessage({ action: 'toggleSidebarForMaximize', isMaximized: windowEl.classList.contains('maximized') }, '*');
        } else if (action === 'close') {
          window.parent.postMessage('close-loan-history', '*');
        }
      });
    });
    // Notify parent when form opens
    window.parent.postMessage({ action: 'submoduleOpened' }, '*');
  </script>
</body>
</html>
