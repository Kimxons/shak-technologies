<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature and Photograph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 20px;
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 20px;
            overflow: hidden;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .panels-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
        }

        .image-panel {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .panel-header {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .panel-tools {
            display: flex;
            gap: 12px;
        }

        .tool-icon {
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s, transform 0.2s;
        }

        .tool-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .image-display {
            flex: 1;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            position: relative;
        }

        .placeholder-text {
            color: #94a3b8;
            font-size: 13px;
            font-style: italic;
        }

        .audit-info {
            padding: 16px;
            background: #f8fafc;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .audit-row {
            display: grid;
            grid-template-columns: 100px 1fr;
            align-items: center;
            gap: 10px;
        }

        .audit-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: right;
        }

        .audit-input {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #475569;
            height: 24px;
        }

        .status-message {
            color: #ef4444;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 0;
            border-top: 1px solid #fee2e2;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            background: rgba(248, 250, 252, 0.5);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .sidebar-spacer {
            flex: 1;
        }

        .sidebar-btn {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sidebar-btn:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .sidebar-btn.primary {
            background: var(--primary);
            color: white;
            border: none;
        }

        @media (max-width: 900px) {
            .panels-container {
                grid-template-columns: 1fr;
            }

            .main-wrapper {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                flex-direction: row;
                height: auto;
            }

            .sidebar-btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div class="content-area">
            <div class="panels-container">
                <!-- Signature Panel -->
                <div class="image-panel">
                    <div class="panel-header">
                        <span>Signature</span>
                        <div class="panel-tools">
                            <i class="fas fa-sync tool-icon"></i>
                            <i class="fas fa-search-plus tool-icon"></i>
                            <i class="fas fa-search-minus tool-icon"></i>
                        </div>
                    </div>
                    <div class="image-display">
                        <span class="placeholder-text">Signature not loaded</span>
                    </div>
                    <div class="audit-info">
                        <div class="audit-row"><span class="audit-label">Scanned By</span>
                            <div class="audit-input"></div>
                        </div>
                        <div class="audit-row"><span class="audit-label">Scanned On</span>
                            <div class="audit-input"></div>
                        </div>
                        <div class="audit-row"><span class="audit-label">Supervised By</span>
                            <div class="audit-input"></div>
                        </div>
                        <div class="audit-row"><span class="audit-label">Supervised On</span>
                            <div class="audit-input"></div>
                        </div>
                    </div>
                </div>

                <!-- Photo Panel -->
                <div class="image-panel">
                    <div class="panel-header">
                        <span>Photo</span>
                        <div class="panel-tools">
                            <i class="fas fa-sync tool-icon"></i>
                            <i class="fas fa-search-plus tool-icon"></i>
                            <i class="fas fa-search-minus tool-icon"></i>
                        </div>
                    </div>
                    <div class="image-display">
                        <span class="placeholder-text">Photo not loaded</span>
                    </div>
                    <div class="audit-info">
                        <div class="audit-row"><span class="audit-label">Scanned By</span>
                            <div class="audit-input"></div>
                        </div>
                        <div class="audit-row"><span class="audit-label">Scanned On</span>
                            <div class="audit-input"></div>
                        </div>
                        <div class="audit-row"><span class="audit-label">Supervised By</span>
                            <div class="audit-input"></div>
                        </div>
                        <div class="audit-row"><span class="audit-label">Supervised On</span>
                            <div class="audit-input"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="status-message">
                <i class="fas fa-exclamation-triangle"></i>
                Signature/ Photo is Not Available [No:151003]
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-spacer"></div>
            <button class="sidebar-btn"><i class="fas fa-print"></i> Print</button>
            <button class="sidebar-btn primary"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
    </div>
</body>

</html>
