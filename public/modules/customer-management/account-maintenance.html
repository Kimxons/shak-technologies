<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Maintenance · Customer Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme" data-page="account-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="account-form" class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">Data Entry</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item" data-dataentry-link="view">
              <span>View</span>
            </button>
          </div>
        </div>

        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">View</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items is-collapsed"></div>
        </div>

        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle"
            onclick="this.closest('.cm-nav-section').querySelector('.cm-nav-items').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-right');">
            <span class="cm-nav-toggle__label">Recent Activities</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="cm-nav-items is-collapsed"></div>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <section class="cm-top-identifiers card-surface">
          <div class="cm-top-identifiers__grid">
            <div class="cbs-field">
              <label class="cbs-label required" for="ClientID">Client ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="ClientID" name="ClientID" required />
                <button class="btn btn-outline-primary" type="button" aria-label="Search client">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <div class="cbs-field">
              <label class="cbs-label required" for="ProductID">Product ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="ProductID" name="ProductID" required />
                <button class="btn btn-outline-primary" type="button" aria-label="Search product">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <div class="cbs-field">
              <label class="cbs-label required" for="AccountID">Account ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="AccountID" name="AccountID" required />
                <button class="btn btn-outline-primary" type="button" aria-label="Search account">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <div class="cm-top-identifiers__pair" role="group" aria-label="Passbook details">
              <div class="cbs-field">
                <label class="cbs-label" for="PassbookSerialID">Passbook Serial ID</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="PassbookSerialID" name="PassbookSerialID" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Search passbook serial">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field cm-compact-field cbs-inline">
                <label class="cbs-label" for="ExemptPassBook">Exempt PassBook</label>
                <div class="form-check form-switch m-0">
                  <input class="form-check-input" type="checkbox" role="switch" id="ExemptPassBook"
                    name="ExemptPassBook" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface">
            <header class="cm-step__header">
              <h3 class="section-title mb-0">Account Details</h3>
            </header>

            <div class="cbs-grid cbs-grid--two cbs-grid--tight">
              <div class="cbs-field">
                <label class="cbs-label" for="ShortName">Short Name</label>
                <input type="text" class="form-control" id="ShortName" name="ShortName" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="Address2">Address 2</label>
                <input type="text" class="form-control" id="Address2" name="Address2" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="Address1">Address 1</label>
                <input type="text" class="form-control" id="Address1" name="Address1" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="Country">Country</label>
                <select class="form-select" id="Country" name="Country">
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="City">City</label>
                <select class="form-select" id="City" name="City">
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="PhoneWork">Phone (Work)</label>
                <input type="text" class="form-control" id="PhoneWork" name="PhoneWork" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="PhoneHome">Phone (Home)</label>
                <input type="text" class="form-control" id="PhoneHome" name="PhoneHome" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="Mobile">Mobile</label>
                <input type="text" class="form-control" id="Mobile" name="Mobile" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="FaxNo">Fax No</label>
                <input type="text" class="form-control" id="FaxNo" name="FaxNo" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="ContactPerson">Contact Person</label>
                <input type="text" class="form-control" id="ContactPerson" name="ContactPerson" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="EmailID">Email ID</label>
                <input type="email" class="form-control" id="EmailID" name="EmailID" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="OperatingInstructions">Operating Instructions</label>
                <input type="text" class="form-control" id="OperatingInstructions" name="OperatingInstructions" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="OperatingMode">Operating Mode</label>
                <select class="form-select" id="OperatingMode" name="OperatingMode">
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="AccountOfficer">Account Officer</label>
                <select class="form-select" id="AccountOfficer" name="AccountOfficer">
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="AccountClass">Account Class</label>
                <select class="form-select" id="AccountClass" name="AccountClass">
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="LiquidationAccountID">Liquidation Account ID</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="LiquidationAccountID" name="LiquidationAccountID" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Search liquidation account">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="SalesOfficer">Sales Officer</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="SalesOfficer" name="SalesOfficer" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Search sales officer">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="card-surface">
            <header class="cm-step__header">
              <h3 class="section-title mb-0">Behind The Scene</h3>
            </header>

            <div class="cbs-grid cbs-grid--two cbs-grid--tight">
              <div class="cbs-field">
                <label class="cbs-label" for="ClearBalance">Clear Balance</label>
                <input type="text" class="form-control" id="ClearBalance" name="ClearBalance" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="CurrencyID">Currency ID</label>
                <input type="text" class="form-control" id="CurrencyID" name="CurrencyID" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="UnclearBalance">Unclear Balance</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="UnclearBalance" name="UnclearBalance" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust unclear balance">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="AvailableBalance">Available Balance</label>
                <input type="text" class="form-control" id="AvailableBalance" name="AvailableBalance" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="UnSupervisedCredits">Un Supervised Credits</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="UnSupervisedCredits" name="UnSupervisedCredits" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust credits">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="TotalBalance">Total Balance</label>
                <input type="text" class="form-control" id="TotalBalance" name="TotalBalance" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="UnSupervisedDebits">Un Supervised Debits</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="UnSupervisedDebits" name="UnSupervisedDebits" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust debits">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="CreditInterest">Credit Interest</label>
                <input type="text" class="form-control" id="CreditInterest" name="CreditInterest" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="DrawingPower">Drawing Power</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="DrawingPower" name="DrawingPower" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust drawing power">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="DebitInterest">Debit Interest</label>
                <input type="text" class="form-control" id="DebitInterest" name="DebitInterest" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="FreezedAmount">Freezed Amount</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="FreezedAmount" name="FreezedAmount" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust freezed amount">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="MinimumBalance">Minimum Balance</label>
                <input type="text" class="form-control" id="MinimumBalance" name="MinimumBalance" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="CreditRate">Credit Rate</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="CreditRate" name="CreditRate" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust credit rate">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="DepositBalance">Deposit Balance</label>
                <input type="text" class="form-control" id="DepositBalance" name="DepositBalance" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="DebitRate">Debit Rate</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="DebitRate" name="DebitRate" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust debit rate">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="OpenDate">Open Date</label>
                <input type="date" class="form-control" id="OpenDate" name="OpenDate" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="PenaltyRate">Penalty Rate</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="PenaltyRate" name="PenaltyRate" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust penalty rate">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="Status">Status</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="Status" name="Status" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust status">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="PendingCharges">Pending Charges</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="PendingCharges" name="PendingCharges" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust pending charges">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="SystemLien">System Lien</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="SystemLien" name="SystemLien" />
                  <button class="btn btn-outline-secondary" type="button" aria-label="Adjust system lien">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="cbs-grid cbs-grid--four cbs-grid--tight mt-3">
              <div class="cbs-field">
                <label class="cbs-label" for="CreatedBy">Created By</label>
                <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="ModifiedBy">Modified By</label>
                <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="SupervisedBy">Supervised By</label>
                <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="CreatedOn">Created On</label>
                <input type="date" class="form-control" id="CreatedOn" name="CreatedOn" />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="ModifiedOn">Modified On</label>
                <input type="date" class="form-control" id="ModifiedOn" name="ModifiedOn" />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="SupervisedOn">Supervised On</label>
                <input type="date" class="form-control" id="SupervisedOn" name="SupervisedOn" />
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <div class="d-flex align-items-center justify-content-between gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" aria-label="Previous client">
              <i class="bi bi-arrow-left"></i>
            </button>
            <span class="small fw-semibold text-muted">Client</span>
            <button type="button" class="btn btn-outline-secondary btn-sm" aria-label="Next client">
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
          <div class="d-flex align-items-center justify-content-between gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" aria-label="Previous account">
              <i class="bi bi-arrow-left"></i>
            </button>
            <span class="small fw-semibold text-muted">Account</span>
            <button type="button" class="btn btn-outline-secondary btn-sm" aria-label="Next account">
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>

        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Mode switch</p>
          <button type="button" class="cm-shell__action cm-shell__action--primary" data-shell-mode="View">View</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Add" disabled>Add</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Update" disabled>Edit</button>
        </div>

        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Workflow</p>
          <button type="button" class="cm-shell__action cm-shell__action--success" data-submit-action="save" disabled>
            Save
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-submit-action="cancel" disabled>
            Cancel
          </button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/customer-management/account-maintenance.js"></script>
</body>

</html>
