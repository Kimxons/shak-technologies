<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Deduplication</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 20px;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 24px;
            overflow: hidden;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        .search-container {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .search-header {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            height: 32px;
            width: 100%;
        }

        .search-form {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-form-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            align-items: center;
            gap: 20px;
        }

        .search-form-label {
            font-size: 13px;
            font-weight: 600;
            color: #2563eb;
            text-align: right;
            margin: 0;
        }

        .table-container {
            flex: 1;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f8fafc;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }

        .empty-row td {
            text-align: left;
            padding: 20px;
            font-style: italic;
            color: #64748b;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 12px;
            padding: 12px;
            background: rgba(248, 250, 252, 0.5);
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        @media (max-width: 900px) {
            .main-wrapper {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                flex-direction: row;
                height: auto;
                margin-top: 20px;
            }

            .search-form-row {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            .search-form-label {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="content-area">
            <!-- Search Criteria Section -->
            <div class="search-container">
                <div class="search-header"></div>
                <div class="search-form">
                    <div class="search-form-row">
                        <label class="search-form-label">Search Module</label>
                        <select class="bs-select">
                            <option>General Client Checking</option>
                            <option>Account Deduplication</option>
                            <option>Identity Deduplication</option>
                        </select>
                    </div>
                    <div class="search-form-row">
                        <label class="search-form-label">Client Open From Date</label>
                        <input type="date" class="bs-input-date">
                    </div>
                    <div class="search-form-row">
                        <label class="search-form-label">Client Open To Date</label>
                        <input type="date" class="bs-input-date">
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th>Name</th>
                            <th>Open Date</th>
                            <th>Opened By</th>
                            <th>Supervised By</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="empty-row">
                            <td colspan="5">No records to display.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Action Sidebar -->
        <div class="sidebar">
            <button class="btn-action btn-action--primary"><i class="bi bi-search"></i> Search</button>
            <button class="btn-action" disabled><i class="bi bi-printer"></i> Print</button>
            <button class="btn-action"><i class="bi bi-x-lg"></i> Cancel</button>
        </div>
    </div>
</body>
</html>
