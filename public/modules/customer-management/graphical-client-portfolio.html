<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphical Client Portfolio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260210" />
  
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/modules/export-data.js"></script>
</head>
<body class="graphical-portfolio-page">
  <div class="window">
    <!-- Hidden context fields for robust context passing (like other submodules) -->
    <input type="hidden" id="clientID" />
    <input type="hidden" id="clientName" />
    <input type="hidden" id="branchID" />
    <!-- Header bar matching Account Maintenance -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-pie-chart am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Graphical Client Portfolio</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" id="btnRefresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" id="btnExport" title="Export" aria-label="Export chart"><i class="bi bi-download"></i></button>
        <button class="am-btn am-btn--close" type="button" id="btnCloseHeader" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <!-- Main content -->
    <main class="main-container">
      <div class="form-content" role="region" aria-label="Portfolio filters and analysis">
        <div class="form-card" data-main-form>
          <!-- Portfolio Filters Section -->
          <div class="form-section" data-section="portfolio-filters">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-funnel"></i>Portfolio Filters</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Portfolio Filters" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <form id="portfolioForm" autocomplete="off" novalidate>
                <!-- Row 1: Report Type & Product Type -->
                <div class="row g-2 mb-2">
                  <div class="col-6">
                    <label class="label-blue">Report Type <span class="text-danger">*</span></label>
                    <select id="portfolioType" name="PortifolioReportType" class="bs-select form-control" required title="Report Type">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="label-blue">Product Type</label>
                    <select id="productType" name="ProductTypeID" class="bs-select form-control" title="Product Type">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <!-- Row 2: From Date & To Date -->
                <div class="row g-2 mb-2">
                  <div class="col-6">
                    <label class="label-blue">From Date</label>
                    <input type="date" id="fromDate" name="fromDate" class="bs-input-text form-control" title="From Date" placeholder="Select from date" />
                  </div>
                  <div class="col-6">
                    <label class="label-blue">To Date</label>
                    <input type="date" id="toDate" name="toDate" class="bs-input-text form-control" title="To Date" placeholder="Select to date" />
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- Portfolio Analysis Chart Section -->
          <div class="form-section" data-section="portfolio-chart">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-graph-up"></i>Portfolio Analysis</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Portfolio Analysis" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div id="portfolioChart" class="portfolio-chart-container"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel on Right (Account Maintenance style) -->
      <div class="action-panel">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" id="btnView" title="View chart"><i class="bi bi-eye me-1"></i>View</button>
          <button class="btn-action" type="button" id="btnClear" title="Clear filters"><i class="bi bi-arrow-counterclockwise me-1"></i>Clear</button>
          <button class="btn-action" type="button" id="btnPrint" title="Print chart"><i class="bi bi-printer me-1"></i>Print</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../assets/js/pages/customer-management/graphical-client-portfolio.js?v=20260210"></script>
  <script>
    // Close button handler
    document.getElementById('btnCloseHeader')?.addEventListener('click', () => {
      window.parent.postMessage('close-graphical-client-portfolio', '*');
    });

    // Notify parent when form opens
    window.parent.postMessage({ action: 'submoduleOpened' }, '*');
  </script>
</body>
</html>
