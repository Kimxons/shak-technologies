<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client 360 View</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
        .client-360-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .client-360-main {
            flex: 1;
        }

        .client-360-sidebar {
            width: 200px;
        }

        /* Search Section */
        .search-section-header {
            background: linear-gradient(135deg, #4a7a8c 0%, #2d5a6a 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 6px 6px 0 0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .search-section-content {
            background: white;
            padding: 20px;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-weight: 600;
            color: #1e3c72;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .form-control {
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
            height: 36px;
        }

        .form-control:focus {
            border-color: #0c63e4;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        /* Details Section */
        .details-section {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
            overflow: hidden;
        }

        .details-header {
            background: linear-gradient(135deg, #4a7a8c 0%, #2d5a6a 100%);
            color: white;
            padding: 12px 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .details-content {
            padding: 20px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-weight: 600;
            color: #1e3c72;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            padding: 8px 12px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            min-height: 36px;
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .detail-remarks {
            padding: 8px 12px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            min-height: 80px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
        }

        /* Accounts Section */
        .accounts-section {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
            overflow: hidden;
        }

        .accounts-header {
            background: linear-gradient(135deg, #4a7a8c 0%, #2d5a6a 100%);
            color: white;
            padding: 12px 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Client 360 Main Products (shared JS renderer) */
        .client360-products {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
        }

        .client360-products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            padding: 12px;
        }

        .client360-product-card {
            border: 1px solid #eef2f7;
            border-radius: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
            box-shadow: 0 2px 10px rgba(17, 24, 39, 0.06);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .client360-product-card__header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .client360-product-card__title {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }

        .client360-product-card__subtitle {
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
            word-break: break-all;
        }

        .client360-product-card__badge {
            flex: 0 0 auto;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(26, 82, 118, 0.10);
            color: #1a5276;
            font-weight: 800;
        }

        .client360-product-kv {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 10px;
            font-size: 12px;
        }

        .client360-product-kv__k {
            color: #64748b;
        }

        .client360-product-kv__v {
            color: #0f172a;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .client360-product-actions {
            margin-top: 2px;
        }

        /* Match 'View Statement' button to the modal title head blue */
        .client360-statement-btn {
            background: linear-gradient(120deg, #1b6ca8, #2b81c4) !important;
            border: 1px solid rgba(255, 255, 255, 0.35) !important;
            color: #ffffff !important;
            font-weight: 700;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(27, 108, 168, 0.22);
        }

        .client360-statement-btn:hover:not(:disabled) {
            background: linear-gradient(120deg, #195f95, #2677b7) !important;
            box-shadow: 0 6px 14px rgba(27, 108, 168, 0.28);
            transform: translateY(-1px);
        }

        .client360-statement-btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 3px 8px rgba(27, 108, 168, 0.22);
        }

        .client360-statement-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(27, 108, 168, 0.35), 0 4px 10px rgba(27, 108, 168, 0.22);
        }

        .account-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #e9ecef;
            background: #f8f9fa;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .account-item:hover {
            background: #e9ecef;
        }

        .account-item:last-child {
            border-bottom: none;
        }

        .account-item-icon {
            font-size: 18px;
            margin-right: 12px;
            color: #4a7a8c;
            font-weight: bold;
            min-width: 20px;
        }

        .account-item-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-item-name {
            font-weight: 500;
            color: #1e3c72;
            font-size: 14px;
        }

        .account-item-balance {
            font-weight: 600;
            color: #2d5a6a;
            font-size: 14px;
            min-width: 120px;
            text-align: right;
        }

        /* Sidebar */
        .sidebar-images {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .image-placeholder {
            width: 100%;
            height: 150px;
            background: #f5f5f5;
            border: 2px solid #dee2e6;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            text-align: center;
            flex-direction: column;
        }

        .image-placeholder i {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-sidebar {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-print {
            background: #5cb85c;
            color: white;
        }

        .btn-print:hover {
            background: #449d44;
        }

        .btn-cancel {
            background: #999;
            color: white;
        }

        .btn-cancel:hover {
            background: #777;
        }

        /* Quick Links */
        .quick-links-section {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 12px;
        }

        .quick-links-title {
            font-weight: 600;
            color: #1e3c72;
            font-size: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 2px solid #2d5a6a;
        }

        .quick-link-item {
            padding: 8px 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-left: 3px solid #2d5a6a;
            border-radius: 2px;
            cursor: pointer;
            font-size: 13px;
            color: #0066cc;
            transition: all 0.2s;
        }

        .quick-link-item:hover {
            background: #e3f2fd;
            transform: translateX(3px);
        }

        .quick-link-item i {
            margin-right: 6px;
        }

        /* Header */
        .client-360-header {
            background: #0066cc;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .client-360-header-info h5 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .client-360-header-info p {
            margin: 5px 0 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        @media (max-width: 1200px) {
            .client-360-wrapper {
                flex-direction: column;
            }

            .client-360-sidebar {
                width: 100%;
            }

            .form-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Print: show Photo + Signature under Client ID/Name */
        .client360-print-images {
            display: none;
            gap: 18px;
            align-items: flex-start;
            justify-content: center;
            margin-top: 10px;
            page-break-inside: avoid;
        }

        .client360-print-image {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .client360-print-image-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #64748b;
        }

        .client360-print-image-box {
            width: 120px;
            height: 140px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .client360-print-image-box--signature {
            width: 220px;
            height: 90px;
        }

        .client360-print-image-box img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .client360-print-image-box--signature img {
            object-fit: contain;
        }

        @media print {
            /* Hide search + right sidebar (we render images under header instead) */
            .search-section-header,
            .search-section-content,
            .client-360-sidebar {
                display: none !important;
            }

            /* Hide any remaining interactive controls inside printed content */
            button,
            .btn,
            a,
            [role="button"],
            .client360-product-actions,
            .client360-statement-btn,
            .client360-signatories-btn {
                display: none !important;
            }

            .client360-print-images {
                display: flex !important;
            }

            body.bg-light {
                background: #fff !important;
            }

            .container-fluid.p-4 {
                padding: 0 !important;
            }
        }
    </style>
</head>

<body class="bg-light">
    <div class="container-fluid p-4">
        <!-- Search Section -->
        <div style="background: white; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
            <div class="search-section-header">
                <i class="bi bi-search me-2"></i>Client Search
            </div>
            <div class="search-section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientIdSearch" class="form-label">Client ID</label>
                        <input type="text" id="clientIdSearch" class="form-control" placeholder="Enter Client ID">
                    </div>
                    <div class="form-group">
                        <label for="clientNameSearch" class="form-label">Client Name</label>
                        <input type="text" id="clientNameSearch" class="form-control" placeholder="Client Name" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label">&nbsp;</label>
                        <button type="button" id="btnClientSearch" class="form-control" style="background: #0066cc; color: white; font-weight: 600; cursor: pointer; border: none; padding: 8px 12px;">
                            <i class="bi bi-search me-1"></i>Search
                        </button>
                    </div>
                    <div class="form-group">
                        <label class="form-label">&nbsp;</label>
                        <button id="btnViewClient" class="form-control" style="background: #5cb85c; color: white; font-weight: 600; cursor: pointer; border: none; padding: 8px 12px;">
                            <i class="bi bi-eye me-1"></i>View Client
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="client360Container" style="display: none;">
            <!-- Header with Client Info -->
            <div class="client-360-header">
                <div class="client-360-header-info">
                    <h5><i class="bi bi-person-vcard me-2"></i>Client 360 View</h5>
                    <p><strong>Client ID:</strong> <span id="headerClientId"></span> &nbsp; | &nbsp; <strong>Client Name:</strong> <span id="headerClientName"></span></p>
                    <div class="client360-print-images" aria-label="Client 360 Print Images">
                        <div class="client360-print-image">
                            <div class="client360-print-image-label">Photo</div>
                            <div class="client360-print-image-box" id="clientPhotoPrint" aria-label="Client Photo (Print)"></div>
                        </div>
                        <div class="client360-print-image">
                            <div class="client360-print-image-label">Signature</div>
                            <div class="client360-print-image-box client360-print-image-box--signature" id="clientSignaturePrint" aria-label="Client Signature (Print)"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="client-360-wrapper">
                <!-- Main Content Area -->
                <div class="client-360-main">
                    <!-- Client Details Section -->
                    <div class="details-section">
                        <div class="details-header">
                            <i class="bi bi-person-badge me-2"></i>Client Details
                        </div>
                        <div class="details-content">
                            <div class="detail-row">
                                <div class="detail-item">
                                    <label class="detail-label">Name</label>
                                    <div class="detail-value" id="clientName">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Identification Number</label>
                                    <div class="detail-value" id="identificationNumber">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Identification Type</label>
                                    <div class="detail-value" id="identificationType">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Client Status</label>
                                    <div class="detail-value" id="clientStatus">-</div>
                                </div>
                            </div>

                            <div class="detail-row">
                                <div class="detail-item">
                                    <label class="detail-label">Employer</label>
                                    <div class="detail-value" id="employer">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Payroll Number</label>
                                    <div class="detail-value" id="payrollNumber">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Phone Number</label>
                                    <div class="detail-value" id="phoneNumber">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Branch</label>
                                    <div class="detail-value" id="branch">-</div>
                                </div>
                            </div>

                            <div class="detail-row">
                                <div class="detail-item">
                                    <label class="detail-label">Member Class</label>
                                    <div class="detail-value" id="memberClass">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Age</label>
                                    <div class="detail-value" id="age">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">TAN Status of Account</label>
                                    <div class="detail-value" id="tanStatus">-</div>
                                </div>
                                <div class="detail-item">
                                    <label class="detail-label">Loan Status</label>
                                    <div class="detail-value" id="loanStatus">-</div>
                                </div>
                            </div>

                            <div class="detail-row">
                                <div class="detail-item" style="grid-column: span 4;">
                                    <label class="detail-label">Remarks</label>
                                    <div class="detail-remarks" id="remarks">-</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Accounts Section -->
                    <div class="accounts-section">
                        <div class="accounts-header">
                            <span><i class="bi bi-piggy-bank me-2"></i>Main Products</span>
                        </div>
                        <div id="accountsContainer">
                            <!-- Account items will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Right Sidebar -->
                <div class="client-360-sidebar">
                    <!-- Images -->
                    <div class="sidebar-images">
                        <div class="image-placeholder" id="clientPhoto">
                            <i class="bi bi-image"></i>
                            <div>NO IMAGE<br>AVAILABLE</div>
                        </div>
                        <div class="image-placeholder" id="clientSignature">
                            <i class="bi bi-pen"></i>
                            <div>NO IMAGE<br>AVAILABLE</div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="sidebar-buttons">
                        <button id="btnPrint" class="btn-sidebar btn-print">
                            <i class="bi bi-printer"></i>Print
                        </button>
                        <button id="btnCancel" class="btn-sidebar btn-cancel">
                            <i class="bi bi-x-circle"></i>Cancel
                        </button>
                    </div>

                    <!-- Quick Links -->
                    <div class="quick-links-section">
                        <div class="quick-links-title">
                            <i class="bi bi-link-45deg me-1"></i>Quick Links
                        </div>
                        <div id="quickLinksContainer">
                            <!-- Quick links will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/services/workflow/notificationService.js"></script>
    <script src="../../assets/js/pages/customer-management/client-360-view.js"></script>
</body>

</html>
