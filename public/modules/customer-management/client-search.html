<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 16px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            height: 100%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: auto 80px 1fr auto 80px 1fr;
            gap: 6px 15px;
            align-items: center;
            width: 100%;
        }

        .form-grid-label {
            font-size: 12px;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
            color: #334155;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .results-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }

        .results-header {
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
        }

        .table-wrapper {
            flex: 1;
            overflow: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #f1f5f9;
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: #64748b;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 6px 10px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        tr.selected td {
            background-color: #e0f2fe;
            color: #2563eb;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            padding-top: 5px;
        }
    </style>
</head>

<body>
    <div class="search-container">
        <div class="form-grid">
            <label class="form-grid-label">Client ID</label>
            <select class="bs-select filter-op">
                <option>Like</option>
                <option>=</option>
            </select>
            <input type="text" class="bs-input-text search-field" data-field="ClientID">

            <label class="form-grid-label">Name</label>
            <select class="bs-select filter-op">
                <option>Like</option>
                <option>=</option>
            </select>
            <input type="text" class="bs-input-text search-field" data-field="Name">

            <label class="form-grid-label">ID Number</label>
            <select class="bs-select filter-op">
                <option>Like</option>
                <option>=</option>
            </select>
            <input type="text" class="bs-input-text search-field" data-field="IDNumber">

            <label class="form-grid-label">MobileNo</label>
            <select class="bs-select filter-op">
                <option>Like</option>
                <option>=</option>
            </select>
            <input type="text" class="bs-input-text search-field" data-field="MobileNo">
        </div>

        <div class="btn-container">
            <button class="bs-btn bs-btn--primary" id="btnSearch"><i class="bi bi-search"></i> Search</button>
        </div>

        <div class="results-section">
            <div class="results-header">Search Results</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ClientID</th>
                            <th>Name</th>
                            <th>IDNumber</th>
                            <th>ApplicationID</th>
                            <th>AccountID</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer-actions">
            <button class="btn-action"><i class="bi bi-arrow-left"></i></button>
            <button class="btn-action"><i class="bi bi-arrow-right"></i></button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../../assets/js/pages/customer-management/client-search.js"></script>
</body>

</html>
