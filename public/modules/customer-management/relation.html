<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relation Details</title>
    <!-- Use relative link to the base framework in account-maintenance -->
    <link rel="stylesheet" href="DataEntry/dataentry-client-base.css?v=20250128" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        /* Module specific overrides to match "Address" and "Bank Details" exactly */
        .de-card__header {
            background: linear-gradient(180deg, #4A7C95 0%, #3D6A7F 100%) !important;
            flex-shrink: 0;
            color: white !important;
        }

        .de-card__header--muted,
        .de-card__header--bts {
            background: linear-gradient(180deg, #4A7C95 0%, #3D6A7F 100%) !important;
            color: white !important;
            cursor: default !important;
        }

        .de-card__header--bts:hover {
            background: linear-gradient(180deg, #4A7C95 0%, #3D6A7F 100%) !important;
        }

        /* Force full height for embedded view */
        html,
        body,
        .de-window {
            height: 100% !important;
            margin: 0 !important;
            overflow: hidden !important;
        }

        .de-label--blue {
            color: #4A7C95;
            font-weight: 700;
        }

        /* Specialized input group for ID + Lookup */
        .de-input-group--lookup {
            display: flex;
            gap: 2px;
            width: 100%;
        }

        .de-input--id {
            flex: 1 !important;
        }

        /* Custom Table Styling for matching */
        .de-card--grid {
            flex: 1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            margin-top: 15px;
        }

        .de-card__body--table {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 !important;
        }

        .de-table-wrap {
            flex: 1;
            overflow-y: auto;
        }

        /* Local Action Buttons in the form area */
        .de-local-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            margin-top: 5px;
        }

        .de-btn-local {
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #cbd5e1;
            background: white;
            color: #475569;
        }

        .de-btn-local:hover {
            background: #f1f5f9;
        }

        .de-btn-local--primary {
            background: #4A7C95;
            color: white;
            border-color: #4A7C95;
        }

        .de-btn-local--primary:hover {
            background: #3D6A7F;
        }

        .de-btn-local--danger {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .de-btn-local--danger:hover {
            background: #dc2626;
        }

        /* BTS Toggle Button Styling Override */
        .de-bts-toggle {
            color: white !important;
            background: rgba(255, 255, 255, 0.2) !important;
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .de-bts-toggle:hover {
            background: rgba(255, 255, 255, 0.3) !important;
        }

        /* Disabled action button styling to match Address form */
        .de-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Darken input text and grid text to match Client Maintenance */
        .de-input,
        .de-select,
        .bs-input-text,
        .bs-select,
        .de-table__body td,
        .bs-input-number,
        .bs-textarea {
            color: #1e293b !important;
            /* --de-text-primary */
            font-size: 11px !important;
            /* --de-font-size-sm */
            font-weight: 800 !important;
            /* Matches .de-audit-value */
        }

        .de-input::placeholder,
        .bs-input-text::placeholder,
        .bs-input-number::placeholder,
        .bs-textarea::placeholder {
            color: #9ca3af;
            /* lighter placeholder */
            font-weight: 400 !important;
        }
    </style>
</head>

<body>
    <div class="de-window">
        <main class="de-main de-main--with-panel">
            <div class="de-form-shell" role="region" aria-label="Relation form">
                <!-- Main Form Card -->
                <section class="de-card">
                    <header class="de-card__header">
                        <span class="de-card__title"><i class="bi bi-people-fill"></i> Relation Information</span>
                        <div class="de-card__actions">
                            <button class="de-btn-icon" type="button" onclick="location.reload()" title="Reset Form">
                                <i class="bi bi-eraser"></i>
                            </button>
                        </div>
                    </header>

                    <div class="de-card__body section-body-bordered">
                        <div class="de-form-grid">
                            <!-- Row 1: Client ID & Name -->
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="clientId">Client ID</label>
                                <div class="de-input-group--lookup">
                                    <input type="text" id="clientId" name="clientId" placeholder="Search ID..."
                                        class="de-input bs-input-text de-input--id">
                                    <button class="de-btn-lookup btn-lookup" type="button" title="Search Client">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="de-field">
                                <label class="de-label" for="clientName">Client Name</label>
                                <input type="text" id="clientName" name="clientName" placeholder="Client Name"
                                    class="de-input bs-input-text" readonly>
                            </div>

                            <!-- Row 2: Relation Type & Relation -->
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="relationType">Relation Type</label>
                                <select id="relationType" name="relationType" class="de-select bs-select">
                                    <option value="">--Select--</option>
                                </select>
                            </div>
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="relation">Relation</label>
                                <select id="relation" name="relation" class="de-select bs-select">
                                    <option value="">--Select--</option>
                                </select>
                            </div>

                            <!-- Row 3: Share Percentage -->
                            <div class="de-field">
                                <label class="de-label de-label--blue" for="sharePercentage">Share Percentage</label>
                                <input type="number" id="sharePercentage" name="sharePercentage" placeholder="0.00"
                                    class="de-input bs-input-number" step="0.01" min="0" max="100">
                            </div>
                            <div class="de-field"></div>

                            <!-- Row 4: Remarks -->
                            <div class="de-field de-field--full">
                                <label class="de-label" for="remarks">Remarks</label>
                                <textarea id="remarks" name="remarks"
                                    placeholder="Enter any additional relationship details..."
                                    class="de-textarea bs-textarea" style="height: 60px; resize: none;"></textarea>
                            </div>

                        </div>
                    </div>
                </section>

                <!-- Grid Section for Relation Records -->
                <section class="de-card de-card--grid">
                    <header class="de-card__header de-card__header--muted">
                        <span class="de-card__title"><i class="bi bi-list-ul"></i> Existing Relations</span>
                    </header>
                    <div class="de-card__body de-card__body--table">
                        <div class="de-table-wrap">
                            <table class="de-table relation-table">
                                <thead class="de-table__head">
                                    <tr>
                                        <th style="width: 40%;">Client Name</th>
                                        <th style="width: 35%;">Relation</th>
                                        <th style="width: 25%;">Share (%)</th>
                                    </tr>
                                </thead>
                                <tbody class="de-table__body" id="relationTableBody">
                                    <tr>
                                        <td colspan="3" class="de-table__empty-cell"
                                            style="text-align: center; padding: 40px; color: #94a3b8;">
                                            <div class="de-empty-state">
                                                <i class="bi bi-inbox"
                                                    style="font-size: 24px; display: block; margin-bottom: 8px;"></i>
                                                <span>No records found. Click 'Add' to enter new details.</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>


                <!-- Behind The Scene Section -->
                <section class="de-card de-card--bts" id="btsSection">
                    <header class="de-card__header de-card__header--bts" id="btsHeader">
                        <span class="de-card__title"><i class="bi bi-gear"></i> BEHIND THE SCENE</span>
                        <button type="button" class="de-bts-toggle" aria-label="Toggle Behind The Scene">
                            <i class="bi bi-chevron-up"></i>
                        </button>
                    </header>
                    <div class="de-card__body de-card__body--bts" id="btsBody">
                        <div class="de-audit-grid">
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Created By</span>
                                <span class="de-audit-value" id="createdBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Created On</span>
                                <span class="de-audit-value" id="createdOn">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Modified By</span>
                                <span class="de-audit-value" id="modifiedBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Modified On</span>
                                <span class="de-audit-value" id="modifiedOn">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Supervised By</span>
                                <span class="de-audit-value" id="supervisedBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Supervised On</span>
                                <span class="de-audit-value" id="supervisedOn">-</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Action Panel -->
            <aside class="de-action-panel">
                <div class="de-action-group de-action-group--bottom">
                    <button class="de-action-btn btn-action action-view de-action-btn--default" type="button"
                        style="display: none;">
                        <i class="bi bi-eye"></i><span>View</span>
                    </button>
                    <button class="de-action-btn btn-action action-add" type="button">
                        <i class="bi bi-plus-circle"></i><span>Add</span>
                    </button>
                    <button class="de-action-btn btn-action action-edit" type="button">
                        <i class="bi bi-pencil-square"></i><span>Edit</span>
                    </button>
                    <button class="de-action-btn btn-action action-delete de-action-btn--delete" type="button">
                        <i class="bi bi-trash3"></i><span>Delete</span>
                    </button>
                    <button class="de-action-btn btn-action action-save de-action-btn--save" type="button">
                        <i class="bi bi-check-lg"></i><span>Save</span>
                    </button>
                    <button class="de-action-btn btn-action action-cancel de-action-btn--cancel" type="button">
                        <i class="bi bi-x-lg"></i><span>Cancel</span>
                    </button>
                    <button class="de-action-btn btn-action action-back de-action-btn--cancel" type="button">
                        <i class="bi bi-box-arrow-right"></i><span>Close</span>
                    </button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../shared/toast-notification.js"></script>

    <!-- Framework Utilities -->
    <script src="../account-maintenance/DataEntry/dataentry-base.js?v=20250128"></script>
    <script src="../account-maintenance/DataEntry/dataentry-utils.js"></script>

    <!-- Page Logic -->
    <script src="./relation.js"></script>

    <script>
        const initializeBtsToggle = () => {
            const toggleBtn = document.querySelector('.de-bts-toggle');
            const btsBody = document.getElementById('btsBody');
            const icon = toggleBtn?.querySelector('i');

            if (toggleBtn && btsBody) {
                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const body = document.getElementById('btsBody');
                    const btn = document.querySelector('.de-bts-toggle');
                    const ico = btn?.querySelector('i');

                    const isHidden = body.style.display === 'none';

                    // Toggle visibility
                    body.style.display = isHidden ? 'block' : 'none';

                    // Rotate icon
                    if (ico) {
                        ico.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
                    }
                });
            }
        };

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeBtsToggle);
        } else {
            initializeBtsToggle();
        }
    </script>

    <style>
        .de-bts-toggle i {
            transition: transform 0.3s ease;
        }
    </style>
</body>

</html>
