<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facility Audit Trail</title>
  <link rel="stylesheet" href="facility-audit-trail.css" />
</head>
<body>
  <div class="window" role="application" aria-label="Facility Audit Trail">
    <div class="title-bar">
      <div class="title-bar-left">
        <span class="title-icon" aria-hidden="true">☰</span>
        <span class="title-text">Facility Audit Trail</span>
      </div>
      <div class="title-bar-right">
        <button class="title-btn" type="button" aria-label="Minimize">─</button>
        <button class="title-btn" type="button" aria-label="Maximize">☐</button>
        <button class="title-btn close" type="button" aria-label="Close" id="closeX">✕</button>
      </div>
    </div>

    <div class="main-container">
      <div class="content">
        <div class="form-box" aria-label="Search criteria">
          <div class="form-grid">
            <div class="form-row">
              <label class="label-blue" for="branchId">Branch ID</label>
              <input type="text" id="branchId" class="input-mid" value="0101" />
              <input type="text" id="branchName" class="input-wide" value="Head Office" readonly />
              <button class="btn-lookup" type="button" id="branchLookup" aria-label="Lookup branch">🔍</button>
            </div>

            <div class="form-row">
              <label class="label-blue" for="applicationId">Application ID</label>
              <input type="text" id="applicationId" class="input-mid" />
              <span class="row-spacer" aria-hidden="true"></span>
            </div>
          </div>
        </div>

        <div class="grid-shell" aria-label="Audit trail results">
          <div class="grid-table" role="table" aria-label="Facility Audit Trail table">
            <div class="grid-header" role="row">
              <div class="grid-cell" role="columnheader">AmendmentNumb</div>
              <div class="grid-cell" role="columnheader">LCNumber</div>
              <div class="grid-cell" role="columnheader">Application</div>
              <div class="grid-cell" role="columnheader">Status</div>
              <div class="grid-cell" role="columnheader">Series</div>
              <div class="grid-cell" role="columnheader">Created By</div>
              <div class="grid-cell" role="columnheader">Created On</div>
              <div class="grid-cell" role="columnheader">Approved By</div>
              <div class="grid-cell" role="columnheader">Approved On</div>
              <div class="grid-cell" role="columnheader">ViewDetail</div>
            </div>

            <div class="grid-body" role="rowgroup">
              <div class="grid-empty" role="row">
                <div class="grid-empty__cell" role="cell">No records to display.</div>
              </div>
            </div>
          </div>

          <div class="action-panel" aria-label="Actions">
            <button type="button" class="action-btn" id="viewBtn"><span class="action-btn__label">View</span></button>
            <button type="button" class="action-btn action-btn--secondary" id="cancelBtn"><span class="action-btn__label">Cancel</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="facility-audit-trail.js"></script>
</body>
</html>
