<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Defined Fields 2</title>
    <!-- Use relative link to the base framework in account-maintenance -->
    <link rel="stylesheet" href="DataEntry/dataentry-client-base.css?v=20250128" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        /* Module specific overrides */
        .de-card__header {
            background: linear-gradient(180deg, #4A7C95 0%, #3D6A7F 100%) !important;
            flex-shrink: 0;
            color: white !important;
        }

        /* Force full height for embedded view */
        html,
        body,
        .de-window {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        .de-label--blue {
            color: #4A7C95;
            font-weight: 700;
        }

        /* BTS Toggle Button Styling Override */
        .de-bts-toggle {
            color: white !important;
            background: rgba(255, 255, 255, 0.2) !important;
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .de-bts-toggle:hover {
            background: rgba(255, 255, 255, 0.3) !important;
        }

        /* Darken input text and grid text to match Client Maintenance */
        .de-input,
        .de-select,
        .bs-input-text,
        .bs-select,
        .de-textarea {
            color: #1e293b !important;
            font-size: 11px !important;
            font-weight: 800 !important;
        }

        .de-input::placeholder,
        .bs-input-text::placeholder,
        textarea::placeholder {
            color: #9ca3af;
            font-weight: 400 !important;
        }

        /* Disabled Action Buttons Styling */
        .de-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="de-window">
        <!-- Main Content Area -->
        <main class="de-main de-main--with-panel">
            <div class="de-form-shell" role="region" aria-label="UDF 2 form">
                <!-- Main Form Card -->
                <section class="de-card">
                    <header class="de-card__header">
                        <span class="de-card__title"><i class="bi bi-ui-checks-grid"></i> User Defined Fields 2</span>
                        <div class="de-card__actions">
                            <button class="de-btn-icon" type="button" onclick="location.reload()" title="Reset Form">
                                <i class="bi bi-eraser"></i>
                            </button>
                        </div>
                    </header>

                    <div class="de-card__body">
                        <div class="de-form-grid">
                            <!-- Placeholder Fields to demonstrate layout -->
                            <div class="de-field">
                                <label class="de-label">Field 1</label>
                                <input type="text" class="de-input bs-input-text" placeholder="-">
                            </div>
                            <div class="de-field">
                                <label class="de-label">Field 2</label>
                                <input type="text" class="de-input bs-input-text" placeholder="-">
                            </div>
                            <div class="de-field">
                                <label class="de-label">Field 3</label>
                                <input type="text" class="de-input bs-input-text" placeholder="-">
                            </div>
                            <div class="de-field">
                                <label class="de-label">Field 4</label>
                                <input type="text" class="de-input bs-input-text" placeholder="-">
                            </div>
                            <div class="de-field">
                                <label class="de-label">Field 5</label>
                                <input type="text" class="de-input bs-input-text" placeholder="-">
                            </div>
                            <div class="de-field">
                                <label class="de-label">Field 6</label>
                                <input type="text" class="de-input bs-input-text" placeholder="-">
                            </div>
                        </div>

                        <!-- Optional: Message indicating these are dynamic -->
                        <div style="margin-top:20px; color:#9ca3af; font-size:11px; text-align:center;">
                            <em>Additional fields may be configured here.</em>
                        </div>
                    </div>
                </section>

                <!-- BEHIND THE SCENE Section -->
                <section class="de-card de-card--bts" id="btsSection">
                    <header class="de-card__header de-card__header--bts" id="btsHeader">
                        <span class="de-card__title"><i class="bi bi-gear"></i> BEHIND THE SCENE</span>
                        <button type="button" class="de-bts-toggle" aria-label="Toggle Behind The Scene">
                            <i class="bi bi-chevron-up"></i>
                        </button>
                    </header>
                    <div class="de-card__body de-card__body--bts" id="btsBody">
                        <div class="de-audit-grid">
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Created By</span>
                                <span class="de-audit-value" id="CreatedBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Created On</span>
                                <span class="de-audit-value" id="CreatedOn">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Modified By</span>
                                <span class="de-audit-value" id="ModifiedBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Modified On</span>
                                <span class="de-audit-value" id="ModifiedOn">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Supervised By</span>
                                <span class="de-audit-value" id="SupervisedBy">-</span>
                            </div>
                            <div class="de-audit-cell">
                                <span class="de-audit-label">Supervised On</span>
                                <span class="de-audit-value" id="SupervisedOn">-</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Action Panel -->
            <aside class="de-action-panel">
                <div class="de-action-group de-action-group--top">
                    <!-- Top actions if needed -->
                </div>
                <div class="de-action-group de-action-group--bottom">
                    <button class="de-action-btn btn-action action-add" type="button">
                        <i class="bi bi-plus-circle"></i><span>Add</span>
                    </button>
                    <button class="de-action-btn btn-action action-edit" type="button">
                        <i class="bi bi-pencil-square"></i><span>Edit</span>
                    </button>
                    <button class="de-action-btn btn-action action-delete de-action-btn--delete" type="button">
                        <i class="bi bi-trash3"></i><span>Delete</span>
                    </button>
                    <button class="de-action-btn btn-action action-save de-action-btn--save" type="button">
                        <i class="bi bi-check-lg"></i><span>Save</span>
                    </button>
                    <button class="de-action-btn btn-action action-cancel de-action-btn--cancel" type="button">
                        <i class="bi bi-x-lg"></i><span>Cancel</span>
                    </button>
                    <button class="de-action-btn btn-action action-back de-action-btn--cancel" type="button">
                        <i class="bi bi-box-arrow-right"></i><span>Close</span>
                    </button>
                </div>
            </aside>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // BTS Toggle
            const toggleBtn = document.querySelector('.de-bts-toggle');
            const btsSection = document.querySelector('.de-card--bts');

            if (toggleBtn && btsSection) {
                const updateIcon = () => {
                    const icon = toggleBtn.querySelector('i');
                    if (icon) {
                        icon.style.transform = btsSection.classList.contains('collapsed') ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                };

                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    btsSection.classList.toggle('collapsed');
                    updateIcon();
                });

                // Initialize state
                updateIcon();
            }

            // Close Button
            const closeBtn = document.querySelector('.action-back');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    if (window.parent) {
                        window.parent.postMessage({ type: 'CLOSE_DATAENTRY' }, '*');
                    }
                });
            }
        });
    </script>
    <style>
        /* BTS Collapsed State */
        .de-card--bts.collapsed .de-card__body--bts {
            display: none !important;
        }
    </style>
</body>

</html>
