<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL-Cancel Stop Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="gl-cancel-stop-payment.css">
</head>

<body>
    <div class="cancel-stop-payment-container">
        <!-- Branch and Account Section -->
        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="branchId">Branch ID</label>
                    <div class="input-with-search">
                        <input type="text" id="branchId" class="form-control" value="0101">
                        <button type="button" class="btn-search" id="branchSearch">
                            <i class="fas fa-search"></i>
                        </button>
                        <span class="branch-name">Head Office</span>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="accountId">Account ID</label>
                    <div class="input-with-search">
                        <input type="text" id="accountId" class="form-control">
                        <button type="button" class="btn-search" id="accountSearch">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="requestRefNo">Request Ref No</label>
                    <div class="input-with-search">
                        <input type="text" id="requestRefNo" class="form-control">
                        <button type="button" class="btn-search" id="requestRefSearch">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cancel Stop Payment Details Section -->
        <div class="form-section">
            <div class="section-header">
                <div class="header-line"></div>
            </div>
            
            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="chequeNoStart">Cheque No Start</label>
                    <input type="text" id="chequeNoStart" class="form-control">
                </div>
                <div class="form-group">
                    <label for="chequeNoEnd">Cheque No End</label>
                    <input type="text" id="chequeNoEnd" class="form-control">
                </div>
            </div>

            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="chequeDate">Cheque Date</label>
                    <select id="chequeDate" class="form-control">
                        <option value="">--Select--</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="chequeAmount">Cheque Amount</label>
                    <input type="text" id="chequeAmount" class="form-control">
                </div>
            </div>

            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="reasonId">Reason ID</label>
                    <select id="reasonId" class="form-control">
                        <option value="">--Select--</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reason">Reason</label>
                    <input type="text" id="reason" class="form-control">
                </div>
            </div>

            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="cancellationDate">Cancellation Date</label>
                    <input type="text" id="cancellationDate" class="form-control">
                </div>
                <div class="form-group">
                    <label for="instructionGivenBy">Instruction Given By</label>
                    <input type="text" id="instructionGivenBy" class="form-control">
                </div>
            </div>
        </div>

        <!-- Data Grid Section -->
        <div class="data-grid-container">
            <table class="data-grid" id="cancelStopPaymentGrid">
                <thead>
                    <tr>
                        <th>Prefix</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Cheque Date</th>
                        <th>Reason</th>
                        <th>Cancel Date</th>
                        <th>Amount</th>
                        <th>Instruction/GivenBy</th>
                    </tr>
                </thead>
                <tbody id="cancelStopPaymentGridBody">
                    <tr class="no-records">
                        <td colspan="8">No records to display.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Behind The Scene Section -->
        <div class="behind-scene-section">
            <div class="behind-scene-header">Behind The Scene</div>
            <div class="behind-scene-content">
                <div class="behind-scene-row">
                    <label for="currencyId">Currency ID</label>
                    <input type="text" id="currencyId" class="form-control">
                </div>
                <p>BR.Net Web Banking</p>
            </div>
        </div>

        <!-- Action Panel (Right Sidebar) -->
        <div class="action-panel">
            <button type="button" class="btn-action" id="btnView">
                <i class="fas fa-eye"></i>
                <span>View</span>
            </button>
            <button type="button" class="btn-action" id="btnAdd">
                <i class="fas fa-plus"></i>
                <span>Add</span>
            </button>
            <button type="button" class="btn-action" id="btnEdit">
                <i class="fas fa-edit"></i>
                <span>Edit</span>
            </button>
            <button type="button" class="btn-action" id="btnDelete">
                <i class="fas fa-trash"></i>
                <span>Delete</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="gl-cancel-stop-payment.js"></script>
</body>

</html>
