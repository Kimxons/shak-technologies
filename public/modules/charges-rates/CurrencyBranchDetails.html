<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Currency Branch Details · Charges & Rates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="CurrencyBranchDetails.css" />
</head>

<body class="client-maintenance currency-branch-details copilot-theme" data-page="client-maintenance">
    <div class="cm-react-orbs" aria-hidden="true">
        <span class="cm-react-orb cm-react-orb--primary"></span>
        <span class="cm-react-orb cm-react-orb--secondary"></span>
        <span class="cm-react-orb cm-react-orb--accent"></span>
    </div>

    <div class="cm-workspace">
        <div class="cm-shell-form" autocomplete="off" novalidate>
            <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
                <div class="cm-nav-section">
                    <button type="button" class="cm-dataentry-toggle" aria-expanded="true">
                        <span class="fw-bold">DataEntry</span>
                        <i class="bi bi-chevron-down"></i>
                    </button>

                    <div class="cm-legacy-nav__list">

                        <button type="button" class="cm-legacy-nav__item" data-nav-target="exchange-rates">
                            <span>Exchange Rates</span>
                        </button>
                        <button type="button" class="cm-legacy-nav__item" data-nav-target="currency-branch-gl">
                            <span>Currency Branch GL</span>
                        </button>
                    </div>
                </div>
            </aside>

            <section class="cm-legacy-content">
                <form class="cm-top-identifiers card-surface" data-screen="data-entry" autocomplete="off" novalidate>
                    <!-- Existing content unchanged, just updating the tag attribute -->
                    <div class="cbs-grid cbs-grid--one">
                        <div class="cbs-field cm-compact-field" style="max-width: 600px;">
                            <label class="cbs-label" for="BranchID">Branch ID</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="BranchID" name="BranchID" value="0101"
                                    readonly />
                                <input type="text" class="form-control w-50" value="Head Office" readonly />
                                <button class="btn btn-outline-primary" type="button" aria-label="Search branch">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="cbs-field cm-compact-field" style="max-width: 400px;">
                            <label class="cbs-label" for="CurrencyID">Currency ID</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="CurrencyID" name="CurrencyID" />
                                <button class="btn btn-outline-primary" type="button" aria-label="Search currency">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="cbs-field cm-compact-field" style="max-width: 300px;">
                            <label class="cbs-label" for="MinCurrencyHolding">Minimum Currency Holding</label>
                            <input type="number" class="form-control" id="MinCurrencyHolding" name="MinCurrencyHolding"
                                step="0.01" />
                        </div>

                        <div class="cbs-field cm-compact-field" style="max-width: 300px;">
                            <label class="cbs-label" for="MaxCurrencyHolding">Maximum Currency Holding</label>
                            <input type="number" class="form-control" id="MaxCurrencyHolding" name="MaxCurrencyHolding"
                                step="0.01" />
                        </div>
                    </div>

                    <div class="audit-trail mt-auto pt-3 border-top">
                        <h6 class="text-muted mb-2"
                            style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Behind The
                            Scene</h6>
                        <div class="cbs-grid cbs-grid--three cbs-grid--tight">
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Created By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Modified By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Supervised By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Created On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Modified On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Supervised On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                        </div>
                    </div>
                </form>

                <form class="card-surface d-none" data-screen="exchange-rates" autocomplete="off" novalidate>
                    <div class="p-4 text-center text-muted">
                        <i class="bi bi-currency-exchange display-4 mb-3"></i>
                        <h5>Exchange Rates</h5>
                        <p>Exchange rates configuration form will appear here.</p>
                    </div>
                </form>

                <form class="card-surface d-none" data-screen="currency-branch-gl" autocomplete="off" novalidate>
                    <!-- Header Section -->
                    <div class="cbs-grid cbs-grid--one mb-3">
                        <div class="cbs-field cm-compact-field" style="max-width: 600px;">
                            <label class="cbs-label">GL Control Type</label>
                            <select class="form-select">
                                <option>--Select--</option>
                            </select>
                        </div>
                        <div class="cbs-field cm-compact-field" style="max-width: 600px;">
                            <label class="cbs-label">Account ID</label>
                            <div class="input-group">
                                <input type="text" class="form-control" />
                                <input type="text" class="form-control w-50" readonly />
                                <button class="btn btn-outline-primary" type="button">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Internal Action Buttons -->
                    <div class="d-flex justify-content-center gap-2 mb-3 bg-light p-2 rounded border">
                        <button type="button" class="btn btn-sm btn-light border shadow-sm px-3 fw-bold">New</button>
                        <button type="button" class="btn btn-sm btn-light border shadow-sm px-3 fw-bold"
                            disabled>Alter</button>
                        <button type="button" class="btn btn-sm btn-light border shadow-sm px-3 fw-bold"
                            disabled>Remove</button>
                        <button type="button" class="btn btn-sm btn-light border shadow-sm px-3 fw-bold"
                            disabled>Update</button>
                        <button type="button" class="btn btn-sm btn-light border shadow-sm px-3 fw-bold">Clear</button>
                    </div>

                    <!-- Table Section -->
                    <div class="table-responsive border rounded mb-auto" style="min-height: 200px;">
                        <table class="table table-sm table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>GL Control Type</th>
                                    <th>Account ID</th>
                                    <th>Account Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="3" class="text-center p-3 text-muted">No records to display.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Audit Trail -->
                    <div class="audit-trail mt-3 border-top pt-2">
                        <h6 class="text-muted mb-2" style="font-size: 0.75rem; text-transform: uppercase;">Behind The
                            Scene</h6>
                        <div class="cbs-grid cbs-grid--three cbs-grid--tight">
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Created By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Modified By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Supervised By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Created On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Modified On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Supervised On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                        </div>
                        <div class="text-danger fw-bold mt-2 small">No Details Found [No:1011]</div>
                    </div>
                </form>
            </section>

            <aside class="cm-legacy-actions" aria-label="Actions">
                <div class="cm-legacy-actions__group">
                    <p class="cm-legacy-actions__title">Navigate</p>
                    <div class="d-flex gap-2 w-100">
                        <button type="button" class="cm-shell__action flex-grow-1" aria-label="Previous">
                            <i class="bi bi-arrow-left"></i>
                        </button>
                        <button type="button" class="cm-shell__action flex-grow-1" aria-label="Next">
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="cm-legacy-actions__group text-end mt-auto">
                    <!-- Spacer to push buttons down if needed, but flex column handles it -->
                </div>

                <div class="cm-legacy-actions__group">
                    <p class="cm-legacy-actions__title">Operations</p>
                    <button type="button" class="cm-shell__action">View</button>
                    <button type="button" class="cm-shell__action">Add</button>
                    <button type="button" class="cm-shell__action">Edit</button>
                    <button type="submit" class="cm-shell__action">Save</button>
                    <button type="button" class="cm-shell__action">Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="CurrencyBranchDetails.js"></script>
</body>

</html>
