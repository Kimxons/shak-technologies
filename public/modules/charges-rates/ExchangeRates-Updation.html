<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exchange Rates - Updation · Charges & Rates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="ExchangeRates-Updation.css" />
</head>

<body class="client-maintenance exchange-rates-updation copilot-theme" data-page="client-maintenance">
    <div class="cm-react-orbs" aria-hidden="true">
        <span class="cm-react-orb cm-react-orb--primary"></span>
        <span class="cm-react-orb cm-react-orb--secondary"></span>
        <span class="cm-react-orb cm-react-orb--accent"></span>
    </div>

    <div class="cm-workspace">
        <div class="cm-shell-form" autocomplete="off" novalidate>


            <section class="cm-legacy-content">
                <!-- VIEW (Exchange Rates form) -->
                <form class="cm-top-identifiers card-surface" data-screen="view" autocomplete="off" novalidate>
                    <div class="cbs-grid cbs-grid--two cbs-grid--tight mb-4">
                        <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="BranchID">Branch ID</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="BranchID" name="BranchID" value="0101"
                                    readonly />
                                <input type="text" class="form-control" value="Head Office" readonly />
                                <button class="btn btn-outline-primary" type="button" aria-label="Search branch">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="CurrencyID">Currency ID</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="CurrencyID" name="CurrencyID" />
                                <button class="btn btn-outline-primary" type="button" aria-label="Search currency">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive cm-table-container">
                        <table class="table table-sm cm-table table-hover">
                            <thead>
                                <tr>
                                    <th>Rate Type</th>
                                    <th>Buying Rate</th>
                                    <th>Selling Rate</th>
                                    <th>Mean Rate</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Bills - Purchase (Foreign)</td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                </tr>
                                <tr>
                                    <td>Cheque Rate</td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                </tr>
                                <tr>
                                    <td>Cash - Currency Purchase / Sell</td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                </tr>
                                <tr>
                                    <td>Forward Rate</td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                </tr>
                                <tr>
                                    <td>Revaluation Rate</td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                </tr>
                                <tr>
                                    <td>Spot Rate</td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                </tr>
                                <tr>
                                    <td>Travellers Cheque</td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                    <td><input type="number" class="form-control form-control-sm" step="0.0001"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="audit-trail mt-auto pt-3 border-top">
                        <h6 class="text-muted mb-2"
                            style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Behind The
                            Scene</h6>
                        <div class="cbs-grid cbs-grid--three cbs-grid--tight">
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Created By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Modified By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Supervised By</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Created On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Modified On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Supervised On</label>
                                <input type="text" class="form-control" readonly>
                            </div>
                        </div>
                    </div>
                </form>
            </section>

            <aside class="cm-legacy-actions" aria-label="Actions">
                <div class="cm-legacy-actions__group">
                    <p class="cm-legacy-actions__title">Actions</p>
                    <button type="button" class="cm-shell__action">History</button>
                    <button type="button" class="cm-shell__action">Update Rate</button>
                </div>

                <div class="cm-legacy-actions__group">
                    <p class="cm-legacy-actions__title">Navigate</p>
                    <div class="d-flex gap-2 w-100">
                        <button type="button" class="cm-shell__action flex-grow-1" aria-label="Previous">
                            <i class="bi bi-arrow-left"></i>
                        </button>
                        <button type="button" class="cm-shell__action flex-grow-1" aria-label="Next">
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="cm-legacy-actions__group">
                    <p class="cm-legacy-actions__title">Operations</p>
                    <button type="button" class="cm-shell__action">View</button>
                    <button type="button" class="cm-shell__action">Edit</button>
                    <button type="submit" class="cm-shell__action">Save</button>
                    <button type="button" class="cm-shell__action">Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="ExchangeRates-Updation.js"></script>
</body>

</html>
