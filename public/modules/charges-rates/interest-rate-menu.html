<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interest Rate Menu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="interest-rate-menu" data-close-modal="interestRateMenuModal">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-percent am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Interest Rate Menu</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <!-- Left Sidebar -->
      <div class="sidebar" id="main-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-percent"></i>RATES</span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="sidebar-search">
          <input type="text" class="sidebar-search__input" id="submoduleSearch" placeholder="Search..." aria-label="Search submodules" />
          <i class="bi bi-search sidebar-search__icon"></i>
          <button type="button" class="sidebar-search__clear" id="submoduleSearchClear" aria-label="Clear search">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>

        <div class="sidebar-content" role="navigation" aria-label="Submodules">
          <div class="nav-section nav-section--card is-open" data-nav-section data-section-name="Data Entry">
            <div class="nav-header nav-header--card" data-tooltip="Data Entry">
              <div class="nav-header__content">
                <i class="bi bi-folder-fill nav-header__icon"></i>
                <span class="nav-label nav-label--card">Data Entry</span>
              </div>
              <div class="nav-header__badge">
                <span class="nav-badge">1</span>
                <button type="button" class="nav-arrow nav-arrow--card" aria-label="Toggle Data Entry" aria-expanded="true" aria-controls="irm-nav-dataentry">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items nav-items--card" id="irm-nav-dataentry">
              <div class="sidebar-item sidebar-item--enhanced" data-open-modal="slabDetailsModal" data-tooltip="Slab Details" role="button" tabindex="0">
                <div class="sidebar-item__content">
                  <i class="bi bi-layout-text-sidebar sidebar-item__icon"></i>
                  <span class="sidebar-item__label">Slab Details</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="form-content" role="region" aria-label="Interest Rate Menu form">
        <div class="form-card" data-main-form>
          <form id="interestRateForm" autocomplete="off" novalidate>
            <div class="form-section" data-section="interest-rate-menu">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Interest Rate Menu</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Interest Rate Menu" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="rateMenuId">Rate Menu ID</label>
                    <div class="kairo-control">
                      <input type="text" id="rateMenuId" name="rateMenuId" class="kairo-control__id" autocomplete="off" required />
                      <button type="button" class="btn-lookup" id="btnLookupRateMenu" aria-label="Search Rate Menu" title="Search" data-action="searchRateMenu"><i class="bi bi-search"></i></button>
                    </div>
                  </div>

                  <div class="col">
                    <label class="label-blue" for="description">Description</label>
                    <input type="text" id="description" name="description" class="bs-input-text" required />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="interestType">Interest Type</label>
                    <select id="interestType" name="interestType" class="bs-input-text">
                      <option value="">--Select--</option>
                      <option value="simple">Simple Interest</option>
                      <option value="compound">Compound Interest</option>
                      <option value="reducing">Reducing Balance</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="rateType">Rate Type</label>
                    <select id="rateType" name="rateType" class="bs-input-text">
                      <option value="">Advance Type</option>
                      <option value="fixed">Fixed Rate</option>
                      <option value="floating">Floating Rate</option>
                      <option value="variable">Variable Rate</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="currencyId">Currency ID</label>
                    <div class="kairo-control">
                      <input type="text" id="currencyId" name="currencyId" class="kairo-control__id" autocomplete="off" required />
                      <button type="button" class="btn-lookup" id="btnLookupCurrency" aria-label="Search Currency" title="Search" data-action="searchCurrency"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="baseRateId">Base Rate ID</label>
                    <div class="kairo-control">
                      <input type="text" id="baseRateId" name="baseRateId" class="kairo-control__id" autocomplete="off" />
                      <button type="button" class="btn-lookup" id="btnLookupBaseRate" aria-label="Search Base Rate" title="Search" data-action="searchBaseRate"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="lowerVariance">Lower Variance</label>
                    <input type="number" id="lowerVariance" name="lowerVariance" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="upperVariance">Upper Variance</label>
                    <input type="number" id="upperVariance" name="upperVariance" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="termPeriod">Term Period</label>
                    <select id="termPeriod" name="termPeriod" class="bs-input-text">
                      <option value="">--Select--</option>
                      <option value="daily">Daily</option>
                      <option value="monthly">Monthly</option>
                      <option value="quarterly">Quarterly</option>
                      <option value="semiannual">Semi-Annual</option>
                      <option value="annual">Annual</option>
                    </select>
                  </div>
                  <div class="col">
                    <div class="form-check mt-4">
                      <input class="form-check-input" type="checkbox" id="tierBased" name="tierBased" />
                      <label class="form-check-label" for="tierBased">Tier Based</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section audit-section--summary">
                  <div class="audit-cell"><span class="audit-label">Created By</span><span class="audit-value" id="createdBy">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified By</span><span class="audit-value" id="modifiedBy">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Supervised By</span><span class="audit-value" id="supervisedBy">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Created On</span><span class="audit-value" id="createdOn">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified On</span><span class="audit-value" id="modifiedOn">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Supervised On</span><span class="audit-value" id="supervisedOn">-</span></div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Action Panel -->
      <aside class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action" data-action="previous" title="Previous"><i class="bi bi-arrow-left-circle"></i>Previous</button>
          <button type="button" class="btn-action" data-action="next" title="Next"><i class="bi bi-arrow-right-circle"></i>Next</button>
          <button type="button" class="btn-action btn-view" data-action="view" title="View"><i class="bi bi-eye"></i>View</button>
          <button type="button" class="btn-action" data-action="add" title="Add"><i class="bi bi-plus-circle"></i>Add</button>
          <button type="button" class="btn-action" data-action="edit" title="Edit"><i class="bi bi-pencil"></i>Edit</button>
          <button type="button" class="btn-action" data-action="delete" title="Delete"><i class="bi bi-trash"></i>Delete</button>
          <button type="button" class="btn-action btn-save" data-action="save" title="Save"><i class="bi bi-check-circle"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel" title="Cancel"><i class="bi bi-x-circle"></i>Cancel</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <div class="modal fade" id="slabDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header d-none">
          <h5 class="modal-title">Slab Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body modal-body--iframe p-0">
          <iframe class="legacy-modal__iframe" src="slab-details.html" title="Slab Details"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="interest-rate-menu.js"></script>
</body>
</html>
