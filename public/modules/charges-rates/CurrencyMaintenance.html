<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Currency Maintenance · Charges &amp; Rates</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="CurrencyMaintenance.css" />
</head>

<body class="client-maintenance currency-maintenance copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <div class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle is-active" aria-label="View" data-nav-target="view">
            <span class="cm-nav-toggle__label">View</span>
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </button>
        </div>

        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle" aria-label="Denomination" data-nav-target="denomination">
            <span class="cm-nav-toggle__label">Denomination</span>
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </button>
        </div>

        <div class="cm-nav-section">
          <button type="button" class="cm-nav-toggle" aria-label="Data Entry" data-nav-target="data-entry">
            <span class="cm-nav-toggle__label">Data Entry</span>
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <!-- VIEW (Currency details form) -->
        <form class="cm-top-identifiers card-surface" data-screen="view" autocomplete="off" novalidate>
          <div class="cbs-grid cbs-grid--two cbs-grid--tight">
            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="CurrencyID">Currency ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="CurrencyID" name="CurrencyID" />
                <button class="btn btn-outline-primary" type="button" aria-label="Search currency">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="ISOCode">ISO Code</label>
              <input type="text" class="form-control" id="ISOCode" name="ISOCode" />
            </div>

            <div class="cbs-field cm-compact-field cbs-full">
              <label class="cbs-label" for="Description">Description</label>
              <input type="text" class="form-control" id="Description" name="Description" />
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="DisplayName">Display Name</label>
              <input type="text" class="form-control" id="DisplayName" name="DisplayName" />
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="SwiftCurrencyID">Swift Currency ID</label>
              <input type="text" class="form-control" id="SwiftCurrencyID" name="SwiftCurrencyID" />
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="MinCurrencyValue">Minimum Currency Value</label>
              <input type="number" class="form-control" id="MinCurrencyValue" name="MinCurrencyValue" step="0.01" />
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="MaxCurrencyValue">Maximum Currency Value</label>
              <input type="number" class="form-control" id="MaxCurrencyValue" name="MaxCurrencyValue" step="0.01" />
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="MajorUnit">Major Unit</label>
              <input type="number" class="form-control" id="MajorUnit" name="MajorUnit" step="1" />
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="MinorUnit">Minor Unit</label>
              <input type="number" class="form-control" id="MinorUnit" name="MinorUnit" step="1" />
            </div>

            <div class="cbs-field cm-compact-field cbs-inline">
              <label class="cbs-label" for="CoinsAvailable">Coins Available</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="CoinsAvailable" name="CoinsAvailable" />
              </div>
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="ConversionValue">Conversion Value</label>
              <input type="number" class="form-control" id="ConversionValue" name="ConversionValue" step="0.0001" />
            </div>

            <div class="cbs-field cm-compact-field">
              <label class="cbs-label" for="ValueCappingAmount">Value Capping Amount</label>
              <input type="number" class="form-control" id="ValueCappingAmount" name="ValueCappingAmount" step="0.01" />
            </div>

            <div class="cbs-field cm-compact-field cbs-inline">
              <label class="cbs-label" for="ParticipatesInClearing">Participates In Clearing</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="ParticipatesInClearing"
                  name="ParticipatesInClearing" />
              </div>
            </div>

            <div class="cbs-field cm-compact-field cbs-full">
              <label class="cbs-label" for="Remarks">Remarks</label>
              <textarea class="form-control" id="Remarks" name="Remarks" rows="2"></textarea>
            </div>
          </div>
        </form>

        <!-- DENOMINATION (table) -->
        <form class="card-surface cm-denomination is-hidden" data-screen="denomination" aria-label="Denomination"
          autocomplete="off" novalidate>
          <div class="cm-denomination__frame">
            <div class="cm-denomination__bar" aria-hidden="true"></div>
            <div class="cm-denomination__tablewrap">
              <table class="table table-sm mb-0 cm-denomination__table" aria-label="Currency denominations">
                <thead>
                  <tr>
                    <th scope="col">Description</th>
                    <th scope="col">Value of Currency</th>
                    <th scope="col">Currency Type</th>
                    <th scope="col">Value ID</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="4" class="cm-denomination__empty">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </form>

        <!-- DATA ENTRY (placeholder, currently same as View) -->
        <form class="card-surface is-hidden" data-screen="data-entry" aria-label="Data Entry" autocomplete="off"
          novalidate>
          <p class="mb-0" style="font-size: 0.85rem;">Data Entry uses the same fields as View.</p>
        </form>
      </section>

      <aside class="cm-legacy-actions" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Navigate</p>
          <div class="d-flex gap-2 w-100">
            <button type="button" class="cm-shell__action flex-grow-1" aria-label="Previous">
              <i class="bi bi-arrow-left"></i>
            </button>
            <button type="button" class="cm-shell__action flex-grow-1" aria-label="Next">
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>

        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Actions</p>
          <button type="button" class="cm-shell__action">View</button>
          <button type="button" class="cm-shell__action" disabled>Add</button>
          <button type="button" class="cm-shell__action" disabled>Edit</button>
          <button type="button" class="cm-shell__action" disabled>Delete</button>
          <button type="submit" class="cm-shell__action" disabled>Save</button>
          <button type="button" class="cm-shell__action" disabled>Cancel</button>
        </div>

        <div class="cm-legacy-actions__group is-hidden" data-actions-screen="denomination">
          <p class="cm-legacy-actions__title">Denomination</p>
          <button type="button" class="cm-shell__action" data-action="print">Print</button>
          <button type="button" class="cm-shell__action" data-action="back">Back</button>
        </div>
      </aside>
    </div>
  </div>
  <!-- Search Results Modal -->
  <div class="modal fade" id="searchResultModal" tabindex="-1" aria-labelledby="searchResultModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="searchResultModalLabel">Search Results</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0">
          <div class="table-responsive" style="max-height: 400px;">
            <table class="table table-hover table-striped mb-0" id="searchResultsTable">
              <thead class="table-light sticky-top">
                <tr>
                  <th scope="col">Currency ID</th>
                  <th scope="col">Description</th>
                </tr>
              </thead>
              <tbody>
                <!-- Results will be injected here -->
              </tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="CurrencyMaintenance.js"></script>
</body>

</html>
