<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teller Maintenance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="TellerMaintenance.css?v=6" />
</head>

<body class="teller-maintenance copilot-theme" data-page="client-maintenance">
    <div class="cm-react-orbs" aria-hidden="true">
        <span class="cm-react-orb cm-react-orb--primary"></span>
        <span class="cm-react-orb cm-react-orb--secondary"></span>
        <span class="cm-react-orb cm-react-orb--accent"></span>
    </div>
    <div class="cm-workspace">
        <div class="cm-shell-form" autocomplete="off" novalidate>
            <!-- Removed Left Sidebar (cm-legacy-nav) -->

            <section class="cm-legacy-content">
                <div class="cm-scroll-region">
                    <!-- Teller Maintenance Form -->
                    <form class="cm-top-identifiers card-surface" data-screen="teller-maintenance" autocomplete="off"
                        novalidate>
                        <!-- Top Identifiers -->
                        <div class="cbs-grid cbs-grid--two mb-4">
                            <!-- Branch ID -->
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label required">Branch ID</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="Code" />
                                    <input type="text" class="form-control flex-grow-1" placeholder="Description"
                                        readonly />
                                    <button class="btn btn-outline-primary" type="button">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Till ID -->
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label required">Till ID</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" />
                                    <input type="text" class="form-control flex-grow-1" readonly />
                                    <button class="btn btn-outline-primary" type="button">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Cashier -->
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Cashier</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" />
                                    <input type="text" class="form-control flex-grow-1" readonly />
                                </div>
                            </div>

                            <!-- Status -->
                            <div class="cbs-field cm-compact-field">
                                <label class="cbs-label">Status</label>
                                <input type="text" class="form-control" readonly />
                            </div>
                        </div>

                        <!-- Cash Balance Section -->
                        <div class="mb-4">
                            <div class="section-header py-2 mb-2"
                                style="font-size: 0.95rem; border-left-color: var(--secondary-color, #64748b);">
                                Cash Balance
                            </div>
                            <div class="table-responsive border rounded bg-white" style="min-height: 200px;">
                                <table class="table table-sm table-hover mb-0 cm-table">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Currency ID</th>
                                            <th>Cash Control GL</th>
                                            <th>Description</th>
                                            <th class="text-end">Opening Balance</th>
                                            <th class="text-end">Closing Balance</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="5" class="text-center p-3 text-muted">
                                                No records to display.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Transaction Details Section -->
                        <div class="mb-4">
                            <div class="section-header py-2 mb-2"
                                style="font-size: 0.95rem; border-left-color: var(--secondary-color, #64748b);">
                                Transaction Details
                            </div>
                            <div class="cm-transaction-details bg-light p-3 rounded border">
                                <div class="row">
                                    <div class="col-md-8 mx-auto">
                                        <table class="table table-borderless table-sm">
                                            <thead>
                                                <tr>
                                                    <th></th>
                                                    <th class="text-center">Fixed Amount</th>
                                                    <th class="text-center">No of Entries</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td class="text-end fw-medium pt-2">Cash Credits</td>
                                                    <td><input type="text" class="form-control" /></td>
                                                    <td><input type="text" class="form-control" /></td>
                                                </tr>
                                                <tr>
                                                    <td class="text-end fw-medium pt-2">Cash Debits</td>
                                                    <td><input type="text" class="form-control" /></td>
                                                    <td><input type="text" class="form-control" /></td>
                                                </tr>
                                                <tr>
                                                    <td class="text-end fw-medium pt-2">Transfer Credits</td>
                                                    <td><input type="text" class="form-control" /></td>
                                                    <td><input type="text" class="form-control" /></td>
                                                </tr>
                                                <tr>
                                                    <td class="text-end fw-medium pt-2">Transfer Debits</td>
                                                    <td><input type="text" class="form-control" /></td>
                                                    <td><input type="text" class="form-control" /></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Right Actions Panel -->
            <aside class="cm-legacy-actions" aria-label="Actions">
                <div class="cm-legacy-actions__group">
                    <p class="cm-legacy-actions__title">Actions</p>
                    <button type="button" class="cm-shell__action">View</button>
                    <button type="button" class="cm-shell__action">Open</button>
                    <button type="button" class="cm-shell__action">Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="TellerMaintenance.js"></script>
</body>

</html>
