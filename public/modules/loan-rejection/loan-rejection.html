<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Rejection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <!-- Main Container -->
        <div class="main-container main-container--no-sidebar">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <form id="loanRejectionForm" novalidate>
                        <!-- Identification Section -->
                        <div class="form-section" data-section="identification">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-building"></i> Identification</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Identification" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Branch ID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="branchId" class="kairo-branch-control__id" value="0101" readonly>
                                            <input type="text" id="branchName" class="kairo-branch-control__name" value="Head Office" placeholder="Branch Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">WorkFlow Type ID</label>
                                        <input type="text" id="workflowTypeId" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Application ID <span class="text-danger">*</span></label>
                                        <div class="kairo-control" data-kairo-control>
                                            <input type="text" id="applicationId" class="kairo-control__id" placeholder="Application ID" required>
                                            <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search Application"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Application Date</label>
                                        <input type="text" id="applicationDate" class="bs-input-text" placeholder="dd mmm yyyy" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Application Details Section -->
                        <div class="form-section" data-section="application-details">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-file-earmark-text"></i> Application Details</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Application Details" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Client ID</label>
                                        <input type="text" id="clientId" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Loan Type</label>
                                        <input type="text" id="loanType" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Product ID</label>
                                        <input type="text" id="productId" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Term</label>
                                        <input type="text" id="term" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Currency ID</label>
                                        <input type="text" id="currencyId" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Application Status</label>
                                        <input type="text" id="applicationStatus" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Loan Amount</label>
                                        <input type="text" id="loanAmount" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Application Stage</label>
                                        <input type="text" id="applicationStage" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col">
                                        <div class="form-check">
                                            <input type="checkbox" id="reverseCharge" class="form-check-input">
                                            <label for="reverseCharge" class="form-check-label">Reverse Charge Collected</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Rejection Reason Section -->
                        <div class="form-section" data-section="rejection-reason">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-x-circle"></i> Rejection Reason</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Rejection Reason" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row">
                                    <div class="col">
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="reason1" class="form-check-input">
                                            <label for="reason1" class="form-check-label">Bad Credit Rating</label>
                                        </div>
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="reason2" class="form-check-input">
                                            <label for="reason2" class="form-check-label">Client Verification Failure</label>
                                        </div>
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="reason3" class="form-check-input">
                                            <label for="reason3" class="form-check-label">Client not agreed for the Loan</label>
                                        </div>
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="reason4" class="form-check-input">
                                            <label for="reason4" class="form-check-label">Incomplete Documentation</label>
                                        </div>
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="reason5" class="form-check-input">
                                            <label for="reason5" class="form-check-label">Insufficient Collateral</label>
                                        </div>
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="reason6" class="form-check-input">
                                            <label for="reason6" class="form-check-label">Other (Specify Below)</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col">
                                        <label class="label-blue">Description</label>
                                        <textarea id="otherReason" class="bs-textarea" rows="3" placeholder="Enter additional rejection details..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Behind The Scene Section -->
                        <div class="form-section" data-section="behind-the-scene">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-info-circle"></i> Behind The Scene</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Rejected By</label>
                                        <input type="text" id="rejectedBy" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Rejected On</label>
                                        <input type="text" id="rejectedOn" class="bs-input-text" placeholder="dd mmm yyyy" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Created By</label>
                                        <input type="text" id="createdBy" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Modified By</label>
                                        <input type="text" id="modifiedBy" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Created On</label>
                                        <input type="text" id="createdOn" class="bs-input-text" placeholder="dd mmm yyyy" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Modified On</label>
                                        <input type="text" id="modifiedOn" class="bs-input-text" placeholder="dd mmm yyyy" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Verified By</label>
                                        <input type="text" id="verifiedBy" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Verified On</label>
                                        <input type="text" id="verifiedOn" class="bs-input-text" placeholder="dd mmm yyyy" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" id="viewBtn">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action btn-action--danger" id="rejectBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Reject</span>
                    </button>
                    <button type="button" class="btn-action" id="cancelBtn">
                        <i class="bi bi-x-lg"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/common/form-init.js"></script>
    <script src="loan-rejection.js"></script>
</body>
</html>
