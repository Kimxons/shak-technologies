<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JV Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="jv-maintenance.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="jv-maintenance">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Transaction Details Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; margin-bottom: 12px; font-weight: 600; font-size: 0.8rem;">
            Transaction Details
          </div>

          <!-- Row 1: Transfer Type, Value Date, Branch ID, Serial ID -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Transfer Type</label>
              <select class="form-select" id="transferTypeSelect">
                <option value="">--Select--</option>
                <option value="local">Local</option>
                <option value="foreign">Foreign</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Value Date</label>
              <select class="form-select" id="valueDateSelect">
                <option value="">--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Branch ID</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="branchIdField" readonly style="background-color: #f9fafb; flex: 1;" />
                <button class="jvm-search-btn" id="branchIdSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Serial ID</label>
              <input type="text" class="form-control" id="serialIdField" />
            </div>
          </div>

          <!-- Row 2: Post Current, Transaction, Account ID, Narration -->
          <div style="margin-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
              <input type="checkbox" id="postCurrentCheckbox" />
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; margin: 0;">Post Current</label>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
              <div>
                <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Transaction</label>
                <select class="form-select" id="transactionSelect">
                  <option value="">--Select--</option>
                </select>
              </div>
              <div>
                <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Narration</label>
                <input type="text" class="form-control" id="narrationField" />
              </div>
            </div>

            <div style="margin-bottom: 12px;">
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Account ID</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="accountIdField" />
                <button class="jvm-search-btn" id="accountIdSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
          </div>

          <!-- Row 3: Reference No, JV Currency Type, Transaction Currency -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Reference No.</label>
              <input type="text" class="form-control" id="referenceNoField" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">JV Currency Type</label>
              <select class="form-select" id="jvCurrencyTypeSelect">
                <option value="">--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Transaction Currency</label>
              <input type="text" class="form-control" id="transactionCurrencyField" />
            </div>
          </div>

          <!-- Row 4: Transaction Amount, Local Amount, Exchange Rate, Foreign Amount -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Transaction Amount</label>
              <input type="text" class="form-control" id="transactionAmountField" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Local Amount</label>
              <input type="text" class="form-control" id="localAmountField" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Exchange Rate</label>
              <input type="text" class="form-control" id="exchangeRateField" />
            </div>
          </div>

          <!-- Row 5: Foreign Amount -->
          <div style="margin-bottom: 12px;">
            <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Foreign Amount</label>
            <input type="text" class="form-control" id="foreignAmountField" />
          </div>

          <!-- Action Buttons -->
          <div style="display: flex; gap: 6px;">
            <button class="jvm-action-btn jvm-secondary-btn" id="newBtn">New</button>
            <button class="jvm-action-btn jvm-secondary-btn" id="alterBtn">Alter</button>
            <button class="jvm-action-btn jvm-secondary-btn" id="removeBtn">Remove</button>
            <button class="jvm-action-btn jvm-secondary-btn" id="updateBtn">Update</button>
            <button class="jvm-action-btn jvm-secondary-btn" id="clearBtn">Clear</button>
          </div>
        </div>

        <!-- Transaction Table Section -->
        <div style="padding: 12px; flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid #e5e7eb;">
          <div style="flex: 1; overflow: auto; border: 1px solid #d1d5db; border-radius: 0.375rem;">
            <table class="table" style="margin-bottom: 0;">
              <thead>
                <tr>
                  <th>Serial ID</th>
                  <th>Account ID</th>
                  <th>TrxCurrencyID</th>
                  <th>Trx Date</th>
                  <th>Transaction Amount</th>
                  <th>Amount</th>
                  <th>Local Amount</th>
                  <th>Description</th>
                  <th>Reference ID</th>
                  <th>Exchange Rate</th>
                  <th>Mean Rate</th>
                </tr>
              </thead>
              <tbody id="transactionTableBody">
                <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                  <td colspan="11" style="padding: 20px;">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Summary Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Total Debit</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="totalDebitField" readonly style="background-color: #f9fafb; flex: 1;" />
                <input type="text" class="form-control" id="totalDebitCurrencyField" readonly style="background-color: #f9fafb; width: 50px;" value="ETB" />
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Un-Posted</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="unPostedField" readonly style="background-color: #f9fafb; flex: 1;" />
                <input type="text" class="form-control" id="unPostedCurrencyField" readonly style="background-color: #f9fafb; width: 50px;" value="ETB" />
              </div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Total Credit</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="totalCreditField" readonly style="background-color: #f9fafb; flex: 1;" />
                <input type="text" class="form-control" id="totalCreditCurrencyField" readonly style="background-color: #f9fafb; width: 50px;" value="ETB" />
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Working Date</label>
              <input type="text" class="form-control" id="workingDateField" readonly style="background-color: #f9fafb;" />
            </div>
          </div>

          <div style="margin-top: 12px;">
            <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Account Currency ID</label>
            <input type="text" class="form-control" id="accountCurrencyIdField" readonly style="background-color: #f9fafb;" />
          </div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 12px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; font-weight: 600; font-size: 0.8rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="jvm-action-btn" id="viewAllBtn">View All</button>
      <button class="jvm-action-btn" id="printBtn">Print</button>
      <button class="jvm-action-btn" id="superviseBtn">Supervise</button>
      <button class="jvm-action-btn" id="rejectBtn">Reject</button>
      <button class="jvm-action-btn" id="localBranchBtn">Local Branch</button>
      <button class="jvm-action-btn" id="viewBtn">View</button>
      <button class="jvm-action-btn" id="addBtn">Add</button>
      <button class="jvm-action-btn" id="editBtn">Edit</button>
      <button class="jvm-action-btn" id="deleteBtn">Delete</button>
      <button class="jvm-action-btn" id="saveBtn">Save</button>
      <button class="jvm-action-btn" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script src="jv-maintenance.js"></script>
</body>
</html>
