<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL Maintenance · General Ledger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance copilot-theme" data-page="gl-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="gl-form" class="cm-shell-form" autocomplete="off" novalidate>
      
      <section class="cm-legacy-content">
        <!-- Query Section -->
        <section class="card-surface">
          <header class="cm-step__header">
            <h3 class="section-title mb-0">GL Account Details</h3>
          </header>

          <div class="cbs-grid cbs-grid--two cbs-grid--tight">
            <!-- GL Account ID -->
            <div class="cbs-field">
              <label class="cbs-label required" for="glAccountIdField">GL Account ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="glAccountIdField" required />
                <button class="btn btn-outline-primary" type="button" id="glAccountIdSearchBtn" aria-label="Search GL Account">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <!-- Description -->
            <div class="cbs-field">
              <label class="cbs-label required" for="descriptionField">Description</label>
              <input type="text" class="form-control" id="descriptionField" required />
            </div>

            <!-- Short Name -->
            <div class="cbs-field">
              <label class="cbs-label" for="shortNameField">Short Name</label>
              <input type="text" class="form-control" id="shortNameField" />
            </div>

            <!-- Currency ID -->
            <div class="cbs-field">
              <label class="cbs-label required" for="currencyIdField">Currency ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="currencyIdField" required />
                <button class="btn btn-outline-primary" type="button" id="currencyIdSearchBtn" aria-label="Search Currency">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <!-- Main Account ID -->
            <div class="cbs-field">
              <label class="cbs-label" for="mainAccountIdField">Main Account ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="mainAccountIdField" />
                <button class="btn btn-outline-primary" type="button" id="mainAccountIdSearchBtn" aria-label="Search Main Account">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <!-- Contra Account ID -->
            <div class="cbs-field">
              <label class="cbs-label" for="contraAccountIdField">Contra Account ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="contraAccountIdField" />
                <button class="btn btn-outline-primary" type="button" id="contraAccountIdSearchBtn" aria-label="Search Contra Account">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>

            <!-- GL Type -->
            <div class="cbs-field">
              <label class="cbs-label required" for="glTypeSelect">GL Type</label>
              <select class="form-select" id="glTypeSelect" required>
                <option value="">--Select--</option>
              </select>
            </div>

            <!-- GL Sub Type Group -->
            <div class="cbs-field">
              <label class="cbs-label required" for="glSubTypeGroupSelect">GL Sub Type Group</label>
              <select class="form-select" id="glSubTypeGroupSelect" required>
                <option value="">--Select--</option>
              </select>
            </div>

            <!-- GL Sub Type -->
            <div class="cbs-field">
              <label class="cbs-label required" for="glSubTypeSelect">GL Sub Type</label>
              <select class="form-select" id="glSubTypeSelect" required>
                <option value="">--Select--</option>
              </select>
            </div>

            <!-- GL Category -->
            <div class="cbs-field">
              <label class="cbs-label required" for="glCategorySelect">GL Category</label>
              <select class="form-select" id="glCategorySelect" required>
                <option value="">--Select--</option>
              </select>
            </div>

            <!-- Posting Type -->
            <div class="cbs-field">
              <label class="cbs-label" for="postingTypeSelect">Posting Type</label>
              <select class="form-select" id="postingTypeSelect">
                <option value="">--Select--</option>
              </select>
            </div>

            <!-- GL Class -->
            <div class="cbs-field">
              <label class="cbs-label" for="glClassSelect">GL Class</label>
              <select class="form-select" id="glClassSelect">
                <option value="">--Select--</option>
              </select>
            </div>

            <!-- Do Revaluation -->
            <div class="cbs-field cbs-inline">
              <label class="cbs-label" for="doRevaluationCheckbox">Do Revaluation</label>
              <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" role="switch" id="doRevaluationCheckbox" />
              </div>
            </div>

            <!-- Remarks (full width) -->
            <div class="cbs-field" style="grid-column: 1 / -1;">
              <label class="cbs-label" for="remarksField">Remarks</label>
              <textarea class="form-control" id="remarksField" rows="3"></textarea>
            </div>
          </div>
        </section>

        <!-- Behind The Scene Section -->
        <section class="card-surface mt-3">
          <header class="cm-step__header">
            <h3 class="section-title mb-0">Behind The Scene</h3>
          </header>

          <div class="cbs-grid cbs-grid--three cbs-grid--tight">
            <!-- Row 1: Closed By, Closed On, Closed Reason -->
            <div class="cbs-field">
              <label class="cbs-label" for="closedByField">Closed By</label>
              <input type="text" class="form-control" id="closedByField" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="closedOnField">Closed On</label>
              <input type="text" class="form-control" id="closedOnField" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="closedReasonField">Closed Reason</label>
              <input type="text" class="form-control" id="closedReasonField" readonly />
            </div>

            <!-- Row 2: Created By, Modified By, Supervised By -->
            <div class="cbs-field">
              <label class="cbs-label" for="createdByField">Created By</label>
              <input type="text" class="form-control" id="createdByField" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="modifiedByField">Modified By</label>
              <input type="text" class="form-control" id="modifiedByField" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="supervisedByField">Supervised By</label>
              <input type="text" class="form-control" id="supervisedByField" readonly />
            </div>

            <!-- Row 3: Created On, Modified On, Supervised On -->
            <div class="cbs-field">
              <label class="cbs-label" for="createdOnField">Created On</label>
              <input type="text" class="form-control" id="createdOnField" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="modifiedOnField">Modified On</label>
              <input type="text" class="form-control" id="modifiedOnField" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="supervisedOnField">Supervised On</label>
              <input type="text" class="form-control" id="supervisedOnField" readonly />
            </div>
          </div>
        </section>
      </section>

      <!-- Action Panel (Right Side) -->
      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Mode switch</p>
          <button type="button" class="cm-shell__action" id="viewBtn">View</button>
          <button type="button" class="cm-shell__action" id="addBtn">Add</button>
          <button type="button" class="cm-shell__action" id="editBtn" disabled>Edit</button>
          <button type="button" class="cm-shell__action" id="deleteBtn" disabled>Delete</button>
        </div>

        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Workflow</p>
          <button type="button" class="cm-shell__action cm-shell__action--success" id="saveBtn" disabled>
            Save
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" id="cancelBtn" disabled>
            Cancel
          </button>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action cm-shell__action--secondary" id="closeBtn">
            Close
          </button>
        </div>
      </aside>
    </form>
  </div>

  <!-- General Ledger Search Modal -->
  <div class="modal fade" id="glSearchModal" tabindex="-1" aria-labelledby="glSearchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="glSearchModalLabel">General Ledger</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="glSearchForm" class="mb-2" onsubmit="return false;">
            <div class="row g-2 align-items-end">
              <div class="col-md-5">
                <label for="glSearchAccountId" class="form-label mb-0">Account ID</label>
                <div class="input-group input-group-sm">
                  <select id="glSearchAccountIdType" class="form-select" style="max-width: 90px;">
                    <option value="Like">Like</option>
                    <option value="Equals">Equals</option>
                  </select>
                  <input id="glSearchAccountId" type="text" class="form-control" placeholder="e.g. 1011" />
                </div>
              </div>
              <div class="col-md-5">
                <label for="glSearchDesc" class="form-label mb-0">Description</label>
                <div class="input-group input-group-sm">
                  <select id="glSearchDescType" class="form-select" style="max-width: 90px;">
                    <option value="Like">Like</option>
                    <option value="Equals">Equals</option>
                  </select>
                  <input id="glSearchDesc" type="text" class="form-control" placeholder="e.g. Cash" />
                </div>
              </div>
              <div class="col-md-2">
                <button type="button" class="btn btn-primary btn-sm w-100" id="glSearchBtn">Search</button>
              </div>
            </div>
          </form>
          <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
            <table class="table table-sm table-bordered table-hover mb-0" id="glSearchTable">
              <colgroup>
                <col style="width: 140px;" />
                <col />
              </colgroup>
              <thead class="table-light" style="position: sticky; top: 0; z-index: 1;">
                <tr>
                  <th class="text-nowrap">Account ID</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>
                <!-- Results will be populated here -->
              </tbody>
            </table>
          </div>
          <style>
            #glSearchTable {
              table-layout: fixed;
            }
            #glSearchTable th, #glSearchTable td {
              vertical-align: middle;
            }
            #glSearchTable th:nth-child(1),
            #glSearchTable td:nth-child(1) {
              white-space: nowrap;
            }
            #glSearchTable td:nth-child(2) {
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            }
            #glSearchTable tbody tr {
              cursor: pointer !important;
            }
            #glSearchTable tbody tr:hover {
              background-color: #e3f2fd !important;
            }
            #glSearchTable tbody tr.table-active {
              background-color: #2196F3 !important;
              color: white !important;
            }
          </style>
        </div>
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="glSearchPrevBtn"><i class="bi bi-arrow-left"></i></button>
          <button type="button" class="btn btn-primary btn-sm" id="glSearchOkBtn">OK</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="glSearchNextBtn"><i class="bi bi-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/generalLedger/gl-maintenance.js?v=20260129-2"></script>
</body>
</html>
