<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="gl-maintenance.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="gl-maintenance">
  <div style="display: grid; grid-template-columns: 1fr 110px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div class="form-grid" style="border-bottom: 1px solid #e5e7eb; padding-bottom: 12px;">
          <!-- Row 1 Col 1: GL Account ID -->
          <div class="form-row">
            <label class="label-blue">GL Account ID</label>
            <div class="input-group">
              <input type="text" id="glAccountIdField" style="flex: 1;" />
              <button class="btn-lookup" id="glAccountIdSearchBtn"><i class="bi bi-search"></i></button>
            </div>
          </div>

          <!-- Row 1 Col 2: Description -->
          <div class="form-row">
            <label class="label-blue">Description</label>
            <input type="text" id="descriptionField" />
          </div>

          <!-- Row 2 Col 1: Short Name -->
          <div class="form-row">
            <label>Short Name</label>
            <input type="text" id="shortNameField" />
          </div>

          <!-- Row 2 Col 2: Currency ID -->
          <div class="form-row">
            <label class="label-blue">Currency ID</label>
            <div style="display: flex; gap: 0; align-items: center; border: 1px solid #d8dde3; border-radius: 4px; height: 28px; background: #fefefe;">
              <input type="text" id="currencyIdField" style="width: 70px; height: 26px !important; border: none !important; border-radius: 0 !important; padding: 3px 8px !important; background: transparent !important;" />
              <div style="width: 1px; height: 20px; background: #d8dde3; flex-shrink: 0;"></div>
              <input type="text" id="currencyDescField" readonly style="flex: 1; min-width: 150px; height: 26px !important; border: none !important; border-radius: 0 !important; padding: 3px 8px !important; background: transparent !important; color: #6b7280 !important;" />
              <button class="btn-lookup" id="currencyIdSearchBtn" onclick="window.openCurrencySearch()" style="margin-left: 8px;"><i class="bi bi-search"></i></button>
            </div>
          </div>

          <!-- Row 3 Col 1: Main Account ID -->
          <div class="form-row">
            <label>Main Account ID</label>
            <div class="input-group">
              <input type="text" id="mainAccountIdField" style="flex: 1;" />
              <button class="btn-lookup" id="mainAccountIdSearchBtn"><i class="bi bi-search"></i></button>
            </div>
          </div>

          <!-- Row 3 Col 2: GL Type -->
          <div class="form-row">
            <label class="label-blue">GL Type</label>
            <select id="glTypeSelect">
              <option value="" selected>--Select--</option>
            </select>
          </div>

          <!-- Row 4 Col 1: GL Sub Type Group -->
          <div class="form-row">
            <label class="label-blue">GL Sub Type Group</label>
            <select id="glSubTypeGroupSelect">
              <option selected>--Select--</option>
            </select>
          </div>

          <!-- Row 4 Col 2: GL Sub Type -->
          <div class="form-row">
            <label class="label-blue">GL Sub Type</label>
            <select id="glSubTypeSelect">
              <option value="">--Select--</option>
            </select>
          </div>

          <!-- Row 5 Col 1: GL Category -->
          <div class="form-row">
            <label class="label-blue">GL Category</label>
            <select id="glCategorySelect">
              <option value="">--Select--</option>
            </select>
          </div>

          <!-- Row 5 Col 2: Posting Type -->
          <div class="form-row">
            <label>Posting Type</label>
            <select id="postingTypeSelect">
              <option value="">--Select--</option>
            </select>
          </div>

          <!-- Row 6 Col 1: GL Class -->
          <div class="form-row">
            <label>GL Class</label>
            <select id="glClassSelect">
              <option value="">--Select--</option>
            </select>
          </div>

          <!-- Row 6 Col 2: Contra Account ID -->
          <div class="form-row">
            <label>Contra Account ID</label>
            <div class="input-group">
              <input type="text" id="contraAccountIdField" style="flex: 1;" />
              <button class="btn-lookup" id="contraAccountIdSearchBtn"><i class="bi bi-search"></i></button>
            </div>
          </div>

          <!-- Row 7 Col 1: Do Revaluation -->
          <div class="form-row">
            <label>Do Revaluation</label>
            <input type="checkbox" class="checkbox" id="doRevaluationCheckbox" />
          </div>

          <!-- Row 7 Col 2: Remarks -->
          <div class="form-row">
            <label>Remarks</label>
            <textarea id="remarksField" rows="3" style="resize: vertical;"></textarea>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <header class="cm-step__header" style="background: #517a8e; color: white; padding: 12px 16px; margin: 0 -12px 16px -12px; display: flex; align-items: center; justify-content: space-between;">
          <h3 class="mb-0" style="font-size: 0.875rem; font-weight: 600; background: none; border: none; box-shadow: none; padding: 0; margin: 0; text-transform: none; letter-spacing: normal;">Behind The Scene</h3>
          <button type="button" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 18px;" 
                  onclick="document.getElementById('behindTheSceneContent').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up');">
            <i class="bi bi-chevron-up"></i>
          </button>
        </header>

        <div id="behindTheSceneContent">
          <!-- Behind The Scene Fields - 4 columns -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px 20px; padding: 0 12px 16px 12px;">
            <div class="form-row">
              <label>Created By</label>
              <input type="text" class="bs-input-text" id="createdByField" readonly />
            </div>
            <div class="form-row">
              <label>Modified By</label>
              <input type="text" class="bs-input-text" id="modifiedByField" readonly />
            </div>
            <div class="form-row">
              <label>Supervised By</label>
              <input type="text" class="bs-input-text" id="supervisedByField" readonly />
            </div>
            <div class="form-row">
              <label>Closed By</label>
              <input type="text" class="bs-input-text" id="closedByField" readonly />
            </div>
            <div class="form-row">
              <label>Created On</label>
              <input type="text" class="bs-input-text" id="createdOnField" readonly />
            </div>
            <div class="form-row">
              <label>Modified On</label>
              <input type="text" class="bs-input-text" id="modifiedOnField" readonly />
            </div>
            <div class="form-row">
              <label>Supervised On</label>
              <input type="text" class="bs-input-text" id="supervisedOnField" readonly />
            </div>
            <div class="form-row">
              <label>Closed On</label>
              <input type="text" class="bs-input-text" id="closedOnField" readonly />
            </div>
            <div class="form-row" style="grid-column: 1 / -1;">
              <label>Closed Reason</label>
              <input type="text" class="input-full" id="closedReasonField" readonly />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div class="action-panel">
      <div class="action-buttons">
        <button class="btn-action underline" id="viewBtn"><i class="bi bi-eye me-1"></i>View</button>
        <button class="btn-action underline" id="addBtn"><i class="bi bi-plus-circle me-1"></i>Add</button>
        <button class="btn-action" id="editBtn"><i class="bi bi-pencil-square me-1"></i>Edit</button>
        <button class="btn-action" id="saveBtn"><i class="bi bi-save2 me-1"></i>Save</button>
        <button class="btn-action" id="deleteBtn"><i class="bi bi-trash3 me-1"></i>Delete</button>
        <button class="btn-action" id="cancelBtn"><i class="bi bi-x-circle me-1"></i>Cancel</button>
        <button class="btn-action" id="closeBtn"><i class="bi bi-x-lg me-1"></i>Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Include in Branches Confirmation Modal -->
<div class="modal fade" id="branchInclusionModal" tabindex="-1" aria-labelledby="branchInclusionModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="branchInclusionModalLabel">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-3">Do you wish to Include the Account in the Branches Also? [No:<span id="branchAccountNo"></span>]</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-primary btn-sm px-4" id="branchInclusionYesBtn">Yes</button>
        <button type="button" class="btn btn-secondary btn-sm px-4" id="branchInclusionNoBtn">No</button>
      </div>
    </div>
  </div>
</div>

<!-- General Ledger Search Modal -->
<div class="modal fade" id="glSearchModal" tabindex="-1" aria-labelledby="glSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background: #517a8e; color: white;">
        <h5 class="modal-title" id="glSearchModalLabel">General Ledger</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="glSearchForm" class="mb-2" onsubmit="return false;">
          <div class="row g-2 align-items-end">
            <div class="col-md-5">
              <label for="glSearchAccountId" class="form-label mb-0">Account ID</label>
              <div class="input-group input-group-sm">
                <select id="glSearchAccountIdType" class="form-select" style="max-width: 90px;">
                  <option value="Like">Like</option>
                  <option value="Equals">Equals</option>
                </select>
                <input id="glSearchAccountId" type="text" class="form-control" placeholder="e.g. 1011" />
              </div>
            </div>
            <div class="col-md-5">
              <label for="glSearchDesc" class="form-label mb-0">Description</label>
              <div class="input-group input-group-sm">
                <select id="glSearchDescType" class="form-select" style="max-width: 90px;">
                  <option value="Like">Like</option>
                  <option value="Equals">Equals</option>
                </select>
                <input id="glSearchDesc" type="text" class="form-control" placeholder="e.g. Cash" />
              </div>
            </div>
            <div class="col-md-2">
              <button type="button" class="btn btn-primary btn-sm w-100" id="glSearchBtn">Search</button>
            </div>
          </div>
        </form>
        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
          <table class="table table-sm table-bordered table-hover mb-0" id="glSearchTable">
            <colgroup>
              <col style="width: 140px;" />
              <col />
            </colgroup>
            <thead class="table-light" style="position: sticky; top: 0; z-index: 1;">
              <tr>
                <th class="text-nowrap">Account ID</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              <!-- Results will be populated here -->
            </tbody>
          </table>
        </div>
        <style>
          #glSearchTable {
            table-layout: fixed;
          }
          #glSearchTable th, #glSearchTable td {
            vertical-align: middle;
          }
          #glSearchTable th:nth-child(1),
          #glSearchTable td:nth-child(1) {
            white-space: nowrap;
          }
          #glSearchTable td:nth-child(2) {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          #glSearchTable tbody tr {
            cursor: pointer !important;
          }
          #glSearchTable tbody tr:hover {
            background-color: #e3f2fd !important;
          }
          #glSearchTable tbody tr.table-active {
            background-color: #2196F3 !important;
            color: white !important;
          }
        </style>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="glSearchPrevBtn"><i class="bi bi-arrow-left"></i></button>
        <button type="button" class="btn btn-primary btn-sm" id="glSearchOkBtn">OK</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="glSearchNextBtn"><i class="bi bi-arrow-right"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- Currency Search Modal -->
<div class="modal fade" id="currencySearchModal" tabindex="-1" aria-labelledby="currencySearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background: #517a8e; color: white;">
        <h5 class="modal-title" id="currencySearchModalLabel">Currency</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="currencySearchForm" class="mb-2" onsubmit="return false;">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="currencySearchId" class="form-label mb-0">Currency ID</label>
              <select id="currencySearchIdType" class="form-select form-select-sm w-auto d-inline-block" style="width: 80px;">
                <option value="Like">Like</option>
                <option value="Equals">Equals</option>
              </select>
              <input id="currencySearchId" type="text" class="form-control form-control-sm d-inline-block" style="width: 150px;" />

            <div class="col-md-4">
              <label for="currencySearchDesc" class="form-label mb-0">Description</label>
              <select id="currencySearchDescType" class="form-select form-select-sm w-auto d-inline-block" style="width: 80px;">
                <option value="Like">Like</option>
                <option value="Equals">Equals</option>
              </select>
              <input id="currencySearchDesc" type="text" class="form-control form-control-sm d-inline-block" style="width: 150px;" />
            </div>
            <div class="col-md-2">
              <button type="button" class="btn btn-primary btn-sm w-100" id="currencySearchBtn">Search</button>
            </div>
          </div>
        </form>
        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
          <table class="table table-sm table-bordered table-hover mb-0" id="currencySearchTable">
            <thead class="table-light" style="position: sticky; top: 0; z-index: 1;">
              <tr>
                <th>CurrencyID</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              <!-- Results will be populated here -->

          </table>
        </div>
        <style>
          #currencySearchTable tbody tr {
            cursor: pointer !important;
          }
          #currencySearchTable tbody tr:hover {
            background-color: #e3f2fd !important;
          }
          #currencySearchTable tbody tr.table-active {
            background-color: #2196F3 !important;
            color: white !important;
          }
        </style>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="currencySearchPrevBtn"><i class="bi bi-arrow-left"></i></button>
        <button type="button" class="btn btn-primary btn-sm" id="currencySearchOkBtn">OK</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="currencySearchNextBtn"><i class="bi bi-arrow-right"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Simple test function -->
<script>
  console.log('🔴 Inline script loaded');
  
  window.openGLSearch = function() {
    console.log('🔴 openGLSearch called from onclick');
    
    const modal = document.getElementById('glSearchModal');
    if (!modal) {
      alert('Modal element not found!');
      return;
    }
    
    if (typeof bootstrap === 'undefined') {
      alert('Bootstrap not loaded!');
      return;
    }
    
    const bsModal = new bootstrap.Modal(modal);
    bsModal.show();
    
    // Load sample data
    setTimeout(() => {
      const tbody = document.querySelector('#glSearchTable tbody');
      if (tbody) {
        tbody.innerHTML = `
          <tr style="cursor: pointer;">
            <td>10110000</td>
            <td>IFB Cash In Vaulies</td>
            <td>A</td>
          </tr>
          <tr style="cursor: pointer;">
            <td>10110001</td>
            <td>IFB Cash In Till once</td>
            <td>A</td>
          </tr>
          <tr style="cursor: pointer;">
            <td>10110002</td>
            <td>IFB Cash In Till - Twobyt</td>
            <td>A</td>
          </tr>
          <tr style="cursor: pointer;">
            <td>10110003</td>
            <td>IFB Cash In Till-Three</td>
            <td>A</td>
          </tr>
          <tr style="cursor: pointer;">
            <td>10110004</td>
            <td>IFB Cash In Till-Four</td>
            <td>A</td>
          </tr>
        `;
        
        // Add click handlers to highlight selected row
        tbody.querySelectorAll('tr').forEach(tr => {
          // Single click - highlight
          tr.addEventListener('click', function() {
            tbody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
            this.classList.add('table-active');
          });
          
          // Double click - select and close
          tr.addEventListener('dblclick', function() {
            const accountId = this.children[0].textContent;
            const description = this.children[1].textContent;
            
            // Populate the main form
            document.getElementById('glAccountIdField').value = accountId;
            document.getElementById('descriptionField').value = description;
            
            // Close the modal
            bootstrap.Modal.getInstance(modal).hide();
          });
        });
      }
      
      // Wire up OK button to populate main form
      const okBtn = document.getElementById('glSearchOkBtn');
      if (okBtn) {
        okBtn.onclick = function() {
          const selectedRow = tbody.querySelector('tr.table-active');
          if (selectedRow) {
            const accountId = selectedRow.children[0].textContent;
            const description = selectedRow.children[1].textContent;
            
            // Populate the main form
            document.getElementById('glAccountIdField').value = accountId;
            document.getElementById('descriptionField').value = description;
            
            // Close the modal
            bootstrap.Modal.getInstance(modal).hide();
          } else {
            alert('Please select a record first');
          }
        };
      }
    }, 100);
  };
  
  // Currency Search Function
  window.openCurrencySearch = function() {
    console.log('🔴 openCurrencySearch called');
    
    const modal = document.getElementById('currencySearchModal');
    if (!modal) {
      alert('Currency modal element not found!');
      return;
    }
    
    if (typeof bootstrap === 'undefined') {
      alert('Bootstrap not loaded!');
      return;
    }
    
    const bsModal = new bootstrap.Modal(modal);
    bsModal.show();
    
    // Load currency data
    setTimeout(() => {
      const tbody = document.querySelector('#currencySearchTable tbody');
      if (tbody) {
        const currencies = [
          { CurrencyID: "AED", Description: "UAE DIRHAM" },
          { CurrencyID: "AUD", Description: "AUSTRALIAN DOLLAR" },
          { CurrencyID: "CAD", Description: "CANADIAN DOLLAR" },
          { CurrencyID: "CHF", Description: "SWISS FRANC" },
          { CurrencyID: "CNY", Description: "CHINESE YUAN" },
          { CurrencyID: "DJF", Description: "DJIBOUTI FRANC" },
          { CurrencyID: "DKK", Description: "DANISH KRONER" },
          { CurrencyID: "ETB", Description: "BIRR" },
          { CurrencyID: "EUR", Description: "EURO" },
          { CurrencyID: "GBP", Description: "POUND STERLING" },
          { CurrencyID: "INR", Description: "INDIAN RUPEE" },
          { CurrencyID: "JPY", Description: "JAPANESE YEN" },
          { CurrencyID: "KES", Description: "KENYA SHILLING" },
          { CurrencyID: "KWD", Description: "KUWAITI DINAR" },
          { CurrencyID: "NOK", Description: "NORWIGIAN KRONER" },
          { CurrencyID: "SAR", Description: "SAUDI RIYAL" },
          { CurrencyID: "SDR", Description: "SDR" },
          { CurrencyID: "SEK", Description: "SWDISH KRONER" },
          { CurrencyID: "USD", Description: "USD DOLLAR" },
          { CurrencyID: "ZAR", Description: "SOUTH AFRICA RAND" }
        ];
        
        tbody.innerHTML = '';
        currencies.forEach(currency => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${currency.CurrencyID}</td>
            <td>${currency.Description}</td>
          `;
          tr.style.cursor = 'pointer';
          
          // Single click - highlight
          tr.addEventListener('click', function() {
            tbody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
            this.classList.add('table-active');
          });
          
          // Double click - select and close
          tr.addEventListener('dblclick', function() {
            const currencyId = this.children[0].textContent;
            const currencyDesc = this.children[1].textContent;
            document.getElementById('currencyIdField').value = currencyId;
            document.getElementById('currencyDescField').value = currencyDesc;
            bootstrap.Modal.getInstance(modal).hide();
          });
          
          tbody.appendChild(tr);
        });
      }
      
      // Wire up OK button
      const okBtn = document.getElementById('currencySearchOkBtn');
      if (okBtn) {
        okBtn.onclick = function() {
          const selectedRow = tbody.querySelector('tr.table-active');
          if (selectedRow) {
            const currencyId = selectedRow.children[0].textContent;
            const currencyDesc = selectedRow.children[1].textContent;
            document.getElementById('currencyIdField').value = currencyId;
            document.getElementById('currencyDescField').value = currencyDesc;
            bootstrap.Modal.getInstance(modal).hide();
          } else {
            alert('Please select a currency first');
          }
        };
      }
      
      // Search button functionality
      const searchBtn = document.getElementById('currencySearchBtn');
      if (searchBtn) {
        searchBtn.onclick = function() {
          const searchId = document.getElementById('currencySearchId').value.toLowerCase();
          const searchDesc = document.getElementById('currencySearchDesc').value.toLowerCase();
          
          tbody.querySelectorAll('tr').forEach(tr => {
            const currencyId = tr.children[0].textContent.toLowerCase();
            const description = tr.children[1].textContent.toLowerCase();
            
            const matchId = !searchId || currencyId.includes(searchId);
            const matchDesc = !searchDesc || description.includes(searchDesc);
            
            if (matchId && matchDesc) {
              tr.style.display = '';
            } else {
              tr.style.display = 'none';
            }
          });
        };
      }
    }, 100);
  };
  
  // Main Account ID Search Function
  window.openMainAccountSearch = function() {
    // Remove existing modal if any
    const existingModal = document.getElementById('mainAccountSearchModal');
    if (existingModal) {
      existingModal.remove();
    }
    
    // Create modal overlay
    const overlay = document.createElement('div');
    overlay.id = 'mainAccountSearchModal';
    overlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 10000;';
    
    // Create modal content
    const content = document.createElement('div');
    content.style.cssText = 'background: white; border-radius: 8px; width: 600px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 4px 24px rgba(0,0,0,0.15);';
    
    // Modal header with #517a8e color and controls
    const header = document.createElement('div');
    header.style.cssText = 'background: #517a8e; color: white; padding: 12px 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: space-between; cursor: move;';
    header.innerHTML = `

    select.innerHTML = '<option value="">--Select--</option>';

    let filteredData = window.glSubTypeGroupFullData || [];
    if (glType) {
      filteredData = filteredData.filter(item => item.GLType === glType);

    // Sort by display order
    filteredData.sort((a, b) => a.DisplayOrder - b.DisplayOrder);

    filteredData.forEach(item => {
      const option = document.createElement('option');
      option.value = item.SubCodeID;
      option.textContent = item.CodeDescription;
      select.appendChild(option);
    });
