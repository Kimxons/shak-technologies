<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forex Deal - Back Office · Treasury</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201" />
</head>

<body class="forex-deal-back-office" data-page="client-maintenance">
  <div class="window">
    <div class="main-container">
      <!-- Sidebar -->
      <div class="sidebar" id="main-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-currency-exchange"></i>FOREX DEAL BO</span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="sidebar-content">
          <div class="nav-section nav-section--card is-open" data-nav-section data-section-name="View">
            <div class="nav-header nav-header--card" data-tooltip="View">
              <div class="nav-header__content">
                <i class="bi bi-eye-fill nav-header__icon"></i>
                <span class="nav-label--card">View</span>
              </div>
              <div class="nav-header__badge">
                <button type="button" class="nav-arrow--card" aria-label="Toggle View" aria-expanded="true"
                  aria-controls="fxbo-nav-view">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items nav-items--card" id="fxbo-nav-view">
              <div class="sidebar-item sidebar-item--enhanced" data-tooltip="View">
                <i class="bi bi-eye-fill sidebar-item__icon"></i>
                <div class="sidebar-item__content">
                  <span class="sidebar-item__title">View</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content">
        <form id="fx-back-office-form" autocomplete="off" novalidate>
          <div class="form-card" data-main-form>
            <!-- Deal Details -->
            <div class="form-section" data-section="deal-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Deal Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Deal Details" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="DealNo">DealNo#</label>
                    <div class="kairo-control" data-kairo-deal-control>
                      <input type="text" class="kairo-control__id" id="DealNo" name="DealNo" />
                      <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search deal">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="TrxMode">Trx Mode</label>
                    <select class="bs-select" id="TrxMode" name="TrxMode">
                      <option value="">Transfer</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="BranchId">Branch ID</label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" class="kairo-branch-control__id" id="BranchId" name="BranchId" />
                      <input type="text" class="kairo-branch-control__name" id="BranchName" name="BranchName" readonly />
                      <button type="button" class="btn-lookup kairo-branch-control__lookup" aria-label="Search branch">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ClientId">Client ID</label>
                    <div class="kairo-client-control" data-kairo-client-control>
                      <input type="text" class="kairo-client-control__id" id="ClientId" name="ClientId" />
                      <button type="button" class="btn-lookup kairo-client-control__lookup" aria-label="Search client">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="form-row three-col">
                  <div class="col">
                    <label class="label-blue" for="BuySell">Buy/Sell</label>
                    <select class="bs-select" id="BuySell" name="BuySell">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ValueDate">Value Date</label>
                    <input type="text" class="bs-input-text" id="ValueDate" name="ValueDate" data-date-picker
                      placeholder="dd/mmm/yyyy" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="DealType">Deal Type</label>
                    <select class="bs-select" id="DealType" name="DealType">
                      <option value="">Spot</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="BaseCurrencyId">Base CurrencyID</label>
                    <input type="text" class="bs-input-text" id="BaseCurrencyId" name="BaseCurrencyId" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="CounterCurrencyId">Counter CurrencyID</label>
                    <input type="text" class="bs-input-text" id="CounterCurrencyId" name="CounterCurrencyId" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="BaseAmount">Base Amount</label>
                    <input type="text" class="bs-input-text" id="BaseAmount" name="BaseAmount" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="CounterAmount">Counter Amount</label>
                    <input type="text" class="bs-input-text" id="CounterAmount" name="CounterAmount" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="ExchangeRate">Exchange Rate</label>
                    <input type="text" class="bs-input-text" id="ExchangeRate" name="ExchangeRate" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ProfitLoss">Profit/Loss</label>
                    <input type="text" class="bs-input-text" id="ProfitLoss" name="ProfitLoss" />
                  </div>
                </div>
              </div>
            </div>

            <!-- Transaction Details -->
            <div class="form-section" data-section="transaction-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-receipt"></i>Transaction Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Transaction Details"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="CreditBranchId">Credit Branch ID</label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" class="kairo-branch-control__id" id="CreditBranchId" name="CreditBranchId" />
                      <input type="text" class="kairo-branch-control__name" id="CreditBranchName" name="CreditBranchName"
                        readonly />
                      <button type="button" class="btn-lookup kairo-branch-control__lookup"
                        aria-label="Search credit branch">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="CreditAccountType">Credit Account Type</label>
                    <select class="bs-select" id="CreditAccountType" name="CreditAccountType">
                      <option value="">Customer</option>
                    </select>
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="CreditAccountId">Credit Account ID</label>
                  <div class="kairo-control" data-kairo-account-control>
                    <input type="text" class="kairo-control__id" id="CreditAccountId" name="CreditAccountId" />
                    <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search credit account">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="DebitBranchId">Debit Branch ID</label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" class="kairo-branch-control__id" id="DebitBranchId" name="DebitBranchId" />
                      <input type="text" class="kairo-branch-control__name" id="DebitBranchName" name="DebitBranchName"
                        readonly />
                      <button type="button" class="btn-lookup kairo-branch-control__lookup"
                        aria-label="Search debit branch">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="DebitAccountType">Debit Account Type</label>
                    <select class="bs-select" id="DebitAccountType" name="DebitAccountType">
                      <option value="">Customer</option>
                    </select>
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="DebitAccountId">Debit Account ID</label>
                  <div class="kairo-control" data-kairo-account-control>
                    <input type="text" class="kairo-control__id" id="DebitAccountId" name="DebitAccountId" />
                    <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search debit account">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Unsupervised Deals -->
            <div class="form-section" data-section="unsupervised-deals">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-journal-check"></i>Unsupervised Deals</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Unsupervised Deals"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="table-responsive">
                  <table class="table table-sm table-hover mb-0">
                    <thead>
                      <tr>
                        <th style="width:32px"><input class="form-check-input" type="checkbox" aria-label="Select all" />
                        </th>
                        <th>Deal Number</th>
                        <th>Credit Branch ID</th>
                        <th>Credit Account</th>
                        <th>Debit Branch ID</th>
                        <th>Debit Account</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="6" class="text-muted">No records to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Behind The Scene -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-info-circle"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="behind-scene">
                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="Status">Status</label>
                      <input type="text" class="bs-input-text" id="Status" name="Status" readonly />
                    </div>
                    <div class="col"></div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="CreatedBy">Created By</label>
                      <input type="text" class="bs-input-text" id="CreatedBy" name="CreatedBy" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="CreatedOn">Created On</label>
                      <input type="text" class="bs-input-text" id="CreatedOn" name="CreatedOn" readonly />
                    </div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="ModifiedBy">Modified By</label>
                      <input type="text" class="bs-input-text" id="ModifiedBy" name="ModifiedBy" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="ModifiedOn">Modified On</label>
                      <input type="text" class="bs-input-text" id="ModifiedOn" name="ModifiedOn" readonly />
                    </div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="SupervisedBy">Supervised By</label>
                      <input type="text" class="bs-input-text" id="SupervisedBy" name="SupervisedBy" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="SupervisedOn">Supervised On</label>
                      <input type="text" class="bs-input-text" id="SupervisedOn" name="SupervisedOn" readonly />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-fx-action="view">
            <i class="bi bi-eye me-1"></i>View
          </button>
          <button class="btn-action" type="button" data-fx-action="add">
            <i class="bi bi-plus-circle me-1"></i>Add
          </button>
          <button class="btn-action" type="button" data-fx-action="edit" disabled>
            <i class="bi bi-pencil-square me-1"></i>Edit
          </button>
          <button class="btn-action" type="button" data-fx-action="delete" disabled>
            <i class="bi bi-trash3 me-1"></i>Delete
          </button>
          <button class="btn-action" type="button" data-fx-action="supervise" disabled>
            <i class="bi bi-shield-check me-1"></i>Supervise
          </button>
          <button class="btn-action" type="button" data-fx-action="save" disabled>
            <i class="bi bi-check-lg me-1"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-fx-action="cancel" disabled>
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/treasury/forex-deal-back-office.js"></script>
</body>

</html>
