<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Money Market - Back Office · Treasury</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201" />
</head>

<body class="money-market-back-office" data-page="client-maintenance">
  <div class="window">
    <div class="main-container">
      <!-- Sidebar -->
      <div class="sidebar" id="main-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-cash-coin"></i>MONEY MARKET BO</span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="sidebar-content">
          <div class="nav-section nav-section--card is-open" data-nav-section data-section-name="View">
            <div class="nav-header nav-header--card" data-tooltip="View">
              <div class="nav-header__content">
                <i class="bi bi-eye-fill nav-header__icon"></i>
                <span class="nav-label--card">View</span>
              </div>
              <div class="nav-header__badge">
                <button type="button" class="nav-arrow--card" aria-label="Toggle View" aria-expanded="true"
                  aria-controls="mmbo-nav-view">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items nav-items--card" id="mmbo-nav-view">
              <div class="sidebar-item sidebar-item--enhanced" data-tooltip="View">
                <i class="bi bi-eye-fill sidebar-item__icon"></i>
                <div class="sidebar-item__content">
                  <span class="sidebar-item__title">View</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content">
        <form id="mm-back-office-form" autocomplete="off" novalidate>
          <div class="form-card" data-main-form>
            <!-- Deal Details -->
            <div class="form-section" data-section="deal-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Deal Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Deal Details" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="DealNo">DealNo#</label>
                    <div class="kairo-control" data-kairo-deal-control>
                      <input type="text" class="kairo-control__id" id="DealNo" name="DealNo" />
                      <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search deal">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="IssueDate">Issue Date</label>
                    <input type="text" class="bs-input-text" id="IssueDate" name="IssueDate" data-date-picker
                      placeholder="dd/mmm/yyyy" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="ClientBranchId">Client Branch ID</label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" class="kairo-branch-control__id" id="ClientBranchId" name="ClientBranchId" />
                      <input type="text" class="kairo-branch-control__name" id="ClientBranchName" name="ClientBranchName"
                        readonly />
                      <button type="button" class="btn-lookup kairo-branch-control__lookup" aria-label="Search branch">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ClientId">Client ID</label>
                    <div class="kairo-client-control" data-kairo-client-control>
                      <input type="text" class="kairo-client-control__id" id="ClientId" name="ClientId" />
                      <button type="button" class="btn-lookup kairo-client-control__lookup" aria-label="Search client">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="Type">Type</label>
                    <select class="bs-select" id="Type" name="Type">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="CurrencyId">Currency ID</label>
                    <div class="kairo-control" data-kairo-currency-control>
                      <input type="text" class="kairo-control__id" id="CurrencyId" name="CurrencyId" />
                      <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search currency">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="form-row three-col">
                  <div class="col">
                    <label class="label-blue" for="ValueDate">Value Date</label>
                    <input type="text" class="bs-input-text" id="ValueDate" name="ValueDate" data-date-picker
                      placeholder="dd/mmm/yyyy" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="TenorDays">Tenor Days</label>
                    <input type="text" class="bs-input-text" id="TenorDays" name="TenorDays" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="MaturityDate">Maturity Date</label>
                    <input type="text" class="bs-input-text" id="MaturityDate" name="MaturityDate" data-date-picker
                      placeholder="dd/mmm/yyyy" />
                  </div>
                </div>

                <div class="form-row three-col">
                  <div class="col">
                    <label class="label-blue" for="ExchangeRate">Exchange Rate</label>
                    <input type="text" class="bs-input-text" id="ExchangeRate" name="ExchangeRate" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="Amount">Amount</label>
                    <input type="text" class="bs-input-text" id="Amount" name="Amount" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="LocalAmount">Local Amount</label>
                    <input type="text" class="bs-input-text" id="LocalAmount" name="LocalAmount" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="InterestRate">Interest Rate</label>
                    <input type="text" class="bs-input-text" id="InterestRate" name="InterestRate" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="OurDealer">Our Dealer</label>
                    <div class="kairo-control" data-kairo-dealer-control>
                      <input type="text" class="kairo-control__id" id="OurDealer" name="OurDealer" />
                      <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search dealer">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="TheirDealer">Their Dealer</label>
                  <input type="text" class="bs-input-text" id="TheirDealer" name="TheirDealer" />
                </div>

                <div class="form-row">
                  <label class="label-blue" for="Remarks">Remarks</label>
                  <input type="text" class="bs-input-text" id="Remarks" name="Remarks" />
                </div>
              </div>
            </div>

            <!-- Transaction Details -->
            <div class="form-section" data-section="transaction-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-receipt"></i>Transaction Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Transaction Details"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="AccountId">Account ID</label>
                    <div class="kairo-control" data-kairo-account-control>
                      <input type="text" class="kairo-control__id" id="AccountId" name="AccountId" />
                      <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search account">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="SettlementAccountId">Settlement AccountID</label>
                    <div class="kairo-control" data-kairo-account-control>
                      <input type="text" class="kairo-control__id" id="SettlementAccountId" name="SettlementAccountId" />
                      <button type="button" class="btn-lookup kairo-control__lookup"
                        aria-label="Search settlement account">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="Reference">Reference</label>
                  <input type="text" class="bs-input-text" id="Reference" name="Reference" />
                </div>

                <div class="form-row">
                  <label class="label-blue" for="TransactionRemarks">Remarks</label>
                  <input type="text" class="bs-input-text" id="TransactionRemarks" name="TransactionRemarks" />
                </div>
              </div>
            </div>

            <!-- Entries -->
            <div class="form-section" data-section="entries">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-journal-check"></i>Entries</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Entries" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="table-responsive">
                  <table class="table table-sm table-hover mb-0 mm-table">
                    <thead>
                      <tr>
                        <th>CrAccountTypeID</th>
                        <th>CR AccountID</th>
                        <th>CrAccountName</th>
                        <th>DrAccountTypeID</th>
                        <th>DR AccountID</th>
                        <th>DrAccountName</th>
                        <th>Amount</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="7" class="text-muted">No records to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Behind The Scene -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-info-circle"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="behind-scene">
                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="Status">Status</label>
                      <input type="text" class="bs-input-text" id="Status" name="Status" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="AccruedInterest">Accrued Interest</label>
                      <input type="text" class="bs-input-text" id="AccruedInterest" name="AccruedInterest" readonly />
                    </div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="DealDays">Deal Days</label>
                      <input type="text" class="bs-input-text" id="DealDays" name="DealDays" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="Interest">Interest</label>
                      <input type="text" class="bs-input-text" id="Interest" name="Interest" readonly />
                    </div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="AccruedInto">Accrued Into</label>
                      <select class="bs-select" id="AccruedInto" name="AccruedInto">
                        <option value="">--Select--</option>
                      </select>
                    </div>
                    <div class="col">
                      <label class="label-blue" for="Tax">Tax</label>
                      <input type="text" class="bs-input-text" id="Tax" name="Tax" readonly />
                    </div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="TotalMaturity">Total Maturity</label>
                      <input type="text" class="bs-input-text" id="TotalMaturity" name="TotalMaturity" readonly />
                    </div>
                    <div class="col"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Action Panel -->
      <div class="action-panel">
        <div class="nav-group">
          <button class="btn-nav green" type="button" aria-label="Previous Deal" data-mmbo-nav="prev">
            <i class="bi bi-chevron-left"></i>
          </button>
          <span>Deal</span>
          <button class="btn-nav green" type="button" aria-label="Next Deal" data-mmbo-nav="next">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>

        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-mm-action="view">
            <i class="bi bi-eye me-1"></i>View
          </button>
          <button class="btn-action" type="button" data-mm-action="edit" disabled>
            <i class="bi bi-pencil-square me-1"></i>Edit
          </button>
          <button class="btn-action" type="button" data-mm-action="supervise" disabled>
            <i class="bi bi-shield-check me-1"></i>Supervise
          </button>
          <button class="btn-action" type="button" data-mm-action="save" disabled>
            <i class="bi bi-check-lg me-1"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-mm-action="cancel" disabled>
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/treasury/money-market-back-office.js"></script>
</body>

</html>
