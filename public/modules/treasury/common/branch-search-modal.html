<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branch Search · Treasury</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="branch-search-modal.css" />
</head>
<body>
  <div class="dataentry-container">
    <div class="dataentry-main">
      <div class="dataentry-content">
        <form id="branchSearchForm" class="form" novalidate>
          <section class="card">
            <div class="card-header">
              <i class="bi bi-search" aria-hidden="true"></i>
              <span>Branch Search Criteria</span>
            </div>
            <div class="card-body form-grid two-col">
              <div class="form-control-group">
                <label for="BranchId" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="BranchId" name="BranchId" class="form-control search-field" data-field="BranchId" placeholder="Enter branch ID" />
                </div>
              </div>
              <div class="form-control-group">
                <label for="BranchName" class="form-label"><i class="bi bi-building" aria-hidden="true"></i><span>Branch Name</span></label>
                <div class="input-with-action">
                  <select class="form-control filter-op" style="width: 80px; margin-right: 8px;">
                    <option>Like</option>
                    <option>=</option>
                  </select>
                  <input type="text" id="BranchName" name="BranchName" class="form-control search-field" data-field="BranchName" placeholder="Enter branch name" />
                </div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <i class="bi bi-table" aria-hidden="true"></i>
              <span>Search Results</span>
            </div>
            <div class="card-body">
              <div class="data-table">
                <table style="width: 100%; border-collapse: collapse;">
                  <thead>
                    <tr style="background: var(--primary); color: var(--white);">
                      <th style="padding: 8px; border: 1px solid var(--border);">Branch ID</th>
                      <th style="padding: 8px; border: 1px solid var(--border);">Branch Name</th>
                    </tr>
                  </thead>
                  <tbody id="resultsBody">
                    <tr>
                      <td colspan="2" style="padding: 20px; text-align: center; color: var(--text-light);">No results found</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </form>
      </div>
      <div class="dataentry-sidebar">
        <div class="dataentry-actions">
          <button type="button" class="action-btn search" id="btnSearch">
            <i class="bi bi-search" aria-hidden="true"></i>
            <span>Search</span>
          </button>
          <button type="button" class="action-btn cancel" data-dataentry-close>
            <i class="bi bi-x-circle" aria-hidden="true"></i>
            <span>Cancel</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const close = () => window.parent?.postMessage?.({ type: 'kairo-dataentry-close' }, '*');

      document.querySelectorAll('[data-dataentry-close]').forEach((btn) => {
        btn.addEventListener('click', () => close());
      });
    })();
  </script>

  <!-- Scripts -->
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="branch-search-modal.js"></script>
</body>
</html>
