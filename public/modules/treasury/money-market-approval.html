<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Money Market Approval · Treasury</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260201" />
</head>

<body data-page="client-maintenance">
  <div class="window">
    <div class="main-container">
      <!-- Sidebar -->
      <div class="sidebar" id="main-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-cash-coin"></i>MONEY MARKET</span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="sidebar-content">
          <div class="nav-section nav-section--card is-open" data-nav-section data-section-name="View">
            <div class="nav-header nav-header--card" data-tooltip="View">
              <div class="nav-header__content">
                <i class="bi bi-eye-fill nav-header__icon"></i>
                <span class="nav-label--card">View</span>
              </div>
              <div class="nav-header__badge">
                <button type="button" class="nav-arrow--card" aria-label="Toggle View" aria-expanded="true" aria-controls="mm-nav-view">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items nav-items--card" id="mm-nav-view">
              <div class="sidebar-item sidebar-item--enhanced" id="mmViewBtn" data-tooltip="View">
                <i class="bi bi-eye-fill sidebar-item__icon"></i>
                <div class="sidebar-item__content">
                  <span class="sidebar-item__title">View</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content">
        <form id="mm-approval-form" autocomplete="off" novalidate>
          <div class="form-card" data-main-form>
            <!-- Money Market Details -->
            <div class="form-section" data-section="mm-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Money Market Approval</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Money Market Details" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="DealNo">DealNo#</label>
                    <input type="text" class="bs-input-text" id="DealNo" name="DealNo" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="IssueDate">Issue Date</label>
                    <input type="text" class="bs-input-text" id="IssueDate" name="IssueDate" data-date-picker placeholder="dd/mmm/yyyy" />
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="Type">Type</label>
                  <select class="bs-select" id="Type" name="Type">
                    <option value="">--Select--</option>
                  </select>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="ClientBranchId">Client Branch ID</label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" class="kairo-branch-control__id" id="ClientBranchId" name="ClientBranchId" value="0101" />
                      <input type="text" class="kairo-branch-control__name" id="ClientBranchName" name="ClientBranchName" value="Head Office" readonly />
                      <button type="button" class="btn-lookup kairo-branch-control__lookup" aria-label="Search branch"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ClientId">Client ID</label>
                    <div class="kairo-client-control" data-kairo-client-control>
                      <input type="text" class="kairo-client-control__id" id="ClientId" name="ClientId" />
                      <button type="button" class="btn-lookup kairo-client-control__lookup" aria-label="Search client"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <div class="form-row three-col">
                  <div class="col">
                    <label class="label-blue" for="ValueDate">Value Date</label>
                    <input type="text" class="bs-input-text" id="ValueDate" name="ValueDate" data-date-picker placeholder="dd/mmm/yyyy" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="TenorDays">Tenor Days</label>
                    <input type="text" class="bs-input-text" id="TenorDays" name="TenorDays" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="MaturityDate">Maturity Date</label>
                    <input type="text" class="bs-input-text" id="MaturityDate" name="MaturityDate" data-date-picker placeholder="dd/mmm/yyyy" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="CurrencyId">Currency ID</label>
                    <div class="kairo-control" data-kairo-currency-control>
                      <input type="text" class="kairo-control__id" id="CurrencyId" name="CurrencyId" />
                      <button type="button" class="btn-lookup kairo-control__lookup" aria-label="Search currency"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="Amount">Amount</label>
                    <input type="text" class="bs-input-text" id="Amount" name="Amount" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="ExchangeRate">Exchange Rate</label>
                    <input type="text" class="bs-input-text" id="ExchangeRate" name="ExchangeRate" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="LocalAmount">Local Amount</label>
                    <input type="text" class="bs-input-text" id="LocalAmount" name="LocalAmount" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="InterestRate">Interest Rate</label>
                    <input type="text" class="bs-input-text" id="InterestRate" name="InterestRate" />
                  </div>
                  <div class="col"></div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="OurDealer">Our Dealer</label>
                  <input type="text" class="bs-input-text" id="OurDealer" name="OurDealer" />
                </div>

                <div class="form-row">
                  <label class="label-blue" for="TheirDealer">Their Dealer</label>
                  <input type="text" class="bs-input-text" id="TheirDealer" name="TheirDealer" />
                </div>

                <div class="form-row">
                  <label class="label-blue" for="Remarks">Remarks</label>
                  <input type="text" class="bs-input-text" id="Remarks" name="Remarks" />
                </div>
              </div>
            </div>

            <!-- Deals List -->
            <div class="form-section" data-section="mm-deals">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-table"></i>Deals List</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Deals List" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="table-responsive">
                  <table class="table table-sm table-hover mb-0 tr-table">
                    <thead class="table-light">
                      <tr>
                        <th style="width:32px"><input class="form-check-input" type="checkbox" aria-label="Select all" /></th>
                        <th>Deal Number</th>
                        <th>Issue Date</th>
                        <th>Limit Type Name</th>
                        <th>Amount</th>
                        <th>Interest</th>
                        <th>Maturity Amount</th>
                        <th>Remarks</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="8" class="text-muted">No records to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Limits -->
            <div class="form-section" data-section="mm-limits">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-graph-up"></i>Limits</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Limits" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row four-col">
                  <div class="col">
                    <label class="label-blue" for="BorrowingLimit">Borrowing Limit</label>
                    <input type="text" class="bs-input-text" id="BorrowingLimit" name="BorrowingLimit" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="BorrowingUsed">Used</label>
                    <input type="text" class="bs-input-text" id="BorrowingUsed" name="BorrowingUsed" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="LendingLimit">Lending Limit</label>
                    <input type="text" class="bs-input-text" id="LendingLimit" name="LendingLimit" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="LendingUsed">Used</label>
                    <input type="text" class="bs-input-text" id="LendingUsed" name="LendingUsed" />
                  </div>
                </div>
              </div>
            </div>

            <!-- Behind The Scene -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-info-circle"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="behind-scene">
                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="CreatedBy">Created By</label>
                      <input type="text" class="bs-input-text" id="CreatedBy" name="CreatedBy" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="CreatedOn">Created On</label>
                      <input type="text" class="bs-input-text" id="CreatedOn" name="CreatedOn" readonly />
                    </div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="ModifiedBy">Modified By</label>
                      <input type="text" class="bs-input-text" id="ModifiedBy" name="ModifiedBy" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="ModifiedOn">Modified On</label>
                      <input type="text" class="bs-input-text" id="ModifiedOn" name="ModifiedOn" readonly />
                    </div>
                  </div>

                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="SupervisedBy">Supervised By</label>
                      <input type="text" class="bs-input-text" id="SupervisedBy" name="SupervisedBy" readonly />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="SupervisedOn">Supervised On</label>
                      <input type="text" class="bs-input-text" id="SupervisedOn" name="SupervisedOn" readonly />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-mm-action="view"><i class="bi bi-eye me-1"></i>View</button>
          <button class="btn-action" type="button" data-mm-action="approve" disabled><i class="bi bi-check2-circle me-1"></i>Approve</button>
          <button class="btn-action" type="button" data-mm-action="reject" disabled><i class="bi bi-x-circle me-1"></i>Reject</button>
          <button class="btn-action btn-cancel" type="button" data-mm-action="cancel" disabled><i class="bi bi-x-octagon me-1"></i>Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
</body>

</html>
