<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Loan Application Projection - Loan Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>

                    <!-- Identification Section -->
                    <div class="form-section" data-section="identification">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-card-checklist"></i> Identification</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Identification" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Branch</label>
                                    <div class="kairo-branch-control" data-kairo-branch-control>
                                        <input type="text" id="BranchID" value="0101" class="kairo-branch-control__id" aria-label="Branch ID">
                                        <input type="text" id="BranchName" value="Head Office" class="kairo-branch-control__name" aria-label="Branch Name" placeholder="Branch Name" readonly>
                                        <button type="button" class="btn-lookup kairo-branch-control__lookup" data-target-input="BranchID" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Center ID</label>
                                    <div class="kairo-client-control" data-kairo-client-control>
                                        <input type="text" id="CenterID" class="kairo-client-control__id" aria-label="Center ID">
                                        <input type="text" id="CenterName" class="kairo-client-control__name" aria-label="Center Name" placeholder="Center Name" readonly>
                                        <button type="button" class="btn-lookup kairo-client-control__lookup" data-target-input="CenterID" aria-label="Search Center"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Group ID</label>
                                    <div class="kairo-client-control" data-kairo-client-control>
                                        <input type="text" id="GroupID" class="kairo-client-control__id" aria-label="Group ID">
                                        <input type="text" id="GroupName" class="kairo-client-control__name" aria-label="Group Name" placeholder="Group Name" readonly>
                                        <button type="button" class="btn-lookup kairo-client-control__lookup" data-target-input="GroupID" aria-label="Search Group"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Scheme ID</label>
                                    <div class="kairo-client-control" data-kairo-client-control>
                                        <input type="text" id="SchemeID" class="kairo-client-control__id" aria-label="Scheme ID">
                                        <input type="text" id="SchemeName" class="kairo-client-control__name" aria-label="Scheme Name" placeholder="Scheme Name" readonly>
                                        <button type="button" class="btn-lookup kairo-client-control__lookup" data-target-input="SchemeID" aria-label="Search Scheme"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Product ID</label>
                                    <div class="kairo-product-control" data-kairo-product-control>
                                        <input type="text" id="ProductID" class="kairo-product-control__id" aria-label="Product ID">
                                        <input type="text" id="ProductName" class="kairo-product-control__name" aria-label="Product Name" placeholder="Product Name" readonly>
                                        <button type="button" class="btn-lookup kairo-product-control__lookup" data-target-input="ProductID" aria-label="Search Product"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Donor ID</label>
                                    <div class="kairo-client-control" data-kairo-client-control>
                                        <input type="text" id="DonorID" class="kairo-client-control__id" aria-label="Donor ID">
                                        <input type="text" id="DonorName" class="kairo-client-control__name" aria-label="Donor Name" placeholder="Donor Name" readonly>
                                        <button type="button" class="btn-lookup kairo-client-control__lookup" data-target-input="DonorID" aria-label="Search Donor"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Disbursement Date</label>
                                    <select class="bs-select" id="DisbursementDate" aria-label="Disbursement Date">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Advance Type</label>
                                    <input type="text" class="bs-input-text" id="AdvanceType" aria-label="Advance Type">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Mode Of Disbursement</label>
                                    <select class="bs-select" id="ModeOfDisbursement" aria-label="Mode Of Disbursement">
                                        <option value="">--Select--</option>
                                        <option value="cash">Cash</option>
                                        <option value="cheque">Cheque</option>
                                        <option value="transfer">Transfer</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Credit Officer</label>
                                    <input type="text" class="bs-input-text" id="CreditOfficer" aria-label="Credit Officer">
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">File Number</label>
                                    <input type="text" class="bs-input-text" id="FileNumber" aria-label="File Number">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Currency ID</label>
                                    <input type="text" class="bs-input-text" id="CurrencyID" aria-label="Currency ID">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Loan Purpose</label>
                                    <select class="bs-select" id="LoanPurpose" aria-label="Loan Purpose">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Line Of Business</label>
                                    <select class="bs-select" id="LineOfBusiness" aria-label="Line Of Business">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Client & Loan Details Section -->
                    <div class="form-section" data-section="client-loan-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-person-badge"></i> Client & Loan Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Client & Loan Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Client ID</label>
                                    <input type="text" class="bs-input-text" id="ClientID" aria-label="Client ID">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Main Repayment Account</label>
                                    <div class="kairo-account-control" data-kairo-account-control>
                                        <input type="text" id="MainRepaymentAccount" class="kairo-account-control__id" aria-label="Main Repayment Account">
                                        <button type="button" class="btn-lookup kairo-account-control__lookup" data-target-input="MainRepaymentAccount" aria-label="Search Account"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Loan Amount</label>
                                    <input type="text" class="bs-input-text" id="LoanAmount" aria-label="Loan Amount">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Loan Cycle</label>
                                    <input type="text" class="bs-input-text" id="LoanCycle" aria-label="Loan Cycle">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Loan Level</label>
                                    <input type="text" class="bs-input-text" id="LoanLevel" aria-label="Loan Level">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Group Class</label>
                                    <input type="text" class="bs-input-text" id="GroupClass" aria-label="Group Class">
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Term</label>
                                    <input type="text" class="bs-input-text" id="Term" aria-label="Term">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Repayment Term</label>
                                    <input type="text" class="bs-input-text" id="RepaymentTerm" aria-label="Repayment Term">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Interest Rate</label>
                                    <input type="text" class="bs-input-text" id="InterestRate" aria-label="Interest Rate">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Grace Period</label>
                                    <input type="text" class="bs-input-text" id="GracePeriod" aria-label="Grace Period">
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Loan Period</label>
                                    <input type="text" class="bs-input-text" id="LoanPeriod" aria-label="Loan Period">
                                </div>
                            </div>
                            
                            <!-- Inline Action Buttons -->
                            <div class="d-flex gap-2 mt-3">
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnAlter">
                                    <i class="bi bi-arrow-repeat me-1"></i>Alter
                                </button>
                                <button type="button" class="btn btn-outline-primary btn-sm" id="btnUpdate">
                                    <i class="bi bi-check-circle me-1"></i>Update
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm" id="btnClear">
                                    <i class="bi bi-x-circle me-1"></i>Clear
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Application Details Table -->
                    <div class="form-section" data-section="application-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-table"></i> Application Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Application Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table class="table table-sm table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width: 40px;"></th>
                                            <th>Group ID</th>
                                            <th>Client ID</th>
                                            <th>Name</th>
                                            <th>Loan Cycle No.</th>
                                            <th>Loan Level No</th>
                                            <th>Loan Amount</th>
                                            <th>Loan Term</th>
                                            <th>Loan Period</th>
                                            <th>Repayment Term</th>
                                            <th>Repayment Frequency</th>
                                            <th>Interest Rate</th>
                                            <th>Penalty Rate</th>
                                            <th>Total Savings Balance</th>
                                        </tr>
                                    </thead>
                                    <tbody id="applicationTableBody">
                                        <tr>
                                            <td colspan="14" class="text-center text-muted py-3">No records to display.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- RIGHT PANEL: Actions -->
            <div class="action-panel">
                <!-- Quick Links -->
                <div class="nav-group">
                    <span>Quick Links</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button type="button" class="btn-action" data-action="group-detail">
                        <i class="bi bi-people-fill"></i>
                        <span>Group Detail</span>
                    </button>
                    <button type="button" class="btn-action" data-action="image">
                        <i class="bi bi-card-image"></i>
                        <span>Image</span>
                    </button>
                </div>

                <div class="action-buttons">
                    <div class="nav-group border-0 mb-1 mt-2">
                        <span>Actions</span>
                    </div>
                    <!-- View/Add/Edit Group -->
                    <button type="button" class="btn-action btn-view" data-shell-mode="View">
                        <i class="bi bi-eye-fill"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action" data-shell-mode="Add" disabled>
                        <i class="bi bi-plus-lg"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="btn-action" data-shell-mode="Update" disabled>
                        <i class="bi bi-pencil-fill"></i>
                        <span>Edit</span>
                    </button>

                    <hr style="margin: 4px 0; border-color: #e2e8f0; opacity: 0.5;">

                    <!-- Save/Cancel Group -->
                    <button type="button" class="btn-action btn-save" data-submit-action="save" disabled>
                        <i class="bi bi-check-lg"></i>
                        <span>Done</span>
                    </button>
                    <button type="button" class="btn-action btn-cancel" data-submit-action="cancel" disabled>
                        <i class="bi bi-x-lg"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/auth/auth.config.js"></script>
    <script src="../../assets/js/auth/auth.service.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="group-loan-projection.js"></script>
</body>
</html>
