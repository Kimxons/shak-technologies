<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Transfer</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="budget-transfer.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <aside class="sidebar" aria-label="Section navigation">
                <div class="sidebar-title">Budget Transfer</div>
            </aside>

            <main class="content" role="main">
                <div id="statusMessage" class="status hidden" role="status" aria-live="polite">
                    <i class="bi" aria-hidden="true"></i>
                    <span class="status-text"></span>
                    <button type="button" class="status-close" aria-label="Dismiss message">✕</button>
                </div>

                <form id="budgetTransferForm" class="form" novalidate>
                    <!-- DataEntry Section -->
                    <div class="form-section" data-section="dataentry">
                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
                                <span>Budget Transfer Details</span>
                            </div>
                            <div class="card-body form-grid two-col">
                                <div class="form-control-group">
                                    <label for="serialId" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>Serial ID</span></label>
                                    <input type="text" id="serialId" name="serialId" class="form-control" placeholder="Auto-generated" readonly>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="branchId" class="form-label"><i class="bi bi-building" aria-hidden="true"></i><span>Branch ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="branchId" name="branchId" class="form-control segment-id" placeholder="0101" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="branchDescription" name="branchDescription" class="form-control segment-desc" placeholder="Head Office" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search-branch" aria-label="Search branch">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="fromGlAccount" class="form-label"><i class="bi bi-credit-card" aria-hidden="true"></i><span>From GL Account</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="fromGlAccount" name="fromGlAccount" class="form-control segment-id" placeholder="Enter GL Account" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="fromGlAccountDesc" name="fromGlAccountDesc" class="form-control segment-desc" placeholder="Account description" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search-from-gl" aria-label="Search GL account">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group">
                                    <label for="toGlAccount" class="form-label"><i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>To GL Account</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="toGlAccount" name="toGlAccount" class="form-control segment-id" placeholder="Enter GL Account" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="toGlAccountDesc" name="toGlAccountDesc" class="form-control segment-desc" placeholder="Account description" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search-to-gl" aria-label="Search GL account">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-control-group">
                                    <label for="fromBudgetMonth" class="form-label"><i class="bi bi-calendar-month" aria-hidden="true"></i><span>From Budget Month</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="fromBudgetMonth" name="fromBudgetMonth" class="form-control segment-id" placeholder="MM/YYYY" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="fromBudgetMonthDesc" name="fromBudgetMonthDesc" class="form-control segment-desc" placeholder="Month description" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search-from-month" aria-label="Select month">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group">
                                    <label for="toBudgetMonth" class="form-label"><i class="bi bi-calendar-range" aria-hidden="true"></i><span>To Budget Month</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="toBudgetMonth" name="toBudgetMonth" class="form-control segment-id" placeholder="MM/YYYY" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="toBudgetMonthDesc" name="toBudgetMonthDesc" class="form-control segment-desc" placeholder="Month description" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search-to-month" aria-label="Select month">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-control-group">
                                    <label for="budgetAmount" class="form-label"><i class="bi bi-cash-stack" aria-hidden="true"></i><span>Budget Amount</span></label>
                                    <input type="number" id="budgetAmount" name="budgetAmount" class="form-control" placeholder="Enter amount" min="0" step="0.01" data-required="true">
                                </div>
                                <div class="form-control-group"></div>
                            </div>
                        </section>

                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-info-circle" aria-hidden="true"></i>
                                <span>Behind The Scene</span>
                            </div>
                            <div class="card-body form-grid four-col">
                                <div class="form-control-group">
                                    <label for="createdBy" class="form-label"><i class="bi bi-person-badge" aria-hidden="true"></i><span>Created By</span></label>
                                    <input type="text" id="createdBy" name="createdBy" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="createdOn" class="form-label"><i class="bi bi-calendar-event" aria-hidden="true"></i><span>Created On</span></label>
                                    <input type="text" id="createdOn" name="createdOn" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="supervisedBy" class="form-label"><i class="bi bi-person-check" aria-hidden="true"></i><span>Supervised By</span></label>
                                    <input type="text" id="supervisedBy" name="supervisedBy" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="supervisedOn" class="form-label"><i class="bi bi-calendar2-check" aria-hidden="true"></i><span>Supervised On</span></label>
                                    <input type="text" id="supervisedOn" name="supervisedOn" class="form-control" readonly>
                                </div>
                            </div>
                        </section>
                    </div>
                </form>
            </main>

            <aside class="action-bar" aria-label="Actions">
                <button type="button" class="action-btn action-btn--secondary" data-action="print">
                    <i class="bi bi-printer" aria-hidden="true"></i>
                    <span>Print</span>
                </button>
                <button type="button" class="action-btn action-btn--secondary" data-action="archive">
                    <i class="bi bi-archive" aria-hidden="true"></i>
                    <span>Archive</span>
                </button>
                <button type="button" class="action-btn action-btn--danger" data-action="reject">
                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                    <span>Reject</span>
                </button>
                <button type="button" class="action-btn action-btn--info" data-action="view">
                    <i class="bi bi-eye" aria-hidden="true"></i>
                    <span>View</span>
                </button>
                <button type="button" class="action-btn action-btn--success" data-action="add">
                    <i class="bi bi-plus-circle" aria-hidden="true"></i>
                    <span>Add</span>
                </button>
                <button type="button" class="action-btn action-btn--primary" data-action="save" disabled>
                    <i class="bi bi-floppy" aria-hidden="true"></i>
                    <span>Save</span>
                </button>
                <button type="button" class="action-btn action-btn--secondary" data-action="cancel">
                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                    <span>Cancel</span>
                </button>
            </aside>
        </div>
    </div>

    <script src="budget-transfer.js"></script>
</body>
</html>
