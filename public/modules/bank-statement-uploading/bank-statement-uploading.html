<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank Statement Uploading · Other Modules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="bank-statement-uploading.css" />
</head>

<body class="client-maintenance copilot-theme bank-statement-uploading" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="bank-statement-uploading-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-scroll-region">
          <section class="card-surface bsu-main-form">
            <h3 class="bsu-section-title">Bank Statement Uploading</h3>
            
            <div class="cbs-grid cbs-grid--two cbs-grid--tight">
              <!-- Branch ID -->
              <div class="cbs-field">
                <label class="cbs-label" for="branchId">Branch ID</label>
                <div class="input-group">
                  <input id="branchId" type="text" class="form-control" value="0101" />
                  <input id="branchName" type="text" class="form-control" value="Head Office" readonly />
                  <button class="btn btn-outline-primary" type="button" aria-label="Lookup Branch">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <!-- Batch No -->
              <div class="cbs-field">
                <label class="cbs-label" for="batchNo">Batch No.</label>
                <div class="input-group">
                  <input id="batchNo" type="text" class="form-control" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Lookup Batch">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <!-- Format ID -->
              <div class="cbs-field">
                <label class="cbs-label" for="formatId">Format ID</label>
                <div class="input-group">
                  <input id="formatId" type="text" class="form-control" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Lookup Format">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <!-- GL Account ID -->
              <div class="cbs-field">
                <label class="cbs-label" for="glAccountId">GL Account ID</label>
                <div class="input-group">
                  <input id="glAccountId" type="text" class="form-control" />
                  <input id="glAccountName" type="text" class="form-control" readonly />
                  <button class="btn btn-outline-primary" type="button" aria-label="Lookup GL Account">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <!-- Statement From Date -->
              <div class="cbs-field">
                <label class="cbs-label" for="stmtFromDate">Statement From Date</label>
                <input id="stmtFromDate" type="date" class="form-control" />
              </div>

              <!-- Statement To Date -->
              <div class="cbs-field">
                <label class="cbs-label" for="stmtToDate">Statement To Date</label>
                <input id="stmtToDate" type="date" class="form-control" />
              </div>

              <!-- Closing Balance -->
              <div class="cbs-field">
                <label class="cbs-label" for="closingBalance">Closing Balance</label>
                <input id="closingBalance" type="text" class="form-control" />
              </div>

              <!-- Batch Status -->
              <div class="cbs-field">
                <label class="cbs-label" for="batchStatus">Batch Status</label>
                <input id="batchStatus" type="text" class="form-control" />
              </div>
            </div>
          </section>

          <!-- BR.Net Web Banking Section -->
          <section class="card-surface bsu-web-banking-section">
            <h3 class="bsu-section-title">BR.Net Web Banking</h3>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group bsu-actions-top">
          <button type="button" class="cm-shell__action" id="viewErrorBtn">View Error</button>
          <button type="button" class="cm-shell__action" id="showStatementBtn">Show Statement</button>
          <button type="button" class="cm-shell__action" id="uploadBtn">Upload</button>
        </div>
        <div class="cm-legacy-actions__group bsu-actions-bottom">
          <button type="button" class="cm-shell__action" id="viewBtn">View</button>
          <button type="button" class="cm-shell__action" id="addBtn">Add</button>
          <button type="button" class="cm-shell__action" id="editBtn">Edit</button>
          <button type="button" class="cm-shell__action" id="deleteBtn">Delete</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" id="saveBtn">Save</button>
          <button type="button" class="cm-shell__action" id="cancelBtn">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <!-- Snackbar for notifications -->
  <div id="snackbar" class="snackbar"></div>

  <style>
    /* Snackbar styles */
    .snackbar {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 16px;
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .snackbar.show {
      visibility: visible;
      animation: fadein 0.3s, fadeout 0.3s 2.7s;
    }

    .snackbar-error {
      background-color: #dc3545;
    }

    .snackbar-success {
      background-color: #28a745;
    }

    .snackbar-info {
      background-color: #17a2b8;
    }

    @keyframes fadein {
      from {
        bottom: 0;
        opacity: 0;
      }
      to {
        bottom: 30px;
        opacity: 1;
      }
    }

    @keyframes fadeout {
      from {
        bottom: 30px;
        opacity: 1;
      }
      to {
        bottom: 0;
        opacity: 0;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Shared Services -->
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/otherModuleService/otherModuleService.js"></script>
  
  <!-- Module Script -->
  <script src="bank-statement-uploading.js"></script>
</body>

</html>
