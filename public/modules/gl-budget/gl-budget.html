<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL Budget · General Ledger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="gl-budget.css" />
</head>

<body class="client-maintenance copilot-theme gl-budget" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="gl-budget-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <div class="cm-scroll-region">
          <section class="card-surface gldb-main-form">
            <h3 class="section-title d-inline-flex align-items-center gap-2 mb-2"><i class="bi bi-wallet2"></i> GL Budget</h3>
            <div class="row g-2 gldb-header">
              <div class="col-lg-6">
                <div class="cbs-field">
                  <label for="branchId" class="cbs-label">Branch ID</label>
                  <div class="input-group">
                    <input id="branchId" type="text" class="form-control" value="0101" />
                    <input id="branchName" type="text" class="form-control" value="Head Office" readonly />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup Branch"><i class="bi bi-search"></i></button>
                  </div>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="cbs-field">
                  <label for="budgetType" class="cbs-label">Budget Type</label>
                  <select id="budgetType" class="form-select">
                    <option value="001">Finance</option>
                    <option value="002">Operations</option>
                    <option value="003">Consolidated</option>
                  </select>
                </div>
              </div>

              <div class="col-lg-6">
                <div class="cbs-field">
                  <label for="reportType" class="cbs-label">Report Type</label>
                  <select id="reportType" class="form-select">
                    <option value="">--Select--</option>
                    <option value="BS">Balance Sheet</option>
                    <option value="PL">Profit and Loss Statement</option>
                  </select>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="cbs-field">
                  <label for="periodType" class="cbs-label">Period Type</label>
                  <select id="periodType" class="form-select">
                    <option value="">--Select--</option>
                    <option value="1">Monthly</option>
                    <option value="2">Quarterly</option>
                    <option value="3">Yearly</option>
                  </select>
                </div>
              </div>

              <div class="col-lg-6">
                <div class="cbs-field">
                  <label for="financialYear" class="cbs-label">Financial Year</label>
                  <select id="financialYear" class="form-select">
                    <option value="">--Select--</option>
                    <option value="0">Current Year</option>
                    <option value="1">Next Year</option>
                    <option value="-1">Previous Year</option>
                  </select>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="cbs-field">
                  <label for="currencyId" class="cbs-label">Currency ID</label>
                  <select id="currencyId" class="form-select">
                    <option>ETB</option>
                    <option>KES</option>
                    <option>USD</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="card-surface--muted gldb-grid mt-2">
              <div class="table-responsive">
                <table id="budgetTable" class="table table-sm table-borderless align-middle mb-0">
                  <thead>
                    <tr class="text-muted">
                      <th style="min-width: 140px;">Account ID</th>
                      <th style="min-width: 120px;">Type</th>
                      <th style="min-width: 220px;">Description</th>
                      <th>July</th>
                      <th>August</th>
                      <th>September</th>
                      <th>October</th>
                      <th>November</th>
                      <th>December</th>
                      <th>January</th>
                      <th>February</th>
                      <th>March</th>
                      <th>April</th>
                      <th>May</th>
                      <th>June</th>
                    </tr>
                  </thead>
                  <tbody id="budgetTableBody">
                    <tr>
                      <td colspan="15" class="text-muted py-4">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="card-surface gldb-footer">
            <h3 class="gldb-section-title">BR.Net Web Banking</h3>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" id="printBtn"><i class="bi bi-printer me-1"></i>Print</button>
          <button type="button" class="cm-shell__action" id="browseBtn">Browse</button>
          <button type="button" class="cm-shell__action" id="viewBtn">View</button>
          <button type="button" class="cm-shell__action" id="editBtn">Edit</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" id="saveBtn">Save</button>
          <button type="button" class="cm-shell__action" id="cancelBtn">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/generalLedger/generalLedgerService.js"></script>
  <script src="gl-budget.js"></script>
</body>

</html>
