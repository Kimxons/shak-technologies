<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refinance - Initiation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <!-- Main Container -->
        <div class="main-container main-container--no-sidebar">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <form id="refinanceInitiationForm" novalidate>
                        <!-- Account Identification Section -->
                        <div class="form-section" data-section="identification">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-building"></i> Account Identification</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Identification" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Branch ID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="branchId" class="kairo-branch-control__id" value="0101" readonly>
                                            <input type="text" id="branchName" class="kairo-branch-control__name" value="Head Office" placeholder="Branch Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchBranchBtn" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Client ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="clientId" class="kairo-branch-control__id" placeholder="ID" readonly>
                                            <input type="text" id="clientName" class="kairo-branch-control__name" placeholder="Client Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchClientBtn" aria-label="Search Client"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Account ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="accountId" class="kairo-branch-control__id" placeholder="ID" readonly>
                                            <input type="text" id="accountName" class="kairo-branch-control__name" placeholder="Account Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchAccountBtn" aria-label="Search Account"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Loan Series</label>
                                        <input type="text" id="loanSeries" class="bs-input-text" placeholder="Series">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col">
                                        <label class="label-blue">Application Type</label>
                                        <select id="applicationType" class="bs-select">
                                            <option value="">--Select--</option>
                                            <option value="refinance" selected>Refinance</option>
                                            <option value="restructure">Restructure</option>
                                            <option value="top-up">Top Up</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Existing Loans Section -->
                        <div class="form-section" data-section="existing-loans">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-table"></i> Existing Loans</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Existing Loans" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-sm table-bordered table-hover" id="existingLoansTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th style="width: 40px;"><input type="checkbox" id="selectAll" class="form-check-input"></th>
                                                <th>Account ID</th>
                                                <th>Loan Amount</th>
                                                <th>Loan Series</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td colspan="4" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Refinance Details Section -->
                        <div class="form-section" data-section="refinance-details">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-cash-stack"></i> Refinance Details</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Refinance Details" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Additional Amount</label>
                                        <input type="number" id="additionalAmount" class="bs-input-text" placeholder="0.00" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">New Loan</label>
                                        <input type="number" id="newLoan" class="bs-input-text" placeholder="0.00" step="0.01" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Rounding Amount</label>
                                        <input type="number" id="roundingAmount" class="bs-input-text" placeholder="0.00" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Proposed Term</label>
                                        <input type="number" id="proposedTerm" class="bs-input-text" placeholder="0">
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Interest Rate</label>
                                        <input type="number" id="interestRate" class="bs-input-text" placeholder="0.00" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Loan Purpose</label>
                                        <select id="loanPurpose" class="bs-select">
                                            <option value="">--Select--</option>
                                            <option value="business">Business</option>
                                            <option value="personal">Personal</option>
                                            <option value="education">Education</option>
                                            <option value="medical">Medical</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Expected Disbursement Date</label>
                                        <select id="expectedDisbursementDate" class="bs-select">
                                            <option value="">--Select--</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Installment Start Date</label>
                                        <select id="installmentStartDate" class="bs-select">
                                            <option value="">--Select--</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Component Breakdown Section -->
                        <div class="form-section" data-section="component-breakdown">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-list-check"></i> Component Breakdown</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Component Breakdown" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-sm table-bordered table-hover" id="componentTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Account ID</th>
                                                <th>Component</th>
                                                <th>Actual Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td colspan="3" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="form-row mt-3">
                                    <div class="col">
                                        <label class="label-blue">O/S Loan Balance</label>
                                        <input type="number" id="osLoanBalance" class="bs-input-text" placeholder="0.00" step="0.01" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Behind The Scene Section -->
                        <div class="form-section" data-section="behind-scene">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-gear"></i> Behind The Scene</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Loan Amount</label>
                                        <input type="number" id="loanAmount" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Outstanding Principal</label>
                                        <input type="number" id="outstandingPrincipal" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Total Term</label>
                                        <input type="number" id="totalTerm" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Product ID</label>
                                        <input type="text" id="productId" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Overdue Principal</label>
                                        <input type="number" id="overduePrincipal" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Balance Term</label>
                                        <input type="number" id="balanceTerm" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Maturity Date</label>
                                        <input type="date" id="maturityDate" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Installment Amount</label>
                                        <input type="number" id="installmentAmount" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Refinance Status</label>
                                        <input type="text" id="refinanceStatus" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Application ID</label>
                                        <input type="text" id="applicationId" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col">
                                        <label class="label-blue">Application Status</label>
                                        <input type="text" id="applicationStatus" class="bs-input-text" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" id="printBtn">
                        <i class="bi bi-printer"></i>
                        <span>Print</span>
                    </button>
                    <button type="button" class="btn-action" id="viewBtn">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action" id="addBtn">
                        <i class="bi bi-plus-circle"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="btn-action" id="editBtn">
                        <i class="bi bi-pencil"></i>
                        <span>Edit</span>
                    </button>
                    <button type="button" class="btn-action btn-action--danger" id="deleteBtn">
                        <i class="bi bi-trash"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="btn-action btn-action--success" id="saveBtn">
                        <i class="bi bi-floppy"></i>
                        <span>Save</span>
                    </button>
                    <button type="button" class="btn-action" id="cancelBtn">
                        <i class="bi bi-x-lg"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/common/form-init.js"></script>
    <script src="refinance-initiation.js"></script>
</body>
</html>
