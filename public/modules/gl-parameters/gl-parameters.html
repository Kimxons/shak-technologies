<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL Parameters</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
        .is-collapsed {
            display: none !important;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div style="display: flex; flex-direction: column; height: 100vh; padding: 0;">
    <!-- Main Container -->
    <div style="display: flex; flex: 1; overflow: hidden; padding: 12px; gap: 12px;">
        <!-- Main Content Area -->
        <div style="flex: 1; display: flex; flex-direction: column; background: white; border-radius: 8px; overflow: hidden;">
            <div style="flex: 1; overflow-y: auto; padding: 24px;">
                
                <!-- GL Parameters Fields - 3 columns in one row -->
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 20px; margin-bottom: 16px;">
                    <!-- Branch ID -->
                    <div>
                        <label style="display: block; font-size: 0.75rem; font-weight: 600; color: #374151; margin-bottom: 4px; letter-spacing: 0.02em; text-transform: uppercase;">Branch ID</label>
                        <div style="display: flex; gap: 6px;">
                            <input type="text" id="branchId" value="0101" readonly style="width: 80px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; background: #f9fafb; height: 32px;" />
                            <input type="text" id="branchName" value="Head Office" readonly style="flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; background: #f9fafb; height: 32px;" />
                            <button type="button" class="btn-lookup" style="padding: 6px 12px; background: #517a8e; color: white; border: none; border-radius: 4px; cursor: pointer; height: 32px;">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Description -->
                    <div>
                        <label style="display: block; font-size: 0.75rem; font-weight: 600; color: #374151; margin-bottom: 4px; letter-spacing: 0.02em; text-transform: uppercase;">Description</label>
                        <input type="text" id="glDescription" style="width: 100%; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; height: 32px;" />
                    </div>

                    <!-- GL ID -->
                    <div>
                        <label style="display: block; font-size: 0.75rem; font-weight: 600; color: #374151; margin-bottom: 4px; letter-spacing: 0.02em; text-transform: uppercase;">GL ID</label>
                        <div style="display: flex; gap: 6px;">
                            <input type="text" id="glAccountId" style="flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; height: 32px;" />
                            <button type="button" class="btn-lookup" style="padding: 6px 12px; background: #517a8e; color: white; border: none; border-radius: 4px; cursor: pointer; height: 32px;">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div style="display: flex; gap: 8px; margin-bottom: 24px;">
                    <button type="button" style="padding: 8px 24px; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer; height: 32px;">Alter</button>
                    <button type="button" style="padding: 8px 24px; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer; height: 32px;">Update</button>
                    <button type="button" style="padding: 8px 24px; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer; height: 32px;">Clear</button>
                </div>

                <!-- GL PARAMETERS Section -->
                <div style="background: #517a8e; color: white; padding: 12px 20px; margin: 0 -24px 20px -24px; display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="bi bi-gear"></i>
                        <span style="font-weight: 600; font-size: 14px;">GL PARAMETERS</span>
                    </div>
                    <button style="background: transparent; border: none; color: white; cursor: pointer; font-size: 18px;" 
                            onclick="document.getElementById('glParametersTableSection').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up');">
                        <i class="bi bi-chevron-up"></i>
                    </button>
                </div>

                <!-- GL Parameters Table -->
                <div id="glParametersTableSection" style="margin-bottom: 24px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: white;">
                    <table id="glParametersTable" style="width: 100%; border-collapse: collapse; font-size: 12px;">
                        <thead>
                            <tr style="background-color: #f8fafc;">
                                <th style="color: #64748b; font-weight: 700; text-align: left; padding: 10px 12px; border-bottom: 2px solid #f1f5f9; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em;">GL Parameters</th>
                                <th style="color: #64748b; font-weight: 700; text-align: left; padding: 10px 12px; border-bottom: 2px solid #f1f5f9; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em;">GL Name</th>
                                <th style="color: #64748b; font-weight: 700; text-align: left; padding: 10px 12px; border-bottom: 2px solid #f1f5f9; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em;">Account ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be populated dynamically -->
                        </tbody>
                    </table>
                </div>

                <!-- BEHIND THE SCENE Section -->
                <div style="background: #517a8e; color: white; padding: 12px 20px; margin: 0 -24px 20px -24px; display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="bi bi-info-circle"></i>
                        <span style="font-weight: 600; font-size: 14px;">BEHIND THE SCENE</span>
                    </div>
                    <button style="background: transparent; border: none; color: white; cursor: pointer; font-size: 18px;" 
                            onclick="document.getElementById('behindTheSceneFields').classList.toggle('is-collapsed'); this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up');">
                        <i class="bi bi-chevron-up"></i>
                    </button>
                </div>

                <!-- Behind The Scene Fields -->
                <div id="behindTheSceneFields" class="cbs-grid cbs-grid--four cbs-grid--tight mt-3">
                    <div class="cbs-field">
                        <label class="cbs-label" for="createdBy" style="color: rgba(15, 23, 42, 0.75); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.02em;">Created By</label>
                        <input type="text" class="form-control" id="createdBy" readonly />
                    </div>
                    <div class="cbs-field">
                        <label class="cbs-label" for="modifiedBy" style="color: rgba(15, 23, 42, 0.75); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.02em;">Modified By</label>
                        <input type="text" class="form-control" id="modifiedBy" readonly />
                    </div>
                    <div class="cbs-field">
                        <label class="cbs-label" for="supervisedBy" style="color: rgba(15, 23, 42, 0.75); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.02em;">Supervised By</label>
                        <input type="text" class="form-control" id="supervisedBy" readonly />
                    </div>
                    <div class="cbs-field">
                        <label class="cbs-label" for="createdOn" style="color: rgba(15, 23, 42, 0.75); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.02em;">Created On</label>
                        <input type="text" class="form-control" id="createdOn" readonly />
                    </div>
                    <div class="cbs-field">
                        <label class="cbs-label" for="modifiedOn" style="color: rgba(15, 23, 42, 0.75); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.02em;">Modified On</label>
                        <input type="text" class="form-control" id="modifiedOn" readonly />
                    </div>
                    <div class="cbs-field">
                        <label class="cbs-label" for="supervisedOn" style="color: rgba(15, 23, 42, 0.75); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.02em;">Supervised On</label>
                        <input type="text" class="form-control" id="supervisedOn" readonly />
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Sidebar with Action Buttons -->
        <div style="width: 160px; display: flex; flex-direction: column; gap: 10px;">
            <!-- Navigation Group -->
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0;">
                <button type="button" style="padding: 4px 8px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">◀</button>
                <span style="font-size: 11px; font-weight: 600; color: #64748b;">Group</span>
                <button type="button" style="padding: 4px 8px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">▶</button>
            </div>
            
            <!-- Spacer -->
            <div style="flex: 1;"></div>
            
            <button id="btnView" type="button" style="width: 100%; padding: 10px 12px; background: white; color: #1f2937; border: 2px solid #517a8e; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
                <i class="bi bi-eye"></i> View
            </button>
            <button id="btnEdit" type="button" style="width: 100%; padding: 10px 12px; background: white; color: #1f2937; border: 2px solid #517a8e; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
                <i class="bi bi-pencil"></i> Edit
            </button>
            <button id="btnSave" type="button" style="width: 100%; padding: 10px 12px; background: #22c55e; color: white; border: 2px solid #22c55e; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
                <i class="bi bi-check-lg"></i> Save
            </button>
            <button id="btnCancel" type="button" style="width: 100%; padding: 10px 12px; background: white; color: #1f2937; border: 2px solid #517a8e; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
                <i class="bi bi-x-lg"></i> Cancel
            </button>
        </div>
    </div>
</div>

<script src="../../assets/js/services/shared/serviceLoader.js"></script>
<script src="../../assets/js/services/generalLedger/generalLedgerService.js"></script>
<script src="gl-parameters.js"></script>
</body>
</html>
