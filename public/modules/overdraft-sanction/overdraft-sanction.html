<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overdraft Sanction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="overdraft-sanction.css">
</head>
<body>
    <div class="sanction-container">
        <!-- Left Sidebar -->
        <div class="sanction-sidebar">
            <div class="menu-item active" data-section="dataentry">
                <i class="bi bi-pencil-square"></i>
                <span>DataEntry</span>
            </div>
            <div class="menu-item" data-section="interest-rates">
                <i class="bi bi-percent"></i>
                <span>Interest Rates</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="sanction-content">
            <div class="content-header">
                <div class="header-actions">
                    <button class="btn-header-nav">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="btn-header-nav">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>

            <div class="content-scroll">
                <!-- Account Identification -->
                <div class="form-card">
                    <div class="form-grid-3col">
                        <div class="form-group">
                            <label for="overdraftType"><i class="bi bi-tag"></i> Overdraft Type</label>
                            <select id="overdraftType" class="form-input">
                                <option value="">--Select--</option>
                                <option value="overdraft" selected>Overdraft</option>
                                <option value="temporary">Temporary Overdraft</option>
                                <option value="secured">Secured Overdraft</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="branchId"><i class="bi bi-building"></i> Branch ID</label>
                            <div class="input-display-group">
                                <input type="text" id="branchId" class="form-input-segment-id" value="0101" placeholder="ID" readonly>
                                <span class="segment-divider"></span>
                                <input type="text" id="branchName" class="form-input-segment-name" value="Head Office" readonly>
                                <button class="search-icon-btn-inline" id="searchBranchBtn" title="Search Branch" onclick="openBranchSearch()">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="accountId"><i class="bi bi-credit-card"></i> Account ID</label>
                            <div class="input-display-group">
                                <input type="text" id="accountId" class="form-input-segment-id" placeholder="ID" readonly>
                                <span class="segment-divider"></span>
                                <input type="text" id="accountName" class="form-input-segment-name" placeholder="Account Name" readonly>
                                <button class="search-icon-btn-inline" id="searchAccountBtn" title="Search Account">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="applicationId"><i class="bi bi-file-text"></i> Application ID</label>
                            <div class="input-display-group">
                                <input type="text" id="applicationId" class="form-input-flex" placeholder="Enter application ID">
                                <button class="search-icon-btn-inline" id="searchApplicationBtn" title="Search Application">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Application Details -->
                <div class="form-card">
                    <div class="card-header">
                        <h3><i class="bi bi-file-earmark-text"></i> Application Details</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="clientId"><i class="bi bi-person"></i> Client ID</label>
                            <div class="input-display-group">
                                <input type="text" id="clientId" class="form-input-segment-id" placeholder="ID" readonly>
                                <span class="segment-divider"></span>
                                <input type="text" id="clientName" class="form-input-segment-name" placeholder="Client Name" readonly>
                                <button class="search-icon-btn-inline" id="searchClientBtn" title="Search Client">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="product"><i class="bi bi-box"></i> Product</label>
                            <div class="input-display-group">
                                <input type="text" id="product" class="form-input-segment-id" placeholder="Code" readonly>
                                <span class="segment-divider"></span>
                                <input type="text" id="productName" class="form-input-segment-name" placeholder="Product Name" readonly>
                                <button class="search-icon-btn-inline" id="searchProductBtn" title="Search Product">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="overdraftPurpose"><i class="bi bi-bullseye"></i> Overdraft Purpose</label>
                            <select id="overdraftPurpose" class="form-input">
                                <option value="">--Select--</option>
                                <option value="working-capital">Working Capital</option>
                                <option value="business-expansion">Business Expansion</option>
                                <option value="emergency">Emergency Funding</option>
                                <option value="seasonal">Seasonal Requirements</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="lineOfBusiness"><i class="bi bi-diagram-3"></i> Line Of Business</label>
                            <select id="lineOfBusiness" class="form-input">
                                <option value="">--Select--</option>
                                <option value="retail">Retail Banking</option>
                                <option value="corporate">Corporate Banking</option>
                                <option value="sme">SME Banking</option>
                                <option value="agriculture">Agriculture</option>
                                <option value="manufacturing">Manufacturing</option>
                                <option value="trade">Trade & Commerce</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="creditOfficer"><i class="bi bi-person-badge"></i> Credit Officer</label>
                            <div class="input-display-group">
                                <input type="text" id="creditOfficer" class="form-input-segment-id" placeholder="ID" readonly>
                                <span class="segment-divider"></span>
                                <input type="text" id="officerName" class="form-input-segment-name" placeholder="Officer Name" readonly>
                                <button class="search-icon-btn-inline" id="searchOfficerBtn" title="Search Officer">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="appliedAmount"><i class="bi bi-cash-stack"></i> Applied Amount</label>
                            <input type="number" id="appliedAmount" class="form-input" placeholder="0.00" step="0.01">
                        </div>

                        <div class="form-group">
                            <label for="applicationDate"><i class="bi bi-calendar-check"></i> Application Date</label>
                            <input type="date" id="applicationDate" class="form-input" value="2025-08-29">
                        </div>

                        <div class="form-group">
                            <label for="expiryDate"><i class="bi bi-calendar-x"></i> Expiry Date</label>
                            <input type="date" id="expiryDate" class="form-input" value="0001-01-01">
                        </div>

                        <div class="form-group">
                            <label for="reviewDate"><i class="bi bi-calendar-event"></i> Review Date</label>
                            <input type="date" id="reviewDate" class="form-input" value="0001-01-01">
                        </div>

                        <div class="form-group">
                            <label for="status"><i class="bi bi-info-circle"></i> Status</label>
                            <select id="status" class="form-input">
                                <option value="">--Select--</option>
                                <option value="applied" selected>Applied</option>
                                <option value="pending">Pending Review</option>
                                <option value="approved">Approved</option>
                                <option value="sanctioned">Sanctioned</option>
                                <option value="rejected">Rejected</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fileId"><i class="bi bi-folder"></i> File ID</label>
                            <input type="text" id="fileId" class="form-input" placeholder="Enter file ID">
                        </div>

                        <div class="form-group full-width">
                            <label for="remarks"><i class="bi bi-chat-left-text"></i> Remarks</label>
                            <textarea id="remarks" class="form-textarea" rows="3" placeholder="Enter remarks"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Client Details -->
                <div class="form-card">
                    <div class="card-header">
                        <h3><i class="bi bi-person-vcard"></i> Client Details</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="limitId"><i class="bi bi-hash"></i> Limit ID</label>
                            <input type="text" id="limitId" class="form-input" placeholder="Enter limit ID">
                        </div>

                        <div class="form-group">
                            <label for="limitAmount"><i class="bi bi-wallet2"></i> Limit Amount</label>
                            <input type="number" id="limitAmount" class="form-input" placeholder="0.00" step="0.01">
                        </div>

                        <div class="form-group">
                            <label for="limitExpiryDate"><i class="bi bi-calendar-x"></i> Expiry Date</label>
                            <input type="date" id="limitExpiryDate" class="form-input" value="0001-01-01">
                        </div>

                        <div class="form-group">
                            <label for="totalOdAmount"><i class="bi bi-currency-dollar"></i> Total OD Amount</label>
                            <input type="number" id="totalOdAmount" class="form-input-readonly" readonly placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="totalTodAmount"><i class="bi bi-cash"></i> Total TOD Amount</label>
                            <input type="number" id="totalTodAmount" class="form-input-readonly" readonly placeholder="0.00">
                        </div>
                    </div>
                </div>

                <!-- Behind The Scene -->
                <div class="form-card">
                    <div class="card-header">
                        <h3><i class="bi bi-info-circle"></i> Behind The Scene</h3>
                    </div>
                    <div class="scene-grid">
                        <div class="form-group">
                            <label for="createdBy"><i class="bi bi-person"></i> Created By</label>
                            <input type="text" id="createdBy" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="modifiedBy"><i class="bi bi-person-gear"></i> Modified By</label>
                            <input type="text" id="modifiedBy" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="supervisedBy"><i class="bi bi-person-check"></i> Supervised By</label>
                            <input type="text" id="supervisedBy" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="createdOn"><i class="bi bi-calendar-plus"></i> Created On</label>
                            <input type="text" id="createdOn" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="modifiedOn"><i class="bi bi-calendar-event"></i> Modified On</label>
                            <input type="text" id="modifiedOn" class="form-input-readonly" readonly>
                        </div>

                        <div class="form-group">
                            <label for="supervisedOn"><i class="bi bi-calendar-check"></i> Supervised On</label>
                            <input type="text" id="supervisedOn" class="form-input-readonly" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons Sidebar -->
        <div class="action-sidebar">
            <button class="btn-sidebar btn-view" id="viewBtn">
                <i class="bi bi-eye-fill"></i> View
            </button>
            <button class="btn-sidebar btn-edit" id="editBtn">
                <i class="bi bi-pencil-fill"></i> Edit
            </button>
            <button class="btn-sidebar btn-save" id="saveBtn">
                <i class="bi bi-save-fill"></i> Save
            </button>
            <button class="btn-sidebar btn-sanction" id="sanctionBtn">
                <i class="bi bi-check-circle"></i> Sanction
            </button>
            <button class="btn-sidebar btn-reject" id="rejectBtn">
                <i class="bi bi-x-circle-fill"></i> Reject
            </button>
            <button class="btn-sidebar btn-cancel" id="cancelBtn">
                <i class="bi bi-x-circle"></i> Cancel
            </button>
        </div>
    </div>

    <!-- Branch Search Modal -->
    <div class="modal fade" id="branchSearchModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <iframe src="branch-search-modal.html" style="width: 100%; height: 500px; border: none;"></iframe>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="overdraft-sanction.js"></script>
</body>
</html>
