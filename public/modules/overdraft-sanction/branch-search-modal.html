<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="branch-search-modal.css">
</head>
<body>
    <div class="modal-container">
        <div class="modal-card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h6 class="mb-0"><i class="bi bi-building me-2"></i>Branch</h6>
                    <div class="window-controls">
                        <button class="btn-window" onclick="window.parent.closeBranchSearchModal()">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <!-- Search Criteria -->
                <div class="search-section">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Branch ID</label>
                                <div class="input-group">
                                    <select class="form-select form-select-sm" id="branchIdOperator">
                                        <option value="like">Like</option>
                                        <option value="equals">Equals</option>
                                        <option value="startsWith">Starts With</option>
                                    </select>
                                    <input type="text" class="form-control form-control-sm" id="searchBranchId" placeholder="Enter Branch ID">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Branch Name</label>
                                <div class="input-group">
                                    <select class="form-select form-select-sm" id="branchNameOperator">
                                        <option value="like">Like</option>
                                        <option value="equals">Equals</option>
                                        <option value="startsWith">Starts With</option>
                                    </select>
                                    <input type="text" class="form-control form-control-sm" id="searchBranchName" placeholder="Enter Branch Name">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-2">
                        <button class="btn btn-primary btn-sm" onclick="performSearch()">
                            <i class="bi bi-search me-1"></i>Search
                        </button>
                    </div>
                </div>

                <!-- Search Results -->
                <div class="results-section">
                    <h6 class="section-title">Search Results</h6>
                    <div class="table-container">
                        <table class="table table-sm table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 40px;"></th>
                                    <th>OurBranchID</th>
                                    <th>BranchName</th>
                                </tr>
                            </thead>
                            <tbody id="searchResultsTable">
                                <!-- Results will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn btn-nav" onclick="navigatePrevious()">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="btn btn-success btn-sm" onclick="selectBranch()">
                        <i class="bi bi-check-lg me-1"></i>OK
                    </button>
                    <button class="btn btn-nav" onclick="navigateNext()">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="branch-search-modal.js"></script>
</body>
</html>
