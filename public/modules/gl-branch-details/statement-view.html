<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL Account Statement</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="statement-view.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <aside class="sidebar" aria-label="Section navigation">
            </aside>

            <main class="content" role="main">
                <div id="statusMessage" class="status hidden" role="status" aria-live="polite">
                    <i class="bi" aria-hidden="true"></i>
                    <span class="status-text"></span>
                    <button type="button" class="status-close" aria-label="Dismiss message">✕</button>
                </div>

                <form id="statementViewForm" class="form" novalidate>
                    <div class="form-section" data-section="statement">
                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-file-text" aria-hidden="true"></i>
                                <span>GL Account Statement</span>
                            </div>
                            <div class="card-body form-grid four-col">
                                <div class="form-control-group">
                                    <label for="statementFor" class="form-label"><i class="bi bi-calendar-range" aria-hidden="true"></i><span>Statement For</span></label>
                                    <select id="statementFor" name="statementFor" class="form-control">
                                        <option value="current-month" selected>Current Month</option>
                                        <option value="last-month">Last Month</option>
                                        <option value="current-year">Current Year</option>
                                        <option value="last-year">Last Year</option>
                                        <option value="custom">Custom Range</option>
                                    </select>
                                </div>

                                <div class="form-control-group">
                                    <label for="fromDate" class="form-label"><i class="bi bi-calendar" aria-hidden="true"></i><span>From Date</span></label>
                                    <input type="date" id="fromDate" name="fromDate" class="form-control" value="2025-08-01">
                                </div>

                                <div class="form-control-group">
                                    <label for="toDate" class="form-label"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>To Date</span></label>
                                    <input type="date" id="toDate" name="toDate" class="form-control" value="2025-08-29">
                                </div>

                                <div class="form-control-group">
                                    <label for="reportCurrency" class="form-label"><i class="bi bi-currency-exchange" aria-hidden="true"></i><span>Report Currency</span></label>
                                    <select id="reportCurrency" name="reportCurrency" class="form-control">
                                        <option value="local" selected>Local Currency</option>
                                        <option value="usd">USD</option>
                                        <option value="eur">EUR</option>
                                        <option value="gbp">GBP</option>
                                    </select>
                                </div>
                            </div>
                        </section>

                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-table" aria-hidden="true"></i>
                                <span>Transaction Details</span>
                            </div>
                            <div class="card-body">
                                <div class="table-container">
                                    <table class="data-table" id="statementTable">
                                        <thead>
                                            <tr>
                                                <th>Trx Date</th>
                                                <th>Particulars</th>
                                                <th>Debit</th>
                                                <th>Credit</th>
                                                <th>Balance</th>
                                                <th>Tr.Def</th>
                                            </tr>
                                        </thead>
                                        <tbody id="statementTableBody">
                                            <tr class="empty-state">
                                                <td colspan="6">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>
                    </div>
                </form>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-action="print">
                        <i class="bi bi-printer"></i>
                        <span>Print</span>
                    </button>
                    <button type="button" class="btn btn-primary" data-action="view">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn btn-info" data-action="display-trx">
                        <i class="bi bi-list-ul"></i>
                        <span>Display Trx</span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-action="image">
                        <i class="bi bi-image"></i>
                        <span>Image</span>
                    </button>
                    <button type="button" class="btn btn-warning" data-action="internal-transfer">
                        <i class="bi bi-arrow-left-right"></i>
                        <span>Internal Transfer</span>
                    </button>
                    <button type="button" class="btn btn-danger" data-action="cancel">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-action="back">
                        <i class="bi bi-arrow-left"></i>
                        <span>Back</span>
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="statement-view.js"></script>
</body>
</html>
