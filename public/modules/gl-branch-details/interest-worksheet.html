<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Worksheet</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="interest-worksheet.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <aside class="sidebar" aria-label="Section navigation">
            </aside>

            <main class="content" role="main">
                <div id="statusMessage" class="status hidden" role="status" aria-live="polite">
                    <i class="bi" aria-hidden="true"></i>
                    <span class="status-text"></span>
                    <button type="button" class="status-close" aria-label="Dismiss message">✕</button>
                </div>

                <form id="interestWorksheetForm" class="form" novalidate>
                    <div class="form-section" data-section="worksheet">
                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-calculator" aria-hidden="true"></i>
                                <span>Interest Worksheet</span>
                            </div>
                            <div class="card-body form-grid two-col">
                                <div class="form-control-group">
                                    <label for="fromDate" class="form-label"><i class="bi bi-calendar" aria-hidden="true"></i><span>From Date</span></label>
                                    <input type="date" id="fromDate" name="fromDate" class="form-control" value="2025-08-01">
                                </div>

                                <div class="form-control-group">
                                    <label for="toDate" class="form-label"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>To Date</span></label>
                                    <input type="date" id="toDate" name="toDate" class="form-control" value="2025-08-29">
                                </div>
                            </div>
                        </section>

                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-table" aria-hidden="true"></i>
                                <span>Interest Calculation Details</span>
                            </div>
                            <div class="card-body">
                                <div class="table-container">
                                    <table class="data-table" id="interestTable">
                                        <thead>
                                            <tr>
                                                <th>Date</th>
                                                <th>Balance</th>
                                                <th>Interest Rate</th>
                                                <th>Interest</th>
                                                <th>Cumulative</th>
                                            </tr>
                                        </thead>
                                        <tbody id="interestTableBody">
                                            <tr class="empty-state">
                                                <td colspan="5">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>
                    </div>
                </form>

                <div class="form-actions">
                    <button type="button" class="btn btn-primary" data-action="view">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-action="print">
                        <i class="bi bi-printer"></i>
                        <span>Print</span>
                    </button>
                    <button type="button" class="btn btn-warning" data-action="reversal">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        <span>Reversal</span>
                    </button>
                    <button type="button" class="btn btn-danger" data-action="cancel">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-action="back">
                        <i class="bi bi-arrow-left"></i>
                        <span>Back</span>
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="interest-worksheet.js"></script>
</body>
</html>
