<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL Branch Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="gl-branch-details.css">
  <style>
    .gbd-label {
      font-size: 0.75rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #374151;
      font-weight: 600;
      line-height: 1.3;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="gbd-container">
  <div style="display: grid; grid-template-columns: 160px 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    
    <!-- Left Panel -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="position: relative;">
        <button class="gbd-left-button" id="dataEntryBtn" style="width: 100%; text-align: left; background-color: #ffffff; border: 1.5px solid rgba(15, 23, 42, 0.25); border-radius: 0.375rem; padding: 0.5rem 0.75rem; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: #1f2937; transition: all 0.2s ease;">
          <i class="bi bi-chevron-down" style="font-size: 0.7rem; margin-right: 4px;"></i>DataEntry
        </button>
        <div class="gbd-submenu" id="dataEntrySubmenu" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1.5px solid #5b9fd9; border-radius: 0.375rem; margin-top: 4px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); z-index: 1000; display: none;">
          <div class="gbd-submenu-item" data-action="blocking-unblocking" style="padding: 8px 12px; cursor: pointer; font-size: 0.75rem; color: #1f2937; border-bottom: 1px solid #e5e7eb; transition: all 0.2s ease;">
            Blocking/unblocking
          </div>
          <div class="gbd-submenu-item" data-action="cheque-book" style="padding: 8px 12px; cursor: pointer; font-size: 0.75rem; color: #1f2937; border-bottom: 1px solid #e5e7eb; transition: all 0.2s ease;">
            GL - Cheque Book
          </div>
          <div class="gbd-submenu-item" data-action="stop-payment" style="padding: 8px 12px; cursor: pointer; font-size: 0.75rem; color: #1f2937; border-bottom: 1px solid #e5e7eb; transition: all 0.2s ease;">
            GL - Stop Payment/Void Book
          </div>
          <div class="gbd-submenu-item" data-action="cancel-stop" style="padding: 8px 12px; cursor: pointer; font-size: 0.75rem; color: #1f2937; transition: all 0.2s ease;">
            GL - Cancel Stop
          </div>
        </div>
      </div>
      <div>
        <label style="font-size: 0.75rem; color: #6b7280; font-weight: 600; display: block; margin-bottom: 4px;">View</label>
        <select class="form-select gbd-left-select" id="viewSelect">
          <option selected>--Select--</option>
        </select>
      </div>
      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb;">
        <div style="font-size: 0.75rem; color: #6b7280; font-weight: 600; margin-bottom: 8px;">Recent Activities</div>
        <div style="font-size: 0.7rem; color: #9ca3af; background: #f3f4f6; border-radius: 0.375rem; padding: 8px; max-height: 200px; overflow-y: auto;">
          <div style="margin-bottom: 8px;">No recent activities</div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <!-- Row 1: Branch, Account -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Branch</label>
              <div class="input-group">
                <input type="text" class="form-control" id="branchIdField" value="0101" />
                <input type="text" class="form-control" id="headOfficeField" readonly />
                <button type="button" class="btn btn-lookup-branch" style="background: #517a8e; color: white; border-color: #517a8e;">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div>
              <label class="gbd-label">Account</label>
              <div class="input-group">
                <input type="text" class="form-control" id="accountIdField" />
                <input type="text" class="form-control" id="accountNameField" readonly />
                <button type="button" class="btn btn-lookup-account" style="background: #517a8e; color: white; border-color: #517a8e;">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- GL Branch Details Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #517a8e; color: white; padding: 0.5rem 0.85rem; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" onclick="this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up'); this.nextElementSibling.classList.toggle('collapsed');">
            <span>GL Branch Details</span>
            <i class="bi bi-chevron-down" style="font-size: 0.9rem;"></i>
          </div>

          <div class="collapsible-content">

          <!-- Row 1: Short Name, Currency -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Short Name</label>
              <input type="text" class="form-control" id="shortNameField" />
            </div>
            <div>
              <label class="gbd-label">Currency</label>
              <div class="input-group">
                <input type="text" class="form-control" id="currencyIdField" />
                <input type="text" class="form-control" id="currencyNameField" readonly />
              </div>
            </div>
          </div>

          <!-- Row 2: Main Account ID, Contra Account ID -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Main Account ID</label>
              <input type="text" class="form-control" id="mainAccountIdField" />
            </div>
            <div>
              <label class="gbd-label">Contra Account ID</label>
              <input type="text" class="form-control" id="contraAccountIdField" />
            </div>
          </div>

          <!-- Row 3: GL Type, GL Sub Type Group -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">GL Type</label>
              <input type="text" class="form-control" id="glTypeField" />
            </div>
            <div>
              <label class="gbd-label">GL Sub Type Group</label>
              <input type="text" class="form-control" id="glSubTypeGroupField" />
            </div>
          </div>

          <!-- Row 4: GL Sub Type, GL Category -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">GL Sub Type</label>
              <input type="text" class="form-control" id="glSubTypeField" />
            </div>
            <div>
              <label class="gbd-label">GL Category</label>
              <input type="text" class="form-control" id="glCategoryField" />
            </div>
          </div>

          <!-- Row 5: Posting Type, GL Class -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Posting Type</label>
              <input type="text" class="form-control" id="postingTypeField" />
            </div>
            <div>
              <label class="gbd-label">GL Class</label>
              <input type="text" class="form-control" id="glClassField" />
            </div>
          </div>

          <!-- Row 6: Do Revaluation -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Do Revaluation</label>
              <input type="checkbox" class="form-check-input" id="doRevaluationCheckbox" style="margin-top: 4px;" />
            </div>
            <div></div>
          </div>

          <!-- Row 8: Remarks -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="grid-column: 1 / -1;">
              <label class="gbd-label">Remarks</label>
              <textarea class="form-control" id="remarksField" rows="3" style="resize: vertical;"></textarea>
            </div>
          </div>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div style="padding: 12px; margin-bottom: 12px;">
          <div style="background: #517a8e; color: white; padding: 0.5rem 0.85rem; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" onclick="this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up'); this.nextElementSibling.classList.toggle('collapsed');">
            <span>Behind The Scene</span>
            <i class="bi bi-chevron-down" style="font-size: 0.9rem;"></i>
          </div>

          <div class="collapsible-content">
          
          <!-- Row 1: Opening Balance, Opening Foreign Balance, Balance -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Opening Balance</label>
              <input type="text" class="form-control" id="openingBalanceField" readonly />
            </div>
            <div>
              <label class="gbd-label">Opening Foreign Balance</label>
              <input type="text" class="form-control" id="openingForeignBalanceField" readonly />
            </div>
            <div>
              <label class="gbd-label">Balance</label>
              <input type="text" class="form-control" id="balanceField" readonly />
            </div>
          </div>

          <!-- Row 2: Foreign Balance, Closed On, Rate -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Foreign Balance</label>
              <input type="text" class="form-control" id="foreignBalanceField" readonly />
            </div>
            <div>
              <label class="gbd-label">Closed On</label>
              <input type="text" class="form-control" id="closedOnField" readonly />
            </div>
            <div>
              <label class="gbd-label">Rate</label>
              <input type="text" class="form-control" id="rateField" readonly />
            </div>
          </div>

          <!-- Row 3: Is Blocked, Mean Rate, Created By -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="gbd-label">Is Blocked</label>
              <div style="display: flex; align-items: center; margin-top: 6px;">
                <input type="checkbox" class="form-check-input" id="isBlockedCheckbox" disabled style="margin: 0;" />
              </div>
            </div>
            <div>
              <label class="gbd-label">Mean Rate</label>
              <input type="text" class="form-control" id="meanRateField" readonly />
            </div>
            <div>
              <label class="gbd-label">Created By</label>
              <input type="text" class="form-control" id="createdByField" readonly />
            </div>
          </div>

          <!-- Row 4: Supervised By, Created On, Supervised On -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div>
              <label class="gbd-label">Supervised By</label>
              <input type="text" class="form-control" id="supervisedByField" readonly />
            </div>
            <div>
              <label class="gbd-label">Created On</label>
              <input type="text" class="form-control" id="createdOnField" readonly />
            </div>
            <div>
              <label class="gbd-label">Supervised On</label>
              <input type="text" class="form-control" id="supervisedOnField" readonly />
            </div>
          </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto;">
      <button class="cm-shell__action" id="closeBtn">
        <i class="bi bi-x-circle"></i> Close
      </button>
      <button class="cm-shell__action" id="viewBtn">
        <i class="bi bi-eye"></i> View
      </button>
      <button class="cm-shell__action" id="addBtn">
        <i class="bi bi-plus-circle"></i> Add
      </button>
      <button class="cm-shell__action" id="saveBtn">
        <i class="bi bi-download"></i> Save
      </button>
      <button class="cm-shell__action" id="cancelBtn">
        <i class="bi bi-x-circle"></i> Cancel
      </button>
    </div>
  </div>
</div>

<script src="../../assets/js/services/shared/serviceLoader.js"></script>
<script>
  console.log('ServiceLoader available?', typeof window.ServiceLoader !== 'undefined');
  if (typeof window.ServiceLoader === 'undefined') {
    console.error('ServiceLoader failed to load! Check network tab for errors.');
  }
</script>
<script src="gl-branch-details.js"></script>
</body>
</html>
