<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanction Client Limit · Limits & Collateral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260204">
</head>

<body>
  <div class="window">
    <!-- Message Panel -->
    <div class="am-message-panel" id="messagePanel">
      <i class="bi bi-info-circle"></i>
      <span id="messageText"></span>
    </div>

    <div class="main-container">
      <!-- Left Sidebar (empty placeholder for layout consistency) -->
      <div class="sidebar" id="main-sidebar" style="display: none;"></div>

      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card" data-main-form>
          <!-- Section 1: Sanction Search & Details -->
          <div class="form-section" data-section="sanction-search">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-search"></i>Sanction Search & Details</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Sanction Search" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <!-- Row 1: Branch | Limit ID -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Branch</label>
                  <div class="kairo-branch-control" data-kairo-branch-control>
                    <input type="text" id="BranchId" value="0325" class="kairo-branch-control__id" aria-label="Branch ID">
                    <input type="text" id="BranchName" class="kairo-branch-control__name" aria-label="Branch Name" placeholder="Branch Name" readonly>
                    <button type="button" class="btn-lookup kairo-branch-control__lookup" data-target-input="BranchId" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Limit ID</label>
                  <div class="kairo-control" data-kairo-control>
                    <input type="text" id="LimitId" class="kairo-control__id bs-input-text" aria-label="Limit ID">
                    <button type="button" class="btn-lookup kairo-control__lookup" data-target-input="LimitId" aria-label="Search Limit"><i class="bi bi-search"></i></button>
                  </div>
                </div>
              </div>

              <!-- Row 2: Ref No | Sanctioned Date -->
              <div class="form-row two-col">
                <div class="col">
                  <label>Reference No.</label>
                  <input type="text" id="ReferenceNo" class="bs-input-text">
                </div>
                <div class="col">
                  <label class="label-blue">Sanctioned Date</label>
                  <div class="kairo-control" data-kairo-control>
                    <input type="text" id="SanctionedDate" class="bs-input-text" data-date-picker aria-label="Sanctioned Date">
                    <button type="button" class="btn-lookup btn-calendar" aria-label="Open Calendar"><i class="bi bi-calendar3"></i></button>
                  </div>
                </div>
              </div>

              <!-- Row 3: Sanctioned Limit -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Sanctioned Limit</label>
                  <input type="text" id="SanctionedLimit" class="bs-input-text money-field">
                </div>
                <div class="col"></div>
              </div>
            </div>
          </div>

          <!-- Section 2: Collateral Details -->
          <div class="form-section" data-section="collateral-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-safe2"></i>Collateral Details</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Collateral Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <!-- Row 1: Collateral ID | Charge Account -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Collateral ID</label>
                  <div class="kairo-control" data-kairo-control>
                    <input type="text" id="CollateralId" class="kairo-control__id bs-input-text" aria-label="Collateral ID">
                    <button type="button" class="btn-lookup kairo-control__lookup" data-target-input="CollateralId" aria-label="Search Collateral"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Charge Account</label>
                  <div class="kairo-account-control" data-kairo-account-control>
                    <input type="text" id="ChargeAccountId" class="kairo-account-control__id" aria-label="Charge Account ID">
                    <input type="text" id="ChargeAccountName" class="kairo-account-control__name" aria-label="Charge Account Name" placeholder="Account Name" readonly>
                    <button type="button" class="btn-lookup kairo-account-control__lookup" data-target-input="ChargeAccountId" aria-label="Search Charge Account"><i class="bi bi-search"></i></button>
                  </div>
                </div>
              </div>

              <!-- Row 2: Charge ID | Total Charge -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Charge ID</label>
                  <div class="kairo-control" data-kairo-control>
                    <input type="text" id="ChargeId" class="kairo-control__id bs-input-text" aria-label="Charge ID">
                    <input type="text" id="ChargeName" class="kairo-control__name bs-input-text" aria-label="Charge Name" placeholder="Charge Name" readonly>
                    <button type="button" class="btn-lookup kairo-control__lookup" data-target-input="ChargeId" aria-label="Search Charge"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Total Charge</label>
                  <input type="text" id="TotalCharge" class="bs-input-text money-field">
                </div>
              </div>

              <!-- Row 3: Charge Amount | Tax Amount -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Charge Amount</label>
                  <input type="text" id="ChargeAmount" class="bs-input-text money-field">
                </div>
                <div class="col">
                  <label class="label-blue">Tax Amount</label>
                  <input type="text" id="TaxAmount" class="bs-input-text money-field">
                </div>
              </div>

              <div class="table-responsive mt-2">
                <table class="table table-sm table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Collateral ID</th>
                      <th>Reference No.</th>
                      <th>Apportioned Ratio</th>
                      <th>Apportioned Value</th>
                      <th>Margin</th>
                      <th>Net Collateral Value</th>
                      <th>Collateral Status</th>
                    </tr>
                  </thead>
                  <tbody id="collateralTableBody">
                    <tr>
                      <td colspan="7" class="text-center text-muted">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Section 3: Behind The Scene -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="behind-scene">
                <div class="behind-scene-grid">
                  <!-- Row 1: Client ID -->
                  <div class="behind-scene-item" style="grid-column: span 2;">
                    <label>Client ID</label>
                    <div class="kairo-client-control" data-kairo-client-control>
                      <input type="text" id="ClientId" class="kairo-client-control__id" aria-label="Client ID">
                      <input type="text" id="ClientName" class="kairo-client-control__name" aria-label="Client Name" placeholder="Client Name" readonly>
                      <button type="button" class="btn-lookup kairo-client-control__lookup" data-target-input="ClientId" aria-label="Search Client"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="behind-scene-item"></div>

                  <!-- Row 2: Drawing Power | Effective Date | Expiry Date -->
                  <div class="behind-scene-item">
                    <label>Drawing Power</label>
                    <input type="text" id="DrawingPower" class="bs-input-text money-field" readonly>
                  </div>
                  <div class="behind-scene-item">
                    <label>Effective Date</label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" id="EffectiveDate" class="bs-input-text" data-date-picker aria-label="Effective Date">
                      <button type="button" class="btn-lookup btn-calendar" aria-label="Open Calendar"><i class="bi bi-calendar3"></i></button>
                    </div>
                  </div>
                  <div class="behind-scene-item">
                    <label>Expiry Date</label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" id="ExpiryDate" class="bs-input-text" data-date-picker aria-label="Expiry Date">
                      <button type="button" class="btn-lookup btn-calendar" aria-label="Open Calendar"><i class="bi bi-calendar3"></i></button>
                    </div>
                  </div>

                  <!-- Row 3: DP Definition | Remarks | Limit Type -->
                  <div class="behind-scene-item">
                    <label>DP Definition</label>
                    <select id="DpDefinition" class="bs-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="behind-scene-item">
                    <label>Remarks</label>
                    <input type="text" id="Remarks" class="bs-input-text">
                  </div>
                  <div class="behind-scene-item">
                    <label>Limit Type</label>
                    <select id="LimitType" class="bs-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>

                  <!-- Row 4: Net Collateral Value | Status | Total Apportioned Value -->
                  <div class="behind-scene-item">
                    <label>Net Collateral Value</label>
                    <input type="text" id="NetCollateralValue" class="bs-input-text money-field" readonly>
                  </div>
                  <div class="behind-scene-item">
                    <label>Status</label>
                    <input type="text" id="Status" class="bs-input-text" readonly>
                  </div>
                  <div class="behind-scene-item">
                    <label>Total Apportioned Value</label>
                    <input type="text" id="TotalApportionedValue" class="bs-input-text money-field" readonly>
                  </div>

                  <!-- Row 5: Withdrawn Date | Withdrawn Reason -->
                  <div class="behind-scene-item">
                    <label>Withdrawn Date</label>
                    <div class="value-row"><span class="behind-scene-value" id="WithdrawnDate" data-field="withdrawnDate"></span></div>
                  </div>
                  <div class="behind-scene-item" style="grid-column: span 2;">
                    <label>Withdrawn Reason</label>
                    <div class="value-row"><span class="behind-scene-value" id="WithdrawnReason" data-field="withdrawnReason"></span></div>
                  </div>
                </div>

                <!-- Audit Section -->
                <div class="audit-section">
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Created By</label>
                      <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Created On</label>
                      <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Modified By</label>
                      <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Modified On</label>
                      <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                    </div>
                  </div>
                  <div class="audit-block">
                    <div class="audit-item">
                      <label>Supervised By</label>
                      <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                    </div>
                    <div class="audit-item">
                      <label>Supervised On</label>
                      <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel">
        <div class="nav-group">
          <button class="btn-nav green" id="btnPrevious" aria-label="Previous Record" title="Previous Record"><i class="bi bi-chevron-left"></i></button>
          <span>Record</span>
          <button class="btn-nav green" id="btnNext" aria-label="Next Record" title="Next Record"><i class="bi bi-chevron-right"></i></button>
        </div>

        <div class="action-buttons">
          <button class="btn-action btn-view" id="btnView" type="button"><i class="bi bi-eye me-1"></i>View</button>
          <button class="btn-action" id="btnAdd" type="button"><i class="bi bi-plus-circle me-1"></i>Add</button>
          <button class="btn-action" id="btnEdit" type="button" disabled><i class="bi bi-pencil-square me-1"></i>Edit</button>
          <button class="btn-action" id="btnSave" type="button" disabled data-action="save"><i class="bi bi-check-lg me-1"></i>Save</button>
          <button class="btn-action" id="btnReject" type="button" disabled><i class="bi bi-slash-circle me-1"></i>Reject</button>
          <button class="btn-action btn-cancel" id="btnCancel" type="button" disabled data-action="cancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="sanction-client-limit.js"></script>
</body>

</html>
