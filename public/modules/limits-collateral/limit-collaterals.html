<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limit Collaterals · Limits &amp; Collateral</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="limit-collaterals.css" />
</head>

<body class="limit-collaterals client-maintenance copilot-theme" data-page="limit-collaterals">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form" autocomplete="off" novalidate>
      <!-- Left nav intentionally hidden for this screen (CSS) -->
      <aside class="cm-legacy-nav card-surface" aria-hidden="true"></aside>

      <section class="cm-legacy-content">
        <section class="card-surface" aria-label="Limit collaterals">
          <div class="ct-section-title">
            <span>Limit Collaterals</span>
          </div>

          <div class="ct-form-grid" role="group" aria-label="Limit collateral details">
            <label class="ct-label ct-label--primary" for="BranchId">Branch ID</label>
            <input id="BranchId" name="BranchId" type="text" class="form-control ct-control" />

            <label class="ct-label ct-label--primary" for="LimitId">Limit ID</label>
            <div class="ct-control input-group ct-control--sm">
              <input id="LimitId" name="LimitId" type="text" class="form-control" />
              <button id="btnSearchLimit" class="btn btn-outline-primary" type="button" data-action="search-limit" aria-label="Search limit">
                <i class="bi bi-search"></i>
              </button>
            </div>

            <label class="ct-label ct-label--primary" for="CollateralId">Collateral ID</label>
            <div class="ct-control input-group ct-control--sm">
              <input id="CollateralId" name="CollateralId" type="text" class="form-control" />
              <button id="btnSearchCollateral" class="btn btn-outline-primary" type="button" data-action="search-collateral" aria-label="Search collateral">
                <i class="bi bi-search"></i>
              </button>
            </div>

            <label class="ct-label" for="RefNo">Reference No</label>
            <input id="RefNo" name="RefNo" type="text" class="form-control ct-control" />

            <label class="ct-label" for="CollateralType">Collateral Type</label>
            <select id="CollateralType" name="CollateralType" class="form-select ct-control">
              <option value="">--Select--</option>
              <option value="IMMOVABLE">Immovable Property</option>
              <option value="MOVABLE">Movable Property</option>
              <option value="FINANCIAL">Financial Asset</option>
              <option value="OTHER">Other</option>
            </select>

            <label class="ct-label" for="CollateralValue">Collateral Value</label>
            <input id="CollateralValue" name="CollateralValue" type="text" class="form-control ct-control" />

            <label class="ct-label" for="ApportionedValue">Apportioned Value</label>
            <input id="ApportionedValue" name="ApportionedValue" type="text" class="form-control ct-control" />

            <label class="ct-label" for="ApportionmentRate">Apportionment Rate (%)</label>
            <input id="ApportionmentRate" name="ApportionmentRate" type="text" class="form-control ct-control" />

            <label class="ct-label" for="Remarks">Remarks</label>
            <textarea id="Remarks" name="Remarks" class="form-control ct-control" rows="3"></textarea>
          </div>
        </section>

        <section class="card-surface" aria-label="Behind the scene">
          <div class="ct-section-title ct-section-title--muted">
            <span>Behind The Scene</span>
          </div>

          <div class="ct-behind-grid">
            <div class="cbs-field">
              <label class="cbs-label" for="CreatedBy">Created By</label>
              <input id="CreatedBy" name="CreatedBy" class="form-control" type="text" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="ModifiedBy">Modified By</label>
              <input id="ModifiedBy" name="ModifiedBy" class="form-control" type="text" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="SupervisedBy">Supervised By</label>
              <input id="SupervisedBy" name="SupervisedBy" class="form-control" type="text" readonly />
            </div>

            <div class="cbs-field">
              <label class="cbs-label" for="CreatedOn">Created On</label>
              <input id="CreatedOn" name="CreatedOn" class="form-control" type="text" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="ModifiedOn">Modified On</label>
              <input id="ModifiedOn" name="ModifiedOn" class="form-control" type="text" readonly />
            </div>
            <div class="cbs-field">
              <label class="cbs-label" for="SupervisedOn">Supervised On</label>
              <input id="SupervisedOn" name="SupervisedOn" class="form-control" type="text" readonly />
            </div>
          </div>
        </section>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Mode switch</p>
          <button id="btnView" type="button" class="cm-shell__action" data-shell-mode="View" aria-label="Switch to view mode">View</button>
          <button id="btnAdd" type="button" class="cm-shell__action" data-shell-mode="Add" aria-label="Switch to add mode">Add</button>
          <button id="btnEdit" type="button" class="cm-shell__action" data-shell-mode="Update" aria-label="Switch to edit mode">Edit</button>
        </div>
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Navigation</p>
          <button id="btnPrevious" type="button" class="cm-shell__action cm-shell__action--ghost" data-stepper-action="prev" aria-label="Navigate to previous record">
            &lt;&lt; Previous
          </button>
          <button id="btnNext" type="button" class="cm-shell__action cm-shell__action--ghost" data-stepper-action="next" aria-label="Navigate to next record">
            &gt;&gt; Next
          </button>
        </div>
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Workflow</p>
          <button id="btnDelete" type="button" class="cm-shell__action cm-shell__action--danger" data-submit-action="delete" aria-label="Delete current limit collateral">
            Delete
          </button>
          <button id="btnSave" type="button" class="cm-shell__action cm-shell__action--success" data-submit-action="save" aria-label="Save limit collateral">
            Save
          </button>
          <button id="btnCancel" type="button" class="cm-shell__action cm-shell__action--danger" data-submit-action="cancel" aria-label="Cancel current operation">
            Cancel
          </button>
        </div>
      </aside>
    </form>
  </div>

  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="limit-collaterals.js"></script>
</body>

</html>
