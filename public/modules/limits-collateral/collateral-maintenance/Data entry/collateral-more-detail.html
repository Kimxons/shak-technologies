<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collateral Properties Details · Kairo Banking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../../assets/css/styles.css">
</head>
<body class="collateral-properties-details">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-info-circle am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Collateral Properties Details</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <div class="main-container">

      <!-- Form Content -->
      <main class="form-content" role="region" aria-label="More Details form">
        <div class="form-card" data-main-form>
          <form id="moreDetailsForm" autocomplete="off" novalidate>
            <div class="form-section" data-section="more-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Collateral Properties Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Collateral Properties Details" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>

              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="documentNo">Document No</label>
                    <input type="text" id="documentNo" name="documentNo" class="bs-input-text">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="referenceNo">Reference No.</label>
                    <input type="text" id="referenceNo" name="referenceNo" class="bs-input-text">
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="documentDate">Document Date</label>
                    <input type="date" id="documentDate" name="documentDate" class="bs-input-date">
                  </div>
                  <div class="col"></div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="city">City</label>
                    <select id="city" name="city" class="bs-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col"></div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="landArea">Land Area</label>
                    <input type="text" id="landArea" name="landArea" class="bs-input-number">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="superBuildUpArea">Super Build Up Area</label>
                    <input type="text" id="superBuildUpArea" name="superBuildUpArea" class="bs-input-number">
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="constructionYear">Construction Year</label>
                    <input type="number" id="constructionYear" name="constructionYear" min="1900" max="2100" class="bs-input-number">
                  </div>
                  <div class="col"></div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="builderName">Builder Name</label>
                    <input type="text" id="builderName" name="builderName" class="bs-input-text">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="typeOfBuilding">Type Of Building</label>
                    <select id="typeOfBuilding" name="typeOfBuilding" class="bs-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="certificateOfTitleNumber">Certificate Of Title Number</label>
                    <input type="text" id="certificateOfTitleNumber" name="certificateOfTitleNumber" class="bs-input-text">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="placeIdentificationNumber">Place Identification Number</label>
                    <input type="text" id="placeIdentificationNumber" name="placeIdentificationNumber" class="bs-input-text">
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="location">Location</label>
                  <input type="text" id="location" name="location" class="bs-input-text">
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="leased">Leased</label>
                    <input type="checkbox" id="leased" name="leased" class="bs-checkbox">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="leaseExpiryDate">Lease Expiry Date</label>
                    <input type="date" id="leaseExpiryDate" name="leaseExpiryDate" class="bs-input-date">
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="leaseLoanAmount">Lease Loan Amount</label>
                    <input type="number" id="leaseLoanAmount" name="leaseLoanAmount" step="0.01" class="bs-input-number">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="constructionCost">Construction Cost</label>
                    <input type="number" id="constructionCost" name="constructionCost" step="0.01" class="bs-input-number">
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="valuationDate">Valuation Date</label>
                    <input type="date" id="valuationDate" name="valuationDate" class="bs-input-date">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="valuedBy">Valued By</label>
                    <input type="text" id="valuedBy" name="valuedBy" class="bs-input-text">
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="marketValue">Market Value</label>
                    <input type="number" id="marketValue" name="marketValue" step="0.01" class="bs-input-number">
                  </div>
                  <div class="col">
                    <label class="label-blue" for="invoiceValue">Invoice Value</label>
                    <input type="number" id="invoiceValue" name="invoiceValue" step="0.01" class="bs-input-number">
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="forcedSaleValue">Forced Sale Value</label>
                    <input type="number" id="forcedSaleValue" name="forcedSaleValue" step="0.01" class="bs-input-number">
                  </div>
                  <div class="col">
                    <div class="form-row two-col">
                      <div class="col">
                        <label class="label-blue" for="latitude">Latitude</label>
                        <input type="text" id="latitude" name="latitude" class="bs-input-text" placeholder="-1.304804">
                      </div>
                      <div class="col">
                        <label class="label-blue" for="longitude">Longitude</label>
                        <input type="text" id="longitude" name="longitude" class="bs-input-text" placeholder="36.847397">
                      </div>
                    </div>
                    <div class="form-row">
                      <button type="button" class="btn-action btn-view" onclick="viewMap()" aria-label="View Map"><i class="bi bi-map"></i>View Map</button>
                    </div>
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="address">Address</label>
                  <textarea id="address" name="address" rows="1" class="bs-textarea js-autogrow-textarea"></textarea>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="remarksDetail">Remarks</label>
                  <textarea id="remarksDetail" name="remarksDetail" rows="1" class="bs-textarea js-autogrow-textarea"></textarea>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label for="collateralValueDetail">Collateral Value</label>
                    <input type="number" id="collateralValueDetail" name="collateralValueDetail" step="0.01" class="bs-input-number" readonly>
                  </div>
                  <div class="col">
                    <label for="currencyIdDetail">Currency ID</label>
                    <input type="text" id="currencyIdDetail" name="currencyIdDetail" class="bs-input-text" readonly>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="usedCollateralValueDetail">Used Collateral Value</label>
                    <input type="number" id="usedCollateralValueDetail" name="usedCollateralValueDetail" step="0.01" class="bs-input-number" readonly>
                  </div>
                  <div class="col">
                    <label for="withdrawnDateDetail">Withdrawn Date</label>
                    <input type="date" id="withdrawnDateDetail" name="withdrawnDateDetail" class="bs-input-date" readonly>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="collateralStatus">Collateral Status</label>
                    <input type="text" id="collateralStatus" name="collateralStatus" class="bs-input-text" readonly>
                  </div>
                  <div class="col"></div>
                </div>

                <div class="audit-section audit-section--summary">
                  <div class="audit-cell">
                    <span class="audit-label">Created By</span>
                    <span class="audit-value"><input type="text" id="createdByDetail" name="createdByDetail" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Record Status</span>
                    <span class="audit-value"><input type="text" id="recordStatus" name="recordStatus" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Supervised By</span>
                    <span class="audit-value"><input type="text" id="supervisedByDetail" name="supervisedByDetail" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Created On</span>
                    <span class="audit-value"><input type="text" id="createdOnDetail" name="createdOnDetail" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Supervised On</span>
                    <span class="audit-value"><input type="text" id="supervisedOnDetail" name="supervisedOnDetail" class="bs-input-text" readonly></span>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </main>

      <!-- Right Action Panel -->
      <aside class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action" onclick="addDetail()"><i class="bi bi-plus-circle"></i>Add</button>
          <button type="button" class="btn-action" onclick="editDetail()"><i class="bi bi-pencil"></i>Edit</button>
          <button type="button" class="btn-action btn-delete" onclick="deleteDetail()"><i class="bi bi-trash"></i>Delete</button>
          <button type="button" class="btn-action btn-save" id="saveDetailBtn" onclick="saveDetail()" disabled><i class="bi bi-check-circle"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" id="cancelDetailBtn" onclick="cancelDetail()" disabled><i class="bi bi-x-circle"></i>Cancel</button>
        </div>

        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" onclick="goBackToMain()"><i class="bi bi-arrow-left-circle"></i>Back</button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Environment Configuration -->
  <script>
    window.Environment = window.Environment || {};
    window.Environment.baseUrlCommon = 'http://172.16.2.31:3306';
    window.Environment.baseUrlCustomCodes = 'http://172.16.2.31:3306';
    window.Environment.baseUrlSystemCodes = 'http://172.16.2.31:3306';
  </script>
  
  <!-- Services -->
  <script src="../../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../../assets/js/services/collateral/collateralService.js"></script>
  
  <!-- Scripts -->
  <script src="collateral-properties-details.js"></script>

  <script>
    // Auto-grow textarea (scoped to .js-autogrow-textarea only)
    (function () {
      // Calculate a one-line pixel height using computed styles (line-height + padding + borders)
      function setOneLineHeight(el) {
        const cs = window.getComputedStyle(el);

        // line-height can be 'normal' in some browsers; approximate if so.
        let lineHeight = parseFloat(cs.lineHeight);
        if (Number.isNaN(lineHeight)) {
          const fontSize = parseFloat(cs.fontSize) || 16;
          lineHeight = fontSize * 1.2;
        }

        const paddingTop = parseFloat(cs.paddingTop) || 0;
        const paddingBottom = parseFloat(cs.paddingBottom) || 0;
        const borderTop = parseFloat(cs.borderTopWidth) || 0;
        const borderBottom = parseFloat(cs.borderBottomWidth) || 0;

        const oneLine = lineHeight + paddingTop + paddingBottom + borderTop + borderBottom;
        el.style.height = oneLine + 'px';
      }

      // Resize textarea to fit content; reset height before measuring to avoid jump issues
      function autoResize(el) {
        setOneLineHeight(el);
        el.style.height = el.scrollHeight + 'px';
      }

      function initAutoGrow(el) {
        if (!el) return;

        // One line on load, unless prefilled (e.g., loaded from parent record)
        if ((el.value || '').trim().length > 0) {
          autoResize(el);
        } else {
          setOneLineHeight(el);
        }

        // Grow/shrink as the user types
        el.addEventListener('input', function () {
          autoResize(el);
        });
      }

      function init() {
        // Apply only to the two intended textareas on this page
        initAutoGrow(document.getElementById('address'));
        initAutoGrow(document.getElementById('remarksDetail'));
      }

      // Run after other DOMContentLoaded handlers (e.g., record load from parent)
      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
