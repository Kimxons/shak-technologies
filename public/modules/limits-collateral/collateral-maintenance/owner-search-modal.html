<!-- Owner Search Modal -->
<div class="modal fade" id="ownerSearchModal" tabindex="-1" aria-labelledby="ownerSearchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ownerSearchModalLabel"><i class="bi bi-person-search"></i> Search Owner (Client)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-6">
                        <label class="form-label" for="searchOwnerIdFilter">Client ID</label>
                        <div class="input-group input-group-sm">
                            <select id="searchOwnerIdOperator" class="form-select" aria-label="Client ID operator">
                                <option value="like" selected>Like</option>
                                <option value="equals">Equals</option>
                                <option value="startswith">Starts With</option>
                            </select>
                            <input type="text" id="searchOwnerIdFilter" class="form-control" placeholder="Enter Client ID" aria-label="Client ID filter">
                        </div>
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label" for="searchOwnerNameFilter">Name</label>
                        <div class="input-group input-group-sm">
                            <select id="searchOwnerNameOperator" class="form-select" aria-label="Client name operator">
                                <option value="like" selected>Like</option>
                                <option value="equals">Equals</option>
                                <option value="startswith">Starts With</option>
                            </select>
                            <input type="text" id="searchOwnerNameFilter" class="form-control" placeholder="Enter Client Name" aria-label="Client name filter">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2 my-3 flex-wrap">
                    <button type="button" class="btn btn-primary" id="btnSearchOwners"><i class="bi bi-search"></i> Search</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnClearOwnerSearch"><i class="bi bi-x-circle"></i> Clear</button>
                </div>

                <div class="card">
                    <div class="card-header"><i class="bi bi-table"></i> Search Results</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 50px;">#</th>
                                        <th style="width: 120px;">ClientID</th>
                                        <th>Name</th>
                                        <th style="width: 120px;">IDNumber</th>
                                        <th style="width: 100px;">ClientType</th>
                                    </tr>
                                </thead>
                                <tbody id="ownerSearchResults">
                                    <tr>
                                        <td colspan="5" class="no-results text-muted"><i class="bi bi-hourglass-split"></i> Loading clients...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnPrevOwnerPage" disabled><i class="bi bi-arrow-left"></i> Previous</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnNextOwnerPage" disabled>Next <i class="bi bi-arrow-right"></i></button>
                    </div>
                    <div class="text-muted"><span id="ownerPageInfo">Page 1 of 1 (0 results)</span></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancel</button>
                <button type="button" class="btn btn-success" id="btnSelectOwner" disabled><i class="bi bi-check-circle"></i> OK</button>
            </div>
        </div>
    </div>
</div>
