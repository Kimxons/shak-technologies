<!-- Collateral Search Modal -->
<div class="modal fade" id="collateralSearchModal" tabindex="-1" aria-labelledby="collateralSearchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="collateralSearchModalLabel"><i class="bi bi-search"></i> Search Collateral</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-6">
                        <label class="form-label" for="searchCollateralIdFilter">Collateral ID</label>
                        <div class="input-group input-group-sm">
                            <select id="searchCollateralIdOperator" class="form-select" aria-label="Collateral ID operator">
                                <option value="like" selected>Like</option>
                                <option value="equals">Equals</option>
                                <option value="startswith">Starts With</option>
                            </select>
                            <input type="text" id="searchCollateralIdFilter" class="form-control" placeholder="Enter Collateral ID" aria-label="Collateral ID filter">
                        </div>
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label" for="searchDescriptionFilter">Description</label>
                        <div class="input-group input-group-sm">
                            <select id="searchDescriptionOperator" class="form-select" aria-label="Description operator">
                                <option value="like" selected>Like</option>
                                <option value="equals">Equals</option>
                                <option value="startswith">Starts With</option>
                            </select>
                            <input type="text" id="searchDescriptionFilter" class="form-control" placeholder="Enter Description" aria-label="Description filter">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2 my-3 flex-wrap">
                    <button type="button" class="btn btn-primary" id="btnSearchCollaterals"><i class="bi bi-search"></i> Search</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnClearCollateralSearch"><i class="bi bi-x-circle"></i> Clear</button>
                </div>

                <div class="card">
                    <div class="card-header"><i class="bi bi-table"></i> Search Results</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 50px;">#</th>
                                        <th style="width: 100px;">BranchID</th>
                                        <th style="width: 150px;">CollateralID</th>
                                        <th>Description</th>
                                        <th style="width: 120px;">OwnerClientID</th>
                                        <th style="width: 120px;">CollateralType</th>
                                    </tr>
                                </thead>
                                <tbody id="collateralSearchResults">
                                    <tr>
                                        <td colspan="6" class="no-results text-muted"><i class="bi bi-hourglass-split"></i> Loading collaterals...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnPrevCollateralPage" disabled><i class="bi bi-arrow-left"></i> Previous</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnNextCollateralPage" disabled>Next <i class="bi bi-arrow-right"></i></button>
                    </div>
                    <div class="text-muted"><span id="collateralPageInfo">Page 1 of 1 (0 results)</span></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancel</button>
                <button type="button" class="btn btn-success" id="btnSelectCollateral" disabled><i class="bi bi-check-circle"></i> OK</button>
            </div>
        </div>
    </div>
</div>
