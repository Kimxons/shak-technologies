<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collateral Maintenance · Kairo Banking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../assets/css/styles.css">
</head>
<body class="collateral-maintenance">
  <style>
    /* Scoped auto-grow textarea (only those explicitly marked) */
    body.collateral-maintenance textarea.bs-textarea.js-autogrow-textarea {
      resize: none;       /* fixed width (no horizontal resize) */
      overflow-y: hidden; /* no vertical scrollbar while typing */
    }
  </style>
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-shield-check am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Collateral Maintenance</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <div class="main-container">
      <!-- Left Sidebar -->
      <div class="sidebar" id="main-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-shield-check"></i><span>COLLATERAL</span></span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="sidebar-search">
          <input type="text" class="sidebar-search__input" id="submoduleSearch" placeholder="Search submodules..." aria-label="Search submodules">
          <i class="bi bi-search sidebar-search__icon"></i>
          <button type="button" class="sidebar-search__clear" id="submoduleSearchClear" aria-label="Clear search">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>

        <nav class="sidebar-content" role="navigation" aria-label="Submodules">
          <div class="nav-section nav-section--card is-open" data-nav-section data-section-name="Data Entry">
            <div class="nav-header nav-header--card" data-tooltip="Data Entry">
              <div class="nav-header__content">
                <i class="bi bi-folder-fill nav-header__icon"></i>
                <span class="nav-label nav-label--card">Data Entry</span>
              </div>
              <div class="nav-header__badge">
                <span class="nav-badge">2</span>
                <button type="button" class="nav-arrow nav-arrow--card" aria-label="Toggle Data Entry" aria-expanded="true" aria-controls="cm-nav-dataentry">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items nav-items--card" id="cm-nav-dataentry">
              <div class="sidebar-item sidebar-item--enhanced" role="button" tabindex="0" onclick="openCollateralPropertiesDetailsModal(event)" data-tooltip="Collateral More Details" aria-label="Open Collateral More Details">
                <div class="sidebar-item__content">
                  <i class="bi bi-info-circle sidebar-item__icon"></i>
                  <div class="sidebar-item__text">
                    <div class="sidebar-item__title">Collateral More Details</div>
                    <div class="sidebar-item__description">Open additional info</div>
                  </div>
                </div>
              </div>
              <div class="sidebar-item sidebar-item--enhanced" data-tooltip="Insurance Info" role="button" tabindex="0" aria-label="Insurance Info" onclick="showStatusMessage('Insurance Info is not available on this screen yet.', 'info')">
                <div class="sidebar-item__content">
                  <i class="bi bi-file-text sidebar-item__icon"></i>
                  <div class="sidebar-item__text">
                    <div class="sidebar-item__title">Insurance Info</div>
                    <div class="sidebar-item__description">Maintain insurance details</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <!-- Form Content -->
      <main class="form-content" role="region" aria-label="Collateral Maintenance form">
        <div class="form-card" data-main-form>
          <form id="collateralForm" autocomplete="off" novalidate>
            <!-- Collateral Details Section -->
            <div class="form-section" data-section="collateral-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Collateral Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Collateral Details" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="branchId">Branch</label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" id="branchId" name="branchId" class="kairo-branch-control__id" aria-label="Branch ID" required>
                      <input type="text" id="branchName" name="branchName" class="kairo-branch-control__name" aria-label="Branch Name" placeholder="Branch Name" readonly>
                      <button type="button" class="btn-lookup kairo-branch-control__lookup" onclick="searchBranch()" aria-label="Search Branch" title="Search"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="collateralId">Collateral ID</label>
                    <div class="kairo-control" data-kairo-collateral-control>
                      <input type="text" id="collateralId" name="collateralId" class="kairo-control__id" aria-label="Collateral ID" required>
                      <button type="button" class="btn-lookup kairo-control__lookup" onclick="searchCollateral()" aria-label="Search Collateral" title="Search"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <div class="form-row form-row--stack">
                  <label class="label-blue" for="description">Description</label>
                  <input type="text" id="description" name="description" class="bs-input-text" required>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="collateralType">Collateral Type</label>
                    <select id="collateralType" name="collateralType" class="bs-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ownerId">Owner ID</label>
                    <div class="kairo-control" data-kairo-owner-control>
                      <input type="text" id="ownerId" name="ownerId" class="kairo-control__id" aria-label="Owner ID">
                      <input type="text" id="ownerDescription" name="ownerDescription" class="kairo-control__name" aria-label="Owner Description" placeholder="Owner Description" readonly>
                      <button type="button" class="btn-lookup kairo-control__lookup" onclick="searchOwner()" aria-label="Search Owner" title="Search"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="lodgedDate">Lodged Date</label>
                    <input type="date" id="lodgedDate" name="lodgedDate" class="bs-input-date">
                  </div>
                  <div class="col">
                    <label for="buyingDate">Buying Date</label>
                    <input type="date" id="buyingDate" name="buyingDate" class="bs-input-date">
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="insured">Insured</label>
                    <input type="checkbox" id="insured" name="insured" class="bs-checkbox">
                  </div>
                  <div class="col">
                    <label for="collateralAge">Collateral Age</label>
                    <input type="number" id="collateralAge" name="collateralAge" class="bs-input-number" min="0">
                  </div>
                </div>

                <div class="form-row">
                  <label class="label-blue" for="natureOfCharge">Nature Of Charge</label>
                  <select id="natureOfCharge" name="natureOfCharge" class="bs-select">
                    <option value="">--Select--</option>
                  </select>
                </div>

                <div class="form-row">
                  <label for="remarks">Remarks</label>
                  <textarea id="remarks" name="remarks" class="bs-textarea js-autogrow-textarea" rows="1"></textarea>
                </div>
              </div>
            </div>

            <!-- Behind The Scene Section -->
            <div class="form-section" data-section="behind-scene">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label for="collateralValue">Collateral Value</label>
                    <input type="number" id="collateralValue" name="collateralValue" class="bs-input-number" step="0.01" readonly>
                  </div>
                  <div class="col">
                    <label for="currencyId">Currency ID</label>
                    <input type="text" id="currencyId" name="currencyId" class="bs-input-text" readonly>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="usedCollateralValue">Used Collateral Value</label>
                    <input type="number" id="usedCollateralValue" name="usedCollateralValue" class="bs-input-number" step="0.01" readonly>
                  </div>
                  <div class="col">
                    <label for="valueType">Value Type</label>
                    <input type="text" id="valueType" name="valueType" class="bs-input-text" readonly>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label for="withdrawnDate">Withdrawn Date</label>
                    <input type="date" id="withdrawnDate" name="withdrawnDate" class="bs-input-date" readonly>
                  </div>
                  <div class="col">
                    <label for="status">Status</label>
                    <input type="text" id="status" name="status" class="bs-input-text" readonly>
                  </div>
                </div>

                <div class="form-row">
                  <label for="withdrawnReason">Withdrawn Reason</label>
                  <textarea id="withdrawnReason" name="withdrawnReason" class="bs-textarea js-autogrow-textarea" rows="1" readonly></textarea>
                </div>

                <div class="audit-section audit-section--summary">
                  <div class="audit-cell">
                    <span class="audit-label">Created By</span>
                    <span class="audit-value"><input type="text" id="createdBy" name="createdBy" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Modified By</span>
                    <span class="audit-value"><input type="text" id="modifiedBy" name="modifiedBy" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Supervised By</span>
                    <span class="audit-value"><input type="text" id="supervisedBy" name="supervisedBy" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Created On</span>
                    <span class="audit-value"><input type="text" id="createdOn" name="createdOn" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Modified On</span>
                    <span class="audit-value"><input type="text" id="modifiedOn" name="modifiedOn" class="bs-input-text" readonly></span>
                  </div>
                  <div class="audit-cell">
                    <span class="audit-label">Supervised On</span>
                    <span class="audit-value"><input type="text" id="supervisedOn" name="supervisedOn" class="bs-input-text" readonly></span>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </main>

      <!-- Right Action Panel -->
      <aside class="action-panel" aria-label="Form actions">
        <div class="nav-group" aria-label="Navigation">
          <button type="button" class="btn-nav" onclick="handlePrevious()" title="Previous" aria-label="Previous"><i class="bi bi-arrow-left"></i></button>
          <button type="button" class="btn-nav" onclick="handleNext()" title="Next" aria-label="Next"><i class="bi bi-arrow-right"></i></button>
        </div>

        <div class="action-buttons">
          <button type="button" class="btn-action btn-delete" onclick="handleWithdraw()" title="Withdraw" aria-label="Withdraw">
            <i class="bi bi-arrow-down-circle"></i>Withdraw
          </button>
        </div>

        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view" onclick="handleView()" title="View"><i class="bi bi-eye"></i>View</button>
          <button type="button" class="btn-action" onclick="handleAdd()" title="Add"><i class="bi bi-plus-circle"></i>Add</button>
          <button type="button" class="btn-action" onclick="handleEdit()" title="Edit"><i class="bi bi-pencil"></i>Edit</button>
          <button type="button" class="btn-action btn-delete" data-action="delete" onclick="handleDelete()" title="Delete"><i class="bi bi-trash"></i>Delete</button>
          <button type="button" class="btn-action btn-save" data-action="save" id="saveBtn" onclick="handleSave()" disabled title="Save"><i class="bi bi-check-circle"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel" id="cancelBtn" onclick="handleCancel()" disabled title="Cancel"><i class="bi bi-x-circle"></i>Cancel</button>
        </div>
      </aside>
    </div>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <!-- Collateral Properties Details Modal (Bootstrap + shared iframe styling) -->
  <div class="modal fade" id="collateralPropertiesDetailsModal" tabindex="-1" aria-labelledby="collateralPropertiesDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header d-none">
          <h5 class="modal-title" id="collateralPropertiesDetailsModalLabel"><i class="bi bi-info-circle"></i> Collateral Properties Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body modal-body--iframe p-0">
          <iframe class="legacy-modal__iframe" src="Data entry/collateral-more-detail.html" title="Collateral More Details"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Collateral Search Modal -->
  <div id="collateralSearchModalContainer"></div>
  
  <!-- Owner Search Modal -->
  <div id="ownerSearchModalContainer"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Environment Configuration -->
  <script>
    window.Environment = window.Environment || {};
    window.Environment.baseUrlCommon = 'http://172.16.2.31:3306';
    window.Environment.baseUrlCustomCodes = 'http://172.16.2.31:3306';
    window.Environment.baseUrlSystemCodes = 'http://172.16.2.31:3306';
  </script>
  
  <!-- Services -->
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../assets/js/services/shared/customCodesLookupService.js"></script>
  
  <!-- Scripts -->
  <script src="collateral-search-modal.js"></script>
  <script src="owner-search-modal.js"></script>
  <script src="collateral-maintenance.js"></script>
  
  <!-- Load Search Modal HTML -->
  <script>
    // Load Collateral Search Modal
    fetch('collateral-search-modal.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('collateralSearchModalContainer').innerHTML = html;
        // Initialize modal event handlers after HTML is loaded
        if (typeof setupCollateralSearchModal === 'function') {
          setupCollateralSearchModal();
        }
      })
      .catch(error => console.error('Error loading collateral search modal:', error));
    
    // Load Owner Search Modal
    fetch('owner-search-modal.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('ownerSearchModalContainer').innerHTML = html;
        // Initialize modal event handlers after HTML is loaded
        if (typeof setupOwnerSearchModal === 'function') {
          setupOwnerSearchModal();
        }
      })
      .catch(error => console.error('Error loading owner search modal:', error));
  </script>
</body>
</html>
