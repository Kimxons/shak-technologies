<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collateral Types · Limits & Collateral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260204">
</head>

<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="window">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card">
                    <!-- Collateral Type Search Section - Collapsible -->
                    <div class="form-section" data-section="collateral-type-search">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-search"></i>Collateral Type Search</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Collateral Type Search" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Type ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="TypeId" class="kairo-control__id" aria-label="Type ID">
                                        <button type="button" class="btn-lookup kairo-control__lookup" id="btnSearchType" aria-label="Search Type"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Description</label>
                                    <input type="text" id="Description" class="bs-input-text">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Collateral Type Details Section - Collapsible -->
                    <div class="form-section" data-section="collateral-type-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-card-list"></i>Collateral Type Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Collateral Type Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <!-- Row 1: Category, Value Type -->
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Category</label>
                                    <select id="Category" class="bs-select">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Value Type</label>
                                    <select id="ValueType" class="bs-select">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Row 2: Revaluation Type, Revaluation Rate -->
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Revaluation Type</label>
                                    <select id="RevaluationType" class="bs-select">
                                        <option value="">--Select--</option>
                                        <option value="APPRECIATION">Appreciation</option>
                                        <option value="DEPRECIATION">Depreciation</option>
                                        <option value="NO_REVALUATION">No Revaluation</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label>Revaluation Rate</label>
                                    <input type="text" id="RevaluationRate" class="bs-input-text">
                                </div>
                            </div>

                            <!-- Row 3: Margin, Insurance Required -->
                            <div class="form-row two-col">
                                <div class="col">
                                    <label>Margin</label>
                                    <input type="text" id="Margin" class="bs-input-text">
                                </div>
                                <div class="col">
                                    <label for="InsuranceRequired">Insurance Required</label>
                                    <input type="checkbox" id="InsuranceRequired" class="bs-checkbox" aria-label="Insurance Required">
                                </div>
                            </div>

                            <!-- Row 4: Currency ID -->
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Currency ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="CurrencyIdCode" class="kairo-control__id" aria-label="Currency ID">
                                        <input type="text" id="CurrencyIdName" class="kairo-control__name" aria-label="Currency Name" placeholder="Currency Name" readonly>
                                        <button type="button" class="btn-lookup kairo-control__lookup" id="btnSearchCurrency" aria-label="Search Currency"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <!-- Empty column for alignment -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Behind the Scene Section - Collapsible -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <!-- Audit Trail - Using audit-section CSS pattern -->
                            <div class="audit-section">
                                <div class="audit-block">
                                    <div class="audit-item">
                                        <label>Created By</label>
                                        <input type="text" id="CreatedBy" readonly class="audit-input">
                                    </div>
                                    <div class="audit-item">
                                        <label>Created On</label>
                                        <input type="text" id="CreatedOn" readonly class="audit-input">
                                    </div>
                                </div>
                                <div class="audit-block">
                                    <div class="audit-item">
                                        <label>Modified By</label>
                                        <input type="text" id="ModifiedBy" readonly class="audit-input">
                                    </div>
                                    <div class="audit-item">
                                        <label>Modified On</label>
                                        <input type="text" id="ModifiedOn" readonly class="audit-input">
                                    </div>
                                </div>
                                <div class="audit-block">
                                    <div class="audit-item">
                                        <label>Supervised By</label>
                                        <input type="text" id="SupervisedBy" readonly class="audit-input">
                                    </div>
                                    <div class="audit-item">
                                        <label>Supervised On</label>
                                        <input type="text" id="SupervisedOn" readonly class="audit-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="nav-group">
                    <button class="btn-nav green" id="btnPrevious" aria-label="Previous Record"><i class="bi bi-chevron-left"></i></button>
                    <span>Record</span>
                    <button class="btn-nav green" id="btnNext" aria-label="Next Record"><i class="bi bi-chevron-right"></i></button>
                </div>

                <div class="action-buttons">
                    <button class="btn-action btn-view" type="button" id="btnView"><i class="bi bi-eye me-1"></i>View</button>
                    <button class="btn-action" type="button" id="btnAdd"><i class="bi bi-plus-circle me-1"></i>Add</button>
                    <button class="btn-action" type="button" id="btnEdit" disabled><i class="bi bi-pencil-square me-1"></i>Edit</button>
                    <button class="btn-action" type="button" id="btnDelete" disabled><i class="bi bi-trash3 me-1"></i>Delete</button>
                    <button class="btn-action" type="button" id="btnSave" disabled><i class="bi bi-check-lg me-1"></i>Save</button>
                    <button class="btn-action btn-cancel" type="button" id="btnCancel"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Message Panel -->
    <div id="formToast" class="am-message-panel hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/utils/global-utils.js"></script>
    <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../../../assets/js/shared/search-modal.js"></script>
    <script src="collateral-types.js?v=31"></script>
</body>

</html>
