<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Limit · Limits & Collateral</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../assets/css/styles.css">
</head>

<body>
  <div class="window">
    <!-- Window Header -->
    <div class="title-bar">
      <div class="title-bar-left">
        <i class="bi bi-shield-lock title-icon"></i>
        <span class="title-text">Client Limit</span>
      </div>
      <div class="title-bar-right">
        <button id="btnRefresh" class="title-btn refresh" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button id="btnMinimize" class="title-btn" title="Minimize"><i class="bi bi-dash-lg"></i></button>
        <button id="btnMaximize" class="title-btn" title="Maximize"><i class="bi bi-square"></i></button>
        <button id="btnCloseWin" class="title-btn close" title="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">

      <!-- Form Content -->
      <div class="form-content">
        <!-- Section 1: Identification (Search) -->
        <div class="form-card">
          <div class="section-header">
            <div class="section-header__title">
              <i class="bi bi-search"></i>
              <span>Identification</span>
            </div>
            <button type="button" class="section-toggle-btn" aria-label="Toggle section">
              <i class="bi bi-chevron-up"></i>
            </button>
          </div>

          <div class="section-content">
            <div class="form-row two-col">
              <!-- Branch ID -->
              <div class="col">
                <label class="label-blue">Branch ID</label>
                <div class="lookup-group">
                  <input type="text" id="BranchId" value="0325" class="input-code">
                  <input type="text" id="BranchName" value="" class="input-full" readonly>
                  <button type="button" class="btn-lookup"><i class="bi bi-search"></i></button>
                </div>
              </div>
              <!-- Limit ID -->
              <div class="col">
                <label class="label-blue">Limit ID</label>
                <div class="lookup-group">
                  <input type="text" id="LimitId" class="input-full">
                  <button type="button" class="btn-lookup"><i class="bi bi-search"></i></button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Section 2: Client Limit Details -->
        <div class="form-card">
          <div class="section-header">
            <div class="section-header__title">
              <i class="bi bi-person-lines-fill"></i>
              <span>Client Limit Details</span>
            </div>
            <button type="button" class="section-toggle-btn" aria-label="Toggle section">
              <i class="bi bi-chevron-up"></i>
            </button>
          </div>

          <div class="section-content">
            <!-- Row 1: Client ID | Reference No -->
            <div class="form-row two-col">
              <div class="col">
                <label class="label-blue">Client ID</label>
                <div class="lookup-group">
                  <input type="text" id="ClientId" class="input-code">
                  <input type="text" id="ClientName" class="input-full" readonly>
                  <button type="button" class="btn-lookup"><i class="bi bi-search"></i></button>
                </div>
              </div>
              <div class="col">
                <label>Reference No.</label>
                <input type="text" id="ReferenceNo" class="input-full">
              </div>
            </div>

            <!-- Row 2: Currency ID -->
            <div class="form-row two-col">
              <div class="col">
                <label class="label-blue">Currency ID</label>
                <div class="lookup-group">
                  <input type="text" id="CurrencyId" class="input-code">
                  <input type="text" id="CurrencyName" class="input-full" readonly>
                  <button type="button" class="btn-lookup"><i class="bi bi-search"></i></button>
                </div>
              </div>
              <div class="col"></div>
            </div>

            <div class="row-divider"></div>

            <!-- Row 3: Limit Level | Limit Type | Effective Date | Expiry Date -->
            <div class="form-row four-col">
              <div class="col">
                <label class="label-blue">Limit Level</label>
                <input type="text" id="LimitLevel" class="input-full">
              </div>
              <div class="col">
                <label class="label-blue">Limit Type</label>
                <select id="LimitType" class="input-full">
                  <option value="">--Select--</option>
                  <option value="Revolving">Revolving</option>
                  <option value="Non Revolving">Non Revolving</option>
                </select>
              </div>
              <div class="col">
                <label class="label-blue">Effective Date</label>
                <div class="lookup-group">
                  <input type="text" id="EffectiveDate" class="input-full" data-date-picker>
                  <button type="button" class="btn-lookup btn-date" data-open-date="EffectiveDate">
                    <i class="bi bi-calendar3"></i>
                  </button>
                </div>
              </div>
              <div class="col">
                <label class="label-blue">Expiry Date</label>
                <div class="lookup-group">
                  <input type="text" id="ExpiryDate" class="input-full" data-date-picker>
                  <button type="button" class="btn-lookup btn-date" data-open-date="ExpiryDate">
                    <i class="bi bi-calendar3"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- Row 4: Sanctioned Date | Sanctioned Limit | DP Definition | Drawing Power -->
            <div class="form-row four-col">
              <div class="col">
                <label class="label-blue">Sanctioned Date</label>
                <div class="lookup-group">
                  <input type="text" id="SanctionedDate" class="input-full" data-date-picker>
                  <button type="button" class="btn-lookup btn-date" data-open-date="SanctionedDate">
                    <i class="bi bi-calendar3"></i>
                  </button>
                </div>
              </div>
              <div class="col">
                <label class="label-blue">Sanctioned Limit</label>
                <input type="text" id="SanctionedLimit" class="input-full money-field">
              </div>
              <div class="col">
                <label class="label-blue">DP Definition</label>
                <select id="DpDefinition" class="input-full">
                  <option value="">--Select--</option>
                  <option value="Derived From Linked Collaterals">Derived From Linked Collaterals</option>
                  <option value="Fixed Value">Fixed Value</option>
                </select>
              </div>
              <div class="col">
                <label class="label-blue">Drawing Power</label>
                <input type="text" id="DrawingPower" class="input-full money-field">
              </div>
            </div>

            <!-- Remarks -->
            <div class="form-row">
              <div class="col">
                <label>Remarks</label>
                <input type="text" id="Remarks" class="input-full">
              </div>
            </div>
          </div>
        </div>

        <!-- LIMIT DETAILS TABULAR CARD (Legacy Style) -->
        <div id="LimitDetailsContainer" class="form-card hidden">
          <div class="section-header">
            <div class="section-header__title">
              <i class="bi bi-list-check"></i>
              <span>Limit Details</span>
            </div>
            <button type="button" class="section-toggle-btn" aria-label="Toggle section">
              <i class="bi bi-chevron-up"></i>
            </button>
          </div>
          <div class="section-content">
            <div class="table-container">
              <table id="LimitDetailsTable" class="data-table">
                <thead>
                  <tr>
                    <th>LimitID</th>
                    <th>ProductID</th>
                    <th class="text-right">LimitAmount</th>
                    <th class="text-right">UtilizedAmount</th>
                    <th class="text-center">LimitTypeID</th>
                    <th class="text-center">LimitStatusID</th>
                    <th>WithdrawnBy</th>
                    <th>WithdrawnReason</th>
                  </tr>
                </thead>
                <tbody id="LimitDetailsTableBody"></tbody>
              </table>
            </div>
            <div class="table-actions">
              <button id="btnAlterLimit" class="btn-secondary"><span>Alter</span></button>
              <button id="btnUpdateLimit" class="btn-secondary btn-primary-action" disabled><span>Update</span></button>
            </div>
          </div>
        </div>

        <!-- Section 3: Collateral Details -->
        <div id="CollateralDetailsContainer" class="form-card hidden">
          <div class="section-header">
            <div class="section-header__title">
              <i class="bi bi-link-45deg"></i>
              <span>Collateral Details</span>
            </div>
            <button type="button" class="section-toggle-btn" aria-label="Toggle section">
              <i class="bi bi-chevron-up"></i>
            </button>
          </div>

          <div class="section-content">
            <div class="collateral-form-container">
              <!-- Row 1: Collateral ID | Reference No | Apportioned Ratio | Margin -->
              <div class="form-row four-col">
                <div class="col">
                  <label class="label-blue">Collateral ID</label>
                  <div class="lookup-group">
                    <input type="text" id="CollateralId" class="input-full">
                    <button type="button" class="btn-lookup"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col">
                  <label>Reference No.</label>
                  <input type="text" id="CollateralRefNo" class="input-full">
                </div>
                <div class="col">
                  <label class="label-blue">Apportioned Ratio</label>
                  <input type="text" id="ApportionedRatio" class="input-full">
                </div>
                <div class="col">
                  <label class="label-blue">Margin</label>
                  <input type="text" id="CollateralMargin" class="input-full">
                </div>
              </div>

              <!-- Row 2: Apportioned Value | Apportioned Collateral Value | Assigned Date | Limit Collateral Value -->
              <div class="form-row four-col">
                <div class="col">
                  <label class="label-blue">Apportioned Value</label>
                  <input type="text" id="ApportionedValue" class="input-full money-field">
                </div>
                <div class="col">
                  <label class="label-blue">Apportioned Collateral Value</label>
                  <input type="text" id="ApportionedCollateralValue" class="input-full money-field">
                </div>
                <div class="col">
                  <label class="label-blue">Assigned Date</label>
                  <div class="lookup-group">
                    <input type="text" id="AssignedDate" class="input-full" data-date-picker>
                    <button type="button" class="btn-lookup btn-date" data-open-date="AssignedDate">
                      <i class="bi bi-calendar3"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label>Limit Collateral Value</label>
                  <input type="text" id="LimitCollateralValue" class="input-full money-field">
                </div>
              </div>

              <!-- Collateral Actions -->
              <div class="table-actions">
                <button id="btnCollateralNew" class="btn-secondary btn-sm"><i class="bi bi-plus-lg"></i>New</button>
                <button id="btnCollateralAlter" class="btn-secondary btn-sm"><i class="bi bi-pencil"></i>Alter</button>
                <button id="btnCollateralUpdate" class="btn-secondary btn-sm" disabled><i class="bi bi-arrow-clockwise"></i>Update</button>
                <button id="btnCollateralRemove" class="btn-secondary btn-sm"><i class="bi bi-trash"></i>Remove</button>
                <button id="btnCollateralClear" class="btn-secondary btn-sm"><i class="bi bi-eraser"></i>Clear</button>
                <button id="btnCollateralWithdraw" class="btn-secondary btn-sm"><i class="bi bi-arrow-down-circle"></i>Withdraw</button>
              </div>

              <div class="table-container">
                <table id="CollateralDetailsTable" class="data-table">
                  <thead>
                    <tr>
                      <th>Collateral ID</th>
                      <th>Ref No</th>
                      <th class="text-right">Apportioned Ratio</th>
                      <th class="text-right">Apportioned Value</th>
                      <th class="text-right">Margin</th>
                      <th class="text-right">Net Value</th>
                    </tr>
                  </thead>
                  <tbody id="CollateralDetailsTableBody">
                    <!-- Loaded dynamically -->
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>

        <!-- Section 4: Behind the Scenes -->
        <div class="form-card">
          <div class="section-header">
            <div class="section-header__title">
              <i class="bi bi-gear-wide-connected"></i>
              <span>Behind the Scenes</span>
            </div>
            <button type="button" class="section-toggle-btn" aria-label="Toggle section">
              <i class="bi bi-chevron-up"></i>
            </button>
          </div>

          <div class="section-content">
            <div class="form-row four-col">
              <div class="col">
                <div class="audit-item">
                  <label>Withdrawn Date</label>
                  <span class="audit-value" id="WithdrawnDate"></span>
                </div>
                <div class="audit-item">
                  <label>Withdrawn Reason</label>
                  <span class="audit-value" id="WithdrawnReason"></span>
                </div>
              </div>
              <div class="col">
                <div class="audit-item">
                  <label>Created By</label>
                  <span class="audit-value" id="CreatedBy"></span>
                </div>
                <div class="audit-item">
                  <label>Created On</label>
                  <span class="audit-value" id="CreatedOn"></span>
                </div>
              </div>
              <div class="col">
                <div class="audit-item">
                  <label>Modified By</label>
                  <span class="audit-value" id="ModifiedBy"></span>
                </div>
                <div class="audit-item">
                  <label>Modified On</label>
                  <span class="audit-value" id="ModifiedOn"></span>
                </div>
              </div>
              <div class="col">
                <div class="audit-item">
                  <label>Supervised By</label>
                  <span class="audit-value" id="SupervisedBy"></span>
                </div>
                <div class="audit-item">
                  <label>Supervised On</label>
                  <span class="audit-value" id="SupervisedOn"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Action Panel -->
      <div class="action-panel">
        <div class="nav-group">
          <button class="btn-nav" id="btnPrevious" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
          <button class="btn-nav" id="btnNext" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
        </div>

        <div class="action-buttons">
          <button class="btn-action" id="btnWithdraw"><i class="bi bi-arrow-down-circle"></i><span>Withdraw</span></button>
          <button class="btn-action" id="btnView"><i class="bi bi-eye"></i><span>View</span></button>
          <button class="btn-action" id="btnAdd"><i class="bi bi-plus-circle"></i><span>Add</span></button>
          <button class="btn-action" id="btnEdit" disabled><i class="bi bi-pencil-square"></i><span>Edit</span></button>
          <button class="btn-action" id="btnSave" disabled><i class="bi bi-save2"></i><span>Save</span></button>
          <button class="btn-action" id="btnCancel" disabled><i class="bi bi-x-circle"></i><span>Cancel</span></button>
        </div>
      </div>

    </div>
  </div>

  <!-- Alert Message -->
  <div id="formToast" class="am-message-panel"></div>

  <script src="../../../assets/js/utils/global-utils.js"></script>
  <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../../assets/js/shared/search-modal.js"></script>
  <script src="client-limit.js"></script>
</body>

</html>
