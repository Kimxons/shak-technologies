<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clearing Bank Signatories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-person-vcard am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Clearing Bank Signatories</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Clearing Bank Signatories form">
        <div class="form-card" data-main-form>
          <!-- Signatory Information Section -->
          <div class="form-section" data-section="signatory-info">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-person-vcard"></i>Signatory Information</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Signatory Information" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <form id="signatoriesForm" autocomplete="off" novalidate>
                <!-- Row 1: Signatory ID -->
                <div class="row g-3 mb-3">
                  <div class="col-6">
                    <div class="d-flex flex-column gap-2">
                      <label class="label-blue">Signatory ID / Name</label>
                      <div class="d-flex gap-2">
                        <input id="signatoryId" name="signatoryId" type="text" class="bs-input-text" placeholder="Enter ID">
                        <input id="signatoryName" name="signatoryName" type="text" class="bs-input-text" placeholder="Name" readonly>
                        <button class="btn-lookup" type="button" data-lookup="signatoryId" title="Lookup Signatory" aria-label="Lookup Signatory"><i class="bi bi-search"></i></button>
                      </div>
                    </div>
                  </div>
                  <div class="col-6"></div>
                </div>

                <!-- Row 2: Signature Path -->
                <div class="row g-3 mb-3">
                  <div class="col-6">
                    <div class="d-flex flex-column gap-2">
                      <label class="label-blue">Signature Image</label>
                      <div class="d-flex gap-2">
                        <input id="signaturePath" name="signaturePath" type="text" class="bs-input-text" placeholder="Select signature file" readonly>
                        <button class="btn-lookup" type="button" data-action="browse" title="Browse File" aria-label="Browse File"><i class="bi bi-folder2-open"></i></button>
                      </div>
                    </div>
                  </div>
                  <div class="col-6"></div>
                </div>

                <!-- Row 3: Remarks -->
                <div class="row g-3 mb-3">
                  <div class="col-12">
                    <label class="label-blue" for="remarks">Remarks</label>
                    <input id="remarks" name="remarks" type="text" class="bs-input-text">
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- Behind The Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="createdBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="createdOn">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="modifiedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="modifiedOn">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="supervisedBy">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="supervisedOn">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button class="btn-action" type="button" data-action="show" title="Show" disabled>
            <i class="bi bi-eye"></i>Show
          </button>
          <button class="btn-action btn-view" type="button" data-action="view" title="View">
            <i class="bi bi-search"></i>View
          </button>
          <button class="btn-action" type="button" data-action="add" title="Add New" disabled>
            <i class="bi bi-plus-circle"></i>Add
          </button>
          <button class="btn-action" type="button" data-action="edit" title="Edit" disabled>
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button class="btn-action" type="button" data-action="delete" title="Delete" disabled>
            <i class="bi bi-trash3"></i>Delete
          </button>
          <button class="btn-action" type="button" data-action="save" title="Save" disabled>
            <i class="bi bi-check-lg"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel" title="Cancel" disabled>
            <i class="bi bi-x-lg"></i>Cancel
          </button>
          <button class="btn-action" type="button" data-action="back" title="Back">
            <i class="bi bi-box-arrow-right"></i>Back
          </button>
        </div>
      </div>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading...</span>
      </div>
    </div>
  </div>

  <!-- Load Environment Configuration -->
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/services/static-data/otherStaticDataService.js"></script>

  <script src="clearing-bank-signatories.js?v=1246"></script>

  <!-- Window Controls & Section Toggles -->
  <script>
    (function() {
      /**
       * Send message to parent when form opens
       */
      function notifyParentFormOpened() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleOpened',
              source: 'Clearing Bank Signatories'
            }, '*');
          }
        } catch (error) {
          console.error('Error notifying parent of form open:', error);
        }
      }

      /**
       * Close the child form by notifying parent
       */
      function closeChildForm() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleClosed',
              source: 'Clearing Bank Signatories'
            }, '*');
          } else {
            window.close();
          }
        } catch (error) {
          console.error('Error closing form:', error);
        }
      }

      /**
       * Handle window control actions
       */
      function handleWindowAction(action, btn) {
        const windowEl = document.querySelector('.window');
        
        switch (action) {
          case 'refresh':
            document.querySelectorAll('[class*="invalid"]').forEach(el => {
              el.classList.remove(...Array.from(el.classList).filter(c => c.includes('invalid')));
            });
            window.location.reload();
            break;

          case 'maximize':
            if (windowEl) {
              const isMaximized = windowEl.classList.toggle('maximized');
              const icon = btn.querySelector('i');
              if (icon) {
                icon.className = isMaximized ? 'bi bi-fullscreen-exit' : 'bi bi-square';
              }
              btn.title = isMaximized ? 'Restore' : 'Maximize';
              btn.setAttribute('aria-label', isMaximized ? 'Restore window' : 'Maximize window');
              
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ 
                  action: 'toggleSidebarForMaximize',
                  maximize: isMaximized
                }, '*');
              }
            }
            break;

          case 'close':
            closeChildForm();
            break;
        }
      }

      /**
       * Initialize section toggles
       */
      function initSectionToggles() {
        document.querySelectorAll('[data-section-toggle]').forEach(header => {
          header.addEventListener('click', (e) => {
            if (e.target.closest('.section-toggle-btn') || e.target.closest('.section-header')) {
              const section = header.closest('.form-section');
              const content = section.querySelector('[data-section-content]');
              const toggleBtn = header.querySelector('.section-toggle-btn');
              const icon = toggleBtn?.querySelector('i');
              
              if (content) {
                const isHidden = content.hidden;
                content.hidden = !isHidden;
                
                if (icon) {
                  icon.className = isHidden ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
                }
                if (toggleBtn) {
                  toggleBtn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
                }
              }
            }
          });
        });
      }

      /**
       * Initialize window control buttons
       */
      function initWindowControls() {
        document.querySelectorAll('.de-title-btn[data-action]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const action = btn.getAttribute('data-action');
            handleWindowAction(action, btn);
          });
        });

        // Close button in action panel (back button)
        document.querySelector('.action-panel [data-action="back"]')?.addEventListener('click', closeChildForm);
      }

      // Initialize on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          initWindowControls();
          initSectionToggles();
          notifyParentFormOpened();
        });
      } else {
        initWindowControls();
        initSectionToggles();
        notifyParentFormOpened();
      }
    })();
  </script>
</body>
</html>
</body>
</html>
