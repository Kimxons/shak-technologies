<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="loan-calculator-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Loan Parameters Section -->
                        <div class="form-section" data-section="loan-parameters">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-sliders"></i>Loan Parameters</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label class="label-blue">Principle Amount</label>
                                        <input type="number" class="bs-input-text" id="principleAmount" name="principleAmount" placeholder="Enter amount" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Interest Rate</label>
                                        <input type="number" class="bs-input-text" id="interestRate" name="interestRate" placeholder="Enter rate" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label>Method</label>
                                        <select class="bs-input-text" id="method" name="method">
                                            <option value="Flat">Flat</option>
                                            <option value="Reducing">Reducing</option>
                                            <option value="Flat Yearly Reducing">Flat Yearly Reducing</option>
                                            <option value="Reducing With Advance Installment">Reducing With Advance Installment</option>
                                            <option value="Table Based">Table Based</option>
                                            <option value="Financial Year Reducing">Financial Year Reducing</option>
                                            <option value="Equated Principal">Equated Principal</option>
                                            <option value="Flat Premium Financing">Flat Premium Financing</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label>Rule 78</label>
                                        <div class="form-check form-switch m-0">
                                            <input class="form-check-input" type="checkbox" role="switch" id="rule78" name="rule78">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Period Type</label>
                                        <select class="bs-input-text" id="periodType" name="periodType">
                                            <option value="">--Select--</option>
                                            <option value="Month(s)">Month(s)</option>
                                            <option value="Week(s)">Week(s)</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label>Repayment Frequency</label>
                                        <select class="bs-input-text" id="repaymentFrequency" name="repaymentFrequency">
                                            <option value="">--Select--</option>
                                            <option value="Daily">Daily</option>
                                            <option value="Weekly">Weekly</option>
                                            <option value="Fortnight">Fortnight</option>
                                            <option value="Bi-Monthly">Bi-Monthly</option>
                                            <option value="Monthly">Monthly</option>
                                            <option value="Quarterly">Quarterly</option>
                                            <option value="Half Yearly">Half Yearly</option>
                                            <option value="Yearly">Yearly</option>
                                            <option value="On Maturity">On Maturity</option>
                                            <option value="Termly">Termly</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label>Terms</label>
                                        <select class="bs-input-text" id="terms" name="terms">
                                            <option value="">--Select--</option>
                                            <option value="Month(s)">Month(s)</option>
                                            <option value="Week(s)">Week(s)</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label>Installment Rounding</label>
                                        <select class="bs-input-text" id="installmentRounding" name="installmentRounding">
                                            <option value="Nearest 0.01">Nearest 0.01</option>
                                            <option value="Nearest 0.0001">Nearest 0.0001</option>
                                            <option value="Nearest 0.05">Nearest 0.05</option>
                                            <option value="Nearest 0.10">Nearest 0.10</option>
                                            <option value="Nearest 0.25">Nearest 0.25</option>
                                            <option value="Nearest 0.50">Nearest 0.50</option>
                                            <option value="Nearest 1.00">Nearest 1.00</option>
                                            <option value="Nearest 5.00">Nearest 5.00</option>
                                            <option value="Nearest 10.00">Nearest 10.00</option>
                                            <option value="Nearest 50.00">Nearest 50.00</option>
                                            <option value="Nearest 100.00">Nearest 100.00</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Grace Period</label>
                                        <input type="number" class="bs-input-text" id="gracePeriod" name="gracePeriod" placeholder="Grace period" step="1">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">No Of Installments</label>
                                        <input type="number" class="bs-input-text" id="noOfInstallments" name="noOfInstallments" placeholder="Number of installments" step="1">
                                    </div>
                                    <div class="col">
                                        <label>Term Excludes Grace Period</label>
                                        <div class="form-check form-switch m-0">
                                            <input class="form-check-input" type="checkbox" role="switch" id="termExcludesGrace" name="termExcludesGrace">
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label>Collect Interest During Grace</label>
                                        <div class="form-check form-switch m-0">
                                            <input class="form-check-input" type="checkbox" role="switch" id="collectInterestDuringGrace" name="collectInterestDuringGrace">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Interest Calculation Period</label>
                                        <select class="bs-input-text" id="interestCalcPeriod" name="interestCalcPeriod">
                                            <option value="">--Select--</option>
                                            <option value="Daily">Daily</option>
                                            <option value="Weekly">Weekly</option>
                                            <option value="Monthly">Monthly</option>
                                            <option value="Yearly">Yearly</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label>Interest Rounding</label>
                                        <select class="bs-input-text" id="interestRounding" name="interestRounding">
                                            <option value="Nearest 0.01">Nearest 0.01</option>
                                            <option value="Nearest 0.0001">Nearest 0.0001</option>
                                            <option value="Nearest 0.05">Nearest 0.05</option>
                                            <option value="Nearest 0.10">Nearest 0.10</option>
                                            <option value="Nearest 0.25">Nearest 0.25</option>
                                            <option value="Nearest 0.50">Nearest 0.50</option>
                                            <option value="Nearest 1.00">Nearest 1.00</option>
                                            <option value="Nearest 5.00">Nearest 5.00</option>
                                            <option value="Nearest 10.00">Nearest 10.00</option>
                                            <option value="Nearest 50.00">Nearest 50.00</option>
                                            <option value="Nearest 100.00">Nearest 100.00</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Results Section -->
                        <div class="form-section" data-section="enquiry-results">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-clipboard-data"></i>Enquiry Results</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Installment</label>
                                        <input type="text" class="bs-input-text" id="resultInstallment" value="0.00" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Interest</label>
                                        <input type="text" class="bs-input-text" id="resultInterest" value="0.00" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Last Installment</label>
                                        <input type="text" class="bs-input-text" id="resultLastInstallment" value="0.00" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Total Payments</label>
                                        <input type="text" class="bs-input-text" id="resultTotalPayments" value="0.00" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Installment Schedule Table -->
                        <div class="form-section" data-section="installment-schedule">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-table"></i>Installment Schedule</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-hover table-sm">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Inst No.</th>
                                                <th>Advance Installment</th>
                                                <th>Installment Amount</th>
                                                <th>Prn Amount</th>
                                                <th>Int Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody id="scheduleTableBody">
                                            <tr>
                                                <td colspan="5" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-action--success" id="calculateBtn">
                        <i class="bi bi-calculator"></i>
                        <span>Calculate</span>
                    </button>
                    <button type="button" class="btn-action" id="printBtn">
                        <i class="bi bi-printer"></i>
                        <span>Print</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="loan-calculator.js"></script>
</body>
</html>
