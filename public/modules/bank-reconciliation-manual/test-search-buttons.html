<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Search Buttons</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; }
    .test-section { margin: 20px 0; padding: 20px; border: 2px solid #4a90e2; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Search Buttons Test Page</h1>
  
  <div class="test-section">
    <h3>Test 1: Search Icons</h3>
    <p>You should see blue magnifying glass icons below:</p>
    <div style="display: flex; gap: 20px; margin: 20px 0;">
      <button style="width: 32px; height: 32px; border: 1px solid #cbd5e1; background: #fff; display: flex; align-items: center; justify-content: center;">
        <i class="bi bi-search" style="color: #4a90e2; font-size: 16px;"></i>
      </button>
      <button style="width: 32px; height: 32px; border: 1px solid #cbd5e1; background: #fff; display: flex; align-items: center; justify-content: center;">
        <i class="bi bi-search" style="color: #4a90e2; font-size: 16px;"></i>
      </button>
    </div>
  </div>
  
  <div class="test-section">
    <h3>Test 2: GL Account Search Button</h3>
    <div class="form-row" style="display: flex; align-items: center; margin-bottom: 12px;">
      <label style="width: 140px; text-align: right; padding-right: 12px; font-weight: 600; color: #4a90e2;">GL Account ID</label>
      <div style="display: flex; flex: 1; max-width: 600px;">
        <input type="text" data-field="glAccountId" style="flex: 1; height: 32px; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; padding: 6px 10px;" />
        <button type="button" data-action="searchGLAccount" style="width: 32px; height: 32px; border: 1px solid #cbd5e1; border-left: none; border-radius: 0 4px 4px 0; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <i class="bi bi-search" style="color: #4a90e2; font-size: 16px;"></i>
        </button>
      </div>
    </div>
  </div>
  
  <div class="test-section">
    <h3>Test 3: Button Click Event</h3>
    <button id="testButton" style="padding: 10px 20px; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Click Me to Test
    </button>
    <p id="result" style="margin-top: 10px; color: green; font-weight: bold;"></p>
  </div>
  
  <script>
    // Test if Bootstrap Icons loaded
    console.log('Bootstrap Icons test - if you see a magnifying glass icon above, it loaded successfully');
    
    // Test button click
    document.getElementById('testButton').addEventListener('click', function() {
      document.getElementById('result').textContent = '✅ Button clicked! JavaScript is working.';
      console.log('Test button clicked - JavaScript is working!');
    });
    
    // Test search button
    const searchBtn = document.querySelector('[data-action="searchGLAccount"]');
    if (searchBtn) {
      console.log('✅ Search button found!', searchBtn);
      searchBtn.addEventListener('click', function() {
        alert('Search button clicked! This means the button exists and events work.');
        console.log('Search button clicked!');
      });
    } else {
      console.error('❌ Search button NOT found!');
    }
    
    console.log('Test page loaded at:', new Date().toLocaleString());
  </script>
</body>
</html>
