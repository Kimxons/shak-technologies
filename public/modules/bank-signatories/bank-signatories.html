<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Signatories</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="bank-signatories.css">
</head>
<body>
    <!-- Bank Signatories Container -->
    <div class="signatories-container">
        <!-- Left Sidebar Navigation -->
        <div class="signatories-sidebar">
            <div class="sidebar-header">
                <h3><i class="bi bi-pen-fill"></i> Bank Signatories</h3>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="signatories-content">
            <div class="content-scroll">
                <!-- Simple Form Layout - Matching Screenshot -->
                <div class="simple-form">
                    <div class="form-row">
                        <label for="signatoryId" class="field-label">Signatory ID</label>
                        <div class="field-input-group">
                            <input type="text" id="signatoryId" class="field-input">
                            <button class="search-btn" title="Search">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="signatoryName" class="field-label">Signatory Name</label>
                        <input type="text" id="signatoryName" class="field-input-full">
                    </div>

                    <div class="form-row">
                        <label for="signaturePath" class="field-label">Signature Path</label>
                        <div class="field-input-group">
                            <input type="text" id="signaturePath" class="field-input">
                            <button class="browse-btn" title="Browse">Browse</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Action Panel -->
        <div class="action-panel">
            <button class="action-btn" id="btnShow">
                <i class="bi bi-eye"></i>
                <span>Show</span>
            </button>
            <button class="action-btn" id="btnView">
                <i class="bi bi-file-text"></i>
                <span>View</span>
            </button>
            <button class="action-btn" id="btnAdd">
                <i class="bi bi-plus-circle"></i>
                <span>Add</span>
            </button>
            <button class="action-btn" id="btnEdit">
                <i class="bi bi-pencil-square"></i>
                <span>Edit</span>
            </button>
            <button class="action-btn" id="btnDelete">
                <i class="bi bi-trash"></i>
                <span>Delete</span>
            </button>
            <button class="action-btn" id="btnSave">
                <i class="bi bi-save"></i>
                <span>Save</span>
            </button>
            <button class="action-btn" id="btnCancel">
                <i class="bi bi-x-circle"></i>
                <span>Cancel</span>
            </button>
            <button class="action-btn" id="btnBack">
                <i class="bi bi-arrow-left-circle"></i>
                <span>Back</span>
            </button>
        </div>
    </div>

    <script src="bank-signatories.js"></script>
</body>
</html>
