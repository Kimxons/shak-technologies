<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Syndicate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>
                    <!-- Branch and Application Info Section -->
                    <div class="form-section" data-section="branch-application">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-building-columns"></i> Application Information</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Application Information" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Branch ID</label>
                                    <div class="kairo-branch-control" data-kairo-branch-control>
                                        <input type="text" id="branchId" class="kairo-branch-control__id" aria-label="Branch ID">
                                        <input type="text" id="branchName" class="kairo-branch-control__name" aria-label="Branch Name" placeholder="Branch Name" readonly>
                                        <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchBranchBtn" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Application ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="applicationId" class="kairo-control__id" aria-label="Application ID">
                                        <button type="button" class="btn-lookup kairo-control__lookup" id="searchApplicationBtn" aria-label="Search Application"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Date</label>
                                    <input type="date" id="date" class="bs-input-text" aria-label="Date">
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Client and Product Details Section -->
                    <div class="form-section" data-section="client-product">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-person-badge"></i> Client and Product Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Client and Product Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Client Branch ID</label>
                                    <div class="kairo-branch-control" data-kairo-branch-control>
                                        <input type="text" id="clientBranchId" class="kairo-branch-control__id" aria-label="Client Branch ID">
                                        <input type="text" id="clientBranchName" class="kairo-branch-control__name" aria-label="Client Branch Name" placeholder="Branch Name" readonly>
                                        <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchClientBranchBtn" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Client ID</label>
                                    <div class="kairo-client-control" data-kairo-client-control>
                                        <input type="text" id="clientId" class="kairo-client-control__id" aria-label="Client ID">
                                        <input type="text" id="clientName" class="kairo-client-control__name" aria-label="Client Name" placeholder="Client Name" readonly>
                                        <button type="button" class="btn-lookup kairo-client-control__lookup" id="searchClientBtn" aria-label="Search Client"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Product ID</label>
                                    <div class="kairo-product-control" data-kairo-product-control>
                                        <input type="text" id="productId" class="kairo-product-control__id" aria-label="Product ID">
                                        <input type="text" id="productName" class="kairo-product-control__name" aria-label="Product Name" placeholder="Product Name" readonly>
                                        <button type="button" class="btn-lookup kairo-product-control__lookup" id="searchProductBtn" aria-label="Search Product"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Main Repayment Account</label>
                                    <div class="kairo-account-control" data-kairo-account-control>
                                        <input type="text" id="mainRepaymentAccountId" class="kairo-account-control__id" aria-label="Main Repayment Account">
                                        <button type="button" class="btn-lookup kairo-account-control__lookup" id="searchAccountBtn" aria-label="Search Account"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Donor ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="donorId" class="kairo-control__id" aria-label="Donor ID">
                                        <input type="text" id="donorName" class="kairo-control__name" aria-label="Donor Name" placeholder="Donor Name" readonly>
                                        <button type="button" class="btn-lookup kairo-control__lookup" id="searchDonorBtn" aria-label="Search Donor"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Loan Details Section -->
                    <div class="form-section" data-section="loan-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-cash-stack"></i> Loan Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Loan Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Loan Purpose</label>
                                    <select id="loanPurpose" class="bs-select" aria-label="Loan Purpose">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Line Of Business</label>
                                    <select id="lineOfBusiness" class="bs-select" aria-label="Line Of Business">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Officer ID</label>
                                    <div class="kairo-user-control" data-kairo-user-control>
                                        <input type="text" id="officerId" class="kairo-user-control__id" aria-label="Officer ID">
                                        <input type="text" id="officerName" class="kairo-user-control__name" aria-label="Officer Name" placeholder="Officer Name" readonly>
                                        <button type="button" class="btn-lookup kairo-user-control__lookup" id="searchOfficerBtn" aria-label="Search Officer"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Loan Amount</label>
                                    <input type="text" id="loanAmount" class="bs-input-text" aria-label="Loan Amount" placeholder="0.00">
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Currency ID</label>
                                    <input type="text" id="currencyId" class="bs-input-text" aria-label="Currency ID">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Term</label>
                                    <input type="text" id="term" class="bs-input-text" aria-label="Term">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Interest Rate</label>
                                    <input type="text" id="interestRate" class="bs-input-text" aria-label="Interest Rate" placeholder="0.00">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Commission Rate</label>
                                    <input type="text" id="commissionRate" class="bs-input-text" aria-label="Commission Rate" placeholder="0.00">
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Tax Rate</label>
                                    <input type="text" id="taxRate" class="bs-input-text" aria-label="Tax Rate" placeholder="0.00">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Effective Rate</label>
                                    <input type="text" id="effectiveRate" class="bs-input-text" aria-label="Effective Rate" placeholder="0.00" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Disbursement Date</label>
                                    <select id="disbursementDate" class="bs-select" aria-label="Disbursement Date">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Monthly Profit</label>
                                    <input type="text" id="monthlyProfit" class="bs-input-text" aria-label="Monthly Profit" placeholder="0.00">
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Monthly TurnOver</label>
                                    <input type="text" id="monthlyTurnOver" class="bs-input-text" aria-label="Monthly TurnOver" placeholder="0.00">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Total Assets</label>
                                    <input type="text" id="totalAssets" class="bs-input-text" aria-label="Total Assets" placeholder="0.00">
                                </div>
                                <div class="col">
                                    <label class="label-blue">Business Location</label>
                                    <select id="businessLocation" class="bs-select" aria-label="Business Location">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Business Status</label>
                                    <select id="businessStatus" class="bs-select" aria-label="Business Status">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">StartUp Capital-Collateral</label>
                                    <select id="startupCapitalCollateral" class="bs-select" aria-label="StartUp Capital-Collateral">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Spread</label>
                                    <input type="text" id="spread" class="bs-input-text" aria-label="Spread" placeholder="0.00" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Loan Limit Type</label>
                                    <select id="loanLimitType" class="bs-select" aria-label="Loan Limit Type">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue">File Number</label>
                                    <input type="text" id="fileNumber" class="bs-input-text" aria-label="File Number">
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Application Status</label>
                                    <input type="text" id="applicationStatus" class="bs-input-text" aria-label="Application Status" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Sales Officer</label>
                                    <div class="kairo-user-control" data-kairo-user-control>
                                        <input type="text" id="salesOfficer" class="kairo-user-control__id" aria-label="Sales Officer">
                                        <input type="text" id="salesOfficerName" class="kairo-user-control__name" aria-label="Sales Officer Name" placeholder="Officer Name" readonly>
                                        <button type="button" class="btn-lookup kairo-user-control__lookup" id="searchSalesOfficerBtn" aria-label="Search Sales Officer"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bank Syndicate Details Section -->
                    <div class="form-section" data-section="bank-syndicate">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-bank"></i> Bank Syndicate Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Bank Syndicate Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue">Bank ID</label>
                                    <div class="kairo-control" data-kairo-control>
                                        <input type="text" id="bankId" class="kairo-control__id" aria-label="Bank ID">
                                        <input type="text" id="bankName" class="kairo-control__name" aria-label="Bank Name" placeholder="Bank Name" readonly>
                                        <button type="button" class="btn-lookup kairo-control__lookup" id="searchBankBtn" aria-label="Search Bank"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue">Percentage</label>
                                    <input type="text" id="percentage" class="bs-input-text" aria-label="Percentage" placeholder="0.00">
                                </div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="d-flex gap-2 mt-3">
                                <button type="button" class="btn btn-outline-primary btn-sm" id="newBtn">
                                    <i class="bi bi-plus-circle me-1"></i>New
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="alterBtn">
                                    <i class="bi bi-arrow-repeat me-1"></i>Alter
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm" id="removeBtn">
                                    <i class="bi bi-dash-circle me-1"></i>Remove
                                </button>
                                <button type="button" class="btn btn-outline-success btn-sm" id="updateBtn">
                                    <i class="bi bi-check-circle me-1"></i>Update
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="clearBtn">
                                    <i class="bi bi-x-circle me-1"></i>Clear
                                </button>
                            </div>

                            <!-- Bank Syndicate Table -->
                            <div class="table-responsive mt-3">
                                <table class="table table-sm table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Bank ID</th>
                                            <th>Bank Name</th>
                                            <th>Percentage</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bankTableBody">
                                        <tr>
                                            <td colspan="3" class="text-center text-muted py-3">No records to display.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="nav-group">
                    <span>Actions</span>
                </div>
                <div class="action-buttons">
                    <button type="button" class="btn-action" id="moreInfoBtn">
                        <i class="bi bi-info-circle"></i>
                        <span>More Info</span>
                    </button>
                    <button type="button" class="btn-action btn-view" id="viewBtn">
                        <i class="bi bi-eye-fill"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action" id="addBtn">
                        <i class="bi bi-plus-lg"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="btn-action" id="editBtn" disabled>
                        <i class="bi bi-pencil-fill"></i>
                        <span>Edit</span>
                    </button>

                    <hr style="margin: 4px 0; border-color: #e2e8f0; opacity: 0.5;">

                    <button type="button" class="btn-action btn-save" id="saveBtn" disabled>
                        <i class="bi bi-check-lg"></i>
                        <span>Done</span>
                    </button>
                    <button type="button" class="btn-action btn-cancel" id="deleteBtn" disabled>
                        <i class="bi bi-trash"></i>
                        <span>Delete</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/auth/auth.config.js"></script>
    <script src="../../assets/js/auth/auth.service.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="loan-application-syndicate.js"></script>
</body>
</html>
