<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="deposit-calculator-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Basic Deposit Information Section -->
                        <div class="form-section" data-section="basic-deposit-info">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-info-circle"></i>Basic Deposit Information</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label class="label-blue">Deposit Type</label>
                                        <select class="bs-input-text" id="depositType" name="depositType">
                                            <option value="">--Select--</option>
                                            <option value="Fixed Deposit">Fixed Deposit</option>
                                            <option value="Cumulative Deposit">Cumulative Deposit</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Fixed Amount</label>
                                        <input type="number" class="bs-input-text" id="fixedAmount" name="fixedAmount" placeholder="Enter amount" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Interest Rate (%)</label>
                                        <input type="number" class="bs-input-text" id="interestRate" name="interestRate" placeholder="Enter rate" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label>Compounding Frequency</label>
                                        <select class="bs-input-text" id="compoundingFrequency" name="compoundingFrequency">
                                            <option value="">--Select--</option>
                                            <option value="Monthly">Monthly</option>
                                            <option value="Quarterly">Quarterly</option>
                                            <option value="Half Yearly">Half Yearly</option>
                                            <option value="Yearly">Yearly</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Term & Date Information Section -->
                        <div class="form-section" data-section="term-date-info">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-calendar-event"></i>Term & Date Information</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Term Type</label>
                                        <select class="bs-input-text" id="termType" name="termType">
                                            <option value="">--Select--</option>
                                            <option value="Monthly">Monthly</option>
                                            <option value="Quarterly">Quarterly</option>
                                            <option value="Half Yearly">Half Yearly</option>
                                            <option value="Yearly">Yearly</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">No. Of Terms</label>
                                        <input type="number" class="bs-input-text" id="noOfTerms" name="noOfTerms" placeholder="Number of terms" step="1">
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Start Date</label>
                                        <input type="date" class="bs-input-text" id="startDate" name="startDate">
                                    </div>
                                    <div class="col">
                                        <label>Maturity Date</label>
                                        <input type="date" class="bs-input-text" id="maturityDate" name="maturityDate" readonly>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Number Of Days</label>
                                        <input type="number" class="bs-input-text" id="numberOfDays" name="numberOfDays" placeholder="Auto-calculated" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Interest Payment Section -->
                        <div class="form-section" data-section="interest-payment">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-cash-coin"></i>Interest Payment Details</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Interest Payment Frequency</label>
                                        <select class="bs-input-text" id="interestPaymentFrequency" name="interestPaymentFrequency">
                                            <option value="">--Select--</option>
                                            <option value="Monthly">Monthly</option>
                                            <option value="Quarterly">Quarterly</option>
                                            <option value="Half Yearly">Half Yearly</option>
                                            <option value="Yearly">Yearly</option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label>Interest Payment</label>
                                        <input type="number" class="bs-input-text" id="interestPayment" name="interestPayment" placeholder="Auto-calculated" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tax Information Section -->
                        <div class="form-section" data-section="tax-info">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-receipt"></i>Tax Information</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Is Interest Taxable</label>
                                        <div class="form-check form-switch m-0">
                                            <input class="form-check-input" type="checkbox" role="switch" id="isInterestTaxable" name="isInterestTaxable">
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label>Tax Rate (%)</label>
                                        <input type="number" class="bs-input-text" id="taxRate" name="taxRate" placeholder="Tax rate" step="0.01">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Results Section -->
                        <div class="form-section" data-section="calculation-results">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-clipboard-data"></i>Calculation Results</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Total Interest</label>
                                        <input type="text" class="bs-input-text" id="resultTotalInterest" value="0.00" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Tax</label>
                                        <input type="text" class="bs-input-text" id="resultTax" value="0.00" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Net Interest</label>
                                        <input type="text" class="bs-input-text" id="resultNetInterest" value="0.00" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Maturity Amount</label>
                                        <input type="text" class="bs-input-text" id="resultMaturityAmount" value="0.00" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Interest Schedule Table -->
                        <div class="form-section" data-section="interest-schedule">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-table"></i>Interest Payment Schedule</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-hover table-sm">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Period</th>
                                                <th>Payment Date</th>
                                                <th>Principal</th>
                                                <th>Interest</th>
                                                <th>Tax</th>
                                                <th>Net Interest</th>
                                                <th>Balance</th>
                                            </tr>
                                        </thead>
                                        <tbody id="scheduleTableBody">
                                            <tr>
                                                <td colspan="7" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-action--success" id="calculateBtn">
                        <i class="bi bi-calculator"></i>
                        <span>Calculate</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="deposit-calculator.js"></script>
</body>
</html>
