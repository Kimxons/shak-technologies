<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Interest Calculation Rule</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="loan-interest-calculation-rule">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-calculator am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Loan Interest Calculation Rule</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Loan Interest Calculation Rule form">
        <div class="form-card" data-main-form>
          <form id="loanInterestCalcForm" autocomplete="off" novalidate>
            <div class="form-section" data-section="loan-icr-detail">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Loan Interest Calculation Detail</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Loan Interest Calculation Detail" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="loanRuleId">Rule ID</label>
                    <div class="kairo-control">
                      <input type="text" id="loanRuleId" name="loanRuleId" class="kairo-control__id" autocomplete="off" required />
                      <button type="button" class="btn-lookup kairo-control__lookup" data-action="searchLoanRule" aria-label="Search Loan Rule" title="Search"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ruleName">Rule Name</label>
                    <input type="text" id="ruleName" name="ruleName" class="bs-input-text" autocomplete="off" required />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="loanType">Loan Type</label>
                    <select id="loanType" name="loanType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="personal">Personal Loan</option>
                      <option value="mortgage">Mortgage Loan</option>
                      <option value="business">Business Loan</option>
                      <option value="auto">Auto Loan</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="repaymentMethod">Repayment Calculation Method</label>
                    <select id="repaymentMethod" name="repaymentMethod" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="flat">Flat Rate</option>
                      <option value="reducing">Reducing Balance</option>
                      <option value="annuity">Annuity</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="calculationBasis">Calculation Basis</label>
                    <select id="calculationBasis" name="calculationBasis" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="outstanding">Outstanding Balance</option>
                      <option value="original">Original Principal</option>
                      <option value="average">Average Balance</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="balanceType">Balance Type</label>
                    <select id="balanceType" name="balanceType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="available">Available Balance</option>
                      <option value="ledger">Ledger Balance</option>
                      <option value="cleared">Cleared Balance</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="repaymentFrequency">Repayment Frequency</label>
                    <select id="repaymentFrequency" name="repaymentFrequency" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="weekly">Weekly</option>
                      <option value="biweekly">Bi-Weekly</option>
                      <option value="monthly">Monthly</option>
                      <option value="quarterly">Quarterly</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="dayCountBasis">Day Count Basis</label>
                    <select id="dayCountBasis" name="dayCountBasis" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="actual360">Actual/360</option>
                      <option value="actual365">Actual/365</option>
                      <option value="30360">30/360</option>
                      <option value="actualactual">Actual/Actual</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="gracePeriod">Grace Period (Days)</label>
                    <input type="number" id="gracePeriod" name="gracePeriod" class="bs-input-text" min="0" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="penaltyRate">Penalty Rate (%)</label>
                    <input type="number" id="penaltyRate" name="penaltyRate" class="bs-input-text" step="0.01" min="0" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="effectiveDate">Effective Date</label>
                    <input type="text" id="effectiveDate" name="effectiveDate" class="bs-input-text" data-date-picker placeholder="dd/mmm/yyyy" autocomplete="off" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="expiryDate">Expiry Date</label>
                    <input type="text" id="expiryDate" name="expiryDate" class="bs-input-text" data-date-picker placeholder="dd/mmm/yyyy" autocomplete="off" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="amortizeR78" name="amortizeR78" />
                      <label class="form-check-label" for="amortizeR78">Amortize Using R-78</label>
                    </div>
                  </div>
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="allowPrepayment" name="allowPrepayment" />
                      <label class="form-check-label" for="allowPrepayment">Allow Prepayment</label>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="applyPenalty" name="applyPenalty" />
                      <label class="form-check-label" for="applyPenalty">Apply Penalty On Late Payment</label>
                    </div>
                  </div>
                  <div class="col">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="compoundInterest" name="compoundInterest" />
                      <label class="form-check-label" for="compoundInterest">Compound Interest</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="audit">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-section audit-section--summary">
                  <div class="audit-cell"><span class="audit-label">Created By</span><span class="audit-value" id="createdBy">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Created On</span><span class="audit-value" id="createdOn">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Created Time</span><span class="audit-value" id="createdTime">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified By</span><span class="audit-value" id="modifiedBy">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified On</span><span class="audit-value" id="modifiedOn">-</span></div>
                  <div class="audit-cell"><span class="audit-label">Modified Time</span><span class="audit-value" id="modifiedTime">-</span></div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <aside class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view" title="View"><i class="bi bi-eye"></i>View</button>
          <button type="button" class="btn-action" data-action="add" title="Add"><i class="bi bi-plus-circle"></i>Add</button>
          <button type="button" class="btn-action" data-action="edit" title="Edit"><i class="bi bi-pencil"></i>Edit</button>
          <button type="button" class="btn-action" data-action="delete" title="Delete"><i class="bi bi-trash"></i>Delete</button>
          <button type="button" class="btn-action btn-save" id="saveBtn" data-action="save" title="Save" disabled><i class="bi bi-check-circle"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" id="cancelBtn" data-action="cancel" title="Cancel" disabled><i class="bi bi-x-circle"></i>Cancel</button>
          <button type="button" class="btn-action" data-action="back" title="Back"><i class="bi bi-box-arrow-left"></i>Back</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="loan-interest-calculation-rule.js"></script>
</body>
</html>
