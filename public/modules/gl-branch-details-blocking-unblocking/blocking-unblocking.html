<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blocking/Unblocking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="blocking-unblocking.css">
  <style>
    .bub-label {
      font-size: 0.75rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #374151;
      font-weight: 600;
      line-height: 1.3;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="bub-container">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <!-- Row 1: Reason dropdown -->
          <div style="margin-bottom: 12px;">
            <label class="bub-label" style="color: #2563eb;">Reason *</label>
            <select class="form-select" id="reasonSelect">
              <option selected value="">--Select--</option>
              <option value="1">Default</option>
              <option value="2">Suspicious Account Activity</option>
              <option value="3">KYC Norms not met</option>
              <option value="4">On Leave</option>
            </select>
          </div>

          <!-- Row 2: Description -->
          <div style="margin-bottom: 12px;">
            <label class="bub-label">Description</label>
            <input type="text" class="form-control" id="descriptionField" />
          </div>

          <!-- Row 3: Instruction Given By -->
          <div>
            <label class="bub-label" style="color: #2563eb;">Instruction Given By *</label>
            <input type="text" class="form-control" id="instructionGivenByField" />
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #517a8e; color: white; padding: 0.5rem 0.85rem; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" onclick="this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up'); this.nextElementSibling.classList.toggle('collapsed');">
            <span>Behind The Scene</span>
            <i class="bi bi-chevron-down" style="font-size: 0.9rem;"></i>
          </div>
          
          <div class="collapsible-content">
          <!-- Row 1: Previous Status, Date, Reason ID -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="bub-label">Previous Status</label>
              <input type="text" class="form-control" id="previousStatusField" readonly />
            </div>
            <div>
              <label class="bub-label">Date</label>
              <input type="text" class="form-control" id="dateField" readonly />
            </div>
            <div>
              <label class="bub-label">Reason ID</label>
              <input type="text" class="form-control" id="reasonIdField" readonly />
            </div>
          </div>

          <!-- Row 2: Description, Instruction Given By, Created By -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label class="bub-label">Description</label>
              <input type="text" class="form-control" id="btsDescriptionField" readonly />
            </div>
            <div>
              <label class="bub-label">Instruction Given By</label>
              <input type="text" class="form-control" id="btsInstructionGivenByField" readonly />
            </div>
            <div>
              <label class="bub-label">Created By</label>
              <input type="text" class="form-control" id="createdByField" readonly />
            </div>
          </div>

          <!-- Row 3: Supervised By, Created On, Supervised On -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div>
              <label class="bub-label">Supervised By</label>
              <input type="text" class="form-control" id="supervisedByField" readonly />
            </div>
            <div>
              <label class="bub-label">Created On</label>
              <input type="text" class="form-control" id="createdOnField" readonly />
            </div>
            <div>
              <label class="bub-label">Supervised On</label>
              <input type="text" class="form-control" id="supervisedOnField" readonly />
            </div>
          </div>
          </div>
        </div>

        <!-- Error Message Section -->
        <div id="errorMessageContainer" style="padding: 0 12px; margin-bottom: 12px; display: none;">
          <div style="background: #fee2e2; color: #7f1d1d; border: 1px solid #fecaca; border-radius: 0.375rem; padding: 12px; font-size: 0.875rem;">
            <span id="errorMessageText"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto;">
      <button class="bub-action-btn" id="historyBtn">
        <i class="bi bi-clock-history"></i> History
      </button>
      <button class="bub-action-btn" id="editBtn">
        <i class="bi bi-pencil"></i> Edit
      </button>
      <button class="bub-action-btn" id="saveBtn">
        <i class="bi bi-download"></i> Save
      </button>
      <button class="bub-action-btn" id="cancelBtn">
        <i class="bi bi-x-circle"></i> Cancel
      </button>
      <button class="bub-action-btn" id="backBtn">
        <i class="bi bi-arrow-left-circle"></i> Back
      </button>
    </div>
  </div>
</div>

<!-- History Modal -->
<div class="modal fade" id="blockingHistoryModal" tabindex="-1" aria-labelledby="blockingHistoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl" style="max-width: 90%;">
    <div class="modal-content">
      <div class="modal-header" style="background: #517a8e; color: white; padding: 12px 20px;">
        <h5 class="modal-title" id="blockingHistoryModalLabel">
          <span id="historyAccountTitle"></span> : IFB Control for Individual customer Murabaha Monhly
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" style="padding: 0;">
        <div style="display: grid; grid-template-columns: 1fr 160px; gap: 0; height: 500px;">
          <!-- Table Area -->
          <div style="overflow-y: auto; padding: 16px; background: white;">
            <table class="table table-bordered table-hover" id="blockingHistoryTable">
              <thead style="background: #517a8e; color: white; position: sticky; top: 0;">
                <tr>
                  <th style="width: 40px; text-align: center;">#</th>
                  <th>Blocked Date</th>
                  <th>Blocked Reason</th>
                  <th>Blocked Description</th>
                  <th>Blocked Instruction</th>
                </tr>
              </thead>
              <tbody id="blockingHistoryTableBody">
                <!-- Rows will be populated dynamically -->
              </tbody>
            </table>
          </div>
          
          <!-- Right Panel - Action Buttons -->
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px; background: #f9fafb; border-left: 1px solid #e5e7eb;">
            <button class="btn btn-secondary" id="hideHistoryBtn" data-bs-dismiss="modal" style="width: 100%; padding: 10px; font-weight: 600;">Hide</button>
            <button class="btn btn-secondary" id="editHistoryBtn" style="width: 100%; padding: 10px; font-weight: 600;">Edit</button>
            <button class="btn btn-secondary" id="saveHistoryBtn" style="width: 100%; padding: 10px; font-weight: 600;">Save</button>
            <button class="btn btn-secondary" id="cancelHistoryBtn" style="width: 100%; padding: 10px; font-weight: 600;">Cancel</button>
            <button class="btn btn-secondary" id="backHistoryBtn" data-bs-dismiss="modal" style="width: 100%; padding: 10px; font-weight: 600;">Back</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/environment.js"></script>
<script src="../../assets/js/services/shared/coreApi.js"></script>
<script src="../../assets/js/services/generalLedger/generalLedgerService.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="blocking-unblocking.js"></script>
</body>
</html>
