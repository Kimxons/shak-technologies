<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insurance Code · Static Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <!-- <link rel="stylesheet" href="../static-data/static-data.css" /> -->
</head>

<body class="insurance-code copilot-theme">
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-left">
        <span class="title-icon"><i class="bi bi-shield-check"></i></span>
        <span class="title-text">Insurance Code</span>
      </div>
      <div class="title-bar-right">
        <button class="title-btn refresh" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="title-btn close" title="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>
    <div class="main-container">
      <div class="form-content">
        <form id="insurance-code-form" autocomplete="off" novalidate>
          <div class="section-header">Insurance Code</div>
          <div class="form-row">
            <label class="bs-label bs-label-mand" for="InsuranceCode">Insurance Code</label>
            <input type="text" class="bs-input-text" id="InsuranceCode" name="InsuranceCode" required data-always-enabled />
            <button class="btn-lookup" type="button" aria-label="Search insurance code" data-insurance-code-action="search" data-always-enabled>
              <i class="bi bi-search"></i>
            </button>
          </div>
          <div class="form-row">
            <label class="bs-label" for="Description">Description</label>
            <input type="text" class="bs-input-text" id="Description" name="Description" />
          </div>
          <div class="form-row">
            <label class="bs-label" for="IsActive">Is Active</label>
            <input class="bs-checkbox" type="checkbox" id="IsActive" name="IsActive" />
            <label class="bs-label" for="IsActive">Active</label>
          </div>
          <div class="section-header">Behind The Scene</div>
          <div class="form-row two-col">
            <div class="col">
              <label class="bs-label" for="CreatedBy">Created By</label>
              <input type="text" class="bs-input-text audit-input" id="CreatedBy" name="CreatedBy" />
            </div>
            <div class="col">
              <label class="bs-label" for="ModifiedBy">Modified By</label>
              <input type="text" class="bs-input-text audit-input" id="ModifiedBy" name="ModifiedBy" />
            </div>
          </div>
          <div class="form-row two-col">
            <div class="col">
              <label class="bs-label" for="CreatedOn">Created On</label>
              <input type="text" class="bs-input-text audit-input" id="CreatedOn" name="CreatedOn" />
            </div>
            <div class="col">
              <label class="bs-label" for="ModifiedOn">Modified On</label>
              <input type="text" class="bs-input-text audit-input" id="ModifiedOn" name="ModifiedOn" />
            </div>
          </div>
          <div id="formToast" class="kairo-toast kairo-toast--success d-none" role="alert"></div>
        </form>
      </div>
      <aside class="action-panel">
        <div class="action-buttons">
          <button type="button" class="btn-action" data-shell-mode="View"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="btn-action" data-shell-mode="Add"><i class="bi bi-plus-circle"></i> Add</button>
          <button type="button" class="btn-action" data-shell-mode="Update"><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="btn-action" data-insurance-code-action="delete"><i class="bi bi-trash"></i> Delete</button>
          <button type="button" class="btn-action" data-insurance-code-action="save"><i class="bi bi-save"></i> Save</button>
          <button type="button" class="btn-action" data-insurance-code-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/static-data/insurance-code.js"></script>
</body>
</html>
