<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teller Declarations</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="teller-declarations.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="teller-declarations">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; margin-bottom: 12px; font-weight: 600; font-size: 0.85rem;">
            Query
          </div>

          <!-- Row 1: Operator ID and Currency ID -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Operator ID</label>
              <input type="text" class="form-control" id="operatorIdField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Currency ID</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="currencyIdField" style="flex: 1;" />
                <button class="td-search-btn" id="currencyIdSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Declarations Table Section -->
        <div style="padding: 12px; flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem;">
            Declarations
          </div>

          <div style="flex: 1; overflow: auto; border: 1px solid #d1d5db; border-radius: 0.375rem;">
            <table class="table" style="margin-bottom: 0;">
              <thead>
                <tr>
                  <th>Description</th>
                  <th>ValueID</th>
                  <th>Count</th>
                  <th>Amount</th>
                </tr>
              </thead>
              <tbody id="declarationsTableBody">
                <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                  <td colspan="4" style="padding: 20px;">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Total Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center;">
            <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; margin: 0; text-align: right;">Total</label>
            <input type="text" class="form-control" id="totalField" readonly style="background-color: #f9fafb;" value="0.00" />
          </div>
        </div>

        <!-- Status/Error Message Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div id="statusMessage" style="color: #dc2626; font-size: 0.8rem; font-weight: 500; min-height: 20px;">
            <!-- Status message will appear here -->
          </div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 12px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="td-action-btn" id="viewBtn">View</button>
      <button class="td-action-btn" id="editBtn">Edit</button>
      <button class="td-action-btn" id="deleteBtn">Delete</button>
      <button class="td-action-btn" id="saveBtn">Save</button>
      <button class="td-action-btn" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script src="teller-declarations.js"></script>
</body>
</html>
