<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasury Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="treasury-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Treasury Calculator Section -->
                        <div class="form-section" data-section="treasury-calculator">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-bank2"></i>Treasury Calculator</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col" style="grid-column: span 2;">
                                        <label>Security Type</label>
                                        <select class="bs-input-text" id="securityType" name="securityType">
                                            <option value="">--Select--</option>
                                            <option value="bills">Bills</option>
                                            <option value="bonds">Bonds</option>
                                            <option value="zero-coupon-bonds">Zero Coupon Bonds</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Face Value</label>
                                        <input type="number" class="bs-input-text" id="faceValue" name="faceValue" placeholder="Enter face value" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label>Coupon Rate (%)</label>
                                        <input type="number" class="bs-input-text" id="couponRate" name="couponRate" placeholder="Enter coupon rate" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label>Quoted Yield (%)</label>
                                        <input type="number" class="bs-input-text" id="quotedYield" name="quotedYield" placeholder="Enter quoted yield" step="0.01">
                                    </div>
                                    <div class="col">
                                        <label>Maturity (Days)</label>
                                        <input type="number" class="bs-input-text" id="maturity" name="maturity" placeholder="Enter maturity">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Results Section -->
                        <div class="form-section" data-section="calculation-results">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-graph-up"></i>Calculation Results</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Offer Price</label>
                                        <input type="text" class="bs-input-text" id="offerPrice" name="offerPrice" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Offer Payment</label>
                                        <input type="text" class="bs-input-text" id="offerPayment" name="offerPayment" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Discount Amount</label>
                                        <input type="text" class="bs-input-text" id="discountAmount" name="discountAmount" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Premium Amount</label>
                                        <input type="text" class="bs-input-text" id="premiumAmount" name="premiumAmount" readonly>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Interest</label>
                                        <input type="text" class="bs-input-text" id="interest" name="interest" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Tax Amount</label>
                                        <input type="text" class="bs-input-text" id="taxAmount" name="taxAmount" readonly>
                                    </div>
                                    <div class="col" style="grid-column: span 2;">
                                        <label class="fw-bold">Total Offer Payment</label>
                                        <input type="text" class="bs-input-text fs-5 fw-bold text-success" id="totalOfferPayment" name="totalOfferPayment" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-action--success" id="calculateBtn">
                        <i class="bi bi-calculator"></i>
                        <span>Calculate</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="treasury-calculator.js"></script>
</body>
</html>
