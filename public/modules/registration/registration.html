<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="registration-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Product Registration Section -->
                        <div class="form-section" data-section="product-registration">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-file-earmark-text"></i>Product Registration</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col" style="grid-column: span 2;">
                                        <label class="label-blue">Licence To</label>
                                        <input type="text" class="bs-input-text" id="licenceTo" name="licenceTo" placeholder="Enter organization name">
                                    </div>
                                    <div class="col">
                                        <label>No. Of Branch Licenses</label>
                                        <input type="number" class="bs-input-text" id="branchLicenses" name="branchLicenses" placeholder="Enter number of branch licenses">
                                    </div>
                                    <div class="col">
                                        <label>No. Of User Licenses</label>
                                        <input type="number" class="bs-input-text" id="userLicenses" name="userLicenses" placeholder="Enter number of user licenses">
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col" style="grid-column: span 4;">
                                        <label>Address</label>
                                        <textarea class="bs-input-text" id="address" name="address" rows="2" placeholder="Enter address"></textarea>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>City</label>
                                        <input type="text" class="bs-input-text" id="city" name="city" placeholder="Enter city">
                                    </div>
                                    <div class="col">
                                        <label>Country</label>
                                        <input type="text" class="bs-input-text" id="country" name="country" placeholder="Enter country">
                                    </div>
                                    <div class="col">
                                        <label>Contact Person Name</label>
                                        <input type="text" class="bs-input-text" id="contactPerson" name="contactPerson" placeholder="Enter contact person name">
                                    </div>
                                    <div class="col">
                                        <label>Email ID</label>
                                        <input type="email" class="bs-input-text" id="emailId" name="emailId" placeholder="Enter email address">
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Telephone No</label>
                                        <input type="tel" class="bs-input-text" id="telephoneNo" name="telephoneNo" placeholder="Enter telephone number">
                                    </div>
                                    <div class="col" style="grid-column: span 3;">
                                        <label>Register File Path</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="registerFilePath" class="kairo-branch-control__id" placeholder="Select file path" aria-label="File Path" readonly style="flex: 1;">
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="browseBtn"><i class="bi bi-folder2-open"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-action--success" id="registerBtn">
                        <i class="bi bi-check-circle"></i>
                        <span>Register</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="registration.js"></script>
</body>
</html>
