<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL - Cancel Stop Book</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="cancel-stop.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="gcs-container">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div style="padding: 16px; border-bottom: 1px solid #e5e7eb;">
          <!-- Row 1: Branch ID, Head Office -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; align-items: flex-end;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Branch ID</label>
              <input type="text" class="form-control" id="gcs-branch-id" value="0101" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Head Office</label>
              <input type="text" class="form-control" id="gcs-head-office" />
            </div>
          </div>

          <!-- Row 2: Account ID, Request Ref No -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Account ID</label>
              <input type="text" class="form-control" id="gcs-account-id" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Request Ref No</label>
              <input type="text" class="form-control" id="gcs-request-ref-no" />
            </div>
          </div>
        </div>

        <!-- Cheque Details Section -->
        <div style="padding: 16px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; font-weight: 600; font-size: 0.875rem; margin-bottom: 12px;">
            Cheque Cancellation Details
          </div>

          <!-- Row 1: Cheque No Start, Cheque No End -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque No Start</label>
              <input type="text" class="form-control" id="gcs-cheque-no-start" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque No End</label>
              <input type="text" class="form-control" id="gcs-cheque-no-end" />
            </div>
          </div>

          <!-- Row 2: Cheque Date, Cheque Amount -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque Date</label>
              <select class="form-select" id="gcs-cheque-date">
                <option selected>--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque Amount</label>
              <input type="text" class="form-control" id="gcs-cheque-amount" />
            </div>
          </div>

          <!-- Row 3: Reason ID, Reason -->
          <div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; margin-bottom: 12px; align-items: flex-end;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Reason ID</label>
              <select class="form-select" id="gcs-reason-id">
                <option selected>--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Reason</label>
              <input type="text" class="form-control" id="gcs-reason" />
            </div>
          </div>

          <!-- Row 4: Cancellation Date, Instruction Given By -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cancellation Date</label>
              <input type="date" class="form-control" id="gcs-cancellation-date" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Instruction Given By</label>
              <input type="text" class="form-control" id="gcs-instruction-given-by" />
            </div>
          </div>
        </div>

        <!-- Data Table Section -->
        <div style="padding: 16px; border-bottom: 1px solid #e5e7eb;">
          <div style="border: 1px solid #d1d5db; border-radius: 0.375rem; overflow: hidden;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.875rem;">
              <thead style="background: #f3f4f6; border-bottom: 1px solid #d1d5db;">
                <tr>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Prefix</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Start</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">End</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Cheque Date</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Reason</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Cancel Date</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Amount</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151;">InstructionGivenBy</th>
                </tr>
              </thead>
              <tbody>
                <tr style="border-bottom: 1px solid #d1d5db;">
                  <td style="padding: 8px 12px; border-right: 1px solid #d1d5db; color: #6b7280;">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div style="padding: 16px; background: #5b9fd9; color: white; border-radius: 0.375rem; margin-bottom: 12px;">
          <div style="font-weight: 600; font-size: 0.9375rem; margin-bottom: 12px;">Behind The Scene</div>
          
          <!-- Row 1: Currency ID -->
          <div style="display: grid; grid-template-columns: 150px 1fr 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.85); font-size: 0.875rem; display: block; margin-bottom: 4px;">Currency ID</label>
              <input type="text" class="form-control" id="gcs-currency-id" readonly style="background-color: rgba(255, 255, 255, 0.08); color: white; border-color: rgba(255, 255, 255, 0.2);" />
            </div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 16px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 12px; border-radius: 0.375rem; font-weight: 600; font-size: 0.9375rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="gcs-action-btn" id="gcs-view-btn">View</button>
      <button class="gcs-action-btn" id="gcs-add-btn">Add</button>
      <button class="gcs-action-btn" id="gcs-edit-btn">Edit</button>
      <button class="gcs-action-btn" id="gcs-delete-btn">Delete</button>
    </div>
  </div>
</div>

<script src="cancel-stop.js"></script>
</body>
</html>
