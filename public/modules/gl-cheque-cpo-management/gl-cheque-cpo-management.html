<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL - Cheque / CPO Management</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="gl-cheque-cpo-management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cheque-container">
        <div class="cheque-content">
            <!-- Debit Details Section -->
            <div class="debit-details-section">
                <div class="section-header">Debit Details</div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="debitAccountType">Account Type</label>
                        <select id="debitAccountType" class="form-control">
                            <option value="">Select</option>
                            <option value="general-ledger" selected>General Ledger</option>
                            <option value="customer">Customer</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="debitBranchId">Branch ID</label>
                        <input type="text" id="debitBranchId" class="form-control" value="0101">
                        <span class="branch-label">Head Office</span>
                        <button type="button" class="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>

                    <div class="form-row">
                        <label for="debitAccountId">Account ID</label>
                        <input type="text" id="debitAccountId" class="form-control">
                        <button type="button" class="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>

                    <div class="form-row">
                        <label for="requestRefNo">Request Ref No</label>
                        <input type="text" id="requestRefNo" class="form-control">
                        <button type="button" class="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Credit Details Section -->
            <div class="credit-details-section">
                <div class="section-header">Credit Details</div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="creditAccountType">Account Type</label>
                        <select id="creditAccountType" class="form-control">
                            <option value="">Select</option>
                            <option value="general-ledger">General Ledger</option>
                            <option value="customer" selected>Customer</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="creditBranchId">Branch ID</label>
                        <input type="text" id="creditBranchId" class="form-control">
                        <button type="button" class="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>

                    <div class="form-row">
                        <label for="creditAccountId">Account ID</label>
                        <input type="text" id="creditAccountId" class="form-control">
                        <button type="button" class="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Book Details Section -->
            <div class="book-details-section">
                <div class="section-header">Book Details</div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="bookType">Book Type</label>
                        <select id="bookType" class="form-control">
                            <option value="">Select</option>
                            <option value="25-leafs" selected>25 Leafs - Cheque Book</option>
                            <option value="50-leafs">50 Leafs - Cheque Book</option>
                            <option value="100-leafs">100 Leafs - Cheque Book</option>
                        </select>

                        <label for="noOfBooks" style="margin-left: 20px;">No Of Books</label>
                        <input type="text" id="noOfBooks" class="form-control" style="width: 150px;">
                    </div>

                    <div class="form-row">
                        <label for="seriesFrom">Series From</label>
                        <input type="text" id="seriesFrom" class="form-control">

                        <label for="seriesTo" style="margin-left: 20px;">Series To</label>
                        <input type="text" id="seriesTo" class="form-control">
                    </div>
                </div>
            </div>

            <!-- Data Grid -->
            <div class="data-grid">
                <table id="chequeTable">
                    <thead>
                        <tr>
                            <th>ToBranch</th>
                            <th>AccountID</th>
                            <th>BookType</th>
                            <th>No of books</th>
                            <th>Series From</th>
                            <th>Series To</th>
                            <th>Created By</th>
                            <th>Created On</th>
                            <th>Approved By</th>
                            <th>Approved On</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="no-data">
                            <td colspan="10">No records to display.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Behind The Scene Section -->
            <div class="behind-scene-section">
                <div class="section-header">Behind The Scene</div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="currencyId">Currency ID</label>
                        <input type="text" id="currencyId" class="form-control" readonly>

                        <label for="status" style="margin-left: 40px;">Status</label>
                        <input type="text" id="status" class="form-control" readonly>
                    </div>

                    <div class="form-row">
                        <label for="createdBy">Created By</label>
                        <input type="text" id="createdBy" class="form-control" readonly>

                        <label for="supervisedBy" style="margin-left: 40px;">Supervised By</label>
                        <input type="text" id="supervisedBy" class="form-control" readonly>
                    </div>

                    <div class="form-row">
                        <label for="createdOn">Created On</label>
                        <input type="text" id="createdOn" class="form-control" readonly>

                        <label for="supervisedOn" style="margin-left: 40px;">Supervised On</label>
                        <input type="text" id="supervisedOn" class="form-control" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Panel -->
        <div class="action-panel">
            <button type="button" class="action-btn action-btn-dispatch">
                <i class="fas fa-paper-plane"></i>
                Dispatch
            </button>
            <button type="button" class="action-btn action-btn-view">
                <i class="fas fa-eye"></i>
                View
            </button>
            <button type="button" class="action-btn action-btn-add">
                <i class="fas fa-plus"></i>
                Add
            </button>
            <button type="button" class="action-btn action-btn-edit">
                <i class="fas fa-edit"></i>
                Edit
            </button>
            <button type="button" class="action-btn action-btn-delete">
                <i class="fas fa-trash"></i>
                Delete
            </button>
            <button type="button" class="action-btn action-btn-save" disabled>
                <i class="fas fa-save"></i>
                Save
            </button>
            <button type="button" class="action-btn action-btn-cancel">
                <i class="fas fa-times"></i>
                Cancel
            </button>
        </div>
    </div>

    <script src="gl-cheque-cpo-management.js"></script>
</body>
</html>
