<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supervision Transactions</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="supervision-transactions.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="supervision-transactions">
  <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px; height: 100%;">
    <div style="overflow-y: auto; flex: 1;">
      <!-- Transactions Section -->
      <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
        <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; margin-bottom: 12px; font-weight: 600; font-size: 0.85rem;">
          Transactions
        </div>

        <!-- Transactions Table -->
        <div style="overflow: auto; border: 1px solid #d1d5db; border-radius: 0.375rem; margin-bottom: 12px;">
          <table class="table" style="margin-bottom: 0;">
            <thead>
              <tr>
                <th>UserID</th>
                <th>TransactionType</th>
                <th>AccountName</th>
                <th>Amount</th>
                <th>Trx.BranchID</th>
              </tr>
            </thead>
            <tbody id="transactionTableBody">
              <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                <td colspan="5" style="padding: 20px;">No records to display.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Remarks Section -->
      <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
        <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem;">
          Remarks
        </div>

        <div>
          <textarea class="form-control" id="remarksField" rows="3" placeholder="Enter remarks"></textarea>
        </div>
      </div>

      <!-- Locking For Approval Section -->
      <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="lockingForApprovalCheckbox" />
          <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; margin: 0;">Locking For Approval</label>
        </div>
      </div>

      <!-- Action Buttons Section -->
      <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <button class="st-action-btn" id="superviseBtn">Supervise</button>
          <button class="st-action-btn" id="rejectBtn">Reject</button>
        </div>
      </div>

      <!-- BR.Net Web Banking Section -->
      <div style="padding: 12px; border-top: 1px solid #e5e7eb;">
        <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem;">
          BR.Net Web Banking
        </div>
      </div>
    </div>
  </div>
</div>

<script src="supervision-transactions.js"></script>
</body>
</html>
