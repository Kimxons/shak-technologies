<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsupervised Data View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="unsupervised-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Unsupervised Data Table Section -->
                        <div class="form-section" data-section="unsupervised-data">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-eye"></i>Unsupervised Data</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-hover table-sm">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Module Name</th>
                                                <th>Operator ID</th>
                                                <th>Event ID</th>
                                                <th>Remarks</th>
                                            </tr>
                                        </thead>
                                        <tbody id="dataTableBody">
                                            <tr>
                                                <td colspan="4" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Status Message Section -->
                        <div class="form-section" data-section="status-message">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-info-circle"></i>Status</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="alert alert-info mb-0 d-flex align-items-center" id="statusMessage">
                                    <i class="bi bi-info-circle me-2"></i>
                                    <span id="messageText">There is no data to supervise</span>
                                    <span class="ms-2 text-danger" id="messageCode"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-delete" id="rejectBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Reject</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="unsupervised-data-view.js"></script>
</body>
</html>
