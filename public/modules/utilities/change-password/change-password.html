<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Password · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <style>
    /* Specific overrides to match the form groups from Identity Settings */
    .bank-settings-section {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      height: 100%;
    }

    .bank-settings-header {
      background: linear-gradient(to right, rgba(59, 130, 246, 0.1), transparent);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.5rem 1rem;
      margin: -1rem -1rem 1rem -1rem;
      border-radius: 0.5rem 0.5rem 0 0;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cbs-label {
      font-weight: 600;
      color: #1e3a8a;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      text-align: right;
      padding-right: 10px;
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .form-row .cbs-label {
      width: 180px;
      flex-shrink: 0;
    }

    .form-row .cbs-input {
      flex: 1;
    }

    .side-btn {
      width: 100%;
      margin-bottom: 0.5rem;
      padding: 0.5rem;
      text-align: center;
      background-color: #e0e0e0;
      border: 1px solid #ccc;
      font-weight: 500;
    }

    .side-btn:hover {
      background-color: #d0d0d0;
    }

    .behind-scene-label {
      font-size: 0.8rem;
      color: #666;
    }

    .change-password-container {
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
</head>

<body class="client-maintenance copilot-theme" data-page="change-password" style="background: transparent;">
  <div class="container-fluid p-3 h-100">
    <div class="row h-100">
      <!-- Main Content Area -->
      <div class="col-10 d-flex flex-column">
        <div class="change-password-container">
          <!-- Change Password Form -->
          <section class="bank-settings-section card-surface mb-3 flex-shrink-0">
            <form id="changePasswordForm">
              <div class="form-row">
                <label class="cbs-label">User</label>
                <div class="cbs-input">
                  <input type="text" class="form-control form-control-sm" id="userName" value="CSADM" readonly
                    style="max-width: 200px; background-color: #f8f9fa;">
                </div>
              </div>

              <div class="form-row">
                <label class="cbs-label">Old Password</label>
                <div class="cbs-input">
                  <input type="password" class="form-control form-control-sm" id="oldPassword" required
                    style="max-width: 300px;">
                </div>
              </div>

              <div class="form-row">
                <label class="cbs-label">New Password</label>
                <div class="cbs-input">
                  <input type="password" class="form-control form-control-sm" id="newPassword" required
                    style="max-width: 300px;">
                </div>
              </div>

              <div class="form-row">
                <label class="cbs-label">Confirm Password</label>
                <div class="cbs-input">
                  <input type="password" class="form-control form-control-sm" id="confirmPassword" required
                    style="max-width: 300px;">
                </div>
              </div>

              <div class="form-row">
                <div style="width: 180px;"></div> <!-- Spacer -->
                <div class="cbs-input">
                  <div id="passwordMessage" class="small text-danger" style="display: none;"></div>
                  <div id="successMessage" class="small text-success" style="display: none;"></div>
                </div>
              </div>
            </form>
          </section>
        </div>
      </div>

      <!-- Side Buttons -->
      <div class="col-2">
        <div class="d-flex flex-column h-100 justify-content-center pb-3">
          <div class="d-grid gap-2">
            <button class="btn side-btn" id="okBtn" type="button">OK</button>
            <button class="btn side-btn" id="cancelBtn" type="button">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Behind The Scene -->
    <div class="row mt-3">
      <div class="col-12">
        <section class="bank-settings-section card-surface mb-0">
          <div class="bank-settings-header text-white bg-primary" style="background: #0d6efd;">Behind The Scene</div>
          <div class="row g-2">
            <div class="col-md-4">
              <div class="d-flex align-items-center mb-1">
                <label class="behind-scene-label me-2 w-25 text-end">Created By</label>
                <input type="text" class="form-control form-control-sm w-75" readonly>
              </div>
              <div class="d-flex align-items-center">
                <label class="behind-scene-label me-2 w-25 text-end">Created On</label>
                <input type="text" class="form-control form-control-sm w-75" readonly>
              </div>
            </div>
            <div class="col-md-4">
              <div class="d-flex align-items-center mb-1">
                <label class="behind-scene-label me-2 w-25 text-end">Modified By</label>
                <input type="text" class="form-control form-control-sm w-75" readonly>
              </div>
              <div class="d-flex align-items-center">
                <label class="behind-scene-label me-2 w-25 text-end">Modified On</label>
                <input type="text" class="form-control form-control-sm w-75" readonly>
              </div>
            </div>
            <div class="col-md-4">
              <div class="d-flex align-items-center mb-1">
                <label class="behind-scene-label me-2 w-25 text-end">Supervised By</label>
                <input type="text" class="form-control form-control-sm w-75" readonly>
              </div>
              <div class="d-flex align-items-center">
                <label class="behind-scene-label me-2 w-25 text-end">Supervised On</label>
                <input type="text" class="form-control form-control-sm w-75" readonly>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div class="row mt-1">
      <div class="col-12 small text-muted">
        BR.Net Web Banking
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="change-password.js"></script>
</body>

</html>
