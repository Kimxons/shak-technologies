<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Definable Fields · Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <style>
    /* Specific overrides to match the form groups from Bank Settings */
    .bank-settings-section {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .bank-settings-header {
      background: linear-gradient(to right, rgba(59, 130, 246, 0.1), transparent);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.5rem 1rem;
      margin: -1rem -1rem 1rem -1rem;
      border-radius: 0.5rem 0.5rem 0 0;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Layout specific for this screen to match screenshot */
    .udf-container {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 1rem;
    }

    .udf-form-grid {
      display: grid;
      grid-template-columns: min-content 1fr min-content 1fr;
      gap: 0.5rem 1rem;
      align-items: center;
    }

    .udf-label {
      white-space: nowrap;
      color: #1e3a8a; /* Blue color from screenshot */
      font-weight: 600;
      font-size: 0.9rem;
      text-align: right;
    }

    .udf-label.optional {
        color: #333;
        font-weight: normal;
    }

    /* Button panel */
    .udf-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn-nav-group {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 0.5rem;
    }

    .btn-nav {
         color: #6da830;
         font-size: 1.5rem;
         background: none;
         border: none;
         cursor: pointer;
    }

    .btn-udf {
      width: 100%;
      text-align: center;
      padding: 0.375rem 0.75rem;
      background-color: #e0e0e0;
      border: 1px solid #999;
      color: #000;
      font-weight: 600;
      /* Simulating the gradient/3d look loosely or just standard btn */
      background: linear-gradient(to bottom, #f0f0f0, #d0d0d0);
    }

    .btn-udf:hover {
        background: linear-gradient(to bottom, #e0e0e0, #c0c0c0);
    }

    /* Behind the scene */
    .bts-grid {
      display: grid;
      grid-template-columns: min-content 1fr min-content 1fr min-content 1fr;
      gap: 0.5rem 1rem;
      align-items: center;
    }

    /* Ensure form controls look like the screenshot (rectangular, simple) */
    .form-control-sm, .form-select-sm {
        border-radius: 0.2rem;
    }
  </style>
</head>

<body class="copilot-theme" data-page="user-definable-fields">
  <div class="cm-workspace" style="padding: 1rem;">
    <!-- Main Content -->
     <section class="bank-settings-section" style="background: #e6f2ff; border: 1px solid #a0c0e0;">
        <div class="bank-settings-header" style="background: none; border-bottom: none; color: #1e3a8a; padding-bottom: 0;">
            User Definable Fields
        </div>
        <hr style="margin-top: 0.5rem; border-color: #a0c0e0;">

        <div class="udf-container">
            <!-- Left Side: Form -->
            <div>
                <div class="card p-3 mb-3" style="background-color: #f0f8ff; border: 1px solid #8cb6e6;">
                    <div class="udf-form-grid">
                        <!-- Row 1 -->
                        <label class="udf-label">Field Name</label>
                        <div style="grid-column: span 3; position: relative;">
                            <div class="input-group input-group-sm">
                                <input type="text" class="form-control" aria-label="Field Name">
                                <button class="btn btn-outline-secondary" type="button"><i class="fas fa-search"></i></button>
                            </div>
                        </div>

                        <!-- Row 2 -->
                        <label class="udf-label">Field Caption</label>
                        <div style="grid-column: span 3;">
                            <input type="text" class="form-control form-control-sm" aria-label="Field Caption">
                        </div>

                        <!-- Row 3 -->
                        <label class="udf-label">Value Type ID</label>
                        <div>
                             <select class="form-select form-select-sm" aria-label="Value Type ID">
                                <option>--Select--</option>
                            </select>
                        </div>
                        <label class="udf-label" style="text-align: right;">Data Source</label>
                        <div>
                            <select class="form-select form-select-sm" aria-label="Data Source">
                                <option>--Select--</option>
                            </select>
                        </div>

                        <!-- Row 4 -->
                        <label class="udf-label optional">Maximum Length</label>
                        <div style="grid-column: span 3; width: 50%;">
                             <input type="text" class="form-control form-control-sm" aria-label="Maximum Length">
                        </div>

                        <!-- Row 5 -->
                         <label class="udf-label optional">Minimum Value</label>
                        <div style="grid-column: span 3; width: 50%;">
                             <input type="text" class="form-control form-control-sm" aria-label="Minimum Value">
                        </div>

                        <!-- Row 6 -->
                         <label class="udf-label optional">Maximum Value</label>
                        <div style="grid-column: span 3; width: 50%;">
                             <input type="text" class="form-control form-control-sm" aria-label="Maximum Value">
                        </div>

                        <!-- Row 7 -->
                        <label class="udf-label optional">Default Text</label>
                        <div style="grid-column: span 3; width: 50%;">
                             <input type="text" class="form-control form-control-sm" aria-label="Default Text">
                        </div>
                    </div>
                </div>

                 <!-- Behind The Scene -->
                <div class="bank-settings-section" style="background-color: #f0f8ff; border: 1px solid #8cb6e6;">
                     <div class="bank-settings-header" style="background: #0078d7; color: white; margin: -1rem -1rem 1rem -1rem; padding: 0.3rem 1rem; border-radius: 0.5rem 0.5rem 0 0;">
                        Behind The Scene
                    </div>
                    <div class="bts-grid">
                        <label class="udf-label optional" style="text-align: right;">Created By</label>
                        <input type="text" class="form-control form-control-sm" readonly aria-label="Created By">

                        <label class="udf-label optional" style="text-align: right;">Modified By</label>
                        <input type="text" class="form-control form-control-sm" readonly aria-label="Modified By">

                        <label class="udf-label optional" style="text-align: right;">Supervised By</label>
                        <input type="text" class="form-control form-control-sm" readonly aria-label="Supervised By">

                        <label class="udf-label optional" style="text-align: right;">Created On</label>
                        <input type="text" class="form-control form-control-sm" readonly aria-label="Created On">

                        <label class="udf-label optional" style="text-align: right;">Modified On</label>
                        <input type="text" class="form-control form-control-sm" readonly aria-label="Modified On">

                        <label class="udf-label optional" style="text-align: right;">Supervised On</label>
                        <input type="text" class="form-control form-control-sm" readonly aria-label="Supervised On">
                    </div>
                </div>

            </div>

             <!-- Right Side: Buttons -->
            <div>
                 <div class="btn-nav-group">
                    <button class="btn-nav"><i class="fas fa-arrow-left"></i></button>
                    <button class="btn-nav"><i class="fas fa-arrow-right"></i></button>
                 </div>
                 <div class="udf-buttons">
                     <button class="btn btn-udf"><u>V</u>iew</button>
                     <button class="btn btn-udf"><u>A</u>dd</button>
                     <button class="btn btn-udf"><u>E</u>dit</button>
                     <button class="btn btn-udf"><u>D</u>elete</button>
                     <button class="btn btn-udf"><u>S</u>ave</button>
                     <button class="btn btn-udf"><u>C</u>ancel</button>
                 </div>
            </div>
        </div>

    </section>

    <div style="border-top: 1px solid #ccc; margin-top: 1rem; padding-top: 0.5rem; font-size: 0.8rem; color: #555;">
        BR.Net Web Banking
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
