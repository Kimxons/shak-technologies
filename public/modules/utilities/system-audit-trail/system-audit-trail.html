<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Audit Trail · System Utilities</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../../assets/css/styles.css" />
    <style>
        .cbs-label {
            font-weight: 600;
            color: #1e3a8a;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            text-align: right;
            padding-right: 10px;
        }

        .cbs-label.text-black {
            color: #000;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .form-row .cbs-label {
            width: 120px;
        }

        .form-row .cbs-input {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .side-btn {
            width: 100%;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            text-align: center;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            font-weight: 500;
        }

        .side-btn:hover {
            background-color: #d0d0d0;
        }

        .search-btn {
            border: none;
            background: transparent;
            color: #1e3a8a;
            padding: 0 5px;
        }

        .status-bar {
            border-top: 1px solid #ccc;
            padding-top: 5px;
        }

        .error-message {
            color: red;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .table-container {
            border: 1px solid #dee2e6;
            background: white;
            /* min-height: 150px; removed to let flex dictate size */
            /* overflow: auto; handled by inner div */
        }

        .blue-header-bar {
             background-color: #007bb6;
             height: 25px;
             margin: -1rem -1rem 1rem -1rem;
             border-radius: 0.5rem 0.5rem 0 0;
             border-bottom: 1px solid #005a8c;
        }

        .table-bordered thead th, .table-bordered thead td {
            border-bottom-width: 2px;
        }

        .table thead th {
             background: linear-gradient(to bottom, #f0f0f0, #e0e0e0);
             color: #333;
             font-weight: 600;
             font-size: 0.85rem;
             border-bottom: 1px solid #ccc;
             vertical-align: middle;
        }

        .sticky-header thead th {
             position: sticky;
             top: 0;
             z-index: 1;
             box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.4);
        }

        /* Adjust for date inputs to look clean */
        input[type="date"].form-control-sm {
            width: 130px;
        }

    </style>
</head>

<body class="copilot-theme" style="background: transparent; height: 100vh; overflow: hidden;">
    <div class="container-fluid p-3 h-100 d-flex flex-column">

        <div class="row flex-grow-1">
            <!-- Main Content Area -->
            <div class="col-10 d-flex flex-column">
                <section class="bank-settings-section card-surface mb-2 p-3 flex-shrink-0">
                    <!-- Form Fields -->
                    <div class="form-row">
                        <label class="cbs-label">Branch ID</label>
                        <div class="cbs-input" style="max-width: 600px;">
                            <input type="text" class="form-control form-control-sm bg-white" value="0101" style="width: 80px;" readonly>
                            <button class="search-btn"><i class="bi bi-search"></i></button>
                            <input type="text" class="form-control form-control-sm bg-white" value="Head Office" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="cbs-label">Module ID</label>
                        <div class="cbs-input" style="max-width: 600px;">
                            <input type="text" class="form-control form-control-sm bg-white" value="1000" style="width: 80px;">
                            <button class="search-btn"><i class="bi bi-search"></i></button>
                            <input type="text" class="form-control form-control-sm bg-white" value="Client Maintenance" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="cbs-label">Operator ID</label>
                        <div class="cbs-input" style="max-width: 600px;">
                            <input type="text" class="form-control form-control-sm bg-white" value="ADMIN" style="width: 150px;">
                            <button class="search-btn"><i class="bi bi-search"></i></button>
                            <input type="text" class="form-control form-control-sm bg-white" value="Temesgen Gebreegziabher ." readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="cbs-label">From Date</label>
                        <div class="cbs-input" style="max-width: 600px;">
                             <div class="d-flex align-items-center gap-2">
                                 <input type="date" class="form-control form-control-sm" value="2025-12-01">

                                 <label class="cbs-label" style="width: auto; margin-right: 0;">To Date</label>
                                 <input type="date" class="form-control form-control-sm" value="2025-12-31">
                             </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="cbs-label text-black">Event</label>
                        <div class="cbs-input" style="max-width: 400px;">
                            <select class="form-select form-select-sm">
                                <option>View</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="cbs-label text-black">Search Criteria</label>
                        <div class="cbs-input">
                            <input type="text" class="form-control form-control-sm">
                        </div>
                    </div>

                </section>

                <!-- Tables Section -->
                 <div class="flex-grow-1 d-flex flex-column gap-2" style="min-height: 0; padding-bottom: 5px;">

                    <!-- Table 1 -->
                    <div class="table-container flex-fill d-flex flex-column">
                        <div class="flex-grow-1 overflow-auto">
                            <table class="table table-sm table-bordered table-striped table-hover mb-0 sticky-header">
                                <thead style="position: sticky; top: 0; z-index: 5;">
                                    <tr>
                                        <th>Log ID</th>
                                        <th>Operator ID</th>
                                        <th>Event ID</th>
                                        <th>Time Stamp</th>
                                        <th>IP Address</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="5" class="p-2">No records to display.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Table 2 -->
                    <div class="table-container flex-fill d-flex flex-column">
                         <div class="flex-grow-1 overflow-auto">
                            <table class="table table-sm table-bordered table-striped table-hover mb-0 sticky-header">
                                <thead style="position: sticky; top: 0; z-index: 5;">
                                    <tr>
                                        <th>Table Name</th>
                                        <th>Node</th>
                                        <th>Old Value</th>
                                        <th>New Value</th>
                                        <th>Is Same</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="5" class="p-2">No records to display.</td>
                                    </tr>
                                </tbody>
                            </table>
                         </div>
                    </div>

                 </div>
            </div>

            <!-- Right Buttons -->
            <div class="col-2">
                 <div class="d-flex flex-column h-100 justify-content-end pb-3">
                     <div class="d-grid gap-2">
                         <button class="btn side-btn">View</button>
                         <button class="btn side-btn">Alter</button>
                         <button class="btn side-btn">Cancel</button>
                     </div>
                 </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="row mt-auto">
            <div class="col-12 px-3 pt-2">
                 <div class="error-message mb-1">No details Found [No:1011]</div>
                 <div class="status-bar small text-muted">
                     BR.Net Web Banking
                 </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
