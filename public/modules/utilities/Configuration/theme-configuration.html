<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css">
    <link rel="stylesheet" href="theme-configuration.css">
    <script src="../../../assets/js/theme-core.js"></script>
    <script src="../../../assets/js/theme.js"></script>
    <!-- Theme Configuration Service - Calls API endpoints through view controller -->
    <script src="../../../assets/js/services/theme/themeService.js"></script>
    <!-- Theme Configuration Controller - Handles module interactions and business logic -->
    <script src="../../../assets/js/modules/themeconfiguration/themeconfigurationcontroller.js"></script>
</head>
<body data-page="theme-configuration">
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="theme-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Preset Themes Section -->
                        <div class="form-section theme-config-section" data-section="presets">
                            <div class="section-header section-header-modern" data-section-toggle>
                                <span class="section-header__title">
                                    <i class="bi bi-palette-fill me-2 theme-section-icon"></i>
                                    <strong>Preset Themes</strong>
                                </span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content section-content-modern" data-section-content>
                                <p class="text-muted mb-3">Select a preset theme to apply instantly across the system</p>

                                <div class="theme-filter-tabs mb-3" role="tablist">
                                    <button type="button" class="theme-filter-tab active" data-filter="all">All</button>
                                    <button type="button" class="theme-filter-tab" data-filter="light">Light</button>
                                    <button type="button" class="theme-filter-tab" data-filter="dark">Dark</button>
                                    <button type="button" class="theme-filter-tab" data-filter="corporate">Corporate</button>
                                    <button type="button" class="theme-filter-tab" data-filter="creative">Creative</button>
                                </div>

                                <div class="theme-toolbar mb-3">
                                    <label class="theme-toolbar-option">
                                        <input type="checkbox" id="themeCompactMode" data-option="compact"> Compact view
                                    </label>
                                </div>
                                
                                <div class="row g-3" id="presetsContainer">
                                    <!-- Preset theme cards will be inserted here by JavaScript -->
                                </div>

                                <div class="alert alert-info d-flex align-items-center gap-2 mt-4" role="alert" style="border-radius: 8px;">
                                    <i class="bi bi-info-circle"></i>
                                    <div>Selecting a preset will apply all theme colors instantly across the entire system.</div>
                                </div>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Theme Configuration Module - MVC Pattern: Utilities -> Assets modules for JS/CSS -->
    <script src="../../../assets/js/modules/themeconfiguration/theme-configuration.js"></script>
</body>
</html>
