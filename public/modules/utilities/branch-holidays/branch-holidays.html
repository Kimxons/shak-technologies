<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branch Holidays</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <link rel="stylesheet" href="branch-holidays.css" />
</head>

<body class="copilot-theme">
  <div class="cm-workspace">
    <div class="d-flex w-100 h-100 p-2 gap-2">
        <div class="flex-grow-1 d-flex flex-column">
             <!-- Header Section -->
             <div class="header-section card-surface mb-2 p-2 d-flex align-items-center border-bottom border-primary">
                 <label class="fw-bold me-2 text-custom-blue">Branch ID</label>
                 <div class="input-group input-group-sm" style="width: 300px;">
                     <input type="text" class="form-control" value="0101">
                     <input type="text" class="form-control flex-grow-1" value="Head Office" readonly>
                     <span class="input-group-text"><i class="bi bi-search"></i></span>
                 </div>
             </div>

             <!-- Tabs -->
            <nav>
                <div class="nav nav-tabs cm-tabs__nav" id="nav-tab" role="tablist">
                    <button class="nav-link active small py-1 px-3" id="nav-edit-holiday-tab" data-bs-toggle="tab" data-bs-target="#nav-edit-holiday" type="button" role="tab">Edit Holiday</button>
                    <button class="nav-link small py-1 px-3" id="nav-mark-holidays-tab" data-bs-toggle="tab" data-bs-target="#nav-mark-holidays" type="button" role="tab">Mark Holidays</button>
                </div>
            </nav>

            <div class="tab-content card-surface p-3 flex-grow-1 border-top-0" id="nav-tabContent">
                <!-- Edit Holiday Tab -->
                <div class="tab-pane fade show active" id="nav-edit-holiday" role="tabpanel">
                    <div class="main-form mb-3 pt-2 px-3" style="border: 1px solid #3b82f6; padding-bottom: 2rem;">
                        <h6 class="text-white bg-custom-blue d-inline-block px-2 py-1 mb-3" style="margin-left: -1rem; margin-top: -0.5rem; width: 100%;">Edit Holiday</h6>

                         <div class="row mb-2 align-items-center">
                             <div class="col-2 text-end text-custom-blue fw-bold">Date</div>
                             <div class="col-4">
                                 <div class="input-group input-group-sm">
                                    <select class="form-select"><option>--Select--</option></select>
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                 </div>
                             </div>
                         </div>
                         <div class="row mb-2 align-items-center">
                             <div class="col-2 text-end fw-bold">Holiday For</div>
                             <div class="col-6">
                                 <input type="text" class="form-control form-control-sm">
                             </div>
                         </div>
                         <div class="row mb-2 align-items-center">
                             <div class="col-2 text-end text-custom-blue fw-bold">Holiday Type</div>
                             <div class="col-6">
                                 <div class="border p-1">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="ht-branch">
                                        <label class="form-check-label" for="ht-branch">Branch</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="ht-clearing">
                                        <label class="form-check-label" for="ht-clearing">Clearing</label>
                                    </div>
                                 </div>
                             </div>
                         </div>
                         <div class="row mb-2">
                             <div class="col-2 text-end fw-bold">Reason</div>
                             <div class="col-8">
                                 <textarea class="form-control form-control-sm" rows="3"></textarea>
                             </div>
                         </div>
                    </div>

                    <!-- Behind The Scene -->
                    <div class="behind-the-scene p-2 mt-2" style="background-color: #eaf6ff; border: 1px solid #cce5ff;">
                        <div class="text-white bg-custom-blue px-2 py-1 mb-2" style="font-size: 0.85rem;">Behind The Scene</div>
                        <div class="row g-2">
                             <div class="col-md-4 d-flex align-items-center gap-2">
                                 <label class="small text-nowrap fw-bold" style="width: 80px;">Created By</label>
                                 <input type="text" class="form-control form-control-sm" readonly>
                             </div>
                             <div class="col-md-4 d-flex align-items-center gap-2">
                                 <label class="small text-nowrap fw-bold" style="width: 80px;">Modified By</label>
                                 <input type="text" class="form-control form-control-sm" readonly>
                             </div>
                             <div class="col-md-4 d-flex align-items-center gap-2">
                                 <label class="small text-nowrap fw-bold" style="width: 80px;">Supervised By</label>
                                 <input type="text" class="form-control form-control-sm" readonly>
                             </div>
                             <div class="col-md-4 d-flex align-items-center gap-2">
                                 <label class="small text-nowrap fw-bold" style="width: 80px;">Created On</label>
                                 <input type="text" class="form-control form-control-sm" readonly>
                             </div>
                             <div class="col-md-4 d-flex align-items-center gap-2">
                                 <label class="small text-nowrap fw-bold" style="width: 80px;">Modified On</label>
                                 <input type="text" class="form-control form-control-sm" readonly>
                             </div>
                             <div class="col-md-4 d-flex align-items-center gap-2">
                                 <label class="small text-nowrap fw-bold" style="width: 80px;">Supervised On</label>
                                 <input type="text" class="form-control form-control-sm" readonly>
                             </div>
                        </div>
                    </div>
                </div>

                <!-- Mark Holidays Tab -->
                <div class="tab-pane fade" id="nav-mark-holidays" role="tabpanel">
                     <div class="main-form mb-3 pt-2 px-3" style="border: 1px solid #3b82f6;">
                        <h6 class="text-white bg-custom-blue d-inline-block px-2 py-1 mb-3" style="margin-left: -1rem; margin-top: -0.5rem; width: 100%;">Mark Holidays</h6>

                         <div class="row mb-2 align-items-center">
                             <div class="col-3 text-end text-custom-blue fw-bold">Marking Holiday For</div>
                             <div class="col-4">
                                 <select class="form-select form-select-sm">
                                    <option>Specific Date</option>
                                 </select>
                             </div>
                         </div>
                         <div class="row mb-2 align-items-center">
                             <div class="col-3 text-end fw-bold">Date</div>
                             <div class="col-4">
                                 <select class="form-select form-select-sm"><option>--Select--</option></select>
                             </div>
                         </div>

                         <!-- Weekly Off Box -->
                         <div class="border p-2 mb-3 ms-5 me-5" style="border-color: #3b82f6 !important;">
                             <div class="row mb-2 align-items-center">
                                 <div class="col-3 text-end fw-bold">Select Weekday</div>
                                 <div class="col-4">
                                     <select class="form-select form-select-sm"><option>--Select--</option></select>
                                 </div>
                             </div>
                             <div class="row mb-2 align-items-center">
                                 <div class="col-3 text-end fw-bold">Applicable From</div>
                                 <div class="col-3">
                                     <select class="form-select form-select-sm"><option>--Select--</option></select>
                                 </div>
                                 <div class="col-3 text-end fw-bold">Applicable Upto</div>
                                 <div class="col-3">
                                     <select class="form-select form-select-sm"><option>--Select--</option></select>
                                 </div>
                             </div>
                         </div>

                         <div class="row mb-2">
                             <div class="col-3 text-end fw-bold">Reason</div>
                             <div class="col-9">
                                 <textarea class="form-control form-control-sm" rows="2"></textarea>
                             </div>
                         </div>
                         <div class="row mb-2 align-items-center">
                             <div class="col-3 text-end text-custom-blue fw-bold">Holiday Type</div>
                             <div class="col-6">
                                 <div class="form-check form-check-inline">
                                     <input class="form-check-input" type="checkbox" id="mh-branch">
                                     <label class="form-check-label" for="mh-branch">Branch</label>
                                 </div>
                                 <div class="form-check form-check-inline">
                                     <input class="form-check-input" type="checkbox" id="mh-clearing">
                                     <label class="form-check-label" for="mh-clearing">Clearing</label>
                                 </div>
                             </div>
                         </div>
                     </div>
                </div>
            </div>
        </div>

        <!-- Right Side Buttons -->
        <div class="d-flex flex-column gap-2 pt-5" style="width: 120px;">
            <button class="btn btn-light border shadow-sm">View</button>
            <button class="btn btn-light border shadow-sm fw-bold border-2">Add</button>
            <button class="btn btn-light border shadow-sm">Edit</button>
            <button class="btn btn-light border shadow-sm">Delete</button>
            <button class="btn btn-light border shadow-sm">Save</button>
            <button class="btn btn-light border shadow-sm">Cancel</button>
        </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="branch-holidays.js"></script>
</body>
</html>
