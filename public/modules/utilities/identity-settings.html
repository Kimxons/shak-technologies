<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Identity Settings · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <style>
    /* Specific overrides to match the form groups from Bank Settings */
    .bank-settings-section {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      height: 100%;
    }

    .bank-settings-header {
      background: linear-gradient(to right, rgba(59, 130, 246, 0.1), transparent);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.5rem 1rem;
      margin: -1rem -1rem 1rem -1rem;
      border-radius: 0.5rem 0.5rem 0 0;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cbs-label {
      font-weight: 600;
      color: #1e3a8a; /* Matching the blue from header/screenshot description if implied */
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      text-align: right;
      padding-right: 10px;
    }

    .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 0.5rem;
    }

    .form-row .cbs-label {
        width: 150px;
    }

    .form-row .cbs-input {
        flex: 1;
    }

    .toolbar-btn {
        min-width: 80px;
        font-size: 0.85rem;
        background-color: #e0e0e0;
        border: 1px solid #ccc;
        padding: 4px 8px;
        margin-right: 4px;
    }

    .toolbar-btn:hover {
        background-color: #d0d0d0;
    }

    .side-btn {
        width: 100%;
        margin-bottom: 0.5rem;
        padding: 0.5rem;
        text-align: center;
        background-color: #e0e0e0;
        border: 1px solid #ccc;
        font-weight: 500;
    }

    .side-btn:hover {
        background-color: #d0d0d0;
    }

    .grid-container {
        min-height: 200px;
        border: 1px solid #dee2e6;
        background: white;
    }

    .behind-scene-label {
        font-size: 0.8rem;
        color: #666;
    }
  </style>
</head>

<body class="client-maintenance copilot-theme" data-page="identity-settings" style="background: transparent;">
  <div class="container-fluid p-3 h-100">
    <div class="row h-100">
        <!-- Main Content Area -->
        <div class="col-10 d-flex flex-column">
             <!-- Identity Form -->
             <section class="bank-settings-section card-surface mb-3 flex-shrink-0">
                 <!-- <div class="bank-settings-header">Identity Settings</div> -->

                 <div class="form-row">
                    <label class="cbs-label">Identity For</label>
                    <div class="cbs-input">
                        <select class="form-select form-select-sm">
                            <option>--Select--</option>
                            <option>Customer</option>
                            <option>Loan</option>
                        </select>
                    </div>
                 </div>

                 <div class="form-row">
                    <label class="cbs-label">Identity ID</label>
                    <div class="cbs-input">
                        <select class="form-select form-select-sm">
                            <option>--Select--</option>
                        </select>
                    </div>
                 </div>

                 <div class="form-row">
                    <label class="cbs-label">Caption</label>
                    <div class="cbs-input">
                        <input type="text" class="form-control form-control-sm">
                    </div>
                 </div>

                 <div class="form-row">
                    <label class="cbs-label">Format Required</label>
                    <div class="cbs-input">
                        <input class="form-check-input" type="checkbox">
                    </div>
                 </div>

                 <div class="form-row">
                    <label class="cbs-label">Format</label>
                    <div class="cbs-input">
                        <input type="text" class="form-control form-control-sm">
                    </div>
                 </div>

                 <div class="form-row">
                    <div style="width: 150px;"></div> <!-- Spacer -->
                    <div class="cbs-input d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="mandatoryCheck">
                            <label class="form-check-label small" for="mandatoryCheck">Mandatory</label>
                        </div>
                        <div class="form-check">
                             <div class="d-flex align-items-center gap-2">
                                <label class="form-check-label small" for="uniqueCheck">Unique</label>
                                <input class="form-check-input" type="checkbox" id="uniqueCheck">
                             </div>
                        </div>
                    </div>
                 </div>
             </section>

             <!-- Action Toolbar -->
             <div class="mb-3 d-flex justify-content-center bg-light p-2 rounded border">
                 <button class="btn toolbar-btn">New</button>
                 <button class="btn toolbar-btn">Alter</button>
                 <button class="btn toolbar-btn">Remove</button>
                 <button class="btn toolbar-btn">Update</button>
                 <button class="btn toolbar-btn">Clear</button>
             </div>

             <!-- Grid Section -->
             <section class="bank-settings-section card-surface flex-grow-1 p-0 overflow-hidden d-flex flex-column">
                 <div class="table-responsive flex-grow-1">
                     <table class="table table-sm table-striped table-hover mb-0">
                         <thead class="table-light sticky-top">
                             <tr>
                                 <th>Identity ID</th>
                                 <th>ID Caption</th>
                                 <th>Identity Format</th>
                                 <th>Is Mandatory</th>
                                 <th>Is Unique</th>
                                 <th>Data Cache Keys</th>
                             </tr>
                         </thead>
                         <tbody>
                             <tr>
                                 <td colspan="6" class="text-center p-3 text-muted">No records to display.</td>
                             </tr>
                         </tbody>
                     </table>
                 </div>
             </section>
        </div>

        <!-- Side Buttons -->
        <div class="col-2">
             <div class="d-flex flex-column h-100 justify-content-end pb-3">
                 <div class="d-grid gap-2 mb-auto pt-3">
                     <!-- Buttons positioned vaguely like visual basic forms -->
                 </div>
                 <div class="d-grid gap-2">
                     <button class="btn side-btn">View</button>
                     <button class="btn side-btn">Add</button>
                     <button class="btn side-btn">Edit</button>
                     <button class="btn side-btn">Delete</button>
                     <button class="btn side-btn">Save</button>
                     <button class="btn side-btn">Cancel</button>
                 </div>
             </div>
        </div>
    </div>

    <!-- Behind The Scene -->
    <div class="row mt-3">
        <div class="col-12">
            <section class="bank-settings-section card-surface mb-0">
                <div class="bank-settings-header text-white bg-primary" style="background: #0d6efd;">Behind The Scene</div>
                <div class="row g-2">
                    <div class="col-md-4">
                        <div class="d-flex align-items-center mb-1">
                            <label class="behind-scene-label me-2 w-25 text-end">Created By</label>
                            <input type="text" class="form-control form-control-sm w-75" readonly>
                        </div>
                        <div class="d-flex align-items-center">
                            <label class="behind-scene-label me-2 w-25 text-end">Created On</label>
                            <input type="text" class="form-control form-control-sm w-75" readonly>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center mb-1">
                            <label class="behind-scene-label me-2 w-25 text-end">Modified By</label>
                            <input type="text" class="form-control form-control-sm w-75" readonly>
                        </div>
                        <div class="d-flex align-items-center">
                            <label class="behind-scene-label me-2 w-25 text-end">Modified On</label>
                            <input type="text" class="form-control form-control-sm w-75" readonly>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center mb-1">
                            <label class="behind-scene-label me-2 w-25 text-end">Supervised By</label>
                            <input type="text" class="form-control form-control-sm w-75" readonly>
                        </div>
                        <div class="d-flex align-items-center">
                            <label class="behind-scene-label me-2 w-25 text-end">Supervised On</label>
                            <input type="text" class="form-control form-control-sm w-75" readonly>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <div class="row mt-1">
         <div class="col-12 small text-muted">
             BR.Net Web Banking
         </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
