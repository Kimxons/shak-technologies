<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Language Setup · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <style>
    /* Specific overrides to match the form groups from Bank Settings */
    body {
        overflow: hidden; /* Prevent scrollbars if not needed */
    }
    .bank-settings-section {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      height: 100%;
    }

    .bank-settings-header {
      background: linear-gradient(to right, rgba(59, 130, 246, 0.1), transparent);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.5rem 1rem;
      margin: -1rem -1rem 1rem -1rem;
      border-radius: 0.5rem 0.5rem 0 0;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cbs-label {
      font-weight: 600;
      color: #1e3a8a;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      text-align: right;
      padding-right: 10px;
    }

    .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 1.5rem; /* More spacing as per screenshot */
        justify-content: center; /* Center the form fields */
    }

    .form-row .cbs-label {
        width: 180px; /* Slightly wider */
    }

    .form-row .cbs-input {
        width: 300px;
    }

    .side-btn {
        width: 100%;
        margin-bottom: 0.5rem;
        padding: 0.5rem;
        text-align: center;
        background-color: #e0e0e0;
        border: 1px solid #ccc;
        font-weight: 600; /* Bold from screenshot */
        color: black;
        text-decoration: underline; /* The "S" in Save and "C" in Cancel are underlined in screenshot, suggesting access keys. I will just underline the letter if I can, or leave as is. Actually screenshot shows the whole text, but "S" and "C" have underscore. I'll just clear text decoration and maybe use accesskey style if needed but simple text is fine. Wait, screenshot defines buttons: "Save", "Cancel" with underscores. */
    }

    .side-btn u {
        text-decoration: underline;
    }

    .side-btn:hover {
        background-color: #d0d0d0;
    }

    /* Footer bar styling */
    .footer-bar {
        border-top: 1px solid #ccc;
        padding: 3px;
        font-size: 0.8rem;
        color: #333;
        background: #f0f0f0; /* Light gray background for footer */
        position: absolute;
        bottom: 0;
        width: 100%;
    }

    .blue-link {
        color: blue;
        font-weight: bold;
        text-decoration: none;
    }

  </style>
</head>

<body class="client-maintenance copilot-theme" data-page="language-setup" style="background: transparent;">

  <div class="container-fluid p-3 h-100 d-flex flex-column">
    <div class="row m-0 flex-grow-1">
        <!-- Main Content Area -->
        <div class="col-10 d-flex flex-column p-0">

             <!-- Content centered vertically/horizontally in this section -->
             <section class="bank-settings-section card-surface mb-3 flex-shrink-0 d-flex flex-column justify-content-center">
                 <div class="form-row">
                    <label class="cbs-label" style="text-align: right; width: 200px;">Your Current Language</label>
                    <div class="cbs-input">
                        <input type="text" class="form-control form-control-sm" value="English" readonly style="font-weight: bold;">
                    </div>
                 </div>

                 <div class="form-row">
                    <label class="cbs-label text-primary" style="text-align: right; width: 200px; padding-right: 10px; cursor: pointer;">Update Your Language</label>
                    <div class="cbs-input">
                        <select class="form-select form-select-sm">
                            <option>--Select--</option>
                            <option>English</option>
                            <option>French</option>
                            <option>Spanish</option>
                        </select>
                    </div>
                 </div>
             </section>

        </div>

        <!-- Side Buttons -->
        <div class="col-2 ps-3">
             <div class="d-flex flex-column h-100 justify-content-end pb-5">
                 <div class="d-grid gap-2">
                     <button class="btn side-btn"><u>S</u>ave</button>
                     <button class="btn side-btn"><u>C</u>ancel</button>
                 </div>
             </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-bar">
         BR.Net Web Banking
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
