<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Definable Module · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <style>
    /* Styling matched from Bank Settings */
    .bank-settings-section {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .bank-settings-header {
      background: linear-gradient(to right, rgba(59, 130, 246, 0.1), transparent);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.5rem 1rem;
      margin: -1rem -1rem 1rem -1rem;
      border-radius: 0.5rem 0.5rem 0 0;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Layout specific to this module */
    .module-container {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 1rem;
      height: 100vh;
      padding: 1rem;
      overflow: hidden;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    .right-sidebar {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .action-button {
      width: 100%;
      text-align: center;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #ccc;
      border-radius: 0.25rem;
      transition: all 0.2s;
    }

    .action-button:hover {
        background: #e9ecef;
    }

    .form-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-grid label {
        color: blue; /* Keep this if cbs-label not sufficient, but cbs-label is preferred */
        font-weight: bold;
        text-align: right;
    }

    .control-buttons {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #eee;
    }

    .control-buttons button {
        min-width: 80px;
         background: rgba(220, 220, 220, 0.8);
        border: 1px solid #aaa;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    .data-table th {
        background: #f8f9fa;
        border-bottom: 2px solid #dee2e6;
        padding: 0.5rem;
        text-align: left;
    }

     .data-table td {
        padding: 0.5rem;
        border-bottom: 1px solid #dee2e6;
    }

    .behind-scene-grid {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 1rem;
        align-items: center;
    }

    .behind-scene-grid label {
        font-size: 0.8rem;
    }
  </style>
</head>

<body class="copilot-theme" data-page="user-definable-module">
  <div class="module-container">
    <div class="main-content">

      <!-- Top Section -->
      <section class="bank-settings-section">
         <div class="bank-settings-header">&nbsp;</div> <!-- Empty header strip to match style -->

         <div class="cm-top-identifiers__grid">
            <div class="cbs-field">
                <label class="cbs-label">Module Type</label>
                <select class="form-select">
                    <option selected>General Ledger</option>
                    <!-- Add other options as needed -->
                </select>
            </div>

            <div class="cbs-field">
                <label class="cbs-label">Field Name</label>
                <select class="form-select">
                    <option selected>--Select--</option>
                </select>
            </div>

            <div class="cbs-field">
                <label class="cbs-label">Is Mandatory</label>
                <div class="form-control border-0 bg-transparent p-0">
                    <input type="checkbox" class="form-check-input mt-2">
                </div>
            </div>
         </div>

         <div class="control-buttons">
            <button type="button" class="btn btn-sm btn-light border">New</button>
            <button type="button" class="btn btn-sm btn-light border">Alter</button>
            <button type="button" class="btn btn-sm btn-light border">Remove</button>
            <button type="button" class="btn btn-sm btn-light border">Update</button>
            <button type="button" class="btn btn-sm btn-light border">Clear</button>
         </div>

      </section>

      <!-- Grid Section -->
      <section class="bank-settings-section" style="flex-grow: 1;">
         <div class="table-responsive h-100">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Field Description</th>
                        <th>Is Mandatory</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="2" class="text-center p-3">No records to display.</td>
                    </tr>
                </tbody>
            </table>
         </div>
      </section>

      <!-- Behind The Scene -->
      <section class="bank-settings-section">
        <div class="bank-settings-header">Behind The Scene</div>
        <div class="cm-top-identifiers__grid" style="grid-template-columns: repeat(2, 1fr);">
            <div class="cbs-field">
                <label class="cbs-label">Created By</label>
                <input type="text" class="form-control" readonly>
            </div>

            <div class="cbs-field">
                <label class="cbs-label">Supervised By</label>
                <input type="text" class="form-control" readonly>
            </div>

            <div class="cbs-field">
                <label class="cbs-label">Created On</label>
                <input type="text" class="form-control" readonly>
            </div>

            <div class="cbs-field">
                <label class="cbs-label">Supervised On</label>
                <input type="text" class="form-control" readonly>
            </div>
        </div>
      </section>

    </div>

    <div class="right-sidebar">
        <!-- Spacer to push buttons down if needed, but screenshot shows them at bottom right usually or stacked -->
        <div style="flex-grow: 1;"></div>
        <button class="action-button"><u>V</u>iew</button>
        <button class="action-button"><u>A</u>dd</button>
        <button class="action-button"><u>E</u>dit</button>
        <button class="action-button"><u>D</u>elete</button>
        <button class="action-button"><u>S</u>ave</button>
        <button class="action-button"><u>C</u>ancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="user-definable-module.js"></script>
</body>
</html>
