<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dash Board Items · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <style>
    /* Content Layout from Screenshot, but Styling from Identity Settings */

    /* Styles copied from Identity Settings */
    .bank-settings-section {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .bank-settings-header {
      background: linear-gradient(to right, rgba(59, 130, 246, 0.1), transparent);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.5rem 1rem;
      margin: -1rem -1rem 1rem -1rem;
      border-radius: 0.5rem 0.5rem 0 0;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .status-bar {
      border: 1px solid rgba(255, 255, 255, 0.5); /* Matching styled border */
      background: rgba(255, 255, 255, 0.6);
      padding: 4px 8px;
      margin-top: 8px;
      min-height: 30px;
      display: flex;
      align-items: center;
      border-radius: 0.5rem;
    }

    .status-text {
      color: red;
      font-weight: bold;
      font-size: 0.85rem;
    }

    /* Sidebar buttons styling from Identity Settings */
    .side-btn {
        width: 100%;
        margin-bottom: 0.5rem;
        padding: 0.5rem;
        text-align: center;
        background-color: #e0e0e0;
        border: 1px solid #ccc;
        font-weight: 500;
    }

    .side-btn:hover {
        background-color: #d0d0d0;
    }

    .side-btn u {
        text-decoration: underline;
    }

    /* Footer */
    .footer-text {
      font-size: 0.8rem;
      color: #666;
      border-top: 1px solid rgba(0,0,0,0.1);
      margin-top: 5px;
      padding-top: 2px;
    }

    /* Helper container for grid content */
    .panel-content {
        flex-grow: 1;
        background: white; /* Inner content area usually white like in Identity Settings grid */
        border: 1px solid #dee2e6;
        overflow: auto;
    }
  </style>
</head>

<body class="client-maintenance copilot-theme" style="background: transparent;">
  <div class="container-fluid p-3 h-100 d-flex flex-column">
    <div class="row flex-grow-1 header-row" style="min-height: 0;">
        <!-- Main Content Area -->
        <div class="col-10 d-flex flex-column h-100 pe-0">
             <div class="row flex-grow-1 g-2" style="min-height: 0;">
                 <div class="col-6 h-100">
                      <!-- Dashboards Panel -->
                      <section class="bank-settings-section card-surface p-0 d-flex flex-column overflow-hidden" style="height: 80vh;">
                          <div class="bank-settings-header mt-2">Dashboards</div>
                          <div class="flex-grow-1 m-3 panel-content">
                              <!-- List or content goes here. -->
                          </div>
                      </section>
                 </div>
                 <div class="col-6 h-100">
                      <!-- Parameters Panel -->
                      <section class="bank-settings-section card-surface p-0 d-flex flex-column overflow-hidden" style="height: 40vh;">
                         <div class="bank-settings-header mt-2">Parameters</div>
                         <div class="flex-grow-1 m-3 panel-content">
                              <!-- Content -->
                         </div>
                      </section>
                 </div>
             </div>

             <!-- Status bar -->
             <div class="status-bar">
                  <span class="status-text">No details Found [No:1011]</span>
             </div>
        </div>

        <!-- Sidebar -->
        <div class="col-2 h-100">
             <div class="d-flex flex-column h-100 ps-2">
                 <!-- Top Spacer / Image area -->
                 <div class="flex-grow-1 bg-light border mb-2 d-flex align-items-center justify-content-center" style="background: rgba(255,255,255,0.6); border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.5);">
                     <i class="bi bi-cursor-fill fs-1 text-secondary opacity-25"></i>
                 </div>
                 <div>
                     <button class="btn side-btn">E<u>d</u>it</button>
                     <button class="btn side-btn"><u>S</u>ave</button>
                     <button class="btn side-btn"><u>C</u>ancel</button>
                 </div>
             </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="row mt-1">
         <div class="col-12 footer-text">
             BR.Net Web Banking
         </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
