<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cash Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="cash-maintenance.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="cash-maintenance">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; margin-bottom: 8px; font-weight: 600; font-size: 0.8rem;">
            Query
          </div>

          <!-- Row 1: Serial No and From Till ID -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Serial No</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="serialNoField" style="flex: 1;" />
                <button class="cm-search-btn" id="serialNoSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">From Till ID</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="fromTillIdField" style="flex: 1;" />
                <button class="cm-search-btn" id="fromTillIdSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
          </div>

          <!-- Row 2: Currency ID and Transaction Type -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Currency ID</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="currencyIdField" style="flex: 1;" />
                <button class="cm-search-btn" id="currencyIdSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Transaction Type</label>
              <select class="form-select" id="transactionTypeSelect">
                <option value="">--Select--</option>
                <option value="TRX001">Deposit</option>
                <option value="TRX002">Withdrawal</option>
                <option value="TRX003">Transfer</option>
              </select>
            </div>
          </div>

          <!-- Row 3: Fixed Amount, To Branch ID, To Till ID -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Fixed Amount</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="fixedAmountField" style="flex: 1;" />
                <button class="cm-search-btn" id="fixedAmountSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">To Branch ID</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="toBranchIdField" style="flex: 1;" />
                <button class="cm-search-btn" id="toBranchIdSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">To Till ID</label>
              <div style="display: flex; gap: 6px;">
                <input type="text" class="form-control" id="toTillIdField" style="flex: 1;" />
                <button class="cm-search-btn" id="toTillIdSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabbed Content Section -->
        <div style="padding: 12px; flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid #e5e7eb;">
          <!-- Tab Headers -->
          <div style="display: flex; gap: 2px; border-bottom: 2px solid #e5e7eb; margin-bottom: 8px;">
            <button class="cm-tab cm-tab-active" id="denominationsTab" data-tab="denominations">Denominations</button>
            <button class="cm-tab" id="numbersTab" data-tab="numbers">Numbers</button>
            <button class="cm-tab" id="paymentTab" data-tab="payment">Payment</button>
            <button class="cm-tab" id="receiptTab" data-tab="receipt">Receipt</button>
          </div>

          <!-- Tab Content Area -->
          <div style="flex: 1; overflow: auto; border: 1px solid #d1d5db; border-radius: 0.375rem;">
            <!-- Denominations Tab -->
            <div id="denominationsContent" class="cm-tab-content cm-tab-content-active" style="padding: 12px; display: block;">
              <table class="table" style="margin-bottom: 0;">
                <thead>
                  <tr>
                    <th>Denomination</th>
                    <th>Count</th>
                    <th>Amount</th>
                  </tr>
                </thead>
                <tbody id="denominationsTableBody">
                  <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                    <td colspan="3" style="padding: 20px;">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Numbers Tab -->
            <div id="numbersContent" class="cm-tab-content" style="padding: 12px; display: none;">
              <table class="table" style="margin-bottom: 0;">
                <thead>
                  <tr>
                    <th>Series</th>
                    <th>From Number</th>
                    <th>To Number</th>
                    <th>Count</th>
                  </tr>
                </thead>
                <tbody id="numbersTableBody">
                  <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                    <td colspan="4" style="padding: 20px;">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Payment Tab -->
            <div id="paymentContent" class="cm-tab-content" style="padding: 12px; display: none;">
              <table class="table" style="margin-bottom: 0;">
                <thead>
                  <tr>
                    <th>Payment Method</th>
                    <th>Reference</th>
                    <th>Amount</th>
                  </tr>
                </thead>
                <tbody id="paymentTableBody">
                  <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                    <td colspan="3" style="padding: 20px;">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Receipt Tab -->
            <div id="receiptContent" class="cm-tab-content" style="padding: 12px; display: none;">
              <table class="table" style="margin-bottom: 0;">
                <thead>
                  <tr>
                    <th>Receipt No</th>
                    <th>Amount</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="receiptTableBody">
                  <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                    <td colspan="3" style="padding: 20px;">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div style="padding: 12px;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; margin-bottom: 8px; font-weight: 600; font-size: 0.8rem;">
            Behind The Scene
          </div>

          <!-- Row 1: Created By, Created On, Transaction Status -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Created By</label>
              <input type="text" class="form-control" id="createdByField" readonly style="background-color: #f9fafb;" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Transaction Status</label>
              <input type="text" class="form-control" id="transactionStatusField" readonly style="background-color: #f9fafb;" />
            </div>
          </div>

          <!-- Row 2: Created On -->
          <div>
            <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Created On</label>
            <input type="text" class="form-control" id="createdOnField" readonly style="background-color: #f9fafb;" />
          </div>

          <!-- Error/Status Message -->
          <div id="statusMessage" style="margin-top: 8px; color: #dc2626; font-size: 0.75rem; display: none;"></div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 12px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 6px 8px; border-radius: 0.375rem; font-weight: 600; font-size: 0.8rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="cm-action-btn" id="viewAllBtn">View All</button>
      <button class="cm-action-btn" id="denominationBtn">Denomination</button>
      <button class="cm-action-btn" id="printBtn">Print</button>
      <button class="cm-action-btn" id="viewBtn">View</button>
      <button class="cm-action-btn" id="addBtn">Add</button>
      <button class="cm-action-btn" id="deleteBtn">Delete</button>
      <button class="cm-action-btn" id="saveBtn">Save</button>
      <button class="cm-action-btn" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script src="cash-maintenance.js"></script>
</body>
</html>
