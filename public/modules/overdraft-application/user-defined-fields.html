<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Defined Fields - Overdraft Application</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="user-defined-fields.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <aside class="sidebar" aria-label="Section navigation">
                <div class="sidebar-title">Overdraft Application</div>
                <div class="nav-section">
                    <button type="button" class="nav-toggle" data-current-section="dataentry">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span class="nav-toggle-label">DataEntry</span>
                        <i class="bi bi-chevron-down nav-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="nav-items">
                        <button type="button" class="nav-item" data-section="dataentry">
                            <i class="bi bi-pencil-square" aria-hidden="true"></i>
                            <span>DataEntry</span>
                        </button>
                        <button type="button" class="nav-item" data-section="interest-rates">
                            <i class="bi bi-percent" aria-hidden="true"></i>
                            <span>Interest Rates</span>
                        </button>
                        <button type="button" class="nav-item" data-section="guarantor">
                            <i class="bi bi-shield-check" aria-hidden="true"></i>
                            <span>Guarantor</span>
                        </button>
                        <button type="button" class="nav-item" data-section="documents">
                            <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
                            <span>Documents</span>
                        </button>
                        <button type="button" class="nav-item active" data-section="user-defined-fields">
                            <i class="bi bi-sliders" aria-hidden="true"></i>
                            <span>User Defined Fields</span>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="content" role="main">
                <div class="window-header">
                    <div class="window-title">
                        <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
                        <span>0101 ::</span>
                    </div>
                    <div class="window-controls">
                        <button class="window-control-btn minimize" aria-label="Minimize">
                            <i class="bi bi-dash"></i>
                        </button>
                        <button class="window-control-btn close" aria-label="Close">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </div>

                <div id="statusMessage" class="status hidden" role="status" aria-live="polite">
                    <i class="bi" aria-hidden="true"></i>
                    <span class="status-text"></span>
                    <button type="button" class="status-close" aria-label="Dismiss message">✕</button>
                </div>

                <form id="userDefinedFieldsForm" class="form" novalidate>
                    <!-- User Defined Fields Section -->
                    <div class="form-section" data-section="user-defined-fields">
                        <div class="udf-canvas">
                            <div class="udf-content-area">
                                <div class="empty-state">
                                    <i class="bi bi-inbox empty-icon" aria-hidden="true"></i>
                                    <p class="empty-text">No user defined fields configured</p>
                                    <p class="empty-subtext">Click "Add" to create custom fields for this application</p>
                                </div>
                                
                                <!-- Dynamic UDF fields will be rendered here -->
                                <div id="udfFieldsContainer" class="udf-fields-container hidden">
                                    <!-- Dynamic fields will be generated here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </main>

            <aside class="action-bar" aria-label="Actions">
                <button class="action-btn view" data-action="view-udf">
                    <i class="bi bi-eye-fill" aria-hidden="true"></i>
                    <span>View</span>
                </button>
                <button class="action-btn add" data-action="add-udf">
                    <i class="bi bi-plus-circle" aria-hidden="true"></i>
                    <span>Add</span>
                </button>
                <button class="action-btn edit" data-action="edit-udf">
                    <i class="bi bi-pencil-fill" aria-hidden="true"></i>
                    <span>Edit</span>
                </button>
                <button class="action-btn delete" data-action="delete-udf">
                    <i class="bi bi-trash-fill" aria-hidden="true"></i>
                    <span>Delete</span>
                </button>
                <button class="action-btn save" data-action="save-udf">
                    <i class="bi bi-save-fill" aria-hidden="true"></i>
                    <span>Save</span>
                </button>
                <button class="action-btn cancel" data-action="cancel-udf">
                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                    <span>Cancel</span>
                </button>
            </aside>
        </div>
    </div>

    <script src="user-defined-fields.js"></script>
</body>
</html>
