<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock System Record Locks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card">
                    <!-- Branch Selection Section -->
                    <div class="form-section" data-section="branch-selection">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-building"></i>Branch Selection</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Branch Selection" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label class="label-blue">Branch ID</label>
                                    <div class="kairo-branch-control" data-kairo-branch-control>
                                        <input type="text" id="branchId" class="kairo-branch-control__id" value="0101" aria-label="Branch ID">
                                        <input type="text" id="branchName" class="kairo-branch-control__name" value="Head Office" aria-label="Branch Name" placeholder="Branch Name" readonly>
                                        <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchBranchBtn" aria-label="Search Branch"><i class="bi bi-search"></i></button>
                                    </div>
                                </div>
                                <div class="col"></div>
                                <div class="col"></div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Locked Records Section -->
                    <div class="form-section" data-section="locked-records">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-lock-fill"></i>Locked Records <span class="badge bg-primary ms-2" id="recordCount">0</span></span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Locked Records" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table class="table table-hover table-sm">
                                    <thead class="table-light">
                                        <tr>
                                            <th><input type="checkbox" class="form-check-input" id="selectAll"></th>
                                            <th>Our Branch ID</th>
                                            <th>Module Name</th>
                                            <th>PK Key</th>
                                            <th>Operator ID</th>
                                            <th>Locked On</th>
                                        </tr>
                                    </thead>
                                    <tbody id="locksTableBody">
                                        <tr>
                                            <td colspan="6" class="text-center text-muted">No records to display.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Summary Statistics Section -->
                    <div class="form-section" data-section="summary-statistics">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-graph-up"></i>Summary Statistics</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Summary Statistics" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row four-col">
                                <div class="col">
                                    <label>Total Locked Records</label>
                                    <input type="text" id="statTotal" class="bs-input-text" value="0" readonly>
                                </div>
                                <div class="col">
                                    <label>Oldest Lock</label>
                                    <input type="text" id="statOldest" class="bs-input-text" value="--" readonly>
                                </div>
                                <div class="col">
                                    <label>Unlocked Today</label>
                                    <input type="text" id="statUnlocked" class="bs-input-text" value="0" readonly>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-action--view" id="viewBtn">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="deleteBtn">
                        <i class="bi bi-trash"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="btn-action" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="unlock-system-record-locks.js"></script>
</body>
</html>
