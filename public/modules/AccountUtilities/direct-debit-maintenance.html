<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direct Debit Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="../shared/search-modal.css" />
</head>
<body data-page="direct-debit-maintenance">
  <div class="window">
    <!-- Main Container -->
    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card" data-main-form>
          <!-- Debit Type Section -->
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title"><i class="bi bi-credit-card-2-front"></i>Debit Type</span>
            </div>
            <div class="section-content">
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Direct Debit Type</label>
                  <select id="directDebitType" class="form-control bs-input-text">
                    <option value="">--Select--</option>
                    <option value="OUTGOING">Outgoing Direct Debit</option>
                    <option value="INCOMING">Incoming Direct Debit</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- Account Details Section -->
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title"><i class="bi bi-building"></i>Account Details</span>
            </div>
            <div class="section-content">
              
              <!-- Branch & Account Row -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Branch ID</label>
                  <div class="input-group">
                    <input id="branchId" type="text" class="form-control bs-input-text" placeholder="Branch ID" />
                    <input id="branchName" type="text" class="form-control bs-input-text" readonly placeholder="Branch Name" />
                    <button type="button" id="searchBranchBtn" class="btn btn-outline-secondary" title="Search Branch">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Account ID</label>
                  <div class="input-group">
                    <input id="accountId" type="text" class="form-control bs-input-text" placeholder="Account ID" />
                    <input id="accountName" type="text" class="form-control bs-input-text" readonly placeholder="Account Name" />
                    <button type="button" id="searchAccountBtn" class="btn btn-outline-secondary" title="Search Account">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Direct Debit Instruction & Reference -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Direct Debit Instruction ID</label>
                  <div class="input-group">
                    <input id="directDebitInstructionId" type="text" class="form-control bs-input-text" placeholder="Instruction ID" />
                    <button type="button" id="searchDDInstructionBtn" class="btn btn-outline-secondary" title="Search Instruction">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Reference No.</label>
                  <input id="referenceNo" type="text" class="form-control bs-input-text" />
                </div>
              </div>

              <!-- Currency & Amount -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Transaction Currency</label>
                  <div class="input-group">
                    <input id="transactionCurrencyId" type="text" class="form-control bs-input-text" placeholder="Currency ID" />
                    <button type="button" id="searchCurrencyBtn" class="btn btn-outline-secondary" title="Search Currency">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Fixed Amount</label>
                  <input id="fixedAmount" type="number" class="form-control bs-input-text" placeholder="0.00" />
                </div>
              </div>

              <!-- Dates & Frequency -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Effective Date</label>
                  <input id="effectiveDate" type="date" class="form-control bs-input-text" />
                </div>
                <div class="col">
                  <label class="label-blue">Transfer Frequency</label>
                  <select id="transferFrequency" class="form-control bs-input-text">
                    <option value="">--Select--</option>
                    <option value="DAILY">Daily</option>
                    <option value="WEEKLY">Weekly</option>
                    <option value="MONTHLY">Monthly</option>
                    <option value="QUARTERLY">Quarterly</option>
                    <option value="ANNUAL">Annual</option>
                  </select>
                </div>
              </div>

              <!-- Execution Details -->
              <div class="form-row four-col">
                <div class="col">
                  <label class="label-blue">No. of Executions</label>
                  <input id="noOfExecution" type="number" class="form-control bs-input-text" value="1" />
                </div>
                <div class="col">
                  <label class="label-blue">First Execution Date</label>
                  <input id="firstExecutionDate" type="date" class="form-control bs-input-text" />
                </div>
                <div class="col">
                  <label class="label-blue">Last Execution Date</label>
                  <input id="lastExecutionDate" type="date" class="form-control bs-input-text" />
                </div>
                <div class="col">
                  <label class="label-blue">Value Date</label>
                  <input id="valueDate" type="date" class="form-control bs-input-text" />
                </div>
              </div>

              <!-- Standing Instruction & Charge Recovery -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Standing Instruction Status</label>
                  <input id="standingInstructionStatus" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-blue">Charge Recovery</label>
                  <select id="chargeRecovery" class="form-control bs-input-text">
                    <option value="">--Select--</option>
                    <option value="NONE">None</option>
                    <option value="IMMEDIATE">Immediate</option>
                    <option value="DEFERRED">Deferred</option>
                  </select>
                </div>
              </div>

            </div>
          </div>

          <!-- Contra Details Section -->
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title"><i class="bi bi-arrow-left-right"></i>Contra Details</span>
            </div>
            <div class="section-content">
              
              <!-- Contra Bank & Branch -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Contra Bank ID</label>
                  <div class="input-group">
                    <input id="bankId" type="text" class="form-control bs-input-text" placeholder="Bank ID" />
                    <button type="button" id="searchContraBankBtn" class="btn btn-outline-secondary" title="Search Bank">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue">Contra Branch ID</label>
                  <div class="input-group">
                    <input id="contraBranchId" type="text" class="form-control bs-input-text" placeholder="Branch ID" />
                    <button type="button" id="searchContraBranchBtn" class="btn btn-outline-secondary" title="Search Branch">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Contra Account -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue">Contra Account ID</label>
                  <input id="contraAccountId" type="text" class="form-control bs-input-text" />
                </div>
                <div class="col">
                  <label class="label-blue">Originator Code</label>
                  <input id="originatorCode" type="text" class="form-control bs-input-text" />
                </div>
              </div>

              <!-- Policy & Voucher Details -->
              <div class="form-row four-col">
                <div class="col">
                  <label class="label-gray">Originator Reference</label>
                  <input id="originatorRef" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Policy Number 1</label>
                  <input id="policyNumber1" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Policy Number 2</label>
                  <input id="policyNumber2" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Return Code</label>
                  <input id="returnCode" type="text" class="form-control bs-input-text" value="00" readonly />
                </div>
              </div>

              <!-- Remarks -->
              <div class="form-row">
                <div class="col">
                  <label class="label-gray">Remarks</label>
                  <textarea id="remarks" class="form-control bs-input-text" rows="2"></textarea>
                </div>
              </div>

            </div>
          </div>

          <!-- Behind The Scene Section -->
          <div class="form-section">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="false">
                <i class="bi bi-chevron-down"></i>
              </button>
            </div>
            <div class="section-content" hidden>
              
              <div class="form-row four-col">
                <div class="col">
                  <label class="label-gray">Next Execution Date</label>
                  <input id="nextExecutionDate" type="date" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Last Run Date</label>
                  <input id="lastRunDate" type="date" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Last Run Status</label>
                  <input id="lastRunStatus" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">No. of Times Failed</label>
                  <input id="noOfTimesFailed" type="text" class="form-control bs-input-text" readonly />
                </div>
              </div>

              <div class="form-row four-col">
                <div class="col">
                  <label class="label-gray">Stopped Reason</label>
                  <input id="stoppedReason" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Created By</label>
                  <input id="createdBy" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Created On</label>
                  <input id="createdOn" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Modified By</label>
                  <input id="modifiedBy" type="text" class="form-control bs-input-text" readonly />
                </div>
              </div>

              <div class="form-row four-col">
                <div class="col">
                  <label class="label-gray">Modified On</label>
                  <input id="modifiedOn" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Stopped By</label>
                  <input id="stoppedBy" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Stopped On</label>
                  <input id="stoppedOn" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Supervised By</label>
                  <input id="supervisedBy" type="text" class="form-control bs-input-text" readonly />
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-gray">Supervised On</label>
                  <input id="supervisedOn" type="text" class="form-control bs-input-text" readonly />
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Right Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button class="btn-action" type="button" data-action="view" title="View">
            <i class="bi bi-eye me-1"></i>View
          </button>
          <button class="btn-action" type="button" data-action="add" title="Add">
            <i class="bi bi-plus-circle me-1"></i>Add
          </button>
          <button class="btn-action" type="button" data-action="edit" title="Edit">
            <i class="bi bi-pencil-square me-1"></i>Edit
          </button>
          <button class="btn-action" type="button" data-action="delete" title="Delete">
            <i class="bi bi-trash me-1"></i>Delete
          </button>
          <button class="btn-action" type="button" data-action="save" title="Save">
            <i class="bi bi-check-lg me-1"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel" title="Cancel">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <hr class="my-2" />
          <button class="btn-action" type="button" data-action="stop" title="Stop">
            <i class="bi bi-stop-circle me-1"></i>Stop
          </button>
          <button class="btn-action" type="button" data-action="print" title="Print">
            <i class="bi bi-printer me-1"></i>Print
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/searchService.js"></script>
  <script src="../../assets/js/shared/search-modal.js"></script>
  <script src="direct-debit-maintenance.js"></script>
</body>
</html>
