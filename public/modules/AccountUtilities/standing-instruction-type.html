<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standing Instruction Type</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
  <div class="window">
    <!-- Header (Single header only) -->
    <div class="am-header" role="banner">
      <div class="am-header__left">
        <i class="bi bi-card-text"></i>
        <span class="am-header__title">Standing Instruction Type</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn" type="button" data-action="refresh" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="de-title-btn" type="button" data-action="maximize" title="Maximize"><i class="bi bi-square"></i></button>
        <button class="de-title-btn" type="button" data-action="close" title="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
      <div class="form-content">
        <div class="form-card">
          <!-- Instruction Type Details Section -->
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title">Instruction Type Details</span>
            </div>
            <div class="section-content">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="label-blue">Instruction Type ID</label>
                  <input id="instructionTypeId" name="instructionTypeId" type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="label-blue">Description</label>
                  <input id="description" name="description" type="text" class="form-control" />
                </div>
              </div>
              <div class="row g-3 mt-2">
                <div class="col-md-6">
                  <label class="label-blue">SI Transfer Type</label>
                  <select id="siTransferType" name="siTransferType" class="form-select">
                    <option value="">--Select--</option>
                    <option value="internal">Internal Transfer</option>
                    <option value="external">External Transfer</option>
                  </select>
                </div>
                <div class="col-md-6"></div>
              </div>
            </div>
          </div>

          <!-- Settings Section -->
          <div class="form-section">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">Settings</span>
              <button class="section-toggle-btn" type="button"><i class="bi bi-chevron-down"></i></button>
            </div>
            <div class="section-content">
              <div class="row g-3">
                <div class="col-md-6">
                  <label>No Of Retries</label>
                  <input id="noOfRetries" name="noOfRetries" type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label>Retry After Day(s)</label>
                  <input id="retryAfterDays" name="retryAfterDays" type="text" class="form-control" />
                </div>
              </div>
              <div class="row g-3 mt-2">
                <div class="col-md-6">
                  <label>Failed Charge Type</label>
                  <select id="failedChargeType" name="failedChargeType" class="form-select">
                    <option value="">--Select--</option>
                    <option value="none">None</option>
                    <option value="fixed">Fixed</option>
                    <option value="percentage">Percentage</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <div class="form-check mt-4">
                    <input id="freezeAmountOnFailure" name="freezeAmountOnFailure" type="checkbox" class="form-check-input" />
                    <label class="form-check-label" for="freezeAmountOnFailure">Freeze Amount On Failure</label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Transaction Details Section -->
          <div class="form-section">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">Transaction Details</span>
              <button class="section-toggle-btn" type="button"><i class="bi bi-chevron-down"></i></button>
            </div>
            <div class="section-content">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="label-blue">Successful Transaction ID</label>
                  <div class="kairo-transaction-control" data-kairo-transaction-control>
                    <input type="text" id="successfulTrxId" name="successfulTrxId" class="kairo-transaction-control__id" aria-label="Transaction ID" />
                    <input type="text" id="successfulTrxName" name="successfulTrxName" class="kairo-transaction-control__name" aria-label="Transaction Name" placeholder="Transaction Name" readonly />
                    <button type="button" class="btn-lookup kairo-transaction-control__lookup" data-target-input="successfulTrxId" aria-label="Search Transaction"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col-md-6">
                  <label>Narration</label>
                  <input id="successfulNarration" name="successfulNarration" type="text" class="form-control" />
                </div>
              </div>
              <div class="row g-3 mt-2">
                <div class="col-md-6">
                  <label class="label-blue">Failure Transaction ID</label>
                  <div class="kairo-transaction-control" data-kairo-transaction-control>
                    <input type="text" id="failureTrxId" name="failureTrxId" class="kairo-transaction-control__id" aria-label="Transaction ID" />
                    <input type="text" id="failureTrxName" name="failureTrxName" class="kairo-transaction-control__name" aria-label="Transaction Name" placeholder="Transaction Name" readonly />
                    <button type="button" class="btn-lookup kairo-transaction-control__lookup" data-target-input="failureTrxId" aria-label="Search Transaction"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col-md-6">
                  <label>Narration</label>
                  <input id="failureNarration" name="failureNarration" type="text" class="form-control" />
                </div>
              </div>
            </div>
          </div>

          <!-- Behind The Scene Section (4 columns) -->
          <div class="form-section" data-section="audit">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">Behind The Scene</span>
              <button class="section-toggle-btn" type="button"><i class="bi bi-chevron-down"></i></button>
            </div>
            <div class="section-content">
              <div class="audit-section">
                <div class="row g-3">
                  <div class="col-md-3">
                    <div class="audit-item">
                      <span class="audit-label">Created By</span>
                      <span class="audit-value" id="auditCreatedBy">-</span>
                    </div>
                  </div>
                  <div class="col-md-3">
                    <div class="audit-item">
                      <span class="audit-label">Created On</span>
                      <span class="audit-value" id="auditCreatedOn">-</span>
                    </div>
                  </div>
                  <div class="col-md-3">
                    <div class="audit-item">
                      <span class="audit-label">Modified By</span>
                      <span class="audit-value" id="auditModifiedBy">-</span>
                    </div>
                  </div>
                  <div class="col-md-3">
                    <div class="audit-item">
                      <span class="audit-label">Modified On</span>
                      <span class="audit-value" id="auditModifiedOn">-</span>
                    </div>
                  </div>
                </div>
                <div class="row g-3 mt-2">
                  <div class="col-md-3">
                    <div class="audit-item">
                      <span class="audit-label">Supervised By</span>
                      <span class="audit-value" id="auditSupervisedBy">-</span>
                    </div>
                  </div>
                  <div class="col-md-3">
                    <div class="audit-item">
                      <span class="audit-label">Supervised On</span>
                      <span class="audit-value" id="auditSupervisedOn">-</span>
                    </div>
                  </div>
                  <div class="col-md-3"></div>
                  <div class="col-md-3"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="de-status-bar" role="status">Ready</footer>

    <!-- Loading Overlay -->
    <div class="de-loading-overlay" hidden>
      <div class="de-loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading...</span>
      </div>
    </div>

    <!-- Message Bar -->
    <div class="de-message-bar" hidden role="alert"></div>
  </div>

  <!-- Action Buttons at Bottom -->
  <div class="form-footer">
    <button class="btn btn-primary" type="button" data-action="view"><i class="bi bi-eye"></i> View</button>
    <button class="btn btn-secondary" type="button" data-action="add"><i class="bi bi-plus-circle"></i> Add</button>
    <button class="btn btn-secondary" type="button" data-action="edit"><i class="bi bi-pencil"></i> Edit</button>
    <button class="btn btn-secondary" type="button" data-action="delete"><i class="bi bi-trash"></i> Delete</button>
    <button class="btn btn-success" type="button" data-action="save"><i class="bi bi-check-circle"></i> Save</button>
    <button class="btn btn-danger" type="button" data-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
  </div>

  <script src="standing-instruction-type.js"></script>
