<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standing Instruction Type</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="standing-instruction-type">
  <div class="window">
    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card" data-main-form>

          <!-- Instruction Type Details -->
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title"><i class="bi bi-card-list"></i>Instruction Type Details</span>
            </div>
            <div class="section-content">
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="instructionTypeId">Instruction Type ID</label>
                  <div class="input-group">
                    <input id="instructionTypeId" name="instructionTypeId" type="text" class="form-control bs-input-text" placeholder="SI Type ID" />
                    <button type="button" id="searchSITypeBtn" class="btn btn-outline-secondary" title="Search SI Type">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue" for="description">Description</label>
                  <input id="description" name="description" type="text" class="form-control bs-input-text" />
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="siTransferType">SI Transfer Type</label>
                  <select id="siTransferType" name="siTransferType" class="form-control bs-input-text">
                    <option value="">--Select--</option>
                    <option value="internal">Internal Transfer</option>
                    <option value="external">External Transfer</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- Settings -->
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title"><i class="bi bi-sliders"></i>Settings</span>
            </div>
            <div class="section-content">
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="noOfRetries">No Of Retries</label>
                  <input id="noOfRetries" name="noOfRetries" type="text" class="form-control bs-input-text" />
                </div>
                <div class="col">
                  <label class="label-blue" for="retryAfterDays">Retry After Day(s)</label>
                  <input id="retryAfterDays" name="retryAfterDays" type="text" class="form-control bs-input-text" />
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="failedChargeType">Failed Charge Type</label>
                  <select id="failedChargeType" name="failedChargeType" class="form-control bs-input-text">
                    <option value="">--Select--</option>
                    <option value="none">None</option>
                    <option value="fixed">Fixed</option>
                    <option value="percentage">Percentage</option>
                  </select>
                </div>
                <div class="col">
                  <label class="label-blue" for="freezeAmountOnFailure">&nbsp;</label>
                  <div class="form-check">
                    <input id="freezeAmountOnFailure" name="freezeAmountOnFailure" type="checkbox" class="form-check-input" />
                    <label class="form-check-label" for="freezeAmountOnFailure">Freeze Amount On Failure</label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Transaction Details -->
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title"><i class="bi bi-receipt"></i>Transaction Details</span>
            </div>
            <div class="section-content">
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="successfulTrxId">Successful Transaction ID</label>
                  <div class="input-group">
                    <input type="text" id="successfulTrxId" name="successfulTrxId" class="form-control bs-input-text" placeholder="Transaction ID" />
                    <input type="text" id="successfulTrxName" name="successfulTrxName" class="form-control bs-input-text" placeholder="Transaction Name" readonly />
                    <button type="button" id="searchSuccessfulTrxBtn" class="btn btn-outline-secondary" title="Search Transaction">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue" for="successfulNarration">Narration</label>
                  <input id="successfulNarration" name="successfulNarration" type="text" class="form-control bs-input-text" />
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="failureTrxId">Failure Transaction ID</label>
                  <div class="input-group">
                    <input type="text" id="failureTrxId" name="failureTrxId" class="form-control bs-input-text" placeholder="Transaction ID" />
                    <input type="text" id="failureTrxName" name="failureTrxName" class="form-control bs-input-text" placeholder="Transaction Name" readonly />
                    <button type="button" id="searchFailureTrxBtn" class="btn btn-outline-secondary" title="Search Transaction">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue" for="failureNarration">Narration</label>
                  <input id="failureNarration" name="failureNarration" type="text" class="form-control bs-input-text" />
                </div>
              </div>
            </div>
          </div>

          <!-- Behind The Scene -->
          <div class="form-section">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="false">
                <i class="bi bi-chevron-down"></i>
              </button>
            </div>
            <div class="section-content" hidden>
              <div class="form-row four-col">
                <div class="col">
                  <label class="label-gray">Created By</label>
                  <input id="createdBy" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Created On</label>
                  <input id="createdOn" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Modified By</label>
                  <input id="modifiedBy" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Modified On</label>
                  <input id="modifiedOn" type="text" class="form-control bs-input-text" readonly />
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-gray">Supervised By</label>
                  <input id="supervisedBy" type="text" class="form-control bs-input-text" readonly />
                </div>
                <div class="col">
                  <label class="label-gray">Supervised On</label>
                  <input id="supervisedOn" type="text" class="form-control bs-input-text" readonly />
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Right Action Panel -->
      <div class="action-panel">
        <div class="action-buttons">
          <button class="btn-action" type="button" data-action="view" title="View">
            <i class="bi bi-eye me-1"></i>View
          </button>
          <button class="btn-action" type="button" data-action="add" title="Add">
            <i class="bi bi-plus-circle me-1"></i>Add
          </button>
          <button class="btn-action" type="button" data-action="edit" title="Edit">
            <i class="bi bi-pencil-square me-1"></i>Edit
          </button>
          <button class="btn-action" type="button" data-action="delete" title="Delete">
            <i class="bi bi-trash me-1"></i>Delete
          </button>
          <button class="btn-action" type="button" data-action="save" title="Save">
            <i class="bi bi-check-lg me-1"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel" title="Cancel">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/searchService.js"></script>
  <script src="../../assets/js/shared/search-modal.js"></script>
  <script src="standing-instruction-type.js"></script>
</body>
</html>
