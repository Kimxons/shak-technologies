<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test: Group Collection Reversal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body {
      padding: 20px;
      background: #f8f9fa;
    }
    .test-container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #dee2e6;
      border-radius: 5px;
    }
    .test-result {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
    }
    .test-pass {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .test-fail {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .test-info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }
    .console-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .btn-test {
      margin: 5px;
    }
  </style>
</head>
<body>

<div class="test-container">
  <h1>🧪 Group Collection Reversal - Test Suite</h1>
  <p>This page tests the Group Collection Reversal module implementation</p>

  <!-- Test Control Panel -->
  <div class="test-section">
    <h3>Test Controls</h3>
    <button class="btn btn-primary btn-test" onclick="runAllTests()">▶️ Run All Tests</button>
    <button class="btn btn-secondary btn-test" onclick="clearResults()">🗑️ Clear Results</button>
    <button class="btn btn-info btn-test" onclick="showDebugInfo()">🔍 Show Debug Info</button>
  </div>

  <!-- Individual Tests -->
  <div class="test-section">
    <h3>Individual Tests</h3>
    <button class="btn btn-outline-primary btn-test" onclick="testServiceLoading()">Test 1: Service Loading</button>
    <button class="btn btn-outline-primary btn-test" onclick="testAPICall()">Test 2: API Call (Dual Request)</button>
    <button class="btn btn-outline-primary btn-test" onclick="testFormPatching()">Test 3: Form Field Patching</button>
    <button class="btn btn-outline-primary btn-test" onclick="testTableDisplay()">Test 4: Table Display</button>
    <button class="btn btn-outline-primary btn-test" onclick="testButtonWiring()">Test 5: Button Wiring</button>
    <button class="btn btn-outline-primary btn-test" onclick="testReceiptSelection()">Test 6: Receipt Selection</button>
  </div>

  <!-- Test Results -->
  <div class="test-section">
    <h3>Test Results</h3>
    <div id="testResults"></div>
  </div>

  <!-- Console Output -->
  <div class="test-section">
    <h3>Console Output</h3>
    <div id="consoleOutput" class="console-output"></div>
  </div>
</div>

<script src="../../assets/js/services/shared/serviceLoader.js"></script>
<script>
// Capture console output
const originalLog = console.log;
const originalError = console.error;
const consoleOutputDiv = document.getElementById('consoleOutput');

function addConsoleMessage(type, args) {
  const msg = Array.from(args).map(arg => {
    if (typeof arg === 'object') {
      return JSON.stringify(arg, null, 2);
    }
    return String(arg);
  }).join(' ');
  
  const timestamp = new Date().toLocaleTimeString();
  const color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#51cf66' : '#d4d4d4';
  consoleOutputDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${msg}</div>`;
  consoleOutputDiv.scrollTop = consoleOutputDiv.scrollHeight;
}

console.log = function(...args) {
  originalLog.apply(console, args);
  addConsoleMessage('log', args);
};

console.error = function(...args) {
  originalError.apply(console, args);
  addConsoleMessage('error', args);
};

// Test Results Display
function addTestResult(testName, passed, message) {
  const resultsDiv = document.getElementById('testResults');
  const resultClass = passed ? 'test-pass' : 'test-fail';
  const icon = passed ? '✅' : '❌';
  
  resultsDiv.innerHTML += `
    <div class="${resultClass} test-result">
      <strong>${icon} ${testName}</strong><br>
      ${message}
    </div>
  `;
}

function clearResults() {
  document.getElementById('testResults').innerHTML = '';
  document.getElementById('consoleOutput').innerHTML = '';
}

// Test 1: Service Loading
async function testServiceLoading() {
  console.log('🧪 Test 1: Service Loading');
  
  try {
    await ServiceLoader.loadCore();
    await ServiceLoader.loadTransactionService();
    await ServiceLoader.loadLookupService();
    
    const servicesLoaded = 
      typeof window.TransactionService !== 'undefined' &&
      typeof window.LookupService !== 'undefined' &&
      typeof window.CoreApi !== 'undefined';
    
    if (servicesLoaded) {
      addTestResult('Test 1: Service Loading', true, 
        'All services loaded successfully: CoreApi, TransactionService, LookupService');
    } else {
      addTestResult('Test 1: Service Loading', false, 
        'Some services failed to load');
    }
  } catch (error) {
    addTestResult('Test 1: Service Loading', false, error.message);
  }
}

// Test 2: API Call (Dual Request)
async function testAPICall() {
  console.log('🧪 Test 2: Dual API Call');
  
  try {
    await ServiceLoader.loadCore();
    await ServiceLoader.loadTransactionService();
    
    const TransactionService = window.TransactionService;
    
    console.log('Making first API call: getGCReversalDetail...');
    const requestData = {
      CenterID: 'TEST123',
      SchemeID: 'SCH001',
      OperatorID: 'test_user'
    };
    
    const result1 = await TransactionService.getGCReversalDetail(requestData);
    console.log('First API Response:', result1);
    
    console.log('Making second API call: getGroupDefaultScheme...');
    const result2 = await TransactionService.getGroupDefaultScheme(requestData);
    console.log('Second API Response:', result2);
    
    const bothCallsMade = result1 && result2;
    
    if (bothCallsMade) {
      addTestResult('Test 2: Dual API Call', true, 
        `Both API calls completed. Result1 success: ${result1.success}, Result2 success: ${result2.success}`);
    } else {
      addTestResult('Test 2: Dual API Call', false, 
        'One or both API calls failed to execute');
    }
  } catch (error) {
    addTestResult('Test 2: Dual API Call', false, error.message);
  }
}

// Test 3: Form Field Patching
async function testFormPatching() {
  console.log('🧪 Test 3: Form Field Patching');
  
  try {
    // Create mock data
    const mockData = {
      reversalDetails: {
        CenterID: 'CENTER123',
        SchemeID: 'SCHEME456',
        Details: [
          { TscSerial: 'TSC001', CreatedBy: 'Admin', Supervision: 'Yes', ReceivedAmount: 1000 }
        ]
      },
      schemeDetails: {
        SchemeID: 'SCHEME789',
        SchemeName: 'Test Scheme'
      }
    };
    
    // Test field mapping function
    const fieldMappings = [
      { keys: ['CenterID', 'centerID', 'centerId', 'center_id'] },
      { keys: ['SchemeID', 'schemeID', 'schemeId', 'scheme_id'] }
    ];
    
    function findValueByKeys(obj, keys) {
      for (const key of keys) {
        if (obj[key] !== undefined && obj[key] !== null) {
          return obj[key];
        }
      }
      return null;
    }
    
    const centerValue = findValueByKeys(mockData.reversalDetails, fieldMappings[0].keys);
    const schemeValue = findValueByKeys(mockData.schemeDetails, fieldMappings[1].keys);
    
    if (centerValue === 'CENTER123' && schemeValue === 'SCHEME789') {
      addTestResult('Test 3: Form Field Patching', true, 
        `Field mapping works correctly. Center: ${centerValue}, Scheme: ${schemeValue}`);
    } else {
      addTestResult('Test 3: Form Field Patching', false, 
        `Field mapping failed. Center: ${centerValue}, Scheme: ${schemeValue}`);
    }
  } catch (error) {
    addTestResult('Test 3: Form Field Patching', false, error.message);
  }
}

// Test 4: Table Display
function testTableDisplay() {
  console.log('🧪 Test 4: Table Display');
  
  try {
    const mockData = [
      { TscSerial: 'TSC001', CreatedBy: 'Admin', Supervision: 'Yes', ReceivedAmount: 1000 },
      { TscSerial: 'TSC002', CreatedBy: 'User1', Supervision: 'No', ReceivedAmount: 2000 }
    ];
    
    let html = '';
    mockData.forEach((row, index) => {
      const tscSerial = row.TscSerial || row.tscSerial || row.tsc_serial || '';
      const createdBy = row.CreatedBy || row.createdBy || row.created_by || '';
      const supervision = row.Supervision || row.supervision || '';
      const receivedAmount = row.ReceivedAmount || row.receivedAmount || row.received_amount || 0;

      html += `
        <tr class="receipt-row" data-index="${index}">
          <td>${tscSerial}</td>
          <td>${createdBy}</td>
          <td>${supervision}</td>
          <td>${receivedAmount}</td>
        </tr>
      `;
    });
    
    const rowCount = (html.match(/<tr/g) || []).length;
    
    if (rowCount === 2) {
      addTestResult('Test 4: Table Display', true, 
        `Table generated correctly with ${rowCount} rows`);
    } else {
      addTestResult('Test 4: Table Display', false, 
        `Expected 2 rows, got ${rowCount}`);
    }
  } catch (error) {
    addTestResult('Test 4: Table Display', false, error.message);
  }
}

// Test 5: Button Wiring
function testButtonWiring() {
  console.log('🧪 Test 5: Button Wiring');
  
  try {
    // Check if global function exists for receipt selection
    const selectionFunctionExists = typeof window.GCReversal_selectReceipt === 'function';
    
    // Check button event simulation
    const mockButtons = {
      view: { clicked: false, handler: () => { mockButtons.view.clicked = true; } },
      edit: { clicked: false, handler: () => { mockButtons.edit.clicked = true; } },
      save: { clicked: false, handler: () => { mockButtons.save.clicked = true; } },
      cancel: { clicked: false, handler: () => { mockButtons.cancel.clicked = true; } }
    };
    
    // Simulate clicks
    mockButtons.view.handler();
    mockButtons.edit.handler();
    mockButtons.save.handler();
    mockButtons.cancel.handler();
    
    const allButtonsRespond = 
      mockButtons.view.clicked &&
      mockButtons.edit.clicked &&
      mockButtons.save.clicked &&
      mockButtons.cancel.clicked;
    
    if (allButtonsRespond && selectionFunctionExists) {
      addTestResult('Test 5: Button Wiring', true, 
        'All button handlers work correctly and selection function exists');
    } else {
      addTestResult('Test 5: Button Wiring', false, 
        `Handlers: ${allButtonsRespond}, Selection function: ${selectionFunctionExists}`);
    }
  } catch (error) {
    addTestResult('Test 5: Button Wiring', false, error.message);
  }
}

// Test 6: Receipt Selection
function testReceiptSelection() {
  console.log('🧪 Test 6: Receipt Selection');
  
  try {
    // Mock data for selection
    let selectedReceipt = null;
    const receipts = [
      { TscSerial: 'TSC001', ReceivedAmount: 1000 },
      { TscSerial: 'TSC002', ReceivedAmount: 2000 }
    ];
    
    // Simulate selection
    const selectIndex = 1;
    selectedReceipt = receipts[selectIndex];
    
    if (selectedReceipt && selectedReceipt.TscSerial === 'TSC002') {
      addTestResult('Test 6: Receipt Selection', true, 
        `Receipt selected correctly: ${selectedReceipt.TscSerial}`);
    } else {
      addTestResult('Test 6: Receipt Selection', false, 
        'Receipt selection failed');
    }
  } catch (error) {
    addTestResult('Test 6: Receipt Selection', false, error.message);
  }
}

// Run All Tests
async function runAllTests() {
  clearResults();
  console.log('🚀 Running all tests...\n');
  
  await testServiceLoading();
  await new Promise(resolve => setTimeout(resolve, 500));
  
  await testAPICall();
  await new Promise(resolve => setTimeout(resolve, 500));
  
  testFormPatching();
  await new Promise(resolve => setTimeout(resolve, 500));
  
  testTableDisplay();
  await new Promise(resolve => setTimeout(resolve, 500));
  
  testButtonWiring();
  await new Promise(resolve => setTimeout(resolve, 500));
  
  testReceiptSelection();
  
  console.log('\n✅ All tests completed!');
}

// Debug Info
function showDebugInfo() {
  console.log('\n📋 Debug Information:');
  console.log('Window.TransactionService:', typeof window.TransactionService);
  console.log('Window.LookupService:', typeof window.LookupService);
  console.log('Window.CoreApi:', typeof window.CoreApi);
  console.log('Window.ServiceLoader:', typeof window.ServiceLoader);
  console.log('Window.GCReversal_selectReceipt:', typeof window.GCReversal_selectReceipt);
  
  addTestResult('Debug Info', true, 'Check console output for detailed information');
}

// Auto-run on load
window.addEventListener('load', () => {
  console.log('🎯 Test page loaded. Click "Run All Tests" to begin.');
  addTestResult('System Check', true, 'Test page initialized successfully');
});
</script>

</body>
</html>
