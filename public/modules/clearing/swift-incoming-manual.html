<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Incoming Manual</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --border-color: #e2e8f0;
            --input-focus: #3b82f6;
            --input-focus-rgba: rgba(59, 130, 246, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .screen-wrapper {
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 20px;
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 16px;
            overflow: hidden;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 8px;
            gap: 12px;
        }

        .main-content::-webkit-scrollbar {
            width: 6px;
        }

        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .section-header {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 4px -1px rgba(37, 99, 235, 0.1);
            margin-bottom: 12px;
        }

        /* Form Layout */
        .form-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
        }

        .dual-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .form-label {
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            text-align: right;
            user-select: none;
            white-space: nowrap;
        }

        .form-label.blue-text {
            color: #2563eb;
        }

        .form-input {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-main);
            background-color: white;
            transition: all 0.2s;
            width: 100%;
            height: 32px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--input-focus-rgba);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.2rem;
            padding-right: 2rem;
        }

        .input-group-custom {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .search-btn {
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 6px;
            background: rgba(37, 99, 235, 0.05);
            border: 1px solid transparent;
            height: 32px;
            width: 32px;
        }

        .search-btn:hover {
            background: rgba(37, 99, 235, 0.1);
            border-color: rgba(37, 99, 235, 0.2);
        }

        textarea.form-input {
            height: auto;
            min-height: 50px;
            resize: vertical;
            padding: 8px;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: rgba(248, 250, 252, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: 100%;
        }

        .sidebar-spacer {
            flex: 1;
        }

        .sidebar-btn {
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: white;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sidebar-btn:hover {
            background-color: #f8fafc;
        }

        .sidebar-btn.primary {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            font-weight: 600;
        }

        /* Footer / Audit */
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            background: rgba(241, 245, 249, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-top: auto;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .footer-row {
            display: grid;
            grid-template-columns: 80px 1fr;
            align-items: center;
            gap: 8px;
        }

        .footer-label {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }

        .footer-input {
            height: 26px;
            font-size: 11px;
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: white;
        }
    </style>
</head>

<body>
    <div class="screen-wrapper">
        <div class="main-content">

            <!-- Message Type -->
            <div class="section-header">
                Message Type
            </div>
            <div class="form-row">
                <label class="form-label blue-text">Type Of Instrument</label>
                <div class="dual-row">
                    <select class="form-input form-select">
                        <option>SWIFT</option>
                    </select>
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">Message Type ID</label>
                        <select class="form-input form-select">
                            <option>--Select--</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <label class="form-label">Liquidation Option</label>
                <select class="form-input form-select" style="width: 50%;">
                    <option>--Select--</option>
                </select>
            </div>

            <!-- Beneficiary Details -->
            <div class="section-header">
                Beneficiary Details
            </div>

            <div class="form-row">
                <label class="form-label">Reference Number</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="text" class="form-input">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">Account Type</label>
                        <select class="form-input form-select">
                            <option>Customer</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">BranchID</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input" value="0101" style="width: 80px;">
                    <input type="text" class="form-input" value="Head Office">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">AccountID</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">Account Currency ID</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="text" class="form-input">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">TrxCurrencyID</label>
                        <div class="input-group-custom">
                            <input type="text" class="form-input">
                            <button class="search-btn"><i class="fas fa-search"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">Transaction ID</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="text" class="form-input">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">Who To Charge</label>
                        <select class="form-input form-select">
                            <option>Customer Pays - OUR</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">Transaction Amount</label>
                <div class="dual-row">
                    <input type="text" class="form-input">
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">Exchange Rate</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Local Amount</label>
                <div class="dual-row">
                    <input type="text" class="form-input">
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Forex Gain / Loss</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Charge Amount</label>
                <div class="dual-row">
                    <input type="text" class="form-input">
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Account Charge Amount</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Waive Charges</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="checkbox">
                    </div>
                    <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">Narration(:72:)</label>
                        <textarea class="form-input" style="height: 32px; min-height: 32px; resize: none;"></textarea>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Permit Number</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">Correspondent Bank(:53A:)</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input">
                    <input type="text" class="form-input">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">Correspondent<br>AccountID(:53A:)</label>
                <input type="text" class="form-input">
            </div>

            <!-- Sender Details -->
            <div class="section-header">
                Sender Details
            </div>
            <div class="form-row">
                <label class="form-label">Sender's Correspondent(:54A:)</label>
                <div class="dual-row">
                    <input type="text" class="form-input">
                    <div style="display: flex; flex-direction:column; gap:4px; align-items: flex-end;">
                        <div
                            style="display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 8px; width: 100%;">
                            <label class="form-label" style="text-align: right;">Sender's
                                Correspondent<br>Account(:54A:)</label>
                            <input type="text" class="form-input">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Institution Swift Code(:57A:)</label>
                <div class="dual-row">
                    <input type="text" class="form-input">
                    <div style="display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Account With Intitution(:57A:)</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">Sender Reference</label>
                <div class="dual-row">
                    <input type="text" class="form-input">
                    <div style="display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">Sender To Receiver Info(:72:)</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Intermediary Swift Code</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="text" class="form-input">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    <div style="display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Intermediary AccountID</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div style="border-top: 1px solid #e2e8f0; margin: 12px 0;"></div>

            <div class="form-row">
                <label class="form-label">Sender AccountID(:59:)</label>
                <div class="dual-row">
                    <input type="text" class="form-input">
                    <div style="display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label blue-text">Country</label>
                        <select class="form-input form-select">
                            <option>--Select--</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row" style="align-items: start;">
                <label class="form-label" style="padding-top:8px;">Sender Name/Address</label>
                <div class="dual-row">
                    <textarea class="form-input"></textarea>
                    <div style="display: flex; flex-direction:column; gap:12px;">
                        <div style="display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 8px;">
                            <label class="form-label">Beneficiary BranchID</label>
                            <input type="text" class="form-input">
                        </div>
                        <div style="display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 8px;">
                            <label class="form-label">Transaction Amount</label>
                            <input type="text" class="form-input">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label blue-text">Purpose Of Remittance</label>
                <input type="text" class="form-input" style="width: 50%;">
            </div>


            <!-- Footer / Audit -->
            <div class="footer-grid">
                <div class="footer-col">
                    <div class="footer-row">
                        <label class="footer-label">Created By</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Created On</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                </div>
                <div class="footer-col">
                    <div class="footer-row">
                        <label class="footer-label">Modified By</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Modified On</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                </div>
                <div class="footer-col">
                    <div class="footer-row">
                        <label class="footer-label">Supervised By</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Supervised On</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                </div>
            </div>

        </div>

        <div class="sidebar">
            <button class="sidebar-btn">Print</button>
            <div class="sidebar-spacer" style="flex: 0 0 20px;"></div>
            <button class="sidebar-btn View-active" style="font-weight: 700; text-decoration: underline;">View</button>
            <button class="sidebar-btn"><i class="fas fa-plus me-2"></i>Add</button>
            <button class="sidebar-btn"><i class="fas fa-edit me-2"></i>Edit</button>
            <button class="sidebar-btn"><i class="fas fa-check-circle me-2"></i>Post</button>
            <button class="sidebar-btn"><i class="fas fa-times me-2"></i>Cancel</button>
        </div>
    </div>
</body>

</html>
