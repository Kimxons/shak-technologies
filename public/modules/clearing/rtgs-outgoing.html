<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTGS Outgoing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --border-color: #e2e8f0;
            --input-focus: #3b82f6;
            --input-focus-rgba: rgba(59, 130, 246, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .screen-wrapper {
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 20px;
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 16px;
            overflow: hidden;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 8px;
        }

        .main-content::-webkit-scrollbar {
            width: 6px;
        }

        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .section-header {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            margin: 16px 0 12px 0;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 4px -1px rgba(37, 99, 235, 0.1);
        }

        .section-header:first-of-type {
            margin-top: 0;
        }

        /* Form Layout */
        .form-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
        }

        .dual-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .dual-field-group {
            display: grid;
            grid-template-columns: 1fr 160px 1fr;
            /* For "Label Field Label Field" setup */
            gap: 8px;
            align-items: center;
        }

        .form-label {
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            text-align: right;
            user-select: none;
            white-space: nowrap;
        }

        .form-input {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-main);
            background-color: white;
            transition: all 0.2s;
            width: 100%;
            height: 32px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--input-focus-rgba);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.2rem;
            padding-right: 2rem;
        }

        .input-group-custom {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .search-btn {
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 6px;
            background: rgba(37, 99, 235, 0.05);
            border: 1px solid transparent;
            height: 32px;
            width: 32px;
        }

        .search-btn:hover {
            background: rgba(37, 99, 235, 0.1);
            border-color: rgba(37, 99, 235, 0.2);
        }

        textarea.form-input {
            height: auto;
            min-height: 60px;
            resize: vertical;
            padding: 8px;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: rgba(248, 250, 252, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: 100%;
        }

        .sidebar-spacer {
            flex: 1;
        }

        .sidebar-btn {
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: white;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sidebar-btn:hover {
            background-color: #f8fafc;
        }

        .sidebar-btn.primary {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            font-weight: 600;
        }

        .sidebar-btn.view-active {
            font-weight: 700;
            border-color: #cbd5e1;
            text-decoration: underline;
        }

        /* Footer / Audit */
        .footer-grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            background: rgba(241, 245, 249, 0.5);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .footer-row {
            display: grid;
            grid-template-columns: 100px 1fr;
            align-items: center;
            gap: 8px;
        }

        .footer-label {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }

        .footer-input {
            height: 28px;
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: white;
        }
    </style>
</head>

<body>
    <div class="screen-wrapper">
        <div class="main-content">
            <!-- Message Type Section -->
            <div class="section-header">
                Message Type
            </div>

            <div class="form-row">
                <label class="form-label">Type Of Instrument(M)</label>
                <div class="dual-row">
                    <select class="form-input form-select">
                        <option>RTGS</option>
                    </select>

                    <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Message Type ID (M)</label>
                        <select class="form-input form-select">
                            <option>--Select--</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Customer Account Details -->
            <div class="section-header">
                Customer Account Details
            </div>

            <div class="form-row">
                <label class="form-label">Reference Number (20:)</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="text" class="form-input" value="">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>

                    <div style="display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Originator Ref:</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Account Type</label>
                <select class="form-input form-select" style="width: 50%;">
                    <option>Customer</option>
                </select>
            </div>

            <div class="form-row">
                <label class="form-label">Customer BranchID</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input" value="0101" style="width: 80px;">
                    <input type="text" class="form-input" value="Head Office">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Ordering Customer</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">AccountID(M:50K:)</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Account Currency ID</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="text" class="form-input">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>

                    <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">TrxCurrencyID (M:32A:)</label>
                        <div class="input-group-custom">
                            <input type="text" class="form-input">
                            <button class="search-btn"><i class="fas fa-search"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Transaction Amount (M:32A:)</label>
                <div class="dual-row">
                    <input type="text" class="form-input">

                    <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Exchange Rate</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Local Amount</label>
                <div class="dual-row">
                    <input type="text" class="form-input">

                    <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Forex Gain / Loss</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Charge Amount</label>
                <div class="dual-row">
                    <input type="text" class="form-input">

                    <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Account Charge Amount</label>
                        <input type="text" class="form-input">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Waive Charges</label>
                <div class="dual-row">
                    <div class="input-group-custom">
                        <input type="checkbox" style="margin-left: 4px;">
                    </div>

                    <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Who To Charge (M:71A:)</label>
                        <select class="form-input form-select">
                            <option>Customer Pays - OUR</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Narration</label>
                <input type="text" class="form-input">
            </div>

            <!-- Beneficiary Details -->
            <div class="section-header">
                Beneficiary Details
            </div>

            <div class="form-row">
                <label class="form-label">Inst. Swift Code(M:57A:)</label>
                <div class="input-group-custom">
                    <input type="text" class="form-input">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Account With Inst.(0:57A:)</label>
                <input type="text" class="form-input">
            </div>

            <div class="form-row">
                <label class="form-label">Sender To Receiver Info(0:72:)</label>
                <input type="text" class="form-input">
            </div>

            <div class="form-row">
                <label class="form-label">Beneficiary AccountID(0:59:)</label>
                <div class="dual-row">
                    <input type="text" class="form-input">

                    <div style="display: grid; grid-template-columns: 50px 1fr; align-items: center; gap: 8px;">
                        <label class="form-label">Country</label>
                        <select class="form-input form-select">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row" style="align-items: start;">
                <label class="form-label" style="padding-top: 8px;">Beneficiary<br>Name/Address(M:59:)</label>
                <div class="dual-row">
                    <textarea class="form-input"></textarea>

                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                            <label class="form-label">Beneficiary BranchID</label>
                            <div class="input-group-custom">
                                <input type="text" class="form-input">
                                <button class="search-btn"><i class="fas fa-search"></i></button>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px;">
                            <label class="form-label">Transaction Amount</label>
                            <input type="text" class="form-input">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Details Of Payment(0:70:)</label>
                <input type="text" class="form-input">
            </div>

            <!-- Footer / Audit -->
            <div class="footer-grid">
                <div class="footer-col">
                    <div class="footer-row">
                        <label class="footer-label">Total Debit</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Created By</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Created On</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                </div>
                <div class="footer-col">
                    <div class="footer-row">
                        <label class="footer-label">Total Credit</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Modified By</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Modified On</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                </div>
                <div class="footer-col">
                    <div class="footer-row">
                        <label class="footer-label">Un-Posted</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Supervised By</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                    <div class="footer-row">
                        <label class="footer-label">Supervised On</label>
                        <input type="text" class="footer-input" readonly>
                    </div>
                </div>
            </div>

        </div>

        <div class="sidebar">
            <button class="sidebar-btn" disabled>File</button>
            <div class="sidebar-spacer" style="flex: 0 0 10px;"></div>
            <button class="sidebar-btn text-primary" style="background: #eff6ff; border-color: #bfdbfe;">
                Image
            </button>
            <div class="sidebar-spacer"></div>
            <button class="sidebar-btn" disabled>Signature</button>
            <button class="sidebar-btn view-active">View</button>
            <button class="sidebar-btn"><i class="fas fa-plus me-2"></i>Add</button>
            <button class="sidebar-btn"><i class="fas fa-edit me-2"></i>Edit</button>
            <button class="sidebar-btn primary"><i class="fas fa-save me-2"></i>Save</button>
            <button class="sidebar-btn section-header"
                style="background: #e2e8f0; color: #475569; justify-content: center; margin: 0; padding: 10px; box-shadow: none; border: 1px solid #cbd5e1;">Cannot
                Cancel</button>
            <!-- Note: Screenshot says Cancel, but I'll make it normal Cancel button -->
            <button class="sidebar-btn secondary"><i class="fas fa-times me-2"></i>Cancel</button>
        </div>
    </div>
</body>

</html>
