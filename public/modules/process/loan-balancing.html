<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Balancing · Process</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="loan-balancing-overdraft.css?v=20260119" />
</head>

<body class="loan-balancing copilot-theme" data-page="loan-balancing">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="loan-balancing-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="cm-top-identifiers card-surface" aria-label="Loan balancing">
          <div class="lb-form-band" aria-hidden="true"></div>

          <div class="lb-card-titlebar" role="heading" aria-level="2">
            <i class="bi bi-ui-checks-grid" aria-hidden="true"></i>
            <span>Loan Balancing</span>
          </div>

          <div class="p-3 pt-2 lb-form-layout">
            <div class="row g-2 align-items-center lb-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label text-primary lb-label" for="BalancingType"><i class="bi bi-sliders" aria-hidden="true"></i><span>Balancing Type</span></label>
              </div>
              <div class="col-12 col-md-10">
                <select class="form-select" id="BalancingType" name="BalancingType">
                  <option value="group" selected>Group</option>
                  <option value="individual">Individual</option>
                </select>
              </div>
            </div>

            <div class="row g-2 align-items-center lb-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label text-primary lb-label" for="BranchId"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></label>
              </div>
              <div class="col-12 col-md-10">
                <div class="input-group">
                  <input class="form-control" id="BranchId" name="BranchId" value="0101" placeholder="Branch ID" />
                  <input class="form-control" id="BranchName" name="BranchName" value="Head Office" readonly placeholder="Branch Name" />
                  <button type="button" class="btn btn-outline-primary" data-lb-lookup="branch" aria-label="Lookup Branch">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="row g-2 align-items-center lb-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label lb-label" for="CenterId"><i class="bi bi-geo-alt" aria-hidden="true"></i><span>Center ID</span></label>
              </div>
              <div class="col-12 col-md-10">
                <div class="input-group">
                  <input class="form-control" id="CenterId" name="CenterId" placeholder="Center ID" />
                  <input class="form-control" id="CenterName" name="CenterName" readonly placeholder="Center Name" />
                  <button type="button" class="btn btn-outline-primary" data-lb-lookup="center" aria-label="Lookup Center">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="row g-2 align-items-center lb-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label lb-label" for="SchemeId"><i class="bi bi-diagram-3" aria-hidden="true"></i><span>Scheme ID</span></label>
              </div>
              <div class="col-12 col-md-10">
                <div class="input-group">
                  <input class="form-control" id="SchemeId" name="SchemeId" placeholder="Scheme ID" />
                  <input class="form-control" id="SchemeName" name="SchemeName" readonly placeholder="Scheme Name" />
                  <button type="button" class="btn btn-outline-primary" data-lb-lookup="scheme" aria-label="Lookup Scheme">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="row g-2 align-items-center lb-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label lb-label" for="AccountId"><i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>Account ID</span></label>
              </div>
              <div class="col-12 col-md-10">
                <div class="input-group">
                  <input class="form-control" id="AccountId" name="AccountId" placeholder="Account ID" />
                  <input class="form-control" id="AccountName" name="AccountName" readonly placeholder="Account Name" />
                  <button type="button" class="btn btn-outline-primary" data-lb-lookup="account" aria-label="Lookup Account">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface" aria-label="Results" style="min-height: 52vh;">
            <div class="lb-card-titlebar" role="heading" aria-level="2">
              <i class="bi bi-table" aria-hidden="true"></i>
              <span>Results</span>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0 lb-table">
                <thead>
                  <tr>
                    <th style="width: 44px">
                      <input class="form-check-input" type="checkbox" aria-label="Select all" disabled />
                    </th>
                    <th style="width: 35%"><i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>Account ID</span></th>
                    <th><i class="bi bi-person-vcard" aria-hidden="true"></i><span>Account Name</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="3" class="text-start text-muted py-2">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group lb-actions">
          <button type="button" class="cm-shell__action" data-lb-action="view"><i class="bi bi-eye" aria-hidden="true"></i><span>View</span></button>
          <button type="button" class="cm-shell__action" data-lb-action="balance" disabled><i class="bi bi-check2-circle" aria-hidden="true"></i><span>Balance</span></button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-lb-action="cancel"><i class="bi bi-x-circle" aria-hidden="true"></i><span>Cancel</span></button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/process/loan-balancing.embedded.js"></script>
</body>

</html>
