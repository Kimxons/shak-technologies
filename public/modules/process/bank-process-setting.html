<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank Process Setting · Process</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="bank-process-setting-overdraft.css?v=20260119" />
</head>

<body class="bank-process-setting copilot-theme" data-page="bank-process-setting">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="bank-process-setting-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="cm-top-identifiers card-surface" aria-label="Bank process setting">
          <div class="bps-card-titlebar">
            <i class="bi bi-sliders"></i>
            <span>Bank Process Setting</span>
          </div>
          <div class="bps-form-band" aria-hidden="true"></div>

          <div class="row g-2 align-items-end">
            <div class="col-12">
              <div class="cbs-field">
                <label class="cbs-label text-primary" for="ProcessId"><i class="bi bi-diagram-3"></i> Process ID</label>
                <div class="input-group">
                  <input class="form-control" id="ProcessId" name="ProcessId" placeholder="Process ID" />
                  <input class="form-control" id="ProcessName" name="ProcessName" placeholder="Process Name" />
                  <button type="button" class="btn btn-outline-secondary" data-bps-lookup="process"
                    aria-label="Lookup Process">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface" aria-label="Process sub processes" style="min-height: 52vh;">
            <div class="bps-card-titlebar">
              <i class="bi bi-diagram-3"></i>
              <span>Process Sub Processes</span>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0 bps-table">
                <thead>
                  <tr>
                    <th style="width: 90px"><i class="bi bi-check2-square"></i> Apply</th>
                    <th style="width: 110px"><i class="bi bi-patch-check"></i> Required</th>
                    <th style="width: 180px"><i class="bi bi-node-plus"></i> Sub Process</th>
                    <th style="width: 320px"><i class="bi bi-link-45deg"></i> Prerequisite SubProcess</th>
                    <th style="width: 260px"><i class="bi bi-diagram-2"></i> Dependant SubProcess</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="5" class="text-start text-muted py-2">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group bps-actions">
          <button type="button" class="cm-shell__action" data-bps-action="view"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="cm-shell__action" data-bps-action="edit" disabled><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="cm-shell__action" data-bps-action="delete" disabled><i class="bi bi-trash"></i> Delete</button>
          <button type="button" class="cm-shell__action" data-bps-action="save" disabled><i class="bi bi-check2-circle"></i> Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-bps-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/process/bank-process-setting.embedded.js"></script>
</body>

</html>
