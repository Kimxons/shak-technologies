<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Exception Overriding · Process</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="system-exception-overriding-overdraft.css?v=20260119" />
</head>

<body class="system-exception-overriding copilot-theme" data-page="system-exception-overriding">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="system-exception-overriding-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="cm-top-identifiers card-surface" aria-label="Header">
          <div class="seo-card-titlebar">
            <i class="bi bi-exclamation-triangle"></i>
            <span>Exception Details</span>
          </div>
          <div class="seo-form-band" aria-hidden="true"></div>

          <div class="row g-3 align-items-start">
            <div class="col-12">
              <div class="row g-2">
                <div class="col-12">
                  <div class="row g-2 align-items-end">
                    <div class="col-12">
                      <div class="cbs-field">
                        <label class="cbs-label text-primary" for="BranchId"><i class="bi bi-hash"></i> Branch ID</label>
                        <div class="input-group">
                          <input class="form-control" id="BranchId" name="BranchId" value="0101" placeholder="Branch ID" />
                          <input class="form-control" id="BranchName" name="BranchName" value="Head Office" placeholder="Branch Name" />
                          <button type="button" class="btn btn-outline-primary" data-seo-lookup="branch"
                            aria-label="Lookup Branch">
                            <i class="bi bi-search"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-4">
                      <div class="cbs-field">
                        <label class="cbs-label text-primary" for="ProcessDate"><i class="bi bi-calendar3"></i> Process Date</label>
                        <div class="input-group">
                          <input class="form-control" id="ProcessDate" name="ProcessDate" type="date" style="cursor: pointer;" />
                          <span class="input-group-text" style="cursor: pointer;" onclick="document.getElementById('ProcessDate').showPicker()">
                            <i class="bi bi-calendar3"></i>
                          </span>
                        </div>
                      </div>
                    </div>
                    <div class="col-12 col-lg-8"></div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-3">
                      <div class="cbs-field">
                        <label class="cbs-label" for="RefId"><i class="bi bi-tag"></i> Ref ID</label>
                        <input class="form-control" id="RefId" name="RefId" />
                      </div>
                    </div>
                    <div class="col-12 col-lg-9"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="card-surface" aria-label="Exception override">
          <div class="seo-card-titlebar">
            <i class="bi bi-shield-exclamation"></i>
            <span>Exception Override</span>
          </div>
          <div class="seo-section-band" aria-hidden="true"></div>

          <div class="row g-3 p-3 pt-2">
            <div class="col-12">
              <div class="cbs-field">
                <label class="cbs-label" for="Exception"><i class="bi bi-exclamation-circle"></i> Exception</label>
                <input class="form-control" id="Exception" name="Exception" />
              </div>
            </div>

            <div class="col-12 col-lg-4">
              <div class="cbs-field">
                <label class="cbs-label text-primary" for="TypeOfAction"><i class="bi bi-sliders"></i> Type Of Action</label>
                <select class="form-select" id="TypeOfAction" name="TypeOfAction">
                  <option value="" selected>--Select--</option>
                  <option value="override">Override</option>
                  <option value="waive">Waive</option>
                  <option value="approve">Approve</option>
                </select>
              </div>
            </div>

            <div class="col-12 col-lg-8">
              <div class="cbs-field">
                <label class="cbs-label" for="Remarks"><i class="bi bi-chat-left-text"></i> Remarks</label>
                <input class="form-control" id="Remarks" name="Remarks" />
              </div>
            </div>
          </div>

          <div class="seo-inline-actions">
            <button type="button" class="btn btn-outline-secondary" data-seo-inline="alter" disabled><i class="bi bi-pencil-square"></i> Alter</button>
            <button type="button" class="btn btn-outline-secondary" data-seo-inline="update" disabled><i class="bi bi-arrow-repeat"></i> Update</button>
            <button type="button" class="btn btn-outline-secondary" data-seo-inline="clear"><i class="bi bi-eraser"></i> Clear</button>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface" aria-label="Overrides list" style="min-height: 40vh;">
            <div class="seo-card-titlebar">
              <i class="bi bi-list-check"></i>
              <span>Overrides</span>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0 seo-table">
                <thead>
                  <tr>
                    <th style="width: 35%"><i class="bi bi-card-text"></i> Description</th>
                    <th style="width: 25%"><i class="bi bi-sliders"></i> Type Of Action</th>
                    <th><i class="bi bi-chat-left-text"></i> Remarks</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="3" class="text-start text-muted py-2">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="card-surface" aria-label="Behind the scene">
            <div class="seo-card-titlebar">
              <i class="bi bi-eye"></i>
              <span>Behind The Scene</span>
            </div>
            <div class="row g-3 p-3 pt-2">
              <div class="col-12 col-lg-6">
                <div class="cbs-field">
                  <label class="cbs-label" for="OverriddenBy"><i class="bi bi-person"></i> Overridden By</label>
                  <input class="form-control" id="OverriddenBy" name="OverriddenBy" />
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <div class="cbs-field">
                  <label class="cbs-label" for="OverriddenOn"><i class="bi bi-clock"></i> Overridden On</label>
                  <input class="form-control" id="OverriddenOn" name="OverriddenOn" />
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <section class="seo-ref-nav d-flex flex-column" aria-label="Ref ID navigation">
          <button type="button" class="btn btn-outline-primary seo-ref-nav__btn w-100 mb-1" data-seo-nav="prev"
            aria-label="Previous Ref ID">
            <i class="bi bi-arrow-left"></i>
          </button>
          <div class="seo-ref-nav__label text-center py-1">Ref ID</div>
          <button type="button" class="btn btn-outline-primary seo-ref-nav__btn w-100 mt-1" data-seo-nav="next"
            aria-label="Next Ref ID">
            <i class="bi bi-arrow-right"></i>
          </button>
        </section>
        <div class="cm-legacy-actions__group seo-actions">
          <button type="button" class="cm-shell__action" data-seo-action="view"><i class="bi bi-eye"></i> View</button>
          <button type="button" class="cm-shell__action" data-seo-action="edit" disabled><i class="bi bi-pencil-square"></i> Edit</button>
          <button type="button" class="cm-shell__action" data-seo-action="save" disabled><i class="bi bi-check2-circle"></i> Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-seo-action="cancel"><i class="bi bi-x-circle"></i> Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/process/system-exception-overriding.embedded.js"></script>
</body>

</html>
