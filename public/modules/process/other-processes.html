<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Other Processes · Process</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="other-processes-overdraft.css?v=20260119" />
</head>

<body class="other-processes copilot-theme" data-page="other-processes">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="other-processes-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="cm-top-identifiers card-surface" aria-label="Other processes">
          <div class="op-card-titlebar">
            <i class="bi bi-diagram-3"></i>
            <span>Other Processes</span>
          </div>
          <div class="op-form-band" aria-hidden="true"></div>

          <div class="row g-3 align-items-center">
            <div class="col-12 col-xl-10">
              <div class="cbs-field">
                <label class="cbs-label" for="Process"><i class="bi bi-list-task"></i> Process</label>
                <select class="form-select" id="Process" name="Process">
                  <option value="" selected></option>
                  <option value="processManagerModal">Process Manager</option>
                  <option value="processManagerBatchModal">Process Manager - Batch</option>
                  <option value="loanBalancingModal">Loan Balancing</option>
                  <option value="bankProcessSettingModal">Bank Process Setting</option>
                  <option value="systemExceptionOverridingModal">System Exception Overriding</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface" aria-label="Workspace" style="min-height: 52vh;">
            <div class="op-card-titlebar">
              <i class="bi bi-window"></i>
              <span>Workspace</span>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group op-actions">
          <button type="button" class="cm-shell__action" data-op-action="process"><i class="bi bi-play-circle"></i> Process</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/process/other-processes.embedded.js"></script>
</body>

</html>
