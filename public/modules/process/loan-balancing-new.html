<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Balancing</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="loan-balancing-new.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <!-- Main Content Area -->
            <div class="content">
                <div id="statusMsg" class="status-message"></div>

                <!-- Balancing Configuration Card -->
                <div class="card">
                    <div class="card-header">Loan Balancing Configuration</div>
                    <div class="card-body">
                        <div class="form-grid form-grid-2col">
                            <div class="field-row">
                                <label class="field-label required" for="balancingType">Balancing Type</label>
                                <div class="field-control">
                                    <select id="balancingType" onchange="handleBalancingTypeChange()">
                                        <option>--Select--</option>
                                        <option>Group</option>
                                        <option>Individual</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field-row">
                                <label class="field-label"></label>
                                <div class="field-control"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Selection Details Card -->
                <div class="card">
                    <div class="card-header">Selection Details</div>
                    <div class="card-body">
                        <div class="form-grid form-grid-2col">
                            <div class="field-row">
                                <label class="field-label required" for="branchId">Branch ID</label>
                                <div class="field-control">
                                    <input type="text" id="branchId" value="0101" placeholder="Branch ID">
                                    <input type="text" id="branchName" value="Head Office" placeholder="Branch Name" readonly style="flex: 1.2;">
                                    <span class="input-group-icon" onclick="handleBranchSearch()"><i class="bi bi-search"></i></span>
                                </div>
                            </div>
                            <div class="field-row">
                                <label class="field-label" for="centerId">Center ID</label>
                                <div class="field-control">
                                    <input type="text" id="centerId" placeholder="Center ID">
                                    <input type="text" id="centerName" placeholder="Center Name" readonly style="flex: 1.2;">
                                    <span class="input-group-icon" onclick="handleCenterSearch()"><i class="bi bi-search"></i></span>
                                </div>
                            </div>
                            <div class="field-row">
                                <label class="field-label" for="schemeId">Scheme ID</label>
                                <div class="field-control">
                                    <input type="text" id="schemeId" placeholder="Scheme ID">
                                    <input type="text" id="schemeName" placeholder="Scheme Name" readonly style="flex: 1.2;">
                                    <span class="input-group-icon" onclick="handleSchemeSearch()"><i class="bi bi-search"></i></span>
                                </div>
                            </div>
                            <div class="field-row">
                                <label class="field-label" for="memberId">Member ID</label>
                                <div class="field-control">
                                    <input type="text" id="memberId" placeholder="Member ID">
                                    <input type="text" id="memberName" placeholder="Member Name" readonly style="flex: 1.2;">
                                    <span class="input-group-icon" onclick="handleMemberSearch()"><i class="bi bi-search"></i></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="action-bar">
                <button class="action-button process" onclick="handleProcess()" title="Process">Process</button>
                <button class="action-button cancel" onclick="handleCancel()" title="Cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="loan-balancing-new.js"></script>
</body>
</html>
