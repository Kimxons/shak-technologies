<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Processes</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="other-processes-new.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <!-- Main Content Area -->
            <div class="content">
                <div id="statusMsg" class="status-message"></div>

                <!-- Process Selector Card -->
                <div class="card">
                    <div class="card-header"><i class="bi bi-diagram-3"></i> Select Process</div>
                    <div class="card-body">
                        <div class="form-grid form-grid-fullwidth">
                            <div class="field-row">
                                <label class="field-label required" for="processSelector"><i class="bi bi-list-task"></i> Process</label>
                                <div class="field-control">
                                    <select id="processSelector" onchange="handleProcessSelection()">
                                        <option value="">-- Select a Process --</option>
                                        <option value="process-manager">Process Manager</option>
                                        <option value="process-manager-batch">Process Manager-Batch</option>
                                        <option value="loan-balancing">Loan Balancing</option>
                                        <option value="bank-process-setting">Bank Process Setting</option>
                                        <option value="system-exception-overriding">System Exception Overriding</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Workspace for Dynamic Content -->
                <div id="workspace" style="display: none; background: white; border: 1px solid var(--border); border-radius: 3px; padding: 16px; margin-top: 12px;">
                    <div style="color: var(--text-gray); text-align: center;">
                        <i class="bi bi-info-circle" style="font-size: 32px; margin-bottom: 8px;"></i>
                        <p>Process content will be loaded here</p>
                    </div>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="action-bar">
                <button class="action-button process" onclick="handleProcess()" title="Process"><i class="bi bi-play-circle"></i> Process</button>
            </div>
        </div>
    </div>

    <script src="other-processes-new.js"></script>
</body>
</html>
