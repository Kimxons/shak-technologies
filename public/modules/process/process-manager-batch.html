<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Process Manager - Batch · Process</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="process-manager-overdraft.css?v=20260119" />
</head>

<body class="process-manager-batch copilot-theme" data-page="process-manager-batch">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="process-manager-batch-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="cm-top-identifiers card-surface" aria-label="Batch filters">
          <div class="pmb-form-band" aria-hidden="true"></div>

          <div class="pm-card-titlebar" role="heading" aria-level="2">
            <i class="bi bi-funnel" aria-hidden="true"></i>
            <span>Batch Filters</span>
          </div>

          <div class="row g-3">
            <div class="col-12">
              <div class="d-flex align-items-center gap-2">
                <div class="form-check mit-check mb-0">
                  <input class="form-check-input" type="checkbox" value="1" id="AllRegions" name="AllRegions" checked />
                  <label class="form-check-label" for="AllRegions">All Regions</label>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-8">
              <div class="cbs-field">
                <label class="cbs-label" for="RegionId"><i class="bi bi-geo-alt" aria-hidden="true"></i><span>Region ID</span></label>
                <div class="input-group">
                  <input type="text" class="form-control" id="RegionId" name="RegionId" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Search region" data-pmb-region-search>
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-8">
              <div class="cbs-field">
                <label class="cbs-label text-primary" for="ProcessId" id="ProcessIdLabel"><i class="bi bi-diagram-3" aria-hidden="true"></i><span>Process ID</span></label>
                <div class="input-group">
                  <input type="text" class="form-control" id="ProcessId" name="ProcessId" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Search process" data-pmb-process-search>
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface" aria-label="Batch results">
            <div class="pm-card-titlebar" role="heading" aria-level="2">
              <i class="bi bi-table" aria-hidden="true"></i>
              <span>Batch Results</span>
            </div>
            <div class="table-responsive pmb-table-wrap">
              <table class="table table-sm table-hover align-middle pmb-table mb-0">
                <thead>
                  <tr>
                    <th scope="col" class="text-center" style="width: 3rem;">
                      <input class="form-check-input" type="checkbox" aria-label="Select all" disabled />
                    </th>
                    <th scope="col"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></th>
                    <th scope="col"><i class="bi bi-building" aria-hidden="true"></i><span>Branch Name</span></th>
                    <th scope="col"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>Process Date</span></th>
                    <th scope="col"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Process Status</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="5" class="text-muted py-3">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-pmb-action="refresh" disabled><i class="bi bi-arrow-clockwise" aria-hidden="true"></i><span>Refresh</span></button>
          <button type="button" class="cm-shell__action" data-pmb-action="view"><i class="bi bi-eye" aria-hidden="true"></i><span>View</span></button>
          <button type="button" class="cm-shell__action" data-pmb-action="continue" disabled><i class="bi bi-play-circle" aria-hidden="true"></i><span>Continue</span></button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-pmb-action="cancel"><i class="bi bi-x-circle" aria-hidden="true"></i><span>Cancel</span></button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/process/process-manager-batch.embedded.js"></script>
</body>

</html>
