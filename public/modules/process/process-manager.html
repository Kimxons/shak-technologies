<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Process Manager · Process</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="process-manager-overdraft.css?v=20260119" />
</head>

<body class="process-manager copilot-theme" data-page="process-manager">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="process-manager-form" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="cm-top-identifiers card-surface" aria-label="Process manager header">
          <div class="pm-form-band" aria-hidden="true"></div>

          <div class="pm-card-titlebar" role="heading" aria-level="2">
            <i class="bi bi-ui-checks-grid" aria-hidden="true"></i>
            <span>Process Details</span>
          </div>

          <div class="p-3 pt-2 pm-form-layout">
            <div class="row g-2 align-items-center pm-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label text-primary pm-label" for="BranchId"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></label>
              </div>
              <div class="col-12 col-md-10">
                <div class="input-group">
                  <input type="text" class="form-control" id="BranchId" name="BranchId" value="0101" placeholder="Branch ID" />
                  <input type="text" class="form-control" id="BranchName" name="BranchName" value="Head Office" readonly placeholder="Branch Name" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Search branch" data-pm-branch-search>
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="row g-2 align-items-center pm-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label text-primary pm-label" for="ProcessId"><i class="bi bi-diagram-3" aria-hidden="true"></i><span>Process ID</span></label>
              </div>
              <div class="col-12 col-md-10">
                <div class="input-group">
                  <input type="text" class="form-control" id="ProcessId" name="ProcessId" />
                  <button class="btn btn-outline-primary" type="button" aria-label="Search process" data-pm-process-search>
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="row g-2 align-items-center pm-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label pm-label" for="ProcessName"><i class="bi bi-card-text" aria-hidden="true"></i><span>Process Name</span></label>
              </div>
              <div class="col-12 col-md-10">
                <input type="text" class="form-control" id="ProcessName" name="ProcessName" />
              </div>
            </div>

            <div class="row g-2 align-items-center pm-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label pm-label" for="ProcessDate"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>Process Date</span></label>
              </div>
              <div class="col-12 col-md-4">
                <input type="date" class="form-control" id="ProcessDate" name="ProcessDate" />
              </div>
              <div class="d-none d-md-block col-md-6"></div>
            </div>

            <div class="row g-2 align-items-start pm-row">
              <div class="col-12 col-md-2">
                <label class="cbs-label pm-label" for="ProcessStatus"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Process Status</span></label>
              </div>
              <div class="col-12 col-md-10">
                <textarea class="form-control" id="ProcessStatus" name="ProcessStatus" rows="5"></textarea>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface" aria-label="Sub processes">
            <div class="pm-card-titlebar" role="heading" aria-level="2">
              <i class="bi bi-diagram-2" aria-hidden="true"></i>
              <span>Sub Processes</span>
            </div>
            <div class="table-responsive pm-table-wrap">
              <table class="table table-sm table-hover align-middle pm-table mb-0">
                <thead>
                  <tr>
                    <th scope="col"><i class="bi bi-diagram-2" aria-hidden="true"></i><span>Sub Process</span></th>
                    <th scope="col"><i class="bi bi-activity" aria-hidden="true"></i><span>SubProcess Status</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="2" class="text-muted py-3">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-pm-action="refresh" disabled><i class="bi bi-arrow-clockwise" aria-hidden="true"></i><span>Refresh</span></button>
          <button type="button" class="cm-shell__action" data-pm-action="view"><i class="bi bi-eye" aria-hidden="true"></i><span>View</span></button>
          <button type="button" class="cm-shell__action" data-pm-action="continue" disabled><i class="bi bi-play-circle" aria-hidden="true"></i><span>Continue</span></button>
          <button type="button" class="cm-shell__action" data-pm-action="delete" disabled><i class="bi bi-trash" aria-hidden="true"></i><span>Delete</span></button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-pm-action="cancel"><i class="bi bi-x-circle" aria-hidden="true"></i><span>Cancel</span></button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/pages/process/process-manager.embedded.js"></script>
</body>

</html>
