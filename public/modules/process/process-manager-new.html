<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Manager</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="process-manager-new.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <!-- Main Content Area -->
            <div class="content">
                <div id="statusMsg" class="status-message"></div>

                <!-- Process Selection Card -->
                <div class="card">
                    <div class="card-header">Process Manager</div>
                    <div class="card-body">
                        <div class="form-grid form-grid-2col">
                            <div class="field-row">
                                <label class="field-label" for="branchId">Branch ID</label>
                                <div class="field-control">
                                    <input type="text" id="branchId" value="0101" placeholder="Branch ID">
                                    <input type="text" id="branchName" value="Head Office" placeholder="Branch Name" readonly style="flex: 1.2;">
                                    <span class="input-group-icon" onclick="handleBranchSearch()"><i class="bi bi-search"></i></span>
                                </div>
                            </div>
                            <div class="field-row">
                                <label class="field-label" for="processId">Process ID</label>
                                <div class="field-control">
                                    <input type="text" id="processId" placeholder="Process ID">
                                    <span class="input-group-icon" onclick="handleProcessSearch()"><i class="bi bi-search"></i></span>
                                </div>
                            </div>
                            <div class="field-row">
                                <label class="field-label" for="processName">Process Name</label>
                                <div class="field-control">
                                    <input type="text" id="processName" placeholder="Process Name">
                                </div>
                            </div>
                            <div class="field-row">
                                <label class="field-label" for="processDate">Process Date</label>
                                <div class="field-control">
                                    <input type="date" id="processDate">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Process Status Card -->
                <div class="card">
                    <div class="card-header">Process Status</div>
                    <div class="card-body">
                        <div class="form-grid form-grid-fullwidth">
                            <div class="field-row">
                                <label class="field-label" for="processStatus" style="align-self: flex-start;">Status</label>
                                <div class="field-control">
                                    <textarea id="processStatus" placeholder="Process Status"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sub Processes Table Card -->
                <div class="card">
                    <div class="card-header">Sub Processes</div>
                    <div class="card-body">
                        <div class="table-wrap">
                            <table id="subProcessTable">
                                <thead>
                                    <tr>
                                        <th>Sub Process</th>
                                        <th>SubProcess Status</th>
                                    </tr>
                                </thead>
                                <tbody id="subProcessTableBody">
                                    <tr>
                                        <td colspan="2" style="text-align: center; padding: 20px; color: var(--text-gray);">
                                            No records to display
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="action-bar">
                <button class="action-button refresh" onclick="handleRefresh()" title="Refresh" disabled>Refresh</button>
                <button class="action-button view" onclick="handleView()" title="View">View</button>
                <button class="action-button continue" onclick="handleContinue()" title="Continue" disabled>Continue</button>
                <button class="action-button delete" onclick="handleDelete()" title="Delete" disabled>Delete</button>
                <button class="action-button cancel" onclick="handleCancel()" title="Cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="process-manager-new.js"></script>
</body>
</html>
