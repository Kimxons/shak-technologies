<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Rates</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="base-rates">
    <div class="window">
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-percent am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">Base Rates</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" id="btnRefresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize"><i class="bi bi-square"></i></button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <div class="main-container" id="mainContainer">
            <main class="form-content" role="region" aria-label="Base Rates form">
                <div class="form-card" data-main-form>
                    <form autocomplete="off" novalidate>
                        <div class="form-section" data-section="base-rate-info">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Base Rate Information</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Base Rate Information" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="BaseRateID">Base Rate ID</label>
                                        <div class="kairo-control">
                                            <input type="text" id="BaseRateID" class="kairo-control__id" autocomplete="off" />
                                            <input type="text" id="BaseRateName" class="kairo-control__name" readonly tabindex="-1" />
                                            <button type="button" class="btn-lookup" id="btnLookupBaseRate" aria-label="Lookup Base Rate" title="Search"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>

                                    <div class="col">
                                        <label class="label-blue" for="CurrencyID">Currency ID</label>
                                        <div class="kairo-control">
                                            <input type="text" id="CurrencyID" class="kairo-control__id" autocomplete="off" />
                                            <input type="text" id="CurrencyName" class="kairo-control__name" readonly tabindex="-1" />
                                            <button type="button" class="btn-lookup" id="btnLookupCurrency" aria-label="Lookup Currency" title="Search"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <label class="label-blue" for="BaseRateType">Base Rate Type</label>
                                    <select id="BaseRateType" class="bs-select">
                                        <option value="ADVANCE">Advance Type</option>
                                        <option value="FIXED">Fixed</option>
                                        <option value="FLOATING">Floating</option>
                                        <option value="VARIABLE">Variable</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-section" data-section="rate-entry">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-calendar-event"></i>Rate Entry</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Rate Entry" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue" for="EffectiveDate">Effective Date</label>
                                        <input type="text" id="EffectiveDate" class="bs-input-text" data-date-picker placeholder="dd/mmm/yyyy" autocomplete="off" />
                                    </div>
                                    <div class="col">
                                        <label class="label-blue" for="BaseRateValue">Base Rate</label>
                                        <input type="text" id="BaseRateValue" class="bs-input-text" autocomplete="off" placeholder="0.00" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-section" data-section="rate-history">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-table"></i>Rate History</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Rate History" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="d-flex flex-wrap gap-2 mb-2" role="toolbar" aria-label="Rate history commands">
                                    <button type="button" class="btn-action" id="cmdNew"><i class="bi bi-plus-circle"></i>New</button>
                                    <button type="button" class="btn-action" id="cmdAlter" disabled><i class="bi bi-pencil"></i>Alter</button>
                                    <button type="button" class="btn-action" id="cmdRemove" disabled><i class="bi bi-trash"></i>Remove</button>
                                    <button type="button" class="btn-action" id="cmdUpdate" disabled><i class="bi bi-arrow-up-circle"></i>Update</button>
                                    <button type="button" class="btn-action" id="cmdClear"><i class="bi bi-eraser"></i>Clear</button>
                                </div>

                                <div class="table-responsive">
                                    <table class="table table-sm cm-lookup__table" id="ratesGrid" aria-label="Rate history">
                                        <thead>
                                            <tr>
                                                <th>Effective Date</th>
                                                <th>Base Rate</th>
                                            </tr>
                                        </thead>
                                        <tbody id="ratesGridBody">
                                            <tr>
                                                <td colspan="2" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="form-section" data-section="behind-scene">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-eye"></i>Behind The Scene</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="behind-scene">
                                    <div class="form-row two-col">
                                        <div class="col">
                                            <label class="label-blue" for="CreatedBy">Created By</label>
                                            <input type="text" class="bs-input-text" id="CreatedBy" readonly />
                                        </div>
                                        <div class="col">
                                            <label class="label-blue" for="CreatedOn">Created On</label>
                                            <input type="text" class="bs-input-text" id="CreatedOn" readonly />
                                        </div>
                                    </div>

                                    <div class="form-row two-col">
                                        <div class="col">
                                            <label class="label-blue" for="ModifiedBy">Modified By</label>
                                            <input type="text" class="bs-input-text" id="ModifiedBy" readonly />
                                        </div>
                                        <div class="col">
                                            <label class="label-blue" for="ModifiedOn">Modified On</label>
                                            <input type="text" class="bs-input-text" id="ModifiedOn" readonly />
                                        </div>
                                    </div>

                                    <div class="form-row two-col">
                                        <div class="col">
                                            <label class="label-blue" for="SupervisedBy">Supervised By</label>
                                            <input type="text" class="bs-input-text" id="SupervisedBy" readonly />
                                        </div>
                                        <div class="col">
                                            <label class="label-blue" for="SupervisedOn">Supervised On</label>
                                            <input type="text" class="bs-input-text" id="SupervisedOn" readonly />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </main>

            <aside class="action-panel" aria-label="Form actions">
                <div class="action-buttons">
                    <button class="btn-action" id="btnView" type="button"><i class="bi bi-eye"></i>View</button>
                    <button class="btn-action" id="btnAdd" type="button"><i class="bi bi-plus-circle"></i>Add</button>
                    <button class="btn-action" id="btnEdit" type="button" disabled><i class="bi bi-pencil"></i>Edit</button>
                    <button class="btn-action" id="btnDelete" type="button" disabled><i class="bi bi-trash"></i>Delete</button>
                    <button class="btn-action" id="btnSave" type="button" disabled><i class="bi bi-check-circle"></i>Save</button>
                    <button class="btn-action" id="btnCancel" type="button" disabled><i class="bi bi-x-circle"></i>Cancel</button>
                </div>
            </aside>
        </div>

        <div class="am-message-panel" role="alert" aria-live="polite">
            <i class="bi bi-info-circle"></i>
            <span></span>
        </div>
    </div>

    <!-- Lookup Popup (Base Rate / Currency) -->
    <div class="info-modal-overlay" id="lookupOverlay" hidden>
        <div class="info-modal" role="dialog" aria-modal="true" aria-labelledby="lookupTitle">
            <div class="info-modal-header">
                <h3 id="lookupTitle">Lookup</h3>
                <button type="button" class="info-modal-close" id="btnLookupClose" aria-label="Close lookup"><i class="bi bi-x-lg"></i></button>
            </div>

            <div class="info-modal-body">
                <div class="form-row two-col">
                    <div class="col">
                        <label class="label-blue" for="lookupId">ID</label>
                        <input type="text" id="lookupId" class="bs-input-text" autocomplete="off" />
                    </div>
                    <div class="col">
                        <label class="label-blue" for="lookupDesc">Name</label>
                        <input type="text" id="lookupDesc" class="bs-input-text" autocomplete="off" />
                    </div>
                </div>

                <div class="d-flex gap-2 mb-3">
                    <button type="button" class="info-detail-btn info-detail-btn-primary" id="btnLookupSearch"><i class="bi bi-search"></i>Search</button>
                    <button type="button" class="info-detail-btn info-detail-btn-secondary" id="btnLookupClear"><i class="bi bi-eraser"></i>Clear</button>
                </div>

                <div class="table-responsive" aria-label="Lookup results">
                    <table class="table table-sm info-modal-table" id="lookupGrid">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                            </tr>
                        </thead>
                        <tbody id="lookupGridBody">
                            <tr>
                                <td colspan="2" class="text-center text-muted">No results.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="info-modal-footer">
                <span class="info-modal-count"></span>
                <div class="d-flex gap-2">
                    <button type="button" class="info-detail-btn info-detail-btn-primary" id="btnLookupSelect"><i class="bi bi-check-circle"></i>Select</button>
                    <button type="button" class="info-detail-btn info-detail-btn-secondary" id="btnLookupCancel"><i class="bi bi-x-circle"></i>Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/ui/date-pickers.js"></script>
    <script src="base-rates.js?v=20260203"></script>
</body>
</html>
