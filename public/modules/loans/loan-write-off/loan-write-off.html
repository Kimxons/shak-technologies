<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Write Off · Loans</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/loans_styles.css" />
</head>

<body class="loan-write-off copilot-theme" data-page="loan-write-off">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="loanWriteOffForm" class="cm-shell-form" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="lwo-panel" aria-label="Loan Identifiers">
          <div class="lwo-identifiers">
            <div class="lwo-row lwo-row--branch">
              <label class="lwo-label required" for="BranchID">Branch ID</label>
              <div class="lwo-input"><input type="text" class="form-control" id="BranchID" name="BranchID" value="0101" readonly title="Branch ID" /></div>
              <div class="lwo-input"><input type="text" class="form-control" id="BranchName" name="BranchName" value="Head Office" readonly title="Branch Name" aria-label="Branch Name" /></div>
              <button class="lwo-lookup" type="button" data-lookup="branch" aria-label="Lookup branch" title="Lookup branch"><i class="bi bi-search"></i></button>
            </div>

            <div class="lwo-row lwo-row--wide">
              <label class="lwo-label" for="ClientID">Client ID</label>
              <div class="lwo-input"><input type="text" class="form-control" id="ClientID" name="ClientID" title="Client ID" /></div>
              <button class="lwo-lookup" type="button" data-lookup="client" aria-label="Lookup client" title="Lookup client"><i class="bi bi-search"></i></button>
            </div>

            <div class="lwo-row lwo-row--wide">
              <label class="lwo-label" for="AccountID">Account ID</label>
              <div class="lwo-input"><input type="text" class="form-control" id="AccountID" name="AccountID" title="Account ID" /></div>
              <button class="lwo-lookup" type="button" data-lookup="account" aria-label="Lookup account" title="Lookup account"><i class="bi bi-search"></i></button>
            </div>

            <div class="lwo-row">
              <label class="lwo-label" for="LoanSeries">Loan Series</label>
              <div class="lwo-input lwo-loanseries"><input type="text" class="form-control" id="LoanSeries" name="LoanSeries" title="Loan Series" /></div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="lwo-panel" aria-label="Loan Write Off Component Details">
            <div class="lwo-bar">Loan WriteOff Component Details</div>
            <div class="table-responsive lwo-table" aria-label="Component Details Table">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="lwo-col-160">Component</th>
                    <th class="text-end lwo-col-160">Actual Amount</th>
                    <th class="text-end lwo-col-180">Settlement Amount</th>
                    <th class="lwo-col-120">IsEditable</th>
                  </tr>
                </thead>
                <tbody data-component-rows></tbody>
              </table>
              <div class="p-3 text-muted" data-component-empty>No records to display.</div>
            </div>

            <div class="lwo-remarks-row">
              <label class="lwo-label lwo-label--remarks" for="Remarks">Remarks</label>
              <textarea class="form-control lwo-remarks" id="Remarks" name="Remarks" rows="2" title="Remarks"></textarea>
              <button type="button" class="lwo-generate" data-action="generate">Generate</button>
            </div>
          </section>

          <section class="lwo-panel" aria-label="Transaction Details">
            <div class="lwo-bar">Transaction Details</div>
            <div class="table-responsive lwo-table" aria-label="Transaction Details Table">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="lwo-col-140">Account Type</th>
                    <th class="lwo-col-140">Our Branch ID</th>
                    <th class="lwo-col-160">Account ID</th>
                    <th class="lwo-col-200">Name</th>
                    <th class="lwo-col-240">TrxDescription</th>
                    <th class="lwo-col-140">Transaction Type</th>
                    <th class="text-end lwo-col-140">Amount</th>
                    <th class="text-end lwo-col-140">Local Amount</th>
                  </tr>
                </thead>
                <tbody data-trx-rows></tbody>
              </table>
              <div class="p-3 text-muted" data-trx-empty>No records to display.</div>
            </div>
          </section>

          <section class="lwo-panel" aria-label="Behind The Scene">
            <div class="lwo-bar">Behind The Scene</div>
            <div class="lwo-bts-grid">
              <div class="lwo-bts-col">
                <div class="lwo-row">
                  <label class="lwo-label" for="BTSLoanAmount">Loan Amount</label>
                  <div class="lwo-input"><input type="text" class="form-control" id="BTSLoanAmount" name="BTSLoanAmount" readonly /></div>
                </div>
                <div class="lwo-row">
                  <label class="lwo-label" for="BTSProductID">Product ID</label>
                  <div class="lwo-input"><input type="text" class="form-control" id="BTSProductID" name="BTSProductID" readonly /></div>
                </div>
                <div class="lwo-row">
                  <label class="lwo-label" for="BTSMaturityDate">Maturity Date</label>
                  <div class="lwo-input"><input type="text" class="form-control" id="BTSMaturityDate" name="BTSMaturityDate" readonly /></div>
                </div>
              </div>

              <div class="lwo-bts-col">
                <div class="lwo-row">
                  <label class="lwo-label" for="BTSLoanBalance">Loan Balance</label>
                  <div class="lwo-input"><input type="text" class="form-control" id="BTSLoanBalance" name="BTSLoanBalance" readonly /></div>
                </div>
                <div class="lwo-row">
                  <label class="lwo-label" for="BTSCurrencyID">Currency ID</label>
                  <div class="lwo-input"><input type="text" class="form-control" id="BTSCurrencyID" name="BTSCurrencyID" readonly /></div>
                </div>
                <div class="lwo-row">
                  <label class="lwo-label" for="BTSArrearDays">Arrear Days</label>
                  <div class="lwo-input"><input type="text" class="form-control" id="BTSArrearDays" name="BTSArrearDays" readonly /></div>
                </div>
                <div class="lwo-row">
                  <label class="lwo-label" for="BTSRiskClassification">Risk Classification</label>
                  <div class="lwo-input"><input type="text" class="form-control" id="BTSRiskClassification" name="BTSRiskClassification" readonly /></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-action="view">View</button>
          <button type="button" class="cm-shell__action" data-action="add">Add</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" data-action="save">Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-action="cancel">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../../../assets/js/services/search.service.js"></script>
  <script src="../../../assets/js/pages/loans/loan-write-off/loan-write-off-service.js"></script>
  <script src="../../../assets/js/pages/loans/loan-write-off/loan-write-off.js"></script>
</body>

</html>
