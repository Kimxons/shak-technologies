<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Repayment Reversal · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
</head>

<body class="loan-maintenance-sub copilot-theme" data-page="loan-maintenance-sub">
  <main class="lm-subpage" aria-label="Loan Repayment Reversal">
    <section class="card-surface lrr-shell" data-lrr-shell aria-label="Loan Repayment Reversal">
      <div class="lrr-body">
        <section class="lrr-content" aria-label="Content">

          <section class="lrr-top" aria-label="Account Details">
            <div class="lm-section-header">Account Details</div>
            <div class="container-fluid px-2 py-2">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="BranchID">Branch ID</label>
                  <input type="text" class="form-control form-control-sm" id="BranchID" name="BranchID" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="BranchName">Branch Name</label>
                  <input type="text" class="form-control form-control-sm" id="BranchName" name="BranchName" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ClientID">Client ID</label>
                  <input type="text" class="form-control form-control-sm" id="ClientID" name="ClientID" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ClientName">Client Name</label>
                  <input type="text" class="form-control form-control-sm" id="ClientName" name="ClientName" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="AccountID">Account ID</label>
                  <input type="text" class="form-control form-control-sm" id="AccountID" name="AccountID" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="AccountName">Account Name</label>
                  <input type="text" class="form-control form-control-sm" id="AccountName" name="AccountName" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label fw-bold text-primary" for="FromDate">From Date <span class="text-danger">*</span></label>
                  <input type="date" class="form-control form-control-sm" id="FromDate" name="FromDate" />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label fw-bold text-primary" for="ToDate">To Date <span class="text-danger">*</span></label>
                  <input type="date" class="form-control form-control-sm" id="ToDate" name="ToDate" />
                </div>
              </div>
            </div>
          </section>

          <section class="lrr-grid" aria-label="Receipt Details">
            <div class="lm-section-header">Receipt Details</div>
            <div class="table-responsive" style="max-height: 350px; overflow-y: auto;">
              <table class="table table-sm table-hover table-bordered align-middle mb-0">
                <thead class="table-light sticky-top">
                  <tr>
                    <th style="width: 50px;" class="text-center">
                      <input type="checkbox" id="selectAll" aria-label="Select all transactions" />
                    </th>
                    <th class="text-end" style="min-width: 120px;">Transaction Amount</th>
                    <th style="min-width: 110px;">Value Date</th>
                    <th style="min-width: 110px;">Trx Date</th>
                    <th style="min-width: 200px;">Description</th>
                    <th style="min-width: 130px;">TrxBatchID</th>
                  </tr>
                </thead>
                <tbody data-lrr-rows>
                  <tr>
                    <td colspan="6" class="py-3 px-2 text-muted text-center">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="lrr-bts" aria-label="Behind The Scene">
            <div class="lm-section-header">Behind The Scene</div>
            <div class="container-fluid px-2 py-2">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="CurrencyID">Currency ID</label>
                  <input type="text" class="form-control form-control-sm" id="CurrencyID" name="CurrencyID" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ProductID">Product ID</label>
                  <input type="text" class="form-control form-control-sm" id="ProductID" name="ProductID" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="SystemDate">System Date</label>
                  <input type="text" class="form-control form-control-sm" id="SystemDate" name="SystemDate" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="DayStatus">Day Status</label>
                  <input type="text" class="form-control form-control-sm" id="DayStatus" name="DayStatus" readonly />
                </div>
              </div>
            </div>
          </section>

          <div class="lrr-footer" aria-label="Footer">BR.Net Web Banking</div>
        </section>

        <aside class="lrr-actions" aria-label="Actions">
          <div class="lrr-actions__stack">
            <button type="button" class="lrr-action-btn lrr-action-btn--primary" data-action="view">View</button>
            <button type="button" class="lrr-action-btn" data-action="reverse" disabled>Reverse</button>
            <button type="button" class="lrr-action-btn" data-action="cancel">Cancel</button>
            <button type="button" class="lrr-action-btn" data-action="back">Back</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../../../assets/js/environment.js"></script>
  <script src="../../../../../assets/js/config.js"></script>
  <script src="../../../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../../../assets/js/app.js"></script>
  <script src="../../../../../assets/js/services/search.service.js"></script>
  <script src="../../../../../assets/js/services/loans/loanRepaymentReversalService.js"></script>
  <script src="../../../../../assets/js/pages/loans/loan-maintenance/dataentry/loan-repayment-reversal.js"></script>
</body>

</html>
