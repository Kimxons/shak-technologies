<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Utilization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../../assets/css/styles.css">
    <link rel="stylesheet" href="loan-utilization-modal.css">
</head>
<body>
    <div class="loan-utilization-container">
        <div class="modal-topbar">
            <div class="topbar-title">
                <i class="bi bi-pie-chart-fill"></i>
                <span>Loan Utilization</span>
            </div>
            <div class="topbar-actions">
                <button class="topbar-btn" id="btnResize" title="Toggle width"><i class="bi bi-arrows-fullscreen"></i></button>
                <button class="topbar-btn" id="btnClose" title="Close"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <div class="modal-body-flex">
            <div class="loan-utilization-content">
                <div class="content-scroll">
                <!-- Main Form -->
                <div class="form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Branch ID</label>
                            <div class="input-display-group">
                                <input type="text" id="branchId" class="form-input-segment-id" value="0101" readonly title="Branch ID">
                                <span class="segment-divider"></span>
                                <input type="text" id="branchName" class="form-input-segment-name" value="Head Office" readonly title="Branch Name">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Client ID</label>
                            <input type="text" id="clientId" class="form-input" readonly title="Client ID">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Application ID</label>
                            <input type="text" id="applicationId" class="form-input" readonly title="Application ID">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Group ID</label>
                            <input type="text" id="groupId" class="form-input" readonly title="Group ID">
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">SLNO</label>
                            <input type="text" id="slno" class="form-input" readonly title="Serial Number">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Date</label>
                            <select id="utilizationDate" class="form-input" title="Utilization Date">
                                <option value="">--Select--</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Utilization Type</label>
                            <select id="utilizationType" class="form-input" title="Utilization Type">
                                <option value="">--Select--</option>
                                <option value="stock">Stock</option>
                                <option value="cash">Cash</option>
                                <option value="equipment">Equipment</option>
                                <option value="inventory">Inventory</option>
                                <option value="raw-materials">Raw Materials</option>
                                <option value="working-capital">Working Capital</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Utilization Amount</label>
                            <input type="number" id="utilizationAmount" class="form-input" placeholder="0.00" step="0.01">
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-textarea" rows="3" placeholder="Enter description"></textarea>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button class="btn-action btn-new" onclick="addNew()">
                            <i class="bi bi-plus-circle"></i> New
                        </button>
                        <button class="btn-action btn-alter" onclick="alter()">
                            <i class="bi bi-arrow-repeat"></i> Alter
                        </button>
                        <button class="btn-action btn-remove" onclick="remove()">
                            <i class="bi bi-dash-circle"></i> Remove
                        </button>
                        <button class="btn-action btn-update" onclick="update()">
                            <i class="bi bi-arrow-up-circle"></i> Update
                        </button>
                        <button class="btn-action btn-clear" onclick="clearForm()">
                            <i class="bi bi-x-circle"></i> Clear
                        </button>
                    </div>
                </div>

                <!-- Behind The Scene -->
                <div class="scene-section">
                    <div class="scene-header">Behind The Scene</div>
                    <div class="scene-grid">
                        <div class="form-group">
                            <label class="form-label">Created By</label>
                            <input type="text" id="createdBy" class="form-input" readonly title="Created By">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Modified By</label>
                            <input type="text" id="modifiedBy" class="form-input" readonly title="Modified By">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Created On</label>
                            <input type="text" id="createdOn" class="form-input" readonly title="Created On">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Modified On</label>
                            <input type="text" id="modifiedOn" class="form-input" readonly title="Modified On">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Action Sidebar -->
        <div class="action-sidebar">
            <button class="btn-sidebar btn-primary" onclick="view()">
                <i class="bi bi-eye"></i> View
            </button>
            <button class="btn-sidebar btn-success" onclick="add()">
                <i class="bi bi-plus-circle"></i> Add
            </button>
            <button class="btn-sidebar btn-warning" onclick="edit()">
                <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn-sidebar btn-danger" onclick="deleteRecord()">
                <i class="bi bi-trash"></i> Delete
            </button>
            <button class="btn-sidebar btn-success" onclick="save()">
                <i class="bi bi-check-circle"></i> Save
            </button>
            <button class="btn-sidebar btn-secondary" onclick="cancel()">
                <i class="bi bi-x-circle"></i> Cancel
            </button>
            <button class="btn-sidebar btn-info" onclick="back()">
                <i class="bi bi-arrow-left-circle"></i> Back
            </button>
        </div>
        </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="loan-utilization-modal.js"></script>
</body>
</html>
