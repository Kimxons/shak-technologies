<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Defined Fields · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
</head>

<body class="loan-maintenance-sub copilot-theme" data-page="loan-maintenance-sub">
  <main class="lm-subpage" aria-label="User Defined Fields">
    <section class="card-surface ludf-shell" data-ludf-root aria-label="User Defined Fields">
      <div class="ludf-body">
        <section class="ludf-content" aria-label="Content">
          <div class="ludf-title" aria-label="Branch">0101 ::</div>
          <div class="ludf-topbar" aria-hidden="true"></div>

          <section class="ludf-panel" aria-label="User Defined Fields Area">
            <!-- Intentionally empty: legacy screen shows fields only when configured. -->
          </section>

          <div class="ludf-status" role="status" aria-live="polite" data-ludf-status>
            User Fields Not Defined [No:216006]
          </div>

          <div class="ludf-footer" aria-label="Footer">BR.Net Web Banking</div>
        </section>

        <aside class="ludf-actions" aria-label="Actions">
          <div class="ludf-actions__stack">
            <button type="button" class="ludf-action-btn" data-action="edit">Edit</button>
            <button type="button" class="ludf-action-btn" data-action="save" disabled>Save</button>
            <button type="button" class="ludf-action-btn" data-action="cancel">Cancel</button>
          </div>

          <div class="ludf-actions__spacer" aria-hidden="true"></div>

          <div class="ludf-actions__stack">
            <button type="button" class="ludf-action-btn ludf-action-btn--primary" data-action="back">Back</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="../../../../assets/js/pages/loans/loan-maintenance/dataentry/user-defined-fields.js"></script>
</body>

</html>
