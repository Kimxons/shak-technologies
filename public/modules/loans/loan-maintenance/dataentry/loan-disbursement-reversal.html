<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Disbursement Reversal · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
  <style>
    .ldr-shell input.form-control,
    .ldr-shell textarea.form-control,
    .ldr-shell select.form-select,
    .ldr-shell .table td {
      font-weight: 600;
    }

    .ldr-shell .form-control:disabled,
    .ldr-shell .form-control[readonly] {
      background-color: #e9ecef;
      opacity: 1;
    }
  </style>
</head>

<body class="loan-maintenance-sub copilot-theme" data-page="loan-maintenance-sub">
  <main class="lm-subpage" aria-label="Loan Disbursement Reversal">
    <section class="card-surface ldr-shell" data-ldr-shell aria-label="Loan Disbursement Reversal">
      <div class="ldr-body">
        <section class="ldr-content" aria-label="Content">

          <!-- Account Details Section -->
          <section class="ldr-top" aria-label="Account Details">
            <div class="lm-section-header">Account Details</div>
            <div class="container-fluid px-2 py-2">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label fw-bold text-primary" for="BranchID">Branch ID <span class="text-danger">*</span></label>
                  <div class="input-group input-group-sm">
                    <input type="text" class="form-control form-control-sm" id="BranchID" name="BranchID" maxlength="6" />
                    <button class="btn btn-outline-secondary" type="button" id="btnBranchSearch" title="Search Branch (F2)">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col-md-4 col-6">
                  <label class="cbs-label" for="BranchName">Branch Name</label>
                  <input type="text" class="form-control form-control-sm" id="BranchName" name="BranchName" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ClientID">Client ID</label>
                  <div class="input-group input-group-sm">
                    <input type="text" class="form-control form-control-sm" id="ClientID" name="ClientID" maxlength="20" />
                    <button class="btn btn-outline-secondary" type="button" id="btnClientSearch" title="Search Client (F2)">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col-md-4 col-6">
                  <label class="cbs-label" for="ClientName">Client Name</label>
                  <input type="text" class="form-control form-control-sm" id="ClientName" name="ClientName" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label fw-bold text-primary" for="AccountID">Account ID <span class="text-danger">*</span></label>
                  <div class="input-group input-group-sm">
                    <input type="text" class="form-control form-control-sm" id="AccountID" name="AccountID" maxlength="20" />
                    <button class="btn btn-outline-secondary" type="button" id="btnAccountSearch" title="Search Account (F2)">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col-md-4 col-6">
                  <label class="cbs-label" for="AccountName">Account Name</label>
                  <input type="text" class="form-control form-control-sm" id="AccountName" name="AccountName" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LoanSeries">Loan Series</label>
                  <input type="text" class="form-control form-control-sm" id="LoanSeries" name="LoanSeries" readonly />
                </div>
              </div>
            </div>
          </section>

          <!-- Reversal Details Section -->
          <section class="ldr-middle" aria-label="Reversal Details">
            <div class="lm-section-header">Reversal Details</div>
            <div class="container-fluid px-2 py-2">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label fw-bold text-primary" for="ReasonID">Reason <span class="text-danger">*</span></label>
                  <select class="form-select form-select-sm" id="ReasonID" name="ReasonID" disabled>
                    <option value="">Select Reason</option>
                  </select>
                </div>
                <div class="col-md-6 col-12">
                  <label class="cbs-label fw-bold text-primary" for="Remarks">Remarks <span class="text-danger">*</span></label>
                  <textarea class="form-control form-control-sm" id="Remarks" name="Remarks" rows="2" maxlength="255" disabled></textarea>
                </div>
              </div>
            </div>
          </section>

          <!-- Behind The Scene Section -->
          <section class="ldr-bts" aria-label="Behind The Scene">
            <div class="lm-section-header">Behind The Scene</div>
            <div class="container-fluid px-2 py-2">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LoanAmount">Loan Amount</label>
                  <input type="text" class="form-control form-control-sm text-end" id="LoanAmount" name="LoanAmount" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LoanBalance">Loan Balance</label>
                  <input type="text" class="form-control form-control-sm text-end" id="LoanBalance" name="LoanBalance" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ProductID">Product ID</label>
                  <input type="text" class="form-control form-control-sm" id="ProductID" name="ProductID" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="CurrencyID">Currency ID</label>
                  <input type="text" class="form-control form-control-sm" id="CurrencyID" name="CurrencyID" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="MaturityDate">Maturity Date</label>
                  <input type="text" class="form-control form-control-sm" id="MaturityDate" name="MaturityDate" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LoanStatus">Loan Status</label>
                  <input type="text" class="form-control form-control-sm" id="LoanStatus" name="LoanStatus" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="DisbursedBy">Disbursed By</label>
                  <input type="text" class="form-control form-control-sm" id="DisbursedBy" name="DisbursedBy" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LastDisbursementDate">Last Disbursement Date</label>
                  <input type="text" class="form-control form-control-sm" id="LastDisbursementDate" name="LastDisbursementDate" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ReversalType">Reversal Type</label>
                  <input type="text" class="form-control form-control-sm" id="ReversalType" name="ReversalType" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LoanType">Loan Type</label>
                  <input type="text" class="form-control form-control-sm" id="LoanType" name="LoanType" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ApplicationID">Application ID</label>
                  <input type="text" class="form-control form-control-sm" id="ApplicationID" name="ApplicationID" readonly />
                </div>
              </div>
            </div>
          </section>

          <div class="ldr-footer" aria-label="Footer">BR.Net Web Banking</div>
        </section>

        <aside class="ldr-actions" aria-label="Actions">
          <div class="ldr-actions__stack">
            <button type="button" class="ldr-action-btn ldr-action-btn--primary" data-action="view">View</button>
            <button type="button" class="ldr-action-btn" data-action="edit" disabled>Edit</button>
            <button type="button" class="ldr-action-btn" data-action="save" disabled>Save</button>
            <button type="button" class="ldr-action-btn" data-action="cancel" disabled>Cancel</button>
            <button type="button" class="ldr-action-btn" data-action="back">Back</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <!-- Message Display -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto" id="toastTitle">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toastBody"></div>
    </div>
  </div>

  <!-- Search Modal -->
  <div id="searchModal"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../../assets/js/environment.js"></script>
  <script src="../../../../assets/js/config.js"></script>
  <script src="../../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../../assets/js/app.js"></script>
  <script src="../../../../assets/js/components/searchModal.js"></script>
  <script src="../../../../assets/js/services/loans/loanDisbursementReversalService.js"></script>
  <script src="../../../../assets/js/pages/loans/loan-maintenance/dataentry/loan-disbursement-reversal.js"></script>
</body>

</html>
