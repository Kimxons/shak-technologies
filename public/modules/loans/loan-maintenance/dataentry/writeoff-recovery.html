<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Writeoff Recovery · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
</head>

<body class="loan-maintenance-sub copilot-theme" data-page="loan-maintenance-sub">
  <main class="lm-subpage" aria-label="Writeoff Recovery">
    <section class="card-surface lwrc-shell" data-lwrc-root aria-label="Writeoff Recovery">
      <div class="lwrc-body">
        <section class="lwrc-content" aria-label="Content">
          <section class="lwrc-top" aria-label="Writeoff Summary">
            <div class="lwrc-top__bar" aria-hidden="true"></div>

            <div class="container-fluid px-0">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="AccountID">Account ID</label>
                  <input class="form-control" id="AccountID" name="AccountID" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="AccountName">Account Name</label>
                  <input class="form-control" id="AccountName" name="AccountName" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LoanSeries">Loan Series</label>
                  <input class="form-control" id="LoanSeries" name="LoanSeries" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="Currency">Currency</label>
                  <input class="form-control" id="Currency" name="Currency" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="DisbursedAmount">Disbursed Amount</label>
                  <input class="form-control" id="DisbursedAmount" name="DisbursedAmount" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="WriteOffDate">Write Off Date</label>
                  <input class="form-control" id="WriteOffDate" name="WriteOffDate" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="WriteOffBalance">Write Off Balance</label>
                  <input class="form-control" id="WriteOffBalance" name="WriteOffBalance" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="WriteOffAmount">Write Off Amount</label>
                  <input class="form-control" id="WriteOffAmount" name="WriteOffAmount" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="RecoveredAmount">Recovered Amount</label>
                  <input class="form-control" id="RecoveredAmount" name="RecoveredAmount" type="text" readonly />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LastRecoveryDate">Last Recovery Date</label>
                  <input class="form-control" id="LastRecoveryDate" name="LastRecoveryDate" type="text" readonly />
                </div>
              </div>
            </div>
          </section>

          <section class="lwrc-panel" aria-label="Recovery Transaction">
            <div class="lm-section-header">Recovery Transaction</div>

            <div class="container-fluid px-0">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="Transaction">Transaction Type</label>
                  <select class="form-select" id="Transaction" name="Transaction" title="Transaction Type" disabled>
                    <option value="">--Select--</option>
                  </select>
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="TrxAccountID">Recovery Account</label>
                  <div class="input-group input-group-sm">
                    <input class="form-control" id="TrxAccountID" name="TrxAccountID" type="text" title="Recovery Account" disabled />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup account" title="Lookup recovery account" data-lookup="trx-account" disabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="TrxAccountName">Account Name</label>
                  <input class="form-control" id="TrxAccountName" name="TrxAccountName" type="text" title="Account Name" disabled />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="RecoveryGL">Recovery GL</label>
                  <div class="input-group input-group-sm">
                    <input class="form-control" id="RecoveryGL" name="RecoveryGL" type="text" title="Recovery GL" disabled />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup GL" title="Lookup recovery GL" data-lookup="recovery-gl" disabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="RecoveryGLName">GL Name</label>
                  <input class="form-control" id="RecoveryGLName" name="RecoveryGLName" type="text" title="GL Name" disabled />
                </div>

                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="RecoveredAmountTrx">Recovered Amount</label>
                  <input class="form-control" id="RecoveredAmountTrx" name="RecoveredAmountTrx" type="text" title="Recovered Amount" disabled />
                </div>

                <div class="col-md-4 col-12">
                  <label class="cbs-label" for="Remarks">Remarks</label>
                  <input class="form-control" id="Remarks" name="Remarks" type="text" title="Remarks" disabled />
                </div>
              </div>
            </div>
          </section>

          <section class="lwrc-grid" aria-label="Recovery Transactions grid">
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0 table-bordered table-hover">
                <thead class="table-light">
                  <tr>
                    <th>Transaction Type</th>
                    <th>Recovery Account</th>
                    <th>Account Name</th>
                    <th>Recovery GL</th>
                    <th class="text-end">Recovered Amount</th>
                    <th>Remarks</th>
                    <th>Created By</th>
                    <th>Created On</th>
                  </tr>
                </thead>
                <tbody data-lwrc-rows></tbody>
              </table>
              <div class="p-3 text-muted" data-lwrc-empty>No recovery transactions to display.</div>
            </div>
          </section>

          <section class="lwrc-bts" aria-label="Behind The Scene">
            <div class="lm-section-header">Audit Trail</div>
            <div class="container-fluid px-0">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="CreatedBy">Created By</label>
                  <input class="form-control" id="CreatedBy" name="CreatedBy" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="CreatedOn">Created On</label>
                  <input class="form-control" id="CreatedOn" name="CreatedOn" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ModifiedBy">Modified By</label>
                  <input class="form-control" id="ModifiedBy" name="ModifiedBy" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ModifiedOn">Modified On</label>
                  <input class="form-control" id="ModifiedOn" name="ModifiedOn" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="SupervisedBy">Supervised By</label>
                  <input class="form-control" id="SupervisedBy" name="SupervisedBy" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="SupervisedOn">Supervised On</label>
                  <input class="form-control" id="SupervisedOn" name="SupervisedOn" type="text" readonly />
                </div>
              </div>
            </div>
          </section>

          <div class="lwrc-footer" aria-label="Footer">Nimble 1.0 Banking</div>
        </section>

        <aside class="lwrc-actions" aria-label="Actions">
          <div class="lwrc-actions__stack">
            <button type="button" class="lwrc-action-btn" data-action="add">Add</button>
            <button type="button" class="lwrc-action-btn" data-action="save" disabled>Save</button>
            <button type="button" class="lwrc-action-btn" data-action="cancel">Cancel</button>
            <button type="button" class="lwrc-action-btn lwrc-action-btn--primary" data-action="back">Back</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Core Dependencies -->
  <script src="../../../../../assets/js/environment.js"></script>
  <script src="../../../../../assets/js/config.js"></script>
  <script src="../../../../../assets/js/services/shared/coreApi.js"></script>
  
  <!-- Services -->
  <script src="../../../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../../../assets/js/services/shared/searchService.js"></script>
  <script src="../../../../../assets/js/shared/search-modal.js"></script>
  
  <!-- Auth -->
  <script src="../../../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../../../assets/js/app.js"></script>
  
  <!-- Page Scripts -->
  <script src="../../../../../assets/js/services/loans/writeoff-recovery-service.js"></script>
  <script src="../../../../../assets/js/pages/loans/loan-maintenance/dataentry/writeoff-recovery.js"></script>
</body>

</html>
