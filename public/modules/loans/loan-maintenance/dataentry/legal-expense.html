<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Legal Expense · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
</head>

<body class="loan-maintenance-sub copilot-theme" data-page="loan-maintenance-sub">
  <main class="lm-subpage" aria-label="Legal Expense">
    <section class="card-surface llex-shell" data-llex-root aria-label="Legal Expense">
      <div class="llex-body">
        <section class="llex-content" aria-label="Content">
          <!-- Account Information Section (Top) -->
          <section class="llex-top" aria-label="Account Information">
            <div class="llex-top__bar" aria-hidden="true"></div>
            
            <div class="container-fluid px-0">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="BranchID">Branch ID</label>
                  <input class="form-control" id="BranchID" name="BranchID" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="BranchName">Branch Name</label>
                  <input class="form-control" id="BranchName" name="BranchName" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ClientID">Client ID</label>
                  <input class="form-control" id="ClientID" name="ClientID" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ClientName">Client Name</label>
                  <input class="form-control" id="ClientName" name="ClientName" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="AccountID">Account ID</label>
                  <input class="form-control" id="AccountID" name="AccountID" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="AccountName">Account Name</label>
                  <input class="form-control" id="AccountName" name="AccountName" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LoanSeries">Loan Series</label>
                  <input class="form-control" id="LoanSeries" name="LoanSeries" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="TotalLegalExpense">Total Legal Expense</label>
                  <input class="form-control" id="TotalLegalExpense" name="TotalLegalExpense" type="text" value="0.00" readonly />
                </div>
              </div>
            </div>
          </section>

          <!-- Transaction Entry Section -->
          <section class="llex-box" aria-label="Transaction Entry">
            <div class="lm-section-header">Transaction Entry</div>
            <div class="container-fluid px-0">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label cbs-label--required" for="TransferType">Transfer Type</label>
                  <select class="form-select" id="TransferType" name="TransferType" disabled>
                    <option value="">--Select--</option>
                    <option value="T">Transfer</option>
                    <option value="C">Cash</option>
                  </select>
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="Till">Till</label>
                  <input class="form-control" id="Till" name="Till" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label cbs-label--required" for="TransactionType">Transaction Type</label>
                  <select class="form-select" id="TransactionType" name="TransactionType" disabled>
                    <option value="">--Select--</option>
                    <option value="DR">Debit</option>
                    <option value="CR">Credit</option>
                  </select>
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label cbs-label--required" for="AccountType">Account Type</label>
                  <select class="form-select" id="AccountType" name="AccountType" disabled>
                    <option value="">--Select--</option>
                    <option value="G">GL</option>
                    <option value="C">CASA</option>
                  </select>
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label cbs-label--conditional" for="ContraBranchID">Contra Branch</label>
                  <div class="input-group input-group-sm">
                    <input class="form-control" id="ContraBranchID" name="ContraBranchID" type="text" disabled />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup contra branch" title="Lookup contra branch" data-lookup="contra-branch" disabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ContraBranchName">Contra Branch Name</label>
                  <input class="form-control" id="ContraBranchName" name="ContraBranchName" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label cbs-label--conditional" for="ContraAccountID">Contra Account</label>
                  <div class="input-group input-group-sm">
                    <input class="form-control" id="ContraAccountID" name="ContraAccountID" type="text" disabled />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup contra account" title="Lookup contra account" data-lookup="contra-account" disabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ContraAccountName">Contra Account Name</label>
                  <input class="form-control" id="ContraAccountName" name="ContraAccountName" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label cbs-label--required" for="FixedAmount">Amount <span class="text-danger">*</span></label>
                  <input class="form-control" id="FixedAmount" name="FixedAmount" type="text" value="0.00" disabled />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label cbs-label--conditional" for="ExchangeRate">Exchange Rate</label>
                  <input class="form-control" id="ExchangeRate" name="ExchangeRate" type="text" value="1.0000" disabled />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="LocalAmount">Local Amount</label>
                  <input class="form-control" id="LocalAmount" name="LocalAmount" type="text" value="0.00" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ReferenceNo">Reference No.</label>
                  <input class="form-control" id="ReferenceNo" name="ReferenceNo" type="text" maxlength="15" disabled />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ForexGainLoss">Forex Gain / Loss</label>
                  <input class="form-control" id="ForexGainLoss" name="ForexGainLoss" type="text" value="0.00" readonly />
                </div>
                <div class="col-md-4 col-12">
                  <label class="cbs-label cbs-label--required" for="Narration">Narration</label>
                  <input class="form-control" id="Narration" name="Narration" type="text" maxlength="100" disabled />
                </div>
              </div>
            </div>
            
            <!-- Action Buttons (Legacy Style) -->
            <div class="llex-form-buttons">
              <button type="button" class="llex-action-btn" data-action="new" title="New">New</button>
              <button type="button" class="llex-action-btn" data-action="alter" disabled title="Alter">Alter</button>
              <button type="button" class="llex-action-btn llex-action-btn--danger" data-action="remove" disabled title="Remove">Remove</button>
              <button type="button" class="llex-action-btn llex-action-btn--primary" data-action="update" disabled title="Update">Update</button>
              <button type="button" class="llex-action-btn" data-action="clear" disabled title="Clear">Clear</button>
            </div>
          </section>

          <!-- Transactions Grid -->
          <section class="llex-grid" aria-label="Transactions">
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0 table-bordered table-hover">
                <thead class="table-light">
                  <tr>
                    <th>Contra Branch</th>
                    <th>Transaction Type</th>
                    <th>Account Type</th>
                    <th>Contra Account</th>
                    <th class="text-end">Amount</th>
                    <th class="text-end">Local Amount</th>
                    <th class="text-end">Exchange Rate</th>
                    <th>Reference No</th>
                    <th>Narration</th>
                  </tr>
                </thead>
                <tbody data-llex-rows></tbody>
              </table>
              <div class="p-3 text-center text-muted" data-llex-empty style="display: none;">
                <i class="bi bi-inbox fs-3"></i>
                <p class="mb-0">No transactions to display.</p>
              </div>
            </div>
          </section>

          <!-- Behind The Scene Section -->
          <section class="llex-bts" aria-label="Behind The Scene">
            <div class="lm-section-header">Behind The Scene</div>
            <div class="container-fluid">
              <div class="row g-2">
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="CurrencyID">Currency ID</label>
                  <input class="form-control" id="CurrencyID" name="CurrencyID" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="ProductID">Product ID</label>
                  <input class="form-control" id="ProductID" name="ProductID" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="SystemDate">System Date</label>
                  <input class="form-control" id="SystemDate" name="SystemDate" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="DayStatus">Day Status</label>
                  <input class="form-control" id="DayStatus" name="DayStatus" type="text" readonly />
                </div>
                <div class="col-md-2 col-6">
                  <label class="cbs-label" for="UnpostedAmount">Unposted Amount</label>
                  <input class="form-control" id="UnpostedAmount" name="UnpostedAmount" type="text" value="0.00" readonly />
                </div>
              </div>
            </div>
          </section>

          <!-- Footer -->
          <div class="llex-footer" aria-label="Footer">Nimble 1.0 Banking</div>
        </section>

        <!-- Right Side Buttons (Legacy Style) -->
        <aside class="llex-actions" aria-label="Actions">
          <div class="llex-actions__stack">
            <button type="button" class="llex-action-btn" data-action="view" title="View">View</button>
            <button type="button" class="llex-action-btn" data-action="denomination" title="Denomination">Denomination</button>
            <button type="button" class="llex-action-btn llex-action-btn--primary" data-action="add" disabled title="Add">Add</button>
            <button type="button" class="llex-action-btn" data-action="edit" disabled title="Edit">Edit</button>
            <button type="button" class="llex-action-btn" data-action="save" disabled title="Save">Save</button>
            <button type="button" class="llex-action-btn" data-action="cancel" title="Cancel">Cancel</button>
            <button type="button" class="llex-action-btn" data-action="back" title="Back">Back</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../../assets/js/environment.js"></script>
  <script src="../../../../assets/js/config.js"></script>
  <script src="../../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../../assets/js/services/shared/searchService.js"></script>
  <script src="../../../../assets/js/shared/search-modal.js"></script>
  <script src="../../../../assets/js/app.js"></script>
  <script src="../../../../assets/js/services/loans/legalExpenseService.js"></script>
  <script src="../../../../assets/js/pages/loans/loan-maintenance/dataentry/legal-expense.js"></script>
</body>

</html>
