<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guarantor · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
</head>

<body class="loan-maintenance-sub copilot-theme" data-page="loan-maintenance-sub">
  <main class="lm-subpage" aria-label="Loan Guarantor">
    <section class="card-surface lmg-shell" data-lg-root aria-label="Loan Guarantor">
      <div class="lmg-body">
        <section class="lmg-content" aria-label="Guarantor Details">
          <section class="lmg-panel" aria-label="Guarantor Details">
            <div class="lm-section-header">Guarantor Details</div>
            <div class="p-2">
              <div class="cbs-grid cbs-grid--two" role="form" aria-label="Guarantor form">
                <div class="cbs-field">
                  <label class="cbs-label" for="GuarantorType">Guarantor Type</label>
                  <select class="form-select form-select-sm" id="GuarantorType" name="GuarantorType">
                    <option value="">--Select--</option>
                  </select>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="GuarantorID">Guarantor ID</label>
                  <div class="input-group input-group-sm">
                    <input class="form-control" id="GuarantorID" name="GuarantorID" type="text" />
                    <button class="btn btn-outline-primary" type="button" aria-label="Lookup guarantor" data-lookup="guarantor">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="InstitutionID">Institution/Client ID</label>
                  <div class="input-group input-group-sm">
                    <input class="form-control" id="InstitutionID" name="InstitutionID" type="text" aria-label="Institution ID" />
                    <input class="form-control" id="ClientID" name="ClientID" type="text" aria-label="Client ID" />
                  </div>
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="GuaranteeAmount">Guarantee Amount</label>
                  <input class="form-control form-control-sm" id="GuaranteeAmount" name="GuaranteeAmount" type="text" />
                </div>

                <div class="cbs-field">
                  <label class="cbs-label" for="Remarks">Remarks</label>
                  <textarea class="form-control form-control-sm" id="Remarks" name="Remarks" rows="2"></textarea>
                </div>
              </div>
            </div>
          </section>

          <!-- Scrollable Content Area -->
          <div class="lmg-content-scroll">
            <section class="lmg-grid" aria-label="Guarantors grid">
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0 table-bordered table-hover">
                <thead class="table-light">
                  <tr>
                    <th>Guarantor ID</th>
                    <th>Guarantor Name</th>
                    <th class="text-end">Guarantee Amount</th>
                  </tr>
                </thead>
                <tbody data-lg-rows></tbody>
              </table>
              <div class="p-3 text-muted" data-lg-empty>No records to display.</div>
            </div>
          </section>

          <section class="lmg-bts" aria-label="Behind The Scene">
            <div class="lm-section-header">Behind The Scene</div>
            <div class="p-2">
              <!-- Guarantor Details Row -->
              <div class="cbs-grid cbs-grid--three">
                <div class="cbs-field">
                  <label class="cbs-label" for="AlreadyGuaranteedAmount">Guarantee Amount</label>
                  <input class="form-control form-control-sm" id="AlreadyGuaranteedAmount" name="AlreadyGuaranteedAmount" type="text" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="NoOfLoansAlreadyGuaranteed">No. Of Loans Already Guaranteed</label>
                  <input class="form-control form-control-sm" id="NoOfLoansAlreadyGuaranteed" name="NoOfLoansAlreadyGuaranteed" type="text" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="NetWorth">Net Worth</label>
                  <input class="form-control form-control-sm" id="NetWorth" name="NetWorth" type="text" readonly />
                </div>
              </div>

              <!-- Constraints Row -->
              <div class="cbs-grid cbs-grid--three">
                <div class="cbs-field">
                  <label class="cbs-label" for="GuaranteeSignedBy">Signed By</label>
                  <input class="form-control form-control-sm" id="GuaranteeSignedBy" name="GuaranteeSignedBy" type="text" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="MaxGuaranteeAmount">Max. Guarantee Amount</label>
                  <input class="form-control form-control-sm" id="MaxGuaranteeAmount" name="MaxGuaranteeAmount" type="text" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="MaxNoOfLoans">Max. No. Of Loans</label>
                  <input class="form-control form-control-sm" id="MaxNoOfLoans" name="MaxNoOfLoans" type="text" readonly />
                </div>
              </div>

              <!-- Liability Row -->
              <div class="cbs-grid cbs-grid--one">
                <div class="cbs-field">
                  <label class="cbs-label" for="Liability">Liability</label>
                  <input class="form-control form-control-sm" id="Liability" name="Liability" type="text" readonly />
                </div>
              </div>

              <div class="lmg-audit-sep" aria-hidden="true"></div>

              <!-- Audit Trail -->
              <div class="cbs-grid cbs-grid--three">
                <div class="cbs-field"><label class="cbs-label" for="CreatedBy">Created By</label><input class="form-control form-control-sm" id="CreatedBy" name="CreatedBy" type="text" readonly /></div>
                <div class="cbs-field"><label class="cbs-label" for="ModifiedBy">Modified By</label><input class="form-control form-control-sm" id="ModifiedBy" name="ModifiedBy" type="text" readonly /></div>
                <div class="cbs-field"><label class="cbs-label" for="SupervisedBy">Supervised By</label><input class="form-control form-control-sm" id="SupervisedBy" name="SupervisedBy" type="text" readonly /></div>
                <div class="cbs-field"><label class="cbs-label" for="CreatedOn">Created On</label><input class="form-control form-control-sm" id="CreatedOn" name="CreatedOn" type="text" readonly /></div>
                <div class="cbs-field"><label class="cbs-label" for="ModifiedOn">Modified On</label><input class="form-control form-control-sm" id="ModifiedOn" name="ModifiedOn" type="text" readonly /></div>
                <div class="cbs-field"><label class="cbs-label" for="SupervisedOn">Supervised On</label><input class="form-control form-control-sm" id="SupervisedOn" name="SupervisedOn" type="text" readonly /></div>
              </div>
            </div>
          </section>
          </div>

          <div class="lmg-status" data-lmg-status>Please Enter Valid Guarantor ID [No:403005]</div>
          <div class="lmg-footer" aria-label="Footer">BR.Net Web Banking</div>
        </section>

        <aside class="lmg-actions" aria-label="Actions">
          <div class="lmg-actions__stack">
            <button type="button" class="lmg-action-btn lmg-action-btn--primary" data-action="view">View</button>
            <button type="button" class="lmg-action-btn" data-action="add">Add</button>
            <button type="button" class="lmg-action-btn" data-action="edit" disabled>Edit</button>
            <button type="button" class="lmg-action-btn" data-action="save" disabled>Save</button>
            <button type="button" class="lmg-action-btn" data-action="cancel" disabled>Cancel</button>
            <button type="button" class="lmg-action-btn" data-action="back">Back</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Core Dependencies -->
  <script src="../../../../assets/js/environment.js"></script>
  <script src="../../../../assets/js/config.js"></script>
  <script src="../../../../assets/js/services/shared/coreApi.js"></script>
  
  <!-- Services -->
  <script src="../../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../../assets/js/services/shared/searchService.js"></script>
  <script src="../../../../assets/js/shared/search-modal.js"></script>
  
  <!-- Auth -->
  <script src="../../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../../assets/js/app.js"></script>
  
  <!-- Loan Services -->
  <script src="../../../../assets/js/services/loans/loan-guarantor-service.js"></script>
  
  <!-- Page Scripts -->
  <script src="../../../../assets/js/pages/loans/loan-maintenance/dataentry/loan-guarantor.js"></script>
</body>

</html>
