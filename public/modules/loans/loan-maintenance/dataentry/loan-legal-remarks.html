<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Legal Remarks · Data Entry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css" />
</head>

<body class="loan-maintenance-sub copilot-theme" data-page="loan-maintenance-sub">
  <main class="lm-subpage" aria-label="Loan Legal Remarks">
    <section class="card-surface llrm-shell" aria-label="Loan Legal Remarks" data-llrm-root>
      <div class="llrm-body">
        <section class="llrm-content" aria-label="Legal Remarks Content">
          <section class="llrm-top" aria-label="Legal Remarks Entry">
            <div class="llrm-top__bar" aria-hidden="true"></div>

            <div class="llrm-form">
              <div class="llrm-row">
                <label class="llrm-label" for="LegalReviewDate">Legal Review Date <span class="text-danger">*</span></label>
                <div class="input-group input-group-sm llrm-date">
                  <input class="form-control form-control-sm" id="LegalReviewDate" name="LegalReviewDate" type="date" title="Legal Review Date" required />
                  <button class="btn btn-outline-primary" type="button" aria-label="Set to today" title="Set to today" onclick="document.getElementById('LegalReviewDate').value = new Date().toISOString().split('T')[0]">
                    <i class="bi bi-calendar-check"></i>
                  </button>
                </div>
              </div>

              <div class="llrm-row llrm-row--remarks">
                <label class="llrm-label llrm-label--em" for="LegalRemarks">Legal Remarks <span class="text-danger">*</span></label>
                <textarea class="form-control form-control-sm" id="LegalRemarks" name="LegalRemarks" rows="2" title="Legal Remarks" required></textarea>
              </div>

              <div class="llrm-row">
                <label class="llrm-label" for="CourtName">Court Name</label>
                <input class="form-control form-control-sm" id="CourtName" name="CourtName" type="text" title="Court Name" />
              </div>

              <div class="llrm-row">
                <label class="llrm-label" for="CourtFileNumber">Court File Number</label>
                <input class="form-control form-control-sm" id="CourtFileNumber" name="CourtFileNumber" type="text" title="Court File Number" />
              </div>
            </div>
          </section>

          <section class="llrm-grid" aria-label="Legal remarks grid">
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0 llrm-table">
                <thead class="table-light">
                  <tr>
                    <th>Remark No</th>
                    <th>Remark Date</th>
                    <th>Remarks</th>
                    <th>CourtName</th>
                    <th>Court File Number</th>
                  </tr>
                </thead>
                <tbody data-llrm-rows></tbody>
              </table>
              <div class="p-3 text-muted" data-llrm-empty>No records to display.</div>
            </div>
          </section>

          <section class="llrm-bts" aria-label="Behind The Scene">
            <div class="lm-section-header">Behind The Scene</div>
            <div class="p-2">
              <div class="llrm-bts-grid">
                <div class="llrm-bts-col">
                  <div class="llrm-bts-row">
                    <label class="llrm-bts-label" for="CreatedBy">Created By</label>
                    <input class="form-control form-control-sm" id="CreatedBy" name="CreatedBy" type="text" value="" title="Created By" readonly />
                  </div>
                  <div class="llrm-bts-row">
                    <label class="llrm-bts-label" for="CreatedOn">Created On</label>
                    <input class="form-control form-control-sm" id="CreatedOn" name="CreatedOn" type="text" value="" title="Created On" readonly />
                  </div>
                </div>

                <div class="llrm-bts-col">
                  <div class="llrm-bts-row">
                    <label class="llrm-bts-label" for="ModifiedBy">Modified By</label>
                    <input class="form-control form-control-sm" id="ModifiedBy" name="ModifiedBy" type="text" value="" title="Modified By" readonly />
                  </div>
                  <div class="llrm-bts-row">
                    <label class="llrm-bts-label" for="ModifiedOn">Modified On</label>
                    <input class="form-control form-control-sm" id="ModifiedOn" name="ModifiedOn" type="text" value="" title="Modified On" readonly />
                  </div>
                </div>

                <div class="llrm-bts-col">
                  <div class="llrm-bts-row">
                    <label class="llrm-bts-label" for="SupervisedBy">Supervised By</label>
                    <input class="form-control form-control-sm" id="SupervisedBy" name="SupervisedBy" type="text" value="" title="Supervised By" readonly />
                  </div>
                  <div class="llrm-bts-row">
                    <label class="llrm-bts-label" for="SupervisedOn">Supervised On</label>
                    <input class="form-control form-control-sm" id="SupervisedOn" name="SupervisedOn" type="text" value="" title="Supervised On" readonly />
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div class="llrm-footer" aria-label="Footer">BR.Net Web Banking</div>
        </section>

        <aside class="llrm-actions" aria-label="Actions">
          <div class="llrm-actions__stack">
            <button type="button" class="llrm-action-btn llrm-action-btn--primary" data-action="add" title="Add New Legal Remark">Add</button>
            <button type="button" class="llrm-action-btn" data-action="edit" disabled title="Edit Selected Record">Edit</button>
            <button type="button" class="llrm-action-btn llrm-action-btn--success" data-action="save" disabled title="Save Changes">Save</button>
            <button type="button" class="llrm-action-btn llrm-action-btn--danger" data-action="delete" disabled title="Delete Selected Record">Delete</button>
            <button type="button" class="llrm-action-btn" data-action="cancel" disabled title="Cancel Current Operation">Cancel</button>
            <button type="button" class="llrm-action-btn" data-action="back" title="Close and Return">Back</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="../../../../assets/js/pages/loans/loan-maintenance/dataentry/loan-legal-remarks.js"></script>
  
  <style>
    /* Additional styles for improved grid display */
    .llrm-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .llrm-table thead th {
      position: sticky;
      top: 0;
      background-color: #f8f9fa;
      z-index: 10;
      border-bottom: 2px solid #dee2e6;
      padding: 8px;
      text-align: left;
      font-weight: 600;
    }
    
    .llrm-table tbody tr {
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .llrm-table tbody tr:hover {
      background-color: #f8f9fa;
    }
    
    .llrm-table tbody tr.is-selected {
      background-color: #0d6efd !important;
      color: white;
    }
    
    .llrm-table tbody td {
      padding: 6px 8px;
      border-bottom: 1px solid #dee2e6;
    }
    
    .table-responsive {
      max-height: 300px;
      overflow: auto;
    }
    
    .is-invalid {
      border-color: #dc3545 !important;
      background-color: #fff5f5 !important;
    }
    
    .text-danger {
      color: #dc3545;
    }
    
    .llrm-action-btn--success {
      background-color: #198754;
      color: white;
    }
    
    .llrm-action-btn--success:hover:not(:disabled) {
      background-color: #146c43;
    }
    
    .llrm-action-btn--danger {
      background-color: #dc3545;
      color: white;
    }
    
    .llrm-action-btn--danger:hover:not(:disabled) {
      background-color: #bb2d3b;
    }
  </style>
</body>

</html>
