<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Statement</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../../assets/css/styles.css?v=20260201" />
</head>
<body>
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-receipt am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Loan Statement</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn-secondary" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Loan Statement">
        <div class="form-card" data-main-form>
          <!-- Filters Section -->
          <div class="form-section" data-section="filters">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-funnel"></i>Filters</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Filters" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <form autocomplete="off">
                <div class="row g-3 mb-3">
                  <div class="col-4">
                    <label class="label-blue" for="StatementFor">Statement For</label>
                    <select id="StatementFor" name="StatementFor" class="bs-select form-control">
                      <option value="">--Select--</option>
                      <option value="CM">Current Month</option>
                      <option value="DR">Date Range</option>
                      <option value="LM">Current &amp; Previous Month</option>
                    </select>
                  </div>
                  <div class="col-4">
                    <label class="label-blue" for="FromDate">From Date</label>
                    <div class="input-group">
                      <input id="FromDate" name="FromDate" type="text" class="bs-input-text form-control" placeholder="dd-mmm-yyyy" autocomplete="off" />
                      <button id="fromDatePicker" type="button" class="btn btn-outline-secondary" title="Pick Date"><i class="bi bi-calendar"></i></button>
                    </div>
                  </div>
                  <div class="col-4">
                    <label class="label-blue" for="ToDate">To Date</label>
                    <div class="input-group">
                      <input id="ToDate" name="ToDate" type="text" class="bs-input-text form-control" placeholder="dd-mmm-yyyy" autocomplete="off" />
                      <button id="toDatePicker" type="button" class="btn btn-outline-secondary" title="Pick Date"><i class="bi bi-calendar"></i></button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- Statement Grid Section -->
          <div class="form-section" data-section="statement-grid">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-table"></i>Statement Grid</span>
              <span class="de-record-count lmstmt-status" id="recordCount"></span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Statement Grid" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content style="overflow-x: auto;">
              <table class="table table-sm table-hover lmstmt-table" id="statementGrid" style="margin-bottom: 0;">
                <thead class="table-light">
                  <tr>
                    <th>Trx Date</th>
                    <th>Value Date</th>
                    <th>Particulars</th>
                    <th class="text-end">Debit</th>
                    <th class="text-end">Credit</th>
                    <th class="text-end">Closing</th>
                    <th>Operator ID</th>
                    <th>Supervisor ID</th>
                    <th>Trx Row ID</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="9" class="text-center text-muted py-4">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <aside class="action-panel">
        <div class="d-flex flex-column gap-2">
          <button class="btn-action" type="button" data-action="view" title="View"><i class="bi bi-eye"></i><span>View</span></button>
          <button class="btn-action" type="button" data-action="print" title="Print"><i class="bi bi-printer"></i><span>Print</span></button>
          <button class="btn-action" type="button" data-action="refresh" title="Refresh"><i class="bi bi-arrow-clockwise"></i><span>Refresh</span></button>
          <button class="btn-action btn-cancel" type="button" data-action="close" title="Close"><i class="bi bi-x-lg"></i><span>Close</span></button>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core Dependencies -->
  <script src="../../../../assets/js/config.js"></script>
  <script src="../../../../assets/js/environment.js"></script>
  <script src="../../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../../assets/js/services/loans/loansService.js"></script>
  <script src="../../../../assets/js/services/loans/loanStatementService.js"></script>
  <script src="../../../../assets/js/pages/loans/loan-maintenance/view/loan-statement-view.js?v=20260209"></script>
  <script>
    // Window control handlers
    document.querySelectorAll('[data-action="refresh"], [data-action="maximize"], [data-action="close"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = btn.dataset.action;
        if (action === 'refresh') {
          location.reload();
        } else if (action === 'maximize') {
          const windowEl = document.querySelector('.window');
          windowEl.classList.toggle('maximized');
          window.parent.postMessage({ action: 'toggleSidebarForMaximize', isMaximized: windowEl.classList.contains('maximized') }, '*');
        } else if (action === 'close') {
          window.parent.postMessage({ action: 'submoduleClosed' }, '*');
        }
      });
    });
    // Notify parent when form opens
    window.parent.postMessage({ action: 'submoduleOpened' }, '*');
  </script>
</body>
</html>
