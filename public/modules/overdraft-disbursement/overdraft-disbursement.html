<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overdraft Disbursement</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="overdraft-disbursement.css">
</head>
<body>
    <div class="module-shell">
        <div class="module-layout">
            <aside class="sidebar" aria-label="Section navigation">
                <div class="sidebar-title">Overdraft Disbursement</div>
                <div class="nav-section">
                    <button type="button" class="nav-toggle" data-current-section="disbursement">
                        <i class="bi bi-cash-coin" aria-hidden="true"></i>
                        <span class="nav-toggle-label">Disbursement</span>
                        <i class="bi bi-chevron-down nav-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="nav-items">
                        <button type="button" class="nav-item active" data-section="disbursement">
                            <i class="bi bi-cash-coin" aria-hidden="true"></i>
                            <span>Disbursement Entry</span>
                        </button>
                        <button type="button" class="nav-item" data-section="details">
                            <i class="bi bi-clipboard-data" aria-hidden="true"></i>
                            <span>Application Details</span>
                        </button>
                        <button type="button" class="nav-item" data-section="client">
                            <i class="bi bi-person-lines-fill" aria-hidden="true"></i>
                            <span>Client Details</span>
                        </button>
                        <button type="button" class="nav-item" data-section="audit">
                            <i class="bi bi-info-circle" aria-hidden="true"></i>
                            <span>Behind The Scene</span>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="content" role="main">
                <div id="statusMessage" class="status hidden" role="status" aria-live="polite">
                    <i class="bi" aria-hidden="true"></i>
                    <span class="status-text"></span>
                </div>

                    <!-- Disbursement Section -->
                    <div class="form-section" data-section="disbursement">
                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-cash-coin" aria-hidden="true"></i>
                                <span>Disbursement Entry</span>
                            </div>
                            <div class="card-body form-grid two-col">
                                <div class="form-control-group">
                                    <label for="branchId" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>Branch ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="branchId" name="branchId" class="form-control segment-id" placeholder="2305" value="2305" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="branchName" name="branchName" class="form-control segment-desc" placeholder="Branch name" value="Legehar" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search" aria-label="Search branch">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-control-group">
                                    <label for="accountId" class="form-label"><i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>Account ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="accountId" name="accountId" class="form-control segment-id" placeholder="Enter account ID" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="accountDescription" name="accountDescription" class="form-control segment-desc" placeholder="Account name" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search" aria-label="Search account">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-control-group">
                                    <label for="applicationId" class="form-label"><i class="bi bi-card-heading" aria-hidden="true"></i><span>Application ID</span></label>
                                    <input type="text" id="applicationId" name="applicationId" class="form-control" placeholder="Enter application ID" data-required="true">
                                </div>
                            </div>
                        </section>
                    </div>

                    <!-- Application Details Section -->
                    <div class="form-section" data-section="details">
                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-clipboard-data" aria-hidden="true"></i>
                                <span>Application Details</span>
                            </div>
                            <div class="card-body form-grid two-col">
                                <div class="form-control-group">
                                    <label for="clientId" class="form-label"><i class="bi bi-person" aria-hidden="true"></i><span>Client ID</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="clientId" name="clientId" class="form-control segment-id" placeholder="Enter client ID" data-required="true">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="clientDescription" name="clientDescription" class="form-control segment-desc" placeholder="Client name" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search" aria-label="Search client">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group">
                                    <label for="product" class="form-label"><i class="bi bi-box" aria-hidden="true"></i><span>Product</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="product" name="product" class="form-control segment-id" placeholder="Enter product">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="productDescription" name="productDescription" class="form-control segment-desc" placeholder="Product name" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search" aria-label="Search product">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group">
                                <label for="creditOfficer" class="form-label"><i class="bi bi-person-badge" aria-hidden="true"></i><span>Credit Officer</span></label>
                                <div class="input-segmented">
                                    <input type="text" id="creditOfficer" name="creditOfficer" class="form-control segment-id" placeholder="Enter officer ID">
                                    <div class="segment-divider"></div>
                                    <input type="text" id="officerDescription" name="officerDescription" class="form-control segment-desc" placeholder="Officer name" readonly>
                                    <button type="button" class="btn-inline-search" data-action="search" aria-label="Search officer">
                                        </button>
                                    </div>
                                </div>

                                <div class="form-control-group">
                                    <label for="contraBranchId" class="form-label"><i class="bi bi-building" aria-hidden="true"></i><span>Contra Branch</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="contraBranchId" name="contraBranchId" class="form-control segment-id" value="2305" placeholder="Branch ID">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="contraBranchName" name="contraBranchName" class="form-control segment-desc" value="Legehar" placeholder="Branch name" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search" aria-label="Search branch">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group">
                                    <label for="accountType" class="form-label"><i class="bi bi-credit-card" aria-hidden="true"></i><span>Account Type</span></label>
                                    <select id="accountType" name="accountType" class="form-control">
                                        <option value="customer" selected>Customer</option>
                                        <option value="business">Business</option>
                                        <option value="corporate">Corporate</option>
                                    </select>
                                </div>

                                <div class="form-control-group">
                                    <label for="contraAccountId" class="form-label"><i class="bi bi-credit-card-fill" aria-hidden="true"></i><span>Contra Account</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="contraAccountId" name="contraAccountId" class="form-control segment-id" placeholder="Account ID">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="contraAccountDescription" name="contraAccountDescription" class="form-control segment-desc" placeholder="Account name" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search" aria-label="Search contra account">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group">
                                    <label for="mainRepaymentAccount" class="form-label"><i class="bi bi-arrow-repeat" aria-hidden="true"></i><span>Main Repayment Account</span></label>
                                    <div class="input-segmented">
                                        <input type="text" id="mainRepaymentAccount" name="mainRepaymentAccount" class="form-control segment-id" placeholder="Account ID">
                                        <div class="segment-divider"></div>
                                        <input type="text" id="repaymentAccountDescription" name="repaymentAccountDescription" class="form-control segment-desc" placeholder="Account name" readonly>
                                        <button type="button" class="btn-inline-search" data-action="search" aria-label="Search repayment account">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-control-group"></div>

                                <div class="form-control-group">
                                    <label for="disbursementAmount" class="form-label"><i class="bi bi-cash-coin" aria-hidden="true"></i><span>Disbursement Amount</span></label>
                                    <input type="number" id="disbursementAmount" name="disbursementAmount" class="form-control" placeholder="Enter amount" min="0" step="0.01">
                                </div>
                                <div class="form-control-group">
                                    <label for="applicationDate" class="form-label"><i class="bi bi-calendar-event" aria-hidden="true"></i><span>Application Date</span></label>
                                    <select id="applicationDate" name="applicationDate" class="form-control">
                                        <option value="06/Dec/2025" selected>06/Dec/2025</option>
                                        <option value="today">Today</option>
                                        <option value="custom">Custom Date</option>
                                    </select>
                                </div>
                                <div class="form-control-group">
                                    <label for="reviewDate" class="form-label"><i class="bi bi-calendar-check" aria-hidden="true"></i><span>Review Date</span></label>
                                    <select id="reviewDate" name="reviewDate" class="form-control">
                                        <option value="01/Jan/0001" selected>01/Jan/0001</option>
                                        <option value="auto">Auto Calculate</option>
                                        <option value="custom">Custom Date</option>
                                    </select>
                                </div>

                                <div class="form-control-group">
                                    <label for="expiryDate" class="form-label"><i class="bi bi-calendar-x" aria-hidden="true"></i><span>Expiry Date</span></label>
                                    <select id="expiryDate" name="expiryDate" class="form-control">
                                        <option value="01/Jan/0001" selected>01/Jan/0001</option>
                                        <option value="auto">Auto Calculate</option>
                                        <option value="custom">Custom Date</option>
                                    </select>
                                </div>
                                <div class="form-control-group">
                                    <label for="status" class="form-label"><i class="bi bi-check-circle" aria-hidden="true"></i><span>Status</span></label>
                                    <select id="status" name="status" class="form-control">
                                        <option value="pending">Pending</option>
                                        <option value="approved" selected>Applied</option>
                                        <option value="disbursed">Disbursed</option>
                                        <option value="cancelled">Cancelled</option>
                                    </select>
                                </div>
                                <div class="form-control-group">
                                    <label for="fileId" class="form-label"><i class="bi bi-file-earmark" aria-hidden="true"></i><span>File ID</span></label>
                                    <input type="text" id="fileId" name="fileId" class="form-control" placeholder="Enter file ID">
                                </div>

                                <div class="form-control-group full-row">
                                    <label for="remarks" class="form-label"><i class="bi bi-journal-text" aria-hidden="true"></i><span>Remarks</span></label>
                                    <textarea id="remarks" name="remarks" class="form-control" placeholder="Enter remarks"></textarea>
                                </div>
                            </div>
                        </section>
                    </div>

                    <!-- Client Details Section -->
                    <div class="form-section" data-section="client">
                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-person-lines-fill" aria-hidden="true"></i>
                                <span>Client Details</span>
                            </div>
                            <div class="card-body form-grid two-col">
                                <div class="form-control-group">
                                    <label for="limitId" class="form-label"><i class="bi bi-hash" aria-hidden="true"></i><span>Limit ID</span></label>
                                    <input type="text" id="limitId" name="limitId" class="form-control" placeholder="Enter limit ID">
                                </div>
                                <div class="form-control-group">
                                    <label for="sanctionedAmount" class="form-label"><i class="bi bi-currency-dollar" aria-hidden="true"></i><span>Sanctioned Amount</span></label>
                                    <input type="number" id="sanctionedAmount" name="sanctionedAmount" class="form-control" placeholder="Enter sanctioned amount" min="0" step="0.01">
                                </div>
                                <div class="form-control-group">
                                    <label for="clientExpiryDate" class="form-label"><i class="bi bi-calendar-x" aria-hidden="true"></i><span>Expiry Date</span></label>
                                    <select id="clientExpiryDate" name="clientExpiryDate" class="form-control">
                                        <option value="01/Jan/0001" selected>01/Jan/0001</option>
                                        <option value="auto">Auto Calculate</option>
                                        <option value="custom">Custom Date</option>
                                    </select>
                                </div>

                                <div class="form-control-group">
                                    <label for="limitAmount" class="form-label"><i class="bi bi-wallet2" aria-hidden="true"></i><span>Limit Amount</span></label>
                                    <input type="number" id="limitAmount" name="limitAmount" class="form-control" placeholder="Enter limit amount" min="0" step="0.01">
                                </div>
                                <div class="form-control-group">
                                    <label for="totalOdAmount" class="form-label"><i class="bi bi-calculator" aria-hidden="true"></i><span>Total OD Amount</span></label>
                                    <input type="number" id="totalOdAmount" name="totalOdAmount" class="form-control" placeholder="Total overdraft amount" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="totalTodAmount" class="form-label"><i class="bi bi-sum" aria-hidden="true"></i><span>Total TOD Amount</span></label>
                                    <input type="number" id="totalTodAmount" name="totalTodAmount" class="form-control" placeholder="Total TOD amount" readonly>
                                </div>
                            </div>
                        </section>
                    </div>

                    <!-- Behind The Scene Section -->
                    <div class="form-section" data-section="audit">
                        <section class="card">
                            <div class="card-header">
                                <i class="bi bi-info-circle" aria-hidden="true"></i>
                                <span>Behind The Scene</span>
                            </div>
                            <div class="card-body form-grid two-col">
                                <div class="form-control-group">
                                    <label for="createdBy" class="form-label"><i class="bi bi-person-badge" aria-hidden="true"></i><span>Created By</span></label>
                                    <input type="text" id="createdBy" name="createdBy" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="modifiedBy" class="form-label"><i class="bi bi-person-gear" aria-hidden="true"></i><span>Modified By</span></label>
                                    <input type="text" id="modifiedBy" name="modifiedBy" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="supervisedBy" class="form-label"><i class="bi bi-person-check" aria-hidden="true"></i><span>Supervised By</span></label>
                                    <input type="text" id="supervisedBy" name="supervisedBy" class="form-control" readonly>
                                </div>

                                <div class="form-control-group">
                                    <label for="createdOn" class="form-label"><i class="bi bi-calendar-event" aria-hidden="true"></i><span>Created On</span></label>
                                    <input type="text" id="createdOn" name="createdOn" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="modifiedOn" class="form-label"><i class="bi bi-calendar-range" aria-hidden="true"></i><span>Modified On</span></label>
                                    <input type="text" id="modifiedOn" name="modifiedOn" class="form-control" readonly>
                                </div>
                                <div class="form-control-group">
                                    <label for="supervisedOn" class="form-label"><i class="bi bi-calendar2-check" aria-hidden="true"></i><span>Supervised On</span></label>
                                    <input type="text" id="supervisedOn" name="supervisedOn" class="form-control" readonly>
                                </div>
                            </div>
                        </section>
                    </div>
                </form>
            </main>

            <aside class="action-sidebar" aria-label="CRUD operations">
                <div class="action-sidebar-header">Actions</div>
                <div class="action-buttons-group">
                    <button type="button" class="action-btn" id="viewBtn" title="View record">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="action-btn" id="addBtn" title="Add new record">
                        <i class="bi bi-plus-circle" aria-hidden="true"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="action-btn" id="editBtn" title="Edit record">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span>Edit</span>
                    </button>
                    <button type="button" class="action-btn" id="deleteBtn" title="Delete record">
                        <i class="bi bi-trash" aria-hidden="true"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="action-btn primary" id="disburseBtn" title="Disburse amount">
                        <i class="bi bi-cash-coin" aria-hidden="true"></i>
                        <span>Disburse</span>
                    </button>
                    <button type="button" class="action-btn" id="reverseBtn" title="Reverse transaction">
                        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
                        <span>Reverse</span>
                    </button>
                    <button type="button" class="action-btn danger" id="cancelBtn" title="Cancel operation">
                        <i class="bi bi-x-circle" aria-hidden="true"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <script src="overdraft-disbursement.js"></script>
</body>
</html>
