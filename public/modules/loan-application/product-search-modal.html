<!-- Product Search Modal -->
<div class="modal fade kairo-search-modal" id="productSearchModal" tabindex="-1" aria-labelledby="productSearchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header">
                <h5 class="modal-title" id="productSearchModalLabel">
                    <i class="bi bi-box-seam"></i>
                    Product Search
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <!-- Search Criteria Section -->
                <div class="search-section">
                    <div class="search-row">
                        <div class="search-field">
                            <label class="search-label">Product ID</label>
                            <div class="search-input-group">
                                <select class="search-select" id="productIdOperator">
                                    <option value="like">Like</option>
                                    <option value="equals">Equals</option>
                                    <option value="starts">Starts With</option>
                                </select>
                                <input type="text" class="search-input" id="productIdSearch" placeholder="Enter Product ID">
                            </div>
                        </div>

                        <div class="search-field">
                            <label class="search-label">Description</label>
                            <div class="search-input-group">
                                <select class="search-select" id="productDescOperator">
                                    <option value="like">Like</option>
                                    <option value="equals">Equals</option>
                                    <option value="starts">Starts With</option>
                                </select>
                                <input type="text" class="search-input" id="productDescSearch" placeholder="Enter Description">
                            </div>
                        </div>
                    </div>

                    <!-- Search Action Buttons -->
                    <div class="search-actions">
                        <button type="button" class="search-btn search-btn-primary" id="productSearchBtn">
                            <i class="bi bi-search"></i>
                            Search
                        </button>
                        <button type="button" class="search-btn search-btn-secondary" id="productClearBtn">
                            <i class="bi bi-x-circle"></i>
                            Clear
                        </button>
                    </div>
                </div>

                <!-- Search Results Section -->
                <div class="results-header">
                    <i class="bi bi-list-ul"></i>
                    Search Results
                </div>
                <div class="results-table-wrapper">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th>Product ID</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="productResultsBody">
                            <tr>
                                <td colspan="3" class="no-results">
                                    <i class="bi bi-inbox"></i>
                                    No results. Click "Search" to find products.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination-bar">
                    <div class="pagination-buttons">
                        <button type="button" class="pagination-btn" id="productPrevPageBtn" disabled>
                            <i class="bi bi-chevron-left"></i>
                            Previous
                        </button>
                        <button type="button" class="pagination-btn" id="productNextPageBtn" disabled>
                            Next
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                    <div class="pagination-info">
                        <span id="productPageInfo">Page 0 of 0</span>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button type="button" class="modal-btn modal-btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i>
                    Cancel
                </button>
                <button type="button" class="modal-btn modal-btn-success" id="productSelectBtn" disabled>
                    <i class="bi bi-check-circle"></i>
                    OK
                </button>
            </div>
        </div>
    </div>
</div>
