<!-- Client Search Modal -->
<!-- DEPRECATED: Use styles.css only per UI_STANDARDIZATION_CHEATSHEET -->
<!-- <link rel="stylesheet" href="client-search-modal.css"> -->
<div class="modal fade kairo-search-modal" id="clientSearchModal" tabindex="-1" aria-labelledby="clientSearchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="clientSearchModalLabel">
                    <i class="bi bi-search"></i> WF Client Exist
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Search Criteria -->
                <div class="search-section">
                    <div class="search-row">
                        <div class="search-field">
                            <label class="search-label">Client ID</label>
                            <div class="search-input-group">
                                <select id="searchClientIdOperator" class="search-select">
                                    <option value="like" selected>Like</option>
                                    <option value="equals">Equals</option>
                                    <option value="startswith">Starts With</option>
                                </select>
                                <input type="text" id="searchClientIdFilter" class="search-input" placeholder="Enter Client ID">
                            </div>
                        </div>
                        <div class="search-field">
                            <label class="search-label">Name</label>
                            <div class="search-input-group">
                                <select id="searchClientNameOperator" class="search-select">
                                    <option value="like" selected>Like</option>
                                    <option value="equals">Equals</option>
                                    <option value="startswith">Starts With</option>
                                </select>
                                <input type="text" id="searchClientNameFilter" class="search-input" placeholder="Enter Client Name">
                            </div>
                        </div>
                    </div>
                    
                    <div class="search-actions">
                        <button type="button" class="search-btn search-btn-primary" id="btnSearchClients">
                            <i class="bi bi-search"></i> Search
                        </button>
                        <button type="button" class="search-btn search-btn-secondary" id="btnClearClientSearch">
                            <i class="bi bi-x-circle"></i> Clear
                        </button>
                    </div>
                </div>

                <!-- Search Results -->
                <div class="results-header">
                    <i class="bi bi-table"></i> Search Results
                </div>

                <!-- Results Table -->
                <div class="results-table-wrapper">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th style="width: 60px;">#</th>
                                <th style="width: 180px;">ClientID</th>
                                <th>Name</th>
                            </tr>
                        </thead>
                        <tbody id="clientSearchResults">
                            <tr>
                                <td colspan="3" class="no-results">
                                    <i class="bi bi-search"></i> No results. Click Search to find clients.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination-bar">
                    <div class="pagination-buttons">
                        <button type="button" class="pagination-btn" id="btnPrevClientPage" disabled>
                            <i class="bi bi-arrow-left"></i> Previous
                        </button>
                        <button type="button" class="pagination-btn" id="btnNextClientPage" disabled>
                            Next <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                    <div class="pagination-info">
                        <span id="clientPageInfo">Page 1 of 1 (0 results)</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-btn modal-btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
                <button type="button" class="modal-btn modal-btn-success" id="btnSelectClient" disabled>
                    <i class="bi bi-check-circle"></i> OK
                </button>
            </div>
        </div>
    </div>
</div>
