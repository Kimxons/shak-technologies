<!-- Guarantor Search Modal -->
<!-- DEPRECATED: Use styles.css only per UI_STANDARDIZATION_CHEATSHEET -->
<!-- <link rel="stylesheet" href="guarantor-search-modal.css"> -->
<div class="modal fade kairo-search-modal" id="guarantorSearchModal" tabindex="-1" aria-labelledby="guarantorSearchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="guarantorSearchModalLabel">
                    <i class="bi bi-search"></i> WF Adv Guarantor
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Search Criteria -->
                <div class="search-section">
                    <div class="search-row">
                        <div class="search-field">
                            <label class="search-label">Guarantor ID</label>
                            <div class="search-input-group">
                                <select id="searchGuarantorIdOperator" class="search-select">
                                    <option value="like" selected>Like</option>
                                    <option value="equals">Equals</option>
                                    <option value="startswith">Starts With</option>
                                </select>
                                <input type="text" id="searchGuarantorIdFilter" class="search-input" placeholder="Enter Guarantor ID">
                            </div>
                        </div>
                        <div class="search-field">
                            <label class="search-label">Name</label>
                            <div class="search-input-group">
                                <select id="searchGuarantorNameOperator" class="search-select">
                                    <option value="like" selected>Like</option>
                                    <option value="equals">Equals</option>
                                    <option value="startswith">Starts With</option>
                                </select>
                                <input type="text" id="searchGuarantorNameFilter" class="search-input" placeholder="Enter Name">
                            </div>
                        </div>
                    </div>

                    <div class="search-row">
                        <div class="search-field">
                            <label class="search-label">Guarantor Type</label>
                            <div class="search-input-group">
                                <select id="searchGuarantorTypeOperator" class="search-select">
                                    <option value="like" selected>Like</option>
                                    <option value="equals">Equals</option>
                                </select>
                                <select id="searchGuarantorTypeFilter" class="search-input">
                                    <option value="">All Types</option>
                                </select>
                            </div>
                        </div>
                        <div class="search-field"></div>
                    </div>
                    
                    <div class="search-actions">
                        <button type="button" class="search-btn search-btn-primary" id="btnSearchGuarantors">
                            <i class="bi bi-search"></i> Search
                        </button>
                        <button type="button" class="search-btn search-btn-secondary" id="btnClearGuarantorSearch">
                            <i class="bi bi-x-circle"></i> Clear
                        </button>
                    </div>
                </div>

                <!-- Tab Navigation -->
                <div class="results-tabs">
                    <button type="button" class="tab-btn active" data-tab="search-results">
                        <i class="bi bi-search"></i> Search Results
                    </button>
                    <button type="button" class="tab-btn" data-tab="unsupervised-results">
                        <i class="bi bi-exclamation-triangle"></i> Unsupervised Search Result
                    </button>
                </div>

                <!-- Search Results Tab -->
                <div class="tab-content active" id="search-results">
                    <!-- Results Table -->
                    <div class="results-table-wrapper">
                        <table class="results-table">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">#</th>
                                    <th style="width: 180px;">Guarantor ID</th>
                                    <th>Name</th>
                                    <th style="width: 150px;">Type</th>
                                    <th style="width: 120px;">Status</th>
                                </tr>
                            </thead>
                            <tbody id="guarantorSearchResults">
                                <tr>
                                    <td colspan="5" class="no-results">
                                        <i class="bi bi-search"></i> No results. Click Search to find guarantors.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Unsupervised Search Results Tab -->
                <div class="tab-content" id="unsupervised-results">
                    <div class="results-table-wrapper">
                        <table class="results-table">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">#</th>
                                    <th style="width: 180px;">Guarantor ID</th>
                                    <th>Name</th>
                                    <th style="width: 150px;">Type</th>
                                    <th style="width: 120px;">Status</th>
                                </tr>
                            </thead>
                            <tbody id="unsupervisedGuarantorResults">
                                <tr>
                                    <td colspan="5" class="no-results">
                                        <i class="bi bi-info-circle"></i> No unsupervised results found.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Results Info -->
                <div class="results-info">
                    <span id="guarantorResultsInfo">No Records Found [No:000302]</span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-btn modal-btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
                <button type="button" class="modal-btn modal-btn-success" id="btnSelectGuarantor" disabled>
                    <i class="bi bi-check-circle"></i> OK
                </button>
            </div>
        </div>
    </div>
</div>
