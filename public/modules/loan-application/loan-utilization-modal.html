<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Utilization</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=20260204">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .window { height: 100%; display: flex; flex-direction: column; }
        .main-container { flex: 1; overflow: auto; }
    </style>
</head>
<body>
    <div class="window">
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-pie-chart-fill am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">Loan Utilization</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <main class="main-container" aria-label="Loan Utilization form">
            <div class="form-content" role="region" aria-label="Loan Utilization form">
                <div class="form-card" data-main-form>
                    <!-- Application Details Section -->
                    <div class="form-section" data-section="application-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-info-circle"></i>Application Details</span>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="branchId">Branch ID</label>
                                    <div class="input-group">
                                        <input type="text" id="branchId" class="bs-input-text form-control" value="0101" readonly>
                                        <input type="text" id="branchName" class="bs-input-text form-control" value="Head Office" readonly>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="clientId">Client ID</label>
                                    <input type="text" id="clientId" class="bs-input-text form-control" readonly>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="applicationId">Application ID</label>
                                    <input type="text" id="applicationId" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="groupId">Group ID</label>
                                    <input type="text" id="groupId" class="bs-input-text form-control" readonly>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="slno">SLNO</label>
                                    <input type="text" id="slno" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Utilization Details Section -->
                    <div class="form-section" data-section="utilization-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-pie-chart"></i>Utilization Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Utilization Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="utilizationDate">Date</label>
                                    <select id="utilizationDate" class="bs-input-text form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="utilizationType">Utilization Type</label>
                                    <select id="utilizationType" class="bs-input-text form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="utilizationAmount">Utilization Amount</label>
                                    <input type="number" id="utilizationAmount" class="bs-input-text form-control" placeholder="0.00" step="0.01">
                                </div>
                                <div class="col"></div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="description">Description</label>
                                    <textarea id="description" class="bs-textarea form-control" rows="3" placeholder="Enter description"></textarea>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Behind the Scene Section -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="audit-section audit-section--summary">
                                <div class="audit-cell">
                                    <span class="audit-label">Created By</span>
                                    <span class="audit-value" id="createdBy" data-field="createdBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified By</span>
                                    <span class="audit-value" id="modifiedBy" data-field="modifiedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised By</span>
                                    <span class="audit-value" id="supervisedBy" data-field="supervisedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Created On</span>
                                    <span class="audit-value" id="createdOn" data-field="createdOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified On</span>
                                    <span class="audit-value" id="modifiedOn" data-field="modifiedOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised On</span>
                                    <span class="audit-value" id="supervisedOn" data-field="supervisedOn"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-panel" aria-label="Form actions">        
                <div class="action-buttons">
                    <button class="btn-action btn-view" type="button" data-action="view"><i class="bi bi-eye me-1"></i>View</button>          
                    <button class="btn-action" type="button" data-action="add"><i class="bi bi-plus-circle me-1"></i>Add</button>
                    <button class="btn-action" type="button" data-action="edit"><i class="bi bi-pencil-square me-1"></i>Edit</button>
                    <button class="btn-action btn-cancel" type="button" data-action="delete"><i class="bi bi-trash me-1"></i>Delete</button>
                    <button class="btn-action btn-save" type="button" data-action="save"><i class="bi bi-check-lg me-1"></i>Save</button>
                    <button class="btn-action btn-cancel" type="button" data-action="cancel"><i class="bi bi-x-lg me-1"></i>Cancel</button>          
                </div>
            </div>
        </main>

        <div class="am-message-panel" role="alert" aria-live="polite">
            <i class="bi bi-info-circle"></i>
            <span></span>
        </div>    

        <div class="loading-overlay" id="loadingOverlay" hidden>
            <div class="loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading...</span></div>
        </div>
    </div>

    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="loan-utilization-modal.js"></script>
    <script>
        // Window Controls
        function notifyParentFormOpened() {
            window.parent.postMessage({ type: 'submoduleOpened', source: 'Loan Utilization' }, '*');
        }
        function closeChildForm() {
            window.parent.postMessage({ type: 'submoduleClosed' }, '*');
            window.close();
        }
        function handleWindowAction(action) {
            if (action === 'refresh') {
                location.reload();
            } else if (action === 'maximize') {
                window.parent.postMessage({ type: 'toggleSidebarForMaximize' }, '*');
            } else if (action === 'close') {
                closeChildForm();
            }
        }
        function initWindowControls() {
            document.querySelectorAll('.am-header__right [data-action]').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (['refresh', 'maximize', 'close'].includes(action)) {
                    btn.addEventListener('click', () => handleWindowAction(action));
                }
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            initWindowControls();
            notifyParentFormOpened();
        });
    </script>
</body>
</html>
