<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collateral</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=20260204">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .window { height: 100%; display: flex; flex-direction: column; }
        .main-container { flex: 1; overflow: auto; }
    </style>
</head>
<body>
    <div class="window">
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-shield-fill-check am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">Collateral</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <main class="main-container" aria-label="Collateral form">
            <div class="form-content" role="region" aria-label="Collateral form">
                <div class="form-card" data-main-form>
                    <!-- Collateral Assignment Section -->
                    <div class="form-section" data-section="collateral-assignment">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-shield-check"></i>Collateral Assignment</span>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="collateralId">Collateral ID</label>
                                    <div class="input-group">
                                        <input type="text" id="collateralId" class="bs-input-text form-control">
                                        <button class="btn btn-outline-secondary" type="button" title="Search Collateral">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col"></div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="apportionedRatio">Apportioned Ratio</label>
                                    <input type="text" id="apportionedRatio" class="bs-input-text form-control">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="assignedDate">Assigned Date</label>
                                    <input type="date" id="assignedDate" class="bs-input-text form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="apportionedValue">Apportioned Value</label>
                                    <input type="text" id="apportionedValue" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="margin">Margin</label>
                                    <input type="text" id="margin" class="bs-input-text form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="apportionedCollateralValue">Apportioned Collateral Value</label>
                                    <input type="text" id="apportionedCollateralValue" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="exchangeRate">Exchange Rate</label>
                                    <input type="text" id="exchangeRate" class="bs-input-text form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="loanCollateralValue">Loan Collateral Value</label>
                                    <input type="text" id="loanCollateralValue" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Collateral Details Section -->
                    <div class="form-section" data-section="collateral-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-file-text"></i>Collateral Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Collateral Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="owner">Owner</label>
                                    <input type="text" id="owner" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="collateralType">Collateral Type</label>
                                    <input type="text" id="collateralType" class="bs-input-text form-control" readonly>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="currencyId">Currency ID</label>
                                    <input type="text" id="currencyId" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="collateralValue">Collateral Value</label>
                                    <input type="text" id="collateralValue" class="bs-input-text form-control" readonly>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="usedCollateralValue">Used Collateral Value</label>
                                    <input type="text" id="usedCollateralValue" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Loan Details Section -->
                    <div class="form-section" data-section="loan-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-cash-stack"></i>Loan Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Loan Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="sanctionAmount">Sanction Amount</label>
                                    <input type="text" id="sanctionAmount" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="loanCurrencyId">Currency ID</label>
                                    <input type="text" id="loanCurrencyId" class="bs-input-text form-control" readonly>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Behind the Scene Section -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="applicationStatus">Application Status</label>
                                    <input type="text" id="applicationStatus" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col"></div>
                            </div>
                            <div class="audit-section audit-section--summary">
                                <div class="audit-cell">
                                    <span class="audit-label">Created By</span>
                                    <span class="audit-value" id="createdBy" data-field="createdBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified By</span>
                                    <span class="audit-value" id="modifiedBy" data-field="modifiedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised By</span>
                                    <span class="audit-value" id="supervisedBy" data-field="supervisedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Created On</span>
                                    <span class="audit-value" id="createdOn" data-field="createdOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified On</span>
                                    <span class="audit-value" id="modifiedOn" data-field="modifiedOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised On</span>
                                    <span class="audit-value" id="supervisedOn" data-field="supervisedOn"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-panel" aria-label="Form actions">        
                <div class="action-buttons">
                    <button class="btn-action btn-view" type="button" data-action="view" id="viewBtn"><i class="bi bi-eye me-1"></i>View</button>          
                    <button class="btn-action" type="button" data-action="add" id="addBtn"><i class="bi bi-plus-circle me-1"></i>Add</button>
                    <button class="btn-action" type="button" data-action="edit" id="editBtn"><i class="bi bi-pencil-square me-1"></i>Edit</button>
                    <button class="btn-action btn-cancel" type="button" data-action="delete" id="deleteBtn"><i class="bi bi-trash me-1"></i>Delete</button>
                    <button class="btn-action btn-save" type="button" data-action="save" id="saveBtn"><i class="bi bi-check-lg me-1"></i>Save</button>
                    <button class="btn-action btn-cancel" type="button" data-action="cancel" id="cancelBtn"><i class="bi bi-x-lg me-1"></i>Cancel</button>          
                </div>
            </div>
        </main>

        <div class="am-message-panel" role="alert" aria-live="polite">
            <i class="bi bi-info-circle"></i>
            <span></span>
        </div>    

        <div class="loading-overlay" id="loadingOverlay" hidden>
            <div class="loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading...</span></div>
        </div>
    </div>

    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="collateral-modal.js"></script>
    <script>
        // Window Controls
        function notifyParentFormOpened() {
            window.parent.postMessage({ type: 'submoduleOpened', source: 'Collateral' }, '*');
        }
        function closeChildForm() {
            window.parent.postMessage({ type: 'submoduleClosed' }, '*');
            window.close();
        }
        function handleWindowAction(action) {
            if (action === 'refresh') {
                location.reload();
            } else if (action === 'maximize') {
                window.parent.postMessage({ type: 'toggleSidebarForMaximize' }, '*');
            } else if (action === 'close') {
                closeChildForm();
            }
        }
        function initWindowControls() {
            document.querySelectorAll('.am-header__right [data-action]').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (['refresh', 'maximize', 'close'].includes(action)) {
                    btn.addEventListener('click', () => handleWindowAction(action));
                }
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            initWindowControls();
            notifyParentFormOpened();
        });
    </script>
</body>
</html>
