<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charge Rates</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=20260204">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .window { height: 100%; display: flex; flex-direction: column; }
        .main-container { flex: 1; overflow: auto; }
    </style>
</head>
<body>
    <div class="window">
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-cash-coin am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">Charge Rates</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <main class="main-container" aria-label="Charge Rates form">
            <div class="form-content" role="region" aria-label="Charge Rates form">
                <div class="form-card" data-main-form>
                    <!-- Charge ID Section -->
                    <div class="form-section" data-section="charge-id">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-tag"></i>Charge Identification</span>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="chargeId">Charge ID</label>
                                    <div class="input-group">
                                        <input type="text" id="chargeId" class="bs-input-text form-control" placeholder="ID" readonly>
                                        <input type="text" id="chargeName" class="bs-input-text form-control" placeholder="Charge Description" readonly>
                                        <button class="btn btn-outline-secondary" type="button" id="searchChargeBtn" title="Search Charge">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Dates Section -->
                    <div class="form-section" data-section="dates">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-calendar"></i>Effective Period</span>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="effectiveDate">Effective Date</label>
                                    <input type="date" id="effectiveDate" class="bs-input-text form-control">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="expiryDate">Expiry Date</label>
                                    <input type="date" id="expiryDate" class="bs-input-text form-control">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Charge Settings Section -->
                    <div class="form-section" data-section="charge-settings">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-sliders"></i>Charge Settings</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Charge Settings" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="ceilingAmount">Ceiling Amount</label>
                                    <input type="number" id="ceilingAmount" class="bs-input-text form-control" placeholder="0.00" step="0.01">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="calculationMethod">Calculation Method</label>
                                    <select id="calculationMethod" class="bs-input-text form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="minCharge">Min Charge</label>
                                    <input type="number" id="minCharge" class="bs-input-text form-control" placeholder="0.00" step="0.01">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="maximumCharge">Maximum Charge</label>
                                    <input type="number" id="maximumCharge" class="bs-input-text form-control" placeholder="0.00" step="0.01">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="value">Value</label>
                                    <input type="number" id="value" class="bs-input-text form-control" placeholder="0.00" step="0.01">
                                </div>
                                <div class="col"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Value Table Section -->
                    <div class="form-section" data-section="value-table">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-table"></i>Value</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Value Table" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table class="table table-sm table-bordered table-hover">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Ceiling Amount</th>
                                            <th>Minimum Charge</th>
                                            <th>Maximum Charge</th>
                                            <th>Calculation Method</th>
                                            <th>Value</th>
                                            <th>Fixed Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody id="chargesTableBody">
                                        <tr class="empty-row">
                                            <td colspan="6" class="text-center text-muted">No records to display.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Behind the Scene Section -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="audit-section audit-section--summary">
                                <div class="audit-cell">
                                    <span class="audit-label">Created By</span>
                                    <span class="audit-value" id="createdBy" data-field="createdBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified By</span>
                                    <span class="audit-value" id="modifiedBy" data-field="modifiedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised By</span>
                                    <span class="audit-value" id="supervisedBy" data-field="supervisedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Created On</span>
                                    <span class="audit-value" id="createdOn" data-field="createdOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified On</span>
                                    <span class="audit-value" id="modifiedOn" data-field="modifiedOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised On</span>
                                    <span class="audit-value" id="supervisedOn" data-field="supervisedOn"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-panel" aria-label="Form actions">        
                <div class="action-buttons">
                    <button class="btn-action btn-view" type="button" data-action="view" id="viewBtn"><i class="bi bi-eye me-1"></i>View</button>          
                    <button class="btn-action" type="button" data-action="add" id="addBtn"><i class="bi bi-plus-circle me-1"></i>Add</button>
                    <button class="btn-action" type="button" data-action="edit" id="editBtn"><i class="bi bi-pencil-square me-1"></i>Edit</button>
                    <button class="btn-action btn-cancel" type="button" data-action="delete" id="deleteBtn"><i class="bi bi-trash me-1"></i>Delete</button>
                    <button class="btn-action btn-save" type="button" data-action="save" id="saveBtnSidebar"><i class="bi bi-check-lg me-1"></i>Save</button>
                    <button class="btn-action btn-cancel" type="button" data-action="cancel" id="cancelBtnSidebar"><i class="bi bi-x-lg me-1"></i>Cancel</button>          
                </div>
            </div>
        </main>

        <div class="am-message-panel" role="alert" aria-live="polite">
            <i class="bi bi-info-circle"></i>
            <span></span>
        </div>    

        <div class="loading-overlay" id="loadingOverlay" hidden>
            <div class="loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading...</span></div>
        </div>
    </div>

    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="charge-rates-modal.js"></script>
    <script>
        // Window Controls
        function notifyParentFormOpened() {
            window.parent.postMessage({ type: 'submoduleOpened', source: 'Charge Rates' }, '*');
        }
        function closeChildForm() {
            window.parent.postMessage({ type: 'submoduleClosed' }, '*');
            window.close();
        }
        function handleWindowAction(action) {
            if (action === 'refresh') {
                location.reload();
            } else if (action === 'maximize') {
                window.parent.postMessage({ type: 'toggleSidebarForMaximize' }, '*');
            } else if (action === 'close') {
                closeChildForm();
            }
        }
        function initWindowControls() {
            document.querySelectorAll('.am-header__right [data-action]').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (['refresh', 'maximize', 'close'].includes(action)) {
                    btn.addEventListener('click', () => handleWindowAction(action));
                }
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            initWindowControls();
            notifyParentFormOpened();
        });
    </script>
</body>
</html>
