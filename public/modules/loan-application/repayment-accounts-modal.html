<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repayment Accounts</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=20260204">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .window { height: 100%; display: flex; flex-direction: column; }
        .main-container { flex: 1; overflow: auto; }
    </style>
</head>
<body>
    <div class="window">
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-bank am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">Repayment Accounts</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <main class="main-container" aria-label="Repayment Accounts form">
            <div class="form-content" role="region" aria-label="Repayment Accounts form">
                <div class="form-card" data-main-form>
                    <!-- Repayment Account Details Section -->
                    <div class="form-section" data-section="repayment-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-bank"></i>Repayment Account Details</span>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <div class="form-check">
                                        <input type="checkbox" id="isRepaymentAccount" class="form-check-input">
                                        <label class="form-check-label label-blue" for="isRepaymentAccount">Is Repayment Account</label>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="form-check">
                                        <input type="checkbox" id="isMainRepaymentAccount" class="form-check-input">
                                        <label class="form-check-label label-blue" for="isMainRepaymentAccount">Is Main Repayment Account</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="recoveryOrder">Recovery Order</label>
                                    <input type="number" id="recoveryOrder" class="bs-input-text form-control" placeholder="Enter recovery order">
                                </div>
                                <div class="col"></div>
                            </div>
                            <div class="form-row">
                                <div class="col" style="display: flex; gap: 8px;">
                                    <button class="btn-action" type="button" id="alterBtn"><i class="bi bi-pencil-square me-1"></i>Alter</button>
                                    <button class="btn-action btn-save" type="button" id="updateBtn"><i class="bi bi-check-circle me-1"></i>Update</button>
                                    <button class="btn-action btn-cancel" type="button" id="clearBtn"><i class="bi bi-x-circle me-1"></i>Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Repayment Accounts Table Section -->
                    <div class="form-section" data-section="repayment-table">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-table"></i>Repayment Accounts List</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Repayment Accounts List" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-container">
                                <table class="modern-table">
                                    <thead>
                                        <tr>
                                            <th>IsRepaymentAccount</th>
                                            <th>Repayment AccountID</th>
                                            <th>Account Name</th>
                                            <th>IsMainRepaymentAccount</th>
                                            <th>Recovery Order</th>
                                        </tr>
                                    </thead>
                                    <tbody id="repaymentAccountsTableBody">
                                        <tr>
                                            <td colspan="5" class="no-data">No records to display.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Behind The Scene Section -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-info-circle"></i>Behind The Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="audit-section audit-section--summary">
                                <div class="audit-cell">
                                    <span class="audit-label">Created By</span>
                                    <span class="audit-value" id="createdBy" data-field="createdBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified By</span>
                                    <span class="audit-value" id="modifiedBy" data-field="modifiedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised By</span>
                                    <span class="audit-value" id="supervisedBy" data-field="supervisedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Created On</span>
                                    <span class="audit-value" id="createdOn" data-field="createdOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified On</span>
                                    <span class="audit-value" id="modifiedOn" data-field="modifiedOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised On</span>
                                    <span class="audit-value" id="supervisedOn" data-field="supervisedOn"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-panel" aria-label="Form actions">        
                <div class="action-buttons">
                    <button class="btn-action" type="button" data-action="edit" id="editBtn"><i class="bi bi-pencil-square me-1"></i>Edit</button>
                    <button class="btn-action btn-save" type="button" data-action="save" id="saveBtn"><i class="bi bi-check-lg me-1"></i>Save</button>
                    <button class="btn-action btn-cancel" type="button" data-action="cancel" id="cancelBtn"><i class="bi bi-x-lg me-1"></i>Cancel</button>          
                </div>
            </div>
        </main>

        <div class="am-message-panel" role="alert" aria-live="polite">
            <i class="bi bi-info-circle"></i>
            <span></span>
        </div>    

        <div class="loading-overlay" id="loadingOverlay" hidden>
            <div class="loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading...</span></div>
        </div>
    </div>

    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="repayment-accounts-modal.js"></script>
    <script>
        // Window Controls
        function notifyParentFormOpened() {
            window.parent.postMessage({ type: 'submoduleOpened', source: 'Repayment Accounts' }, '*');
        }
        function closeChildForm() {
            window.parent.postMessage({ type: 'submoduleClosed' }, '*');
            window.close();
        }
        function handleWindowAction(action) {
            if (action === 'refresh') {
                location.reload();
            } else if (action === 'maximize') {
                window.parent.postMessage({ type: 'toggleSidebarForMaximize' }, '*');
            } else if (action === 'close') {
                closeChildForm();
            }
        }
        function initWindowControls() {
            document.querySelectorAll('.am-header__right [data-action]').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (['refresh', 'maximize', 'close'].includes(action)) {
                    btn.addEventListener('click', () => handleWindowAction(action));
                }
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            initWindowControls();
            notifyParentFormOpened();
        });
    </script>
</body>
</html>
