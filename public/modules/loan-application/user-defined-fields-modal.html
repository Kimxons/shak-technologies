<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Defined Fields</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=20260204">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .window { height: 100%; display: flex; flex-direction: column; }
        .main-container { flex: 1; overflow: auto; }
    </style>
</head>
<body>
    <div class="window">
        <div class="am-header" role="banner" aria-label="Window title bar">
            <div class="am-header__left">
                <i class="bi bi-ui-checks-grid am-header__icon" aria-hidden="true"></i>
                <span class="am-header__title">User Defined Fields - Loan</span>
            </div>
            <div class="am-header__right" role="toolbar" aria-label="Window controls">
                <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
                <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <main class="main-container" aria-label="User Defined Fields form">
            <div class="form-content" role="region" aria-label="User Defined Fields form">
                <div class="form-card" data-main-form>
                    <!-- Custom Fields Section -->
                    <div class="form-section" data-section="custom-fields">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-ui-checks-grid"></i>Custom Fields</span>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="field1">Field 1</label>
                                    <input type="text" id="field1" class="bs-input-text form-control">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="field2">Field 2</label>
                                    <input type="text" id="field2" class="bs-input-text form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="field3">Field 3</label>
                                    <input type="text" id="field3" class="bs-input-text form-control">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="field4">Field 4</label>
                                    <input type="text" id="field4" class="bs-input-text form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="field5">Field 5</label>
                                    <input type="text" id="field5" class="bs-input-text form-control">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="field6">Field 6</label>
                                    <input type="text" id="field6" class="bs-input-text form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="field7">Field 7</label>
                                    <select id="field7" class="bs-input-text form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="field8">Field 8</label>
                                    <select id="field8" class="bs-input-text form-control">
                                        <option value="">--Select--</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="field9">Field 9</label>
                                    <input type="date" id="field9" class="bs-input-text form-control">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="field10">Field 10</label>
                                    <input type="date" id="field10" class="bs-input-text form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="field11">Field 11</label>
                                    <input type="number" id="field11" class="bs-input-text form-control" step="0.01">
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="field12">Field 12</label>
                                    <input type="number" id="field12" class="bs-input-text form-control" step="0.01">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col" style="grid-column: 1 / -1;">
                                    <label class="label-blue" for="field13">Field 13 (Notes)</label>
                                    <textarea id="field13" class="bs-input-text form-control" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col" style="grid-column: 1 / -1;">
                                    <label class="label-blue" for="field14">Field 14 (Notes)</label>
                                    <textarea id="field14" class="bs-input-text form-control" rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Behind The Scene Section -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-info-circle"></i>Behind The Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row">
                                <div class="col">
                                    <label class="label-blue" for="applicationStatus">Application Status</label>
                                    <input type="text" id="applicationStatus" class="bs-input-text form-control" readonly>
                                </div>
                                <div class="col"></div>
                            </div>
                            <div class="audit-section audit-section--summary">
                                <div class="audit-cell">
                                    <span class="audit-label">Created By</span>
                                    <span class="audit-value" id="createdBy" data-field="createdBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified By</span>
                                    <span class="audit-value" id="modifiedBy" data-field="modifiedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised By</span>
                                    <span class="audit-value" id="supervisedBy" data-field="supervisedBy"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Created On</span>
                                    <span class="audit-value" id="createdOn" data-field="createdOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Modified On</span>
                                    <span class="audit-value" id="modifiedOn" data-field="modifiedOn"></span>
                                </div>
                                <div class="audit-cell">
                                    <span class="audit-label">Supervised On</span>
                                    <span class="audit-value" id="supervisedOn" data-field="supervisedOn"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-panel" aria-label="Form actions">        
                <div class="action-buttons">
                    <button class="btn-action btn-view" type="button" data-action="view" id="viewBtn"><i class="bi bi-eye me-1"></i>View</button>          
                    <button class="btn-action" type="button" data-action="edit" id="editBtn"><i class="bi bi-pencil-square me-1"></i>Edit</button>
                    <button class="btn-action btn-save" type="button" data-action="save" id="saveBtn"><i class="bi bi-check-lg me-1"></i>Save</button>
                    <button class="btn-action btn-cancel" type="button" data-action="cancel" id="cancelBtn"><i class="bi bi-x-lg me-1"></i>Cancel</button>          
                </div>
            </div>
        </main>

        <div class="am-message-panel" role="alert" aria-live="polite">
            <i class="bi bi-info-circle"></i>
            <span></span>
        </div>    

        <div class="loading-overlay" id="loadingOverlay" hidden>
            <div class="loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading...</span></div>
        </div>
    </div>

    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="user-defined-fields-modal.js"></script>
    <script>
        // Window Controls
        function notifyParentFormOpened() {
            window.parent.postMessage({ type: 'submoduleOpened', source: 'User Defined Fields' }, '*');
        }
        function closeChildForm() {
            window.parent.postMessage({ type: 'submoduleClosed' }, '*');
            window.close();
        }
        function handleWindowAction(action) {
            if (action === 'refresh') {
                location.reload();
            } else if (action === 'maximize') {
                window.parent.postMessage({ type: 'toggleSidebarForMaximize' }, '*');
            } else if (action === 'close') {
                closeChildForm();
            }
        }
        function initWindowControls() {
            document.querySelectorAll('.am-header__right [data-action]').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (['refresh', 'maximize', 'close'].includes(action)) {
                    btn.addEventListener('click', () => handleWindowAction(action));
                }
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            initWindowControls();
            notifyParentFormOpened();
        });
    </script>
</body>
</html>
