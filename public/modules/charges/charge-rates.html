<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charge Rates</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="charge-rates" data-close-modal="chargeRatesModal">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-percent am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Charge Rates</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Charge Rates form">
        <div class="form-card" data-main-form>
          <form id="chargeRatesForm" autocomplete="off" novalidate>
            <div class="form-section" data-section="period">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-calendar-range"></i>Charge Rates Configuration</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Charge Rates Configuration" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="effectiveDate">Effective Date</label>
                    <input type="date" id="effectiveDate" name="effectiveDate" class="bs-input-text" required />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="expiryDate">Expiry Date</label>
                    <input type="date" id="expiryDate" name="expiryDate" class="bs-input-text" />
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="settings">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-sliders"></i>Charge Settings</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Charge Settings" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="ceilingAmountType">Ceiling Amount Type</label>
                    <select id="ceilingAmountType" name="ceilingAmountType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="fixed">Fixed</option>
                      <option value="range">Range</option>
                      <option value="unlimited">Unlimited</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="ceilingAmount">Ceiling Amount</label>
                    <input type="number" id="ceilingAmount" name="ceilingAmount" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="calculationMethod">Calculation Method</label>
                    <select id="calculationMethod" name="calculationMethod" class="bs-select" required>
                      <option value="">--Select--</option>
                      <option value="fixed">Fixed Amount</option>
                      <option value="percentage">Percentage</option>
                      <option value="tiered">Tiered</option>
                      <option value="slab">Slab Based</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="chargeValue">Charge Value</label>
                    <input type="number" id="chargeValue" name="chargeValue" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="minCharge">Minimum Charge</label>
                    <input type="number" id="minCharge" name="minCharge" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="maximumCharge">Maximum Charge</label>
                    <input type="number" id="maximumCharge" name="maximumCharge" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="fixedAmount">Fixed Amount</label>
                    <input type="number" id="fixedAmount" name="fixedAmount" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="rateType">Rate Type</label>
                    <select id="rateType" name="rateType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="flat">Flat Rate</option>
                      <option value="graduated">Graduated</option>
                      <option value="compound">Compound</option>
                    </select>
                  </div>
                </div>

                <div class="row g-2" role="group" aria-label="Rate settings">
                  <div class="col-12 col-sm-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="applyMinimum" name="applyMinimum" />
                      <label class="form-check-label" for="applyMinimum">Apply Minimum</label>
                    </div>
                  </div>
                  <div class="col-12 col-sm-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="applyMaximum" name="applyMaximum" />
                      <label class="form-check-label" for="applyMaximum">Apply Maximum</label>
                    </div>
                  </div>
                  <div class="col-12 col-sm-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="proRated" name="proRated" />
                      <label class="form-check-label" for="proRated">Pro-Rated</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="records">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-table"></i>Charge Rate Records</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Charge Rate Records" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0">
                    <thead>
                      <tr>
                        <th>Ceiling Amount</th>
                        <th>Minimum Charge</th>
                        <th>Maximum Charge</th>
                        <th>Calculation Method</th>
                        <th>Value</th>
                        <th>Fixed Amount</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody id="ratesTableBody">
                      <tr>
                        <td colspan="7" class="text-muted">No records to display. Backend connection required.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="audit">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row three-col">
                  <div class="col"><label class="label-blue" for="createdBy">Created By</label><input type="text" id="createdBy" name="createdBy" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="modifiedBy">Modified By</label><input type="text" id="modifiedBy" name="modifiedBy" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="supervisedBy">Supervised By</label><input type="text" id="supervisedBy" name="supervisedBy" class="bs-input-text" readonly /></div>
                </div>
                <div class="form-row three-col">
                  <div class="col"><label class="label-blue" for="createdOn">Created On</label><input type="text" id="createdOn" name="createdOn" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="modifiedOn">Modified On</label><input type="text" id="modifiedOn" name="modifiedOn" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="supervisedOn">Supervised On</label><input type="text" id="supervisedOn" name="supervisedOn" class="bs-input-text" readonly /></div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <aside class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view" title="View"><i class="bi bi-eye"></i>View</button>
          <button type="button" class="btn-action" data-action="add" title="Add"><i class="bi bi-plus-circle"></i>Add</button>
          <button type="button" class="btn-action" data-action="edit" title="Edit"><i class="bi bi-pencil"></i>Edit</button>
          <button type="button" class="btn-action" data-action="delete" title="Delete"><i class="bi bi-trash"></i>Delete</button>
          <button type="button" class="btn-action btn-save" data-action="save" title="Save"><i class="bi bi-check-circle"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel" title="Cancel"><i class="bi bi-x-circle"></i>Cancel</button>
          <button type="button" class="btn-action" data-action="close" title="Close"><i class="bi bi-x-lg"></i>Close</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" id="statusMessage" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="charge-rates.js"></script>
</body>
</html>
