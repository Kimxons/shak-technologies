<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exemption Settings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="exemption-settings" data-close-modal="exemptionModal">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-shield-check am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Exemption Settings</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Exemption Settings form">
        <div class="form-card" data-main-form>
          <form id="exemptionForm" autocomplete="off" novalidate>
            <div class="form-section" data-section="period">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-calendar-range"></i>Exemption Period</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Exemption Period" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="effectiveDate">Effective Date</label>
                    <input type="date" id="effectiveDate" name="effectiveDate" class="bs-input-text" required />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="expiryDate">Expiry Date</label>
                    <input type="date" id="expiryDate" name="expiryDate" class="bs-input-text" />
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="exemption">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-sliders"></i>Exemption Setting</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Exemption Setting" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="row g-3 align-items-end">
                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="exempted" name="exempted" />
                      <label class="form-check-label" for="exempted">Exempted</label>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <label class="label-blue" for="balanceType">Balance Type</label>
                    <select id="balanceType" name="balanceType" class="bs-select">
                      <option value="average">Average Bal</option>
                      <option value="minimum">Minimum Balance</option>
                      <option value="maximum">Maximum Balance</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="label-blue" for="balancePeriod">Period</label>
                    <select id="balancePeriod" name="balancePeriod" class="bs-select">
                      <option value="monthly">Monthly</option>
                      <option value="daily">Daily</option>
                      <option value="weekly">Weekly</option>
                      <option value="quarterly">Quarterly</option>
                      <option value="yearly">Yearly</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="label-blue" for="fixedAmount">Fixed Amount</label>
                    <input type="number" id="fixedAmount" name="fixedAmount" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>

                  <div class="col-12 mt-2">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="freeTransaction" name="freeTransaction" />
                      <label class="form-check-label" for="freeTransaction">Free Transaction</label>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <label class="label-blue" for="transactionType">Type</label>
                    <select id="transactionType" name="transactionType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="count">Count Based</option>
                      <option value="amount">Amount Based</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="label-blue" for="transactionPeriod">Period</label>
                    <select id="transactionPeriod" name="transactionPeriod" class="bs-select">
                      <option value="monthly">Monthly</option>
                      <option value="daily">Daily</option>
                      <option value="weekly">Weekly</option>
                      <option value="quarterly">Quarterly</option>
                      <option value="yearly">Yearly</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="label-blue" for="transactionValue">Value</label>
                    <input type="number" id="transactionValue" name="transactionValue" class="bs-input-text" step="1" placeholder="0" />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="label-blue" for="exemptedDays">Exempted Days</label>
                    <select id="exemptedDays" name="exemptedDays" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="monday">Monday</option>
                      <option value="tuesday">Tuesday</option>
                      <option value="wednesday">Wednesday</option>
                      <option value="thursday">Thursday</option>
                      <option value="friday">Friday</option>
                      <option value="saturday">Saturday</option>
                      <option value="sunday">Sunday</option>
                      <option value="weekdays">Weekdays</option>
                      <option value="weekends">Weekends</option>
                      <option value="all">All Days</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="audit">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row three-col">
                  <div class="col"><label class="label-blue" for="createdBy">Created By</label><input type="text" id="createdBy" name="createdBy" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="modifiedBy">Modified By</label><input type="text" id="modifiedBy" name="modifiedBy" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="supervisedBy">Supervised By</label><input type="text" id="supervisedBy" name="supervisedBy" class="bs-input-text" readonly /></div>
                </div>
                <div class="form-row three-col">
                  <div class="col"><label class="label-blue" for="createdOn">Created On</label><input type="text" id="createdOn" name="createdOn" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="modifiedOn">Modified On</label><input type="text" id="modifiedOn" name="modifiedOn" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="supervisedOn">Supervised On</label><input type="text" id="supervisedOn" name="supervisedOn" class="bs-input-text" readonly /></div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <aside class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view" title="View"><i class="bi bi-eye"></i>View</button>
          <button type="button" class="btn-action" data-action="add" title="Add"><i class="bi bi-plus-circle"></i>Add</button>
          <button type="button" class="btn-action" data-action="edit" title="Edit"><i class="bi bi-pencil"></i>Edit</button>
          <button type="button" class="btn-action" data-action="delete" title="Delete"><i class="bi bi-trash"></i>Delete</button>
          <button type="button" class="btn-action btn-save" data-action="save" title="Save"><i class="bi bi-check-circle"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel" title="Cancel"><i class="bi bi-x-circle"></i>Cancel</button>
          <button type="button" class="btn-action" data-action="close" title="Close"><i class="bi bi-x-lg"></i>Close</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" id="statusMessage" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="exemption-settings.js"></script>
</body>
</html>
