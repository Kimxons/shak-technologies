<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charge GL Interface</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body data-page="charge-gl-interface" data-close-modal="chargeGlModal">
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-diagram-3 am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Charge GL Interface</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Charge GL Interface form">
        <div class="form-card" data-main-form>
          <form id="glInterfaceForm" autocomplete="off" novalidate>
            <div class="form-section" data-section="period">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-calendar-range"></i>GL Interface Period</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle GL Interface Period" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="effectiveDate">Effective Date</label>
                    <input type="date" id="effectiveDate" name="effectiveDate" class="bs-input-text" required />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="expiryDate">Expiry Date</label>
                    <input type="date" id="expiryDate" name="expiryDate" class="bs-input-text" />
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="config">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-gear"></i>GL Interface Configuration</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle GL Interface Configuration" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="accountType">Account Type</label>
                    <select id="accountType" name="accountType" class="bs-select">
                      <option value="customer">Customer</option>
                      <option value="gl">GL Account</option>
                      <option value="internal">Internal Account</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="taxId">Tax ID</label>
                    <select id="taxId" name="taxId" class="bs-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="glAccountId">GL Account ID</label>
                    <div class="kairo-control">
                      <input type="text" id="glAccountId" name="glAccountId" class="kairo-control__id" />
                      <button type="button" class="btn-lookup kairo-control__lookup" data-action="searchGlAccount" aria-label="Search GL Account" title="Search"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="transactionId">Transaction ID</label>
                    <div class="kairo-control">
                      <input type="text" id="transactionId" name="transactionId" class="kairo-control__id" />
                      <button type="button" class="btn-lookup kairo-control__lookup" data-action="searchTransaction" aria-label="Search Transaction" title="Search"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="accountTagId">Account Tag ID</label>
                    <select id="accountTagId" name="accountTagId" class="bs-select">
                      <option value="">--Select--</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="calculationMethod">Calculation Method</label>
                    <select id="calculationMethod" name="calculationMethod" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="fixed">Fixed Amount</option>
                      <option value="percentage">Percentage</option>
                      <option value="tiered">Tiered</option>
                    </select>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="percentage">Percentage</label>
                    <input type="number" id="percentage" name="percentage" class="bs-input-text" step="0.01" placeholder="0.00" />
                  </div>
                  <div class="col">
                    <label class="label-blue" for="narration">Narration</label>
                    <textarea id="narration" name="narration" class="bs-input-text" rows="2"></textarea>
                  </div>
                </div>

                <div class="row g-2" role="group" aria-label="Reversal configuration">
                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="changeCashGlWhenReversed" name="changeCashGlWhenReversed" />
                      <label class="form-check-label" for="changeCashGlWhenReversed">Change Cash GL When Reversed</label>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" for="reversalGlAccount">Reversal GL Account</label>
                    <div class="kairo-control">
                      <input type="text" id="reversalGlAccount" name="reversalGlAccount" class="kairo-control__id" />
                      <button type="button" class="btn-lookup kairo-control__lookup" data-action="searchGlAccount" aria-label="Search GL Account" title="Search"><i class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" for="reversalNarration">Reversal Narration</label>
                    <textarea id="reversalNarration" name="reversalNarration" class="bs-input-text" rows="2"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="records">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-table"></i>GL Interface Records</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle GL Interface Records" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0">
                    <thead>
                      <tr>
                        <th>GL Account ID</th>
                        <th>GL Account</th>
                        <th>GL Trx Description ID</th>
                        <th>GL Description</th>
                        <th>Calculation Method</th>
                        <th>Value</th>
                        <th>Fixed Amount</th>
                      </tr>
                    </thead>
                    <tbody id="glInterfaceTableBody">
                      <tr>
                        <td colspan="7" class="text-muted">No records to display. Backend connection required.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="form-section" data-section="audit">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history"></i>Behind The Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true"><i class="bi bi-chevron-up"></i></button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row three-col">
                  <div class="col"><label class="label-blue" for="createdBy">Created By</label><input type="text" id="createdBy" name="createdBy" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="modifiedBy">Modified By</label><input type="text" id="modifiedBy" name="modifiedBy" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="supervisedBy">Supervised By</label><input type="text" id="supervisedBy" name="supervisedBy" class="bs-input-text" readonly /></div>
                </div>
                <div class="form-row three-col">
                  <div class="col"><label class="label-blue" for="createdOn">Created On</label><input type="text" id="createdOn" name="createdOn" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="modifiedOn">Modified On</label><input type="text" id="modifiedOn" name="modifiedOn" class="bs-input-text" readonly /></div>
                  <div class="col"><label class="label-blue" for="supervisedOn">Supervised On</label><input type="text" id="supervisedOn" name="supervisedOn" class="bs-input-text" readonly /></div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <aside class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view" title="View"><i class="bi bi-eye"></i>View</button>
          <button type="button" class="btn-action" data-action="add" title="Add"><i class="bi bi-plus-circle"></i>Add</button>
          <button type="button" class="btn-action" data-action="edit" title="Edit"><i class="bi bi-pencil"></i>Edit</button>
          <button type="button" class="btn-action" data-action="delete" title="Delete"><i class="bi bi-trash"></i>Delete</button>
          <button type="button" class="btn-action btn-save" data-action="save" title="Save"><i class="bi bi-check-circle"></i>Save</button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel" title="Cancel"><i class="bi bi-x-circle"></i>Cancel</button>
          <button type="button" class="btn-action" data-action="close" title="Close"><i class="bi bi-x-lg"></i>Close</button>
        </div>
      </aside>
    </main>

    <div class="am-message-panel" id="statusMessage" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="charge-gl-interface.js"></script>
</body>
</html>
