<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charge Collection · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="charge-collection.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="chargeCollectionForm" autocomplete="off">

                    <!-- View / Selection Section -->
                    <div class="section-header">SELECTION CRITERIA</div>
                    <div class="form-row two-col">
                        <div class="col">
                            <label for="collectionType" class="label-blue">Collection Type</label>
                            <select id="collectionType">
                                <option value="Group">Group</option>
                                <option value="Individual">Individual</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="serialId" class="label-blue">Serial ID</label>
                            <input type="text" id="serialId" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="centerId">Center ID</label>
                        <input type="text" id="centerId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="clientId">Client ID</label>
                        <input type="text" id="clientId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="currencyId" class="label-blue">Currency ID</label>
                        <input type="text" id="currencyId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="chargeId" class="label-blue">Charge ID</label>
                        <input type="text" id="chargeId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row" style="justify-content: flex-end; margin-top: 5px;">
                        <button type="button" class="btn-action"
                            style="width: auto; padding: 4px 12px; margin-right: 8px;" id="btnProceed">Proceed</button>
                        <button type="button" class="btn-action" style="width: auto; padding: 4px 12px;"
                            id="btnRecalculate">Re-Calculate</button>
                    </div>

                    <!-- Charge List Section -->
                    <div class="section-header">CHARGE LIST</div>
                    <div class="table-container">
                        <table class="modern-table" id="chargeTable">
                            <thead>
                                <tr>
                                    <th style="width: 30px; text-align: center;"><input type="checkbox" id="selectAll">
                                    </th>
                                    <th>ClientID</th>
                                    <th>Client Name</th>
                                    <th>ApplicationID</th>
                                    <th>Due Date</th>
                                    <th style="text-align: right;">Charge Amt</th>
                                    <th style="text-align: right;">Tax Amt</th>
                                    <th style="text-align: right;">Cess Amt</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="8" style="text-align: center; color: var(--text-gray); padding: 15px;">
                                        No records to display.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="form-row" style="justify-content: flex-end;">
                        <label for="totalAmount" style="min-width: auto; margin-right: 10px;">Total Amount</label>
                        <input type="text" id="totalAmount" class="money-field" style="width: 150px;" readonly />
                    </div>

                    <!-- Recommendation Details Section -->
                    <div class="section-header">RECOMMENDATION DETAILS</div>
                    <div class="form-row two-col">
                        <div class="col">
                            <label for="chargeCollected" class="label-blue">Charge Collected</label>
                            <input type="text" id="chargeCollected" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="valueDate" class="label-blue">Value Date</label>
                            <select id="valueDate">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="transactionType" class="label-blue">Transaction Type</label>
                            <select id="transactionType">
                                <option value="Transfer">Transfer</option>
                                <option value="Cash">Cash</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="till">Till</label>
                            <input type="text" id="till" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="accountType">Account Type</label>
                            <select id="accountType">
                                <option value="Customer">Customer</option>
                                <option value="GL">GL</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="referenceNo">Reference No.</label>
                            <input type="text" id="referenceNo" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="contraBranchId">Contra Branch ID</label>
                        <input type="text" id="contraBranchId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="contraAccountId">Contra Account ID</label>
                        <input type="text" id="contraAccountId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="accountCurrencyId">Account Currency ID</label>
                        <input type="text" id="accountCurrencyId" class="input-full" />
                    </div>

                    <div class="form-row">
                        <label for="narration" class="label-blue">Narration</label>
                        <textarea id="narration" class="input-full" rows="1"></textarea>
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view-all"><i
                            class="fa-solid fa-list me-2"></i>View All</button>
                    <button type="button" class="btn-action" data-action="denomination" disabled><i
                            class="fa-solid fa-coins me-2"></i>Denomination</button>
                    <button type="button" class="btn-action" data-action="print" disabled><i
                            class="fa-solid fa-print me-2"></i>Print</button>

                    <button type="button" class="btn-action" data-action="view" style="margin-top: 20px;"><i
                            class="fa-solid fa-eye me-2"></i>View</button>
                    <button type="button" class="btn-action" data-action="add"><i
                            class="fa-solid fa-plus-circle me-2"></i>Add</button>
                    <button type="button" class="btn-action" data-action="delete" disabled><i
                            class="fa-solid fa-trash-can me-2"></i>Delete</button>
                    <button type="button" class="btn-action" data-action="save" disabled><i
                            class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                    <button type="button" class="btn-action" data-action="cancel" disabled><i
                            class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="charge-collection.js"></script>
</body>

</html>
