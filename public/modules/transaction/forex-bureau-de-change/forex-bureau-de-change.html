<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forex - Bureau De Change · Transaction</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="forex-bureau-de-change.css" />
</head>

<body class="modern-blue-theme">
  <div class="window">
    <div class="main-container">
      <main class="form-content">
        <form id="forexForm" autocomplete="off">
          <!-- Transaction Details Section -->
          <div class="section-header">TRANSACTION DETAILS</div>
          <div class="form-row two-col">
            <div class="col">
              <label for="transaction" class="label-blue">Transaction</label>
              <select id="transaction">
                <option value="Buying">Buying</option>
                <option value="Selling">Selling</option>
              </select>
            </div>
            <div class="col">
              <label for="serialID">Serial ID</label>
              <input type="text" id="serialID" />
            </div>
          </div>

          <div class="form-row">
            <label for="cashOrTc" class="label-blue">Cash Or TC</label>
            <select id="cashOrTc" class="input-full">
              <option value="Cash">Cash</option>
              <option value="TC">TC</option>
            </select>
          </div>

          <div class="form-row">
            <label for="agentTrx">Agent Trx</label>
            <input type="checkbox" id="agentTrx" class="checkbox" />
          </div>

          <div class="form-row">
            <label for="currencyId" class="label-blue">Currency ID</label>
            <input type="text" id="currencyId" class="input-full" />
            <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>

          <div class="form-row">
            <label for="glAccountId" class="label-blue">GL Account ID</label>
            <input type="text" id="glAccountId" class="input-full" />
            <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>

          <div class="form-row two-col">
            <div class="col">
              <label for="amount" class="label-blue">Amount</label>
              <input type="text" id="amount" class="money-field" />
            </div>
            <div class="col">
              <label for="rate" class="label-blue">Rate</label>
              <input type="text" id="rate" class="money-field" />
            </div>
          </div>

          <div class="form-row">
            <label for="localAmount">Local Amount</label>
            <input type="text" id="localAmount" class="money-field input-full" readonly />
          </div>

          <div class="form-row">
            <label for="waiveCharges">Waive Charges</label>
            <input type="checkbox" id="waiveCharges" class="checkbox" />
          </div>

          <div class="form-row">
            <label for="charges">Charges</label>
            <div class="input-group-custom">
              <input type="text" id="charges" class="money-field" />
              <span class="input-suffix">USD</span>
            </div>
          </div>

          <div class="form-row">
            <label for="netAmount" class="label-blue">Net Amount</label>
            <input type="text" id="netAmount" class="money-field input-full" readonly />
          </div>

          <!-- Transfer & Details Section -->
          <div class="section-header">TRANSFER & ADDITIONAL DETAILS</div>
          <div class="form-row two-col">
            <div class="col">
              <label for="byTransfer">By Transfer</label>
              <input type="checkbox" id="byTransfer" class="checkbox" />
            </div>
            <div class="col">
              <label for="tillId">Till ID</label>
              <input type="text" id="tillId" />
              <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
          </div>

          <div class="form-row">
            <label for="accountType" class="label-blue">Account Type</label>
            <select id="accountType" class="input-full">
              <option value="Customer">Customer</option>
              <option value="GL">GL</option>
            </select>
          </div>

          <div class="form-row">
            <label for="transferBranchId">Transfer BranchID</label>
            <input type="text" id="transferBranchId" class="input-full" />
            <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>

          <div class="form-row">
            <label for="transferAccountId">Transfer AccountID</label>
            <input type="text" id="transferAccountId" class="input-full" />
            <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>

          <div class="form-row">
            <label for="transferCurrencyId">Transfer CurrencyID</label>
            <input type="text" id="transferCurrencyId" class="input-full" />
            <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>

          <div class="form-row two-col">
            <div class="col">
              <label for="chequeId">Cheque ID</label>
              <input type="text" id="chequeId" />
            </div>
            <div class="col">
              <label for="bank">Bank</label>
              <input type="text" id="bank" />
            </div>
          </div>

          <div class="form-row">
            <label for="narration">Narration</label>
            <textarea id="narration" class="input-full" rows="2"></textarea>
          </div>

          <!-- Identification Section -->
          <div class="section-header">IDENTIFICATION & CUSTOMER INFO</div>
          <div class="form-row two-col">
            <div class="col">
              <label for="identificationType" class="label-blue">Identification Type</label>
              <select id="identificationType">
                <option value="">--Select--</option>
                <option value="Passport">Passport</option>
                <option value="National ID">National ID</option>
              </select>
            </div>
            <div class="col">
              <label for="mobile" class="label-blue">Mobile</label>
              <input type="text" id="mobile" />
            </div>
          </div>

          <div class="form-row two-col">
            <div class="col">
              <label for="passportId">Passport/ ID</label>
              <input type="text" id="passportId" />
            </div>
            <div class="col">
              <label for="nationality" class="label-blue">Nationality</label>
              <input type="text" id="nationality" />
            </div>
          </div>

          <div class="form-row two-col">
            <div class="col">
              <label for="name">Name</label>
              <input type="text" id="name" />
            </div>
            <div class="col">
              <label for="permitRef">Permit/Declaration Ref</label>
              <input type="text" id="permitRef" />
            </div>
          </div>

          <div class="form-row">
            <label for="address">Address</label>
            <textarea id="address" class="input-full" rows="2"></textarea>
          </div>

          <div class="form-row two-col">
            <div class="col">
              <label for="ticketRef">Ticket / Reference No</label>
              <input type="text" id="ticketRef" />
            </div>
            <div class="col">
              <label for="travelDate">Travel Date</label>
              <input type="date" id="travelDate" />
            </div>
          </div>

          <div class="audit-info">
            <span id="statusMessage" class="text-danger"></span>
          </div>
        </form>
      </main>

      <aside class="action-panel">
        <div class="action-buttons">
          <button type="button" class="btn-action" data-action="account-info"><i
              class="fa-solid fa-circle-info me-2"></i>Account Info</button>
          <button type="button" class="btn-action" data-action="view-all"><i class="fa-solid fa-list me-2"></i>View
            All</button>
          <button type="button" class="btn-action" data-action="denomination"><i
              class="fa-solid fa-coins me-2"></i>Denomination</button>
          <button type="button" class="btn-action" data-action="print"><i
              class="fa-solid fa-print me-2"></i>Print</button>

          <button type="button" class="btn-action" data-action="view" style="margin-top: 20px;"><i
              class="fa-solid fa-eye me-2"></i>View</button>
          <button type="button" class="btn-action" data-action="add"><i
              class="fa-solid fa-plus-circle me-2"></i>Add</button>
          <button type="button" class="btn-action" data-action="delete"><i
              class="fa-solid fa-trash-can me-2"></i>Delete</button>
          <button type="button" class="btn-action" data-action="save" disabled><i
              class="fa-solid fa-floppy-disk me-2"></i>Save</button>
          <button type="button" class="btn-action" data-action="cancel" disabled><i
              class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
        </div>
      </aside>
    </div>
  </div>

  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="forex-bureau-de-change.js"></script>
</body>

</html>
