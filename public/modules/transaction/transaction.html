<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transaction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <div class="container-fluid py-3">

      <aside class="col-12 col-lg-3" aria-label="Sidebar">
        <div class="card">
          <div class="card-header">Transaction</div>
          <div class="list-group list-group-flush">
            <button id="menu-forex" type="button" class="list-group-item list-group-item-action">
              Forex-Bureau de exchange
            </button>
            <button id="menu-cash-transaction" type="button" class="list-group-item list-group-item-action">
              Cash Transaction
            </button>
            <button id="menu-cash-transaction-test" type="button" class="list-group-item list-group-item-action">
              Cash Transaction (Test)
            </button>
            <button id="menu-transfer-transactions" type="button" class="list-group-item list-group-item-action">
              Transfer Transactions
            </button>
          </div>
        </div>
      </aside>

      <main class="col-12 col-lg-9" aria-label="Main Content">
        <div id="content" class="card">
          <div class="card-body">
            <p class="mb-0">Select a menu item.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../assets/js/pages/transaction/transaction.embedded.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
