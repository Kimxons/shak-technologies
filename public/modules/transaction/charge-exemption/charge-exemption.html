<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charge Exemption · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="charge-exemption.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="chargeExemptionForm" autocomplete="off">

                    <div class="form-row" style="margin-bottom: 15px;">
                        <label for="type" class="label-blue">Type</label>
                        <select id="type" style="width: 200px;">
                            <option value="Group">Group</option>
                            <option value="Individual">Individual</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="centerId">Center ID</label>
                        <input type="text" id="centerId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="clientId">Client ID</label>
                        <input type="text" id="clientId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="chargeId">Charge ID</label>
                        <input type="text" id="chargeId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="section-header">CHARGE LIST</div>
                    <div class="table-container">
                        <table class="modern-table" id="chargeListTable">
                            <thead>
                                <tr>
                                    <th style="width: 30px; text-align: center;"><input type="checkbox" id="selectAll">
                                    </th>
                                    <th>Client ID</th>
                                    <th>Client Name</th>
                                    <th>Account ID</th>
                                    <th>Application ID</th>
                                    <th style="text-align: right;">Charge Amount</th>
                                    <th style="text-align: right;">Tax Amount</th>
                                    <th style="text-align: right;">Cess Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="8" style="text-align: center; color: var(--text-gray); padding: 50px;">
                                        No records to display.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="section-header">EXEMPTION DETAILS</div>
                    <div class="form-row">
                        <label for="reason">Reason</label>
                        <input type="text" id="reason" class="input-full" />
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view"><i
                            class="fa-solid fa-eye me-2"></i>View</button>
                    <button type="button" class="btn-action" data-action="edit" disabled><i
                            class="fa-solid fa-pencil-square me-2"></i>Edit</button>
                    <button type="button" class="btn-action" data-action="save" disabled><i
                            class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                    <button type="button" class="btn-action" data-action="cancel" disabled><i
                            class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="charge-exemption.js"></script>
</body>

</html>
