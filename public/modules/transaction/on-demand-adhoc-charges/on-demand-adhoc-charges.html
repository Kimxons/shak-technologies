<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>On Demand (Adhoc) Charges · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="on-demand-adhoc-charges.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="adhocChargesForm" autocomplete="off">

                    <!-- Details Section -->
                    <div class="section-header-top-bar"></div>

                    <div class="form-row justify-content-end" style="margin-top: 5px;">
                        <label for="serialId" class="label-blue" style="min-width: unset;">Serial ID</label>
                        <input type="text" id="serialId" style="width: 150px;" />
                    </div>

                    <div class="form-row">
                        <label for="branchNo" class="label-blue">Branch ID</label>
                        <input type="text" id="branchNo" style="width: 80px;" value="0325" />
                        <input type="text" id="branchName" class="input-full" value="Tillil" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="chargeId" class="label-blue">Charge ID</label>
                        <input type="text" id="chargeId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="accountId" class="label-blue">Account ID</label>
                        <input type="text" id="accountId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="chargeAmount" style="font-weight: 700;">Charge Amount</label>
                            <input type="text" id="chargeAmount" class="money-field input-full" />
                        </div>
                        <div class="col">
                            <label for="multiplierFactor" style="font-weight: 700;">Multiplier Factor</label>
                            <input type="text" id="multiplierFactor" class="input-full" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="narrative">Customer Narration</label>
                        <input type="text" id="narrative" class="input-full" />
                    </div>

                    <!-- List Section -->
                    <div class="table-container" style="margin-top: 20px;">
                        <table class="modern-table">
                            <thead>
                                <tr>
                                    <th>ChargeID</th>
                                    <th>ClientID</th>
                                    <th>AccountID</th>
                                    <th>ClientName</th>
                                    <th>ChargeAmount</th>
                                    <th>TaxAmount</th>
                                    <th>CessAmount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="7" style="text-align: center; color: var(--text-gray); padding: 50px;">
                                        No records to display.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- BTS Section -->
                    <div class="section-header">Behind The Scene</div>
                    <div class="bts-grid">
                        <div class="bts-col">
                            <div class="bts-row">
                                <label>Created By</label>
                                <input type="text" readonly />
                            </div>
                            <div class="bts-row">
                                <label>Created On</label>
                                <input type="text" readonly />
                            </div>
                        </div>
                        <div class="bts-col">
                            <div class="bts-row">
                                <label>Modified By</label>
                                <input type="text" readonly />
                            </div>
                            <div class="bts-row">
                                <label>Modified On</label>
                                <input type="text" readonly />
                            </div>
                        </div>
                        <div class="bts-col">
                            <div class="bts-row">
                                <label>Supervised By</label>
                                <input type="text" readonly />
                            </div>
                            <div class="bts-row">
                                <label>Supervised On</label>
                                <input type="text" readonly />
                            </div>
                        </div>
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view-all"><i
                            class="fa-solid fa-list me-2"></i>View All</button>

                    <div style="margin-top: 150px;" class="d-flex flex-column gap-1">
                        <button type="button" class="btn-action" data-action="view"><i
                                class="fa-solid fa-eye me-2"></i>View</button>
                        <button type="button" class="btn-action" data-action="add"><i
                                class="fa-solid fa-plus-circle me-2"></i>Add</button>
                        <button type="button" class="btn-action" data-action="delete" disabled><i
                                class="fa-solid fa-trash-can me-2"></i>Delete</button>
                        <button type="button" class="btn-action" data-action="save" disabled><i
                                class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                        <button type="button" class="btn-action" data-action="cancel" disabled><i
                                class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="on-demand-adhoc-charges.js"></script>
</body>

</html>
