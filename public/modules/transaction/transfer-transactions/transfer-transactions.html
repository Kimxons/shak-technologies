<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transfer Transactions · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="transfer-transactions.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="transferTransactionsForm" autocomplete="off">

                    <!-- Transaction Details Section -->
                    <div class="section-header">TRANSACTION DETAILS</div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="transferType" class="label-blue">Transfer Type</label>
                            <select id="transferType">
                                <option value="local">Local</option>
                                <option value="foreign">Foreign</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="serialId" class="label-blue">Serial ID</label>
                            <input type="text" id="serialId" readonly />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="transactionType">Transaction Type</label>
                            <select id="transactionType">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="accountType">Account Type</label>
                            <select id="accountType">
                                <option value="customer">Customer</option>
                                <option value="non-customer">Non-Customer</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="branchNo">Branch ID</label>
                        <input type="text" id="branchNo" style="width: 80px;" value="0325" />
                        <input type="text" id="branchName" class="input-full" value="Tillil" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="crossCurrency">Cross Currency</label>
                            <input type="checkbox" id="crossCurrency" class="checkbox" />
                        </div>
                        <div class="col">
                            <label for="liquidationOption">Liquidation Option</label>
                            <select id="liquidationOption">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="accountId">Account ID</label>
                        <input type="text" id="accountId" style="width: 150px;" />
                        <input type="text" id="accountName" class="input-full" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="costCenterId">CostCenter ID</label>
                        <input type="text" id="costCenterId" style="width: 150px;" />
                        <input type="text" id="costCenterName" class="input-full" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="valueDate">Value Date</label>
                            <input type="date" id="valueDate" />
                            <button type="button" class="btn-lookup btn-date" data-open-date="valueDate" aria-label="Open calendar">
                                <i class="fa-solid fa-calendar-days"></i>
                            </button>
                        </div>
                        <div class="col"></div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="instrumentType">Instrument Type</label>
                            <select id="instrumentType">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="instrumentId">Instrument ID</label>
                            <input type="text" id="instrumentId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="instrumentDate">Instrument Date</label>
                            <input type="date" id="instrumentDate" />
                            <button type="button" class="btn-lookup btn-date" data-open-date="instrumentDate" aria-label="Open calendar">
                                <i class="fa-solid fa-calendar-days"></i>
                            </button>
                        </div>
                        <div class="col">
                            <label for="declarationRefNo">Declaration/Ref No.</label>
                            <input type="text" id="declarationRefNo" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="transactionId">Transaction ID</label>
                        <input type="text" id="transactionId" style="width: 150px;" />
                        <input type="text" id="transactionIdName" class="input-full" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="narration">Narration</label>
                        <input type="text" id="narration" class="input-full" />
                    </div>

                    <div class="form-row">
                        <label for="transactionCurrency">Transaction Currency</label>
                        <input type="text" id="transactionCurrency" style="width: 150px;" />
                        <input type="text" id="transactionCurrencyName" class="input-full" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="transactionAmount" class="label-blue">Transaction Amount</label>
                            <input type="text" id="transactionAmount" class="money-field input-full" />
                        </div>
                        <div class="col"></div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="exchangeRate">Exchange Rate</label>
                            <input type="text" id="exchangeRate" class="money-field input-full" value="1.00" />
                        </div>
                        <div class="col"></div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="localAmount">Local Amount</label>
                            <input type="text" id="localAmount" class="money-field input-full" readonly />
                        </div>
                        <div class="col">
                            <label for="foreignAmount">Foreign Amount</label>
                            <input type="text" id="foreignAmount" class="money-field input-full" />
                        </div>
                    </div>

                    <!-- Detail Actions -->
                    <div class="detail-actions">
                        <button type="button" class="btn-detail" data-action="new">New</button>
                        <button type="button" class="btn-detail" data-action="remove">Remove</button>
                        <button type="button" class="btn-detail" data-action="update">Update</button>
                        <button type="button" class="btn-detail" data-action="clear">Clear</button>
                    </div>

                    <!-- Grid -->
                    <div class="grid-container">
                        <table class="modern-table" id="transactionGrid">
                            <thead>
                                <tr>
                                    <th>Branch ID</th>
                                    <th>Acc Type</th>
                                    <th>Account ID</th>
                                    <th>Account Name</th>
                                    <th>Trans Type</th>
                                    <th>Currency ID</th>
                                    <th>Amount</th>
                                    <th>Exch Rate</th>
                                    <th>Narration</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="9" style="text-align: center; color: var(--text-gray); padding: 40px;">
                                        No records to display.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Summary -->
                    <div class="summary-section">
                        <div class="summary-item">
                            <label>Total Debit</label>
                            <input type="text" id="totalDebit" value="0.00" readonly />
                        </div>
                        <div class="summary-item">
                            <label>Total Credit</label>
                            <input type="text" id="totalCredit" value="0.00" readonly />
                        </div>
                        <div class="summary-item">
                            <label>Un-Posted</label>
                            <input type="text" id="unPosted" value="0.00" readonly />
                        </div>
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <div class="panel-header">General</div>
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="print"><i
                            class="fa-solid fa-print me-2"></i>Print</button>
                    <button type="button" class="btn-action" data-action="account-info"><i
                            class="fa-solid fa-info-circle me-2"></i>Account Info</button>
                    <button type="button" class="btn-action" data-action="view-all"><i
                            class="fa-solid fa-list me-2"></i>View All</button>
                </div>
                <div class="panel-header">Entry</div>
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view"><i
                            class="fa-solid fa-eye me-2"></i>View</button>
                    <button type="button" class="btn-action" data-action="add"><i
                            class="fa-solid fa-plus-circle me-2"></i>Add</button>
                    <button type="button" class="btn-action" data-action="edit" disabled><i
                            class="fa-solid fa-pencil-square me-2"></i>Edit</button>
                    <button type="button" class="btn-action" data-action="rollback"><i
                            class="fa-solid fa-rotate-left me-2"></i>Rollback</button>
                    <button type="button" class="btn-action" data-action="save" disabled><i
                            class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                    <button type="button" class="btn-action" data-action="cancel" disabled><i
                            class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="transfer-transactions.js"></script>
</body>

</html>
