<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cash Transaction · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="cash-transaction.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="cashTransactionForm" autocomplete="off">

                    <!-- Header Section -->
                    <div class="form-row two-col">
                        <div class="col">
                            <label for="transactionType" class="label-blue">Transaction Type</label>
                            <select id="transactionType">
                                <option value="" selected disabled>--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="serialId" class="label-blue">Serial ID</label>
                            <input type="text" id="serialId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="liquidationOption">Liquidation Option</label>
                            <select id="liquidationOption">
                                <option value="" selected disabled>--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="accountType" class="label-blue">Account Type</label>
                            <select id="accountType">
                                <option value="Customer" selected>Customer</option>
                                <option value="Internal">Internal</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="branchNo" class="label-blue">Branch ID</label>
                        <input type="text" id="branchNo" style="width: 80px;" value="0325" />
                        <input type="text" id="branchName" class="input-full" value="Tillil" readonly />
                        <button type="button" class="btn-lookup" data-lookup="branch"><i
                                class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="accountId" class="label-blue">Account ID</label>
                        <input type="text" id="accountId" style="width: 150px;" />
                        <input type="text" id="accountName" class="input-full" readonly />
                        <button type="button" class="btn-lookup" data-lookup="account"><i
                                class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <!-- Transaction Details -->
                    <div class="section-header">TRANSACTION DETAILS</div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="instrumentType" class="label-blue">Instrument Type</label>
                            <select id="instrumentType">
                                <option value="" selected disabled>--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="instrumentId">Instrument ID</label>
                            <input type="text" id="instrumentId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="instrumentDate">Instrument Date</label>
                            <input type="date" id="instrumentDate" />
                            <button type="button" class="btn-lookup btn-date" data-open-date="instrumentDate"
                                aria-label="Open calendar">
                                <i class="fa-solid fa-calendar-days"></i>
                            </button>
                        </div>
                        <div class="col">
                            <label for="referenceNo">Declaration/Ref No.</label>
                            <input type="text" id="referenceNo" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="transactionCurrencyId">Transaction Currency</label>
                        <input type="text" id="transactionCurrencyId" style="width: 80px;" />
                        <input type="text" id="transactionCurrencyName" class="input-full" readonly />
                        <button type="button" class="btn-lookup" data-lookup="currency"><i
                                class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="transactionId" class="label-blue">Transaction ID</label>
                        <input type="text" id="transactionId" style="width: 80px;" />
                        <input type="text" id="transactionIdName" class="input-full" readonly />
                        <button type="button" class="btn-lookup" data-lookup="transaction"><i
                                class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="narration" class="label-blue">Narration</label>
                        <input type="text" id="narration" class="input-full" />
                    </div>

                    <div class="form-row">
                        <label for="transactionAmount" class="label-blue">Transaction Amount</label>
                        <input type="text" id="transactionAmount" class="money-field input-full" />
                    </div>

                    <!-- Charges -->
                    <div class="form-row" style="margin-top: 10px;">
                        <label for="costCenterId">CostCenter ID</label>
                        <input type="text" id="costCenterId" style="width: 80px;" />
                        <input type="text" id="costCenterName" class="input-full" readonly />
                        <button type="button" class="btn-lookup" data-lookup="cost-center"><i
                                class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="waiveCharges">Waive Charges</label>
                        <input type="checkbox" id="waiveCharges" class="checkbox" />
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="chargeAmount">Charge Amount</label>
                            <input type="text" id="chargeAmount" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="chargeCurrencyId">Charge Currency ID</label>
                            <input type="text" id="chargeCurrencyId" style="width: 80px;" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="exchangeRate">Exchange Rate</label>
                            <input type="text" id="exchangeRate" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="forexGainLoss">Forex Gain / Loss</label>
                            <input type="text" id="forexGainLoss" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="localAmount">Local Amount</label>
                            <input type="text" id="localAmount" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="foreignAmount">Foreign Amount</label>
                            <input type="text" id="foreignAmount" class="money-field" />
                        </div>
                    </div>

                    <!-- Behind the Scene -->
                    <div class="section-header">BEHIND THE SCENE</div>
                    <div class="behind-scene">
                        <div class="form-row two-col">
                            <div class="col">
                                <label>Clear Balance</label>
                                <input type="text" id="clearBalance" class="money-field" readonly />
                            </div>
                            <div class="col">
                                <label>Drawing Power</label>
                                <input type="text" id="drawingPower" class="money-field" readonly />
                                <button type="button" class="btn-plus">+</button>
                            </div>
                        </div>
                        <div class="form-row two-col">
                            <div class="col">
                                <label>Unclear Balance</label>
                                <input type="text" id="unclearBalance" class="money-field" readonly />
                                <button type="button" class="btn-plus">+</button>
                            </div>
                            <div class="col">
                                <label>Freezed Amount</label>
                                <input type="text" id="freezedAmount" class="money-field" readonly />
                                <button type="button" class="btn-plus">+</button>
                            </div>
                        </div>
                        <div class="form-row two-col">
                            <div class="col">
                                <label>UnSupervised Cr</label>
                                <input type="text" id="unsupervisedCr" class="money-field" readonly />
                                <button type="button" class="btn-plus">+</button>
                            </div>
                            <div class="col">
                                <label>Minimum Balance</label>
                                <input type="text" id="minimumBalance" class="money-field" readonly />
                            </div>
                        </div>
                        <div class="form-row two-col">
                            <div class="col">
                                <label>UnSupervised Dr</label>
                                <input type="text" id="unsupervisedDr" class="money-field" readonly />
                                <button type="button" class="btn-plus">+</button>
                            </div>
                            <div class="col">
                                <label>Deposit Balance</label>
                                <input type="text" id="depositBalance" class="money-field" readonly />
                            </div>
                        </div>
                        <div class="form-row two-col">
                            <div class="col">
                                <label>Available Bal</label>
                                <input type="text" id="availableBalance" class="money-field" readonly />
                            </div>
                            <div class="col">
                                <label>Total Balance</label>
                                <input type="text" id="totalBalance" class="money-field" readonly />
                            </div>
                        </div>
                        <hr style="border: 0; border-top: 1px solid var(--border); margin: 5px 0;" />
                        <div class="form-row two-col">
                            <div class="col">
                                <label>Acc Currency ID</label>
                                <input type="text" id="accCurrencyId" style="width: 80px;" readonly />
                            </div>
                            <div class="col">
                                <label>Acc Product ID</label>
                                <input type="text" id="accProductId" style="width: 80px;" readonly />
                            </div>
                        </div>
                        <div class="form-row two-col">
                            <div class="col">
                                <label>System Date</label>
                                <input type="text" id="systemDate" value="29/Aug/2025" readonly />
                            </div>
                            <div class="col">
                                <label>Day Status</label>
                                <input type="text" id="dayStatus" value="Open" style="width: 80px;" readonly />
                                <button type="button" class="btn-lookup" data-lookup="signature"
                                    style="width: auto; padding: 0 5px;">Signature</button>
                            </div>
                        </div>
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <span class="local-branch-label">Local Branch</span>
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view-all"><i
                            class="fa-solid fa-list me-2"></i>View All</button>
                    <button type="button" class="btn-action" data-action="denomination"><i
                            class="fa-solid fa-coins me-2"></i>Denomination</button>
                    <button type="button" class="btn-action" data-action="print"><i
                            class="fa-solid fa-print me-2"></i>Print</button>
                    <button type="button" class="btn-action" data-action="teller-balance"><b>TELLER BALANCE</b></button>
                    <button type="button" class="btn-action" data-action="account-info"><i
                            class="fa-solid fa-info-circle me-2"></i>Account Info</button>
                </div>
                <div class="action-buttons" style="margin-top: 20px;">
                    <button type="button" class="btn-action" data-action="view"><i
                            class="fa-solid fa-eye me-2"></i>View</button>
                    <button type="button" class="btn-action" data-action="add"><i
                            class="fa-solid fa-plus-circle me-2"></i>Add</button>
                    <button type="button" class="btn-action" data-action="edit" disabled><i
                            class="fa-solid fa-pencil-square me-2"></i>Edit</button>
                    <button type="button" class="btn-action" data-action="delete" disabled><i
                            class="fa-solid fa-trash-can me-2"></i>Delete</button>
                    <button type="button" class="btn-action" data-action="save" disabled><i
                            class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                    <button type="button" class="btn-action" data-action="cancel" disabled><i
                            class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cash-transaction.js"></script>
</body>

</html>
