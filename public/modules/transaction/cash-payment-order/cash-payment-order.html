<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cash Payment Order · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="cash-payment-order.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="cashPaymentOrderForm" autocomplete="off">

                    <!-- CPO Details Section -->
                    <div class="section-header">CPO DETAILS</div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="serviceType" class="label-blue">Service Type</label>
                            <select id="serviceType">
                                <option value="CPO - Issuance">CPO - Issuance</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="serialId" class="label-blue">Serial ID</label>
                            <input type="text" id="serialId" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="branchId" class="label-blue">Branch ID</label>
                        <input type="text" id="branchId" style="width: 80px;" value="0101" />
                        <input type="text" id="branchName" class="input-full" value="Head Office" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="currencyId" class="label-blue">Currency ID</label>
                        <input type="text" id="currencyId" style="width: 80px;" value="ETB" />
                        <input type="text" id="currencyName" class="input-full" value="BIRR" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="accountId" class="label-blue">Account ID</label>
                        <input type="text" id="accountId" style="width: 120px;" value="21555000" />
                        <input type="text" id="accountName" class="input-full" value="Cashiers Payable Orders Payable"
                            readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label style="min-width: 130px;">CPO</label>
                        <input type="text" style="width: 150px;" id="cpoType" value="CPO" />
                        <label style="min-width: 100px; text-align: center;" class="label-blue">CPO Amount</label>
                        <input type="text" class="money-field input-full" id="cpoAmount" />
                    </div>

                    <div class="form-row">
                        <label for="beneficiaryName" class="label-blue">Beneficiary Name</label>
                        <input type="text" id="beneficiaryName" class="input-full" />
                    </div>

                    <div class="form-row two-col"
                        style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
                        <div class="col">
                            <label for="accountPayee">Account Payee</label>
                            <input type="checkbox" id="accountPayee" class="checkbox" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="subAccountId">Account ID</label>
                            <input type="text" id="subAccountId" />
                        </div>
                        <div class="col">
                            <label for="payableAt">Payable At</label>
                            <input type="text" id="payableAt" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="payableBranchId" class="label-blue">Payable Branch ID</label>
                        <input type="text" id="payableBranchId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <!-- Receipt Details Section -->
                    <div class="section-header">RECEIPT DETAILS</div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="byTransfer">By Transfer</label>
                            <input type="checkbox" id="byTransfer" class="checkbox" checked />
                        </div>
                        <div class="col">
                            <label for="tillId">Till ID</label>
                            <input type="text" id="tillId" style="width: 100px;" />
                            <button type="button" class="btn-lookup"><i
                                    class="fa-solid fa-magnifying-glass"></i></button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="accountType" class="label-blue">Account Type</label>
                        <select id="accountType" class="input-full">
                            <option value="Customer">Customer</option>
                            <option value="GL">GL</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="debitBranchId">Debit Branch ID</label>
                        <input type="text" id="debitBranchId" style="width: 80px;" value="0101" />
                        <input type="text" id="debitBranchName" class="input-full" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="debitAccId">Debit Acc. ID</label>
                        <input type="text" id="debitAccId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="receiptCurrencyId" class="label-blue">Currency ID</label>
                        <input type="text" id="receiptCurrencyId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="narration">Narration</label>
                        <textarea id="narration" class="input-full" rows="1"></textarea>
                    </div>

                    <div class="form-row">
                        <label for="instrumentType" class="label-blue">Instrument Type</label>
                        <select id="instrumentType" class="input-full">
                            <option value="">--Select--</option>
                        </select>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="instrumentId">Instrument ID</label>
                            <input type="text" id="instrumentId" />
                        </div>
                        <div class="col">
                            <label for="instrumentDate">Instrument Date</label>
                            <select id="instrumentDate">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="transactionAmount" class="label-blue">Transaction Amount</label>
                            <input type="text" id="transactionAmount" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="exchangeRate" class="label-blue">Exchange Rate</label>
                            <input type="text" id="exchangeRate" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="localAmount">Local Amount</label>
                            <input type="text" id="localAmount" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="forexGainLoss">Forex Gain / Loss</label>
                            <input type="text" id="forexGainLoss" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row two-col"
                        style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
                        <div class="col">
                            <label for="waiveCharges">Waive Charges</label>
                            <input type="checkbox" id="waiveCharges" class="checkbox" />
                        </div>
                        <div class="col">
                            <label for="localCharge">Local Charge</label>
                            <input type="text" id="localCharge" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="charges" class="label-blue">Charges</label>
                            <input type="text" id="charges" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="chargeCurrencyId">Charge Currency ID</label>
                            <input type="text" id="chargeCurrencyId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="netPayable" class="label-blue">Net Payable</label>
                            <input type="text" id="netPayable" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="status">Status</label>
                            <input type="text" id="status" />
                        </div>
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view-all"><i
                            class="fa-solid fa-list me-2"></i>View All</button>
                    <button type="button" class="btn-action" data-action="denomination" disabled><i
                            class="fa-solid fa-coins me-2"></i>Denomination</button>
                    <button type="button" class="btn-action" data-action="print" disabled><i
                            class="fa-solid fa-print me-2"></i>Print</button>
                    <button type="button" class="btn-action" data-action="print-voucher" disabled><i
                            class="fa-solid fa-file-invoice me-2"></i>Print Voucher</button>
                    <button type="button" class="btn-action" data-action="account-info" disabled><i
                            class="fa-solid fa-info-circle me-2"></i>Account Info</button>

                    <button type="button" class="btn-action" data-action="view" style="margin-top: 20px;"><i
                            class="fa-solid fa-eye me-2"></i>View</button>
                    <button type="button" class="btn-action" data-action="add"><i
                            class="fa-solid fa-plus-circle me-2"></i>Add</button>
                    <button type="button" class="btn-action" data-action="edit" disabled><i
                            class="fa-solid fa-pencil-square me-2"></i>Edit</button>
                    <button type="button" class="btn-action" data-action="save" disabled><i
                            class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                    <button type="button" class="btn-action" data-action="cancel" disabled><i
                            class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cash-payment-order.js"></script>
</body>

</html>
