<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money Transfer · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="money-transfer.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="moneyTransferForm" autocomplete="off">

                    <!-- Top Summary Fields -->
                    <div class="form-row two-col" style="margin-bottom: 10px;">
                        <div class="col">
                            <label for="controlNumber">Control Number</label>
                            <input type="text" id="controlNumber" style="width: 200px;" />
                        </div>
                        <div class="col">
                            <label for="fileId">File ID</label>
                            <input type="text" id="fileId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="fromCustomerAccount">Send From Cust. Acc</label>
                            <input type="checkbox" id="fromCustomerAccount" class="checkbox" />
                        </div>
                        <div class="col">
                            <label for="transferDate">Date</label>
                            <select id="transferDate">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                    </div>

                    <!-- Sending Branch Section -->
                    <div class="section-header">SENDING BRANCH</div>

                    <div class="form-row">
                        <label for="sendingBranchNo">Sending Branch</label>
                        <input type="text" id="sendingBranchNo" style="width: 80px;" value="0325" />
                        <input type="text" id="sendingBranchName" class="input-full" value="Tillil" readonly />
                        <button type="button" class="btn-lookup" data-lookup="sending-branch"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="accountId">Account ID</label>
                        <input type="text" id="accountId" style="width: 150px;" />
                        <input type="text" id="accountName" class="input-full" readonly />
                        <button type="button" class="btn-lookup" data-lookup="account"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="senderTitle">Title</label>
                            <select id="senderTitle">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="senderClientName">Client Name</label>
                            <input type="text" id="senderClientName" class="input-full" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="senderDocType">Document Type</label>
                            <select id="senderDocType">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="senderDocId">Document ID</label>
                            <input type="text" id="senderDocId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="senderMobile">Mobile</label>
                            <input type="text" id="senderMobile" style="width: 150px;" />
                        </div>
                        <div class="col">
                            <label for="senderEmail">Email ID</label>
                            <input type="text" id="senderEmail" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="senderAddress">Address 1</label>
                        <input type="text" id="senderAddress" class="input-full" />
                    </div>

                    <div class="form-row two-col" style="margin-top: 5px;">
                        <div class="col">
                            <label for="transactionAmount" class="label-blue">Transaction Amount</label>
                            <input type="text" id="transactionAmount" class="money-field input-full" />
                        </div>
                        <div class="col">
                            <label for="commission">Commission</label>
                            <input type="text" id="commission" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="totalAmount" class="label-blue">Total Amount</label>
                            <input type="text" id="totalAmount" class="money-field input-full" />
                        </div>
                        <div class="col">
                            <label for="tax">Tax</label>
                            <input type="text" id="tax" class="money-field" />
                        </div>
                    </div>

                    <!-- Receiving Branch Section -->
                    <div class="section-header">RECEIVING BRANCH</div>

                    <div class="form-row">
                        <label for="receivingBranchNo">Receiving Branch</label>
                        <input type="text" id="receivingBranchNo" style="width: 80px;" />
                        <input type="text" id="receivingBranchName" class="input-full" readonly />
                        <button type="button" class="btn-lookup" data-lookup="receiving-branch"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="receiverTitle">Title</label>
                            <select id="receiverTitle">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="receiverClientName" class="label-blue">Client Name</label>
                            <input type="text" id="receiverClientName" class="input-full" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="receiverDocType">Document Type</label>
                            <select id="receiverDocType">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="receiverDocId">Document ID</label>
                            <input type="text" id="receiverDocId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="receiverMobile">Mobile</label>
                            <input type="text" id="receiverMobile" style="width: 150px;" />
                        </div>
                        <div class="col">
                            <label for="receiverEmail">Email ID</label>
                            <input type="text" id="receiverEmail" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="receiverAddress">Address 1</label>
                        <input type="text" id="receiverAddress" class="input-full" />
                    </div>

                    <div class="form-row">
                        <label for="securityQuestion">Security Question</label>
                        <input type="text" id="securityQuestion" class="input-full" />
                    </div>

                    <div class="form-row">
                        <label for="answer">Answer</label>
                        <input type="text" id="answer" class="input-full" />
                    </div>

                    <div class="form-row">
                        <label for="remarks">Remarks</label>
                        <input type="text" id="remarks" class="input-full" />
                    </div>

                    <!-- Audit Section -->
                    <div class="audit-grid">
                        <div class="audit-item"><label>Created By</label><input type="text" readonly /></div>
                        <div class="audit-item"><label>Modified By</label><input type="text" readonly /></div>
                        <div class="audit-item"><label>Supervised By</label><input type="text" readonly /></div>
                        <div class="audit-item"><label>Created On</label><input type="text" readonly /></div>
                        <div class="audit-item"><label>Modified On</label><input type="text" readonly /></div>
                        <div class="audit-item"><label>Supervised On</label><input type="text" readonly /></div>
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view-all"><i
                            class="fa-solid fa-list me-2"></i>View All</button>
                    <button type="button" class="btn-action" data-action="print"><i
                            class="fa-solid fa-print me-2"></i>Print</button>
                    <button type="button" class="btn-action" data-action="activate"><i
                            class="fa-solid fa-check-circle me-2"></i>Activate</button>
                    <button type="button" class="btn-action" data-action="account-info"><i
                            class="fa-solid fa-info-circle me-2"></i>Account Info</button>
                </div>
                <div class="action-buttons" style="margin-top: 20px;">
                    <button type="button" class="btn-action" data-action="view"><i
                            class="fa-solid fa-eye me-2"></i>View</button>
                    <button type="button" class="btn-action" data-action="add"><i
                            class="fa-solid fa-plus-circle me-2"></i>Add</button>
                    <button type="button" class="btn-action" data-action="receive"><i
                            class="fa-solid fa-download me-2"></i>Receive Transfer</button>
                    <button type="button" class="btn-action" data-action="cancel-transfer"><i
                            class="fa-solid fa-trash-can me-2"></i>Cancel Transfer</button>
                    <button type="button" class="btn-action" data-action="reverse"><i
                            class="fa-solid fa-rotate-left me-2"></i>Reverse Transfer</button>
                    <button type="button" class="btn-action" data-action="save" disabled><i
                            class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                    <button type="button" class="btn-action" data-action="cancel" disabled><i
                            class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="money-transfer.js"></script>
</body>

</html>
