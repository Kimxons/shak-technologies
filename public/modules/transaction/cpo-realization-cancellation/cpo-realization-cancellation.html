<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPO Realization / Cancellation · Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="cpo-realization-cancellation.css" />
</head>

<body class="modern-blue-theme">
    <div class="window">
        <div class="main-container">
            <main class="form-content">
                <form id="cpoForm" autocomplete="off">

                    <!-- Identification Section -->
                    <div class="section-header">CASH PAYMENT ORDER (CPO) IDENTIFICATION</div>
                    <div class="form-row two-col">
                        <div class="col">
                            <label for="actionType" class="label-blue">Action Type</label>
                            <select id="actionType">
                                <option value="REALIZATION">Realization</option>
                                <option value="CANCELLATION">Cancellation</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="serialId">Serial ID</label>
                            <input type="text" id="serialId" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="branchId" class="label-blue">Branch ID</label>
                        <input type="text" id="branchId" style="width: 80px;" placeholder="0101" />
                        <input type="text" id="branchName" class="input-full" placeholder="Head Office" readonly />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="accountId" class="label-blue">Account ID</label>
                        <input type="text" id="accountId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="cpoSerialId" class="label-blue">CPO Serial ID</label>
                            <input type="text" id="cpoSerialId" />
                        </div>
                        <div class="col">
                            <label for="chequeDate">Cheque Date</label>
                            <select id="chequeDate">
                                <option value="">--Select--</option>
                            </select>
                        </div>
                    </div>

                    <!-- Details Section -->
                    <div class="section-header">CPO DETAILS</div>
                    <div class="form-row two-col">
                        <div class="col">
                            <label for="beneficiaryName">Beneficiary Name</label>
                            <input type="text" id="beneficiaryName" />
                        </div>
                        <div class="col">
                            <label for="accountPayee">Account Payee</label>
                            <input type="checkbox" id="accountPayee" class="checkbox" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="serviceType">Service Type</label>
                            <input type="text" id="serviceType" />
                        </div>
                        <div class="col">
                            <label for="payableAt">Payable At</label>
                            <input type="text" id="payableAt" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="cpoAccountId">Account ID</label>
                            <input type="text" id="cpoAccountId" />
                        </div>
                        <div class="col">
                            <label for="status">Status</label>
                            <input type="text" id="status" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="payableBranchId">Payable Branch ID</label>
                            <input type="text" id="payableBranchId" />
                        </div>
                        <div class="col">
                            <label for="exchangeRate">Exchange Rate</label>
                            <input type="text" id="exchangeRate" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="chequeAmount">Cheque Amount</label>
                            <input type="text" id="chequeAmount" class="money-field" />
                        </div>
                        <div class="col">
                            <label for="profitLoss">Profit/Loss</label>
                            <input type="text" id="profitLoss" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="currencyId">Currency ID</label>
                        <input type="text" id="currencyId" class="input-full" />
                    </div>

                    <div class="form-row">
                        <label for="paymentAmount">Payment Amount</label>
                        <input type="text" id="paymentAmount" class="money-field input-full" />
                    </div>

                    <div class="form-row">
                        <label for="localAmount">Local Amount</label>
                        <input type="text" id="localAmount" class="money-field input-full" />
                    </div>

                    <!-- Payment Section -->
                    <div class="section-header">PAYMENT DETAILS</div>
                    <div class="form-row">
                        <label for="byTransfer">By Transfer</label>
                        <input type="checkbox" id="byTransfer" class="checkbox" />
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="paymentAccountType" class="label-blue">Account Type</label>
                            <select id="paymentAccountType">
                                <option value="CUSTOMER">Customer</option>
                                <option value="GL">GL</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="tillId">Till ID</label>
                            <input type="text" id="tillId" style="width: 80px;" />
                            <button type="button" class="btn-lookup"><i
                                    class="fa-solid fa-magnifying-glass"></i></button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="creditBranchId">Credit Branch ID</label>
                        <input type="text" id="creditBranchId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row">
                        <label for="creditAccountId">Credit Acc. ID</label>
                        <input type="text" id="creditAccountId" class="input-full" />
                        <button type="button" class="btn-lookup"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="waiveCharges">Waive Charges</label>
                            <input type="checkbox" id="waiveCharges" class="checkbox" />
                        </div>
                        <div class="col">
                            <label for="paymentCurrencyId">Payment Currency ID</label>
                            <input type="text" id="paymentCurrencyId" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="col">
                            <label for="chargeCurrencyId">Charge Currency ID</label>
                            <input type="text" id="chargeCurrencyId" />
                        </div>
                        <div class="col">
                            <label for="charges">Charges</label>
                            <input type="text" id="charges" class="money-field" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="netPayable">Net Payable</label>
                        <input type="text" id="netPayable" class="money-field input-full" />
                    </div>

                    <div class="form-row">
                        <label for="reason">Reason</label>
                        <textarea id="reason" class="input-full" rows="1"></textarea>
                    </div>

                    <div class="audit-info">
                        <span id="statusMessage" class="text-danger"></span>
                    </div>
                </form>
            </main>

            <aside class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view-all"><i
                            class="fa-solid fa-list me-2"></i>View All</button>
                    <button type="button" class="btn-action" data-action="account-info" disabled><i
                            class="fa-solid fa-circle-info me-2"></i>Account Info</button>
                    <button type="button" class="btn-action" data-action="print" disabled><i
                            class="fa-solid fa-print me-2"></i>Print</button>

                    <button type="button" class="btn-action" data-action="view" style="margin-top: 20px;"><i
                            class="fa-solid fa-eye me-2"></i>View</button>
                    <button type="button" class="btn-action" data-action="add"><i
                            class="fa-solid fa-plus-circle me-2"></i>Add</button>
                    <button type="button" class="btn-action" data-action="edit" disabled><i
                            class="fa-solid fa-pencil-square me-2"></i>Edit</button>
                    <button type="button" class="btn-action" data-action="delete" disabled><i
                            class="fa-solid fa-trash-can me-2"></i>Delete</button>
                    <button type="button" class="btn-action" data-action="save" disabled><i
                            class="fa-solid fa-floppy-disk me-2"></i>Save</button>
                    <button type="button" class="btn-action" data-action="cancel" disabled><i
                            class="fa-solid fa-circle-xmark me-2"></i>Cancel</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cpo-realization-cancellation.js"></script>
</body>

</html>
