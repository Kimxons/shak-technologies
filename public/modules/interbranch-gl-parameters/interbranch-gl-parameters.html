<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InterBranch GL Parameters · General Ledger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <script src="../../assets/js/serviceloader.js"></script>
  <script src="../../assets/js/GeneralLedgerService.js"></script>
</head>

<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f8fafc;">
  <div style="display: flex; height: 100vh; overflow: hidden;">
    <!-- Main Content -->
    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      <form id="interbranch-gl-parameters-form" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div style="flex: 1; overflow-y: auto; padding: 20px;">

          <!-- Form Fields - 4 columns with labels on top -->
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 20px; margin-bottom: 20px;">
            <!-- Branch ID -->
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label for="branchId" class="cbs-label" style="font-size: 0.75rem; color: #374151; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;">Branch ID</label>
              <div style="display: flex; gap: 4px;">
                <input id="branchId" type="text" class="cbs-field form-control" value="0101" style="flex: 0 0 80px; height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px;" />
                <input id="branchName" type="text" class="cbs-field form-control" value="Head Office" readonly style="flex: 1; height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #f8fafc;" />
                <button type="button" class="btn-lookup" style="width: 32px; height: 32px; padding: 0; background: #517a8e; color: white; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                  <i class="bi bi-search" style="font-size: 14px;"></i>
                </button>
              </div>
            </div>
            
            <!-- Account Tag -->
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label for="accountTag" class="cbs-label" style="font-size: 0.75rem; color: #374151; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;">Account Tag</label>
              <select id="accountTag" class="cbs-field form-control" disabled style="width: 100%; height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px;">
                <option value="">--Select--</option>
              </select>
            </div>
            
            <!-- Currency ID -->
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label for="currencyId" class="cbs-label" style="font-size: 0.75rem; color: #374151; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;">Currency ID</label>
              <div style="display: flex; gap: 4px;">
                <input id="currencyId" type="text" class="cbs-field form-control" disabled style="flex: 1; height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px;" />
                <button type="button" class="btn-lookup-currency" style="width: 32px; height: 32px; padding: 0; background: #517a8e; color: white; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                  <i class="bi bi-search" style="font-size: 14px;"></i>
                </button>
              </div>
            </div>
            
            <!-- Account ID -->
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label for="accountId" class="cbs-label" style="font-size: 0.75rem; color: #374151; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;">Account ID</label>
              <div style="display: flex; gap: 4px;">
                <input id="accountId" type="text" class="cbs-field form-control" disabled style="flex: 1; height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px;" />
                <button type="button" class="btn-lookup-account" style="width: 32px; height: 32px; padding: 0; background: #517a8e; color: white; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                  <i class="bi bi-search" style="font-size: 14px;"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
            <button type="button" id="newBtn" style="height: 32px; padding: 0 16px; font-size: 12px; font-weight: 500; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 4px; cursor: pointer;">New</button>
            <button type="button" id="alterBtn" style="height: 32px; padding: 0 16px; font-size: 12px; font-weight: 500; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 4px; cursor: pointer;">Alter</button>
            <button type="button" id="removeBtn" style="height: 32px; padding: 0 16px; font-size: 12px; font-weight: 500; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Remove</button>
            <button type="button" id="updateBtn" style="height: 32px; padding: 0 16px; font-size: 12px; font-weight: 500; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 4px; cursor: pointer;">Update</button>
            <button type="button" id="clearBtn" style="height: 32px; padding: 0 16px; font-size: 12px; font-weight: 500; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 4px; cursor: pointer;">Clear</button>
          </div>

          <!-- Table -->
          <div style="margin-bottom: 20px; overflow-x: auto;">
            <table id="ibgl-params-table" style="width: 100%; border-collapse: collapse; font-size: 12px; background: white; border-radius: 6px; overflow: hidden;">
              <thead>
                <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">Our Branch ID</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">Branch Name</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">AccountTagID</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">AccountTagName</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">Account ID</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">Account Name</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">Currency ID</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">CurrencyName</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="8" style="padding: 40px; text-align: center; color: #94a3b8;">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- BEHIND THE SCENE -->
          <div style="background: #517a8e; color: white; padding: 8px 16px; margin-bottom: 12px; border-radius: 4px;">
            <h3 style="margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">BEHIND THE SCENE</h3>
          </div>

          <div class="cbs-grid cbs-grid--four cbs-grid--tight" style="margin-bottom: 20px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label class="cbs-label" style="font-size: 0.75rem; color: rgba(15, 23, 42, 0.75); font-weight: 600; letter-spacing: 0.02em;">Created By</label>
              <input id="createdBy" type="text" class="cbs-field form-control" readonly style="height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #f8fafc;" />
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label class="cbs-label" style="font-size: 0.75rem; color: rgba(15, 23, 42, 0.75); font-weight: 600; letter-spacing: 0.02em;">Created On</label>
              <input id="createdOn" type="text" class="cbs-field form-control" readonly style="height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #f8fafc;" />
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label class="cbs-label" style="font-size: 0.75rem; color: rgba(15, 23, 42, 0.75); font-weight: 600; letter-spacing: 0.02em;">Modified By</label>
              <input id="modifiedBy" type="text" class="cbs-field form-control" readonly style="height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #f8fafc;" />
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label class="cbs-label" style="font-size: 0.75rem; color: rgba(15, 23, 42, 0.75); font-weight: 600; letter-spacing: 0.02em;">Modified On</label>
              <input id="modifiedOn" type="text" class="cbs-field form-control" readonly style="height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #f8fafc;" />
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label class="cbs-label" style="font-size: 0.75rem; color: rgba(15, 23, 42, 0.75); font-weight: 600; letter-spacing: 0.02em;">Supervised By</label>
              <input id="supervisedBy" type="text" class="cbs-field form-control" readonly style="height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #f8fafc;" />
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label class="cbs-label" style="font-size: 0.75rem; color: rgba(15, 23, 42, 0.75); font-weight: 600; letter-spacing: 0.02em;">Supervised On</label>
              <input id="supervisedOn" type="text" class="cbs-field form-control" readonly style="height: 32px; font-size: 12px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #f8fafc;" />
            </div>
          </div>

        </div>
      </form>
    </div>

    <!-- Sidebar -->
    <aside class="cm-legacy-actions card-surface">
      <div class="cm-legacy-actions__group">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="arrowLeftBtn" aria-label="Previous record">
            <i class="bi bi-arrow-left"></i>
          </button>
          <span class="small fw-semibold text-muted">Record</span>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="arrowRightBtn" aria-label="Next record">
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>

      <div class="cm-legacy-actions__group" style="margin-top: auto;">
        <p class="cm-legacy-actions__title">Mode switch</p>
        <button type="button" class="cm-shell__action cm-shell__action--primary" id="viewBtn">
          <i class="bi bi-eye"></i> View
        </button>
        <button type="button" class="cm-shell__action" id="addBtn">
          <i class="bi bi-plus-lg"></i> Add
        </button>
        <button type="button" class="cm-shell__action" id="editBtn">
          <i class="bi bi-pencil"></i> Edit
        </button>
      </div>

      <div class="cm-legacy-actions__group">
        <p class="cm-legacy-actions__title">Workflow</p>
        <button type="button" class="cm-shell__action cm-shell__action--success" id="saveBtn">
          <i class="bi bi-check-lg"></i> Save
        </button>
        <button type="button" class="cm-shell__action cm-shell__action--danger" id="cancelBtn">
          <i class="bi bi-x-lg"></i> Cancel
        </button>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script>
    console.log('ServiceLoader available?', typeof window.ServiceLoader !== 'undefined');
    if (typeof window.ServiceLoader === 'undefined') {
      console.error('ServiceLoader failed to load! Check network tab for errors.');
    }
  </script>
  <script src="interbranch-gl-parameters.js?v=20260202"></script>
</body>
</html>
