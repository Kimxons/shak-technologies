  <script>
    function toggleBehindTheSceneCollapse() {
      const content = document.getElementById('behindTheSceneContent');
      const nextSiblings = [];
      let sibling = content.nextElementSibling;
      while (sibling && sibling.classList.contains('form-row')) {
        nextSiblings.push(sibling);
        sibling = sibling.nextElementSibling;
      }
      
      const chevron = document.getElementById('behindTheSceneChevron');
      const isCollapsed = content.classList.contains('is-collapsed');
      
      if (isCollapsed) {
        content.classList.remove('is-collapsed');
        nextSiblings.forEach(s => s.classList.remove('is-collapsed'));
        chevron.classList.remove('bi-chevron-down');
        chevron.classList.add('bi-chevron-up');
      } else {
        content.classList.add('is-collapsed');
        nextSiblings.forEach(s => s.classList.add('is-collapsed'));
        chevron.classList.remove('bi-chevron-up');
        chevron.classList.add('bi-chevron-down');
      }
    }
  </script>

    <script>
      // Clear all form fields in the Nostro Account Maintenance form
      document.addEventListener('DOMContentLoaded', function() {
        const cancelBtn = document.getElementById('cancelBtn');
        const form = document.getElementById('nostro-account-form');
        cancelBtn.addEventListener('click', function() {
          // Clear all input and select fields inside the form
          form.querySelectorAll('input, select').forEach(function(el) {
            if (el.type === 'checkbox' || el.type === 'radio') {
              el.checked = false;
            } else if (el.tagName.toLowerCase() === 'select') {
              el.selectedIndex = 0;
            } else if (el.hasAttribute('readonly')) {
              // Don't clear readonly fields (e.g., branchName)
            } else {
              el.value = '';
            }
          });
        });
      });
    </script>
