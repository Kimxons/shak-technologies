<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL-Stop Payment/Void</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="gl-stop-payment.css">
</head>

<body>
    <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100vh; padding: 8px;">
        <!-- Main Content Area -->
        <div class="stop-payment-container">
        <!-- Branch and Account Section -->
        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="branchId">Branch</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="branchId" value="0101">
                        <input type="text" class="form-control" id="branchName" value="Head Office" readonly>
                        <button type="button" class="btn btn-search" id="branchSearch">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="accountId">Account</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="accountId">
                        <input type="text" class="form-control" id="accountDescription" readonly placeholder="Account Description">
                        <button type="button" class="btn btn-search" id="accountSearch">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="requestRefNo">Request Ref No</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="requestRefNo">
                        <button type="button" class="btn btn-search" id="requestRefSearch">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stop Payment Details Section -->
        <div class="form-section">
            <div style="background: #517a8e; color: white; padding: 0.5rem 0.85rem; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" onclick="this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up'); this.nextElementSibling.classList.toggle('collapsed');">
                <span>Stop Payment Details</span>
                <i class="bi bi-chevron-down" style="font-size: 0.9rem;"></i>
            </div>
            
            <div class="collapsible-content">
            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="paymentType">Payment Type</label>
                    <select id="paymentType" class="form-control">
                        <option value="">--Select--</option>
                        <option value="VOID" selected>VOID</option>
                        <option value="STOP">STOP</option>
                        <option value="CANCEL">CANCEL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="chequeDate">Cheque Date</label>
                    <select id="chequeDate" class="form-control">
                        <option value="">--Select--</option>
                    </select>
                </div>
            </div>

            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="chequeStart">Cheque Start</label>
                    <input type="text" class="form-control" id="chequeStart">
                </div>
                <div class="form-group">
                    <label for="chequeEnd">Cheque End</label>
                    <input type="text" class="form-control" id="chequeEnd">
                </div>
            </div>

            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="chequeAmount">Cheque Amount</label>
                    <input type="text" class="form-control" id="chequeAmount">
                </div>
                <div class="form-group">
                    <label for="stopPaymentDate">Stop Payment Date</label>
                    <input type="text" class="form-control" id="stopPaymentDate">
                </div>
            </div>

            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="reasonId">Reason ID</label>
                    <select id="reasonId" class="form-control">
                        <option value="">--Select--</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reason">Reason</label>
                    <input type="text" class="form-control" id="reason">
                </div>
            </div>

            <div class="form-row form-row-two-col">
                <div class="form-group">
                    <label for="instructionGivenBy">Instruction Given By</label>
                    <input type="text" class="form-control" id="instructionGivenBy">
                </div>
                <div class="form-group">
                    <!-- Empty column for alignment -->
                </div>
            </div>
            </div>
        </div>

        <!-- Data Grid Section -->
        <div class="data-grid-container">
            <table class="data-grid" id="stopPaymentGrid">
                <thead>
                    <tr>
                        <th>Prefix</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Cheque Date</th>
                        <th>Reason</th>
                        <th>Stop Date</th>
                        <th>Amount</th>
                        <th>Instruction/GivenBy</th>
                    </tr>
                </thead>
                <tbody id="stopPaymentGridBody">
                    <tr class="no-records">
                        <td colspan="8">No records to display.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Behind The Scene Section -->
        <div class="behind-scene-section">
            <div style="background: #517a8e; color: white; padding: 0.5rem 0.85rem; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" onclick="this.querySelector('.bi').classList.toggle('bi-chevron-down'); this.querySelector('.bi').classList.toggle('bi-chevron-up'); this.nextElementSibling.classList.toggle('collapsed');">
                <span>Behind The Scene</span>
                <i class="bi bi-chevron-down" style="font-size: 0.9rem;"></i>
            </div>
            <div class="behind-scene-content collapsible-content">
                <div class="form-row form-row-two-col">
                    <div class="form-group">
                        <label for="currencyId">Currency ID</label>
                        <input type="text" class="form-control" id="currencyId" readonly>
                    </div>
                    <div class="form-group">
                        <label for="supervisedBy">Supervised By</label>
                        <input type="text" class="form-control" id="supervisedBy" readonly>
                    </div>
                </div>
                <div class="form-row form-row-two-col">
                    <div class="form-group">
                        <label for="createdBy">Created By</label>
                        <input type="text" class="form-control" id="createdBy" readonly>
                    </div>
                    <div class="form-group">
                        <label for="supervisedOn">Supervised On</label>
                        <input type="text" class="form-control" id="supervisedOn" readonly>
                    </div>
                </div>
                <div class="form-row form-row-two-col">
                    <div class="form-group">
                        <label for="createdOn">Created On</label>
                        <input type="text" class="form-control" id="createdOn" readonly>
                    </div>
                    <div class="form-group">
                        <!-- Empty for alignment -->
                    </div>
                </div>
            </div>
        </div>
        </div>

        <!-- Action Panel (Right Sidebar) -->
        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto;">
            <button class="action-btn" id="btnView">
                <i class="bi bi-eye"></i> View
            </button>
            <button class="action-btn" id="btnAdd">
                <i class="bi bi-plus-circle"></i> Add
            </button>
            <button class="action-btn" id="btnEdit">
                <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="action-btn" id="btnDelete">
                <i class="bi bi-trash"></i> Delete
            </button>
            <button class="action-btn" id="btnSave">
                <i class="bi bi-download"></i> Save
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="gl-stop-payment.js"></script>
</body>

</html>
