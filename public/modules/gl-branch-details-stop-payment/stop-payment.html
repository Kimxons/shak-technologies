<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL - Stop Payment/Void Book</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="stop-payment.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="gsp-container">
  <div style="display: grid; grid-template-columns: 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div style="padding: 16px; border-bottom: 1px solid #e5e7eb;">
          <!-- Row 1: Branch ID, Head Office -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; align-items: flex-end;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Branch ID</label>
              <input type="text" class="form-control" id="gsp-branch-id" value="0101" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Head Office</label>
              <input type="text" class="form-control" id="gsp-head-office" />
            </div>
          </div>

          <!-- Row 2: Account ID, Request Ref No -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Account ID</label>
              <input type="text" class="form-control" id="gsp-account-id" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Request Ref No</label>
              <input type="text" class="form-control" id="gsp-request-ref-no" />
            </div>
          </div>
        </div>

        <!-- Payment Details Section -->
        <div style="padding: 16px; border-bottom: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; font-weight: 600; font-size: 0.875rem; margin-bottom: 12px;">
            Payment Type
          </div>

          <!-- Row 1: Payment Type, Cheque Start, Cheque End -->
          <div style="display: grid; grid-template-columns: 150px 1fr 1fr; gap: 12px; margin-bottom: 12px; align-items: flex-end;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Payment Type</label>
              <select class="form-select" id="gsp-payment-type">
                <option selected>VOID</option>
                <option>STOP</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque Start</label>
              <input type="text" class="form-control" id="gsp-cheque-start" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque End</label>
              <input type="text" class="form-control" id="gsp-cheque-end" />
            </div>
          </div>

          <!-- Row 2: Cheque Date, Cheque Amount -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque Date</label>
              <select class="form-select" id="gsp-cheque-date">
                <option selected>--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Cheque Amount</label>
              <input type="text" class="form-control" id="gsp-cheque-amount" />
            </div>
          </div>

          <!-- Row 3: Reason ID, Reason, Stop Payment Date -->
          <div style="display: grid; grid-template-columns: 150px 1fr 1fr; gap: 12px; margin-bottom: 12px; align-items: flex-end;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Reason ID</label>
              <select class="form-select" id="gsp-reason-id">
                <option selected>--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Reason</label>
              <input type="text" class="form-control" id="gsp-reason" />
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; display: block; margin-bottom: 4px;">Stop Payment Date</label>
              <input type="date" class="form-control" id="gsp-stop-payment-date" />
            </div>
          </div>

          <!-- Row 4: Instruction Given By -->
          <div style="display: grid; grid-template-columns: 150px 1fr 1fr; gap: 12px;">
            <label style="font-weight: 600; color: #1f2937; font-size: 0.875rem; text-align: right;">Instruction Given By</label>
            <input type="text" class="form-control" id="gsp-instruction-given-by" style="grid-column: 2 / 4;" />
          </div>
        </div>

        <!-- Data Table Section -->
        <div style="padding: 16px; border-bottom: 1px solid #e5e7eb;">
          <div style="border: 1px solid #d1d5db; border-radius: 0.375rem; overflow: hidden;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.875rem;">
              <thead style="background: #f3f4f6; border-bottom: 1px solid #d1d5db;">
                <tr>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Prefix</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Start</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">End</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Cheque Date</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Reason</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Stop Date</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151; border-right: 1px solid #d1d5db;">Amount</th>
                  <th style="padding: 8px 12px; text-align: left; font-weight: 600; color: #374151;">InstructionGivenBy</th>
                </tr>
              </thead>
              <tbody>
                <tr style="border-bottom: 1px solid #d1d5db;">
                  <td style="padding: 8px 12px; border-right: 1px solid #d1d5db; color: #6b7280;">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div style="padding: 16px; background: #5b9fd9; color: white; border-radius: 0.375rem; margin-bottom: 12px;">
          <div style="font-weight: 600; font-size: 0.9375rem; margin-bottom: 12px;">Behind The Scene</div>
          
          <!-- Row 1: Created By, Approved By, Processed By -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.85); font-size: 0.875rem; display: block; margin-bottom: 4px;">Created By</label>
              <input type="text" class="form-control" id="gsp-created-by" readonly style="background-color: rgba(255, 255, 255, 0.08); color: white; border-color: rgba(255, 255, 255, 0.2);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.85); font-size: 0.875rem; display: block; margin-bottom: 4px;">Approved By</label>
              <input type="text" class="form-control" id="gsp-approved-by" readonly style="background-color: rgba(255, 255, 255, 0.08); color: white; border-color: rgba(255, 255, 255, 0.2);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.85); font-size: 0.875rem; display: block; margin-bottom: 4px;">Processed By</label>
              <input type="text" class="form-control" id="gsp-processed-by" readonly style="background-color: rgba(255, 255, 255, 0.08); color: white; border-color: rgba(255, 255, 255, 0.2);" />
            </div>
            <div></div>
          </div>

          <!-- Row 2: Created On, Approved On, Processed On -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.85); font-size: 0.875rem; display: block; margin-bottom: 4px;">Created On</label>
              <input type="text" class="form-control" id="gsp-created-on" readonly style="background-color: rgba(255, 255, 255, 0.08); color: white; border-color: rgba(255, 255, 255, 0.2);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.85); font-size: 0.875rem; display: block; margin-bottom: 4px;">Approved On</label>
              <input type="text" class="form-control" id="gsp-approved-on" readonly style="background-color: rgba(255, 255, 255, 0.08); color: white; border-color: rgba(255, 255, 255, 0.2);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.85); font-size: 0.875rem; display: block; margin-bottom: 4px;">Processed On</label>
              <input type="text" class="form-control" id="gsp-processed-on" readonly style="background-color: rgba(255, 255, 255, 0.08); color: white; border-color: rgba(255, 255, 255, 0.2);" />
            </div>
            <div></div>
          </div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 16px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 12px; border-radius: 0.375rem; font-weight: 600; font-size: 0.9375rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="gsp-action-btn" id="gsp-view-btn">View</button>
      <button class="gsp-action-btn" id="gsp-add-btn">Add</button>
      <button class="gsp-action-btn" id="gsp-edit-btn">Edit</button>
      <button class="gsp-action-btn" id="gsp-delete-btn">Delete</button>
      <button class="gsp-action-btn" id="gsp-save-btn">Save</button>
      <button class="gsp-action-btn" id="gsp-submit-btn">Submit</button>
      <button class="gsp-action-btn" id="gsp-cancel-btn">Cancel</button>
    </div>
  </div>
</div>

<script src="stop-payment.js"></script>
</body>
</html>
