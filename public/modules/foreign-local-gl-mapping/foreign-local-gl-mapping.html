<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foreign-Local GL Mapping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <form id="gl-mapping-form" autocomplete="off" novalidate>
                    <div class="form-card">
                        <!-- Foreign ↔ Local GL Mapping Section -->
                        <div class="form-section" data-section="gl-mapping">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-link-45deg"></i>Foreign ↔ Local GL Mapping</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col" style="grid-column: span 2;">
                                        <label>Branch ID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="branchId" class="kairo-branch-control__id" value="0101" aria-label="Branch ID">
                                            <input type="text" id="branchName" class="kairo-branch-control__name" value="Head Office" aria-label="Branch Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchBranchBtn"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col" style="grid-column: span 2;">
                                        <label>Foreign AccountID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="foreignAccountId" class="kairo-branch-control__id" placeholder="Enter foreign account ID" aria-label="Foreign Account ID">
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchForeignBtn"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col" style="grid-column: span 2;">
                                        <label>Local AccountID</label>
                                        <div class="kairo-branch-control" data-kairo-branch-control>
                                            <input type="text" id="localAccountId" class="kairo-branch-control__id" placeholder="Enter local account ID" aria-label="Local Account ID">
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchLocalBtn"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Behind The Scene Section -->
                        <div class="form-section" data-section="behind-the-scene">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-info-circle"></i>Behind The Scene</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Created By</label>
                                        <input type="text" class="bs-input-text" id="createdBy" name="createdBy" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Modified By</label>
                                        <input type="text" class="bs-input-text" id="modifiedBy" name="modifiedBy" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Supervised By</label>
                                        <input type="text" class="bs-input-text" id="supervisedBy" name="supervisedBy" readonly>
                                    </div>
                                </div>
                                <div class="form-row four-col">
                                    <div class="col">
                                        <label>Created On</label>
                                        <input type="text" class="bs-input-text" id="createdOn" name="createdOn" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Modified On</label>
                                        <input type="text" class="bs-input-text" id="modifiedOn" name="modifiedOn" readonly>
                                    </div>
                                    <div class="col">
                                        <label>Supervised On</label>
                                        <input type="text" class="bs-input-text" id="supervisedOn" name="supervisedOn" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Action Panel -->
            <div class="action-panel">
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-action--view" id="viewBtn">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action btn-action--add" id="addBtn">
                        <i class="bi bi-plus-circle"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="btn-action btn-action--edit" id="editBtn">
                        <i class="bi bi-pencil"></i>
                        <span>Edit</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="deleteBtn">
                        <i class="bi bi-trash"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="btn-action btn-action--success" id="saveBtn">
                        <i class="bi bi-save"></i>
                        <span>Save</span>
                    </button>
                    <button type="button" class="btn-action btn-delete" id="cancelBtn">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancel</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="foreign-local-gl-mapping.js"></script>
</body>
</html>
