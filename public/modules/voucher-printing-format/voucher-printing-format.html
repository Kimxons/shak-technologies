<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Printing Format</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="voucher-printing-format.css">
</head>
<body class="voucher-printing-format">
    <div class="voucher-format-container">
        <!-- Main Content Area -->
        <div class="voucher-content">
            <form id="voucher-format-form" autocomplete="off" novalidate>
                <!-- Format Details Section -->
                <div class="form-card">
                    <div class="form-section" data-section="format-details">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-gear"></i> Format Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Section" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label for="formatId">Format</label>
                                    <select class="bs-input-text" id="formatId" name="formatId">
                                        <option value="">--Select--</option>
                                        <!-- Populated from p_GetVoucherFormats -->
                                    </select>
                                </div>
                                <div class="col">
                                    <label for="voucherFormatTypeId">Voucher Format Type</label>
                                    <select class="bs-input-text" id="voucherFormatTypeId" name="voucherFormatTypeId">
                                        <option value="">--Select--</option>
                                        <!-- Populated from VoucherFormatTypeID system code -->
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col full-width">
                                    <textarea class="bs-input-text format-editor" id="voucherFormat" name="voucherFormat" rows="25" placeholder="Format content will appear here..." style="min-height: 450px; resize: both;"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Right Action Panel -->
        <div class="action-panel">
            <div class="action-buttons">
                <button type="button" class="btn-action" data-action="format" id="formatBtn">
                    <i class="bi bi-magic"></i>
                    <span>Format</span>
                </button>
                <button type="button" class="btn-action btn-action--view" data-action="view" id="viewBtn">
                    <i class="bi bi-eye"></i>
                    <span>View</span>
                </button>
                <button type="button" class="btn-action btn-action--edit" data-action="edit" id="editBtn">
                    <i class="bi bi-pencil"></i>
                    <span>Edit</span>
                </button>
                <button type="button" class="btn-action btn-action--success" data-action="save" id="saveBtn">
                    <i class="bi bi-save"></i>
                    <span>Save</span>
                </button>
                <button type="button" class="btn-action btn-delete" data-action="cancel" id="cancelBtn">
                    <i class="bi bi-x-circle"></i>
                    <span>Cancel</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Message Panel -->
    <div class="message-panel" id="messagePanel">
        <i class="bi bi-info-circle"></i>
        <span id="messageText"></span>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../assets/js/services/shared/lookupService.js"></script>
    <script src="../../assets/js/services/utilities/voucherFormatService.js"></script>
    <script src="voucher-printing-format.js"></script>
</body>
</html>
