<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL Account Sub Type</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="gl-account-sub-type.css">
</head>
<body style="margin: 0; padding: 0; background: transparent;">

<div class="gl-account-sub-type">
  <div style="display: grid; grid-template-columns: 160px 1fr 160px; gap: 8px; height: 100%; padding: 8px;">
    <!-- Left Panel - DataEntry Button -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="position: relative;">
        <button class="gast-action-btn" id="dataEntryBtn" style="width: 100%;">DataEntry</button>
        <div id="dataEntrySubmenu" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #d1d5db; border-radius: 0.375rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); z-index: 1000; margin-top: 4px;">
          <button class="gast-submenu-item" id="glAccountSubTypeNestedBtn" style="width: 100%; padding: 10px 12px; text-align: left; border: none; background: white; color: #1f2937; cursor: pointer; font-size: 0.85rem; font-weight: 500; border-bottom: 1px solid #e5e7eb;">
            <i class="bi bi-list"></i> GL Account Sub Type
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div style="display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(91, 159, 217, 0.18); border-radius: 1.5rem; padding: 12px;">
      <div style="overflow-y: auto; flex: 1;">
        <!-- Query Section -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb;">
          <!-- Blue Header Section -->
          <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; margin-bottom: 12px; font-weight: 600; font-size: 0.85rem;">
            GL Sub Type Group
          </div>

          <!-- Row 1: GL Sub Type Group Dropdown and Sub Account Type ID -->
          <div style="display: grid; grid-template-columns: 200px 1fr; gap: 12px; margin-bottom: 12px; align-items: flex-end;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">GL Sub Type Group</label>
              <select class="form-select" id="glSubTypeGroupSelect">
                <option selected>--Select--</option>
              </select>
            </div>
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Sub Account Type ID</label>
              <input type="text" class="form-control" id="subAccountTypeIdField" />
            </div>
          </div>

          <!-- Row 2: Description -->
          <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: #1f2937; font-size: 0.75rem; display: block; margin-bottom: 4px;">Description</label>
              <textarea class="form-control" id="descriptionField" rows="2" style="resize: vertical;"></textarea>
            </div>
          </div>
        </div>

        <!-- Action Buttons (Content Area) -->
        <div style="padding: 12px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; justify-content: center;">
          <button class="gast-action-secondary-btn" id="newBtn">New</button>
          <button class="gast-action-secondary-btn" id="alterBtn">Alter</button>
          <button class="gast-action-secondary-btn" id="removeBtn">Remove</button>
          <button class="gast-action-secondary-btn" id="updateBtn">Update</button>
          <button class="gast-action-secondary-btn" id="clearBtn">Clear</button>
        </div>

        <!-- Sub Account Type Table Section -->
        <div style="padding: 12px; flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid #e5e7eb;">
          <div style="overflow: auto; flex: 1; border: 1px solid #d1d5db; border-radius: 0.375rem;">
            <table class="table" style="margin-bottom: 0;">
              <thead>
                <tr>
                  <th>Sub Account Type ID</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody id="subAccountTypeTableBody">
                <tr style="text-align: center; color: #64748b; font-size: 0.8rem;">
                  <td colspan="2" style="padding: 20px;">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div style="padding: 12px; background: #5b9fd9; color: white; border-radius: 0.375rem; margin-bottom: 12px;">
          <div style="font-weight: 600; font-size: 0.85rem; margin-bottom: 12px;">Behind The Scene</div>
          
          <!-- Behind The Scene Fields -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <!-- Row 1: Created By, Modified By, Supervised By -->
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.8); font-size: 0.75rem; display: block; margin-bottom: 4px;">Created By</label>
              <input type="text" class="form-control" id="createdByField" readonly style="background-color: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.3);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.8); font-size: 0.75rem; display: block; margin-bottom: 4px;">Modified By</label>
              <input type="text" class="form-control" id="modifiedByField" readonly style="background-color: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.3);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.8); font-size: 0.75rem; display: block; margin-bottom: 4px;">Supervised By</label>
              <input type="text" class="form-control" id="supervisedByField" readonly style="background-color: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.3);" />
            </div>
          </div>

          <!-- Row 2: Created On, Modified On, Supervised On -->
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.8); font-size: 0.75rem; display: block; margin-bottom: 4px;">Created On</label>
              <input type="text" class="form-control" id="createdOnField" readonly style="background-color: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.3);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.8); font-size: 0.75rem; display: block; margin-bottom: 4px;">Modified On</label>
              <input type="text" class="form-control" id="modifiedOnField" readonly style="background-color: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.3);" />
            </div>
            <div>
              <label style="font-weight: 600; color: rgba(255, 255, 255, 0.8); font-size: 0.75rem; display: block; margin-bottom: 4px;">Supervised On</label>
              <input type="text" class="form-control" id="supervisedOnField" readonly style="background-color: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.3);" />
            </div>
          </div>
        </div>

        <!-- BR.Net Web Banking Section -->
        <div style="padding: 12px; border-top: 1px solid #e5e7eb;">
          <div style="background: #5b9fd9; color: white; padding: 8px 12px; border-radius: 0.375rem; font-weight: 600; font-size: 0.85rem;">
            BR.Net Web Banking
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Action Buttons -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="gast-action-btn" id="viewBtn">View</button>
      <button class="gast-action-btn" id="addBtn">Add</button>
      <button class="gast-action-btn" id="editBtn">Edit</button>
      <button class="gast-action-btn" id="deleteBtn">Delete</button>
      <button class="gast-action-btn" id="saveBtn">Save</button>
      <button class="gast-action-btn" id="cancelBtn">Cancel</button>
      <button class="gast-action-btn" id="backBtn">Back</button>
    </div>
  </div>
</div>

<script src="gl-account-sub-type.js"></script>
</body>
</html>
