<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Score</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="window">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Form Content -->
            <div class="form-content">
                <div class="form-card" data-main-form>


                    <form id="clientScoreForm" novalidate>
                        <!-- Client Score Details Section -->
                        <div class="form-section" data-section="client-score-details">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-clipboard-data"></i> Client Score Details</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Client Score Details" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Application ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="applicationId" class="kairo-branch-control__id" placeholder="Enter ID">
                                            <input type="text" id="applicationName" class="kairo-branch-control__name" placeholder="Application Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchApplicationBtn" aria-label="Search Application"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Client ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="clientId" class="kairo-branch-control__id" placeholder="Enter ID">
                                            <input type="text" id="clientName" class="kairo-branch-control__name" placeholder="Client Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchClientBtn" aria-label="Search Client"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Product ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="productId" class="kairo-branch-control__id" placeholder="Enter ID">
                                            <input type="text" id="productName" class="kairo-branch-control__name" placeholder="Product Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchProductBtn" aria-label="Search Product"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Workflow ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="workflowId" class="kairo-branch-control__id" placeholder="Enter ID">
                                            <input type="text" id="workflowName" class="kairo-branch-control__name" placeholder="Workflow Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchWorkflowBtn" aria-label="Search Workflow"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">WF Stage ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="wfStageId" class="kairo-branch-control__id" placeholder="Enter ID">
                                            <input type="text" id="wfStageName" class="kairo-branch-control__name" placeholder="Stage Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchStageBtn" aria-label="Search Stage"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Questionnaire ID</label>
                                        <div class="kairo-branch-control" data-kairo-control>
                                            <input type="text" id="questionnaireId" class="kairo-branch-control__id" placeholder="Enter ID">
                                            <input type="text" id="questionnaireName" class="kairo-branch-control__name" placeholder="Questionnaire Name" readonly>
                                            <button type="button" class="btn-lookup kairo-branch-control__lookup" id="searchQuestionnaireBtn" aria-label="Search Questionnaire"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col" style="grid-column: span 2">
                                        <label class="label-blue">Remarks</label>
                                        <textarea id="remarks" class="bs-input-text" rows="3" placeholder="Enter remarks"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Questionnaire Section -->
                        <div class="form-section" data-section="questionnaire">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-table"></i> Questionnaire</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Questionnaire" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="table-responsive">
                                    <table class="table table-bordered table-sm">
                                        <thead class="table-light">
                                            <tr>
                                                <th>No</th>
                                                <th>Question</th>
                                                <th>Answer</th>
                                                <th>Client Scores</th>
                                            </tr>
                                        </thead>
                                        <tbody id="questionnaireTable">
                                            <tr>
                                                <td colspan="4" class="text-center text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Behind The Scene Section -->
                        <div class="form-section" data-section="behind-the-scene">
                            <div class="section-header" data-section-toggle>
                                <span class="section-header__title"><i class="bi bi-info-circle"></i> Behind The Scene</span>
                                <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                            <div class="section-content" data-section-content>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Created By</label>
                                        <input type="text" id="createdBy" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Modified By</label>
                                        <input type="text" id="modifiedBy" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Supervised By</label>
                                        <input type="text" id="supervisedBy" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Created On</label>
                                        <input type="text" id="createdOn" class="bs-input-text" readonly>
                                    </div>
                                </div>
                                <div class="form-row two-col">
                                    <div class="col">
                                        <label class="label-blue">Modified On</label>
                                        <input type="text" id="modifiedOn" class="bs-input-text" readonly>
                                    </div>
                                    <div class="col">
                                        <label class="label-blue">Supervised On</label>
                                        <input type="text" id="supervisedOn" class="bs-input-text" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Action Panel -->
            <div class="action-panel">
                <div class="action-panel__header">Actions</div>
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-action="view">
                        <i class="bi bi-eye"></i>
                        <span>View</span>
                    </button>
                    <button type="button" class="btn-action" data-action="add">
                        <i class="bi bi-plus-circle"></i>
                        <span>Add</span>
                    </button>
                    <button type="button" class="btn-action" data-action="edit">
                        <i class="bi bi-pencil"></i>
                        <span>Edit</span>
                    </button>
                    <button type="button" class="btn-action btn-action--danger" data-action="delete">
                        <i class="bi bi-trash"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="btn-action btn-action--success" data-action="save">
                        <i class="bi bi-save"></i>
                        <span>Save</span>
                    </button>
                    <button type="button" class="btn-action" data-action="cancel">
                        <i class="bi bi-x-lg"></i>
                        <span>Cancel</span>
                    </button>
                    <button type="button" class="btn-action" data-action="move-next">
                        <i class="bi bi-arrow-right-circle"></i>
                        <span>Move to Next Stage</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/environment.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/services/shared/coreApi.js"></script>
    <script src="/assets/js/services/shared/serviceLoader.js"></script>
    <script src="client-score.js"></script>
</body>
</html>
