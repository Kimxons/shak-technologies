<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintain Institutions</title>
  <link rel="stylesheet" href="maintain-institutions.css">
</head>
<body>
  <div class="institutions-container">
    <!-- Main Content Area -->
    <div class="institutions-content">
      <!-- Header Section -->
      <div class="institutions-header">
        <h3 class="institutions-title">Maintain Institutions</h3>
      </div>

      <!-- Form Section -->
      <div class="institutions-form">
        <!-- Institution Details -->
        <div class="form-row">
          <div class="form-group">
            <label for="institutionId">Institution ID</label>
            <input type="text" id="institutionId" class="form-control" readonly>
            <button type="button" class="search-btn" aria-label="Search Institution">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="institutionName">Institution Name</label>
            <input type="text" id="institutionName" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="address1">Address 1</label>
            <input type="text" id="address1" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="address2">Address 2</label>
            <input type="text" id="address2" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <select id="city" class="form-control">
              <option value="">--Select--</option>
            </select>
          </div>
          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" class="form-control">
              <option value="">--Select--</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="zipCode">Zip Code</label>
            <input type="text" id="zipCode" class="form-control">
          </div>
          <div class="form-group">
            <label for="emailId">Email ID</label>
            <input type="email" id="emailId" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone1">Phone 1</label>
            <input type="tel" id="phone1" class="form-control">
          </div>
          <div class="form-group">
            <label for="phone2">Phone 2</label>
            <input type="tel" id="phone2" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mobile">Mobile</label>
            <input type="tel" id="mobile" class="form-control">
          </div>
          <div class="form-group">
            <label for="faxNo">Fax No</label>
            <input type="tel" id="faxNo" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="contactPerson">Contact Person</label>
            <input type="text" id="contactPerson" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="exposureLimit">Exposure Limit</label>
            <input type="text" id="exposureLimit" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="etb">ETB</label>
            <input type="text" id="etb" class="form-control">
          </div>
          <div class="form-group">
            <label for="payrollLay">Payroll Lay</label>
            <input type="text" id="payrollLay" class="form-control">
          </div>
        </div>

        <!-- Behind The Scene Section -->
        <div class="behind-scene-section">
          <div class="section-header">Behind The Scene</div>
          <div class="behind-scene-content">
            <div class="form-row">
              <div class="form-group">
                <label for="noOfLeasts">No Of Leasts</label>
                <input type="text" id="noOfLeasts" class="form-control" readonly>
              </div>
              <div class="form-group">
                <label for="noOfBorrowers">No Of Borrowers</label>
                <input type="text" id="noOfBorrowers" class="form-control" readonly>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="loanAmount">Loan Amount</label>
                <input type="text" id="loanAmount" class="form-control" readonly>
              </div>
              <div class="form-group">
                <label for="loanBalance">Loan Balance</label>
                <input type="text" id="loanBalance" class="form-control" readonly>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="createdBy">Created By</label>
                <input type="text" id="createdBy" class="form-control" readonly>
              </div>
              <div class="form-group">
                <label for="modifiedBy">Modified By</label>
                <input type="text" id="modifiedBy" class="form-control" readonly>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="createdOn">Created On</label>
                <input type="text" id="createdOn" class="form-control" readonly>
              </div>
              <div class="form-group">
                <label for="modifiedOn">Modified On</label>
                <input type="text" id="modifiedOn" class="form-control" readonly>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="supervisedBy">Supervised By</label>
                <input type="text" id="supervisedBy" class="form-control" readonly>
              </div>
              <div class="form-group">
                <label for="supervisedOn">Supervised On</label>
                <input type="text" id="supervisedOn" class="form-control" readonly>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Panel -->
    <div class="action-panel">
      <button type="button" class="action-btn action-btn-view">View</button>
      <button type="button" class="action-btn action-btn-add">Add</button>
      <button type="button" class="action-btn action-btn-edit">Edit</button>
      <button type="button" class="action-btn action-btn-delete">Delete</button>
      <button type="button" class="action-btn action-btn-save" disabled>Save</button>
      <button type="button" class="action-btn action-btn-cancel">Cancel</button>
    </div>
  </div>

  <script src="maintain-institutions.js"></script>
</body>
</html>
