<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depreciation Schedule · Fixed Asset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
  <style>
    /* ========== Depreciation Schedule Table Styles ========== */
    .ds-table {
      font-size: 12px;
    }
    
    .ds-table thead {
      background: linear-gradient(180deg, #4a7c95 0%, #3d6a80 100%);
      color: #fff;
    }
    
    .ds-table thead th {
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 10px 12px;
      border: none;
      white-space: nowrap;
    }
    
    .ds-table tbody td {
      padding: 10px 12px;
      vertical-align: middle;
      border-bottom: 1px solid #e9ecef;
    }
    
    .ds-table tbody tr:hover {
      background-color: rgba(74, 124, 149, 0.08);
    }
    
    .ds-table tbody tr:last-child td {
      border-bottom: none;
    }
    
    .table-empty-message {
      text-align: center;
      color: #6c757d;
      padding: 40px 20px !important;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="window">
    <!-- Title Bar (Header) -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-graph-down am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Depreciation Schedule</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container" aria-label="Depreciation Schedule">
      <div class="form-content" role="region" aria-label="Depreciation Schedule data">
        <div class="form-card" data-main-form>
          <!-- Depreciation Schedule Table Section -->
          <div class="form-section" data-section="depreciation-schedule">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-table"></i>Schedule Records</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Depreciation Schedule" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="table-responsive">
                <table class="table table-sm table-hover align-middle mb-0 ds-table" aria-label="Depreciation schedule table">
                  <thead>
                    <tr>
                      <th scope="col">Schedule Serial Number</th>
                      <th scope="col">Depreciation Date</th>
                      <th scope="col" class="text-end">Depreciation Amount</th>
                      <th scope="col" class="text-end">Book Value</th>
                    </tr>
                  </thead>
                  <tbody id="depreciationScheduleBody">
                    <tr>
                      <td colspan="4" class="table-empty-message">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Behind the Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind the Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button class="btn-action btn-view" type="button" data-action="view"><i class="bi bi-eye me-1"></i>View</button>
          <button class="btn-action" type="button" data-action="print"><i class="bi bi-printer me-1"></i>Print</button>
          <button class="btn-action btn-cancel" type="button" data-action="back"><i class="bi bi-arrow-left me-1"></i>Back</button>
        </div>
      </div>
    </main>

    <!-- Message Panel -->
    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading schedule...</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/utils/global-utils.js"></script>
  <script>
    // ========== Depreciation Schedule Submodule ==========
    (function() {
      // Header Window Controls
      document.addEventListener('DOMContentLoaded', function() {
        const headerRight = document.querySelector('.am-header__right');
        if (headerRight) {
          // Refresh button
          const refreshBtn = headerRight.querySelector('[data-action="refresh"]');
          if (refreshBtn) {
            refreshBtn.addEventListener('click', function() {
              window.location.reload();
            });
          }

          // Maximize button
          const maximizeBtn = headerRight.querySelector('[data-action="maximize"]');
          if (maximizeBtn) {
            maximizeBtn.addEventListener('click', function() {
              const windowEl = document.querySelector('.window');
              windowEl.classList.toggle('maximized');
              const icon = maximizeBtn.querySelector('i');
              if (windowEl.classList.contains('maximized')) {
                icon.classList.remove('bi-square');
                icon.classList.add('bi-arrows-angle-contract');
              } else {
                icon.classList.remove('bi-arrows-angle-contract');
                icon.classList.add('bi-square');
              }
            });
          }

          // Close button
          const closeBtn = headerRight.querySelector('[data-action="close"]');
          if (closeBtn) {
            closeBtn.addEventListener('click', function() {
              navigateBack();
            });
          }
        }

        // Action Panel Buttons
        const actionPanel = document.querySelector('.action-panel');
        if (actionPanel) {
          // Print button
          const printBtn = actionPanel.querySelector('[data-action="print"]');
          if (printBtn) {
            printBtn.addEventListener('click', function() {
              window.print();
            });
          }

          // Back button
          const backBtn = actionPanel.querySelector('[data-action="back"]');
          if (backBtn) {
            backBtn.addEventListener('click', function() {
              navigateBack();
            });
          }

          // View button
          const viewBtn = actionPanel.querySelector('[data-action="view"]');
          if (viewBtn) {
            viewBtn.addEventListener('click', function() {
              // Refresh data view
              window.location.reload();
            });
          }
        }

        // Section Toggle Functionality
        document.querySelectorAll('.form-section [data-section-toggle]').forEach(header => {
          header.addEventListener('click', function(e) {
            e.preventDefault();
            
            const section = this.closest('.form-section');
            if (!section) return;

            const content = section.querySelector('[data-section-content]');
            const icon = this.querySelector('.section-toggle-btn i');
            const toggleBtn = this.querySelector('.section-toggle-btn');

            section.classList.toggle('collapsed');

            if (icon) {
              icon.classList.toggle('bi-chevron-up');
              icon.classList.toggle('bi-chevron-down');
            }

            if (toggleBtn) {
              const isExpanded = !section.classList.contains('collapsed');
              toggleBtn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
            }
          });
        });

        console.log('[DepreciationSchedule] Initialized');
      });

      // Navigate back to Fixed Asset Maintenance
      function navigateBack() {
        try {
          const parentWin = window.parent;
          if (parentWin && parentWin !== window) {
            // In iframe context
            const url = new URL('../views/FixedAssetMaintenance.html', window.location.href);
            url.searchParams.set('t', String(Date.now()));
            window.location.href = url.toString();
            return;
          }
        } catch (e) {
          // ignore
        }

        // Fallback: browser history or direct navigation
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '../views/FixedAssetMaintenance.html';
        }
      }
    })();
  </script>
</body>
</html>
