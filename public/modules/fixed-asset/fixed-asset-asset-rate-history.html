<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asset Rate History · Fixed Asset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance fixed-asset fixed-asset-asset-rate-history copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="fa-arh-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-3">
          <header class="d-flex align-items-center justify-content-between mb-2">
            <h3 class="section-title mb-0">Asset Rate History</h3>
            <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
          </header>

          <div class="fa-arh-grid cm-grid-surface" aria-label="Asset rate history grid">
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Asset Type</th>
                    <th scope="col">Rate TypeID</th>
                    <th scope="col">Rate Type</th>
                    <th scope="col">Start Date</th>
                    <th scope="col">End Date</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="5" class="text-muted py-2">No records to display.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Actions</p>
          <div class="cp-actions">
            <button type="button" class="cm-shell__action" data-fa-arh-action="back">Back</button>
          </div>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/pages/fixed-asset/fixed-asset-asset-rate-history.js"></script>
</body>

</html>
