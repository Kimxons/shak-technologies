<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asset Reevaluation · Fixed Asset</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/maincss.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css" />
</head>

<body>
  <div class="window">
    <!-- Title Bar -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-graph-up-arrow am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Asset Reevaluation</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize window">
          <i class="bi bi-dash-lg"></i>
        </button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window">
          <i class="bi bi-square"></i>
        </button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
      <!-- Form Content -->
      <div class="form-content" role="region">
        <div class="form-card" data-main-form>
          <!-- Reevaluation Details Section -->
          <div class="form-section" data-section="reevaluation-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-graph-up-arrow"></i>Reevaluation Details
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Reevaluation Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="branchId">Branch ID</label>
                  <div class="kairo-product-control">
                    <input type="text" class="bs-input kairo-product-control__id" id="branchId" value="0101" data-always-enabled />
                    <input type="text" class="bs-input kairo-product-control__name" id="branchName" value="Head Office" readonly />
                    <button class="btn-lookup" type="button" aria-label="Search Branch" data-always-enabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue" for="reevaluationId">Reevaluation ID</label>
                  <div class="kairo-product-control">
                    <input type="text" class="bs-input kairo-product-control__id" id="reevaluationId" data-always-enabled />
                    <button class="btn-lookup" type="button" aria-label="Search Reevaluation" data-always-enabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="assetId">Asset ID</label>
                  <div class="kairo-product-control">
                    <input type="text" class="bs-input kairo-product-control__id" id="assetId" disabled />
                    <input type="text" class="bs-input kairo-product-control__name" id="assetDesc" readonly />
                    <button class="btn-lookup" type="button" aria-label="Search Asset">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue" for="reevaluationType">Reevaluation Type</label>
                  <select class="bs-input" id="reevaluationType" disabled>
                    <option selected>--Select--</option>
                    <option>Increase</option>
                    <option>Decrease</option>
                  </select>
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="reevaluationAmount">Reevaluation Amount</label>
                  <input type="text" class="bs-input" id="reevaluationAmount" disabled />
                </div>
                <div class="col">
                  <label class="label-blue" for="reevaluationPeriod">Reevaluation Period</label>
                  <input type="text" class="bs-input" id="reevaluationPeriod" disabled />
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="reevaluationBy">Reevaluation By</label>
                  <div class="kairo-product-control">
                    <input type="text" class="bs-input kairo-product-control__id" id="reevaluationBy" disabled />
                    <input type="text" class="bs-input kairo-product-control__name" id="reevaluationByName" readonly />
                    <button class="btn-lookup" type="button" aria-label="Search Reevaluation By">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue" for="reevaluationDate">Reevaluation Date</label>
                  <div class="kairo-product-control">
                    <input type="text" class="bs-input kairo-product-control__id" id="reevaluationDate" placeholder="--Select--" disabled />
                    <button class="btn-lookup" type="button" aria-label="Pick Reevaluation Date">
                      <i class="bi bi-calendar3"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="form-row two-col">
                <div class="col" style="grid-column: span 2;">
                  <label class="label-blue" for="remarks">Remarks</label>
                  <textarea class="bs-input" id="remarks" rows="4" disabled></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- Behind The Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-gear"></i>Behind The Scene
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="createdBy" data-field="createdBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="modifiedBy" data-field="modifiedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="supervisedBy" data-field="supervisedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="createdOn" data-field="createdOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="modifiedOn" data-field="modifiedOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="supervisedOn" data-field="supervisedOn"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view">
            <i class="bi bi-eye"></i>View
          </button>
          <button type="button" class="btn-action btn-add" data-action="add" disabled>
            <i class="bi bi-plus-lg"></i>Add
          </button>
          <button type="button" class="btn-action btn-edit" data-action="edit" disabled>
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button type="button" class="btn-action btn-delete" data-action="delete" disabled>
            <i class="bi bi-trash"></i>Delete
          </button>
          <button type="button" class="btn-action btn-save" data-action="save" disabled>
            <i class="bi bi-floppy"></i>Save
          </button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel">
            <i class="bi bi-x-circle"></i>Cancel
          </button>
        </div>
      </div>
    </main>

    <!-- Message Panel -->
    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span id="arevToast"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../../../assets/js/utils/global-utils.js"></script>
  <script>
    (function() {
      // Section toggle functionality
      document.querySelectorAll('[data-section-toggle]').forEach(function(header) {
        header.addEventListener('click', function() {
          const section = header.closest('.form-section');
          const content = section.querySelector('[data-section-content]');
          const toggleBtn = header.querySelector('.section-toggle-btn');
          const icon = toggleBtn?.querySelector('i');
          
          if (section.classList.contains('collapsed')) {
            section.classList.remove('collapsed');
            if (content) content.hidden = false;
            if (icon) icon.className = 'bi bi-chevron-up';
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
          } else {
            section.classList.add('collapsed');
            if (content) content.hidden = true;
            if (icon) icon.className = 'bi bi-chevron-down';
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
          }
        });
      });
    })();
  </script>
</body>

</html>
