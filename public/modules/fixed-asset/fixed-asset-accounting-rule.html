<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accounting Rule · Fixed Asset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance fixed-asset fixed-asset-accounting-rule copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="fa-ar-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-3">
          <header class="d-flex align-items-center justify-content-between mb-2">
            <h3 class="section-title mb-0">Accounting Rule</h3>
            <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
          </header>

          <div class="fa-layout">
            <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
              <div class="cm-nav-section">
                <button type="button" class="cm-nav-toggle">
                  <span class="cm-nav-toggle__label">Data Entry</span>
                  <i class="bi bi-chevron-down"></i>
                </button>
                <div class="cm-nav-items">
                  <button type="button" class="cm-legacy-nav__item" data-fa-type-nav="gl-interface">
                    <span>Gl Interface</span>
                  </button>
                  <button type="button" class="cm-legacy-nav__item is-active" aria-current="page" data-fa-type-nav="accounting-rule">
                    <span>Accounting Rule</span>
                  </button>
                </div>
              </div>

              <div class="cm-nav-section">
                <button type="button" class="cm-nav-toggle">
                  <span class="cm-nav-toggle__label">View</span>
                  <i class="bi bi-chevron-right"></i>
                </button>
                <div class="cm-nav-items is-collapsed">
                  <button type="button" class="cm-legacy-nav__item" data-fa-type-nav="asset-rate-history">
                    <span>Asset Rate History</span>
                  </button>
                </div>
              </div>
            </aside>

            <div class="fa-canvas">
              <div class="cp-panel fa-ar-panel">
                <div class="fa-ar-top" aria-label="Accounting rule filters">
                  <div class="fa-ar-top__bar" aria-hidden="true"></div>
                  <div class="fa-ar-top__body">
                    <div class="fa-ar-row">
                      <label class="fa-ar-label" for="Event">Event</label>
                      <div class="fa-ar-control">
                        <select class="form-select" id="Event" name="Event" data-always-enabled>
                          <option value="" selected>--Select--</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="fa-ar-fields" aria-label="Accounting rule fields">
                  <div class="fa-ar-row">
                    <label class="fa-ar-label" for="Component">Component</label>
                    <div class="fa-ar-control">
                      <select class="form-select" id="Component" name="Component">
                        <option value="" selected>--Select--</option>
                      </select>
                    </div>
                  </div>

                  <div class="fa-ar-row">
                    <label class="fa-ar-label" for="DebitAccountTag">Debit Account Tag</label>
                    <div class="fa-ar-control">
                      <select class="form-select" id="DebitAccountTag" name="DebitAccountTag">
                        <option value="" selected>--Select--</option>
                      </select>
                    </div>
                  </div>

                  <div class="fa-ar-row">
                    <label class="fa-ar-label" for="CreditAccountTag">Credit Account Tag</label>
                    <div class="fa-ar-control">
                      <select class="form-select" id="CreditAccountTag" name="CreditAccountTag">
                        <option value="" selected>--Select--</option>
                      </select>
                    </div>
                  </div>

                  <div class="fa-ar-row">
                    <label class="fa-ar-label" for="CreditTrxId">Credit Trx ID</label>
                    <div class="fa-ar-control fa-ar-control--lookup">
                      <input type="text" class="form-control" id="CreditTrxId" name="CreditTrxId" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search Credit Trx ID" data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>

                  <div class="fa-ar-row">
                    <label class="fa-ar-label" for="DebitTrxId">Debit Trx ID</label>
                    <div class="fa-ar-control fa-ar-control--lookup">
                      <input type="text" class="form-control" id="DebitTrxId" name="DebitTrxId" />
                      <button class="btn btn-outline-primary" type="button" aria-label="Search Debit Trx ID" data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>

                  <div class="fa-ar-row">
                    <label class="fa-ar-label" for="Narration">Narration</label>
                    <div class="fa-ar-control">
                      <input type="text" class="form-control" id="Narration" name="Narration" />
                    </div>
                  </div>
                </div>

                <div class="fa-ar-toolbar" role="toolbar" aria-label="Grid actions">
                  <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-ar-grid="new" disabled>New</button>
                  <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-ar-grid="alter" disabled>Alter</button>
                  <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-ar-grid="remove" disabled>Remove</button>
                  <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-ar-grid="update" disabled>Update</button>
                  <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-ar-grid="clear" disabled>Clear</button>
                </div>

                <div class="fa-ar-grid cm-grid-surface" aria-label="Accounting rules grid">
                  <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                      <thead>
                        <tr>
                          <th scope="col">Component</th>
                          <th scope="col">Dr AccountTag</th>
                          <th scope="col">Cr AccountTag</th>
                          <th scope="col">CrTrxDescriptionID</th>
                          <th scope="col">DrTrxDescriptionID</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td colspan="5" class="text-muted py-2">No records to display.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface p-3 mt-2">
            <header class="d-flex align-items-center justify-content-between mb-2">
              <h3 class="section-title mb-0">Behind The Scene</h3>
            </header>

            <div class="fa-ar-bts-grid mt-3">
              <div class="fa-ar-bts-col">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="CreatedBy">Created By</label>
                  <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" />
                </div>
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="CreatedOn">Created On</label>
                  <input type="text" class="form-control" id="CreatedOn" name="CreatedOn" />
                </div>
              </div>

              <div class="fa-ar-bts-col">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="ModifiedBy">Modified By</label>
                  <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" />
                </div>
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="ModifiedOn">Modified On</label>
                  <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" />
                </div>
              </div>

              <div class="fa-ar-bts-col">
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="SupervisedBy">Supervised By</label>
                  <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" />
                </div>
                <div class="cbs-field cm-compact-field">
                  <label class="cbs-label" for="SupervisedOn">Supervised On</label>
                  <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" />
                </div>
              </div>
            </div>

            <div id="faArToast" class="alert alert-info mt-3 d-none" role="alert"></div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Actions</p>
          <div class="cp-actions">
            <button type="button" class="cm-shell__action" data-shell-mode="View">View</button>
            <button type="button" class="cm-shell__action" data-shell-mode="Add" disabled>Add</button>
            <button type="button" class="cm-shell__action" data-shell-mode="Update" disabled>Edit</button>
            <button type="button" class="cm-shell__action" data-fa-ar-action="delete" disabled>Delete</button>
            <button type="button" class="cm-shell__action cm-shell__action--success" data-fa-ar-action="save" disabled>Save</button>
            <button type="button" class="cm-shell__action" data-fa-ar-action="cancel" disabled>Cancel</button>
            <button type="button" class="cm-shell__action" data-fa-ar-action="back">Back</button>
          </div>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/pages/fixed-asset/fixed-asset-accounting-rule.js"></script>
</body>

</html>
