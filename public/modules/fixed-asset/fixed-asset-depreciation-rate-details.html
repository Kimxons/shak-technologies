<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rate Details · Fixed Asset Depreciation Rates</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/maincss.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance fixed-asset copilot-theme" data-page="rate-details">
  <div class="window">
    <!-- Title Bar -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-percent am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Rate Details</span>
        <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="refresh" title="Refresh" aria-label="Refresh">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window">
          <i class="bi bi-square"></i>
        </button>
        <button class="de-title-btn am-btn am-btn-secondary" type="button" data-action="close" title="Close" aria-label="Close window">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container" aria-label="Rate Details form">
      <!-- Form Content -->
      <div class="form-content" role="region">
        <div class="form-card" data-main-form>
          <!-- Rate Details Section -->
          <div class="form-section" data-section="rate-details">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-percent"></i>Rate Details
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Rate Details" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <!-- Effective Date -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="EffectiveDate">Effective Date</label>
                  <div class="d-flex gap-1 align-items-center">
                    <input type="text" class="bs-input" id="EffectiveDate" name="EffectiveDate" style="width: 150px;" data-always-enabled />
                    <button class="btn-lookup" type="button" aria-label="Select Effective Date" data-always-enabled>
                      <i class="bi bi-caret-down-fill"></i>
                    </button>
                    <button class="btn-lookup" type="button" aria-label="Search Effective Date" data-always-enabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col"></div>
              </div>

              <!-- Rate Parameters -->
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="FromYear">From Year</label>
                  <input type="text" class="bs-input" id="FromYear" name="FromYear" style="width: 100px;" disabled />
                </div>
                <div class="col">
                  <label class="label-blue" for="ToYear">To Year</label>
                  <input type="text" class="bs-input" id="ToYear" name="ToYear" style="width: 100px;" disabled />
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="Rate">Depreciation Rate (%)</label>
                  <input type="text" class="bs-input" id="Rate" name="Rate" style="width: 100px; text-align: right;" disabled />
                </div>
                <div class="col"></div>
              </div>

              <!-- Inline Action Buttons -->
              <div class="d-flex flex-wrap gap-2 justify-content-center mt-3" role="group" aria-label="Rate details row actions">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-grid-action="new" disabled>New</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-grid-action="alter" disabled>Alter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-grid-action="remove" disabled>Remove</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-grid-action="update" disabled>Update</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-grid-action="clear" disabled>Clear</button>
              </div>
            </div>
          </div>

          <!-- Rate Details Grid Section -->
          <div class="form-section" data-section="grid">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-table"></i>Rate Details List
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Grid" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content p-0" data-section-content>
              <div class="table-responsive">
                <table class="table table-striped mb-0" id="ratesGrid" aria-label="Rate details list">
                  <thead>
                    <tr>
                      <th scope="col">From Year</th>
                      <th scope="col">To Year</th>
                      <th scope="col">Rate</th>
                    </tr>
                  </thead>
                  <tbody id="ratesGridBody">
                    <tr>
                      <td colspan="3" class="py-2">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Record Count Badge -->
              <div class="d-flex justify-content-end align-items-center p-2 border-top">
                <span class="badge bg-secondary" id="recordCount">0 records</span>
              </div>
            </div>
          </div>

          <!-- Toast Alert (inline like product-gl-interface) -->
          <div id="faRdToastAlert" class="alert d-none mt-3" role="status" aria-live="polite"></div>

          <!-- Behind The Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-gear"></i>Behind the Scene
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view">
            <i class="bi bi-eye"></i>View
          </button>
          <button type="button" class="btn-action btn-add" data-action="add" disabled>
            <i class="bi bi-plus-lg"></i>Add
          </button>
          <button type="button" class="btn-action btn-edit" data-action="edit" disabled>
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button type="button" class="btn-action btn-delete" data-action="delete" disabled>
            <i class="bi bi-trash"></i>Delete
          </button>
          <button type="button" class="btn-action btn-save" data-action="save" disabled>
            <i class="bi bi-floppy"></i>Save
          </button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel">
            <i class="bi bi-x-circle"></i>Cancel
          </button>
          <button type="button" class="btn-action" data-action="back">
            <i class="bi bi-arrow-left"></i>Back
          </button>
        </div>
      </div>
    </main>

    <!-- Message Panel (hidden - using inline alert instead) -->
    <div class="am-message-panel d-none" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span id="faRdToast"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/pages/fixed-asset/fixed-asset-depreciation-rate-details.js"></script>
  <script>
    (function() {
      // Window controls - communicate with parent via postMessage
      function closeChild() {
        // Try postMessage first (for iframe communication)
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('closeChildOverlay', '*');
          return;
        }
        // Fallback to history.back for direct navigation
        window.history.back();
      }

      document.addEventListener('click', function(e) {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        if (action === 'close') {
          closeChild();
        } else if (action === 'back') {
          closeChild();
        } else if (action === 'maximize') {
          // Toggle maximize if needed
        } else if (action === 'refresh') {
          window.location.reload();
        }
      });

      // Section toggle functionality
      document.querySelectorAll('[data-section-toggle]').forEach(function(header) {
        header.addEventListener('click', function() {
          const section = header.closest('.form-section');
          const content = section.querySelector('[data-section-content]');
          const toggleBtn = header.querySelector('.section-toggle-btn');
          const icon = toggleBtn?.querySelector('i');
          
          if (section.classList.contains('collapsed')) {
            section.classList.remove('collapsed');
            if (content) content.hidden = false;
            if (icon) icon.className = 'bi bi-chevron-up';
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
          } else {
            section.classList.add('collapsed');
            if (content) content.hidden = true;
            if (icon) icon.className = 'bi bi-chevron-down';
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
          }
        });
      });
    })();
  </script>
</body>

</html>
