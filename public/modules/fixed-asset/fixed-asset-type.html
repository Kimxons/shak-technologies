<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixed Asset Type · Fixed Asset</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/maincss.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body>
  <div class="window">
    <!-- Title Bar -->
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-box-seam am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title">Fixed Asset Type</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="am-btn" type="button" data-action="minimize" title="Minimize" aria-label="Minimize window">
          <i class="bi bi-dash-lg"></i>
        </button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window">
          <i class="bi bi-square"></i>
        </button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header__title">
            <i class="bi bi-grid-3x3-gap"></i>
            <span>SUBMODULES</span>
          </span>
          <button type="button" class="sidebar-toggle" aria-label="Toggle sidebar">
            <i class="bi bi-list"></i>
          </button>
        </div>
        <div class="sidebar-search">
          <i class="bi bi-search sidebar-search__icon"></i>
          <input type="text" class="sidebar-search__input" id="submoduleSearch" placeholder="Search submodules..." aria-label="Search submodules">
          <button type="button" class="sidebar-search__clear" id="submoduleSearchClear" aria-label="Clear search">
            <i class="bi bi-x"></i>
          </button>
        </div>
        <div class="sidebar-content">
          <div class="nav-section--card expanded" data-nav-section>
            <div class="nav-header--card" data-tooltip="Data Entry">
              <div class="nav-header__content">
                <i class="bi bi-pencil-square nav-header__icon"></i>
                <span class="nav-label--card">Data Entry</span>
              </div>
              <div class="nav-header__badge">
                <span class="nav-badge">2</span>
                <button type="button" class="nav-arrow--card" aria-label="Toggle Data Entry" aria-expanded="true">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items--card" id="nav-dataentry">
              <button type="button" class="sidebar-item--enhanced" data-fa-type-nav="gl-interface">
                <div class="sidebar-item__content">
                  <i class="bi bi-diagram-3 sidebar-item__icon"></i>
                  <div class="sidebar-item__text">
                    <span class="sidebar-item__title">GL Interface</span>
                  </div>
                </div>
              </button>
              <button type="button" class="sidebar-item--enhanced" data-fa-type-nav="accounting-rule">
                <div class="sidebar-item__content">
                  <i class="bi bi-calculator sidebar-item__icon"></i>
                  <div class="sidebar-item__text">
                    <span class="sidebar-item__title">Accounting Rule</span>
                  </div>
                </div>
              </button>
            </div>
          </div>
          <div class="nav-section--card" data-nav-section>
            <div class="nav-header--card" data-tooltip="View">
              <div class="nav-header__content">
                <i class="bi bi-eye nav-header__icon"></i>
                <span class="nav-label--card">View</span>
              </div>
              <div class="nav-header__badge">
                <span class="nav-badge">1</span>
                <button type="button" class="nav-arrow--card" aria-label="Toggle View" aria-expanded="false">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items--card" id="nav-view">
              <button type="button" class="sidebar-item--enhanced" data-fa-type-nav="asset-rate-history">
                <div class="sidebar-item__content">
                  <i class="bi bi-clock-history sidebar-item__icon"></i>
                  <div class="sidebar-item__text">
                    <span class="sidebar-item__title">Asset Rate History</span>
                  </div>
                </div>
              </button>
            </div>
          </div>
          <div class="nav-section--card" data-nav-section>
            <div class="nav-header--card" data-tooltip="Recent Activities">
              <div class="nav-header__content">
                <i class="bi bi-clock-history nav-header__icon"></i>
                <span class="nav-label--card">Recent Activities</span>
              </div>
              <div class="nav-header__badge">
                <button type="button" class="nav-arrow--card" aria-label="Toggle Recent Activities" aria-expanded="false">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items--card" id="nav-recent"></div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content" role="region">
        <div class="form-card" data-main-form>
          <!-- Fixed Asset Type Information Section -->
          <div class="form-section" data-section="type-info">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-box-seam"></i>Fixed Asset Type Information
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Fixed Asset Type Information" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="FixedAssetType">Fixed Asset Type</label>
                  <div class="kairo-product-control">
                    <input type="text" class="bs-input kairo-product-control__id" id="FixedAssetType" name="FixedAssetType" data-always-enabled />
                    <button class="btn-lookup" type="button" aria-label="Search Fixed Asset Type" data-always-enabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>
                <div class="col">
                  <label class="label-blue" for="Description">Description</label>
                  <input type="text" class="bs-input" id="Description" name="Description" />
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="RevaluationType">Revaluation Type</label>
                  <select class="bs-select" id="RevaluationType" name="RevaluationType">
                    <option value="" selected>--Select--</option>
                    <option value="SL">Straight Line</option>
                    <option value="DB">Declining Balance</option>
                  </select>
                </div>
                <div class="col">
                  <label class="label-blue">Asset ID Configuration</label>
                  <div class="form-row two-col">
                    <div class="col">
                      <label class="label-blue" for="AssetIdPrefix">Prefix</label>
                      <input type="text" class="bs-input" id="AssetIdPrefix" name="AssetIdPrefix" />
                    </div>
                    <div class="col">
                      <label class="label-blue" for="AssetIdLength">Length</label>
                      <input type="text" class="bs-input" id="AssetIdLength" name="AssetIdLength" />
                    </div>
                  </div>
                  <div class="form-row">
                    <label class="label-blue checkbox" for="AutoId">
                      <input class="bs-checkbox" type="checkbox" id="AutoId" name="AutoId" />
                      Auto Generate ID
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Depreciation Section -->
          <div class="form-section" data-section="depreciation">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-graph-down-arrow"></i>Depreciation
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Depreciation" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="DepreciationMethod">Depreciation Method</label>
                  <select class="bs-select" id="DepreciationMethod" name="DepreciationMethod">
                    <option value="" selected>--Select--</option>
                    <option value="DB">Declining Balance</option>
                    <option value="SL">Straight Line</option>
                  </select>
                </div>
                <div class="col">
                  <label class="label-blue" for="DepreciationFrequency">Depreciation Frequency</label>
                  <select class="bs-select" id="DepreciationFrequency" name="DepreciationFrequency">
                    <option value="" selected>--Select--</option>
                    <option value="M">Monthly</option>
                    <option value="Q">Quarterly</option>
                    <option value="Y">Yearly</option>
                  </select>
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="DepreciationRateType">Depreciation Rate Type</label>
                  <select class="bs-select" id="DepreciationRateType" name="DepreciationRateType">
                    <option value="" selected>--Select--</option>
                    <option value="F">Fixed</option>
                    <option value="V">Variable</option>
                  </select>
                </div>
                <div class="col">
                  <label class="label-blue" for="RateMenu">Rate Menu</label>
                  <select class="bs-select" id="RateMenu" name="RateMenu">
                    <option value="" selected>--Select--</option>
                  </select>
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="DepreciationRate">Depreciation Rate (%)</label>
                  <input type="text" class="bs-input" id="DepreciationRate" name="DepreciationRate" />
                </div>
                <div class="col">
                  <label class="label-blue" for="MaxExpectedLife">Max. Expected Life (Years)</label>
                  <input type="text" class="bs-input" id="MaxExpectedLife" name="MaxExpectedLife" />
                </div>
              </div>

              <div class="form-row two-col">
                <div class="col">
                  <label class="label-blue" for="SalvageRate">Salvage Rate (%)</label>
                  <input type="text" class="bs-input" id="SalvageRate" name="SalvageRate" />
                </div>
                <div class="col">
                  <label class="label-blue checkbox" for="GenerateSchedule">
                    <input class="bs-checkbox" type="checkbox" id="GenerateSchedule" name="GenerateSchedule" />
                    Generate Schedule
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Behind The Scene Section -->
          <div class="form-section" data-section="behind-scene">
            <div class="section-header" data-section-toggle>
              <span class="section-header__title">
                <i class="bi bi-gear"></i>Behind the Scene
              </span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle Behind the Scene" aria-expanded="true">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>
            <div class="section-content" data-section-content>
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="CreatedBy" data-field="createdBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="ModifiedBy" data-field="modifiedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised By</span>
                  <span class="audit-value" id="SupervisedBy" data-field="supervisedBy"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="CreatedOn" data-field="createdOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="ModifiedOn" data-field="modifiedOn"></span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Supervised On</span>
                  <span class="audit-value" id="SupervisedOn" data-field="supervisedOn"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button type="button" class="btn-action btn-view" data-action="view">
            <i class="bi bi-eye"></i>View
          </button>
          <button type="button" class="btn-action btn-add" data-action="add" disabled>
            <i class="bi bi-plus-lg"></i>Add
          </button>
          <button type="button" class="btn-action btn-edit" data-action="edit" disabled>
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button type="button" class="btn-action btn-delete" data-action="delete" disabled>
            <i class="bi bi-trash"></i>Delete
          </button>
          <button type="button" class="btn-action btn-save" data-action="save" disabled>
            <i class="bi bi-floppy"></i>Save
          </button>
          <button type="button" class="btn-action btn-cancel" data-action="cancel">
            <i class="bi bi-x-circle"></i>Cancel
          </button>
        </div>
      </div>
    </main>

    <!-- Message Panel -->
    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span id="fatToast"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/pages/fixed-asset/fixed-asset-type.js"></script>
  <script>
    (function() {
      // Section toggle functionality
      document.querySelectorAll('[data-section-toggle]').forEach(function(header) {
        header.addEventListener('click', function() {
          const section = header.closest('.form-section');
          const content = section.querySelector('[data-section-content]');
          const toggleBtn = header.querySelector('.section-toggle-btn');
          const icon = toggleBtn?.querySelector('i');
          
          if (section.classList.contains('collapsed')) {
            section.classList.remove('collapsed');
            if (content) content.hidden = false;
            if (icon) icon.className = 'bi bi-chevron-up';
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
          } else {
            section.classList.add('collapsed');
            if (content) content.hidden = true;
            if (icon) icon.className = 'bi bi-chevron-down';
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
          }
        });
      });

      // Sidebar nav section toggle (card style)
      document.querySelectorAll('.nav-header--card').forEach(function(header) {
        header.addEventListener('click', function(e) {
          // Don't toggle if clicking the arrow button directly (it handles itself)
          if (e.target.closest('.nav-arrow--card')) return;
          
          const section = header.closest('.nav-section--card');
          const arrow = header.querySelector('.nav-arrow--card');
          toggleNavSection(section, arrow);
        });
      });

      document.querySelectorAll('.nav-arrow--card').forEach(function(arrow) {
        arrow.addEventListener('click', function(e) {
          e.stopPropagation();
          const section = arrow.closest('.nav-section--card');
          toggleNavSection(section, arrow);
        });
      });

      function toggleNavSection(section, arrow) {
        const isExpanded = section.classList.contains('expanded');
        
        if (isExpanded) {
          section.classList.remove('expanded');
          if (arrow) arrow.setAttribute('aria-expanded', 'false');
        } else {
          section.classList.add('expanded');
          if (arrow) arrow.setAttribute('aria-expanded', 'true');
        }
      }

      // Submodule search functionality
      const searchInput = document.getElementById('submoduleSearch');
      const searchClear = document.getElementById('submoduleSearchClear');
      
      if (searchInput && searchClear) {
        searchInput.addEventListener('input', function() {
          const query = this.value.toLowerCase().trim();
          searchClear.classList.toggle('is-visible', query.length > 0);
          
          document.querySelectorAll('.sidebar-item--enhanced').forEach(function(item) {
            const title = item.querySelector('.sidebar-item__title');
            const text = title ? title.textContent.toLowerCase() : '';
            item.style.display = text.includes(query) ? '' : 'none';
          });
        });
        
        searchClear.addEventListener('click', function() {
          searchInput.value = '';
          searchClear.classList.remove('is-visible');
          document.querySelectorAll('.sidebar-item--enhanced').forEach(function(item) {
            item.style.display = '';
          });
          searchInput.focus();
        });
      }
    })();
  </script>
</body>

</html>
