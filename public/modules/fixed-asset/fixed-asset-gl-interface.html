<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GL Interface · Fixed Asset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="../../assets/css/pages/fixed-asset/fixed-asset-premium.css" />
</head>

<body class="client-maintenance fixed-asset fixed-asset-gl-interface copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <div class="fa-main-content">
      <form id="fa-gl-form" autocomplete="off" novalidate>
        <section class="card-surface p-3">
          <header>
            <div class="d-flex align-items-center gap-2">
              <h3 class="section-title">GL Interface</h3>
              <span class="cm-muted" aria-label="Form code">FA01</span>
            </div>
            <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
          </header>

          <div class="fa-layout">
            <aside class="sidebar card-surface" aria-label="Options menu">
              <div class="nav-section">
                <button type="button" class="cm-nav-toggle">
                  <span class="cm-nav-toggle__label">Data Entry</span>
                  <i class="bi bi-chevron-down"></i>
                </button>
                <div class="cm-nav-items">
                  <button type="button" class="cm-legacy-nav__item is-active" aria-current="page"
                    data-fa-type-nav="gl-interface">
                    <span>GL Interface</span>
                  </button>
                  <button type="button" class="cm-legacy-nav__item" data-fa-type-nav="accounting-rule">
                    <span>Accounting Rule</span>
                  </button>
                </div>
              </div>

              <div class="nav-section">
                <button type="button" class="cm-nav-toggle">
                  <span class="cm-nav-toggle__label">View</span>
                  <i class="bi bi-chevron-right"></i>
                </button>
                <div class="nav-items is-collapsed"></div>
              </div>
            </aside>

            <div class="fa-canvas">
              <div class="cp-panel fa-gl-panel">
                <div class="fa-gl-canvas">
                  <div class="fa-gl-topbar" aria-label="Account selector">
                    <div class="fa-gl-topbar__bar" aria-hidden="true"></div>
                    <div class="fa-gl-topbar__rows">
                      <div class="fa-gl-row fa-gl-row--no-btn">
                        <label class="fa-gl-row__label" for="AccountTag" style="color: blue; font-weight: bold;">Account
                          Tag</label>
                        <div class="fa-gl-row__control">
                          <select class="form-select" id="AccountTag" name="AccountTag" data-always-enabled>
                            <option value="" selected>--Select--</option>
                          </select>
                        </div>
                      </div>

                      <div class="fa-gl-row">
                        <label class="fa-gl-row__label" for="AccountId" style="color: blue; font-weight: bold;">Account
                          ID</label>
                        <div class="fa-gl-row__control d-flex gap-0">
                          <input type="text" class="form-control" id="AccountId" name="AccountId" data-always-enabled
                            style="width: 120px; border-top-right-radius: 0; border-bottom-right-radius: 0;" />
                          <input type="text" class="form-control" id="AccountName" name="AccountName" readonly
                            style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; background-color: #f8f9fa;" />
                        </div>
                        <button class="btn fa-gl-search" type="button" aria-label="Search Account" data-always-enabled>
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="fa-gl-toolbar" role="toolbar" aria-label="Grid actions">
                    <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-gl-grid="alter"
                      disabled>Alter</button>
                    <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-gl-grid="remove"
                      disabled>Remove</button>
                    <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-gl-grid="update"
                      disabled>Update</button>
                    <button type="button" class="btn fa-legacy-toolbar-btn" data-fa-gl-grid="clear"
                      disabled>Clear</button>
                  </div>

                  <div class="fa-gl-grid cm-grid-surface" aria-label="GL accounts grid">
                    <div class="table-responsive">
                      <table class="table table-sm align-middle mb-0">
                        <thead>
                          <tr>
                            <th scope="col">Account Tag</th>
                            <th scope="col">Account ID</th>
                            <th scope="col">Account Name</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="3" class="text-muted py-2">No records to display.</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="card-surface p-3 mt-3">
          <header>
            <h3 class="section-title">Behind The Scene</h3>
          </header>

          <div class="fa-bts-grid mt-3">
            <div class="fa-bts-col">
              <div class="fa-bts-row">
                <label class="fa-bts-label" for="CreatedBy">Created By</label>
                <input type="text" id="CreatedBy" name="CreatedBy" readonly />
              </div>
              <div class="fa-bts-row">
                <label class="fa-bts-label" for="CreatedOn">Created On</label>
                <input type="text" id="CreatedOn" name="CreatedOn" readonly />
              </div>
            </div>

            <div class="fa-bts-col">
              <div class="fa-bts-row">
                <label class="fa-bts-label" for="ModifiedBy">Modified By</label>
                <input type="text" id="ModifiedBy" name="ModifiedBy" readonly />
              </div>
              <div class="fa-bts-row">
                <label class="fa-bts-label" for="ModifiedOn">Modified On</label>
                <input type="text" id="ModifiedOn" name="ModifiedOn" readonly />
              </div>
            </div>

            <div class="fa-bts-col">
              <div class="fa-bts-row">
                <label class="fa-bts-label" for="SupervisedBy">Supervised By</label>
                <input type="text" id="SupervisedBy" name="SupervisedBy" readonly />
              </div>
              <div class="fa-bts-row">
                <label class="fa-bts-label" for="SupervisedOn">Supervised On</label>
                <input type="text" id="SupervisedOn" name="SupervisedOn" readonly />
              </div>
            </div>
          </div>

          <div id="faGlToast" class="alert alert-info mt-3 d-none" role="alert"></div>
        </section>
      </form>
    </div>

    <aside class="cm-legacy-actions card-surface" aria-label="Actions">
      <div class="cm-legacy-actions__group">
        <p class="cm-legacy-actions__title">Actions</p>
        <div class="cp-actions">
          <button type="button" class="cm-shell__action btn-view" data-shell-mode="View">
            <i class="bi bi-eye"></i>
            <span>View</span>
          </button>
          <button type="button" class="cm-shell__action btn-add" data-shell-mode="Add" disabled>
            <i class="bi bi-plus-lg"></i>
            <span>Add</span>
          </button>
          <button type="button" class="cm-shell__action btn-edit" data-shell-mode="Update">
            <i class="bi bi-pencil-square"></i>
            <span>Edit</span>
          </button>
          <button type="button" class="cm-shell__action btn-delete" data-fa-gl-action="delete">
            <i class="bi bi-trash"></i>
            <span>Delete</span>
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--success btn-save" data-fa-gl-action="save"
            disabled>
            <i class="bi bi-check-lg"></i>
            <span>Save</span>
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--danger btn-cancel" data-fa-gl-action="cancel"
            disabled>
            <i class="bi bi-x-lg"></i>
            <span>Cancel</span>
          </button>
          <button type="button" class="cm-shell__action" data-fa-gl-action="back">
            <i class="bi bi-arrow-left"></i>
            <span>Back</span>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/utils/global-utils.js"></script>
  <script src="../../assets/js/services/shared/searchService.js"></script>
  <script src="../../assets/js/services/fixedAssets/fixedAssetsService.js"></script>
  <script src="../../assets/js/pages/fixed-asset/fixed-asset-gl-interface.js"></script>
</body>

</html>
