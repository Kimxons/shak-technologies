<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Insurance Type</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="group-insurance-type.css" />
</head>
<body class="client-maintenance copilot-theme group-insurance-type" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="group-insurance-type-form" class="cm-shell-form" autocomplete="off" novalidate>
      <aside class="cm-legacy-nav card-surface" aria-label="Options menu">
        <div class="cm-nav-section">
          <div class="cm-nav-items">
            <button type="button" class="cm-legacy-nav__item is-active" id="dataEntryBtn">
              <span>DataEntry</span>
            </button>
            <button type="button" class="cm-legacy-nav__item" id="openClaimTypeBtn" hidden>
              <span>Claim Type</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="cm-legacy-content">
        <div class="cm-scroll-region">
          <section class="card-surface">
            <h3 class="section-title">Insurance Details</h3>

            <div class="cbs-grid cbs-grid--two cbs-grid--tight">
              <div class="cbs-field cbs-full">
                <label class="cbs-label required" for="insuranceTypeId">Insurance Type ID</label>
                <div class="input-group">
                  <input id="insuranceTypeId" type="text" class="form-control" />
                  <button class="btn btn-outline-primary" type="button" data-lookup="insuranceType" aria-label="Lookup Insurance Type">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field cbs-full">
                <label class="cbs-label required" for="description">Description</label>
                <input id="description" type="text" class="form-control" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label required" for="insuranceCategory">Insurance Category</label>
                <select id="insuranceCategory" class="form-select">
                  <option>Life</option>
                  <option>General</option>
                  <option>Medical</option>
                </select>
              </div>

              <div class="cbs-field cbs-full">
                <label class="cbs-label" for="insuranceCompanyId">Insurance Company ID</label>
                <div class="input-group">
                  <input id="insuranceCompanyId" type="text" class="form-control" />
                  <button class="btn btn-outline-primary" type="button" data-lookup="insuranceCompany" aria-label="Lookup Insurance Company">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label required" for="validFrom">Valid From</label>
                <select id="validFrom" class="form-select">
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="validTo">Valid To</label>
                <select id="validTo" class="form-select">
                  <option value="">--Select--</option>
                </select>
              </div>

              <div class="cbs-field cbs-full">
                <label class="cbs-label" for="insuranceBenefit">Insurance Benefit</label>
                <input id="insuranceBenefit" type="text" class="form-control" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="insuredAmount">Insured Amount</label>
                <input id="insuredAmount" type="text" class="form-control" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="earlyRenewalDays">Early Renewal Days</label>
                <input id="earlyRenewalDays" type="text" class="form-control" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label" for="insuredPeriod">Insured Period (Months)</label>
                <input id="insuredPeriod" type="text" class="form-control" />
              </div>

              <div class="cbs-field">
                <label class="cbs-label required" for="premiumFrequency">Premium Frequency</label>
                <select id="premiumFrequency" class="form-select">
                  <option>Monthly</option>
                  <option>Quarterly</option>
                  <option>Half Yearly</option>
                  <option>Yearly</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label required" for="premium">Premium</label>
                <input id="premium" type="text" class="form-control" />
              </div>

              <div class="cbs-field cbs-full">
                <label class="cbs-label" for="premiumInInstallments">Premium In Installments</label>
                <div class="form-check">
                  <input id="premiumInInstallments" class="form-check-input" type="checkbox" />
                  <label class="form-check-label" for="premiumInInstallments">Enabled</label>
                </div>
              </div>

              <div class="cbs-field">
                <label class="cbs-label required" for="installmentFrequency">Installment Frequency</label>
                <select id="installmentFrequency" class="form-select">
                  <option>Yearly</option>
                  <option>Half Yearly</option>
                  <option>Quarterly</option>
                  <option>Monthly</option>
                </select>
              </div>

              <div class="cbs-field">
                <label class="cbs-label required" for="noOfInstallments">No Of Installments</label>
                <input id="noOfInstallments" type="text" class="form-control" />
              </div>

              <div class="cbs-field cbs-full">
                <label class="cbs-label required" for="premiumId">Premium ID</label>
                <div class="input-group">
                  <input id="premiumId" type="text" class="form-control" />
                  <button class="btn btn-outline-primary" type="button" data-lookup="premium" aria-label="Lookup Premium">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>

              <div class="cbs-field cbs-full">
                <label class="cbs-label required" for="insuranceClassId">Insurance Class ID</label>
                <div class="input-group">
                  <input id="insuranceClassId" type="text" class="form-control" />
                  <button class="btn btn-outline-primary" type="button" data-lookup="insuranceClass" aria-label="Lookup Insurance Class">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="card-surface">
            <h3 class="section-title">Behind The Scene</h3>

            <div class="cbs-grid cbs-grid--four cbs-grid--tight">
              <div class="cbs-field">
                <label class="cbs-label" for="createdBy">Created By</label>
                <input id="createdBy" type="text" class="form-control" readonly />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="modifiedBy">Modified By</label>
                <input id="modifiedBy" type="text" class="form-control" readonly />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="supervisedBy">Supervised By</label>
                <input id="supervisedBy" type="text" class="form-control" readonly />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="createdOn">Created On</label>
                <input id="createdOn" type="text" class="form-control" readonly />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="modifiedOn">Modified On</label>
                <input id="modifiedOn" type="text" class="form-control" readonly />
              </div>
              <div class="cbs-field">
                <label class="cbs-label" for="supervisedOn">Supervised On</label>
                <input id="supervisedOn" type="text" class="form-control" readonly />
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Mode switch</p>
          <button type="button" class="cm-shell__action" id="viewBtn">View</button>
          <button type="button" class="cm-shell__action" id="addBtn">Add</button>
          <button type="button" class="cm-shell__action" id="editBtn">Edit</button>
        </div>

        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Workflow</p>
          <button type="button" class="cm-shell__action cm-shell__action--danger" id="deleteBtn">Delete</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" id="saveBtn">Save</button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" id="cancelBtn">Cancel</button>
        </div>
      </aside>
    </form>
  </div>

  <!-- Claim Type child window (DataEntry) -->
  <div class="git-ct-overlay" id="claimTypeOverlay" hidden>
    <div class="git-ct-dialog" role="dialog" aria-modal="true" aria-label="Claim Type">
      <div class="git-ct-window" role="document">
        <div class="git-ct-titlebar" aria-label="Claim Type window controls">
          <div class="git-ct-titlebar__left">
            <span class="git-ct-titlebar__title">Claim Type</span>
          </div>
          <div class="git-ct-titlebar__right">
            <button type="button" class="git-ct-win-btn" aria-label="Minimize" data-ct-window="minimize">─</button>
            <button type="button" class="git-ct-win-btn" aria-label="Maximize" data-ct-window="maximize">☐</button>
            <button type="button" class="git-ct-win-btn git-ct-win-btn--close" aria-label="Close" id="closeClaimTypeBtn">✕</button>
          </div>
        </div>

        <form class="git-ct-shell" autocomplete="off" novalidate>
          <section class="git-ct-content">
            <section class="card-surface">
              <h3 class="section-title">Claim Type</h3>

            <div class="cbs-grid cbs-grid--two cbs-grid--tight mt-3">
              <div class="cbs-field cbs-full">
                <label class="cbs-label required" for="insuranceClaimType">Insurance Claim Type</label>
                <select id="insuranceClaimType" class="form-select">
                  <option>Death of the Person</option>
                  <option>Permanent Disability</option>
                  <option>Temporary Disability</option>
                </select>
              </div>
              <div class="cbs-field">
                <label class="cbs-label required" for="fixedAmount">Fixed Amount</label>
                <input id="fixedAmount" type="text" class="form-control" />
              </div>
              <div class="cbs-field cbs-full">
                <label class="cbs-label" for="remarks">Remarks</label>
                <textarea id="remarks" class="form-control" rows="3"></textarea>
              </div>
            </div>
          </section>

            <section class="card-surface">
              <h3 class="section-title">Behind The Scene</h3>
              <div class="cbs-grid cbs-grid--four cbs-grid--tight">
                <div class="cbs-field">
                  <label class="cbs-label" for="ctCreatedBy">Created By</label>
                  <input id="ctCreatedBy" type="text" class="form-control" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="ctModifiedBy">Modified By</label>
                  <input id="ctModifiedBy" type="text" class="form-control" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="ctSupervisedBy">Supervised By</label>
                  <input id="ctSupervisedBy" type="text" class="form-control" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="ctCreatedOn">Created On</label>
                  <input id="ctCreatedOn" type="text" class="form-control" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="ctModifiedOn">Modified On</label>
                  <input id="ctModifiedOn" type="text" class="form-control" readonly />
                </div>
                <div class="cbs-field">
                  <label class="cbs-label" for="ctSupervisedOn">Supervised On</label>
                  <input id="ctSupervisedOn" type="text" class="form-control" readonly />
                </div>
              </div>
            </section>
          </section>

          <aside class="cm-legacy-actions card-surface git-ct-actions" aria-label="Claim Type actions">
            <div class="git-ct-nav">
              <button class="git-ct-nav__btn" type="button" aria-label="Previous">
                <i class="bi bi-arrow-left"></i>
              </button>
              <button class="git-ct-nav__btn" type="button" aria-label="Next">
                <i class="bi bi-arrow-right"></i>
              </button>
            </div>

            <button type="button" class="cm-shell__action" data-ct-action="view">View</button>
            <button type="button" class="cm-shell__action" data-ct-action="add">Add</button>
            <button type="button" class="cm-shell__action" data-ct-action="edit">Edit</button>
            <button type="button" class="cm-shell__action cm-shell__action--danger" data-ct-action="delete">Delete</button>
            <button type="button" class="cm-shell__action cm-shell__action--success" data-ct-action="save">Save</button>
            <button type="button" class="cm-shell__action cm-shell__action--danger" data-ct-action="cancel">Cancel</button>
            <button type="button" class="cm-shell__action" id="ctBackBtn">Back</button>
          </aside>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Service Layer Pattern: Only 2 scripts needed! -->
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/groupInsuranceType/group-insurance-type.js"></script>
</body>
</html>
