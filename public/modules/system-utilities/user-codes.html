<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Codes · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance system-utilities user-codes copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="uc-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-3">
          <header class="d-flex align-items-center justify-content-between mb-2">
            <div class="d-flex align-items-center gap-3">
              <h3 class="section-title mb-0">User Codes</h3>
              <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
            </div>
          </header>

          <div class="uc-canvas">
            <div class="cp-panel uc-panel">
              <div class="uc-top" aria-label="User code details">
                <div class="uc-top__bar" aria-hidden="true"></div>
                <div class="uc-top__body">
                  <div class="uc-row uc-row--id">
                    <label class="uc-label" for="UserCodeId">ID</label>
                    <div class="uc-control">
                      <input type="text" class="form-control" id="UserCodeId" name="UserCodeId" data-always-enabled />
                    </div>
                    <button type="button" class="btn uc-search" aria-label="Search user code" data-always-enabled
                      data-uc-action="search-id">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>

                  <div class="uc-row">
                    <label class="uc-label" for="Description">Description</label>
                    <div class="uc-control">
                      <input type="text" class="form-control" id="Description" name="Description" />
                    </div>
                  </div>

                  <div class="uc-row">
                    <label class="uc-label" for="ModuleId">Module ID</label>
                    <div class="uc-control">
                      <select class="form-select" id="ModuleId" name="ModuleId">
                        <option value="" selected>--Select--</option>
                      </select>
                    </div>
                  </div>

                  <div class="uc-row">
                    <label class="uc-label" for="Remarks">Remarks</label>
                    <div class="uc-control">
                      <input type="text" class="form-control" id="Remarks" name="Remarks" />
                    </div>
                  </div>
                </div>
              </div>

              <div class="uc-sub" aria-label="Sub code details">
                <div class="uc-sub__divider" aria-hidden="true"></div>
                <div class="uc-sub__body">
                  <div class="uc-sub-grid">
                    <div class="uc-row">
                      <label class="uc-label" for="SubCodeId">Sub Code ID</label>
                      <div class="uc-control">
                        <input type="text" class="form-control" id="SubCodeId" name="SubCodeId" />
                      </div>
                    </div>

                    <div class="uc-row">
                      <label class="uc-label" for="SubDescription">Description</label>
                      <div class="uc-control">
                        <input type="text" class="form-control" id="SubDescription" name="SubDescription" />
                      </div>
                    </div>

                    <div class="uc-row uc-row--check">
                      <label class="uc-label" for="IsDefault">Is Default</label>
                      <div class="uc-control">
                        <input class="form-check-input" type="checkbox" id="IsDefault" name="IsDefault" />
                      </div>
                    </div>
                  </div>

                  <div class="uc-toolbar" role="toolbar" aria-label="Grid actions">
                    <button type="button" class="btn uc-legacy-toolbar-btn" data-uc-grid="new" disabled>New</button>
                    <button type="button" class="btn uc-legacy-toolbar-btn" data-uc-grid="alter" disabled>Alter</button>
                    <button type="button" class="btn uc-legacy-toolbar-btn" data-uc-grid="remove" disabled>Remove</button>
                    <button type="button" class="btn uc-legacy-toolbar-btn" data-uc-grid="update" disabled>Update</button>
                    <button type="button" class="btn uc-legacy-toolbar-btn" data-uc-grid="clear" disabled>Clear</button>
                  </div>
                </div>
              </div>

              <div class="uc-grid cm-grid-surface" aria-label="User codes grid">
                <div class="table-responsive">
                  <table class="table table-sm table-borderless align-middle mb-0">
                    <thead>
                      <tr>
                        <th scope="col">Sub Code ID</th>
                        <th scope="col">Description</th>
                        <th scope="col">Is Default</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="3" class="uc-no-records">No records to display.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div id="ucToast" class="alert d-none mt-3" role="status" aria-live="polite"></div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface p-3 mt-2" aria-label="Behind The Scene">
            <div class="uc-bts">
              <div class="uc-bts__bar">Behind The Scene</div>
              <div class="uc-bts__body">
                <div class="uc-bts-grid">
                  <div class="uc-bts-col">
                    <div class="uc-bts-row">
                      <label class="uc-bts-label" for="CreatedBy">Created By</label>
                      <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" disabled />
                    </div>
                    <div class="uc-bts-row">
                      <label class="uc-bts-label" for="CreatedOn">Created On</label>
                      <input type="text" class="form-control" id="CreatedOn" name="CreatedOn" disabled />
                    </div>
                  </div>

                  <div class="uc-bts-col">
                    <div class="uc-bts-row">
                      <label class="uc-bts-label" for="ModifiedBy">Modified By</label>
                      <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" disabled />
                    </div>
                    <div class="uc-bts-row">
                      <label class="uc-bts-label" for="ModifiedOn">Modified On</label>
                      <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" disabled />
                    </div>
                  </div>

                  <div class="uc-bts-col">
                    <div class="uc-bts-row">
                      <label class="uc-bts-label" for="SupervisedBy">Supervised By</label>
                      <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" disabled />
                    </div>
                    <div class="uc-bts-row">
                      <label class="uc-bts-label" for="SupervisedOn">Supervised On</label>
                      <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" disabled />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-shell-mode="View">View</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Add">Add</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Update">Edit</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" data-uc-action="save" disabled>
            Save
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-uc-action="cancel" disabled>
            Cancel
          </button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/system-utilities/user-codes.js"></script>
</body>

</html>
