<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Code Details · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance system-utilities system-codes copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="su-codes-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-3">
          <header class="d-flex align-items-center justify-content-between mb-2">
            <div class="d-flex align-items-center gap-3">
              <h3 class="section-title mb-0">System Code Details</h3>
              <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
            </div>
          </header>

          <div class="su-codes-canvas">
            <div class="cp-panel su-codes-panel">
              <div class="fa-gl-canvas">
                <div class="fa-gl-topbar" aria-label="System code selector">
                  <div class="fa-gl-topbar__bar" aria-hidden="true"></div>
                  <div class="fa-gl-topbar__rows">
                    <div class="su-id-row">
                      <label class="su-id-label" for="SystemCodeId">ID</label>
                      <select class="form-select su-id-select" id="SystemCodeId" name="SystemCodeId" data-always-enabled>
                        <option value="" selected>--Select--</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="fa-gl-grid cm-grid-surface" aria-label="System codes grid">
                  <div class="table-responsive">
                    <table class="table table-sm table-borderless align-middle mb-0">
                      <thead>
                        <tr>
                          <th scope="col">Sub Code ID</th>
                          <th scope="col">Description</th>
                          <th scope="col">Is Default</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td colspan="3" class="su-no-records">No records to display.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <div id="suCodesToast" class="alert d-none mt-3" role="status" aria-live="polite"></div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface p-3 mt-2" aria-label="Behind The Scene">
            <div class="su-bts">
              <div class="su-bts__bar">Behind The Scene</div>
              <div class="su-bts__body">
                <div class="su-bts-grid">
                  <div class="su-bts-col">
                    <div class="su-bts-row">
                      <label class="su-bts-label" for="ModifiedBy">Modified By</label>
                      <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" disabled />
                    </div>
                    <div class="su-bts-row">
                      <label class="su-bts-label" for="ModifiedOn">Modified On</label>
                      <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" disabled />
                    </div>
                  </div>

                  <div class="su-bts-col">
                    <div class="su-bts-row">
                      <label class="su-bts-label" for="SupervisedBy">Supervised By</label>
                      <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" disabled />
                    </div>
                    <div class="su-bts-row">
                      <label class="su-bts-label" for="SupervisedOn">Supervised On</label>
                      <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" disabled />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-shell-mode="View">View</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Update">Edit</button>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action cm-shell__action--success" data-su-action="save" disabled>
            Save
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-su-action="cancel" disabled>
            Cancel
          </button>
        </div>
      </aside>
    </form>
  </div>

  <script src="../../assets/js/pages/system-utilities/system-codes.js"></script>
</body>

</html>
