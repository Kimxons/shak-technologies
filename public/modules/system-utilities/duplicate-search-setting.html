<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duplicate Search Setting · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance system-utilities duplicate-search-setting copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="dss-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-3">
          <header class="d-flex align-items-center justify-content-between mb-2">
            <div class="d-flex align-items-center gap-3">
              <h3 class="section-title mb-0">Duplicate Search Setting</h3>
              <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
            </div>
          </header>

          <div class="dss-canvas">
            <div class="cp-panel dss-panel">
              <div class="dss-top" aria-label="Top filters">
                <div class="dss-top__frame">
                  <div class="dss-top-grid">
                    <div class="dss-row">
                      <label class="dss-label" for="SearchModule">Search Module</label>
                      <div class="dss-control dss-control--module">
                        <select class="form-select" id="SearchModule" name="SearchModule" data-always-enabled>
                          <option selected>General Client Checking</option>
                        </select>
                      </div>
                    </div>

                    <div class="dss-row dss-row--key">
                      <label class="dss-label" for="SearchKeyId">Search Key ID</label>
                      <div class="dss-control">
                        <input type="text" class="form-control" id="SearchKeyId" name="SearchKeyId"
                          data-always-enabled />
                      </div>
                      <button type="button" class="btn dss-search" aria-label="Search key" data-dss-action="search-key"
                        data-always-enabled>
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="dss-details" aria-label="Search Details">
                <div class="dss-bar">Search Details</div>
                <div class="dss-details__body">
                  <div class="dss-details-grid" role="table" aria-label="Search conditions">
                    <div class="dss-head" role="row">
                      <div class="dss-head__spacer" role="columnheader" aria-hidden="true"></div>
                      <div class="dss-head__cell" role="columnheader">Search Item Type</div>
                      <div class="dss-head__cell" role="columnheader">Search Field</div>
                      <div class="dss-head__cell" role="columnheader">Search In</div>
                      <div class="dss-head__cell" role="columnheader">Comparison Operator</div>
                    </div>

                    <div class="dss-rowline" role="row">
                      <div class="dss-cond" role="rowheader">Search Condition 1</div>
                      <div class="dss-cell"><select class="form-select" name="Condition1Type">
                          <option selected>Name</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition1Field">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition1In">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition1Op">
                          <option selected>EQUAL</option>
                          <option>LIKE</option>
                        </select></div>
                    </div>

                    <div class="dss-rowline" role="row">
                      <div class="dss-cond" role="rowheader">Search Condition 2</div>
                      <div class="dss-cell"><select class="form-select" name="Condition2Type">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition2Field">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition2In">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition2Op">
                          <option selected>--Select--</option>
                        </select></div>
                    </div>

                    <div class="dss-rowline" role="row">
                      <div class="dss-cond" role="rowheader">Search Condition 3</div>
                      <div class="dss-cell"><select class="form-select" name="Condition3Type">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition3Field">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition3In">
                          <option selected>--Select--</option>
                        </select></div>
                      <div class="dss-cell"><select class="form-select" name="Condition3Op">
                          <option selected>--Select--</option>
                        </select></div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="dss-bts" aria-label="Behind The Scene">
                <div class="dss-bar">Behind The Scene</div>
                <div class="dss-bts__body">
                  <div class="dss-bts-grid">
                    <div class="dss-bts-row">
                      <label class="dss-bts-label" for="CreatedBy">Created By</label>
                      <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" disabled />
                    </div>
                    <div class="dss-bts-row">
                      <label class="dss-bts-label" for="ModifiedBy">Modified By</label>
                      <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" disabled />
                    </div>
                    <div class="dss-bts-row">
                      <label class="dss-bts-label" for="SupervisedBy">Supervised By</label>
                      <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" disabled />
                    </div>

                    <div class="dss-bts-row">
                      <label class="dss-bts-label" for="CreatedOn">Created On</label>
                      <input type="text" class="form-control" id="CreatedOn" name="CreatedOn" disabled />
                    </div>
                    <div class="dss-bts-row">
                      <label class="dss-bts-label" for="ModifiedOn">Modified On</label>
                      <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" disabled />
                    </div>
                    <div class="dss-bts-row">
                      <label class="dss-bts-label" for="SupervisedOn">Supervised On</label>
                      <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" disabled />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div id="dssToast" class="alert d-none mt-3" role="status" aria-live="polite"></div>
          </div>
        </section>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-dss-action="view-all">View All</button>
          <button type="button" class="cm-shell__action" data-dss-action="back" disabled>Back</button>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-shell-mode="View">View</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Add">Add</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Update">Edit</button>
          <button type="button" class="cm-shell__action" data-dss-action="delete">Delete</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" data-dss-action="save" disabled>
            Save
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-dss-action="cancel" disabled>
            Cancel
          </button>
        </div>
      </aside>
    </form>
  </div>

  <script src="../../assets/js/pages/system-utilities/duplicate-search-setting.js"></script>
</body>

</html>
