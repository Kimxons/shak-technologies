<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintain Documents · System Utilities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body class="client-maintenance system-utilities maintain-documents copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="md-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-3">
          <header class="d-flex align-items-center justify-content-between mb-2">
            <div class="d-flex align-items-center gap-3">
              <h3 class="section-title mb-0">Maintain Documents</h3>
              <span class="cm-summary-pill" data-page-function-pill>Mode · View</span>
            </div>
          </header>

          <div class="md-canvas">
            <div class="cp-panel md-panel">
              <div class="md-top" aria-label="Document details">
                <div class="md-top__frame">
                  <div class="md-row md-row--docid">
                    <label class="md-label" for="DocumentId">Document ID</label>
                    <div class="md-control">
                      <input type="text" class="form-control" id="DocumentId" name="DocumentId" data-always-enabled />
                    </div>
                    <button type="button" class="btn md-search" aria-label="Search document" data-md-action="search-id"
                      data-always-enabled>
                      <i class="bi bi-search"></i>
                    </button>
                  </div>

                  <div class="md-row">
                    <label class="md-label" for="Description">Description</label>
                    <div class="md-control">
                      <input type="text" class="form-control" id="Description" name="Description" />
                    </div>
                  </div>

                  <div class="md-row">
                    <label class="md-label" for="Remarks">Remarks</label>
                    <div class="md-control">
                      <input type="text" class="form-control" id="Remarks" name="Remarks" />
                    </div>
                  </div>

                  <div class="md-row md-row--class">
                    <label class="md-label" for="DocumentClass">Document Class</label>
                    <div class="md-control md-control--narrow">
                      <select class="form-select" id="DocumentClass" name="DocumentClass">
                        <option value="" selected>--Select--</option>
                        <option value="General">General</option>
                        <option value="Customer">Customer</option>
                        <option value="Account">Account</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div id="mdToast" class="alert d-none mt-3" role="status" aria-live="polite"></div>
          </div>
        </section>

        <div class="cm-scroll-region">
          <section class="card-surface p-3 mt-2" aria-label="Behind The Scene">
            <div class="md-bts">
              <div class="md-bts__bar">Behind The Scene</div>
              <div class="md-bts__body">
                <div class="md-bts-grid">
                  <div class="md-bts-row">
                    <label class="md-bts-label" for="CreatedBy">Created By</label>
                    <input type="text" class="form-control" id="CreatedBy" name="CreatedBy" disabled />
                  </div>
                  <div class="md-bts-row">
                    <label class="md-bts-label" for="ModifiedBy">Modified By</label>
                    <input type="text" class="form-control" id="ModifiedBy" name="ModifiedBy" disabled />
                  </div>
                  <div class="md-bts-row">
                    <label class="md-bts-label" for="SupervisedBy">Supervised By</label>
                    <input type="text" class="form-control" id="SupervisedBy" name="SupervisedBy" disabled />
                  </div>

                  <div class="md-bts-row">
                    <label class="md-bts-label" for="CreatedOn">Created On</label>
                    <input type="text" class="form-control" id="CreatedOn" name="CreatedOn" disabled />
                  </div>
                  <div class="md-bts-row">
                    <label class="md-bts-label" for="ModifiedOn">Modified On</label>
                    <input type="text" class="form-control" id="ModifiedOn" name="ModifiedOn" disabled />
                  </div>
                  <div class="md-bts-row">
                    <label class="md-bts-label" for="SupervisedOn">Supervised On</label>
                    <input type="text" class="form-control" id="SupervisedOn" name="SupervisedOn" disabled />
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="md-nav-actions" aria-label="Navigation">
          <button type="button" class="md-nav-btn" aria-label="Previous record" data-md-action="prev">
            <i class="bi bi-arrow-left"></i>
          </button>
          <button type="button" class="md-nav-btn" aria-label="Next record" data-md-action="next">
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>

        <div class="cm-legacy-actions__group">
          <button type="button" class="cm-shell__action" data-shell-mode="View">View</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Add">Add</button>
          <button type="button" class="cm-shell__action" data-shell-mode="Update">Edit</button>
          <button type="button" class="cm-shell__action" data-md-action="delete">Delete</button>
          <button type="button" class="cm-shell__action cm-shell__action--success" data-md-action="save" disabled>
            Save
          </button>
          <button type="button" class="cm-shell__action cm-shell__action--danger" data-md-action="cancel" disabled>
            Cancel
          </button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/system-utilities/maintain-documents.js"></script>
</body>

</html>
