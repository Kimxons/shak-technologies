<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recurring Deposits Application · Recurring Deposit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="./recurring-deposit.css" />
</head>

<body class="client-maintenance recurring-deposit recurring-deposit-application copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="rd-app-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-0">
          <header class="modal-header d-flex align-items-center justify-content-between rd-inner-heading">
            <div class="d-flex align-items-center gap-3">
              <h4 class="modal-title mb-0">Recurring Deposits Application</h4>
              <span class="badge bg-light text-primary fw-semibold">Entry</span>
            </div>
            <span class="cm-summary-pill">Mode · View</span>
          </header>

          <div class="p-3">
            <div class="row g-3 align-items-start">
              <div class="col-12 col-lg-2">
                <aside class="cm-legacy-nav card-surface" aria-label="Data entry navigation">
                  <div class="cm-nav-section">
                    <button type="button" class="cm-nav-toggle" aria-expanded="true">
                      <span class="cm-nav-toggle__label">DataEntry</span>
                      <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                    <div class="cm-nav-items">
                      <button type="button" class="cm-legacy-nav__item" disabled>
                        <span>Special Interest Rates</span>
                      </button>
                    </div>
                  </div>
                </aside>
              </div>

              <div class="col-12 col-lg-10">
                <div class="card-surface p-0" aria-label="Application workspace">
                  <div class="rd-app-canvas">
                    <section class="rd-block" aria-label="Receipt Details">
                      <header class="rd-block__header">
                        <i class="bi bi-receipt-cutoff" aria-hidden="true"></i>
                        <span>Receipt Details</span>
                      </header>
                      <div class="rd-block__body">
                        <div class="rd-form-grid">
                          <div class="rd-field">
                            <label class="rd-label" for="RdAppApplicationId">
                              <i class="bi bi-hash" aria-hidden="true"></i>
                              <span>Application ID</span>
                            </label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdAppApplicationId" name="RdAppApplicationId" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Search application" data-rd-action="search">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppBranchId">
                              <i class="bi bi-diagram-3" aria-hidden="true"></i>
                              <span>Branch ID</span>
                            </label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdAppBranchId" name="RdAppBranchId" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup branch" data-rd-action="lookup-branch">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppClientId">
                              <i class="bi bi-person-badge" aria-hidden="true"></i>
                              <span>Client ID</span>
                            </label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdAppClientId" name="RdAppClientId" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup client" data-rd-action="lookup-client">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppProductId">
                              <i class="bi bi-box" aria-hidden="true"></i>
                              <span>Product ID</span>
                            </label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdAppProductId" name="RdAppProductId" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup product" data-rd-action="lookup-product">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppAccountId">
                              <i class="bi bi-credit-card" aria-hidden="true"></i>
                              <span>Account ID</span>
                            </label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdAppAccountId" name="RdAppAccountId" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup account" data-rd-action="lookup-account">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppValueDate">
                              <i class="bi bi-calendar-event" role="button" tabindex="0" data-date-trigger aria-label="Open date picker"></i>
                              <span>Value Date</span>
                            </label>
                            <input type="date" class="form-control" id="RdAppValueDate" name="RdAppValueDate" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppFrequency">
                              <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                              <span>Frequency</span>
                            </label>
                            <select class="form-select" id="RdAppFrequency" name="RdAppFrequency">
                              <option value="" selected>-Select-</option>
                            </select>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppSeries">
                              <i class="bi bi-collection" aria-hidden="true"></i>
                              <span>Series</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppSeries" name="RdAppSeries" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppCurrencyId">
                              <i class="bi bi-currency-exchange" aria-hidden="true"></i>
                              <span>Currency ID</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppCurrencyId" name="RdAppCurrencyId" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppTerm">
                              <i class="bi bi-hourglass-split" aria-hidden="true"></i>
                              <span>Term</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppTerm" name="RdAppTerm" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppInstallmentAmount">
                              <i class="bi bi-cash-coin" aria-hidden="true"></i>
                              <span>Installment Amount</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppInstallmentAmount" name="RdAppInstallmentAmount" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppInterestRate">
                              <i class="bi bi-percent" aria-hidden="true"></i>
                              <span>Interest Rate</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppInterestRate" name="RdAppInterestRate" />
                          </div>

                          <div class="rd-field rd-field--remarks">
                            <label class="rd-label" for="RdAppRemarks">
                              <i class="bi bi-chat-left-text" aria-hidden="true"></i>
                              <span>Remarks</span>
                            </label>
                            <textarea class="form-control" id="RdAppRemarks" name="RdAppRemarks" rows="2"></textarea>
                          </div>
                        </div>

                        <div class="rd-separator"></div>

                        <div class="rd-form-grid">
                          <div class="rd-field">
                            <label class="rd-label" for="RdAppMaturityDate">
                              <i class="bi bi-calendar-check" role="button" tabindex="0" data-date-trigger aria-label="Open date picker"></i>
                              <span>Maturity Date</span>
                            </label>
                            <input type="date" class="form-control" id="RdAppMaturityDate" name="RdAppMaturityDate" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppTax">
                              <i class="bi bi-receipt" aria-hidden="true"></i>
                              <span>Tax</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppTax" name="RdAppTax" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppMaturityAmount">
                              <i class="bi bi-cash-stack" aria-hidden="true"></i>
                              <span>Maturity Amount</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppMaturityAmount" name="RdAppMaturityAmount" />
                          </div>
                        </div>
                      </div>
                    </section>

                    <section class="rd-block mt-3" aria-label="Standing Instruction">
                      <header class="rd-block__header">
                        <i class="bi bi-card-checklist" aria-hidden="true"></i>
                        <span>Standing Instruction</span>
                      </header>
                      <div class="rd-block__body">
                        <div class="rd-si-grid">
                          <div class="rd-field">
                            <label class="rd-label" for="RdAppSiBranchId">
                              <i class="bi bi-diagram-3" aria-hidden="true"></i>
                              <span>Branch ID</span>
                            </label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdAppSiBranchId" name="RdAppSiBranchId" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup SI branch" data-rd-action="lookup-si-branch">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>
                          <div class="rd-field">
                            <label class="rd-label" for="RdAppSiAccountId">
                              <i class="bi bi-credit-card" aria-hidden="true"></i>
                              <span>Account ID</span>
                            </label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdAppSiAccountId" name="RdAppSiAccountId" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup SI account" data-rd-action="lookup-si-account">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>

                    <section class="rd-block mt-3" aria-label="Behind The Scene">
                      <header class="rd-block__header">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                        <span>Behind The Scene</span>
                      </header>
                      <div class="rd-block__body">
                        <div class="rd-form-grid">
                          <div class="rd-field">
                            <label class="rd-label" for="RdAppStatus">
                              <i class="bi bi-flag" aria-hidden="true"></i>
                              <span>Status</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppStatus" name="RdAppStatus" disabled />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdAppRejectReason">
                              <i class="bi bi-x-octagon" aria-hidden="true"></i>
                              <span>Reject Reason</span>
                            </label>
                            <input type="text" class="form-control" id="RdAppRejectReason" name="RdAppRejectReason" disabled />
                          </div>
                        </div>

                        <div class="rd-bts-2x3 mt-3" aria-label="Audit">
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdAppCreatedBy">Created By</label>
                            <input type="text" class="form-control" id="RdAppCreatedBy" name="RdAppCreatedBy" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdAppModifiedBy">Modified By</label>
                            <input type="text" class="form-control" id="RdAppModifiedBy" name="RdAppModifiedBy" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdAppSupervisedBy">Supervised By</label>
                            <input type="text" class="form-control" id="RdAppSupervisedBy" name="RdAppSupervisedBy" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdAppCreatedOn">Created On</label>
                            <input type="text" class="form-control" id="RdAppCreatedOn" name="RdAppCreatedOn" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdAppModifiedOn">Modified On</label>
                            <input type="text" class="form-control" id="RdAppModifiedOn" name="RdAppModifiedOn" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdAppSupervisedOn">Supervised On</label>
                            <input type="text" class="form-control" id="RdAppSupervisedOn" name="RdAppSupervisedOn" disabled />
                          </div>
                        </div>

                        <div id="rdToast" class="alert alert-info mt-3 d-none" role="alert"></div>
                      </div>
                    </section>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cm-legacy-actions__group">
          <p class="cm-legacy-actions__title">Actions</p>
          <div class="cp-actions">
            <button type="button" class="cm-shell__action rd-action--view" data-rd-action="view" disabled>
              <i class="bi bi-eye" aria-hidden="true"></i>
              <span>View</span>
            </button>
            <button type="button" class="cm-shell__action rd-action--add" data-rd-action="add">
              <i class="bi bi-plus-circle" aria-hidden="true"></i>
              <span>Add</span>
            </button>
            <button type="button" class="cm-shell__action rd-action--edit" data-rd-action="edit">
              <i class="bi bi-pencil" aria-hidden="true"></i>
              <span>Edit</span>
            </button>
            <button type="button" class="cm-shell__action rd-action--save" data-rd-action="save" disabled>
              <i class="bi bi-save" aria-hidden="true"></i>
              <span>Save</span>
            </button>
            <button type="button" class="cm-shell__action rd-action--delete" data-rd-action="delete" disabled>
              <i class="bi bi-trash" aria-hidden="true"></i>
              <span>Delete</span>
            </button>
            <button type="button" class="cm-shell__action rd-action--cancel" data-rd-action="cancel" disabled>
              <i class="bi bi-x-circle" aria-hidden="true"></i>
              <span>Cancel</span>
            </button>
          </div>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/ui/date-picker-trigger.js"></script>
  <script src="../../assets/js/pages/recurring-deposit/recurring-deposit.js"></script>
</body>

</html>
