<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recurring Maintenance · Recurring Deposit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="./recurring-deposit.css" />
</head>

<body class="client-maintenance recurring-deposit recurring-maintenance copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form id="rd-maint-form" class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-0">
          <header class="modal-header d-flex align-items-center justify-content-between rd-inner-heading">
            <div class="d-flex align-items-center gap-3">
              <h4 class="modal-title mb-0">Recurring Deposits Maintenance</h4>
              <span class="badge bg-light text-primary fw-semibold">Entry</span>
            </div>
            <span class="cm-summary-pill">Mode · View</span>
          </header>

          <div class="p-3">
            <div class="row g-3 align-items-start">
              <div class="col-12 col-lg-3">
                <aside class="cm-legacy-nav card-surface" aria-label="Maintenance navigation">
                  <div class="cm-nav-section">
                    <button type="button" class="cm-nav-toggle" aria-expanded="true">
                      <span class="cm-nav-toggle__label">DataEntry</span>
                      <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                    <div class="cm-nav-items">
                      <button type="button" class="cm-legacy-nav__item is-active" data-rd-nav="close-receipt">
                        <span>Close Receipt</span>
                      </button>
                    </div>
                  </div>

                  <div class="cm-nav-section mt-2">
                    <button type="button" class="cm-nav-toggle" aria-expanded="true">
                      <span class="cm-nav-toggle__label">View</span>
                      <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                    <div class="cm-nav-items">
                      <button type="button" class="cm-legacy-nav__item" data-rd-nav="rd-schedule">
                        <span>RD Schedule</span>
                      </button>
                      <button type="button" class="cm-legacy-nav__item" data-rd-nav="rd-portfolio">
                        <span>RD Portfolio</span>
                      </button>
                    </div>
                  </div>

                  <div class="cm-nav-section mt-2">
                    <button type="button" class="cm-nav-toggle" aria-expanded="false" disabled>
                      <span class="cm-nav-toggle__label">Recent Activities</span>
                      <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                  </div>
                </aside>
              </div>

              <div class="col-12 col-lg-9">
                <div class="card-surface p-0" aria-label="Maintenance workspace">
                  <div class="rd-app-canvas">
                    <section class="rd-block" aria-label="Receipt Details">
                      <header class="rd-block__header">
                        <i class="bi bi-receipt-cutoff" aria-hidden="true"></i>
                        <span>Receipt Details</span>
                      </header>
                      <div class="rd-block__body">
                        <div class="rd-form-grid">
                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintBranchId"><span>Branch ID</span></label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdMaintBranchId" value="1201" />
                              <input type="text" class="form-control" id="RdMaintBranchName" value="Bahir Dar" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup branch" data-rd-action="lookup-branch">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintClientId"><span>Client ID</span></label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdMaintClientId" />
                              <input type="text" class="form-control" id="RdMaintClientName" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup client" data-rd-action="lookup-client">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintProductId"><span>Product ID</span></label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdMaintProductId" />
                              <input type="text" class="form-control" id="RdMaintProductName" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup product" data-rd-action="lookup-product">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintAccountId"><span>Account ID</span></label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdMaintAccountId" />
                              <input type="text" class="form-control" id="RdMaintAccountName" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup account" data-rd-action="lookup-account">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintValueDate">
                              <i class="bi bi-calendar-event" role="button" tabindex="0" data-date-trigger aria-label="Open date picker"></i>
                              <span>Value Date</span>
                            </label>
                            <input type="date" class="form-control" id="RdMaintValueDate" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintSeries"><span>Series</span></label>
                            <input type="text" class="form-control" id="RdMaintSeries" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintInstallment"><span>Installment Amount</span></label>
                            <input type="text" class="form-control" id="RdMaintInstallment" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintCurrencyId"><span>Currency ID</span></label>
                            <input type="text" class="form-control" id="RdMaintCurrencyId" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintTerm"><span>Term</span></label>
                            <input type="text" class="form-control" id="RdMaintTerm" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintFreq"><span>Installment Frequency</span></label>
                            <select class="form-select" id="RdMaintFreq">
                              <option value="" selected>-Select-</option>
                            </select>
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintInterest"><span>Interest Rate</span></label>
                            <input type="text" class="form-control" id="RdMaintInterest" />
                          </div>

                          <div class="rd-field rd-field--remarks">
                            <label class="rd-label" for="RdMaintRemarks"><span>Remarks</span></label>
                            <textarea class="form-control" id="RdMaintRemarks" rows="2"></textarea>
                          </div>
                        </div>
                      </div>
                    </section>

                    <section class="rd-block mt-3" aria-label="Standing Instruction">
                      <header class="rd-block__header">
                        <i class="bi bi-card-checklist" aria-hidden="true"></i>
                        <span>Standing Instruction</span>
                      </header>
                      <div class="rd-block__body">
                        <div class="rd-si-grid">
                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintSiBranchId"><span>Branch ID</span></label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdMaintSiBranchId" />
                              <input type="text" class="form-control" id="RdMaintSiBranchName" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup SI branch" data-rd-action="lookup-si-branch">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>
                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintSiAccountId"><span>Account ID</span></label>
                            <div class="input-group">
                              <input type="text" class="form-control" id="RdMaintSiAccountId" />
                              <input type="text" class="form-control" id="RdMaintSiAccountName" />
                              <button class="btn btn-outline-primary" type="button" aria-label="Lookup SI account" data-rd-action="lookup-si-account">
                                <i class="bi bi-search" aria-hidden="true"></i>
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>

                    <section class="rd-block mt-3" aria-label="Behind The Scene">
                      <header class="rd-block__header">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                        <span>Behind The Scene</span>
                      </header>
                      <div class="rd-block__body">
                        <div class="rd-form-grid">
                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintMaturityDate">
                              <i class="bi bi-calendar-check" role="button" tabindex="0" data-date-trigger aria-label="Open date picker"></i>
                              <span>Maturity Date</span>
                            </label>
                            <input type="date" class="form-control" id="RdMaintMaturityDate" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintMaturityAmount"><span>Maturity Amount</span></label>
                            <input type="text" class="form-control" id="RdMaintMaturityAmount" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintTax"><span>Tax</span></label>
                            <input type="text" class="form-control" id="RdMaintTax" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintStatus"><span>Status</span></label>
                            <input type="text" class="form-control" id="RdMaintStatus" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintAccruedInterest"><span>Accrued Interest</span></label>
                            <input type="text" class="form-control" id="RdMaintAccruedInterest" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintAccruedUpto">
                              <i class="bi bi-calendar-event" role="button" tabindex="0" data-date-trigger aria-label="Open date picker"></i>
                              <span>Accrued Upto</span>
                            </label>
                            <input type="date" class="form-control" id="RdMaintAccruedUpto" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintAccruedTax"><span>Accrued Tax</span></label>
                            <input type="text" class="form-control" id="RdMaintAccruedTax" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintAccountDays"><span>Account Days</span></label>
                            <input type="text" class="form-control" id="RdMaintAccountDays" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintPenaltyInterest"><span>Penalty Interest</span></label>
                            <input type="text" class="form-control" id="RdMaintPenaltyInterest" />
                          </div>

                          <div class="rd-field">
                            <label class="rd-label" for="RdMaintCloseDate">
                              <i class="bi bi-calendar-event" role="button" tabindex="0" data-date-trigger aria-label="Open date picker"></i>
                              <span>Close Date</span>
                            </label>
                            <input type="date" class="form-control" id="RdMaintCloseDate" />
                          </div>
                        </div>

                        <div class="rd-bts-2x3 mt-3" aria-label="Audit">
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdMaintCreatedBy">Created By</label>
                            <input type="text" class="form-control" id="RdMaintCreatedBy" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdMaintCreatedOn">Created On</label>
                            <input type="text" class="form-control" id="RdMaintCreatedOn" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdMaintModifiedBy">Modified By</label>
                            <input type="text" class="form-control" id="RdMaintModifiedBy" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdMaintModifiedOn">Modified On</label>
                            <input type="text" class="form-control" id="RdMaintModifiedOn" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdMaintApprovedBy">Approved By</label>
                            <input type="text" class="form-control" id="RdMaintApprovedBy" disabled />
                          </div>
                          <div class="cbs-field cm-compact-field">
                            <label class="cbs-label" for="RdMaintApprovedOn">Approved On</label>
                            <input type="text" class="form-control" id="RdMaintApprovedOn" disabled />
                          </div>
                        </div>

                        <div id="rdToast" class="alert alert-info mt-3 d-none" role="alert"></div>
                      </div>
                    </section>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="rd-maint-rail">
          <div class="rd-maint-quick-nav" aria-label="Quick navigation">
            <div class="rd-maint-quick-row">
              <div class="rd-maint-arrows" aria-label="Account navigation">
                <button type="button" class="rd-maint-arrow" data-rd-action="nav-prev" aria-label="Previous account">
                  <i class="bi bi-arrow-left" aria-hidden="true"></i>
                </button>
                <button type="button" class="rd-maint-arrow" data-rd-action="nav-next" aria-label="Next account">
                  <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
              </div>
              <div class="rd-maint-quick-label">Account<br />ID</div>
            </div>

            <div class="rd-maint-quick-row">
              <div class="rd-maint-arrows" aria-label="Series navigation">
                <button type="button" class="rd-maint-arrow" data-rd-action="nav-prev" aria-label="Previous series">
                  <i class="bi bi-arrow-left" aria-hidden="true"></i>
                </button>
                <button type="button" class="rd-maint-arrow" data-rd-action="nav-next" aria-label="Next series">
                  <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
              </div>
              <div class="rd-maint-quick-label">Series</div>
            </div>
          </div>

          <div class="rd-maint-rail__spacer" aria-hidden="true"></div>

          <div class="rd-maint-actions" aria-label="Maintenance actions">
            <div class="cp-actions">
              <button type="button" class="cm-shell__action rd-action--view" data-rd-action="view" disabled>
                <i class="bi bi-eye" aria-hidden="true"></i>
                <span>View</span>
              </button>
              <button type="button" class="cm-shell__action rd-action--cancel" data-rd-action="exit">
                <i class="bi bi-x-circle" aria-hidden="true"></i>
                <span>Cancel</span>
              </button>
            </div>
          </div>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/ui/date-picker-trigger.js"></script>
  <script src="../../assets/js/pages/recurring-deposit/recurring-deposit.js"></script>
</body>

</html>
