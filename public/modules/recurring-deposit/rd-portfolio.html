<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RD Portfolio · Recurring Deposit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="./recurring-deposit.css" />
</head>

<body class="client-maintenance recurring-deposit recurring-rd-portfolio copilot-theme" data-page="client-maintenance">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="cm-workspace">
    <form class="cm-shell-form cm-shell-form--two-column" autocomplete="off" novalidate>
      <section class="cm-legacy-content">
        <section class="card-surface p-0">
          <header class="modal-header d-flex align-items-center justify-content-between rd-inner-heading">
            <div class="d-flex align-items-center gap-3">
              <h4 class="modal-title mb-0">RD Portfolio</h4>
              <span class="badge bg-light text-primary fw-semibold">1201</span>
            </div>
          </header>

          <div class="p-3">
            <div class="card-surface p-0" aria-label="RD Portfolio workspace">
              <div class="rd-app-canvas">
                <section class="rd-block" aria-label="Portfolio Criteria">
                  <header class="rd-block__header">
                    <i class="bi bi-funnel" aria-hidden="true"></i>
                    <span>Portfolio Criteria</span>
                  </header>
                  <div class="rd-block__body">
                    <div class="rd-form-grid">
                      <div class="rd-field">
                        <label class="rd-label" for="RdPortfolioFromDate"><span>From Date</span></label>
                        <div class="input-group">
                          <input class="form-control" id="RdPortfolioFromDate" type="date" />
                          <span class="input-group-text" role="button" tabindex="0" data-date-trigger aria-label="Open date picker">
                            <i class="bi bi-calendar-event" aria-hidden="true"></i>
                          </span>
                        </div>
                      </div>

                      <div class="rd-field">
                        <label class="rd-label" for="RdPortfolioToDate"><span>To Date</span></label>
                        <div class="input-group">
                          <input class="form-control" id="RdPortfolioToDate" type="date" />
                          <span class="input-group-text" role="button" tabindex="0" data-date-trigger aria-label="Open date picker">
                            <i class="bi bi-calendar-event" aria-hidden="true"></i>
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                <section class="rd-block mt-3" aria-label="Portfolio">
                  <header class="rd-block__header">
                    <i class="bi bi-table" aria-hidden="true"></i>
                    <span>Portfolio</span>
                  </header>
                  <div class="rd-block__body">
                    <div class="rd-grid" aria-label="RD portfolio table">
                      <table class="table table-sm mb-0">
                        <thead>
                          <tr>
                            <th scope="col">Main Repayment AccountID</th>
                            <th scope="col">Deposit Amount</th>
                            <th scope="col">Currency ID</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="3" class="rd-portfolio-empty">No records to display.</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </section>

                <div id="rdToast" class="alert alert-info mt-3 d-none" role="alert"></div>
              </div>
            </div>
          </div>
        </section>
      </section>

      <aside class="cm-legacy-actions card-surface" aria-label="Actions">
        <div class="cp-actions" aria-label="RD portfolio actions">
          <button type="button" class="cm-shell__action" disabled>
            <i class="bi bi-printer" aria-hidden="true"></i>
            <span>Print</span>
          </button>
          <button type="button" class="cm-shell__action" disabled>
            <i class="bi bi-journal-text" aria-hidden="true"></i>
            <span>Represent Chq</span>
          </button>
          <button type="button" class="cm-shell__action" disabled>
            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
            <span>Unpay Trx</span>
          </button>
          <button type="button" class="cm-shell__action" disabled>
            <i class="bi bi-image" aria-hidden="true"></i>
            <span>Image</span>
          </button>
          <button type="button" class="cm-shell__action" disabled>
            <i class="bi bi-arrow-return-left" aria-hidden="true"></i>
            <span>Reverse</span>
          </button>
          <button type="button" class="cm-shell__action rd-action--view" data-rd-action="back">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Back</span>
          </button>
        </div>
      </aside>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth/auth.config.js"></script>
  <script src="../../assets/js/auth/auth.service.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/ui/date-picker-trigger.js"></script>
  <script src="../../assets/js/pages/recurring-deposit/recurring-deposit.js"></script>
</body>

</html>
