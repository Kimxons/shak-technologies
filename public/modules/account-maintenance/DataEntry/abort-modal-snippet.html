<!-- Abort Confirmation Modal -->
<div id="abortModal" class="modal" style="display: none;">
    <div class="abort-modal">
        <div class="modal-header">
            <h2><i class="bi bi-question-circle"></i> Confirm</h2>
            <button type="button" class="close-modal" onclick="closeAbortModal()" title="Close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="confirm-message">
                <i class="bi bi-question-circle-fill confirm-icon"></i>
                <p>Do you want to Abort/ Discard the changes?<br><span
                        style="font-size: 0.9em; color: #666;">[No:1100]</span></p>
            </div>
            <div class="release-actions">
                <button type="button" class="release-btn release-btn-save" onclick="confirmAbort()">
                    Yes
                </button>
                <button type="button" class="release-btn release-btn-cancel" onclick="closeAbortModal()">
                    No
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    /* Reusing existing modal styles but adding specific Abort modal sizing */
    .abort-modal {
        background-color: #ffffff;
        margin: 15% auto;
        padding: 0;
        border: 1px solid #333;
        /* Dark border to match legacy style */
        border-radius: 4px;
        /* Sharper corners for legacy look */
        width: 400px;
        max-width: 90%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .abort-modal .modal-header {
        background: #517a8e;
        /* Match main header */
        color: white;
        padding: 8px 12px;
        border-radius: 4px 4px 0 0;
    }

    .abort-modal .modal-body {
        padding: 20px;
        text-align: center;
    }

    .confirm-message {
        display: flex;
        align-items: center;
        /* Center vertically */
        justify-content: center;
        /* Center horizontally */
        gap: 15px;
        margin-bottom: 25px;
        text-align: left;
        /* Keep text left aligned relative to icon */
    }

    .confirm-icon {
        font-size: 32px;
        color: #517a8e;
        /* Theme color */
    }

    .confirm-message p {
        margin: 0;
        font-size: 1.1em;
        line-height: 1.4;
    }
</style>
