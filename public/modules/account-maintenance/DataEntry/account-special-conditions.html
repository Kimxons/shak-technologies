<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Conditions</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201" />
  <link rel="stylesheet" href="../../../assets/css/components/TitleBar.css" />
  <style>
    /* Column alignment for Special Conditions grid */
    #conditionsGrid {
      table-layout: fixed;
      width: 100%;
    }
    
    #conditionsGrid thead th {
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }
    
    #conditionsGrid thead th:nth-child(1) {
      width: 60px;
      text-align: center;
    }
    
    #conditionsGrid thead th:nth-child(2) {
      width: auto;
      min-width: 300px;
    }
    
    #conditionsGrid thead th:nth-child(3) {
      width: 120px;
      min-width: 120px;
    }
    
    #conditionsGrid thead th:nth-child(4) {
      width: 150px;
      min-width: 150px;
    }
    
    #conditionsGrid tbody td {
      padding: 8px 12px;
      vertical-align: middle;
      word-wrap: break-word;
    }
    
    #conditionsGrid tbody td:nth-child(1) {
      text-align: center;
    }
    
    #conditionsGrid tbody td:nth-child(3) {
      white-space: nowrap;
      font-weight: 500;
      color: #4b5563;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    #conditionsGrid tbody td:nth-child(4) {
      overflow: visible;
    }
    
    #conditionsGrid tbody td:nth-child(4) input {
      width: 100%;
      min-width: 120px;
      max-width: 100%;
      box-sizing: border-box;
    }
    
    #conditionsGrid tbody td:nth-child(2) {
      overflow: hidden;
      text-overflow: ellipsis;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="window de-window" data-ktb-window>
    <div data-kairo-titlebar 
         data-title="Account Special Conditions" 
         data-icon="bi-list-check">
    </div>

    <main class="main-container main-container--with-panel">
      <div class="form-content" role="region" aria-label="Account Special Conditions form">
        <div class="form-card" data-main-form>
          <div class="form-section">
            <div class="section-header">
              <span class="section-header__title"><i class="bi bi-list-check"></i>General Conditions</span>
              <span class="de-record-count" id="recordCount">0 records</span>
            </div>
            <div class="section-content">
              <!-- Search Bar -->
              <div class="mb-3">
                <div class="d-flex align-items-center gap-2">
                  <div class="flex-grow-1 position-relative">
                    <i class="bi bi-search position-absolute" style="left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none;"></i>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search conditions..." style="padding-left: 36px;" />
                  </div>
                  <button type="button" id="clearSearch" class="btn btn-sm btn-outline-secondary" style="display: none;" title="Clear search">
                    <i class="bi bi-x-circle"></i>
                  </button>
                </div>
              </div>
              
              <!-- Grid -->
              <div class="table table-sm table-hover-wrap" role="region" aria-label="Account special conditions" tabindex="0">
                <table class="table table-sm table-hover" id="conditionsGrid" aria-label="Account special conditions">
                  <thead>
                    <tr>
                      <th>Apply</th>
                      <th>Description</th>
                      <th>Set</th>
                      <th>Value</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="table table-sm table-hover__empty"><td colspan="4">No records to display.</td></tr>
                  </tbody>
                </table>
              </div>
              
              <!-- Pagination Controls -->
              <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top" id="paginationControls" style="display: none;">
                <div class="d-flex align-items-center gap-2">
                  <span class="text-muted" style="font-size: 12px;">Showing</span>
                  <span id="paginationInfo" class="text-muted" style="font-size: 12px;">0 - 0 of 0</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <button type="button" id="prevPageBtn" class="btn btn-sm btn-outline-secondary" disabled title="Previous page">
                    <i class="bi bi-chevron-left"></i>
                  </button>
                  <span class="text-muted" style="font-size: 12px;">
                    Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
                  </span>
                  <button type="button" id="nextPageBtn" class="btn btn-sm btn-outline-secondary" disabled title="Next page">
                    <i class="bi bi-chevron-right"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- BEHIND THE SCENE SECTION (COLLAPSIBLE) -->
          <div class="form-section form-section--bts" id="btsSection">
            <div class="section-header" role="button" data-section-toggle aria-expanded="true" id="btsHeader">
              <span class="section-header__title"><i class="bi bi-gear"></i>Behind The Scene</span>
              <button class="section-toggle-btn" type="button" aria-label="Toggle audit information"><i class="bi bi-chevron-up"></i></button>
            </div>
            <div class="section-content" id="btsBody">
              <div class="audit-section audit-section--summary">
                <div class="audit-cell">
                  <span class="audit-label">Created By</span>
                  <span class="audit-value" id="MakerID">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Created On</span>
                  <span class="audit-value" id="MakerDT">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified By</span>
                  <span class="audit-value" id="ModifierID">-</span>
                </div>
                <div class="audit-cell">
                  <span class="audit-label">Modified On</span>
                  <span class="audit-value" id="ModifierDT">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ACTION PANEL -->
      <aside class="action-panel">
        <div class="d-flex flex-column gap-2 mt-auto">
          <button class="btn-action" type="button" data-action="edit" title="Edit condition"><i class="bi bi-pencil-square"></i><span>Edit</span></button>
          <button class="btn-action" type="button" data-action="save" title="Save changes" disabled><i class="bi bi-check-lg"></i><span>Save</span></button>
          <button class="btn-action" type="button" data-action="cancel" title="Cancel changes" disabled><i class="bi bi-x-circle"></i><span>Cancel</span></button>
        </div>
      </aside>
    </main>

    <div class="de-message-bar" role="alert" aria-live="polite"><i class="bi bi-info-circle"></i><span></span></div>
    <footer class="de-status-bar" role="status">Ready</footer>
    <div class="de-loading-overlay" id="loadingOverlay" hidden><div class="de-loading-spinner"><i class="bi bi-arrow-repeat"></i><span>Loading...</span></div></div>
  </div>

  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/account/accountservice.js"></script>
  <script src="../../../assets/js/components/TitleBar.js"></script>
  <script src="dataentry-base.js?v=20250128"></script>
  <script src="dataentry-utils.js"></script>
  <script src="account-special-conditions.js?v=20250128"></script>
</body>
</html>
