<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Documents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260206">
  <link rel="stylesheet" href="../../../assets/css/maincss.css">
  <link rel="stylesheet" href="../../BillDiscounting/form/bill-discounting.css">
  <link rel="stylesheet" href="../../BillDiscounting/form/trade-finance-modern.css?v=10">
</head>

<body data-page="account-documents" class="tf-modern">
  <div class="window">
    <!-- Title Bar -->
    <div class="tf-title-bar" role="banner" style="pointer-events: auto; user-select: none;">
      <div class="tf-title-bar-left">
        <span class="tf-title-text"><i class="bi bi-file-earmark-text me-2"></i>Account Documents</span>
      </div>
      <div class="tf-title-bar-right" aria-label="Window controls">
        <button type="button" class="tf-title-btn" data-action="refresh" title="Refresh"><i
            class="bi bi-arrow-clockwise"></i></button>
        <button type="button" class="tf-title-btn" data-action="minimize" title="Minimize"><i
            class="bi bi-dash-lg"></i></button>
        <button type="button" class="tf-title-btn" data-action="maximize" title="Maximize"><i
            class="bi bi-square"></i></button>
        <button type="button" class="tf-title-btn" data-action="close" title="Close" style="color: #dc3545;"><i
            class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <div class="main-container">
      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card">
          <form autocomplete="off" novalidate>

            <!-- Document Details Section -->
            <div class="form-section" data-section="document-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-file-earmark-text me-1"></i>Document Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Document Details"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>

                <!-- Row 1: Document ID, Document Type -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue">Document ID</label>
                    <div class="kairo-branch-control">
                      <input type="text" id="documentId" name="documentId" class="kairo-branch-control__id"
                        placeholder="ID">
                      <input type="text" id="documentDesc_lookup" name="documentDesc_lookup"
                        class="kairo-branch-control__name" placeholder="Description" readonly>
                      <button type="button" class="kairo-branch-control__lookup" data-lookup-type="DocumentID"
                        data-target-input="documentId" title="Search Documents">
                        <i class="bi bi-search"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue">Document Type</label>
                    <select id="documentType" name="documentType" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="O">Original</option>
                      <option value="C">Copy</option>
                    </select>
                  </div>
                </div>

                <!-- Row 2: Document Class, Received By, Received Date -->
                <div class="form-row three-col">
                  <div class="col">
                    <label class="label-blue">Document Class</label>
                    <div class="kairo-multiselect" id="documentClassMultiselect">
                      <div class="kairo-multiselect__display" id="documentClassDisplay">--Select-- <i
                          class="bi bi-chevron-down small"></i></div>
                      <div class="kairo-multiselect__dropdown">
                        <!-- Items rendered dynamically via JS -->
                      </div>
                      <input type="hidden" id="documentClass" name="documentClass">
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue">Received By</label>
                    <input type="text" id="receivedBy" name="receivedBy" class="bs-input-text"
                      placeholder="Received By">
                  </div>
                  <div class="col">
                    <label class="label-blue">Received Date</label>
                    <div class="kairo-control">
                      <input type="text" id="receivedDate" name="receivedDate" class="bs-input-text"
                        placeholder="DD/MMM/YYYY" readonly>
                      <input type="date" id="receivedDate_picker" class="hidden-datepicker"
                        style="width:0; height:0; border:0; padding:0; position:absolute; visibility:hidden;">
                      <button type="button" id="receivedDate_btn" class="kairo-control__lookup"
                        data-date-toggle="receivedDate" title="Calendar">
                        <i class="bi bi-calendar-event"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Row 3: Location, Document Image -->
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue">Location</label>
                    <select id="location" name="location" class="bs-select">
                      <option value="">--Select--</option>
                      <option value="B">Document Located in Bank</option>
                      <option value="C">Documents with Customers</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="label-blue">Document Image</label>
                    <div class="kairo-control">
                      <input type="text" id="documentImage" name="documentImage" class="bs-input-text" readonly
                        placeholder="No file selected">
                      <input type="file" id="documentImage_file" style="display: none;" accept="image/*">
                      <button type="button" id="browseBtn" class="kairo-control__lookup btn-compact"
                        data-submit-action="browse" title="Browse">Browse</button>
                    </div>
                  </div>
                </div>

                <!-- Row 4: Remarks (Standalone Full-width Row) -->
                <div class="form-row one-col">
                  <div class="col">
                    <label class="label-blue">Remarks</label>
                    <textarea id="remarks" name="remarks" class="bs-textarea bs-textarea--single-row" rows="1"
                      placeholder="Enter remarks..."></textarea>
                  </div>
                </div>
              </div>
            </div>

            <!-- Audit Trail Section -->
            <div class="form-section" data-section="audit-trail">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history me-1"></i>Audit & Behind The
                  Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Audit Section">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-trail">
                  <div class="form-row three-col">
                    <div class="col">
                      <label class="label-blue" style="font-weight: 700; color: #1e40af;">Created By</label>
                      <input type="text" id="createdBy" name="createdBy" class="bs-input-text" readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue" style="font-weight: 700; color: #1e40af;">Modified By</label>
                      <input type="text" id="modifiedBy" name="modifiedBy" class="bs-input-text" readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue" style="font-weight: 700; color: #1e40af;">Supervised By</label>
                      <input type="text" id="supervisedBy" name="supervisedBy" class="bs-input-text" readonly>
                    </div>
                  </div>
                  <div class="form-row three-col mt-2">
                    <div class="col">
                      <label class="label-blue" style="font-weight: 700; color: #1e40af;">Created On</label>
                      <input type="text" id="createdOn" name="createdOn" class="bs-input-text" placeholder="DD/MMM/YYYY"
                        readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue" style="font-weight: 700; color: #1e40af;">Modified On</label>
                      <input type="text" id="modifiedOn" name="modifiedOn" class="bs-input-text"
                        placeholder="DD/MMM/YYYY" readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue" style="font-weight: 700; color: #1e40af;">Supervised On</label>
                      <input type="text" id="supervisedOn" name="supervisedOn" class="bs-input-text"
                        placeholder="DD/MMM/YYYY" readonly>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </form>
        </div>

        <!-- Right Action Panel -->
        <div class="action-panel">
          <div class="nav-group">
            <button class="btn-nav green" type="button" data-stepper-action="prev" aria-label="Previous"><i
                class="bi bi-chevron-left"></i></button>
            <span>NAVIGATION</span>
            <button class="btn-nav green" type="button" data-stepper-action="next" aria-label="Next"><i
                class="bi bi-chevron-right"></i></button>
          </div>
          <button class="btn-action" type="button" data-submit-action="showImage"><i class="bi bi-image me-1"></i>SHOW
            IMAGE</button>
          <div class="action-buttons">
            <button class="btn-action" type="button" data-shell-mode="View"><i class="bi bi-eye me-1"></i>VIEW</button>
            <button class="btn-action" type="button" data-shell-mode="Add"><i
                class="bi bi-plus-circle me-1"></i>ADD</button>
            <button class="btn-action" type="button" data-shell-mode="Edit"><i
                class="bi bi-pencil-square me-1"></i>EDIT</button>
            <button class="btn-action" type="button" data-submit-action="delete"><i
                class="bi bi-trash3 me-1"></i>DELETE</button>
            <button class="btn-action" type="button" data-submit-action="save"><i
                class="bi bi-check-lg me-1"></i>SAVE</button>
            <button class="btn-action btn-cancel" type="button" data-submit-action="cancel"><i
                class="bi bi-x-circle me-1"></i>CANCEL</button>
            <button class="btn-action" type="button" data-submit-action="clear" data-visible-when="add"><i
                class="bi bi-eraser me-1"></i>CLEAR</button>
          </div>
        </div>
      </div>


    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container-floating"></div>
    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading documents...</span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../BillDiscounting/form/trade-finance-collapsible.js?v=3"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/shared/lookupService.js"></script>
  <script src="../../../assets/js/services/shared/searchService.js"></script>
  <script src="../../../assets/js/shared/search-modal.js"></script>
  <script src="../../../assets/js/services/Document/DocumentService.js"></script>
  <script src="../../../assets/js/services/Account/AccountService.js"></script>
  <script src="dataentry-base.js?v=20250128"></script>
  <script src="dataentry-utils.js"></script>
  <script src="account-documents.js?v=20250128"></script>
</body>

</html>
