<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocking / Unblocking History</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/styles.css?v=20260201" />
  <style>
    /* History Grid Styling */
    #historyTable {
      width: 100%;
    }
    #historyTable tbody tr:nth-child(odd) {
      background-color: #e6f3ff;
    }
    #historyTable tbody tr:nth-child(even) {
      background-color: #ffffff;
    }
    #historyTable tbody tr:hover {
      background-color: #cce5ff;
    }
    #historyTable th {
      background: linear-gradient(180deg, #4a7c95 0%, #3d6a80 100%);
      color: white;
      font-weight: 500;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    #historyTable td {
      vertical-align: middle;
      white-space: nowrap;
    }
    #historyTable .row-num {
      text-align: center;
      font-weight: bold;
      color: #0d6efd;
      background-color: #f0f0f0 !important;
    }
    .table-container {
      flex: 1;
      overflow: auto;
      border: 1px solid #dee2e6;
      margin: 0.5rem;
      max-height: calc(100vh - 180px);
    }
    #historyTable {
      min-width: 1200px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="am-header" role="banner" aria-label="Window title bar">
      <div class="am-header__left">
        <i class="bi bi-clock-history am-header__icon" aria-hidden="true"></i>
        <span class="am-header__title" id="headerTitle">Blocking / Unblocking History</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="am-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="am-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="am-btn am-btn--close" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <main class="main-container">
      <div class="form-content" role="region" aria-label="Blocking History">
        <div class="table-container">
          <table class="table table-sm table-bordered mb-0" id="historyTable">
            <thead>
              <tr>
                <th class="text-center" style="width: 40px;"></th>
                <th>Blocked Date</th>
                <th>Blocked Reason</th>
                <th>Blocked Description</th>
                <th>Blocked Instruction</th>
                <th>Unblocked Date</th>
                <th>Unblocked Reason</th>
                <th>Unblocked Description</th>
                <th>Unblocked Instruction</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- History rows populated dynamically -->
            </tbody>
          </table>
        </div>
        <div id="historyNoData" class="text-center text-muted py-4" hidden>
          <i class="bi bi-inbox fs-1"></i>
          <p class="mb-0">No blocking/unblocking history found</p>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="action-panel" aria-label="Form actions">
        <div class="action-buttons">
          <button class="btn-action" type="button" data-action="hide" title="Hide">
            <i class="bi bi-eye-slash"></i>Hide
          </button>
          <button class="btn-action" type="button" data-action="edit" title="Edit" disabled>
            <i class="bi bi-pencil-square"></i>Edit
          </button>
          <button class="btn-action" type="button" data-action="save" title="Save" disabled>
            <i class="bi bi-check-lg"></i>Save
          </button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel" title="Cancel" disabled>
            <i class="bi bi-x-lg"></i>Cancel
          </button>
          <button class="btn-action" type="button" data-action="back" title="Back">
            <i class="bi bi-arrow-left"></i>Back
          </button>
        </div>
      </div>
    </main>

    <div class="am-message-panel" role="alert" aria-live="polite">
      <i class="bi bi-info-circle"></i>
      <span></span>
    </div>

    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading...</span>
      </div>
    </div>
  </div>

  <!-- Service Scripts -->
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/utils/global-utils.js"></script>
  <script src="../../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../../assets/js/services/account/blockingUnblockingService.js"></script>
  <script src="account-blocking-history.js?v=20260209"></script>
  <script>
    (function() {
      /**
       * Notify parent that this form is opened
       */
      function notifyParentFormOpened() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'submoduleOpened',
              source: 'Account Blocking History'
            }, '*');
          }
        } catch (error) {
          console.error('Error notifying parent of form open:', error);
        }
      }

      /**
       * Close the child form by notifying parent
       */
      function closeChildForm() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ 
              action: 'closeHistoryForm',
              source: 'Account Blocking History'
            }, '*');
          } else {
            window.close();
          }
        } catch (error) {
          console.error('Error closing form:', error);
        }
      }

      /**
       * Handle window control actions
       */
      function handleWindowAction(action, btn) {
        const windowEl = document.querySelector('.window');
        
        switch (action) {
          case 'refresh':
            document.querySelectorAll('[class*="invalid"]').forEach(el => {
              el.classList.remove(...Array.from(el.classList).filter(c => c.includes('invalid')));
            });
            window.location.reload();
            break;
          case 'maximize':
            windowEl?.classList.toggle('maximized');
            const icon = btn.querySelector('i');
            if (windowEl?.classList.contains('maximized')) {
              icon?.classList.replace('bi-square', 'bi-fullscreen-exit');
            } else {
              icon?.classList.replace('bi-fullscreen-exit', 'bi-square');
            }
            break;
          case 'close':
            closeChildForm();
            break;
        }
      }

      function initWindowControls() {
        // Wire header window controls
        document.querySelectorAll('.am-btn[data-action]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const action = btn.getAttribute('data-action');
            handleWindowAction(action, btn);
          });
        });

        // Wire Hide and Back buttons to close the form
        document.querySelectorAll('.btn-action[data-action="hide"], .btn-action[data-action="back"]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            closeChildForm();
          });
        });
      }

      // Initialize on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          initWindowControls();
          notifyParentFormOpened();
        });
      } else {
        initWindowControls();
        notifyParentFormOpened();
      }
    })();
  </script>
</body>
</html>
