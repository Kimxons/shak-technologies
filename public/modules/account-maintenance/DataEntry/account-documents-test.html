<!-- Account Documents Search Test Page -->
<!-- Save as: public/modules/account-maintenance/DataEntry/account-documents-test.html -->
<!-- Purpose: Test search functionality without loading full interface -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Documents - Search Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .test-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .test-item { margin: 10px 0; padding: 10px; background: #f9f9f9; }
        button { padding: 8px 15px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
        input { padding: 8px; width: 200px; }
    </style>
  <link rel="stylesheet" href="dataentry-theme-new.css?v=20260201" />
</head>
<body>
    <div class="test-container">
        <h1>Account Documents - Search Functionality Test</h1>
        
        <div class="test-section">
            <h2>1. Service Availability</h2>
            <button class="am-btn am-btn-secondary" onclick="checkServices()">Check Services</button>
            <div id="serviceResult" class="test-item"></div>
        </div>

        <div class="test-section">
            <h2>2. Manual API Test</h2>
            <input class="am-input" type="text" id="docId" placeholder="Enter Document ID" />
            <button class="am-btn am-btn-secondary" onclick="testApiCall()">Call API</button>
            <div id="apiResult" class="test-item"></div>
        </div>

        <div class="test-section">
            <h2>3. Console Output</h2>
            <p>Check browser console (F12) for detailed logs</p>
            <button class="am-btn am-btn-secondary" onclick="testConsole()">Log Test Data</button>
            <div id="consoleResult" class="test-item"></div>
        </div>

        <div class="test-section">
            <h2>4. Form Field Test</h2>
            <button class="am-btn am-btn-secondary" onclick="testFormFields()">Check Form Fields</button>
            <div id="formResult" class="test-item"></div>
        </div>

        <div class="test-section">
            <h2>5. Response Data Extraction</h2>
            <button class="am-btn am-btn-secondary" onclick="testDataExtraction()">Test Data Extraction</button>
            <div id="extractResult" class="test-item"></div>
        </div>
    </div>

    <!-- Load required services -->
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="../../assets/js/services/Account/AccountService.js"></script>

    <script>
        function checkServices() {
            const result = document.getElementById('serviceResult');
            const checks = {
                'CoreApi': typeof window.CoreApi !== 'undefined',
                'AccountService': typeof window.AccountService !== 'undefined',
                'getAccountDocuments': !!window.AccountService?.getAccountDocuments,
                'addEditAccountDocuments': !!window.AccountService?.addEditAccountDocuments
            };

            let html = '<h3>Service Check Results:</h3>';
            Object.entries(checks).forEach(([name, status]) => {
                const className = status ? 'success' : 'error';
                html += `<div class="${className}">✓ ${name}: ${status ? 'Available' : 'Missing'}</div>`;
            });
            result.innerHTML = html;
            console.log('[Test] Service checks:', checks);
        }

        async function testApiCall() {
            const result = document.getElementById('apiResult');
            const docId = document.getElementById('docId').value.trim();
            
            if (!docId) {
                result.innerHTML = '<div class="error">Please enter a Document ID</div>';
                return;
            }

            result.innerHTML = '<div class="info">Testing API call...</div>';
            
            try {
                console.log('[Test] API call with DocumentID:', docId);
                const response = await window.AccountService.getAccountDocuments({
                    DocumentID: docId,
                    Direction: 0
                });
                
                console.log('[Test] API Response:', response);
                
                let html = '<h3>API Response:</h3>';
                html += `<div class="info">Success: ${response.success}</div>`;
                html += `<div>Message: ${response.message || 'N/A'}</div>`;
                html += `<pre>${JSON.stringify(response, null, 2)}</pre>`;
                
                result.innerHTML = html;
            } catch (err) {
                console.error('[Test] API Error:', err);
                result.innerHTML = `<div class="error">Error: ${err.message}</div><pre>${err.stack}</pre>`;
            }
        }

        function testConsole() {
            const result = document.getElementById('consoleResult');
            const sampleResponse = {
                success: true,
                code: "00",
                message: "Success",
                data: {
                    Details: [],
                    Details02: [
                        {
                            DocumentID: "DOC001",
                            DocumentTypeID: "IDENTITY",
                            ReceivedBy: "USER001",
                            ReceivedDate: "2026-01-15",
                            ImageID: 5,
                            LocationID: "VAULT_A",
                            Remarks: "Clear copy",
                            CreatedBy: "USER001",
                            CreatedOn: "2026-01-10T10:00:00"
                        }
                    ]
                }
            };

            console.log('[Test] Sample Response:', sampleResponse);
            console.log('[Test] Details02 data:', sampleResponse.data.Details02[0]);
            
            result.innerHTML = '<div class="success">Check browser console (F12) for logged data</div>';
        }

        function testFormFields() {
            const result = document.getElementById('formResult');
            const fieldIds = [
                'documentId', 'documentId2', 'documentType', 'documentClass',
                'receivedBy', 'receivedDate', 'location', 'documentImage', 'remarks',
                'createdBy', 'createdOn', 'modifiedBy', 'modifiedOn', 'supervisedBy', 'supervisedOn'
            ];

            let html = '<h3>Form Fields Check (if form loaded):</h3>';
            fieldIds.forEach(id => {
                const el = document.getElementById(id);
                const status = el ? 'Found' : 'Missing';
                const className = el ? 'success' : 'error';
                html += `<div class="${className}">${id}: ${status}</div>`;
            });
            result.innerHTML = html;
        }

        function testDataExtraction() {
            const result = document.getElementById('extractResult');
            
            // Test response with Details02
            const response1 = {
                success: true,
                data: {
                    Details02: [{ DocumentID: "DOC1", DocumentTypeID: "TYPE1" }]
                }
            };

            // Test response with Details array
            const response2 = {
                success: true,
                data: {
                    Details: [{ DocumentID: "DOC2", DocumentTypeID: "TYPE2" }]
                }
            };

            // Test direct array
            const response3 = {
                success: true,
                data: [{ DocumentID: "DOC3", DocumentTypeID: "TYPE3" }]
            };

            function extractData(resp) {
                let row = null;
                if (resp.data?.Details02 && Array.isArray(resp.data.Details02) && resp.data.Details02.length > 0) {
                    row = resp.data.Details02[0];
                    return { source: 'Details02', data: row };
                }
                if (resp.data?.Details && Array.isArray(resp.data.Details) && resp.data.Details.length > 0) {
                    row = resp.data.Details[0];
                    return { source: 'Details', data: row };
                }
                if (Array.isArray(resp.data) && resp.data.length > 0) {
                    return { source: 'Direct Array', data: resp.data[0] };
                }
                if (typeof resp.data === "object" && resp.data !== null && resp.data.DocumentID) {
                    return { source: 'Direct Object', data: resp.data };
                }
                return { source: 'None', data: null };
            }

            const test1 = extractData(response1);
            const test2 = extractData(response2);
            const test3 = extractData(response3);

            let html = '<h3>Data Extraction Test:</h3>';
            html += `<div class="success">Test 1 (Details02): Source=${test1.source}, Data=${test1.data?.DocumentID || 'N/A'}</div>`;
            html += `<div class="success">Test 2 (Details): Source=${test2.source}, Data=${test2.data?.DocumentID || 'N/A'}</div>`;
            html += `<div class="success">Test 3 (Array): Source=${test3.source}, Data=${test3.data?.DocumentID || 'N/A'}</div>`;
            
            result.innerHTML = html;
        }

        // Run initial checks
        window.addEventListener('DOMContentLoaded', () => {
            console.log('[Test] Page loaded, running service checks...');
            checkServices();
        });
    </script>
</body>
</html>
