<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Card Status</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <style>
    /* Local enhancements for Edit Card Status */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }
    .filter-row .label-blue {
      min-width: 60px;
      margin-bottom: 0;
    }
    .filter-row .form-control {
      max-width: 320px;
    }
    
    /* Modern table styling */
    .card-table {
      border: 1px solid #dee2e6;
      border-radius: 4px;
      overflow: hidden;
    }
    .card-table thead {
      background: linear-gradient(180deg, #4a90a4 0%, #357a8c 100%);
    }
    .card-table thead th {
      color: #fff;
      font-weight: 600;
      font-size: 11px;
      padding: 10px 8px;
      border: none;
      white-space: nowrap;
    }
    .card-table tbody tr:hover {
      background-color: #e7f3ff;
    }
    .card-table tbody td {
      font-size: 11px;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    
    /* Audit trail grid layout */
    .audit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 24px;
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 4px;
    }
    .audit-grid .audit-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .audit-grid .audit-field label {
      font-size: 10px;
      font-weight: 600;
      color: #1a5276;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .audit-grid .audit-field input {
      height: 28px;
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid #d1d9e0;
      border-radius: 3px;
      background: #fff;
    }
    .audit-grid .audit-field input:read-only {
      background: #f5f7fa;
      color: #495057;
    }
    
    @media (max-width: 992px) {
      .audit-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="window">
    <!-- Header -->
    <div class="am-header" role="banner">
      <div class="am-header__left">
        <i class="bi bi-credit-card-2-front am-header__icon"></i>
        <span class="am-header__title">Edit Card Status</span>
      </div>
      <div class="am-header__right" role="toolbar" aria-label="Window controls">
        <button class="de-title-btn" type="button" data-action="refresh" title="Refresh" aria-label="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="de-title-btn" type="button" data-action="maximize" title="Maximize" aria-label="Maximize window"><i class="bi bi-square"></i></button>
        <button class="de-title-btn" type="button" data-action="close" title="Close" aria-label="Close window"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
      <div class="form-content" role="region" aria-label="Edit Card Status form">
        <div class="form-card">
          <!-- Stage Filter Section -->
          <div class="form-section">
            <div class="section-content">
              <div class="filter-row">
                <label class="label-blue" for="stageFilter">Stage</label>
                <select id="stageFilter" class="form-control">
                  <option value="">-- Select Stage --</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Card Status Grid Section -->
          <div class="form-section">
            <div class="section-header">
              <i class="bi bi-table section-header__icon"></i>
              <span class="section-header__title">Card Status List</span>
            </div>
            <div class="section-content p-0">
              <div class="card-table">
                <table class="table table-sm table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th style="width: 40px;"><input type="checkbox" class="form-check-input" aria-label="Select all" /></th>
                      <th>Tracking ID</th>
                      <th>Card ID</th>
                      <th>Card Name</th>
                      <th>Provider</th>
                      <th>Branch ID</th>
                      <th>Account ID</th>
                      <th>Status</th>
                      <th class="text-center">Approved</th>
                      <th class="text-center">Active</th>
                      <th class="text-center">Collected</th>
                    </tr>
                  </thead>
                  <tbody id="cardStatusGrid">
                    <tr>
                      <td colspan="11" class="text-center text-muted py-5">
                        <i class="bi bi-credit-card-2-back fs-1 d-block mb-2 opacity-25"></i>
                        <span class="text-secondary">No records to display. Select a stage and click Search.</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Audit Trail Section -->
          <div class="form-section" data-section="audit">
            <div class="section-header" data-section-toggle>
              <i class="bi bi-clock-history section-header__icon"></i>
              <span class="section-header__title">Behind The Scene</span>
              <button type="button" class="section-toggle-btn" aria-label="Toggle audit trail" aria-expanded="true">
                <i class="bi bi-chevron-down"></i>
              </button>
            </div>
            <div class="section-content">
              <div class="audit-grid">
                <div class="audit-field">
                  <label for="createdBy">Created By</label>
                  <input type="text" id="createdBy" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="createdOn">Created On</label>
                  <input type="text" id="createdOn" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="approvedBy">Approved By</label>
                  <input type="text" id="approvedBy" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="approvedOn">Approved On</label>
                  <input type="text" id="approvedOn" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="exportedBy">Exported By</label>
                  <input type="text" id="exportedBy" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="exportedOn">Exported On</label>
                  <input type="text" id="exportedOn" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="activatedBy">Activated By</label>
                  <input type="text" id="activatedBy" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="activatedOn">Activated On</label>
                  <input type="text" id="activatedOn" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="disbursedBy">Disbursed By</label>
                  <input type="text" id="disbursedBy" readonly value="-" />
                </div>
                <div class="audit-field">
                  <label for="disbursedOn">Disbursed On</label>
                  <input type="text" id="disbursedOn" readonly value="-" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <aside class="action-panel">
        <div class="d-flex flex-column gap-2 mt-auto">
          <button class="btn-action btn-action--primary" type="button" data-action="view"><i class="bi bi-eye"></i><span>View</span></button>
          <button class="btn-action" type="button" data-action="edit" disabled><i class="bi bi-pencil"></i><span>Edit</span></button>
          <button class="btn-action btn-action--success" type="button" data-action="issue" disabled><i class="bi bi-card-checklist"></i><span>Issue</span></button>
          <button class="btn-action btn-cancel" type="button" data-action="cancel"><i class="bi bi-x-lg"></i><span>Cancel</span></button>
        </div>
      </aside>
    </main>

    <!-- Status Bar -->
    <footer class="de-status-bar" role="status" aria-live="polite">Ready</footer>

    <!-- Loading Overlay -->
    <div class="de-loading-overlay" id="loadingOverlay" hidden>
      <div class="de-loading-spinner">
        <i class="bi bi-arrow-repeat"></i>
        <span>Loading...</span>
      </div>
    </div>

    <!-- Message Bar -->
    <div class="de-message-bar" id="messageBar" hidden role="alert" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/environment.js"></script>
  <script src="../../assets/js/services/shared/coreApi.js"></script>
  <script src="../../assets/js/services/shared/lookupService.js"></script>
  <script src="edit-card-status.js"></script>
</body>
</html>
