<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Parameters</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body class="branch-parameters copilot-theme" data-page="branch-parameters">
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-left">
                <i class="bi bi-sliders me-2"></i>
                <span class="title-text">Branch Parameters</span>
            </div>
        </div>

        <div class="main-container parameters-container">
            <section class="form-content" aria-label="Branch Parameters Content">
                <div class="form-card">
                    <!-- Parameters Section -->
                    <div class="form-section" data-section="parameters-table">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-sliders"></i> Parameters</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Parameters" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="table-responsive">
                                <table class="table table-sm table-hover align-middle mb-0">
                                    <thead style="background: #f8f9fa;">
                                        <tr>
                                            <th scope="col" style="width: 2rem; text-align: center;">
                                                <input class="form-check-input" type="checkbox" id="selectAll" aria-label="Select all" />
                                            </th>
                                            <th scope="col">Grouping</th>
                                            <th scope="col">Description</th>
                                            <th scope="col">Narration</th>
                                            <th scope="col">Value</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Narration Panel Section -->
                    <div class="form-section" data-section="param-narration">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-chat-left-text"></i> Parameter Details</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Parameter Details" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div id="paramNarrationText" class="param-narration-text" style="padding: 1rem; background: #f8f9fa; border-radius: 4px; min-height: 80px;"></div>
                        </div>
                    </div>

                    <!-- Behind The Scene Section -->
                    <div class="form-section" data-section="behind-scene">
                        <div class="section-header" data-section-toggle>
                            <span class="section-header__title"><i class="bi bi-eye"></i> Behind The Scene</span>
                            <button type="button" class="section-toggle-btn" aria-label="Toggle Behind The Scene" aria-expanded="true">
                                <i class="bi bi-chevron-up"></i>
                            </button>
                        </div>
                        <div class="section-content" data-section-content>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue" for="modifiedBy">Modified By</label>
                                    <input type="text" class="bs-input-text" id="modifiedBy" name="modifiedBy" readonly />
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="supervisedBy">Supervised By</label>
                                    <input type="text" class="bs-input-text" id="supervisedBy" name="supervisedBy" readonly />
                                </div>
                            </div>
                            <div class="form-row two-col">
                                <div class="col">
                                    <label class="label-blue" for="modifiedOn">Modified On</label>
                                    <input type="text" class="bs-input-text" id="modifiedOn" name="modifiedOn" readonly />
                                </div>
                                <div class="col">
                                    <label class="label-blue" for="supervisedOn">Supervised On</label>
                                    <input type="text" class="bs-input-text" id="supervisedOn" name="supervisedOn" readonly />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Action Panel -->
            <aside class="action-panel" aria-label="Actions">
                <div class="action-buttons">
                    <button type="button" class="btn-action" data-bp-action="edit">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </button>
                    <button type="button" class="btn-action" data-bp-action="save" disabled>
                        <i class="bi bi-check me-1"></i>Save
                    </button>
                    <button type="button" class="btn-action" data-bp-action="cancel" disabled>
                        <i class="bi bi-x me-1"></i>Cancel
                    </button>
                    <button type="button" class="btn-action" data-bp-action="back">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/environment.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/services/shared/coreApi.js"></script>
    <script src="branch-parameters.js"></script>
</body>
</html>
