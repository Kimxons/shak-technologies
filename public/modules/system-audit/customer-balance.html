<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Auditing: Customer Balance</title>
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/system-audit/customer-balance.css">
</head>

<body class="system-audit-customer-balance">
  <div class="window">
    <div class="main-container">
      <div class="form-content">
        <form id="customerBalanceForm" autocomplete="off">
          <div class="form-row">
            <label class="label-blue" for="branchId">Branch ID</label>
            <div class="kairo-branch-control" data-kairo-branch-control>
              <input type="text" id="branchId" name="branchId" class="kairo-branch-control__id input-small" aria-label="Branch ID">
              <input type="text" id="branchNameID" name="branchNameID" class="kairo-branch-control__name" aria-label="Branch Name" placeholder="Branch Name" readonly>
              <button type="button" class="btn-lookup kairo-branch-control__lookup" aria-label="Search Branch">🔍</button>
            </div>
          </div>

          <div class="form-row">
            <label class="label-blue" for="productId">Product ID</label>
            <div class="kairo-product-control" data-kairo-product-control>
              <input type="text" id="productId" name="productId" class="kairo-product-control__id" aria-label="Product ID">
              <input type="text" id="productName" class="kairo-product-control__name" aria-label="Product Name" placeholder="Product Name" readonly>
              <button type="button" class="btn-lookup kairo-product-control__lookup" data-role="product-search" aria-label="Search Product">🔍</button>
            </div>
          </div>

          <div class="form-row">
            <label class="label-blue" for="years">Year(S)</label>
            <div class="year-field">
              <input type="text" id="years" name="years" class="input-small" aria-label="Year(s)" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="YYYY" aria-describedby="yearsError">
              <div id="yearsError" class="field-error" aria-live="polite"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="allProducts">All Products</label>
            <input type="checkbox" id="allProducts" name="allProducts" class="checkbox" checked>
          </div>

          <div class="section-header">Results</div>

          <div class="grid-toolbar" role="region" aria-label="Grid controls">
            <div class="grid-toolbar__left">
              <label class="label-blue" for="gridSearch">Search</label>
              <input type="text" id="gridSearch" name="gridSearch" placeholder="Search in grid..." data-role="grid-search">
            </div>

            <div class="grid-toolbar__right">
              <label class="label-blue" for="pageSize">Rows</label>
              <select id="pageSize" name="pageSize" data-role="page-size">
                <option value="10" selected>10</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              <button type="button" class="btn-action" data-role="page-prev">Prev</button>
              <div class="grid-meta" data-role="page-info">Page 1 of 1</div>
              <button type="button" class="btn-action" data-role="page-next">Next</button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="checkbox-col"><input type="checkbox" aria-label="Select all"></th>
                  <th>Account ID</th>
                  <th>Name</th>
                  <th class="num">Previous Balance</th>
                  <th class="num">New Balance</th>
                  <th class="num">Differences</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="6" class="no-records">No records to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </form>
      </div>

      <aside class="action-panel" aria-label="Actions">
        <div class="action-buttons" role="group" aria-label="Form actions">
          <button type="button" class="btn-action underline" data-role="print"><i class="bi bi-printer"></i>Print</button>
          <button type="button" class="btn-action underline" data-role="process"><i class="bi bi-play-circle"></i>Process</button>
          <button type="button" class="btn-action" data-role="rectify"><i class="bi bi-arrow-repeat"></i>Rectify</button>
          <button type="button" class="btn-action btn-action--danger" data-role="cancel"><i class="bi bi-x-circle"></i>Cancel</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="../../assets/js/pages/system-audit/customer-balance.js"></script>
</body>

</html>
