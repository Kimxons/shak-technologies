<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Auditing: GL Vs Sub Ledger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .audit-wrapper {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 16px;
            padding: 16px;
            height: 100vh;
        }

        .audit-main {
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.1);
        }

        .audit-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
        }

        .section-body {
            padding: 16px;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            color: #0066cc;
            font-size: 13px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 8px 10px;
            border: 1.5px solid rgba(15, 23, 42, 0.25);
            border-radius: 0.5rem;
            font-size: 13px;
            color: #1e293b;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-input:readonly {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        .form-input-search {
            padding-right: 32px;
        }

        .search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #0066cc;
            cursor: pointer;
            font-size: 14px;
        }

        .data-table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        .data-table thead {
            background-color: #e8f1ff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table thead th {
            padding: 12px;
            text-align: left;
            color: #0066cc;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1.5px solid rgba(15, 23, 42, 0.1);
            white-space: nowrap;
        }

        .data-table thead th:first-child {
            width: 40px;
            text-align: center;
        }

        .data-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
            font-size: 13px;
        }

        .data-table tbody td:first-child {
            text-align: center;
        }

        .data-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .data-table input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #0066cc;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 12px 16px;
            background-color: #e8f1ff;
            border-radius: 0.5rem;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #0066cc;
        }

        .checkbox-wrapper label {
            color: #1e293b;
            font-size: 13px;
            cursor: pointer;
            margin: 0;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #ffffff;
            padding: 16px;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.1);
            height: fit-content;
        }

        .sidebar-btn {
            padding: 10px 12px;
            border: 1.5px solid rgba(15, 23, 42, 0.15);
            border-radius: 0.5rem;
            background-color: #f8fafc;
            color: #1e293b;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .sidebar-btn:hover {
            background-color: #f1f5f9;
            border-color: rgba(15, 23, 42, 0.25);
        }

        .sidebar-btn:nth-child(2) {
            background-color: #4f9cff;
            color: #ffffff;
            border-color: #4f9cff;
        }

        .sidebar-btn:nth-child(2):hover {
            background-color: #3b7fd1;
            border-color: #3b7fd1;
        }

        .sidebar-btn:nth-child(3) {
            background-color: #f8fafc;
            color: #003d82;
            border-color: rgba(15, 23, 42, 0.15);
            font-weight: 600;
        }

        .sidebar-btn:nth-child(3):hover {
            background-color: #e8f1ff;
            border-color: #003d82;
        }

        .sidebar-btn:nth-child(4) {
            background-color: #f8fafc;
            color: #64748b;
            border-color: rgba(15, 23, 42, 0.15);
        }

        .sidebar-btn:nth-child(4):hover {
            background-color: #f1f5f9;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .audit-wrapper {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                flex-direction: row;
                gap: 8px;
                justify-content: space-between;
            }

            .sidebar-btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="audit-wrapper">
        <div class="audit-main">
            <div class="audit-scroll">
                <div class="section-body">
                    <!-- Filter Section -->
                    <div class="filter-section">
                        <div class="filter-grid">
                            <div class="form-group">
                                <label class="form-label">Branch ID</label>
                                <div style="display: flex; gap: 10px;">
                                    <div class="form-input-wrapper" style="flex: 1;">
                                        <input type="text" id="txtBranchId" class="form-input form-input-search"
                                            value="0101">
                                        <i class="fas fa-search search-icon"></i>
                                    </div>
                                    <input type="text" id="txtHeadOffice" class="form-input"
                                        style="flex: 2; background-color: #f1f5f9; color: #64748b;" readonly>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Data Table -->
                    <div class="data-table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Account ID</th>
                                    <th>Description</th>
                                    <th>Currency ID</th>
                                    <th>Account Balance</th>
                                    <th>General Ledger Balance</th>
                                    <th>Differences</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>

                    <!-- Checkbox -->
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="showDifferences">
                        <label for="showDifferences">Show Only Rows Having Differences</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <button class="sidebar-btn">Print</button>
            <button class="sidebar-btn" id="btnProcess">Process</button>
            <button class="sidebar-btn">Rectify</button>
            <button class="sidebar-btn">Cancel</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../../assets/js/pages/system-audit/gl-vs-sub-ledger.js"></script>
</body>

</html>
