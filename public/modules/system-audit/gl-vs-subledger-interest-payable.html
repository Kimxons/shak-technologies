<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Auditing: GL Vs SubLedger( Interest Payable )</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
    }

    .audit-wrapper {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 16px;
      padding: 16px;
      height: 100vh;
      overflow: hidden;
    }

    .audit-main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
    }

    .section-header {
      background-color: #e8f1ff;
      padding: 12px 16px;
      border-bottom: 1px solid #d0e0f5;
      color: #003d82;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }

    .audit-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      background-color: #f8fafc;
      border-radius: 0.375rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      color: #0066cc;
      font-size: 13px;
      font-weight: 600;
      display: block;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      padding: 8px 10px;
      font-size: 13px;
      border: 1.5px solid rgba(15, 23, 42, 0.25);
      border-radius: 0.5rem;
      font-family: inherit;
      background-color: #ffffff;
      color: #1e293b;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    input[type="text"]:disabled,
    input[type="number"]:disabled,
    select:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    input[type="checkbox"] {
      accent-color: #0066cc;
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .search-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background-color: #e8f1ff;
      border: 1.5px solid #d0e0f5;
      border-radius: 0.375rem;
      color: #0066cc;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .search-icon:hover {
      background-color: #d0e0f5;
      border-color: #0066cc;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      border: 1.5px solid rgba(15, 23, 42, 0.1);
      border-radius: 0.375rem;
      overflow: hidden;
      margin-top: 12px;
    }

    .data-table thead {
      background-color: #e8f1ff;
      border-bottom: 1px solid #d0e0f5;
    }

    .data-table th {
      padding: 12px;
      text-align: left;
      color: #0066cc;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.1);
      font-size: 13px;
      color: #475569;
    }

    .data-table tbody tr:hover {
      background-color: #f8fafc;
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .no-records {
      padding: 40px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    .checkbox-col {
      width: 40px;
      text-align: center;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      background-color: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }

    .sidebar-btn {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid #e0e7ff;
      border-radius: 0.375rem;
      background-color: #f8fafc;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .sidebar-btn:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #1e293b;
    }

    .sidebar-btn:active {
      transform: scale(0.98);
    }

    .filter-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 12px;
    }

    .filter-field {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .filter-input {
      flex: 1;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
    }

    .bottom-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="audit-wrapper">
    <div class="audit-main">
      <div class="audit-scroll section-body">
        <form class="audit-form">
          <!-- Filter Section -->
          <div class="form-section">
            <div class="filter-section">
              <div class="filter-field">
                <div class="filter-input field-col">
                  <label for="branchId">Branch ID</label>
                  <div class="field-row">
                    <input type="text" id="branchId" name="branchId" placeholder="" value="">
                    <button type="button" class="search-icon" title="Search">
                      <i class="fas fa-search"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="filter-field">
                <div class="filter-input field-col">
                  <label for="headOffice">Head Office</label>
                  <input type="text" id="headOffice" name="headOffice" disabled>
                </div>
              </div>
            </div>

            <div class="filter-section">
              <div class="filter-field">
                <div class="filter-input field-col">
                  <label for="glAccountId">GL Account ID</label>
                  <div class="field-row">
                    <input type="text" id="glAccountId" name="glAccountId" placeholder="">
                    <button type="button" class="search-icon" title="Search">
                      <i class="fas fa-search"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="checkbox-field">
                <input type="checkbox" id="allAccounts" name="allAccounts">
                <label for="allAccounts" style="margin: 0;">All Accounts</label>
              </div>
            </div>
          </div>

          <!-- Data Table -->
          <table class="data-table">
            <thead>
              <tr>
                <th class="checkbox-col">
                  <input type="checkbox">
                </th>
                <th>GL Account ID</th>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>General Ledger Balance</th>
                <th>Customer Balance</th>
                <th>Differences</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="7" class="no-records">No records to display.</td>
              </tr>
            </tbody>
          </table>

          <!-- Bottom Checkbox -->
          <div class="bottom-checkbox">
            <input type="checkbox" id="showDifferences" name="showDifferences">
            <label for="showDifferences" style="margin: 0;">Show Only Rows Having Differences</label>
          </div>
        </form>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <button type="button" class="sidebar-btn">Print</button>
      <button type="button" class="sidebar-btn">Process</button>
      <button type="button" class="sidebar-btn">Cancel</button>
    </div>
  </div>
</body>

</html>
