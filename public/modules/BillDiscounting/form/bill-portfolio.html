<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Portfolio · Trade Finance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="bill-discounting.css">
    <link rel="stylesheet" href="trade-finance-modern.css">
    <style>
        .tf-modern .module-layout.no-sidebar {
            grid-template-columns: 1fr 120px;
        }
    </style>
</head>

<body data-page="bill-portfolio" class="tf-modern">
    <div class="cm-react-orbs" aria-hidden="true">
        <span class="cm-react-orb cm-react-orb--primary"></span>
        <span class="cm-react-orb cm-react-orb--secondary"></span>
        <span class="cm-react-orb cm-react-orb--accent"></span>
    </div>

    <div class="module-shell">
        <div class="module-layout no-sidebar">
            <!-- Main Content -->
            <main class="content">
                <form id="bill-portfolio-form" class="form" novalidate>
                    <section class="card">
                        <div class="card-header">
                            <span>Bill Portfolio Records</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="data-table-wrapper" style="min-height: 450px;">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Application ID</th>
                                            <th>Due Date</th>
                                            <th class="text-end">Amount</th>
                                            <th class="text-end">Interest Rate</th>
                                            <th class="text-center">(Days)</th>
                                            <th class="text-end">Interest Amount</th>
                                            <th>Application Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="7" class="text-center py-5 text-muted">No records to display.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>
                </form>
            </main>

            <!-- Action Bar -->
            <aside class="action-bar border-start">
                <div class="mt-auto d-flex flex-column gap-2">
                    <p class="small fw-bold text-muted mb-2 px-2">Actions</p>
                    <button type="button" class="action-btn" data-bs-toggle="modal" data-bs-target="#billSanctionDetailsInline">
                        <i class="bi bi-info-circle"></i>
                        <span>Sanction Details</span>
                    </button>
                    <button type="button" class="action-btn" data-bill-portfolio-action="back">
                        <i class="bi bi-arrow-left-circle-fill"></i>
                        <span>Back</span>
                    </button>
                    <button type="button" class="action-btn" data-bill-portfolio-action="cancel"
                        style="background: var(--danger); color: white; border: none; font-weight: bold;">
                        <i class="bi bi-x-circle-fill"></i>
                        <span>Close</span>
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/environment.js"></script>
    <script src="../../../assets/js/config.js"></script>
    <script src="../../../assets/js/app.js"></script>
    <script src="../js/bill-portfolio.js"></script>
</body>

<!-- Inline Sanction Details Modal -->
<div class="modal fade tf-inline-modal--md" id="billSanctionDetailsInline" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Account Sanction Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <iframe src="bill-sanction-details.html" title="Account Sanction Details" class="w-100 h-100 border-0"></iframe>
            </div>
        </div>
    </div>
</div>

</html>
