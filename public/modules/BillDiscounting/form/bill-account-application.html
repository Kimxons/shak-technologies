<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Account Application · Trade Finance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../assets/css/styles.css">
  <link rel="stylesheet" href="../../../assets/css/maincss.css">
  <link rel="stylesheet" href="../../account-maintenance/modern-account-maintenance.css">
  <link rel="stylesheet" href="bill-discounting.css">
  <link rel="stylesheet" href="trade-finance-modern.css?v=10">
</head>

<body data-page="bill-account-application" class="tf-modern">
  <div class="window">
    <!-- Title Bar -->
    <div class="tf-title-bar" role="banner" style="pointer-events: auto; user-select: none;">
      <div class="tf-title-bar-left">
        <span class="tf-title-text"><i class="bi bi-file-earmark-plus me-2"></i>Bill Account Application</span>
      </div>
      <div class="tf-title-bar-right" aria-label="Window controls">
        <button type="button" class="tf-title-btn" data-action="refresh" title="Refresh"><i
            class="bi bi-arrow-clockwise"></i></button>
        <button type="button" class="tf-title-btn" data-action="minimize" title="Minimize"><i
            class="bi bi-dash-lg"></i></button>
        <button type="button" class="tf-title-btn" data-action="maximize" title="Maximize"><i
            class="bi bi-square"></i></button>
        <button type="button" class="tf-title-btn" data-action="close" title="Close" style="color: #dc3545;"><i
            class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <div class="main-container">
      <!-- Left Sidebar -->
      <div class="sidebar" id="main-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header__title"><i class="bi bi-grid-3x3-gap-fill"></i>Submodules</span>
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="sidebar-search">
          <input type="text" class="sidebar-search__input" id="submoduleSearch" placeholder="Search submodules...">
          <i class="bi bi-search sidebar-search__icon"></i>
        </div>

        <!-- Scrollable Content -->
        <div class="sidebar-content">
          <!-- View Section -->
          <div class="nav-section nav-section--card" data-nav-section data-section-name="View">
            <div class="nav-header nav-header--card" data-tooltip="View">
              <div class="nav-header__content">
                <i class="bi bi-eye-fill nav-header__icon"></i>
                <span class="nav-label nav-label--card">View</span>
              </div>
              <div class="nav-header__badge">
                <button type="button" class="nav-arrow nav-arrow--card" aria-label="Toggle View" aria-expanded="false">
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>
            <div class="nav-items nav-items--card" id="nav-view">
              <div class="sidebar-item sidebar-item--enhanced active" data-open-inline-modal="billSanctionDetailsInline"
                data-tooltip="Sanction Details">
                <div class="sidebar-item__content">
                  <i class="bi bi-info-circle-fill sidebar-item__icon"></i>
                  <div class="sidebar-item__text">
                    <div class="sidebar-item__title">Sanction Details</div>
                    <div class="sidebar-item__description">View account sanctions</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <div class="form-content">
        <div class="form-card">
          <form id="bill-account-form" novalidate>
            <!-- Application Details Section -->
            <div class="form-section" data-section="application-details">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-file-earmark-text me-1"></i>Application
                  Details</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Application Details"
                  aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" style="font-weight: 700; color: #1e40af;">Branch ID <span
                        style="color: #ef4444;">*</span></label>
                    <div class="kairo-branch-control" data-kairo-branch-control>
                      <input type="text" id="BranchID" name="BranchID" class="kairo-branch-control__id"
                        placeholder="e.g. 0101">
                      <input type="text" name="BranchName" class="kairo-branch-control__name" placeholder="Branch Name"
                        readonly>
                      <button type="button" class="btn-lookup kairo-branch-control__lookup" data-branch-search><i
                          class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue" style="font-weight: 700; color: #1e40af;">Application ID <span
                        style="color: #ef4444;">*</span></label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" name="ApplicationID" class="kairo-control__id" placeholder="Application ID">
                      <button type="button" class="btn-lookup kairo-control__lookup" data-application-search><i
                          class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <div class="form-row two-col">
                  <div class="col">
                    <label class="label-blue" style="font-weight: 700; color: #1e40af;">Client ID <span
                        style="color: #ef4444;">*</span></label>
                    <div class="kairo-client-control" data-kairo-client-control>
                      <input type="text" name="ClientID" class="kairo-client-control__id" placeholder="Client ID">
                      <input type="text" name="ClientName" class="kairo-client-control__name" placeholder="Client Name"
                        readonly>
                      <button type="button" class="btn-lookup kairo-client-control__lookup" data-client-search><i
                          class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue">Account ID</label>
                    <div class="kairo-account-control" data-kairo-account-control>
                      <input type="text" name="AccountID" class="kairo-account-control__id" placeholder="Account ID"
                        maxlength="16">
                      <input type="text" name="AccountName" id="accountnameid" class="kairo-account-control__name"
                        placeholder="Account Name" readonly>
                      <button type="button" class="btn-lookup kairo-account-control__lookup" data-account-search><i
                          class="bi bi-search"></i></button>
                    </div>
                  </div>
                </div>

                <div class="form-row three-col">
                  <div class="col">
                    <label class="label-blue" style="font-weight: 700; color: #1e40af;">Account Product ID <span
                        style="color: #ef4444;">*</span></label>
                    <div class="kairo-product-control" data-kairo-product-control>
                      <input type="text" name="ProductID" class="kairo-product-control__id" placeholder="Product ID">
                      <input type="text" name="ProductName" class="kairo-product-control__name"
                        placeholder="Product Name" readonly>
                      <button type="button" class="btn-lookup kairo-product-control__lookup" data-product-search><i
                          class="bi bi-search"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue">Application Date</label>
                    <div class="kairo-control" data-kairo-control>
                      <input type="text" name="ApplicationDate" class="bs-input-text" placeholder="dd mmm yyyy">
                      <button type="button" class="btn-lookup btn-calendar"
                        style="background: #1e7cc4; border: none; color: white;"><i
                          class="bi bi-calendar-event"></i></button>
                    </div>
                  </div>
                  <div class="col">
                    <label class="label-blue">Application Status</label>
                    <input type="text" name="ApplicationStatus" class="bs-input-text" placeholder="Application Status"
                      readonly>
                  </div>
                </div>

                <div class="form-row">
                  <div class="col">
                    <label class="label-blue">Remarks</label>
                    <textarea name="Remarks" class="bs-textarea" rows="1" placeholder="Enter remarks..."></textarea>
                  </div>
                </div>
              </div>
            </div>


            <!-- Audit & Behind The Scene Section -->
            <div class="form-section" data-section="audit">
              <div class="section-header" data-section-toggle>
                <span class="section-header__title"><i class="bi bi-clock-history me-1"></i>Audit & Behind The
                  Scene</span>
                <button type="button" class="section-toggle-btn" aria-label="Toggle Audit Section" aria-expanded="true">
                  <i class="bi bi-chevron-up"></i>
                </button>
              </div>
              <div class="section-content" data-section-content>
                <div class="audit-trail">
                  <div class="form-row three-col">
                    <div class="col">
                      <label class="label-blue">Created By</label>
                      <input type="text" name="CreatedBy" class="bs-input-text" readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue">Modified By</label>
                      <input type="text" name="ModifiedBy" class="bs-input-text" readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue">Supervised By</label>
                      <input type="text" name="SupervisedBy" class="bs-input-text" readonly>
                    </div>
                  </div>
                  <div class="form-row three-col mt-2">
                    <div class="col">
                      <label class="label-blue">Created On</label>
                      <input type="text" name="CreatedOn" class="bs-input-text" placeholder="DD/MMM/YYYY" readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue">Modified On</label>
                      <input type="text" name="ModifiedOn" class="bs-input-text" placeholder="DD/MMM/YYYY" readonly>
                    </div>
                    <div class="col">
                      <label class="label-blue">Supervised On</label>
                      <input type="text" name="SupervisedOn" class="bs-input-text" placeholder="DD/MMM/YYYY" readonly>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>

        <!-- Right Action Panel -->
        <div class="action-panel">
          <div class="nav-group">
            <button class="btn-nav green" type="button" data-stepper-action="prev" aria-label="Previous"><i
                class="bi bi-chevron-left"></i></button>
            <span>NAVIGATION</span>
            <button class="btn-nav green" type="button" data-stepper-action="next" aria-label="Next"><i
                class="bi bi-chevron-right"></i></button>
          </div>

          <div class="action-buttons">
            <button class="btn-action" type="button" data-shell-mode="View"><i class="bi bi-eye me-1"></i>VIEW</button>
            <button class="btn-action" type="button" data-shell-mode="Add"><i
                class="bi bi-plus-circle me-1"></i>ADD</button>
            <button class="btn-action" type="button" data-submit-action="delete"><i
                class="bi bi-trash3 me-1"></i>DELETE</button>
            <button class="btn-action" type="button" data-submit-action="save"><i
                class="bi bi-check-lg me-1"></i>SAVE</button>
            <button class="btn-action btn-cancel" type="button" data-submit-action="cancel"><i
                class="bi bi-x-circle me-1"></i>CANCEL</button>
            <button class="btn-action" type="button" data-submit-action="clear" data-visible-when="add"><i
                class="bi bi-eraser me-1"></i>CLEAR</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Inline Sanction Details Modal -->
    <div class="modal fade" id="billSanctionDetailsInline" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 60vw; width: 60vw;">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Account Sanction Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0" style="height: 65vh; overflow: hidden;">
            <iframe src="bill-sanction-details.html" title="Account Sanction Details"
              class="w-100 h-100 border-0"></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Toast Container -->
    <div id="toastContainer" class="toast-container-floating"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="trade-finance-titlebar.js"></script>
    <script src="trade-finance-collapsible.js?v=3"></script>
    <script src="../../../assets/js/services/shared/serviceLoader.js"></script>
    <script src="../js/bill-discounting-auto-load.js"></script>
    <script src="../../../assets/js/ui/date-pickers.js"></script>
    <script src="../js/bill-account-application.js"></script>
</body>

</html>
