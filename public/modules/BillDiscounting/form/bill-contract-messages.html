<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Contract Messages · Trade Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="bill-discounting.css">
  <link rel="stylesheet" href="trade-finance-modern.css">
</head>

<body data-page="bill-contract-messages" class="tf-modern">
  <div class="tf-title-bar" role="banner">
    <div class="tf-title-bar-left">
      <span class="tf-title-text">Bill Contract Messages</span>
    </div>
    <div class="tf-title-bar-right" aria-label="Window controls">
      <button type="button" class="tf-title-btn" data-action="refresh" title="Refresh" aria-label="Refresh">
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
      </button>
      <button type="button" class="tf-title-btn" data-action="minimize" title="Minimize" aria-label="Minimize">
        <i class="bi bi-dash-lg" aria-hidden="true"></i>
      </button>
      <button type="button" class="tf-title-btn" data-action="maximize" title="Maximize" aria-label="Maximize">
        <i class="bi bi-square" aria-hidden="true"></i>
      </button>
      <button type="button" class="tf-title-btn close" data-action="close" title="Close" aria-label="Close">
        <i class="bi bi-x-circle" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="module-shell">
    <div class="module-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-title">Contract Messages</div>
        <div class="nav-section">
          <button type="button" class="nav-toggle">
            <i class="bi bi-pencil-square"></i>
            <span class="nav-toggle-label">DataEntry</span>
            <i class="bi bi-chevron-down nav-chevron"></i>
          </button>
          <div class="nav-items">
            <button type="button" class="nav-item active">
              <i class="bi bi-envelope"></i>
              <span>Messages</span>
            </button>
          </div>
        </div>

        <div class="mt-auto pt-3 border-top">
          <button type="button" class="nav-item text-danger w-100" data-bill-contract-action="cancel">
            <i class="bi bi-x-circle-fill"></i>
            <span>Close Window</span>
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <form id="bill-contract-messages-form" class="form" novalidate>
          <!-- Selection Card -->
          <section class="card">
            <div class="card-header">
              <span>Search Contact</span>
            </div>
            <div class="card-body form-grid two-col tf-header-grid">
              <div class="form-control-group">
                <label class="form-label"><span>Contract ID</span></label>
                <div class="input-segmented">
                  <input type="text" class="form-control segment-id" id="ContractID" name="ContractID">
                  <input type="text" class="form-control segment-desc" id="ContractName" name="ContractName" placeholder="" readonly aria-label="Contract Name">
                  <button type="button" class="btn-inline-search" data-bill-contract-lookup="contract"><i
                      class="bi bi-search"></i></button>
                </div>
              </div>
              <div class="form-control-group">
                <label class="form-label"><span>Reference No.</span></label>
                <input type="text" class="form-control" id="ContractReferenceNo" name="ContractReferenceNo">
              </div>
              <div class="form-control-group full-row">
                <label class="form-label"><span>Client ID</span></label>
                <div class="input-segmented">
                  <input type="text" class="form-control segment-id" id="ClientID" name="ClientID">
                  <input type="text" class="form-control segment-desc" id="ClientName" name="ClientName"
                    placeholder="Client Name" readonly>
                  <button type="button" class="btn-inline-search" data-bill-contract-lookup="client"><i
                      class="bi bi-search"></i></button>
                </div>
              </div>
            </div>
          </section>

          <!-- Messages List Card -->
          <section class="card">
            <div class="card-header">
              <span>Messages List</span>
            </div>
            <div class="card-body p-0">
              <div class="data-table-wrapper">
                <table id="billContractMessagesTable" class="data-table" data-bill-contract-messages-table>
                  <thead>
                    <tr>
                      <th style="width: 15%">Msg No.</th>
                      <th style="width: 20%">Msg Date</th>
                      <th style="width: 20%">Msg Type</th>
                      <th style="width: 45%">Message</th>
                    </tr>
                  </thead>
                  <tbody id="billContractMessagesTableBody">
                    <tr>
                      <td colspan="4" class="text-center py-4 text-muted">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- Message Preview Card -->
          <section class="card">
            <div class="card-header">
              <span>Message Detail</span>
            </div>
            <div class="card-body">
              <div class="form-control-group full-row">
                <label class="form-label">Selected Message Content</label>
                <textarea id="SelectedMessage" name="SelectedMessage" class="form-control" rows="4"
                  placeholder="Message content will appear here..." readonly></textarea>
              </div>
            </div>
          </section>
        </form>
        <div id="billContractMessagesToast" class="alert alert-success mt-3 d-none" role="alert"></div>
      </main>

      <!-- Action Bar -->
      <aside class="action-bar border-start">
        <div class="mt-auto d-flex flex-column gap-2">
          <p class="small fw-bold text-muted mb-2 px-2">Actions</p>
          <button type="button" class="action-btn" data-bill-contract-action="view">
            <i class="bi bi-eye-fill"></i>
            <span>View</span>
          </button>
          <button type="button" class="action-btn" data-bill-contract-action="add">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Add</span>
          </button>
          <button type="button" class="action-btn" data-bill-contract-action="edit">
            <i class="bi bi-pencil-square"></i>
            <span>Edit</span>
          </button>

          <div class="my-2 border-top"></div>

          <button type="button" class="action-btn save" data-bill-contract-action="save" disabled>
            <i class="bi bi-check-circle-fill"></i>
            <span>Save</span>
          </button>
          <button type="button" class="action-btn cancel" data-bill-contract-action="cancel">
            <i class="bi bi-x-circle-fill"></i>
            <span>Cancel</span>
          </button>

          <button type="button" class="action-btn mt-4" data-bill-contract-action="back">
            <i class="bi bi-arrow-left-circle-fill"></i>
            <span>Back</span>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="trade-finance-titlebar.js"></script>
  <script src="../js/bill-contract-messages.js"></script>

  <script src="../../../assets/js/pages/BillDiscounting/form/bill-contract-messages.embedded.js"></script>
</body>

</html>
