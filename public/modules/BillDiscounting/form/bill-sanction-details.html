<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Sanction Details · Trade Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="bill-discounting.css">
  <link rel="stylesheet" href="trade-finance-modern.css">
  <style>
    /* Special layout for simple modals without sidebar */
    .tf-modern .module-layout.no-sidebar {
      grid-template-columns: 1fr 120px;
    }
  </style>
</head>

<body data-page="bill-sanction-details" class="tf-modern">
  <div class="cm-react-orbs" aria-hidden="true">
    <span class="cm-react-orb cm-react-orb--primary"></span>
    <span class="cm-react-orb cm-react-orb--secondary"></span>
    <span class="cm-react-orb cm-react-orb--accent"></span>
  </div>

  <div class="module-shell">
    <div class="module-layout no-sidebar">
      <!-- Main Content -->
      <main class="content">
        <form id="bill-sanction-details-form" class="form" novalidate>
          <section class="card">
            <div class="card-header">
              <span>Account Sanction History</span>
            </div>
            <div class="card-body p-0">
              <div class="data-table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Application ID</th>
                      <th>Amount</th>
                      <th class="text-end">Interest Rate</th>
                      <th>Sanctioner ID</th>
                      <th>Sanctioner Name</th>
                      <th>Sanction Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="6" class="text-center py-4 text-muted">No records to display.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </form>
        <div id="formToast" class="alert alert-success mt-3 d-none" role="alert"></div>
      </main>

      <!-- Action Bar -->
      <aside class="action-bar border-start">
        <div class="mt-auto d-flex flex-column gap-2">
          <p class="small fw-bold text-muted mb-2 px-2">Actions</p>
          <button type="button" class="action-btn" data-bill-sanction-action="back">
            <i class="bi bi-arrow-left-circle-fill"></i>
            <span>Back</span>
          </button>
          <button type="button" class="action-btn" data-bill-sanction-action="cancel"
            style="background: var(--danger); color: white; border: none; font-weight: bold;">
            <i class="bi bi-x-circle-fill"></i>
            <span>Close</span>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/environment.js"></script>
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../assets/js/auth/auth.config.js"></script>
  <script src="../../../assets/js/auth/auth.service.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/bill-sanction-details.js"></script>
</body>

</html>
