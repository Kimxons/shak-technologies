<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Search</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            padding: 0;
        }

        .search-container {
            padding: 20px;
            background: white;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .search-btn {
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s;
        }

        .search-btn-primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .search-btn-primary:hover {
            background: #2563eb;
        }

        .search-btn-secondary {
            background: white;
            color: #64748b;
            border-color: #cbd5e1;
        }

        .search-btn-secondary:hover {
            background: #f1f5f9;
        }

        .results-container {
            flex: 1;
            overflow: auto;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            z-index: 1;
        }

        th {
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr.selected {
            background: #dbeafe;
        }

        .no-results {
            padding: 40px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .select-btn {
            padding: 6px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .select-btn:hover:not(:disabled) {
            background: #059669;
        }

        .select-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="search-container">
        <div class="search-actions">
            <button class="search-btn search-btn-primary" id="searchBtn">
                <i class="bi bi-search"></i> Search
            </button>
            <button class="search-btn search-btn-secondary" id="closeBtn">
                <i class="bi bi-x"></i> Close
            </button>
        </div>

        <div class="results-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Currency Code</th>
                        <th>Currency Name</th>
                        <th>Symbol</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td colspan="4" class="loading">Click Search to load currencies...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer-actions">
            <button class="select-btn" id="selectBtn" disabled>Select</button>
        </div>
    </div>

    <script src="../../assets/js/config.js"></script>
    <script>
        let selectedRow = null;
        let currenciesData = [];

        const resultsBody = document.getElementById('resultsBody');
        const selectBtn = document.getElementById('selectBtn');
        const searchBtn = document.getElementById('searchBtn');
        const closeBtn = document.getElementById('closeBtn');

        async function searchCurrencies() {
            resultsBody.innerHTML = '<tr><td colspan="4" class="loading">Searching...</td></tr>';
            selectBtn.disabled = true;
            selectedRow = null;

            try {
                // Get base URL - try Environment or use default
                let baseUrl = "http://localhost:5000";
                if (typeof window.Environment !== 'undefined' && window.Environment) {
                    baseUrl = (window.Environment.baseUrlProducts || window.Environment.baseUrlCommon || "http://localhost:5000").replace(/\/+$/, "");
                }
                
                console.log('Using base URL:', baseUrl);
                const requestBody = {
                    RequestID: "dbo.pc_SearchCurrencies",
                    FormId: "dbo.pc_SearchCurrencies",
                    RequestData: {},
                    RequestTime: new Date().toLocaleString('en-US', { 
                        year: 'numeric', 
                        month: '2-digit', 
                        day: '2-digit', 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        second: '2-digit',
                        hour12: false 
                    }).replace(',', ''),
                    AppName: "PROJECT_KAIRO",
                    Checksum: ""
                };

                console.log('Currency Search Request:', requestBody);

                const response = await fetch(`${baseUrl}/api/OldAPI`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();
                console.log('Currency Search Response:', result);

                if (result.success && result.data && result.data.Details) {
                    currenciesData = result.data.Details;
                    displayResults(currenciesData);
                } else {
                    resultsBody.innerHTML = '<tr><td colspan="4" class="no-results">No currencies found</td></tr>';
                }
            } catch (error) {
                console.error('Error searching currencies:', error);
                resultsBody.innerHTML = `<tr><td colspan="4" class="no-results">Error: ${error.message}</td></tr>`;
            }
        }

        function displayResults(data) {
            if (!data || data.length === 0) {
                resultsBody.innerHTML = '<tr><td colspan="4" class="no-results">No currencies found</td></tr>';
                return;
            }

            resultsBody.innerHTML = data.map((currency, index) => `
                <tr data-index="${index}">
                    <td>${currency.CurrencyID || currency.CurrencyCode || currency.currencyCode || currency.currencyID || ''}</td>
                    <td>${currency.CurrencyName || currency.currencyName || currency.Description || ''}</td>
                    <td>${currency.Symbol || currency.symbol || ''}</td>
                    <td>${currency.Status || currency.status || currency.IsActive || ''}</td>
                </tr>
            `).join('');

            // Add click handlers to rows
            resultsBody.querySelectorAll('tr').forEach(row => {
                row.addEventListener('click', () => selectRow(row));
                row.addEventListener('dblclick', () => {
                    selectRow(row);
                    selectCurrency();
                });
            });
        }

        function selectRow(row) {
            if (selectedRow) {
                selectedRow.classList.remove('selected');
            }
            selectedRow = row;
            row.classList.add('selected');
            selectBtn.disabled = false;
        }

        function selectCurrency() {
            if (!selectedRow) return;

            const index = parseInt(selectedRow.dataset.index);
            const currency = currenciesData[index];

            if (currency) {
                window.parent.postMessage({
                    type: 'CURRENCY_SELECTED',
                    currencyCode: currency.CurrencyID || currency.CurrencyCode || currency.currencyCode || currency.currencyID
                }, '*');
            }
        }

        searchBtn.addEventListener('click', searchCurrencies);
        selectBtn.addEventListener('click', selectCurrency);
        closeBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'CLOSE_SEARCH' }, '*');
        });

        // Auto-search on load
        searchCurrencies();
    </script>
</body>

</html>
