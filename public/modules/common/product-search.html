<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search</title>
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            padding: 0;
        }

        .search-container {
            padding: 20px;
            background: white;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            gap: 12px;
            align-items: end;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .form-select,
        .form-input {
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-select:focus,
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filter-op {
            max-width: 100px;
        }

        .search-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 12px 0;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .search-btn {
            padding: 6px 16px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .search-btn-primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .search-btn-primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        .results-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #f1f5f9;
            border-bottom: 2px solid #cbd5e1;
        }

        th {
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            font-size: 11px;
        }

        tbody tr {
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: #f0f4f8;
        }

        tbody tr.selected {
            background: #dbeafe;
        }

        td {
            padding: 10px 12px;
            color: #475569;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
        }

        .nav-btn {
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 12px;
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .select-btn {
            padding: 6px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .select-btn:hover:not(:disabled) {
            background: #059669;
        }

        .select-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="search-container">
        <div class="form-grid">
            <label class="form-label">Product ID</label>
            <select class="form-select filter-op" id="productIdOp">
                <option value="Like">Like</option>
                <option value="=">=</option>
            </select>
            <input type="text" class="form-input search-field" id="productId" placeholder="Enter Product ID">

            <label class="form-label">Description</label>
            <select class="form-select filter-op" id="descOp">
                <option value="Like">Like</option>
                <option value="=">=</option>
            </select>
            <input type="text" class="form-input search-field" id="description" placeholder="Enter Description">

            <label class="form-label">Product Type</label>
            <select class="form-select filter-op" id="typeOp">
                <option value="Like">Like</option>
                <option value="=">=</option>
            </select>
            <input type="text" class="form-input search-field" id="productType" placeholder="Enter Product Type">
        </div>

        <div class="search-actions">
            <button type="button" class="search-btn search-btn-primary" id="btnSearch">
                <i class="bi bi-search"></i> Search
            </button>
            <button type="button" class="search-btn" id="btnClear">
                <i class="bi bi-x-circle"></i> Clear
            </button>
        </div>

        <div class="results-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ProductID</th>
                            <th>Description</th>
                            <th>ProductTypeID</th>
                            <th>CurrencyID</th>
                        </tr>
                    </thead>
                    <tbody id="searchResults">
                        <tr>
                            <td colspan="4" class="no-results">
                                <i class="bi bi-search"></i> Enter search criteria and click Search
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="pagination">
            <button class="nav-btn" id="btnPrev">← Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button class="nav-btn" id="btnNext">Next →</button>
        </div>

        <div class="footer-actions">
            <button type="button" class="select-btn" id="btnSelect" disabled>
                <i class="bi bi-check-circle"></i> Select
            </button>
            <button type="button" class="search-btn" id="btnClose" style="margin-left: auto;">
                <i class="bi bi-x-circle"></i> Close
            </button>
        </div>
    </div>

    <script>
        // State management
        let productSearchData = [];
        let selectedProduct = null;
        let currentPage = 1;
        let pageSize = 50;
        let totalPages = 1;

        // DOM Elements
        const elements = {
            productId: document.getElementById('productId'),
            productIdOp: document.getElementById('productIdOp'),
            description: document.getElementById('description'),
            descOp: document.getElementById('descOp'),
            productType: document.getElementById('productType'),
            typeOp: document.getElementById('typeOp'),
            btnSearch: document.getElementById('btnSearch'),
            btnClear: document.getElementById('btnClear'),
            searchResults: document.getElementById('searchResults'),
            btnSelect: document.getElementById('btnSelect'),
            btnPrev: document.getElementById('btnPrev'),
            btnNext: document.getElementById('btnNext'),
            pageInfo: document.getElementById('pageInfo')
        };

        // Perform product search
        async function performProductSearch() {
            try {
                elements.searchResults.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-results">
                            <i class="bi bi-hourglass-split"></i> Searching products...
                        </td>
                    </tr>
                `;

                // Build WhereStmt based on inputs
                let whereStmt = "1=1";

                if (elements.productId.value) {
                    const operator = elements.productIdOp.value === 'Like' ? 'LIKE' : '=';
                    const value = elements.productIdOp.value === 'Like' ? `'%${elements.productId.value}%'` : `'${elements.productId.value}'`;
                    whereStmt += ` AND ProductID ${operator} ${value}`;
                }

                if (elements.description.value) {
                    const operator = elements.descOp.value === 'Like' ? 'LIKE' : '=';
                    const value = elements.descOp.value === 'Like' ? `'%${elements.description.value}%'` : `'${elements.description.value}'`;
                    whereStmt += ` AND Description ${operator} ${value}`;
                }

                if (elements.productType.value) {
                    const operator = elements.typeOp.value === 'Like' ? 'LIKE' : '=';
                    const value = elements.typeOp.value === 'Like' ? `'%${elements.productType.value}%'` : `'${elements.productType.value}'`;
                    whereStmt += ` AND ProductTypeID ${operator} ${value}`;
                }

                // Construct request data for dbo.p_getsearchResult
                const requestData = {
                    TableID: "ProductID", // As requested by user
                    AdvFilterString: "",
                    WhereStmt: whereStmt,
                    PrevOrNext: false, // Bit
                    RefID: "",
                    OperatorID: "CSADM", // Should ideally be dynamic
                    ModuleID: 20, // Example module ID
                    OurBranchID: "0101", // Should ideally be dynamic
                    SearchKey: "",
                    LanguageID: "EN"
                };

                console.log('Search Request:', requestData);

                // Call SearchService from parent window
                if (window.parent.SearchService) {
                    const response = await window.parent.SearchService.searchClients(requestData);

                    if (response.success && response.data) {
                        // Handle standard search result structure (usually array in data or Details)
                        const products = Array.isArray(response.data) ? response.data :
                            Array.isArray(response.data.Details) ? response.data.Details :
                                Array.isArray(response.data.Details01) ? response.data.Details01 :
                                    [response.data];

                        // Filter out empty/invalid rows if necessary
                        productSearchData = products.filter(p => p && (p.ProductID || p.productID));

                        if (productSearchData.length === 0) {
                            throw new Error('No products found matching the criteria');
                        }

                        currentPage = 1;
                        totalPages = Math.ceil(productSearchData.length / pageSize);
                        selectedProduct = null;
                        elements.btnSelect.disabled = true;

                        displayProductResults();
                    } else {
                        throw new Error(response.message || 'No products found');
                    }
                } else {
                    // Fallback to ProductSBCACSService if SearchService missing (previous logic as backup, though SearchService preferred)
                    console.warn('SearchService not found, checking ProductSBCACSService...');
                    throw new Error('SearchService not available in parent window');
                }
            } catch (error) {
                console.error('Error searching products:', error);
                elements.searchResults.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-results" style="color: #ef4444;">
                            <i class="bi bi-exclamation-triangle"></i> ${error.message || 'Error searching products'}
                        </td>
                    </tr>
                `;
            }
        }

        // Display results with pagination
        function displayProductResults() {
            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = startIdx + pageSize;
            const pageData = productSearchData.slice(startIdx, endIdx);

            if (pageData.length === 0) {
                elements.searchResults.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-results">
                            <i class="bi bi-inbox"></i> No products found
                        </td>
                    </tr>
                `;
                updatePaginationButtons();
                return;
            }

            elements.searchResults.innerHTML = pageData.map((product, idx) => `
                <tr data-product-id="${product.ProductID || product.productID}" data-product-type-id="${product.ProductTypeID || product.productTypeID}">
                    <td>${product.ProductID || product.productID || ''}</td>
                    <td>${product.Description || product.description || ''}</td>
                    <td>${product.ProductTypeID || product.productTypeID || ''}</td>
                    <td>${product.CurrencyID || product.currencyID || ''}</td>
                </tr>
            `).join('');

            // Add row click handlers
            elements.searchResults.querySelectorAll('tr').forEach(row => {
                row.addEventListener('click', () => selectRow(row));
                row.addEventListener('dblclick', () => {
                    selectRow(row);
                    selectProduct();
                });
            });

            updatePaginationButtons();
        }

        // Select a row
        function selectRow(row) {
            // Remove previous selection
            elements.searchResults.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');

            selectedProduct = {
                ProductID: row.dataset.productId,
                ProductTypeID: row.dataset.productTypeId
            };

            elements.btnSelect.disabled = false;
        }

        // Update pagination buttons
        function updatePaginationButtons() {
            elements.btnPrev.disabled = currentPage === 1;
            elements.btnNext.disabled = currentPage === totalPages;
            elements.pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
        }

        // Change page
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            }
            displayProductResults();
        }

        // Select product
        function selectProduct() {
            if (!selectedProduct) {
                alert('Please select a product');
                return;
            }

            // Send message to parent window
            window.parent.postMessage({
                type: 'PRODUCT_SELECTED',
                productId: selectedProduct.ProductID,
                productTypeId: selectedProduct.ProductTypeID
            }, '*');
        }

        // Clear search
        function clearSearch() {
            elements.productId.value = '';
            elements.description.value = '';
            elements.productType.value = '';
            elements.productIdOp.value = 'Like';
            elements.descOp.value = 'Like';
            elements.typeOp.value = 'Like';
            productSearchData = [];
            selectedProduct = null;
            currentPage = 1;
            totalPages = 1;
            elements.btnSelect.disabled = true;
            elements.searchResults.innerHTML = `
                <tr>
                    <td colspan="4" class="no-results">
                        <i class="bi bi-search"></i> Enter search criteria and click Search
                    </td>
                </tr>
            `;
            updatePaginationButtons();
        }

        // Attach event listeners
        elements.btnSearch.addEventListener('click', performProductSearch);
        elements.btnClear.addEventListener('click', clearSearch);
        elements.btnSelect.addEventListener('click', selectProduct);
        elements.btnPrev.addEventListener('click', () => changePage('prev'));
        elements.btnNext.addEventListener('click', () => changePage('next'));

        // Close button handler
        document.getElementById('btnClose').addEventListener('click', () => {
            // Send close message to parent or just close if within iframe
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_SEARCH' }, '*');
            }
        });

        // Search on Enter
        [elements.productId, elements.description, elements.productType].forEach(el => {
            el.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performProductSearch();
            });
        });

        // Initialize: Check for URL parameters and auto-fill productType
        (function initializeFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const productType = urlParams.get('productType');
            
            if (productType) {
                console.log('[ProductSearch] Auto-filling productType:', productType);
                elements.productType.value = productType;
                elements.typeOp.value = 'Exact'; // Use exact match for pre-filled filter
                
                // Auto-search if productType is provided
                setTimeout(() => {
                    performProductSearch();
                }, 100);
            }
        })();
    </script>
</body>

</html>
