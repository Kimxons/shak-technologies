<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub Group Search</title>
  <link rel="stylesheet" href="../search-styles.css" />
  <style>
    /* Base styles for standalone search dialog */
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 13px;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <!-- Header - Blue Gradient Bar -->
    <div class="search-header"></div>

    <!-- Criteria Section -->
    <div class="search-criteria">
      <div class="search-criteria-grid" id="subgroup-criteria">
        <div class="search-field-group">
          <label>Sub Group ID</label>
          <div class="input-row">
            <select data-search-mode="subGroupId">
              <option value="Like">Like</option>
              <option value="Exact">Exact</option>
            </select>
            <input type="text" data-search-field="subGroupId" data-search-column="SubGroupID" placeholder="Enter Sub Group ID" />
          </div>
        </div>
        <div class="search-field-group">
          <label>Description</label>
          <div class="input-row">
            <select data-search-mode="description">
              <option value="Like">Like</option>
              <option value="Exact">Exact</option>
            </select>
            <input type="text" data-search-field="description" data-search-column="Description" placeholder="Enter Description" />
          </div>
        </div>
      </div>
      <div class="search-actions">
        <button type="button" class="btn-search" id="subgroup-search-btn">Search</button>
      </div>
    </div>

    <!-- Results Section -->
    <div class="search-results-container">
      <div class="search-loading" id="subgroup-loading">Loading...</div>
      <div class="search-results" id="subgroup-results"></div>
      <div class="search-empty" id="subgroup-empty">No results found</div>
    </div>
  </div>

  <script src="../search-utils.js"></script>
  <script src="../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="subgroup-search-modal.js"></script>
</body>
</html>
