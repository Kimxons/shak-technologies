<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exited Client Search</title>
  <link rel="stylesheet" href="../search-styles.css" />
  <style>
    /* Base styles for standalone search dialog */
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 13px;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <!-- Header - Blue Gradient Bar -->
    <div class="search-header"></div>

    <!-- Criteria Section -->
    <div class="search-criteria">
      <div class="search-criteria-grid" id="exited-client-criteria">
        <div class="search-field-group">
          <label>Client ID</label>
          <div class="input-row">
            <select data-search-mode="clientId">
              <option value="Like">Like</option>
              <option value="Exact">Exact</option>
            </select>
            <input type="text" data-search-field="clientId" data-search-column="GroupExitedClientID" placeholder="Enter Client ID" />
          </div>
        </div>
        <div class="search-field-group">
          <label>Client Name</label>
          <div class="input-row">
            <select data-search-mode="clientName">
              <option value="Like">Like</option>
              <option value="Exact">Exact</option>
            </select>
            <input type="text" data-search-field="clientName" data-search-column="GroupExitedClientName" placeholder="Enter Client Name" />
          </div>
        </div>
      </div>
      <div class="search-actions">
        <button type="button" class="btn-search" id="exited-client-search-btn">Search</button>
      </div>
    </div>

    <!-- Results Section -->
    <div class="search-results-container">
      <div class="search-loading" id="exited-client-loading">Loading...</div>
      <div class="search-results" id="exited-client-results"></div>
      <div class="search-empty" id="exited-client-empty">No results found</div>
    </div>
  </div>

  <script src="../../../../assets/js/services/shared/serviceLoader.js"></script>
  <script src="group-exited-client-search.js"></script>
</body>
</html>
